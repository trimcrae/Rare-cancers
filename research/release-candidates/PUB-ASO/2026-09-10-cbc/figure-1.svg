<text x="260.5" y="257" font-size="12" fill="#111" text-anchor="middle">LNA wing</text>
<rect x="303" y="244" width="102" height="18" fill="#f6ae73" stroke="#37474f" stroke-width="0.7"/>
<text x="354.0" y="257" font-size="12" fill="#111" text-anchor="middle">DNA gap</text>
