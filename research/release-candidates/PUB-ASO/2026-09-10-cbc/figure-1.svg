<text x="447.5" y="257" font-size="12" fill="#111" text-anchor="middle">LNA wing</text>
<text x="218" y="280" font-size="12" fill="#333">reagent 5′-GGGCATATCATCAAAC-3′ (antisense), 8 donor and 8 acceptor bases either side of the seam</text>
<text x="32" y="306.0" font-size="11.5" fill="#666">Solid rule and its label, the donor-exon columns; dashed rule and its label, the NR4A3 acceptor-exon columns; the two meet at the breakpoint. Boxed, the one</text>
<text x="32" y="321.5" font-size="11.5" fill="#666">position at which the three donors differ; filled marker, a seam reported in patients at this exon, open marker, one that is not. Shaded box, the window this</text>
<text x="32" y="337.0" font-size="11.5" fill="#666">reagent targets. Every one of those cues is drawn, so the panel reads in greyscale; online, the same donor bases are blue, acceptor bases green and the</text>
<text x="32" y="352.5" font-size="11.5" fill="#666">boxed position purple.</text>
<text x="32" y="368.0" font-size="11.5" fill="#666">The reagent is 5′-GGGCATATCATCAAAC-3′, the reverse complement of the shaded window (5′-GTTTGATGATATGCCC-3′). Transcribing the shaded letters</text>
<text x="32" y="383.5" font-size="11.5" fill="#666">orders the sense strand, which is a different molecule with no antisense activity.</text>
<text x="32" y="399.0" font-size="11.5" fill="#666">Research use only, not for administration. The bases alone, ordered as unmodified DNA, are a different molecule; order from</text>
<text x="32" y="414.5" font-size="11.5" fill="#666">fusion-junction-aso-sequences.csv.</text>
