<text x="32" y="26" font-size="15" fill="#111" font-weight="600">One 16-mer spans three partners’ breakpoints — and only one of the three is a junction any patient is reported to carry</text>
<text x="32" y="42" font-size="12" fill="#555">The three FET-family donors are identical over the ten nucleotides before the breakpoint, and the acceptor exon is the same in all three. Every row</text>
<text x="32" y="58" font-size="12" fill="#555">is TARGET mRNA, sense; the reagent is the reverse complement of the shaded window.</text>
