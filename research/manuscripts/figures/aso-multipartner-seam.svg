<text x="447.5" y="212" font-size="9.5" fill="#ffffff" text-anchor="middle">LNA wing</text>
<text x="218" y="233" font-size="11" fill="#333">5′-GGGCATATCATCAAAC-3′ (antisense), 8 donor and 8 acceptor bases either side of the seam</text>
<text x="32" y="272" font-size="10.5" fill="#666">Blue, donor exon; green, NR4A3 acceptor exon; boxed and red, positions at which the three donors differ. Shaded box, the oligonucleotide’s target window.</text>
<text x="32" y="288" font-size="10.5" fill="#666">The same paralogy that lets one reagent cover three fusions is why these designs are hard to discriminate from the parent transcripts: this reagent’s gap-level</text>
<text x="32" y="302" font-size="10.5" fill="#666">margin is 3 junction-unique bases inside the six-nucleotide catalytic gap. Coverage is predicted from sequence and has not been measured.</text>
