<text x="32" y="282.0" font-size="11.5" fill="#666">Blue, donor exon; green, NR4A3 acceptor exon; boxed and purple, the one position at which the three donors differ. Shaded box, the window this reagent</text>
<text x="32" y="297.5" font-size="11.5" fill="#666">targets.</text>
<text x="32" y="313.0" font-size="11.5" fill="#666">The reagent is 5′-GGGCATATCATCAAAC-3′, the reverse complement of the shaded window (5′-GTTTGATGATATGCCC-3′). Transcribing the shaded letters</text>
<text x="32" y="328.5" font-size="11.5" fill="#666">orders the sense strand, which is a different molecule with no antisense activity.</text>
<text x="32" y="344.0" font-size="11.5" fill="#666">Research use only, not for administration. The bases alone, ordered as unmodified DNA, are a different molecule; order from</text>
<text x="32" y="359.5" font-size="11.5" fill="#666">fusion-junction-aso-sequences.csv.</text>
