<text x="475" y="394" font-size="12" fill="#333" text-anchor="middle">distinct oligonucleotides, ranked by observed load</text>
<text x="18" y="214" font-size="12" fill="#333" text-anchor="middle" transform="rotate(-90 18 214)">transcriptome matches at ≤1 mismatch</text>
<text x="78" y="410.0" font-size="10.5" fill="#666">The chance expectation assumes independent uniform bases; the transcriptome span it is computed over is the exhaustive scan's measured one. It separates "more</text>
<text x="78" y="423.6" font-size="10.5" fill="#666">than chance" from "at chance" and is not a significance test. 118 of 176 bars fall at or below that line.</text>
<text x="78" y="437.3" font-size="10.5" fill="#666">Counts are predictions from sequence search, not measured off-target activity. Bars are green at or below the line and red above it, which repeats each bar's own</text>
<text x="78" y="450.9" font-size="10.5" fill="#666">height and carries no information of its own. 58 of the 176 plotted designs sit above it; on the mean the set comes in at chance.</text>
<text x="78" y="464.6" font-size="10.5" fill="#666">Not plotted: 10 designs at 2 modelled breakpoints rather than real exon junctions; 4 of those sit above it, at 16–95 matches and 75.0–81.2% GC.</text>
