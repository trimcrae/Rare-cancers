<text x="78" y="24" font-size="15" fill="#111" font-weight="600">Transcriptome load per junction gapmer against chance expectation</text>
<text x="78" y="42" font-size="12" fill="#555">114 distinct oligonucleotides at real exon junctions, ranked; exact plus ≤1-mismatch matches over 186,185 transcripts.</text>
<polygon points="82.5,50 86.5,54 82.5,58 78.5,54" fill="#111"/>
<text x="92" y="58" font-size="12" fill="#555">77 of 114 fall at or below the chance upper bound. Marked: the 6 designs spanning [2, 3] partners’ seams — one molecule, plotted once, not [2, 3] times.</text>
<text x="475" y="394" font-size="12" fill="#333" text-anchor="middle">distinct oligonucleotides, ranked by observed load</text>
<text x="18" y="214" font-size="12" fill="#333" text-anchor="middle" transform="rotate(-90 18 214)">transcriptome matches at ≤1 mismatch</text>
<text x="78" y="414" font-size="10.5" fill="#666">Chance band assumes independent uniform bases over an assumed transcriptome span; it separates "more than chance" from "at chance" and is not a significance test.</text>
<text x="78" y="430" font-size="10.5" fill="#666">Counts are predictions from sequence search, not measured off-target activity. 37 of the 114 plotted designs exceed the band.</text>
<text x="78" y="446" font-size="10.5" fill="#666">Not plotted: 10 designs at 2 modelled breakpoints rather than real exon junctions; 4 of those exceed the band, at 16–95 matches and 75.0–81.2% GC.</text>
