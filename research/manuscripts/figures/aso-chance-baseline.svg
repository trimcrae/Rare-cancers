<text x="78" y="24" font-size="15" fill="#111" font-weight="600">Transcriptome load per junction gapmer against chance expectation</text>
<text x="78" y="42" font-size="12" fill="#555">176 distinct oligonucleotides at real exon junctions, ranked; exact plus ≤1-mismatch matches over 186,185 transcripts.</text>
<polygon points="82.5,50 86.5,54 82.5,58 78.5,54" fill="#111"/>
<text x="92" y="58" font-size="12" fill="#555">118 of 176 fall at or below it; the line is what chance alone predicts, not a ceiling. Marked: the 9 designs spanning two or three partners’</text>
<text x="92" y="73" font-size="12" fill="#555">seams: one molecule, plotted once.</text>
<text x="475" y="394" font-size="12" fill="#333" text-anchor="middle">distinct oligonucleotides, ranked by observed load</text>
<text x="18" y="222" font-size="12" fill="#333" text-anchor="middle" transform="rotate(-90 18 222)">transcriptome matches at ≤1 mismatch</text>
<text x="78" y="407.9" font-size="10.5" fill="#666">The chance expectation assumes independent uniform bases; the transcriptome span it is computed over is the exhaustive scan's measured one. It separates "more</text>
<text x="78" y="421.5" font-size="10.5" fill="#666">than chance" from "at chance" and is not a significance test.</text>
<text x="78" y="435.2" font-size="10.5" fill="#666">Counts are predictions from sequence search, not measured off-target activity. 58 of the 176 plotted designs sit above it; on the mean the set comes in at chance.</text>
<text x="78" y="448.8" font-size="10.5" fill="#666">Not plotted: 10 designs at 2 modelled breakpoints rather than real exon junctions; 4 of those sit above it, at 16–95 matches and 75.0–81.2% GC.</text>
