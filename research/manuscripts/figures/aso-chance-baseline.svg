<text x="78" y="400" font-size="10.5" fill="#666">Chance band assumes independent uniform bases over an assumed transcriptome span; it separates "more than chance" from "at chance" and is not a significance test.</text>
<text x="78" y="414" font-size="10.5" fill="#666">Counts are predictions from sequence search, not measured off-target activity. The red designs are GC-rich, low-complexity sequences at one modelled seam.</text>
