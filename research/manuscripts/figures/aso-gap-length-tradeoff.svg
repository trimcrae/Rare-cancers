<text x="40" y="383.5" font-size="11.5" fill="#666">The same three molecules' mature-parent duplex through the whole gap — the column the tables print — reads 8 bp (TFG) at 5-6-5, none at 5-8-5, none at</text>
<text x="40" y="399.0" font-size="11.5" fill="#666">5-10-5. It is a search over six wild-type parent transcripts, not this arithmetic, and on this molecule the two disagree.</text>
<text x="40" y="436.5" font-size="13" fill="#111" font-weight="600">B · every design in all three geometries, with no scatter to fit</text>
<text x="40" y="454.5" font-size="11.5" fill="#555">798 designs over 38 junctions. Both axes are drawn at 42 px per nucleotide, so the identity lines really are at 45 degrees.</text>
