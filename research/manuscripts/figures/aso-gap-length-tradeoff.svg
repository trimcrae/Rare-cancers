<text x="40" y="351.5" font-size="11.5" fill="#666">The same three molecules' mature-parent duplex through the whole gap — the column the tables print — reads 8 bp (TFG) at 5-6-5, none at 5-8-5, none at</text>
<text x="40" y="367.0" font-size="11.5" fill="#666">5-10-5. It is a search over six wild-type parent transcripts, not this arithmetic, and on this molecule the two disagree.</text>
