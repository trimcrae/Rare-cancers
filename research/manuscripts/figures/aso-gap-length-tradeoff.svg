<text x="40" y="26" font-size="15" fill="#111" font-weight="600">A longer catalytic gap buys junction-unique bases and concedes gap DNA at the design's own seam, one for one</text>
<text x="40" y="51.0" font-size="11.5" fill="#b71c1c">This ordinate is the design's own seam arithmetic, not the mature-parent search Tables 2, 3, 5 and 7 print under “longest parent duplex through the gap”.</text>
<text x="40" y="66.5" font-size="11.5" fill="#b71c1c">That search FALLS as the gap lengthens (181 of 190 at 5-6-5; 130 of 266 at 5-8-5; 87 of 342 at 5-10-5) and is FLAT at the 10-base-pair criterion (87 of 190</text>
<text x="40" y="82.0" font-size="11.5" fill="#b71c1c">at 5-6-5; 88 of 266 at 5-8-5; 87 of 342 at 5-10-5). Only the quantity drawn here rises.</text>
<text x="40" y="115.5" font-size="13" fill="#111" font-weight="600">A · the catalytic gap is tiled by the two counts</text>
<text x="40" y="133.5" font-size="11.5" fill="#555">The best-margin design at EWSR1 e12 :: NR4A3 e3, at each geometry. Wings fixed at five nucleotides, so only the gap changes.</text>
