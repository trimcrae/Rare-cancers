<text x="416" y="573.0" font-size="11.5" fill="#555">Marker area is the number of designs at that point and the label is that count; the three</text>
<text x="416" y="588.5" font-size="11.5" fill="#555">lines are drawn from the identity, not fitted.</text>
<text x="416" y="614.0" font-size="11.5" fill="#555">A geometry's ceiling on margin is half its gap rounded down; clearing it means a</text>
<text x="416" y="629.5" font-size="11.5" fill="#555">longer gap, and a longer gap raises the own-seam parent-paired run at every</text>
<text x="416" y="645.0" font-size="11.5" fill="#555">register.</text>
<text x="40" y="966.5" font-size="11.5" fill="#555">The identity holds for every design individually, not on average. A longer gap also buys a quieter transcriptome: over the 6 junctions every geometry was</text>
<text x="40" y="982.0" font-size="11.5" fill="#555">screened at, the median near-match count falls 86.5 to 15 to 0 across 5-6-5, 5-8-5, 5-10-5. Part of that fall is arithmetic — at a fixed absolute mismatch</text>
<text x="40" y="997.5" font-size="11.5" fill="#555">budget a longer probe cannot hit more loci than its own sub-windows — and this figure is what the rest of it costs.</text>
