<text x="356" y="539.0" font-size="11.5" fill="#555">Marker area is the number of designs at that point and the label is that count; the three lines are</text>
<text x="356" y="554.5" font-size="11.5" fill="#555">drawn from the identity, not fitted.</text>
<text x="356" y="580.0" font-size="11.5" fill="#555">A geometry's ceiling on margin is half its gap rounded down; clearing it means a longer gap, and</text>
<text x="356" y="595.5" font-size="11.5" fill="#555">a longer gap raises the own-seam parent-paired run at every register.</text>
<text x="356" y="621.0" font-size="11.5" fill="#555">The identity holds for every design individually, not on average. A longer gap also buys a quieter</text>
<text x="356" y="636.5" font-size="11.5" fill="#555">transcriptome: over the 6 junctions every geometry was screened at, the median near-match</text>
<text x="356" y="652.0" font-size="11.5" fill="#555">count falls 86.5 to 15 to 0 across 5-6-5, 5-8-5, 5-10-5. Part of that fall is arithmetic — at a fixed</text>
<text x="356" y="667.5" font-size="11.5" fill="#555">absolute mismatch budget a longer probe cannot hit more loci than its own sub-windows — and</text>
<text x="356" y="683.0" font-size="11.5" fill="#555">this figure is what the rest of it costs.</text>
