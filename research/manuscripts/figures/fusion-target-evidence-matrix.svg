<text x="30" y="426" font-size="11" fill="#5c6b7a">Array q-values: Benjamini–Hochberg over exact sample-label permutation p-values. The 3SEQ cohort (n = 4) carries no test.</text>
<text x="30" y="443" font-size="11" fill="#5c6b7a">The motif column is an exact-NBRE count against a dinucleotide-preserving null of the same window — sequence, never occupancy.</text>
<text x="30" y="460" font-size="11" fill="#5c6b7a">No cell asserts that the fusion binds or drives any gene: every axis is correlative, and no NR4A3-fusion cistrome has been reported.</text>
