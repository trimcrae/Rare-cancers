name: Build preprint (PDF + DOCX)

# Renders a manuscript from Markdown to submission-ready PDF + DOCX via pandoc, and bundles the
# prioritisation figure. Uploads the built files as a workflow artifact and publishes them to the
# `preprint-cache` branch. bioRxiv accepts PDF/DOCX; this is the "ready to submit" artifact.
# Internet-only (apt + figure fetch) -> runs on a GitHub-hosted runner.

on:
  workflow_dispatch:
    inputs:
      paper:
        description: "Manuscript basename under research/manuscripts/ (no .md)"
        required: false
        default: "emc-surface-target-landscape"

permissions:
  contents: write

concurrency:
  group: build-preprint-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    if: ${{ inputs.paper != 'emc-retained-review-20260918' }}
    runs-on: ubuntu-latest
    env:
      PAPER: ${{ inputs.paper }}
    steps:
      - uses: actions/checkout@v4

      - name: Install pandoc + a PDF engine
        run: |
          sudo apt-get update
          sudo apt-get install -y pandoc wkhtmltopdf

      - name: Assemble build dir + fetch figure
        run: |
          set -e
          paper="${PAPER:-emc-surface-target-landscape}"
          mkdir -p build
          # ⚠ RESOLVED BY SEARCH, not by a fixed directory. Manuscripts moved into per-route
          # subfolders on 2026-08-12, so the basename this workflow takes as input no longer sits
          # at research/manuscripts/ — a hard-coded path would fail every dispatch.
          src=$(find research/manuscripts -name "${paper}.md" -not -path "*/__pycache__/*" | head -1)
          [ -n "$src" ] || { echo "no manuscript named ${paper}.md under research/manuscripts/"; exit 1; }
          cp "$src" "build/${paper}.md"
          git fetch origin modalities-cache || true
          git show origin/modalities-cache:research/modalities/emc-surface-prioritization.png > build/emc-surface-prioritization.png 2>/dev/null || echo "figure not found (continuing without it)"

      - name: Render DOCX (always) and PDF (best-effort)
        working-directory: build
        run: |
          set -e
          paper="${PAPER:-emc-surface-target-landscape}"
          pandoc "${paper}.md" -o "${paper}.docx" --resource-path=.
          pandoc "${paper}.md" -o "${paper}.pdf" --pdf-engine=wkhtmltopdf --resource-path=. || echo "PDF render failed (DOCX still produced)"
          ls -la

      - name: Upload built preprint + figure as artifact
        uses: actions/upload-artifact@v4
        with:
          name: preprint-${{ github.run_id }}
          path: |
            build/*.docx
            build/*.pdf
            build/*.png
          if-no-files-found: warn
          retention-days: 30

      - name: Publish to preprint-cache branch
        if: always()
        run: |
          set -e
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          mkdir -p "$RUNNER_TEMP/pp"
          cp build/*.docx build/*.pdf build/*.png "$RUNNER_TEMP/pp/" 2>/dev/null || true
          git fetch origin preprint-cache || true
          if git show-ref --verify --quiet refs/remotes/origin/preprint-cache; then
            git checkout -B preprint-cache origin/preprint-cache
          else
            git checkout --orphan preprint-cache
            git rm -rf . >/dev/null 2>&1 || true
          fi
          mkdir -p preprints
          cp "$RUNNER_TEMP"/pp/* preprints/ 2>/dev/null || true
          git add preprints/ 2>/dev/null || true
          git commit -m "Built preprint (${PAPER:-emc-surface-target-landscape})" || { echo "no changes"; exit 0; }
          git push origin preprint-cache

  retained-review:
    if: ${{ inputs.paper == 'emc-retained-review-20260918' }}
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Check runner storage and permitted time before checkout
        run: |
          python3 - <<'PY'
          import shutil,datetime,zoneinfo
          hour=datetime.datetime.now(zoneinfo.ZoneInfo('America/New_York')).hour
          assert not 6 <= hour < 10, 'Device/render quiet hours'
          free=shutil.disk_usage('.').free
          print('runner_free_before_checkout_bytes',free)
          assert free >= 13*1024**3, 'Need 10GiB reserve plus 3GiB dependency/output allowance'
          PY
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            research/release-candidates/retained-20260918
            research/compute
            research/autonomy
          fetch-depth: 1
      - name: Install existing renderer family on the runner only
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq libreoffice-writer poppler-utils fonts-croscore fonts-liberation2 >/dev/null
          python3 -m pip install -q pypdf
      - name: Render exact accepted Word inputs with guards
        run: python3 research/release-candidates/retained-20260918/render_review.py
      - name: Preserve all page images as a bounded review artifact
        uses: actions/upload-artifact@v4
        with:
          name: retained-preprint-review-${{ github.run_id }}
          path: research/release-candidates/retained-20260918/rendered/
          if-no-files-found: error
          retention-days: 14
      - name: Publish PDF review copies and receipt to this draft branch
        env:
          REVIEW_BRANCH: ${{ github.ref_name }}
          PUBLISH_IF_CHANGED: '1'
          PUBLISH_FAIL_HARD: '1'
        run: |
          set -euo pipefail
          mapfile -t selected < <(find research/release-candidates/retained-20260918/rendered -type f \( -name '*.pdf' -o -name '*.json' -o -name '*.txt' \))
          bash research/compute/publish_artifacts.sh "$REVIEW_BRANCH" "Render accepted CSPG4 and ASO revision drafts for visual review" "${selected[@]}"
