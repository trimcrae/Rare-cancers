name: CSPG4 presubmission draft checks
on:
  workflow_dispatch:
    inputs:
      paper:
        description: Scoped draft operation
        required: true
        type: string
permissions:
  contents: read
concurrency:
  group: cspg4-presubmission-${{ github.ref }}-${{ inputs.paper }}
  cancel-in-progress: false
jobs:
  render:
    if: inputs.paper == 'emc-cspg4-render-20260921'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check runner storage and permitted time
        run: |
          python3 - <<'PY'
          import shutil,datetime,zoneinfo
          now=datetime.datetime.now(zoneinfo.ZoneInfo('America/New_York'))
          assert not 6<=now.hour<10
          free=shutil.disk_usage('.').free
          assert free>=13*1024**3
          print(now.isoformat(),free)
          PY
      - uses: actions/checkout@v4
        with:
          sparse-checkout: research/release-candidates/cspg4-presubmission-20260921
          fetch-depth: 1
      - name: Prepare established renderer
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq libreoffice-writer poppler-utils fonts-liberation >/dev/null
          python3 -m pip install --quiet pdf2image pypdf lxml Pillow
      - name: Render exact documents and verify text preservation
        run: python3 research/release-candidates/cspg4-presubmission-20260921/remote_render.py
      - uses: actions/upload-artifact@v4
        with:
          name: cspg4-presubmission-render-${{ github.run_id }}
          path: research/release-candidates/cspg4-presubmission-20260921/render-result/
          if-no-files-found: error
          retention-days: 30
  full-preflight:
    if: inputs.paper == 'emc-cspg4-full-20260921'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Check headroom and permitted time
        run: |
          python3 - <<'PY'
          import shutil,datetime,zoneinfo
          now=datetime.datetime.now(zoneinfo.ZoneInfo('America/New_York'))
          assert not 6<=now.hour<10
          assert shutil.disk_usage('.').free>=13*1024**3
          print(now.isoformat(),shutil.disk_usage('.').free)
          PY
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Prepare established gate environment
        run: |
          command -v uv >/dev/null 2>&1 || pip install -q uv
          ./scripts/dev-setup.sh --if-needed
          uv pip install --target "$RUNNER_TEMP/cspg4-schema-deps" 'jsonschema>=4.18' referencing
          export PYTHONPATH="$RUNNER_TEMP/cspg4-schema-deps${PYTHONPATH:+:$PYTHONPATH}"
          echo "PYTHONPATH=$PYTHONPATH" >> "$GITHUB_ENV"
          python3 -c 'from referencing import Registry; from jsonschema import Draft202012Validator; Draft202012Validator({},registry=Registry())'
      - name: Check the observed repository guards before FULL
        run: |
          mkdir -p /tmp/cspg4-full-check
          git rev-parse HEAD > /tmp/cspg4-full-check/candidate.txt
          set +e
          python3 systems/systems_check.py --check > /tmp/cspg4-full-check/systems.log 2>&1
          sysrc=$?
          pytest -q research/modalities/tests/test_lint_citations.py::test_the_ledger_does_not_anchor_itself research/modalities/tests/test_lint_citations.py::test_the_repository_currently_passes research/modalities/tests/test_no_hand_rolled_publish.py::test_a_registered_entry_cannot_outlive_the_defect_it_names --tb=short > /tmp/cspg4-full-check/observed-guards.log 2>&1
          guardrc=$?
          set -e
          echo "$sysrc" > /tmp/cspg4-full-check/systems-exit.txt
          echo "$guardrc" > /tmp/cspg4-full-check/observed-guards-exit.txt
          cat /tmp/cspg4-full-check/systems.log
          cat /tmp/cspg4-full-check/observed-guards.log
          test "$sysrc" = 0 && test "$guardrc" = 0
      - name: Run unscoped FULL preflight on exact candidate
        id: gate
        env:
          PREFLIGHT_FULL: '1'
        run: |
          mkdir -p /tmp/cspg4-full-check
          git rev-parse HEAD > /tmp/cspg4-full-check/candidate.txt
          set +e
          ./scripts/preflight.sh 2>&1 | tee /tmp/cspg4-full-check/preflight.log
          rc=${PIPESTATUS[0]}
          set -e
          echo "$rc" > /tmp/cspg4-full-check/exit-code.txt
          echo "EXIT=$rc" >> /tmp/cspg4-full-check/preflight.log
          echo "code=$rc" >> "$GITHUB_OUTPUT"
          df -B1 . > /tmp/cspg4-full-check/storage-after.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: cspg4-presubmission-full-${{ github.run_id }}
          path: /tmp/cspg4-full-check/
          if-no-files-found: error
          retention-days: 30
      - name: Preserve actual exit status
        if: always()
        run: test "${{ steps.gate.outputs.code }}" = 0
