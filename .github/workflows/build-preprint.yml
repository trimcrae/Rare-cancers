name: CSPG4 submitted preprint layout
on:
  workflow_dispatch:
    inputs:
      paper:
        description: Scoped manuscript layout check
        required: true
        type: string
permissions:
  contents: read
concurrency:
  group: cspg4-aixiv-submitted-render-${{ github.ref }}
  cancel-in-progress: false
jobs:
  render:
    if: inputs.paper == 'emc-cspg4-aixiv-submitted-render-20260923'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check storage and permitted time
        run: |
          python3 - <<'PY'
          import shutil,datetime,zoneinfo
          now=datetime.datetime.now(zoneinfo.ZoneInfo('America/New_York'))
          assert not 6<=now.hour<10
          assert shutil.disk_usage('.').free>=13*1024**3
          print(now.isoformat(),shutil.disk_usage('.').free)
          PY
      - uses: actions/checkout@v4
        with:
          sparse-checkout: research/release-candidates/cspg4-aixiv-submitted-20260923
          fetch-depth: 1
      - name: Prepare runner Python
        run: |
          python3 -m venv "$RUNNER_TEMP/cspg4-runner-venv"
          echo "$RUNNER_TEMP/cspg4-runner-venv/bin" >> "$GITHUB_PATH"
      - name: Prepare established renderer
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq libreoffice-writer poppler-utils fonts-liberation >/dev/null
          python3 -m pip install --quiet pdf2image pypdf lxml Pillow
      - name: Render policy-only manuscript and verify source text
        run: python3 research/release-candidates/cspg4-aixiv-submitted-20260923/remote_render.py
      - uses: actions/upload-artifact@v4
        with:
          name: cspg4-aixiv-submitted-render-${{ github.run_id }}
          path: research/release-candidates/cspg4-aixiv-submitted-20260923/render-result/
          if-no-files-found: error
          retention-days: 30
