name: Sensitivity control — do the co-folds reproduce the deposited ternaries? ($0 CPU)

# ═══════════════════════════════════════════════════════════════════════════════════════════════════════════
# THE CHECK THE SENSITIVITY CONTROL WAS DESIGNED AROUND AND NEVER RAN
# ═══════════════════════════════════════════════════════════════════════════════════════════════════════════
# `selcal_panel.py` chose PRT3789 over the better-documented ACBI2 BECAUSE two deposited ternaries carry the
# same ligand on both arms — 9DTY (SMARCA2) and 9DTX (SMARCA4) — so, verbatim, "each arm's co-fold can be
# VALIDATED against a real structure of the very complex it models"; `selcal_stage`'s docstring repeats that
# the crystals are "used to VALIDATE the co-folds rather than to supply them". No such validation existed:
# `grep -rl DockQ` over the repo hits only the DeepTernary lane.
#
# It matters now because `selcal-verdict.json` returned NULL on an adequately-powered design and bounds
# itself between exactly two readings — "the readout is blunt" and "this pair is hard" — with no branch for
# "the co-fold was not the measured complex". This job supplies the observation that separates the third
# from the first two, and it costs nothing.
#
# ⚠ THE ANSWER IS PUBLISHED WHICHEVER WAY IT LANDS. Co-folds near the crystals make the null a DIAGNOSED
# negative; co-folds far from them mean E1 was never tested, which makes the instrument claim WEAKER. A
# result that can re-open a null is not a result that may be used to discard one.
#
# ⛔ NO GPU, NO RENTAL, NO VERDICT. It grades INPUTS. It re-scores no leg, moves no threshold and amends no
# preregistration; `selcal-verdict.json` remains the one home of the tier.
#
# PUSH-TRIGGERED as well as dispatchable, deliberately: a NEW workflow file on a feature branch cannot be
# reached by `workflow_dispatch` (dispatch resolves against the default branch), so the push trigger is what
# makes it runnable before any merge — the `deepternary-qualify.yml` pattern, CLAUDE.md §6.

on:
  workflow_dispatch:
    inputs:
      cofold_prefix:
        description: "S3 prefix holding the co-folds (default: the panel's frozen SELCAL_COFOLD_PREFIX)"
        required: false
        default: ""
      bucket:
        description: "S3 bucket"
        required: false
        default: "sagemaker-us-east-2-646605541856"
  push:
    branches: [claude/nr4a1-protac-positive-control-xnszjl]
    paths:
      - .github/workflows/selcal-cofold-validate.yml
      - research/modalities/selcal_cofold_validate.py
      - research/modalities/selcal_dockq_crosscheck.py
      - research/modalities/valb_frame_transfer_check.py
      - research/modalities/selcal_dockq_decoy_scale.py
      - research/modalities/selcal_xtal_stage.py
      - research/modalities/tests/test_selcal_xtal_stage.py
      - research/modalities/selcal_xtal_panel.py
      - research/modalities/selcal_cofold_decompose.py
      - research/modalities/selcal_interface_signature.py
      - research/modalities/nr4a_ternary_signature.py
      - research/modalities/tests/test_nr4a_ternary_signature.py
      - research/modalities/tests/test_selcal_interface_signature.py
      - research/modalities/tests/test_selcal_xtal_panel.py
      - research/modalities/structural_provenance_census.py
      - research/modalities/selcal_deepternary_controls.py
      - research/modalities/tests/test_selcal_cofold_validate.py
      - research/modalities/tests/test_selcal_dockq_crosscheck.py
      - research/modalities/tests/test_selcal_dockq_decoy_scale.py

permissions:
  contents: write

concurrency:
  group: selcal-cofold-validate
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      AWS_DEFAULT_REGION: us-east-2
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      BUCKET: ${{ github.event.inputs.bucket || 'sagemaker-us-east-2-646605541856' }}
      SELCAL_COFOLD_PREFIX: ${{ github.event.inputs.cofold_prefix }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }

      # numpy is needed ONLY by the imported E1 RMSD kernel (`nrv04_covalent_md._aligned_iface_rmsd`).
      # Parsing, chain mapping, alignment, interface selection and fnat are pure stdlib, which is why the
      # whole pipeline is exercisable offline and why the tests below run before anything is downloaded.
      # DockQ is the SECOND, INDEPENDENT instrument — the canonical PyPI implementation (Basu & Wallner),
      # sharing no code with this repo's validator, so it can contradict it.
      # gemmi + rdkit are needed ONLY by the crystal-control stager (chain surgery + the posed-ligand
      # kernel). Everything else in this job stays pure-stdlib + numpy.
      - run: python -m pip install -q numpy awscli pytest DockQ gemmi rdkit

      - name: The guards hold before anything is read
        run: |
          set -eo pipefail
          python3 -m pytest research/modalities/tests/test_selcal_cofold_validate.py \
                            research/modalities/tests/test_selcal_dockq_crosscheck.py \
                            research/modalities/tests/test_selcal_dockq_decoy_scale.py \
                            research/modalities/tests/test_selcal_xtal_stage.py \
                            research/modalities/tests/test_selcal_xtal_panel.py \
                            research/modalities/tests/test_selcal_interface_signature.py \
                            research/modalities/tests/test_nr4a_ternary_signature.py \
                            research/modalities/tests/test_selcal_panel.py -q

      - name: Resolve the prefix the panel actually froze
        id: prefix
        run: |
          set -eo pipefail
          P=$(python3 -c "import sys; sys.path.insert(0,'research/modalities'); import selcal_panel as P; print(P.COFOLD_PREFIX)")
          echo "prefix=$P" >> "$GITHUB_OUTPUT"
          echo "resolved co-fold prefix: $P"

      # Pull ONLY the model files. A co-fold directory also holds MSAs and per-seed scratch that this job has
      # no use for, and a narrow sync is the difference between seconds and a multi-GB download.
      - name: Sync the co-folds from S3 (models only)
        run: |
          set -eo pipefail
          mkdir -p /tmp/selcal_cofolds
          aws s3 sync "s3://$BUCKET/${{ steps.prefix.outputs.prefix }}/" /tmp/selcal_cofolds/ \
            --exclude "*" --include "*.cif" --only-show-errors
          echo "=== what landed ==="
          # `| head -N` under `set -e` + pipefail is a size-dependent step-killer: head closes the pipe, the
          # producer fails its write, and the step dies — but only once the output outgrows the 64 KB pipe
          # buffer. `awk 'NR<=N'` reads to EOF and prints the first N, so it cannot kill the producer, and
          # unlike `|| true` it does not swallow a real error. Enforced by test_workflows_parse.py.
          find /tmp/selcal_cofolds -name '*.cif' | sed 's|/tmp/selcal_cofolds/||' | sort | awk 'NR<=60'
          echo "n_cif=$(find /tmp/selcal_cofolds -name '*.cif' | wc -l)"

      # ⚠ A SYNC THAT RETURNED NOTHING IS A REFUSAL TO REPORT, NOT A PANEL THAT FAILED THE CHECK.
      # An absent reading is not a reading of absence (CLAUDE.md §4). The validator already renders this
      # correctly per (arm, seed); this step makes it loud in the run log too, and does NOT fail the job —
      # the artifact with its refusals is still the deliverable.
      - name: Say plainly if nothing was read
        run: |
          set -eo pipefail
          N=$(find /tmp/selcal_cofolds -name '*.cif' | wc -l)
          if [ "$N" -eq 0 ]; then
            echo "::warning::0 co-fold .cif files under s3://$BUCKET/${{ steps.prefix.outputs.prefix }}/ — every"
            echo "::warning::record will be a REFUSAL (unread), which is NOT evidence that the co-folds disagree"
            echo "::warning::with the crystals. Check the prefix before reading anything into the artifact."
          fi

      - name: Fetch the deposited ternaries and score every co-fold
        run: |
          set -eo pipefail
          python3 research/modalities/selcal_cofold_validate.py \
            --cofold-root /tmp/selcal_cofolds \
            --fetch \
            --out research/modalities/selcal-cofold-vs-crystal.json
          echo "=== artifact head ==="
          python3 -c "
          import json
          d = json.load(open('research/modalities/selcal-cofold-vs-crystal.json'))
          print('graded', d['n_graded'], 'refused', d['n_refused'])
          print(json.dumps(d['per_arm'], indent=1))
          print(json.dumps(d.get('native_provenance'), indent=1)[:800])
          "

      # ★ SECOND INSTRUMENT. The first one had three defects that each returned a plausible number rather
      # than an error before they were caught, so its fourth answer is cross-checked by a separate program
      # running a separate implementation. It pins the SAME copy of a multi-copy asymmetric unit via the
      # first instrument's derived chain map, so a disagreement can only mean the measurement differs — not
      # that the two scored different copies. Runs even if it fails: a DockQ that could not run is recorded
      # as a failure, never as a zero.
      - name: Cross-check with canonical DockQ (independent implementation)
        continue-on-error: true
        run: |
          set -eo pipefail
          python3 research/modalities/selcal_dockq_crosscheck.py \
            --cofold-root /tmp/selcal_cofolds \
            --native-dir /tmp/selcal_cofolds/_native \
            --out research/modalities/selcal-cofold-dockq.json
          python3 -c "
          import json
          d = json.load(open('research/modalities/selcal-cofold-dockq.json'))
          print('DockQ version:', d['dockq_version'])
          print('compared %d  agree %d  disagree %d  dockq-failed %d'
                % (d['n_compared'], d['n_agree'], d['n_disagree'], d['n_dockq_failed']))
          print(d['verdict']['sentence'])
          "

      # ★ THE ONE LANE THE PROVENANCE CENSUS FLAGGED AS CHECKABLE-BUT-UNCHECKED: valB's SMARCA2 arm is
      # SMARCA2 threaded into a 3.73 A SMARCA4 ternary frame, so its interface is inherited rather than
      # observed. Asked crystal-vs-crystal (9DTY vs 9DTX, the SAME degrader on both paralogues) so the
      # paralogue term is isolated and the staging pipeline is not introduced as a variable.
      - name: valB frame-transfer check + provenance census
        continue-on-error: true
        run: |
          set -eo pipefail
          python3 research/modalities/structural_provenance_census.py
          python3 research/modalities/valb_frame_transfer_check.py \
            --native-dir /tmp/selcal_cofolds/_native \
            --out research/modalities/valb-frame-transfer-check.json
          python3 -c "
          import json
          d = json.load(open('research/modalities/valb-frame-transfer-check.json'))
          print('graded:', d.get('graded'), d.get('why') or '')
          print(json.dumps(d.get('instruments', {}), indent=1))
          "

      # ★ WHAT DOES DockQ 0.03 ACTUALLY MEAN? The co-folds' 0.023-0.046 is a number, not yet a meaning, and
      # "below the Acceptable bar" says the pose is wrong without saying HOW wrong — which is the difference
      # between "nearly right but rotated" and "placed elsewhere". Calibrate the scale with the deposited
      # complex itself: hold VHL fixed, displace the TRUE target chain by a rigid motion of known RMSD, score
      # with the same DockQ against the same reference. Everything else about the structure is perfect, so
      # placement is the only variable.
      # ⚠ THIS IS THE NEGATIVE HALF OF A CONTROL. The positive half — does the harness register a CORRECT
      # ternary at all — is `selcal-deepternary-poscontrol.json`. A scorer that returned ~0 for everything
      # would produce this curve too, so neither is worth much alone.
      - name: Calibrate the DockQ scale with displaced-native decoys
        continue-on-error: true
        run: |
          set -eo pipefail
          python3 research/modalities/selcal_dockq_decoy_scale.py \
            --native-dir /tmp/selcal_cofolds/_native \
            --pdb 9DTY \
            --out research/modalities/selcal-dockq-decoy-scale.json

      # ★★ THE MD-FREE KNOWN-ANSWER TEST. The published mechanism for this pair is not a dynamical quantity:
      # Kofink et al. name a selectivity-inducing hydrogen bond from Gln1469 of SMARCA2BD to VCB. A bond
      # between two named partners is VISIBLE IN A DEPOSITED STRUCTURE, so "can a readout of this program's
      # kind see the paralogue difference?" can be asked of a static interface descriptor, on the two
      # crystals, for nothing — and the expected answer was published before this program existed.
      # ⛔ A pass validates THIS descriptor on ONE contact in ONE pair. It does not validate E1 and it makes
      # no NR4A3 prediction correct.
      - name: Static paralogue interface signature — the published contact, on both crystals ($0)
        continue-on-error: true
        run: |
          set -eo pipefail
          python3 research/modalities/selcal_interface_signature.py \
            --native-dir /tmp/selcal_cofolds/_native \
            --out research/modalities/selcal-interface-signature.json

      # ★ WHERE does the co-fold failure sit — the pockets, or the assembly of two correct halves? That
      # decides whether credible NR4A3 ternaries are obtainable from any route: an assembly-only failure names
      # the missing information (each end's site, which a ternary generator consumes and which reached DockQ
      # 0.839 on 9DTY today); a pocket failure means the thing to assemble is wrong and no NR4A3 ternary from
      # this route can be trusted whatever the readout does. Published whichever way it lands.
      - name: Decompose the co-fold failure — pocket placement vs assembly ($0)
        continue-on-error: true
        run: |
          set -eo pipefail
          python3 research/modalities/selcal_cofold_decompose.py \
            --cofold-root /tmp/selcal_cofolds \
            --native-dir /tmp/selcal_cofolds/_native \
            --out research/modalities/selcal-cofold-decompose.json

      # ★★ THE EXPERIMENT THE SELECTIVITY CLAIMS ACTUALLY NEED — census + stage, $0.
      # The sensitivity control returned NULL on structures that reproduce the target<->VHL interface at
      # DockQ 0.023-0.046, i.e. at the ~32 A rung of the decoy ladder above. So the endpoint was never put to
      # the test the null is read as. 9DTY and 9DTX ARE the two complexes whose selectivity was measured;
      # running the IDENTICAL endpoint on the crystals themselves asks the readout question with no predicted
      # coordinates anywhere in the chain.
      # This step only CENSUSES and STAGES (both free). It runs no MD and spends nothing. What it decides is
      # the design: the unit of independence is the crystallographic COPY, so the number of copies carrying a
      # bridging degrader sets the exact-permutation floor — and whether a powered design exists at all.
      - name: Crystal control — census the copies and stage the units ($0)
        continue-on-error: true
        run: |
          set -eo pipefail
          python3 research/modalities/selcal_xtal_stage.py \
            --native-dir /tmp/selcal_cofolds/_native \
            --stage-to /tmp/selcal_xtal_units \
            --out research/modalities/selcal-xtal-census.json
          # ⛔ AMENDMENT 1 (prereg): 9DTX's asymmetric unit holds a SINGLE ternary, so the matched design is
          # 1 copy per arm — reference set 2, minimum attainable p 0.5. The panel does not run, and the
          # three ways to make it run were each rejected on the record rather than quietly taken. This step
          # remains because the census is the evidence for that, and because a deposit can gain copies.
          echo "=== staged units ==="
          find /tmp/selcal_xtal_units -maxdepth 1 -mindepth 1 -type d | sort | awk 'NR<=30'

      # ★★ THE GOAL'S OWN QUESTION, asked only if the descriptor earned the right to be asked it. Sync this
      # program's NR4A1/2/3 ternaries and check whether the NR4A3 one presents a polar contact to the E3 that
      # BOTH the others lack. The module REFUSES before reading a structure unless the interface signature
      # above recovered the published SMARCA2 Gln1469 contact.
      # ⛔ The honest prior is negative: the paper's own section 2.5/2.7 records comparable confidence across
      # all three paralogues for the representative linker. A null here is the finding, not a failed run.
      - name: Does any NR4A3 ternary we hold discriminate? ($0, gated on the known answer)
        continue-on-error: true
        run: |
          set -eo pipefail
          mkdir -p /tmp/nr4a_ternary
          aws s3 sync "s3://$BUCKET/nr4a3-ternary/" /tmp/nr4a_ternary/ \
            --exclude "*" --include "*.cif" --only-show-errors || true
          echo "=== what landed ==="
          find /tmp/nr4a_ternary -name '*.cif' | sed 's|/tmp/nr4a_ternary/||' | sort | awk 'NR<=40'
          echo "n_cif=$(find /tmp/nr4a_ternary -name '*.cif' | wc -l)"
          python3 research/modalities/nr4a_ternary_signature.py \
            --root /tmp/nr4a_ternary --recursive \
            --pattern '*{p}*.cif' \
            --out research/modalities/nr4a-ternary-signature.json

      # ★ THE FIX EXPERIMENT, step 1: source non-native binary inputs so DeepTernary can be run on the same
      # two systems our co-folds scored 0.023-0.046 on. The exclusion-set check ran first
      # (deepternary-leakage-check.json: 9DTY/9DTX are post-horizon) and the module refuses to source
      # anything if that stops holding.
      # ⛔ THAT CHECK IS NECESSARY BUT NOT SUFFICIENT, and this comment said "BLIND" until DeepTernary's own
      # shipped data was read: its published unbound protocol superposes both binaries into the NATIVE
      # ternary frame and supplies the NATIVE degrader pose, so the arms are blind to the two proteins'
      # relative placement and NOT to which pocket each ligand end occupies. Measurement and consequences:
      # `selcal_deepternary_frame.py`; retraction: STRATEGY.md Appendix A row 65.
      - name: DeepTernary head-to-head — source the non-native binary inputs
        continue-on-error: true
        run: |
          set -eo pipefail
          python3 research/modalities/selcal_deepternary_controls.py \
            --out research/modalities/selcal-deepternary-controls.json

      - name: Publish the artifact
        if: ${{ always() }}
        env:
          # ★ AN EVENT PUBLISH, NOT A HEARTBEAT. This job records a measurement; it is not a lane tick whose
          # whole value is "I ran at this time", and it carries no staleness semantics that a timestamp feeds.
          # Per `publish_artifacts.sh`'s header, `--allow-empty` on an event step writes a commit ASSERTING
          # the check happened on a run where nothing was measured — indistinguishable in `git log` from the
          # real one. So: if nothing was staged, commit nothing.
          PUBLISH_IF_CHANGED: "1"
        run: |
          set -eo pipefail
          sudo chown -R "$(id -u):$(id -g)" research/modalities 2>/dev/null || true
          # One home for the publish — it stamps only what THIS run actually changed, so it cannot carry
          # another writer's artifact backwards. See its header and tests/test_publish_does_not_revert_*.py.
          bash research/compute/publish_artifacts.sh "${{ github.ref_name }}" \
            "selcal co-fold vs deposited ternary: input-quality check + DockQ cross-check (CI)" \
            research/modalities/selcal-cofold-vs-crystal.json \
            research/modalities/selcal-cofold-dockq.json \
            research/modalities/selcal-dockq-decoy-scale.json \
            research/modalities/selcal-xtal-census.json \
            research/modalities/selcal-cofold-decompose.json \
            research/modalities/selcal-interface-signature.json \
            research/modalities/nr4a-ternary-signature.json \
            research/modalities/valb-frame-transfer-check.json \
            research/modalities/structural-provenance-census.json \
            research/modalities/deepternary-leakage-check.json \
            research/modalities/selcal-deepternary-controls.json
