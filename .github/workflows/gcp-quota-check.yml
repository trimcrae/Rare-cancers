name: GCP quota check (L4 / G2, us-central1)

# Read-only: prints the project's L4-GPU + G2-CPU quotas (limit vs usage) for us-central1 so we know exactly what
# on-demand vs spot capacity we're allowed, and whether billing is enabled. Touches nothing.

on:
  workflow_dispatch: {}

permissions:
  id-token: write
  contents: read

jobs:
  quota:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Auth to GCP (WIF)
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: projects/878095411563/locations/global/workloadIdentityPools/github-pool/providers/github-provider
          service_account: gpu-runner@project-a7ebde30-e2ed-4b8d-9a9.iam.gserviceaccount.com
      - uses: google-github-actions/setup-gcloud@v2
      - name: GCS write probe — can gpu-runner@ create objects under the cache prefixes?
        # WHY: the CPU setup-primer's whole purpose is to write the OpenFE setup cache, and on 2026-07-25 it could
        # not — gpu-runner@ got 403 storage.objects.create on valB-6hax/setupcache/ while succeeding on
        # valB-6hax/stagecache/ in the same job. gcloud reports that denial as GcsApiError('') with an EMPTY
        # message, so it had been mislabelled "transient" and retried 8 times, and the real cause only showed in
        # the python client's error. This probe answers "can we create here?" in ~5 s per prefix instead of
        # inferring it from a 30-minute build that fails at the very last step. It writes a tiny uniquely-named
        # object and deletes it, so it never collides with a real cache (two writers on one cache key could
        # otherwise interleave files from builds with different solvation and leave a torn cache).
        run: |
          set +e
          PROJECT=project-a7ebde30-e2ed-4b8d-9a9
          BUCKET="$PROJECT-rbfe-ckpt"
          echo "probe object: iam-probe-$GITHUB_RUN_ID.txt"
          echo "probe $GITHUB_RUN_ID" > /tmp/iam-probe.txt
          FAIL=0
          for PREFIX in valB-6hax/setupcache valB-6hax/stagecache valB-6hax/results valB-6hax/commits; do
            URI="gs://$BUCKET/$PREFIX/iam-probe-$GITHUB_RUN_ID.txt"
            OUT=$(gcloud storage cp /tmp/iam-probe.txt "$URI" 2>&1)
            if [ $? -eq 0 ]; then
              echo "  CREATE ok    $PREFIX/"
              gcloud storage rm "$URI" >/dev/null 2>&1 \
                && echo "  DELETE ok    $PREFIX/ (probe cleaned up)" \
                || echo "  ::warning:: DELETE denied $PREFIX/ — probe object left behind, remove it by hand"
            else
              FAIL=1
              echo "  CREATE DENIED $PREFIX/"
              # gcloud hides a 403 behind GcsApiError(''); name it so nobody calls it transient again.
              printf '%s\n' "$OUT" | grep -qiE "403|forbidden|does not have storage" \
                && echo "    -> explicit 403/forbidden in the gcloud output" \
                || echo "    -> gcloud gave an OPAQUE error (likely GcsApiError('') = a hidden 403). Raw: $(printf '%s' "$OUT" | tr '\n' ' ' | cut -c1-200)"
            fi
          done
          echo
          # SURFACE THE VERDICT WHERE IT CAN BE READ WITHOUT THE LOG. Every verdict this lane produces today is
          # buried in a log that must be fetched and tail-windowed to find, which has cost real time and led to
          # at least one wrong conclusion. A ::notice::/::error:: annotation is retrievable from the check-runs
          # API, and a non-zero exit puts the answer in the STEP CONCLUSION — so "did IAM get fixed?" is one
          # cheap status call, not a log excavation.
          if [ "$FAIL" = 0 ]; then
            echo "::notice title=IAM-PROBE PASS::gpu-runner@ can create objects under every prefix the lane needs (setupcache, stagecache, results, commits) — the CPU setup-primer can now cache, so new legs no longer pay GPU-idle setup."
            echo "VERDICT: PASS — all prefixes writable."
          else
            echo "::error title=IAM-PROBE FAIL::At least one prefix is still NOT writable by gpu-runner@ (see CREATE DENIED lines). The CPU primer will keep failing there. Grant roles/storage.objectAdmin (or objectCreator) on gs://$BUCKET."
            echo "VERDICT: FAIL — see CREATE DENIED above."
            exit 1
          fi
      - name: Print L4/G2 quotas + billing
        run: |
          set +e
          PROJECT=project-a7ebde30-e2ed-4b8d-9a9
          gcloud config set project "$PROJECT" 2>/dev/null
          echo "=== project (name | id) ==="
          gcloud projects describe "$PROJECT" --format="value(name,projectId)" 2>/dev/null || echo "(no projects.get perm)"
          echo "=== billing (enabled | account) ==="
          gcloud beta billing projects describe "$PROJECT" --format="value(billingEnabled,billingAccountName)" 2>/dev/null || echo "(no billing perm — check console)"
          echo "=== GLOBAL project GPU quotas (project-info; GPUS_ALL_REGIONS = the TOTAL concurrent-GPU cap across ALL regions/types — the binding limit that can sit BELOW a per-type regional quota) ==="
          gcloud compute project-info describe --project="$PROJECT" --flatten="quotas[]" \
            --format="value(quotas.metric, quotas.limit, quotas.usage)" 2>/tmp/gerr \
            | grep -iE "GPU" | sort || { echo "project-info failed:"; cat /tmp/gerr; }
          echo "=== full us-central1 GPU/G2 quota rows (metric limit usage) ==="
          gcloud compute regions describe us-central1 --flatten="quotas[]" \
            --format="value(quotas.metric, quotas.limit, quotas.usage)" 2>/tmp/qerr \
            | grep -iE "L4|G2|GPU" | sort || { echo "describe failed:"; cat /tmp/qerr; }
          # ---------------------------------------------------------------------------------------------
          # WHICH GPU TYPES ARE WE ALREADY ENTITLED TO? A DIFFERENT QUESTION FROM "how many".
          # GPUS_ALL_REGIONS caps the COUNT (1, permanently — repeated increase requests refused for a small
          # account). It says nothing about the TYPE. Each family has its own separate quota, so if any of them is
          # already NON-ZERO we can run a faster card inside the same budget of one GPU, with no request to file
          # and nobody's permission needed. The L4 this lane uses is a modest card (~300 GB/s, ~30 TFLOPS FP32)
          # and OpenMM on a 142k-particle system is bandwidth-bound, which is why a Vast 4090 runs the same leg
          # ~3.5x faster. An A100 (~1.5-2 TB/s) would be a large step up IF the quota is already there.
          # So: print EVERY GPU row across all four us-central1 zones and the global table, non-zero first.
          # Checking what we already hold costs one dispatch; asking for something we already have costs credibility.
          echo "=== EVERY GPU quota row, us-central1 (type | limit | usage) — NON-ZERO LIMITS ARE USABLE TODAY ==="
          ALLQ=$(gcloud compute regions describe us-central1 --flatten="quotas[]" \
                   --format="value(quotas.metric, quotas.limit, quotas.usage)" 2>/dev/null)
          NONZERO=$(printf '%s\n' "$ALLQ" | grep -iE "GPU" | awk '$2+0 > 0' | sort)
          printf '%s\n' "${NONZERO:-  (no GPU metric in us-central1 has a non-zero limit)}"
          echo "--- GPU rows sitting at ZERO (would each need their own quota request) ---"
          printf '%s\n' "$ALLQ" | grep -iE "GPU" | awk '$2+0 == 0 {print "  " $1}' | sort | head -20
          echo "=== [GPU-TYPE SUMMARY] what we could run TODAY inside the 1-GPU cap ==="
          printf '%s\n' "${NONZERO:-none}" | awk '{printf "  USABLE NOW: %s (limit %s, usage %s)\n", $1, $2, $3}' 
          echo "=== [QUOTA-SUMMARY] (the ones that matter for on-demand L4) ==="
          Q=$(gcloud compute regions describe us-central1 --flatten="quotas[]" \
                --format="value(quotas.metric, quotas.limit, quotas.usage)" 2>/dev/null)
          for M in NVIDIA_L4_GPUS PREEMPTIBLE_NVIDIA_L4_GPUS G2_CPUS PREEMPTIBLE_G2_CPUS; do
            LINE=$(printf '%s\n' "$Q" | awk -v m="$M" '$1==m {print "limit="$2" usage="$3}')
            echo "  ${M}: ${LINE:-NOT PRESENT}"
          done

      # ------------------------------------------------------------------------------------------------
      # READ-ONLY: did the 2 fs valB baseline carry pre-equilibration?
      #
      # WHY. RUNG 2b compares a 4 fs ternary edge against the 2 fs r0 baseline. The 4 fs arm NECESSARILY
      # carries pre-equilibration (4 fs only held with it), but `use_preequil` was never verified for the
      # 2 fs baseline -- only the workflow DEFAULT of 0 is recorded, which is not evidence about what ran.
      # If the baseline had no pre-equilibration then the two arms differ in TWO variables, and a
      # disagreement cannot be attributed to the timestep. That would make tonight's stage-2 verdict
      # uninterpretable in the NO-GO direction, so it is worth one `ls` to settle.
      #
      # The setup-cache key carries a version suffix (`v2pe` = pre-equilibrated), so the presence or
      # absence of that suffix on the calib entries IS the observation. Purely `gcloud storage ls` --
      # no writes, no dispatch, nothing that can perturb the leg a concurrent session is running.
      - name: Setup-cache provenance — was the 2 fs baseline pre-equilibrated?
        if: ${{ always() }}
        run: |
          set +e
          # Derived exactly as the IAM probe above does -- not grepped out of this file, and NOT guessed.
          PROJECT=project-a7ebde30-e2ed-4b8d-9a9
          BUCKET="$PROJECT-rbfe-ckpt"
          echo "=== setupcache entries (read-only) ==="
          LIST=$(gcloud storage ls "gs://$BUCKET/valB-6hax/setupcache/**" 2>&1 | head -100)
          echo "$LIST"
          # Count CACHE KEYS, not files. Each key is a directory holding ~5 objects, so counting lines
          # counts objects and reports a meaningless "mixed" whenever more than one version exists.
          CALIB=$(echo "$LIST" | grep -i calib | sed -E 's#(.*/setupcache/[^/]+)/.*#\1#' | sort -u)
          echo "=== calib cache KEYS ==="
          echo "${CALIB:-(none)}"
          PE=$(echo "$CALIB" | grep -c 'pe$')
          NOPE=$(echo "$CALIB" | grep -vc 'pe$')
          echo "calib cache keys pre-equilibrated (…pe): $PE ; raw: $NOPE"
          # ⚠ PRESENCE IS NOT THE DISCRIMINATOR, and this step must not be read as if it were. Several
          # versions legitimately coexist (v1, v1pe, v2pe all exist for the fwd leg), so which one a given
          # leg RESTORED is not decidable from a listing. The decisive field is the leg's own recorded
          # `setup_cache_version`, and its physical fingerprint is the PARTICLE COUNT:
          #     v2pe (alchemy from the plain-MD-relaxed complex) = 141,968 particles
          #     v1   (raw)                                       = 146,020 particles
          # Settled for r0 on 2026-07-25: the committed forward .nc holds 141,968 particles, so the 2 fs
          # baseline is v2pe -- pre-equilibrated. See ternary_fep_reduce._SYSTEM_IDENTITY_FIELDS.
          if [ -z "$CALIB" ]; then
            echo "::warning title=PREEQUIL PROVENANCE UNKNOWN::No calib setup-cache entries listed — the 2 fs baseline's use_preequil remains UNVERIFIED. A 4fs-vs-2fs disagreement must NOT be attributed to the timestep."
          elif [ "$PE" -gt 0 ] && [ "$NOPE" -eq 0 ]; then
            echo "::notice title=PREEQUIL CONFIRMED::Every calib setup-cache entry carries the v2pe suffix — the 2 fs baseline WAS pre-equilibrated, so the 4fs/2fs comparison differs in the timestep alone and a disagreement IS attributable to it."
          elif [ "$PE" -eq 0 ]; then
            echo "::error title=PREEQUIL ABSENT::No calib entry carries v2pe — the 2 fs baseline was NOT pre-equilibrated, so the 4 fs and 2 fs arms differ in TWO variables. Agreement still authorises adoption; a DISAGREEMENT is a NO-GO that must NOT be attributed to the timestep."
          else
            echo "::warning title=PREEQUIL MIXED::calib setup-cache entries are mixed ($PE with v2pe, $NOPE without) — determine which one r0 actually restored before reading the 2b verdict."
          fi
          exit 0

      - name: Validate --max-run-duration=144000s is ACCEPTED for a STANDARD VM (cheap, non-GPU)
        # WHY THIS RUNS AT ALL. The on-demand max-run cap in gpu-ternary-fep-gcp.yml was raised 72000s -> 144000s
        # (20 h -> 40 h) so the running rev leg hits ONE VM boundary instead of two. That value has never been
        # sent to GCP's validator. If GCP rejects it, the create fails, and the failure lands at the moment the
        # current VM expires — unattended, with the watchdog's only recourse being to retry the same rejected
        # request until it burns the per-day relaunch cap. A leg 14 h in would sit dead.
        #
        # So validate it BEFORE it matters, and validate it the only way that actually proves anything: send the
        # real flag combination to the real API. `gcloud compute instances create` has no --dry-run, and reading
        # the docs would be an assumption, not a measurement. An e2-micro exercises the identical scheduling
        # validation path (--max-run-duration + --instance-termination-action are scheduling fields, independent of
        # machine type or accelerator) for ~$0.0002 and, crucially, WITHOUT touching the single-L4 GPU quota — so
        # this cannot compete with or disturb the running leg.
        #
        # Named distinctly (maxrun-probe-*, not gcp-ternary-*) on purpose: every watchdog, reaper and progress
        # census in this repo filters on `name~'^gcp-ternary-'`, so this probe is invisible to them and cannot be
        # mistaken for the leg's VM or reaped as a zombie mid-check.
        run: |
          set +e
          PROJECT=project-a7ebde30-e2ed-4b8d-9a9
          VM="maxrun-probe-$GITHUB_RUN_ID"
          ZONE=us-central1-c
          # LARGEST-FIRST. 144000s (40 h) is already known good, but a FULL ternary leg is ~2800 iterations at
          # ~56.5 s/iter = ~44 h of MD, so 40 h does not span a fresh leg and one boundary is structural. Since
          # max-run-duration cannot be raised on a running instance (facts §3b), the only place to fix that is at
          # CREATE — so find the largest value GCP will actually take rather than assuming 7 days is allowed.
          for D in 604800s 259200s 144000s 72000s; do
            echo "=== attempting create with --max-run-duration=$D (STANDARD, termination-action=DELETE) ==="
            gcloud compute instances create "$VM" --project="$PROJECT" --zone="$ZONE" \
              --machine-type=e2-micro \
              --provisioning-model=STANDARD --instance-termination-action=DELETE \
              --max-run-duration="$D" --no-restart-on-failure \
              --image-family=debian-12 --image-project=debian-cloud --boot-disk-size=10GB 2>/tmp/err
            RC=$?
            if [ "$RC" = 0 ]; then
              echo "::notice title=MAXRUN LARGEST ACCEPTED::--max-run-duration=$D is ACCEPTED at CREATE for a STANDARD VM. This is the LARGEST of the tried values that GCP takes, so it is the cap a fresh ~44 h leg should be created with. Current setting in gpu-ternary-fep-gcp.yml is 144000s (40 h) — raise it to $D if larger."
              gcloud compute instances delete "$VM" --project="$PROJECT" --zone="$ZONE" --quiet 2>&1 | tail -1
              echo "probe VM deleted"
              exit 0
            fi
            echo "--- create FAILED with $D ---"
            grep -iE "ERROR|invalid|exceed|maximum|duration|must be|quota" /tmp/err | head -5
            # a quota/capacity failure says nothing about the FLAG, so do not read it as a rejection
            if grep -qiE "quota|exhausted|ZONE_RESOURCE" /tmp/err; then
              echo "::warning title=MAXRUN INCONCLUSIVE::the create failed on quota/capacity, not on the duration flag — this probe proved nothing about $D. Re-run it later."
              exit 0
            fi
          done
          echo "::error title=MAXRUN PROBE FAILED BOTH WAYS::neither 144000s nor 72000s created an e2-micro, and not for quota reasons — the probe itself is wrong (bad flags/permissions), so it says nothing about the ternary lane's cap. See the errors above."
          exit 1

      - name: Can a RUNNING VM's max-run-duration be EXTENDED in place? (decoy first, never the real leg)
        # WHY THIS MATTERS NOW. On GCP the credits are free and expiring, so the binding constraint is not money —
        # it is `GPUS_ALL_REGIONS = 1` and therefore WALL CLOCK. A VM boundary costs 2-4 h of dead time, because
        # recovery depends on the watchdog cron and GitHub delivers this repo's crons at ~2-4 h intervals whatever
        # the expression says. Extending a running VM's cap in place would remove a boundary outright.
        #
        # I declined to try this earlier for a good reason: a botched scheduling update could TERMINATE the VM and
        # cost the very boundary it was meant to save. That reasoning has not changed — which is why this probes a
        # DECOY e2-micro and never touches a gcp-ternary-* instance. If the operation is rejected, or is accepted
        # but stops the decoy, we learn that for ~$0.0002 instead of on a leg carrying 18 h of committed sampling.
        #
        # Named maxrun-ext-* so every watchdog/reaper filter (`name~'^gcp-ternary-'`) still cannot see it.
        run: |
          set +e
          PROJECT=project-a7ebde30-e2ed-4b8d-9a9
          VM="maxrun-ext-$GITHUB_RUN_ID"
          ZONE=us-central1-c
          echo "=== create a decoy with a SHORT cap (7200s) ==="
          gcloud compute instances create "$VM" --project="$PROJECT" --zone="$ZONE" \
            --machine-type=e2-micro \
            --provisioning-model=STANDARD --instance-termination-action=DELETE \
            --max-run-duration=7200s --no-restart-on-failure \
            --image-family=debian-12 --image-project=debian-cloud --boot-disk-size=10GB 2>/tmp/cerr
          if [ $? -ne 0 ]; then
            echo "::warning title=EXT PROBE INCONCLUSIVE::could not create the decoy, so nothing was learned:"
            grep -iE "ERROR|quota|exhausted" /tmp/cerr | head -3
            exit 0
          fi
          BEFORE=$(gcloud compute instances describe "$VM" --zone="$ZONE" --format="value(scheduling.maxRunDuration.seconds,status)" 2>/dev/null)
          echo "before: $BEFORE"
          echo "=== attempt to EXTEND to 259200s (72 h) on the RUNNING instance ==="
          gcloud compute instances set-scheduling "$VM" --project="$PROJECT" --zone="$ZONE" \
            --max-run-duration=259200s 2>/tmp/eerr
          RC=$?
          AFTER=$(gcloud compute instances describe "$VM" --zone="$ZONE" --format="value(scheduling.maxRunDuration.seconds,status)" 2>/dev/null)
          echo "after:  $AFTER  (set-scheduling rc=$RC)"
          [ "$RC" != 0 ] && { echo "--- set-scheduling error ---"; head -5 /tmp/eerr; }
          STATUS_AFTER=$(printf '%s' "$AFTER" | awk '{print $2}')
          DUR_AFTER=$(printf '%s' "$AFTER" | awk '{print $1}')
          if [ "$RC" = 0 ] && [ "$DUR_AFTER" = "259200" ] && [ "$STATUS_AFTER" = "RUNNING" ]; then
            echo "::notice title=EXT PROBE OK::a RUNNING VM's max-run-duration CAN be extended in place (7200s -> 259200s, still RUNNING). Safe to apply to the live ternary leg to remove its VM boundary."
          elif [ "$RC" = 0 ] && [ "$STATUS_AFTER" != "RUNNING" ]; then
            echo "::error title=EXT PROBE DANGEROUS::set-scheduling succeeded but the instance is now '$STATUS_AFTER', not RUNNING. DO NOT apply this to a live leg — it would kill it."
          else
            echo "::warning title=EXT PROBE REFUSED::a RUNNING VM's max-run-duration cannot be extended in place (rc=$RC, duration now '$DUR_AFTER'). The boundary is unavoidable; plan around it instead."
          fi
          gcloud compute instances delete "$VM" --project="$PROJECT" --zone="$ZONE" --quiet 2>&1 | tail -1
          echo "decoy deleted"
          exit 0
