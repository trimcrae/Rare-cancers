name: Ternary system census ($0, CPU — do the 2 fs and 4 fs legs run the SAME system?)

# WHY. RUNG 2b's gate reads "4 fs reproduces 2 fs to |Δ| = 0.0215 kcal/mol", and that sentence is only a
# TIMESTEP result if everything except the timestep is held fixed. It is not obviously held fixed: the
# committed ternary trajectories carry different `atom` dimensions — 7,388 for the r0 fwd/rev pair, 7,398 and
# 7,392 for the dt4.0 prefixes (measured, GH run 30312683166, mode=provenance). A bare integer cannot say
# whether that is bulk water or a different solute, and the difference between those two readings is the
# difference between a gate that stands and a gate that does not.
#
# This workflow settles it from the artifacts: it pulls ONE committed simulation.nc at a time — from S3 for the
# Vast lane that actually produced the 4 fs cycle, and from GCS for the GCP lane that produced r0 — runs
# ternary_system_census.py on it inside the PRE-BAKED parity image, deletes it, and repeats. The per-file
# download/delete loop is not fastidiousness: each ternary .nc is ~2 GB and a runner cannot hold four.
#
# $0 by construction: ubuntu-latest, no GPU, no VM, no Vast rental, read-only object-store access.

on:
  workflow_dispatch:
    inputs:
      sources:
        description: "which object stores to census: both | s3 | gcs"
        default: "both"
        required: false
      max_per_source:
        description: "cap on trajectories censused per store (disk guard; each ternary .nc is ~2 GB)"
        default: "4"
        required: false

permissions:
  id-token: write
  contents: read

concurrency:
  group: ternary-system-census
  cancel-in-progress: false

jobs:
  census:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      AWS_DEFAULT_REGION: us-east-2
      CENSUS_DIR: /tmp/census
    steps:
      - uses: actions/checkout@v4
        with: { ref: "${{ github.ref_name }}" }
      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }

      - name: Pure-logic tests (the classifier and the verdict, no .nc needed)
        run: python research/modalities/tests/test_ternary_system_census.py

      - name: Reclaim runner disk (each ternary trajectory is ~2 GB)
        run: |
          set +e
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/share/boost
          df -h / | tail -1
          mkdir -p "$CENSUS_DIR"

      - name: Log in to Docker Hub for the parity image
        # Logging in even though the image is public: anonymous Hub pulls from GitHub runners share an IP and
        # get rate-limited. And it MUST be this image, not an ad-hoc solve — openmmtools stores each end state
        # as a serialized class reference and OpenFE's alchemical state is one of them, so the deserialization
        # this census depends on needs openfe importable at the SAME version that produced the trajectory.
        run: echo "${{ secrets.DOCKERHUB_TOKEN }}" | docker login -u triskit23 --password-stdin

      - name: Pre-pull the image
        run: docker pull docker.io/triskit23/ternary-fep:latest >/dev/null && echo "image ready"

      - name: Authenticate to GCP (keyless, WIF)
        if: ${{ github.event.inputs.sources != 's3' }}
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: projects/878095411563/locations/global/workloadIdentityPools/github-pool/providers/github-provider
          service_account: gpu-runner@project-a7ebde30-e2ed-4b8d-9a9.iam.gserviceaccount.com
      - name: Set up gcloud
        if: ${{ github.event.inputs.sources != 's3' }}
        uses: google-github-actions/setup-gcloud@v2

      - name: Census every committed TERNARY trajectory, one at a time
        run: |
          set -eo pipefail
          SRC="${{ github.event.inputs.sources }}"; SRC="${SRC:-both}"
          CAP="${{ github.event.inputs.max_per_source }}"; CAP="${CAP:-4}"
          IMG=docker.io/triskit23/ternary-fep:latest
          mkdir -p /tmp/one "$CENSUS_DIR"

          # `awk NR<=N`, NEVER `head -N`, on anything downstream of a listing. `head` closes the pipe, the
          # producer dies on the write, and pipefail + `set -e` turn a diagnostic into a dead step. That is
          # SIZE-DEPENDENT, so it lies dormant until the listing outgrows the 64 KB pipe buffer — it killed
          # mode=converge (GH run 30202753766) and then mode=provenance (GH run 30312344869) in this repo.
          run_one () {   # $1 = label, $2 = remote simulation.nc, $3 = s3|gcs
            rm -rf /tmp/one; mkdir -p /tmp/one
            echo "--- $1"
            if [ "$3" = s3 ]; then
              aws s3 cp "$2" /tmp/one/simulation.nc --only-show-errors || { echo "  (download failed)"; return 0; }
            else
              gcloud storage cp "$2" /tmp/one/simulation.nc 2>&1 | tail -1 || { echo "  (download failed)"; return 0; }
            fi
            ls -la /tmp/one/simulation.nc || return 0
            docker run --rm --entrypoint python \
              -v "$PWD/research/modalities:/work/research/modalities" \
              -v /tmp/one:/tmp/one -v "$CENSUS_DIR:/tmp/census" \
              -w /work/research/modalities \
              "$IMG" /work/research/modalities/ternary_system_census.py \
              --nc /tmp/one/simulation.nc --label "$1" --out-dir /tmp/census 2>&1 | grep -av "^Warning:" || true
            sudo chown -R "$(id -u):$(id -g)" "$CENSUS_DIR" 2>/dev/null || true
            rm -rf /tmp/one
            df -h / | tail -1
          }

          if [ "$SRC" != gcs ]; then
            echo "===== S3 (Vast lane — the store the RUNG 2b 4 fs cycle actually wrote to) ====="
            aws s3 ls --recursive "s3://sagemaker-us-east-2-646605541856/ternary-vast/commits/" \
              | awk '{print $4}' | grep -aE 'simulation\.nc$' > /tmp/s3.txt || true
            echo "objects: $(wc -l < /tmp/s3.txt)"
            grep -a 'ternary_vhl' /tmp/s3.txt \
              | sed -E 's#/(warmup|production)/iter-[0-9]+/simulation\.nc$##' | sort -u > /tmp/s3pfx.txt || true
            echo "--- ternary commit prefixes in S3 ---"; cat /tmp/s3pfx.txt
            i=0
            while read -r PFX; do
              [ -n "$PFX" ] || continue
              i=$((i+1)); [ "$i" -le "$CAP" ] || { echo "(cap $CAP reached)"; break; }
              NEW=$(grep -a "^$PFX/" /tmp/s3.txt \
                    | awk -F'iter-' '{printf "%d\t%s\n", (NF>1?$NF+0:0), $0}' | sort -k1,1rn | awk 'NR==1' | cut -f2)
              [ -n "$NEW" ] || continue
              run_one "S3::$(basename "$PFX")" "s3://sagemaker-us-east-2-646605541856/$NEW" s3
            done < /tmp/s3pfx.txt
          fi

          if [ "$SRC" != s3 ]; then
            echo "===== GCS (GCP lane — the store r0's 2 fs reference cycle wrote to) ====="
            BUCKET=project-a7ebde30-e2ed-4b8d-9a9-rbfe-ckpt
            gcloud storage ls --recursive "gs://$BUCKET/valB-6hax/commits/" 2>/dev/null \
              | grep -aE 'simulation\.nc$' > /tmp/gcs.txt || true
            echo "objects: $(wc -l < /tmp/gcs.txt)"
            grep -a 'ternary_vhl' /tmp/gcs.txt \
              | sed -E 's#/(warmup|production)/iter-[0-9]+/simulation\.nc$##' | sort -u > /tmp/gcspfx.txt || true
            echo "--- ternary commit prefixes in GCS ---"; cat /tmp/gcspfx.txt
            i=0
            while read -r PFX; do
              [ -n "$PFX" ] || continue
              i=$((i+1)); [ "$i" -le "$CAP" ] || { echo "(cap $CAP reached)"; break; }
              NEW=$(grep -a "^$PFX/" /tmp/gcs.txt \
                    | awk -F'iter-' '{printf "%d\t%s\n", (NF>1?$NF+0:0), $0}' | sort -k1,1rn | awk 'NR==1' | cut -f2)
              [ -n "$NEW" ] || continue
              run_one "GCS::$(basename "$PFX")" "$NEW" gcs
            done < /tmp/gcspfx.txt
          fi

      - name: Cross-leg verdict LAST — is the 4 fs-vs-2 fs comparison a timestep comparison?
        run: |
          set +e
          docker run --rm --entrypoint python \
            -v "$PWD/research/modalities:/work/research/modalities" \
            -v "$CENSUS_DIR:/tmp/census" -w /work/research/modalities \
            docker.io/triskit23/ternary-fep:latest \
            /work/research/modalities/ternary_system_census.py --compare --out-dir /tmp/census 2>&1 \
            | grep -av "^Warning:"
          sudo chown -R "$(id -u):$(id -g)" "$CENSUS_DIR" 2>/dev/null || true

      - name: Upload the census records
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ternary-system-census
          path: /tmp/census/*.json
          if-no-files-found: warn
