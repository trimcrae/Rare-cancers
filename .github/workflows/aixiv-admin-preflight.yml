name: Ordinary preflight for aiXiv administrative evidence
on:
  push:
    branches: ['codex/ci-stage/emc-aixiv-admin-check-20260907']
permissions:
  contents: read
jobs:
  preflight:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 029f6e12600b5a561c47beb5074b7d4d66467c37
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: scripts/dev-setup.sh
      - name: Install existing runtime dependencies
        run: |
          set -euo pipefail
          if ! command -v jq >/dev/null 2>&1; then sudo apt-get update && sudo apt-get install --yes jq; fi
          python3 -m pip install --quiet --disable-pip-version-check uv
          ./scripts/dev-setup.sh --if-needed
      - name: Run ordinary unmodified preflight only
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = 029f6e12600b5a561c47beb5074b7d4d66467c37
          log="$RUNNER_TEMP/preflight-normal.log"
          printf 'PINNED_SHA=%s\nACTUAL_SHA=%s\nTIER=ordinary-admin-preflight\n' 029f6e12600b5a561c47beb5074b7d4d66467c37 "$(git rev-parse HEAD)" > "$log"
          unset PREFLIGHT_FULL PREFLIGHT_TESTS PREFLIGHT_MODALITIES PREFLIGHT_PAPER SKIP_TESTS
          set +e
          ./scripts/preflight.sh 2>&1 | tee -a "$log"
          statuses=("${PIPESTATUS[@]}")
          set -e
          rc="${statuses[0]}"
          printf '\nEXIT=%s\n' "$rc" | tee -a "$log"
          if [ "${statuses[1]}" -ne 0 ]; then exit "${statuses[1]}"; fi
          exit "$rc"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: aixiv-admin-preflight-${{ github.run_id }}
          path: ${{ runner.temp }}/preflight-normal.log
          if-no-files-found: error
