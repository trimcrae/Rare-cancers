name: Diagnose administrative systems view check
on:
  push:
    branches: ['codex/ci-stage/emc-aixiv-admin-check-20260907']
permissions:
  contents: read
jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: b79420b77d284e9eb50ba9962cff325b8533f0f4
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: scripts/dev-setup.sh
      - name: Same runtime dependencies as normal gate
        run: |
          python3 -m pip install --quiet --disable-pip-version-check uv
          ./scripts/dev-setup.sh --if-needed
      - name: Exact failed check only
        run: |
          set +e
          python3 systems/systems_check.py --check > "$RUNNER_TEMP/systems-check.log" 2>&1
          rc=$?
          cat "$RUNNER_TEMP/systems-check.log"
          printf '\nEXIT=%s\n' "$rc" >> "$RUNNER_TEMP/systems-check.log"
          exit "$rc"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: systems-check-${{ github.run_id }}
          path: ${{ runner.temp }}/systems-check.log
