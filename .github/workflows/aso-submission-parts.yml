name: ASO submission parts (.docx via LibreOffice)

# ⛔ WHY THIS EXISTS: LIBREOFFICE IS PRESENT IN THE DEV SANDBOX AND DOES NOT WORK THERE.
# `build_submission_parts.py` and `build_submission_docx.py` shell out to `soffice` to produce the
# journal's required double-spaced .docx files.
#
# ⛔⛔ THE DIAGNOSIS BELOW WAS WRONG AND IS CORRECTED HERE (2026-08-30). The sandbox ships
# `libreoffice-core` WITHOUT `libreoffice-writer`, so there is no HTML import filter and no Writer
# export filter; `apt-get install -y libreoffice-writer` makes `build_submission_docx.py` succeed
# first try. `scripts/dev-setup.sh` now installs it and probes for the filter registry rather than
# for `soffice` on PATH. ⚠ The error message is what made this expensive: "source file could not be
# loaded" points at the INPUT, and `soffice --version` answering normally reads like a working
# install, so three sessions re-examined the HTML instead of the package list. The builder's own
# docstring named the requirement — "REQUIRES LibreOffice WITH THE WRITER FILTERS (`soffice` plus
# `libreoffice-writer`)" — and nothing probed for it.
# ⚠ SUPERSEDED, RETAINED (rule 1.2): "Measured 2026-08-27 in the sandbox: `soffice` and `java` are
# both installed, and every invocation — including `--convert-to docx` on a three-line HTML file,
# with and without `--infilter`, `SAL_USE_VCLPLUGIN=svp`, `SAL_DISABLE_JAVALDX=1` and a cleared
# `JAVA_TOOL_OPTIONS` — fails with 'Error: source file could not be loaded'. The install is broken
# rather than absent, which is why this looked for a while like a bad input." Every OBSERVATION in
# that paragraph is accurate; only the conclusion drawn from it was wrong.
#
# ★ THIS WORKFLOW STAYS, AND IS NOT MADE REDUNDANT. A session whose GitHub token lacks
# `actions:write` cannot dispatch it, and a session that cannot `apt-get` cannot fix the sandbox —
# measured this session: the dispatch API returned 403 "Resource not accessible by integration",
# and the local install was the only route left. Keeping both means neither failure blocks the
# rebuild on its own.
#
# ⚠ THE COST IT REMOVES IS RECURRING, NOT ONE-OFF. These parts are derived from the manuscript, so
# EVERY prose edit to the ASO article re-stales all three and turns the trunk red on
# `test_no_submission_part_is_stale_against_its_manuscript` and `test_the_word_file_is_not_stale`.
# Before this workflow the only remedy was a human with a working LibreOffice.
#
# ★ It writes to `main` on purpose. CLAUDE.md §7 makes branch drift a data-loss bug, and a rebuilt
# deposit artifact sitting on a branch nobody reads is exactly that: the staleness guards read the
# trunk, so a rebuild that lands anywhere else fixes nothing.

on:
  workflow_dispatch:
    inputs:
      reason:
        description: "Why this run — recorded in the commit message"
        required: false
        default: "rebuild the ASO submission parts after a manuscript edit"

permissions:
  contents: write

concurrency:
  group: aso-submission-parts
  cancel-in-progress: false   # ⛔ never cancel a run that may be mid-commit to main

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Install LibreOffice
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq libreoffice-writer >/dev/null
          soffice --version

      - name: Prove the converter works BEFORE trusting a green build
        # ⛔ A POSITIVE CONTROL, BECAUSE THIS IS THE EXACT TOOL THAT FAILS SILENTLY-ISH ELSEWHERE.
        # Without it, a runner whose LibreOffice is also broken would reach the build step, raise
        # SystemExit, and be read as "the manuscript is malformed" rather than "the tool is dead".
        run: |
          set -euo pipefail
          tmp=$(mktemp -d)
          printf '<html><body><p>control</p></body></html>' > "$tmp/control.html"
          HOME="$tmp" soffice --headless --norestore \
            -env:UserInstallation="file://$tmp/profile" \
            --infilter="HTML (StarWriter)" --convert-to "docx:MS Word 2007 XML" \
            --outdir "$tmp" "$tmp/control.html"
          test -f "$tmp/control.docx" || { echo "⛔ LibreOffice cannot convert on this runner either"; exit 1; }
          echo "positive control: LibreOffice converted a trivial file"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install the gates' dependencies
        run: ./scripts/dev-setup.sh --if-needed || pip install -q pypdf pdfminer.six jsonschema

      - name: Rebuild the parts and the Word file
        run: |
          set -euo pipefail
          python3 research/manuscripts/build_submission_parts.py
          python3 research/manuscripts/build_submission_docx.py

      # ⛔ THE MANIFEST IS NOT RE-DERIVED HERE, AND THAT ABSENCE IS THE FIX.
      # It used to be regenerated at this point and again inside the publish primitive's
      # `PUBLISH_REGEN`. Both ran against a tree holding the freshly rebuilt .docx files
      # UNCOMMITTED, so `aso_archive_manifest.py` recorded
      # `git_tree_is_clean_apart_from_this_manifest: false` — its own statement that the hashes
      # describe content that is in no commit. `--check-archive` REFUSES that flag, so the run
      # that rebuilt the parts correctly left the trunk red on the generated-artifact gate.
      # ⚠ MEASURED 2026-08-28: run on eeb5ab8, whose manifest carries `false` and names a35ebec.
      # The regen now happens in a SECOND publish pass below, after the .docx commit has landed.

      - name: Prove the staleness guards are actually satisfied
        # ⛔ NAME THE TWO FILES, NEVER THE DIRECTORY. `-k` DESELECTS BUT DOES NOT PREVENT IMPORT:
        # pytest collects every module under the path it is given first, and only then applies the
        # filter. This step installs pytest and nothing else, so pointing it at the whole tests/
        # directory imports modules needing scipy, pdfminer and Bio, and the run dies with
        # "1 error during collection" having deselected all 1437 tests it never needed.
        # ⚠ MEASURED 2026-08-28 (run 33203189924), and the failure was WORSE THAN A RED BUILD: the
        # parts and the manifest had ALREADY been rebuilt successfully by the two steps above, and
        # this step's exit 2 skipped "Commit to main" — so the workflow did its whole job, threw the
        # result away, and reported failure. The trunk stayed stale on exactly the three guards this
        # workflow exists to satisfy. Reproduced on a bare pytest venv against BOTH this commit's
        # tree and its parent, so it is latent, not caused by the manuscript edit that dispatched it.
        run: |
          set -euo pipefail
          pip install -q pytest
          python3 -m pytest -q \
            research/manuscripts/tests/test_the_submission_uploads_are_individual_files.py \
            research/manuscripts/tests/test_the_word_manuscript_is_current_and_whole.py \
            -k "submission_part_is_stale or word_file_is_not_stale" 2>&1 | tail -5

      - name: Commit to main
        # ⛔ GOES THROUGH THE ONE PRIMITIVE (research/compute/publish_artifacts.sh), NOT A HAND-ROLLED
        # `git pull --rebase` + retry loop. That shape has silently failed to publish on three separate
        # lanes (GCP, selcal, step-1): one conflict leaves the repo MID-REBASE, every retry then dies on
        # the wreckage of the first, and the step reports SUCCESS — see test_no_hand_rolled_publish.py.
        # The primitive rewrites onto upstream instead, so a conflict is unrepresentable.
        # `PUBLISH_IF_CHANGED=1` because this is an EVENT publish (a rebuild), not a heartbeat tick — an
        # `--allow-empty` commit here would assert a rebuild happened when the parts were already current.
        # ⛔ NO `PUBLISH_REGEN` HERE, DELIBERATELY — IT USED TO BE AND THAT WAS THE DEFECT. The regen
        # ran after the primitive's reset onto upstream's tip, which is the right place to avoid naming
        # an orphaned revision, and the wrong place to take hashes: the rebuilt .docx are staged and
        # UNCOMMITTED at that moment, so the manifest recorded a dirty tree and `--check-archive`
        # refused it. The manifest is re-derived in the second publish pass below instead, which still
        # runs after a reset onto upstream and additionally sees the .docx COMMITTED.
        env:
          REASON: ${{ inputs.reason }}
          PUBLISH_IF_CHANGED: "1"
          PUBLISH_FAIL_HARD: "1"
        run: |
          set -euo pipefail
          # ⚠ The message is built in a file rather than inline: a multi-line -m argument inside a
          # `run: |` block puts its continuation lines at column 0, which ends the YAML block scalar
          # and makes the workflow unparseable (measured — the same trap bit an earlier heredoc version
          # of this exact step). And `${{ inputs.reason }}` is never interpolated directly into the
          # script: a workflow_dispatch input substituted straight into a `run:` block is a
          # script-injection vector, so REASON reaches this step via `env:` instead (matching
          # aso-offtarget.yml's convention).
          {
            echo "ASO submission parts rebuilt on a runner (CI)"
            echo
            echo "$REASON"
            echo
            echo "LibreOffice does not work in the dev sandbox: soffice is installed and every"
            echo "invocation fails with 'source file could not be loaded', including on a trivial"
            echo "control file. These three .docx artifacts are derived from the manuscript, so any"
            echo "prose edit re-stales them and reds the trunk. Rebuilt here, where the converter"
            echo "passed a positive control before the build ran."
          } > /tmp/aso-parts-msg.txt
          bash research/compute/publish_artifacts.sh main "$(cat /tmp/aso-parts-msg.txt)" \
            research/manuscripts/aso

      - name: Re-derive the archive manifest against the committed tree
        # ⛔ A SECOND PUBLISH PASS, AND IT MUST BE SECOND — THE ORDERING IS THE WHOLE CONTENT OF
        # THE FIELD IT FIXES. `aso_archive_manifest.py` hashes the WORKING TREE and records whether
        # that tree was clean. In the pass above, the primitive resets onto upstream, restores the
        # rebuilt .docx as STAGED-BUT-UNCOMMITTED files, and only then commits — so a regen running
        # inside that pass is structurally incapable of seeing a clean tree, whatever it is ordered
        # after. One commit cannot contain a hash of itself.
        # ★ HERE the primitive's `git reset --hard FETCH_HEAD` lands on the commit the pass above
        # just pushed, with the new .docx COMMITTED and no snapshot paths to restore. `PUBLISH_REGEN`
        # then hashes a clean tree, writes `git_tree_is_clean_apart_from_this_manifest: true`, and
        # records a `git_revision` that is the .docx commit — a revision a reader can check out and
        # verify every hash against. This is the ordering `--check-archive`'s own remedy text
        # prescribes: commit every other change FIRST, regenerate the manifest LAST.
        # ⚠ PATHS ARE DELIBERATELY EMPTY. `publish_artifacts.sh` supports regen-only (it refuses
        # only when BOTH the path list and PUBLISH_REGEN are empty), and passing the directory here
        # would re-stage a snapshot this pass did not write.
        # ⚠ The trunk is briefly STALE between the two commits — the .docx have moved and the
        # manifest has not. That window is seconds inside one job, and it is strictly better than
        # the previous steady state, which was a provenance REFUSAL that persisted until a human
        # or a later cycle noticed.
        env:
          PUBLISH_IF_CHANGED: "1"
          PUBLISH_FAIL_HARD: "1"
          PUBLISH_REGEN: "python3 research/manuscripts/aso_archive_manifest.py"
          PUBLISH_REGEN_ADD: "research/manuscripts/aso/fusion-junction-aso-archive-manifest.json"
        run: |
          set -euo pipefail
          {
            echo "re-derive the ASO archive manifest against the committed tree (CI)"
            echo
            echo "Second publish pass. The manifest hashes the working tree and records whether that"
            echo "tree was clean; the pass that commits the rebuilt .docx cannot offer it a clean one,"
            echo "because those files are staged and uncommitted at the moment the regen would run."
            echo "Running it here, after that commit has landed, is what makes"
            echo "git_tree_is_clean_apart_from_this_manifest true and makes the git_revision it names"
            echo "a commit whose contents a reader can verify the hashes against."
          } > /tmp/aso-manifest-msg.txt
          bash research/compute/publish_artifacts.sh main "$(cat /tmp/aso-manifest-msg.txt)"
