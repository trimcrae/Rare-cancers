# TASK-ONLY administrative replacement. Never merge this workflow to main.
name: ASO published archive notes correction
on:
  workflow_dispatch:
    inputs:
      mode:
        description: Inspect first; apply only the recorded same-record notes correction
        type: choice
        options: [inspect, apply, resume-owned-edit]
        default: inspect
      expected_sha:
        description: Exact reviewed administrative commit
        required: true
        type: string
      authority:
        description: Attribution to the existing archive standing grant
        required: true
        type: string
permissions:
  contents: read
concurrency:
  group: deposit-zenodo-aso
  cancel-in-progress: false
jobs:
  notes:
    if: github.ref == 'refs/heads/codex/aso-notes-20260927' && github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          persist-credentials: false
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /.github/aso-notes-repair-20260927/
            /research/autonomy/publication-authority.json
      - name: Focused behavioral checks
        shell: bash
        run: python3 -m unittest discover -s .github/aso-notes-repair-20260927 -p 'test_*.py' -v
      - name: Inspect or correct the existing record
        shell: bash
        env:
          ZENODO_TOKEN: ${{ secrets.ZENODO_TOKEN }}
          EXPECTED_SHA: ${{ inputs.expected_sha }}
          AUTHORITY_RECORD: ${{ inputs.authority }}
          MODE: ${{ inputs.mode }}
        run: python3 .github/aso-notes-repair-20260927/repair.py --mode "$MODE" --out "$RUNNER_TEMP/aso-notes-receipts" | tee notes.log
      - name: Preserve every request intent, response and outcome
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: aso-notes-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            notes.log
            ${{ runner.temp }}/aso-notes-receipts/
          if-no-files-found: error
