name: STEP 1 fan-out — progress check + terminus-gated fan-out

# WHAT THIS IS FOR, in one sentence: it makes "fan out the moment the terminus is proven" a MACHINE condition
# instead of an agent remembering to come back.
#
# THE SHAPE OF THE RUN AND WHY IT NEEDS THIS. CLAUDE.md's litmus test — "is there a result this shard could
# return that would make me NOT run the rest?" — answers NO for a congeneric map, so serialising the 19 edges
# buys no decision value and parallel costs the same GPU-dollars. But wave 1 left an asymmetry the litmus test
# does not cover: it proved the lane SAMPLES (three hosts at 95-99 % GPU on the real cmpd19/NR4A3 system) and
# 0 of 19 units ever reached a ddG, so reduce -> commit -> upload has never once been observed. Fanning 19
# wide into an unproven terminus risks paying 19x for nothing.
#
# The resolution is not to pick one side. It is to run ONE deliberately-chosen unit (the most-advanced
# checkpoint, hence the cheapest proof of the terminus) and let a cron release the other eighteen the MINUTE
# its ddg.json lands. That is strictly more parallel than waiting for a human or an agent to notice, and
# strictly safer than launching early — which is exactly the combination the shakeout rule is asking for.
# The gate itself lives in congeneric_fanout_vast.mode_launch under FANOUT_REQUIRE_PROVEN_TERMINUS, so the
# condition is enforced by the launcher and not by this file's scheduling.
#
# EVERY TICK DOES TWO THINGS, IN THIS ORDER:
#   1. monitor — a PROGRESS check, not a liveness ping: the committed-iteration census per unit, diffed
#      against the previous tick, plus realised iterations/hour and the starved-host guard. Committed back to
#      the branch, because a CI job log is only readable from its tail and the tail is runner boilerplate.
#   2. launch  — gated. A no-op that prints "TERMINUS NOT YET PROVEN" until a ddg.json exists; the full
#      remaining tranche the moment one does. It is idempotent (a unit with a result, or with a live
#      instance, is never re-submitted), so a tick after the fan-out costs nothing.
#
# ⚠ A `schedule:` trigger only fires from the DEFAULT BRANCH, so this file is inert until merged to main.
# Until then, exercise it with workflow_dispatch — an on-main workflow dispatched with ref=<branch> runs THAT
# branch's version of the file and its code.
#
# ⚠ AND THE BRANCH THE FLEET RUNS IS NOT `github.ref_name`. A scheduled run's ref is the default branch, but
# each rented instance pulls `$GIT_BRANCH.tar.gz` for its code, so a schedule that passed its own ref would
# silently run main's code against a feature branch's checkpoints. `fleet_branch` is therefore an explicit
# input with an explicit default, and it is the ONLY thing that sets GIT_BRANCH.

on:
  schedule:
    - cron: "*/20 * * * *"   # GitHub throttles schedules on busy repos, so this really lands further apart.
                             # That is fine and is visible in the committed progress trail rather than
                             # assumed: a unit commits every 20 (warmup) or 40 (production) iterations, i.e.
                             # every ~5-9 minutes, so any real interval sees an unambiguous advance.
  workflow_dispatch:
    inputs:
      fleet_branch:
        description: "branch whose code the rented instances run (NOT the workflow's own ref)"
        default: "claude/max-effort-2dq11l"
      release_fanout:
        description: "1 = also attempt the terminus-gated fan-out; 0 = progress check only"
        default: "1"
      shakeout_unit:
        description: "unit the gate keeps alive (resumes) while the terminus is unproven; ignored once a ddg.json exists"
        default: "e_zaienne_cmpd19__cw_ev_5cooh__neutral__neutral_acid"

permissions:
  contents: write

concurrency:
  # One tick at a time. Two concurrent ticks could both pass the terminus gate and both submit the remaining
  # units — the launcher's own live-instance check narrows that window but does not close it, and two hosts
  # syncing one commit prefix is an interleaved trajectory that nothing reports.
  group: step1-fanout-autoscale
  cancel-in-progress: false

jobs:
  tick:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      VAST_API_KEY: ${{ secrets.VAST_API_KEY }}
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      # The credential a RENTED community host is given, forwarded in cleartext by _vast_onstart.
      # Scoped to the lane prefixes + six S3 actions a leg needs (s3_scoped_policy.py). Unset until
      # trimcrae creates the vast-leg-s3 user -> gpu_backend falls back to the broad key above, which
      # is why lanes in flight kept running. Runbook: research/compute/scoped-s3-credential-runbook.md
      VAST_S3_ACCESS_KEY_ID: ${{ secrets.VAST_S3_ACCESS_KEY_ID }}
      VAST_S3_SECRET_ACCESS_KEY: ${{ secrets.VAST_S3_SECRET_ACCESS_KEY }}
      VAST_S3_SCOPED_STS: ${{ vars.VAST_S3_SCOPED_STS }}
      AWS_DEFAULT_REGION: us-east-2
      VAST_CKPT_BUCKET: sagemaker-us-east-2-646605541856
      GIT_BRANCH: ${{ github.event.inputs.fleet_branch || 'claude/max-effort-2dq11l' }}
      FANOUT_WIDTH: "19"
    steps:
      - uses: actions/checkout@v4
        with:
          # Check out the FLEET's branch, not the schedule's. A scheduled run is on main; the lane's code,
          # its watch list and its committed progress trail all live on the feature branch.
          ref: ${{ github.event.inputs.fleet_branch || 'claude/max-effort-2dq11l' }}
      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }
      # pyyaml is NOT optional here. The gate below parses THIS workflow to prove `reap` is wired into
      # the launcher's mode table, and a missing parser makes the gate fail on its own dependency rather
      # than on the thing it guards — which on 2026-07-27 blocked every tick, so no readout committed and
      # the terminus release of the 18 held edges could never fire. It passed locally only because the dev
      # sandbox happens to have PyYAML.
      - run: pip install -q boto3 pytest pyyaml
      - name: Gate on the fan-out unit tests (a broken unit list must never reach a GPU)
        # test_assert_progress_fresh.py is here too: the freshness gate below is the thing standing between
        # "the tick went green" and "the fleet was actually measured", so a regression in IT must stop the
        # tick just as surely as a broken unit list must.
        run: python -m pytest research/modalities/tests/test_congeneric_fanout.py
             research/modalities/tests/test_assert_progress_fresh.py -q

      - name: Progress check
        working-directory: research/modalities
        env:
          MONITOR: "1"
        run: python congeneric_fanout_vast.py

      # ★★ THE TICK MUST PROVE IT RE-MEASURED (2026-07-27). Immediately after the progress check, so the
      # failure is attributed to the step that actually failed to produce evidence rather than to something
      # downstream. Rationale in full: research/modalities/assert_progress_fresh.py.
      #
      # The incident: 18 GPUs billing, the only readable progress artifact 45 minutes stale and carrying NO
      # generation timestamp, and a tick dispatched to refresh it reporting `success` in 36 seconds. Every
      # step had "succeeded" — so green meant "the plumbing did not throw", while the operator read it as
      # "the fleet was measured". Those two must mean the same thing or the readout is worthless.
      #
      # ⚠ NEVER "FIX" A RED HERE BY SKIPPING OR SOFTENING THE CHECK. A red means this tick did not refresh its
      # own evidence, which is precisely the condition that made 18 billing GPUs unprovable. Fix the writer.
      - name: Freshness gate — fail loudly if this tick did not actually re-measure
        working-directory: research/modalities
        run: python3 assert_progress_fresh.py step1-fanout-progress.json

      - name: Collect — assemble the map, reconcile realised spend, reap dead hosts
        # BEFORE the launch, so a unit that finished this tick frees its slot in the same pass.
        #
        # AND BECAUSE NOTHING ELSE DESTROYS AN INSTANCE. Vast teardown is two-layer and only the first layer
        # is automatic: the onstart EXIT trap + autoteardown halt the GPU meter on completion or crash
        # (key-free, because VAST_API_KEY must never sit on a community host), but DESTROYING the exited
        # instance is control-plane only and needs the key, which lives here. Without a scheduled collect a
        # finished fleet would sit exited — GPU meter off, so not the expensive failure, but still nineteen
        # undestroyed rentals holding disk and nothing assembling the result they produced.
        working-directory: research/modalities
        env:
          COLLECT: "1"
        run: python congeneric_fanout_vast.py

      - name: Terminus-gated fan-out
        if: ${{ github.event.inputs.release_fanout != '0' }}
        working-directory: research/modalities
        env:
          LAUNCH: "1"
          FANOUT_CONFIRM: "1"
          FANOUT_REQUIRE_PROVEN_TERMINUS: "1"
          # The unit the gate keeps ALIVE while it holds the other eighteen back. Without this the gate is a
          # deadlock: it would refuse to launch anything until a ddg.json exists, including the one unit whose
          # whole job is to produce that ddg.json — so a preemption (which happened at 4:31 PM ET on
          # 2026-07-26, with 260 iterations already banked) would leave the cron ticking all night launching
          # nothing. Once a ddg.json exists this value is ignored and the full remaining tranche goes out.
          FANOUT_SHAKEOUT_UNIT: ${{ github.event.inputs.shakeout_unit || 'e_zaienne_cmpd19__cw_ev_5cooh__neutral__neutral_acid' }}
        run: python congeneric_fanout_vast.py

      # ★ EVIDENCE, NOT SUMMARY. Everything above reports the launcher's own view of the terminus: map.json
      # says `n_complete: 0`, the launch readout says "TERMINUS NOT PROVEN". CLAUDE.md §4 asks for the
      # observation that DISCRIMINATES, and there is a specific thing to discriminate here — `ddg.json` has
      # one name whatever wrote it, and the reducer's record keys on (leg_id, seed), which a RBFE_TINY smoke
      # and a production leg SHARE. So a 12-iteration smoke ddG can sit on the exact key the release gate
      # watches. This step prints the raw object store and grades every ddg.json by ITERATION COUNT from the
      # spot commit store (smoke ceiling 4 iters vs a 2000-iter production leg), plus the $/ns board the
      # release would have to clear. It reads and rents NOTHING.
      #
      # LAST, and `always()`, on purpose: evidence must never be able to block the tick that does the work,
      # and it must still run when a step above failed — that is exactly when someone needs it.
      - name: Terminus evidence — raw S3 artifacts + iteration-count grading + market snapshot
        if: ${{ always() }}
        working-directory: research/modalities
        run: python step1_terminus_evidence.py

      - name: Commit the progress readout and any newly-armed watch entries
        if: ${{ always() }}
        run: |
          set -e
          git config user.name "Claude"
          git config user.email "noreply@anthropic.com"
          # ★ SAY WHERE THE READOUT LANDS, LOUDLY (2026-07-27). The tick's artifacts go to `fleet_branch`,
          # NEVER to the ref the workflow was dispatched on — both the checkout and GIT_BRANCH derive from
          # that input. Dispatching with ref=main therefore commits to the FEATURE branch, and an operator
          # who then reads origin/main sees an artifact that never moves and concludes the fleet is dead.
          # That happened at 9:37 AM ET with 18 GPUs billing. One echo removes the entire ambiguity.
          echo "::notice::Tick readout is being written to '$GIT_BRANCH' (the fleet_branch input) — NOT to the ref this run was dispatched on (${{ github.ref_name }}). Read origin/$GIT_BRANCH for the fresh progress artifact."
          # Added INDEPENDENTLY: `git add A B` fails atomically if either pathspec matches nothing, so one
          # absent file would stage neither and the step would report "nothing to commit" while swallowing it.
          staged=0
          for f in research/modalities/step1-fanout-progress.json \
                   research/modalities/step1-fanout-map.json \
                   research/modalities/step1-fanout-launch-readout.txt \
                   research/modalities/step1-fanout-market-hold.json \
                   research/modalities/step1-terminus-evidence.txt \
                   research/modalities/relaunch-market-hold.json \
                   research/modalities/vast-watch.json; do
            if [ -f "$f" ]; then git add -f "$f"; staged=1; fi
          done
          [ "$staged" = 1 ] || { echo "nothing to stage"; exit 0; }
          git diff --cached --quiet && { echo "no change"; exit 0; }
          git commit -m "step1 fan-out autoscale tick ($(date -u +%FT%TZ))"
          for i in 1 2 3 4; do
            git pull --rebase origin "$GIT_BRANCH" && git push origin "HEAD:$GIT_BRANCH" && exit 0
            sleep $((2**i))
          done
          echo "::warning::could not push the tick readout"
