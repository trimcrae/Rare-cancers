name: STEP 1 fan-out — progress check + terminus-gated fan-out

# WHAT THIS IS FOR, in one sentence: it makes "fan out the moment the terminus is proven" a MACHINE condition
# instead of an agent remembering to come back.
#
# THE SHAPE OF THE RUN AND WHY IT NEEDS THIS. CLAUDE.md's litmus test — "is there a result this shard could
# return that would make me NOT run the rest?" — answers NO for a congeneric map, so serialising the 19 edges
# buys no decision value and parallel costs the same GPU-dollars. But wave 1 left an asymmetry the litmus test
# does not cover: it proved the lane SAMPLES (three hosts at 95-99 % GPU on the real cmpd19/NR4A3 system) and
# 0 of 19 units ever reached a ddG, so reduce -> commit -> upload has never once been observed. Fanning 19
# wide into an unproven terminus risks paying 19x for nothing.
#
# The resolution is not to pick one side. It is to run ONE deliberately-chosen unit (the most-advanced
# checkpoint, hence the cheapest proof of the terminus) and let a cron release the other eighteen the MINUTE
# its ddg.json lands. That is strictly more parallel than waiting for a human or an agent to notice, and
# strictly safer than launching early — which is exactly the combination the shakeout rule is asking for.
# The gate itself lives in congeneric_fanout_vast.mode_launch under FANOUT_REQUIRE_PROVEN_TERMINUS, so the
# condition is enforced by the launcher and not by this file's scheduling.
#
# EVERY TICK DOES TWO THINGS, IN THIS ORDER:
#   1. monitor — a PROGRESS check, not a liveness ping: the committed-iteration census per unit, diffed
#      against the previous tick, plus realised iterations/hour and the starved-host guard. Committed back to
#      the branch, because a CI job log is only readable from its tail and the tail is runner boilerplate.
#   2. launch  — gated. A no-op that prints "TERMINUS NOT YET PROVEN" until a ddg.json exists; the full
#      remaining tranche the moment one does. It is idempotent (a unit with a result, or with a live
#      instance, is never re-submitted), so a tick after the fan-out costs nothing.
#
# ⚠ A `schedule:` trigger only fires from the DEFAULT BRANCH, so this file is inert until merged to main.
# Until then, exercise it with workflow_dispatch — an on-main workflow dispatched with ref=<branch> runs THAT
# branch's version of the file and its code.
#
# ⚠ AND THE BRANCH THE FLEET RUNS IS NOT `github.ref_name`. A scheduled run's ref is the default branch, but
# each rented instance pulls `$GIT_BRANCH.tar.gz` for its code, so a schedule that passed its own ref would
# silently run main's code against a feature branch's checkpoints. `fleet_branch` is therefore an explicit
# input with an explicit default, and it is the ONLY thing that sets GIT_BRANCH.

on:
  schedule:
    - cron: "*/20 * * * *"   # ⚠ THE NOMINAL CADENCE IS FICTION — DO NOT PLAN AGAINST IT, AND DO NOT QUOTE A
                             # REMEMBERED NUMBER HERE. GitHub throttles schedules on busy repos. MEASURED
                             # delivery of THIS workflow on 2026-07-27: 12:52 AM, 4:19 AM, 7:44 AM, 10:05 AM
                             # ET -> gaps of 220, 208, 205 and 141 MINUTES, against a nominal 20. So a
                             # 100-minute silence is normal here and is NOT evidence of a fault, while a
                             # genuinely dead scheduler looks the same as a healthy one for hours.
                             # (The old comment here implied a ~1 h cadence. It was read as a guarantee, and
                             # on 2026-07-27 that misread cost ~1 h 45 m of believing 16 rentals were being
                             # watched when nothing was watching them.)
                             # The live figure is MEASURED, never remembered: fleet-supervision-alarm.yml
                             # prints the real delivery gaps on every run — that is the one home for it.
                             # What the progress trail DOES prove independently of cadence: a unit commits
                             # every 20 (warmup) or 40 (production) iterations, i.e. every ~5-9 min, so any
                             # real interval sees an unambiguous advance in the committed scalar.
  workflow_dispatch:
    inputs:
      fleet_branch:
        description: "branch whose code the rented instances run (NOT the workflow's own ref)"
        default: "main"
      release_fanout:
        description: "1 = also attempt the terminus-gated fan-out; 0 = progress check only"
        default: "1"
      shakeout_unit:
        description: "unit the gate keeps alive (resumes) while the terminus is unproven; ignored once a ddg.json exists"
        default: "e_zaienne_cmpd19__cw_ev_5cooh__neutral__neutral_acid"
      stuck_start_min:
        description: "age (min) at which a host stopped with an EMPTY status_msg starts taking strikes; 45 = the calibrated default, lower ONLY with per-host evidence that it never started"
        default: "45"

permissions:
  contents: write
  # For the supervision-alarm job's authenticated run-history read — see the note on that step.
  actions: read

concurrency:
  # One tick at a time. Two concurrent ticks could both pass the terminus gate and both submit the remaining
  # units — the launcher's own live-instance check narrows that window but does not close it, and two hosts
  # syncing one commit prefix is an interleaved trajectory that nothing reports.
  group: step1-fanout-autoscale
  cancel-in-progress: false

jobs:
  tick:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    # ⭐⭐ THE ONE OUTPUT THAT DECIDES WHETHER THIS TICK RE-DISPATCHES THE SUPERVISION FLEET.
    # Read `armed != 'false'` by every dispatcher job below — NOT `== 'true'`, so a missing, empty or
    # unexpected value re-dispatches exactly as it does today. Fail-armed at the expression level too.
    outputs:
      armed: ${{ steps.armed.outputs.armed }}
    env:
      VAST_API_KEY: ${{ secrets.VAST_API_KEY }}
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      # The credential a RENTED community host is given, forwarded in cleartext by _vast_onstart.
      # Scoped to the lane prefixes + six S3 actions a leg needs (s3_scoped_policy.py). Unset until
      # trimcrae creates the vast-leg-s3 user -> gpu_backend falls back to the broad key above, which
      # is why lanes in flight kept running. Runbook: research/compute/scoped-s3-credential-runbook.md
      VAST_S3_ACCESS_KEY_ID: ${{ secrets.VAST_S3_ACCESS_KEY_ID }}
      VAST_S3_SECRET_ACCESS_KEY: ${{ secrets.VAST_S3_SECRET_ACCESS_KEY }}
      VAST_S3_SCOPED_STS: ${{ vars.VAST_S3_SCOPED_STS }}
      AWS_DEFAULT_REGION: us-east-2
      VAST_CKPT_BUCKET: sagemaker-us-east-2-646605541856
      GIT_BRANCH: ${{ github.event.inputs.fleet_branch || 'main' }}
      # ⚠ `FANOUT_WIDTH` IS DELIBERATELY NOT SET HERE ANY MORE (2026-07-27, the ramp).
      # It was `"19"` in this file, `"19"` again in fusion-cpu-extras.yml and `8` as the code default,
      # while the viable set is 18 (cw_bio_nmethyl_amide is permanently blocked). One knob, three typed
      # homes, none of them right — CLAUDE.md rule 1. The width is now DERIVED from the map by
      # `congeneric_fanout_vast.fanout_width()`, which is its one home; setting it here would restore
      # exactly the copy that drifted. Set it ONLY to narrow the fleet deliberately (a shakeout), never
      # to restate the default.
    steps:
      - uses: actions/checkout@v4
        with:
          # Check out the FLEET's branch, not the schedule's. A scheduled run is on main; the lane's code,
          # its watch list and its committed progress trail all live on the feature branch.
          ref: ${{ github.event.inputs.fleet_branch || 'main' }}
      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }
      # pyyaml is NOT optional here. The gate below parses THIS workflow to prove `reap` is wired into
      # the launcher's mode table, and a missing parser makes the gate fail on its own dependency rather
      # than on the thing it guards — which on 2026-07-27 blocked every tick, so no readout committed and
      # the terminus release of the 18 held edges could never fire. It passed locally only because the dev
      # sandbox happens to have PyYAML.
      #
      # ★★ AND `numpy` FOR THE SAME REASON, FOUR DAYS LATER, ON THIS SAME LINE (2026-08-01). Two tests in
      # `test_congeneric_fanout.py` `import numpy as np` to assert what `_apply_seed` actually reaches — they
      # landed 07-31 03:05 UTC in "make a controlled independent replicate runnable at all", and from that
      # commit onward the cost gate has failed on `ModuleNotFoundError: No module named 'numpy'`. The
      # launcher reads `steps.costgate.outcome` and, seeing `failure`, records `decision: cost_model_red`
      # and refuses to place — so a MONEY GATE was held shut by a missing TEST dependency, and the readout
      # blamed the cost model. Reproduced in a venv holding exactly `boto3 pytest pyyaml`; it passes in the
      # dev sandbox, which is precisely how the PyYAML instance hid too.
      # ⚠ The reason nothing was lost is luck, not design: the map happens to stand at 18 of 19 with 0
      # pending, so every refusal held zero units. `tests/test_gate_deps_cover_the_gated_tests.py` now
      # derives this list from what the gated modules actually import, so the third instance cannot happen.
      - run: pip install -q boto3 pytest pyyaml numpy

      # ★★ MEASUREMENT COMES BEFORE THE LAUNCH GATE, AND THAT ORDER IS THE WHOLE POINT (2026-07-27, 12 PM ET).
      #
      # THE INCIDENT. At 11:37 AM ET this tick died on its FIRST step — `test_congeneric_fanout.py` was red
      # because ANOTHER lane had just re-anchored the ladder basis ($0.004359 -> $0.003412/ns at 11:23 AM),
      # leaving four assertions pinned to the old numbers. Those four tests are about PRICE. They stopped the
      # progress check, the freshness gate and the reap from running at all, so 16 rentals went unmeasured and
      # unreaped while the artifact sat at its 10:06 AM value. The lane's own cost model took its own
      # supervision down with it.
      #
      # THE PRINCIPLE. The gate's stated job is "a broken unit list must never reach a GPU" — that is a
      # precondition for RENTING, not for LOOKING. Monitoring, the freshness assertion and the reap rent
      # nothing and destroy only what is already dead; blocking them on a price assertion inverts the safety
      # property, because it removes supervision from a fleet that is ALREADY BILLING. Supervision must be the
      # LAST thing a tick loses, never the first.
      #
      # So the pytest gate is split by what it actually guards:
      #   * the freshness tests run HERE, because they guard the measurement's own evidence gate;
      #   * the unit-list / cost-model tests move to just before the fan-out, where the renting happens.
      # A red cost model now holds LAUNCHES (correct — it is a price gate) and can no longer blind the watch.
      - name: Gate on the freshness tests (the measurement's own evidence gate must be sound)
        # Deliberately NOT alongside the cost-model tests: this file imports nothing from the pricing path, so
        # it cannot be taken down by a ladder re-anchor. That independence is the fix.
        run: python -m pytest research/modalities/tests/test_assert_progress_fresh.py
             research/modalities/tests/test_fleet_supervision_alarm.py -q

      - name: Progress check
        id: measure
        working-directory: research/modalities
        env:
          MONITOR: "1"
          # Exposed so a DIAGNOSED batch of never-started hosts can be condemned on the evidence rather than
          # waiting out a threshold calibrated for a different case. The default is unchanged at 45 min (the
          # measured cases that set it sat stopped for 49-53 min), and the two other safeguards are NOT
          # overridable here: the empty-status_msg signature still discriminates against a healthy image
          # pull, and two consecutive strikes are still required before anything is destroyed.
          STUCK_START_MIN: ${{ github.event.inputs.stuck_start_min || '45' }}
        run: python congeneric_fanout_vast.py

      # ★★ THE TICK MUST PROVE IT RE-MEASURED (2026-07-27). Immediately after the progress check, so the
      # failure is attributed to the step that actually failed to produce evidence rather than to something
      # downstream. Rationale in full: research/modalities/assert_progress_fresh.py.
      #
      # The incident: 18 GPUs billing, the only readable progress artifact 45 minutes stale and carrying NO
      # generation timestamp, and a tick dispatched to refresh it reporting `success` in 36 seconds. Every
      # step had "succeeded" — so green meant "the plumbing did not throw", while the operator read it as
      # "the fleet was measured". Those two must mean the same thing or the readout is worthless.
      #
      # ⚠ NEVER "FIX" A RED HERE BY SKIPPING OR SOFTENING THE CHECK. A red means this tick did not refresh its
      # own evidence, which is precisely the condition that made 18 billing GPUs unprovable. Fix the writer.
      - name: Freshness gate — fail loudly if this tick did not actually re-measure
        working-directory: research/modalities
        run: python3 assert_progress_fresh.py step1-fanout-progress.json

      - name: Collect — assemble the map, reconcile realised spend, reap dead hosts
        id: collect
        # BEFORE the launch, so a unit that finished this tick frees its slot in the same pass.
        #
        # AND BECAUSE NOTHING ELSE DESTROYS AN INSTANCE. Vast teardown is two-layer and only the first layer
        # is automatic: the onstart EXIT trap + autoteardown halt the GPU meter on completion or crash
        # (key-free, because VAST_API_KEY must never sit on a community host), but DESTROYING the exited
        # instance is control-plane only and needs the key, which lives here. Without a scheduled collect a
        # finished fleet would sit exited — GPU meter off, so not the expensive failure, but still nineteen
        # undestroyed rentals holding disk and nothing assembling the result they produced.
        working-directory: research/modalities
        env:
          COLLECT: "1"
        run: python congeneric_fanout_vast.py

      # ★★★ THE STEP THAT PROVES WHY NOTHING WAS PLACED FOR 1 H 47 M (2026-07-27, 2:31 PM ET). ★★★
      #
      # THE INCIDENT. Between 12:44 PM and 2:31 PM ET seven ticks ran, all green, and not one unit was
      # placed while the fleet decayed 11 -> 5 and ten checkpointed units sat with no host. The jobs API
      # shows the same two lines on every one of them, INCLUDING the 2:09 PM `schedule` tick (run
      # 30292476003) whose own evidence step printed "✅ MET" for the terminus and "OK — under the
      # $0.006539/ns buy line (≈1.92× basis); a release would clear the price gate":
      #     9  skipped  Gate on the fan-out unit tests …
      #     10 skipped  Terminus-gated fan-out
      #
      # THE MECHANISM. Both were guarded by `if: ${{ github.event.inputs.release_fanout != '0' }}`. A
      # `schedule:` event carries NO `inputs` context, so that operand is `null`; GitHub Actions performs a
      # LOOSE comparison and casts both operands to a number when their types differ, and `null` casts to
      # `0`. The condition is `0 != 0` -> FALSE. The money-spending step is skipped on precisely the trigger
      # meant to run unattended — 3 of 3 schedule ticks that day. The discriminating observation is in the
      # SAME run: `GIT_BRANCH: ${{ github.event.inputs.fleet_branch || '…' }}` resolved to its fallback and
      # printed `claude/max-effort-2dq11l`, so the inputs context was indeed null and `||` coped where `!=`
      # did not. This step records that comparison on every run so the claim never has to be re-derived.
      #
      # ⚠ DO NOT "FIX" THIS BY REWRITING THE EXPRESSION. A YAML `if:` decides in a language with implicit
      # coercion, leaves `skipped` as its only trace, and cannot write an artifact — so "held on price",
      # "nothing to place" and "placement switched off" all rendered as a green tick with no launch. That
      # indistinguishability is what let this run for 1 h 47 m. The flag is resolved HERE, in bash, where
      # empty is empty; the DECISION is made in the launcher, which names and records it.
      - name: Resolve the placement flag — and record what the inputs context actually held
        id: place
        # `always()`: this step is pure echo and costs nothing, and its output is what the launcher reads.
        # If it could be skipped by an upstream failure the launcher would fall back to its own default and
        # the run would carry no record of what the inputs context held — which is the evidence this exists
        # to preserve.
        if: ${{ always() }}
        env:
          RAW_RELEASE_FANOUT: ${{ github.event.inputs.release_fanout }}
          RAW_INPUTS_JSON: ${{ toJSON(github.event.inputs) }}
          # The expression that failed, evaluated and printed rather than trusted.
          OLD_EXPRESSION_RESULT: ${{ github.event.inputs.release_fanout != '0' }}
        run: |
          set -eu
          echo "event_name                                  = ${{ github.event_name }}"
          echo "github.event.inputs (raw)                   = ${RAW_INPUTS_JSON}"
          echo "github.event.inputs.release_fanout          = '${RAW_RELEASE_FANOUT}'"
          echo "OLD  if: (…release_fanout != '0')           = ${OLD_EXPRESSION_RESULT}   <-- false on a schedule: null casts to 0"
          v="${RAW_RELEASE_FANOUT}"
          # ABSENT IS NOT ZERO. The workflow-level default below is the single home for the value; this line
          # only says what "absent" means, and it must never be read as a second copy of that default.
          [ -n "$v" ] || v="1"
          echo "RESOLVED release_fanout                     = ${v}"
          echo "release_fanout=${v}" >> "$GITHUB_OUTPUT"

      # ★ THE LAUNCH GATE, in the only place it belongs: immediately before the step that spends money.
      # This is the half of the old combined gate that really is about renting — the unit list and the
      # derived cost/ceiling model. Red here must stop the fan-out and nothing else; everything above has
      # already measured and reaped. `pyyaml` is needed by this file (it parses THIS workflow to prove `reap`
      # is wired into the launcher's mode table), which is another reason it does not belong in front of the
      # progress check: a missing parser once blocked every tick.
      #
      # ⚠ `continue-on-error` IS NOT A SOFTENING. The refusal moved INTO the launcher, which records
      # `decision: cost_model_red` in the committed snapshot and then exits non-zero — so the job is still
      # red and nothing is rented, but the reason is now written down instead of being a `skipped` badge.
      - name: Gate on the fan-out unit tests (a broken unit list or cost model must never reach a GPU)
        id: costgate
        # `always()` so a red upstream cannot turn a REAL cost-model verdict into `skipped`, which the
        # launcher would then have to interpret. It reports; the launcher decides.
        if: ${{ always() }}
        continue-on-error: true
        run: python -m pytest research/modalities/tests/test_congeneric_fanout.py -q

      # ⚠ `always()` ON PURPOSE, AND IT IS THE OTHER HALF OF THE REPAIR. This step is the ONLY writer of
      # `step1-fanout-market-hold.json`, so any condition that can skip it is a condition under which the
      # artifact silently keeps an old timestamp — which is exactly how a two-hour outage looked identical
      # to a healthy fleet. It now runs on every tick and always records a NAMED decision (placed /
      # price_hold / nothing_pending / fleet_at_width / terminus_hold / credential_hold /
      # placement_disabled / cost_model_red), refreshing the board snapshot even when it rents nothing.
      - name: Terminus-gated fan-out — always runs; a tick that places nothing must SAY why
        if: ${{ always() }}
        working-directory: research/modalities
        env:
          LAUNCH: "1"
          FANOUT_CONFIRM: "1"
          FANOUT_REQUIRE_PROVEN_TERMINUS: "1"
          FANOUT_PLACEMENT_ENABLED: ${{ steps.place.outputs.release_fanout }}
          # Compared to the literal 'success' in Python — no expression-language coercion involved.
          FANOUT_COST_MODEL_OUTCOME: ${{ steps.costgate.outcome }}
          # ⚠ `always()` above means this step also runs when the MEASUREMENT failed — and renting more
          # hosts onto a fleet nobody just measured or reaped is the wrong direction. So the two upstream
          # outcomes are passed in as gates: the snapshot is still refreshed (that is the point), the
          # decision is recorded as `measurement_failed`, and nothing is bought.
          FANOUT_MEASURE_OUTCOME: ${{ steps.measure.outcome }}
          FANOUT_COLLECT_OUTCOME: ${{ steps.collect.outcome }}
          # The unit the gate keeps ALIVE while it holds the other eighteen back. Without this the gate is a
          # deadlock: it would refuse to launch anything until a ddg.json exists, including the one unit whose
          # whole job is to produce that ddg.json — so a preemption (which happened at 4:31 PM ET on
          # 2026-07-26, with 260 iterations already banked) would leave the cron ticking all night launching
          # nothing. Once a ddg.json exists this value is ignored and the full remaining tranche goes out.
          FANOUT_SHAKEOUT_UNIT: ${{ github.event.inputs.shakeout_unit || 'e_zaienne_cmpd19__cw_ev_5cooh__neutral__neutral_acid' }}
        run: python congeneric_fanout_vast.py

      # ★ EVIDENCE, NOT SUMMARY. Everything above reports the launcher's own view of the terminus: map.json
      # says `n_complete: 0`, the launch readout says "TERMINUS NOT PROVEN". CLAUDE.md §4 asks for the
      # observation that DISCRIMINATES, and there is a specific thing to discriminate here — `ddg.json` has
      # one name whatever wrote it, and the reducer's record keys on (leg_id, seed), which a RBFE_TINY smoke
      # and a production leg SHARE. So a 12-iteration smoke ddG can sit on the exact key the release gate
      # watches. This step prints the raw object store and grades every ddg.json by ITERATION COUNT from the
      # spot commit store (smoke ceiling 4 iters vs a 2000-iter production leg), plus the $/ns board the
      # release would have to clear. It reads and rents NOTHING.
      #
      # LAST, and `always()`, on purpose: evidence must never be able to block the tick that does the work,
      # and it must still run when a step above failed — that is exactly when someone needs it.
      - name: Terminus evidence — raw S3 artifacts + iteration-count grading + market snapshot
        if: ${{ always() }}
        working-directory: research/modalities
        run: python step1_terminus_evidence.py

      # ★ RE-MERGE THE ALL-LANE BOARD UNCONDITIONALLY, even when the progress check above died. The merge is
      # pure file reading — no creds, no provider call, no GPU — and it is the ONLY step in this repo that
      # refreshes `inflight-board-all.md`, because the ternary lane's own collect writes a single-lane file
      # and is not allowed to merge. Without this, a tick whose monitor failed would leave the board dated
      # at the previous tick with no indication of which lane went quiet; running it here means every lane's
      # section is at least re-graded for staleness on every tick that runs at all.
      - name: Re-merge the all-lane in-flight board ($0, no creds)
        if: ${{ always() }}
        run: python3 research/modalities/inflight_board.py --write

      # ⭐⭐ IS THERE ANYTHING TO SUPERVISE? PUBLISHED AS A JOB OUTPUT SO THE FAN-OUT BELOW CAN ASK.
      #
      # ⛔ WHY THIS EXISTS (measured 2026-08-25). Six jobs below carry `needs: tick` + `if: always()`, and
      # five of them do nothing but DISPATCH another workflow — the staleness watch, the supervisor, the
      # lane watch, the account reaper, the orphan alarm. `always()` means they fired on every tick
      # regardless of whether a single GPU existed, and each of those workflows dispatches further. With the
      # account at ZERO instances that is a self-sustaining chain: measured that day, ~11 autoscale ticks per
      # hour, 30 of the last 30 red, against ~185 workflow runs/hour repo-wide over an empty fleet.
      #
      # ⚠ WHAT IS GATED IS THE RE-DISPATCH, NOT THE TICK AND NOT THE WORK — the same line
      # `publish_artifacts.sh` already draws. This job has run in full and acted in full before reaching
      # this step; a reap that needed to happen has happened. Only the fan-out of MORE supervision is held.
      #
      # ⚠ AND IT IS FAIL-ARMED THREE TIMES OVER: `fleet_armed.py` itself returns ARMED on any doubt, this
      # step writes `true` on any exit code that is not exactly 10, and the consumers test `!= 'false'`.
      # `|| true` keeps a red tick from skipping the step that decides whether to keep supervising.
      - name: Is there anything to supervise? (publish the arming state for the fan-out below)
        id: armed
        if: ${{ always() }}
        # ⚠ `rc=0; cmd || rc=$?` AND NOT `cmd; rc=$?` — GitHub runs this with `bash -e {0}`, so a bare
        # non-zero exit aborts the step BEFORE `$?` is ever read, and the output would never be written.
        # An unwritten output reads as empty, which `!= 'false'` correctly treats as ARMED — so the bug
        # would have failed safe, and silently, which is how it would have survived.
        run: |
          rc=0
          python3 research/modalities/fleet_armed.py step1-fanout-autoscale || rc=$?
          if [ "$rc" -eq 10 ]; then armed=false; else armed=true; fi
          echo "armed=$armed" >> "$GITHUB_OUTPUT"
          echo "::notice::armed=$armed (fleet_armed exit $rc; 10=idle, anything else=armed)"

      - name: Commit the progress readout and any newly-armed watch entries
        if: ${{ always() }}
        env:
          # DERIVED, never stamped: every lane rewrites the merged board in full, so our pre-reset copy
          # would revert whatever the other four published meanwhile. Regenerated after the reset instead.
          PUBLISH_REGEN: python3 research/modalities/inflight_board.py --write
          PUBLISH_REGEN_ADD: research/modalities/inflight-board-all.md
        run: |
          set -e
          # ★ SAY WHERE THE READOUT LANDS, LOUDLY (2026-07-27). The tick's artifacts go to `fleet_branch`,
          # NEVER to the ref the workflow was dispatched on — both the checkout and GIT_BRANCH derive from
          # that input. Dispatching with ref=main therefore commits to the FEATURE branch, and an operator
          # who then reads origin/main sees an artifact that never moves and concludes the fleet is dead.
          # That happened at 9:37 AM ET with 18 GPUs billing. One echo removes the entire ambiguity.
          echo "::notice::Tick readout is being written to '$GIT_BRANCH' (the fleet_branch input) — NOT to the ref this run was dispatched on (${{ github.ref_name }}). Read origin/$GIT_BRANCH for the fresh progress artifact."
          # ⛔ ONE HOME FOR THE PUBLISH. This step already had the rewrite-onto-upstream right — it was
          # written after `git pull --rebase` wedged this very lane (run 30714482049, CONFLICT in
          # inflight-board-all.md, three retries dead on the first one's wreckage, step GREEN). What it did
          # NOT have is the other half: it stamped every file its checkout happened to contain, whether or
          # not this run wrote it. Measured 2026-08-01 on the sibling lane — a selcal `status` tick
          # republished a `collect` artifact seven seconds after it was measured, taking `landed: 5` back to
          # `landed: 0` with a three-hour-old timestamp. `vast-watch.json` below carries exactly that
          # exposure here, because the watchdog writes it too.
          # ⚠ NO PUBLISH_IF_CHANGED — THIS IS THE LANE'S HEARTBEAT. The timestamp is the only input to the
          # supervision alarm's staleness verdict. Note this also removes an `exit 0` on "nothing to
          # stage", which was that landmine already armed: a tick whose artifacts were all absent published
          # no heartbeat at all, and so read as a tick that never ran.
          # ⛔ HEARTBEAT, NOT A RESULT — publishes only while there is something to supervise
          # (trimcrae 2026-08-06; one home for the rule: research/modalities/fleet_armed.py).
          # FAIL-ARMED: any doubt about the fleet publishes as before.
          PUBLISH_HEARTBEAT_LANE="step1-fanout-autoscale" \
          bash research/compute/publish_artifacts.sh "$GIT_BRANCH" \
            "step1 fan-out autoscale tick ($(date -u +%FT%TZ))" \
            research/modalities/step1-fanout-progress.json \
            research/modalities/step1-fanout-map.json \
            research/modalities/step1-fanout-launch-readout.txt \
            research/modalities/step1-fanout-market-hold.json \
            research/modalities/step1-terminus-evidence.txt \
            research/modalities/relaunch-market-hold.json \
            research/modalities/inflight-board.d/step1-fanout.json \
            research/modalities/vast-watch.json

  # ★★ THE ALARM RIDES THE TICK, BECAUSE ITS OWN CRON IS NOT A DELIVERY CHANNEL (2026-07-27, 1:21 PM ET).
  #
  # THE GAP THIS CLOSES. `fleet-supervision-alarm.yml` was armed at 12:30 PM ET and, measured at 1:45 PM, had
  # run EXACTLY ONCE — that manual dispatch. Its hourly `schedule:` had delivered nothing, which is the same
  # throttling documented in that file's own header. So when the 1:21 PM tick died on a transient Vast 403
  # and left `step1-fanout-progress.json` stamped 12:42 PM while 11 rentals kept billing, the alarm built for
  # precisely that case never ran. An alarm nobody runs is indistinguishable from an alarm that found nothing.
  #
  # WHY HERE. The tick is the one thing in this repo that reliably executes — 25 of the last 30 runs were
  # hand-dispatched — so hanging the alarm off it lends the alarm the only cadence that actually works,
  # without pretending a cron will save us.
  #
  # `needs: tick` + `if: always()` IS THE WHOLE POINT: a SEPARATE job still runs when `tick` FAILS, which is
  # exactly the 1:21 PM shape (tick red, artifact stale, nothing said so). A final step inside `tick` could
  # not do this job, because the thing being graded is the tick's own failure to re-measure.
  #
  # ⚠ IT STILL SHARES NO CODE WITH THE LANE. No boto3, no Vast key, no import of congeneric_fanout* — the
  # failure it reports is a shared-dependency failure, so an alarm that imports the cost model dies with it.
  # It rents, prices and destroys nothing. This job is a second COPY of the trigger, not a second alarm.
  #
  # ⚠ AND IT GRADES THE PREVIOUS COMPLETED TICK, NOT THIS ONE — this run has not finished, so there is no
  # verdict to give about it yet. That is the correct semantic ("has supervision stopped?") and it means a
  # failed tick is caught by the NEXT tick rather than by itself. The emailing channel remains the scheduled
  # run of fleet-supervision-alarm.yml; this copy buys visibility and frequency, not the email.
  supervision-alarm:
    needs: tick
    if: ${{ always() }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.fleet_branch || 'main' }}
      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }
      # No `pip install` — see the sibling workflow. A dependency is a way for this to fail for a reason
      # unrelated to the fleet, and a supervision alarm that fails for unrelated reasons is noise.
      # ⚠ AND THE RUN-HISTORY READ IS AUTHENTICATED — THIS COPY IS THE HEAVY USER. It fires on EVERY tick
      # (~30 dispatches on 2026-07-27), each an anonymous GitHub API call from a runner IP whose rate limit is
      # shared with every other tenant on that runner. At 4:18 PM ET that read failed and the alarm called it
      # "the SCHEDULER is not delivering" — inside a green run of the very workflow it said had never run,
      # over an artifact that run had written 2.8 min earlier. `classify` no longer draws a scheduler verdict
      # from an unreadable API at any artifact age; the token stops the read failing in the first place.
      - name: Has supervision actually been happening?
        working-directory: research/modalities
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          python3 fleet_supervision_alarm.py \
            --progress step1-fanout-progress.json \
            --json /tmp/fleet-supervision-verdict.json
      - name: Verdict (readable on a red run too)
        if: ${{ always() }}
        run: |
          echo '### Fleet supervision verdict' >> "$GITHUB_STEP_SUMMARY"
          echo '```json' >> "$GITHUB_STEP_SUMMARY"
          cat /tmp/fleet-supervision-verdict.json >> "$GITHUB_STEP_SUMMARY" 2>/dev/null || \
            echo '{"verdict": "ALARM ITSELF FAILED — the check did not produce a verdict file"}' >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"

      # ★★ A DELIVERY PATH THAT DOES NOT GO THROUGH GITHUB'S SCHEDULER (2026-07-27).
      #
      # THE GAP THIS CLOSES, STATED EXACTLY. Attaching the alarm to every tick bought FREQUENCY, because the
      # tick is agent-dispatched. It did NOT buy a PUSH: the verdict landed in a step summary, and GitHub's
      # only "email a human" behaviour is a failed run of a SCHEDULED workflow — and this repo's schedules
      # delivered nothing all day (fleet-supervision-alarm.yml ran once in its first 90 minutes, that once
      # being a manual dispatch). So a red alarm on a hand-dispatched tick reached nobody.
      #
      # SES needs no scheduler and no new secret: `mailer.send_email` uses the SAME AWS credentials this
      # workflow already holds, so the notification rides the tick's own cadence. That is the whole point —
      # the alert is delivered by the thing that actually runs, not by the thing that is supposed to.
      #
      # ⚠ `if: failure()` — ONLY on a real FAILING/STALE verdict, never on a healthy tick. An alarm that
      # emails on success trains the reader to ignore it, which is the same end state as no alarm.
      #
      # ⚠ `continue-on-error` IS LOAD-BEARING, NOT LAZINESS. The alarm's red must stand on the alarm's own
      # finding. If SES is still sandboxed (MAIL_TO unverified — see daily-degrader-email.yml, mode=verify)
      # or the send fails for any other reason, that must NOT overwrite the verdict with a mailer error, and
      # must not turn a detected outage into a mysterious one. The send is best-effort ON TOP OF a signal
      # that is already recorded; the job is red either way.
      # ⚠ AND THE PIP INSTALL LIVES HERE, NOT ABOVE, so the CHECK stays dependency-free: a supervision alarm
      # that can fail for reasons unrelated to the fleet is noise. By this point the check has already run.
      - name: Push the verdict to a human (SES — independent of GitHub's scheduler)
        if: ${{ failure() }}
        continue-on-error: true
        working-directory: research/modalities
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: us-east-2
          MAIL_TO: ${{ vars.MAIL_TO }}
          MAIL_FROM: ${{ vars.MAIL_FROM }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          pip install -q boto3
          python3 - <<'PY'
          # ★★ THIS JOB EMAILED, AND EMAIL IS THE CHANNEL THE REST OF THIS DESIGN ALREADY RETIRED
          # (measured 2026-08-01, run 30714482049, job 91407735112). It called `mailer.send_email`, which
          # raises `SesDeliberatelyDisabled` — SES never had permission (`AccessDenied` on ses:SendEmail)
          # and trimcrae asked on 2026-07-31 to stop being emailed. The raise then KILLED the step, so:
          #
          #   * the job went red purely because the mailer refused, whatever the verdict was;
          #   * this workflow has a `schedule:` trigger, and a red scheduled run emails the repo owner —
          #     so the retired channel came back through the failure itself;
          #   * nothing after the `send_email` line ran, which is the half that actually mattered.
          #
          # Both sibling components already state the rule in their own words: `alarm_state.main` records a
          # read failure rather than raising, "because a failed run emails the repo owner — reintroducing
          # the push channel this module exists to remove", and `fleet-supervision-alarm.yml` annotates with
          # `::error::` and says "This run is deliberately NOT failed: a red scheduled run emails the repo
          # owner." This job was the one place that had not been converted.
          #
          # ⚠ THE VERDICT IS NOT SOFTENED, ONLY ITS DELIVERY. It is printed, it is written to the step
          # summary, and it is emitted as a `::error::` annotation when FAILING — a durable pull artifact
          # (`research/modalities/alarm-state.json`, committed by lane-staleness-watch.yml) is the home the
          # design chose. What is removed is the push.
          import json, os, pathlib
          p = pathlib.Path("/tmp/fleet-supervision-verdict.json")
          v = json.loads(p.read_text()) if p.exists() else {
              "verdict": "ALARM ITSELF FAILED", "detail": "the check produced no verdict file"}
          live = v.get("live_instances")
          body = (f"FLEET SUPERVISION ALARM — {v.get('verdict')}\n\n"
                  f"{v.get('detail')}\n\n"
                  f"artifact generated : {v.get('artifact_generated_et')} "
                  f"({v.get('artifact_age_min')} min old)\n"
                  f"fleet at last measurement: live_instances={live} "
                  f"realised=${v.get('realised_usd_so_far')}\n\n"
                  f"Run: {os.environ.get('RUN_URL')}\n\n"
                  # ⚠ AN ALARM ABOUT UNSUPERVISED **BILLING** MUST NOT SAY "BILLING" WHEN NOTHING IS BILLING.
                  # The 3:20 PM ET firing printed "may be BILLING WITHOUT SUPERVISION" on the same page as
                  # its own `live_instances=0`, which is how an alarm gets trained into noise. The stale
                  # artifact is still worth saying — it means nobody has measured — but the money sentence
                  # is conditional on there being money.
                  + ("This means the step-1 fan-out may be BILLING WITHOUT SUPERVISION. "
                     if live else
                     "No host was live at the last measurement, so nothing is known to be billing — but "
                     "the measurement itself is stale, so that reading is old. ")
                  + "Dispatch step1-fanout-autoscale.yml and read the progress artifact on the fleet branch.")
          print(body)
          summary = os.environ.get("GITHUB_STEP_SUMMARY")
          if summary:
              with open(summary, "a") as fh:
                  fh.write("### Fleet supervision\n\n```\n" + body + "\n```\n")
          if str(v.get("verdict", "")).upper() not in ("OK", "FRESH", "PASS"):
              print(f"::error title=FLEET SUPERVISION {v.get('verdict')}::{v.get('detail')} "
                    f"Durable board: research/modalities/alarm-state.json")
          PY

  # ═══════════════════════════════════════════════════════════════════════════════════════════════════════
  # The CROSS-LANE staleness watch, dispatched from here under `if: always()`.
  #
  # ★ WHY FROM THE TICK, AND WHY `always()`. `step1-fanout-supervisor.yml`'s loop is the watch's normal
  # cadence, but a supervisor whose chain has broken dispatches nothing — and the tick's own `schedule:` is
  # the cold-start path that survives that. More importantly, the moment supervision is MOST likely to be
  # down is the moment a tick FAILS: on 2026-07-27 the 11:37 AM tick died on its FIRST step and measured
  # nothing, while its `always()` steps kept the commit trail moving so the artifacts could not tell a failed
  # tick from an absent one. `always()` here means the cross-lane verdict is produced on exactly those runs.
  #
  # ⚠ SEPARATE JOB, SEPARATE TOKEN, ON PURPOSE. `actions: write` is needed to dispatch, and the tick job must
  # NOT gain it — that job holds the Vast key and the object-store credentials, and widening its token to
  # also create workflow runs enlarges the blast radius of the one job in this repo that can rent GPUs. Job
  # permissions override the workflow default, so this asks for exactly what it needs and nothing else.
  #
  # The dispatched workflow is REPORT-ONLY: it rents, destroys, reaps and prices nothing. Dispatching it can
  # therefore never turn a failed tick into a purchase.
  cross-lane-staleness-watch:
    needs: tick
    if: ${{ always() && needs.tick.outputs.armed != 'false' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      actions: write
    steps:
      - name: Dispatch the cross-lane staleness watch
        env:
          GH_TOKEN: ${{ github.token }}
          # With no actions/checkout there is no git remote to infer a repo from, and `gh workflow run` then
          # fails with "not a git repository" on every invocation — a step that looks alive and dispatches
          # nothing. That defect cost the supervisor a whole run; GH_REPO supplies it without a checkout.
          GH_REPO: ${{ github.repository }}
        run: |
          set -uo pipefail
          BR="${{ github.event.inputs.fleet_branch || 'main' }}"
          if gh workflow run lane-staleness-watch.yml --ref main -f fleet_branch="$BR"; then
            echo "::notice title=CROSS-LANE WATCH DISPATCHED::verdict for all five lanes will appear in lane-staleness-watch.yml"
          else
            # Not fatal to this tick, and never silent — a dispatch that fails quietly leaves four lanes
            # unwatched while everything still looks green.
            echo "::warning title=CROSS-LANE WATCH NOT DISPATCHED::the other four lanes were not checked on this tick"
          fi

  # ═══════════════════════════════════════════════════════════════════════════════════════════════════════
  # COLD-START THE SUPERVISOR IF ITS CHAIN HAS BROKEN.
  #
  # ★ THE GAP THIS CLOSES, measured 2026-07-31. `step1-fanout-supervisor.yml` is what actually delivers this
  # repo's supervision cadence: a long-lived job that dispatches the tick, the two ternary gates, a collect
  # and the cross-lane watch every ~8 min, then re-dispatches ITSELF before the 6 h job ceiling. Measured
  # delivered gaps that day: 8.1 min median from the supervisor, against 91 min median (max 201) for
  # `vast-watchdog`'s `*/15` cron and 134 min median (max 250) for the hourly supervision alarm. The
  # supervisor is not a nicety — it is the difference between a dead host being re-placed in minutes and in
  # hours, and CLAUDE.md §6 is explicit that a `schedule:` does not supervise a billing fleet.
  #
  # ⚠ AND NOTHING RESTARTED IT. The chain is a single linked list with one concurrency group: every link is
  # dispatched by its predecessor, so when a handoff fails the cadence does not degrade, it STOPS. It has
  # stopped before — a ~19 h gap between 2026-07-28T02:08Z and 2026-07-29T16:21Z, ended by trimcrae
  # hand-dispatching. A grep across `.github/workflows/` for anything that dispatches the supervisor found
  # only the supervisor itself. So the documented "cold-start path" for the supervisor did not exist; what
  # existed was a cold-start path for the *tick*, which is a much slower thing.
  #
  # WHY HERE. This workflow's own `schedule:` is the trigger that still fires when every other mechanism is
  # dead — throttled to hours, but alive. That makes it the correct and cheapest place to notice an absent
  # supervisor. Bound on an outage becomes ONE cron delivery instead of unbounded.
  #
  # WHAT IT DELIBERATELY DOES NOT DO. It does not rent, price, reap or condemn anything, and it passes no
  # pricing input — it only restores a CADENCE. The supervisor it starts dispatches gates, never launches; a
  # gate with nothing to place exits 3 and rents nothing, so a spurious resurrection costs $0. Separate job
  # with `actions: write` so the tick job — the one holding the Vast key and the object-store credentials —
  # never gains the power to create workflow runs (same reasoning as `cross-lane-staleness-watch` above).
  resurrect-supervisor:
    needs: tick
    if: ${{ always() && needs.tick.outputs.armed != 'false' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      actions: write
    steps:
      - name: Start a supervisor if none is alive
        env:
          GH_TOKEN: ${{ github.token }}
          # No actions/checkout here, so `gh` has no git remote to infer a repo from and every subcommand
          # would die with "not a git repository". Same defect the supervisor itself once shipped with.
          GH_REPO: ${{ github.repository }}
        run: |
          set -uo pipefail
          WF=step1-fanout-supervisor.yml
          # `queued` counts as alive on purpose: the supervisor's concurrency group is
          # `cancel-in-progress: false`, so a successor dispatched during a handoff sits queued rather than
          # collapsing. Treating queued as dead would stack duplicate supervisors, and two loops holding the
          # same cadence double the dispatch rate into the one Vast API key — which is the failure the
          # supervisor's own concurrency block exists to prevent.
          LIVE=$(gh run list --workflow "$WF" --limit 20 \
                   --json status --jq '[.[]|select(.status=="queued" or .status=="in_progress")]|length' 2>/dev/null)
          # An unreadable API must not be read as "dead" — that would dispatch a supervisor on every tick
          # during an API blip. Fail CLOSED (assume alive) and say so; a missed resurrection is recovered on
          # the next tick, a storm of them is not.
          if [ -z "${LIVE:-}" ]; then
            echo "::warning title=SUPERVISOR LIVENESS UNREADABLE::gh run list returned nothing for $WF — assuming a supervisor is alive and NOT dispatching. If this repeats, the chain may be down with no cold start."
            exit 0
          fi
          echo "supervisor runs queued/in-progress: $LIVE"
          if [ "$LIVE" != "0" ]; then
            echo "::notice title=SUPERVISOR ALIVE::$LIVE run(s) of $WF queued/in-progress — cadence is held, nothing to do."
            exit 0
          fi
          # Defaults are passed EXPLICITLY rather than omitted. Omitting inputs is what silently disabled
          # placement on seven green ticks on 2026-07-27: an absent input reads as null, and a GitHub
          # expression comparing null against a string casts it to 0, so `!= '0'` evaluated FALSE in exactly
          # the case it was written to allow. Naming every value here means a resurrected supervisor holds
          # the same cadence as a hand-started one.
          if gh workflow run "$WF" --ref main \
               -f hours=5.5 -f tick_every_min=8 -f fleet_branch=main \
               -f release_fanout=1 -f watch_every_ticks=2; then
            echo "::warning title=SUPERVISOR CHAIN WAS DOWN — RESTARTED::no run of $WF was queued or in progress, so the ~8 min supervision cadence had stopped and every lane was falling back to this repo's throttled crons (measured 91-250 min). A fresh 5.5 h supervisor was dispatched. This warning is the signal that the chain broke; investigate the previous supervisor run's tail if it repeats."
          else
            echo "::error title=SUPERVISOR DOWN AND COULD NOT BE RESTARTED::no supervisor is alive and dispatching $WF failed. Supervision has degraded to this repo's throttled crons until a human or a later tick recovers it."
          fi

  # ═══════════════════════════════════════════════════════════════════════════════════════════════════════
  # ★★ AND THE SAME WATCHDOG, GENERALISED TO EVERY OTHER LANE'S SUPERVISION LOOP (2026-08-01)
  # ═══════════════════════════════════════════════════════════════════════════════════════════════════════
  # `resurrect-supervisor` above restarts exactly ONE loop: step 1's. On 2026-08-01 the same shape — a
  # supervisor that looks healthy while supervising nothing — was diagnosed FOUR times in one day, and the
  # fourth was a `cofold_watch` that can exit down two paths which never re-arm, leaving a co-fold host
  # billing with nothing watching it. A per-lane fix would have been the fifth copy of one idea.
  #
  # ⚠ A SEPARATE JOB, NOT A SECOND STEP IN `resurrect-supervisor`. That job deliberately has no
  # `actions/checkout` (so `gh` cannot infer a repo from a git remote), and this one needs the checkout to
  # read the account alarm's committed report. Adding a checkout there would change the environment of a
  # guard that is currently working — the specific fix must not be weakened to deliver the general one.
  #
  # ★ WHAT IT KEYS ON, and this is the whole design: the Actions API's own `queued`/`in_progress` state,
  # NEVER an artifact's freshness. Measured at 2:25 PM ET today — the selcal census was 24 min stale while
  # its host billed (the alarm's `UNSUPERVISED-BILLING` signature exactly) and its watch was ALIVE at 36+
  # minutes, because that run predated the lane's per-tick publish. A staleness-keyed resurrector would have
  # put a second supervisor on a lane that already had one. Full reasoning + the four controls:
  # `supervisor_resurrect.py` and `tests/test_supervisor_resurrect.py`.
  #
  # ⚠ `if: always()` — it must also fire when the tick FAILS, which is when a loop is most likely to be gone.
  # COST: $0. It can only dispatch modes that are AST-pinned unable to rent.
  resurrect-lane-watch:
    needs: tick
    if: ${{ always() && needs.tick.outputs.armed != 'false' }}
    runs-on: ubuntu-latest
    timeout-minutes: 6
    permissions:
      contents: read
      actions: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }
      - name: Restart any lane whose host is billing with no watch loop alive
        env:
          # `github.token` carries `actions: write` from this job's permissions block — the tick job, which
          # holds the Vast key and the object-store credentials, never gains the power to create runs.
          GITHUB_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: python3 research/modalities/supervisor_resurrect.py --ref main

  # ═══════════════════════════════════════════════════════════════════════════════════════════════════════
  # ★★ THE ACCOUNT-KEYED ALARM GETS A RIDE HERE, FOR THE SAME REASON `resurrect-supervisor` DOES (2026-08-01)
  # ═══════════════════════════════════════════════════════════════════════════════════════════════════════
  # WHY THIS JOB EXISTS. On 2026-08-01 the selectivity-control lane rented two hosts, stopped reporting at
  # 10:14 AM ET, and nothing noticed for 40+ minutes — by 10:54 AM one of the two had already `exited`. Its
  # watch job was still `in_progress` with a successor `pending`, so the supervisor LOOKED alive while
  # producing no ticks.
  #
  # The structural gap is that every lane's liveness is watched by THAT LANE'S OWN supervisor, so when the
  # supervisor stalls the only thing that would notice is the thing that stopped. `lane-staleness-watch.yml`
  # inherits exactly that failure — its real cadence is `step1-fanout-supervisor.yml`'s in-job loop — and it
  # did not know the selcal lane existed at all.
  #
  # ★ SO THE DRIVER MUST NOT BE A LANE SUPERVISOR, and this job is the repo's existing answer to that
  # requirement: `resurrect-supervisor` above is already a watchdog that does not depend on what it watches,
  # dispatched from a tick rather than from the supervisor it restarts. The account alarm is dispatched the
  # same way, and for the stronger reason that it watches the ACCOUNT — including lanes this workflow has
  # never heard of.
  #
  # ⚠ THIS IS A RIDE, NOT INDEPENDENCE. If the autoscale workflow itself stops, the alarm loses this driver
  # and falls back to its own throttled cron. Two weak drivers that fail for DIFFERENT reasons is the honest
  # description and the alarm's own header says so; neither is a heartbeat.
  #
  # ⚠ `if: always()` — SO IT ALSO FIRES WHEN THE TICK FAILS, which is precisely when supervision is most
  # likely to be down: on 2026-07-27 the 11:37 AM tick died on its FIRST step and measured nothing while its
  # `always()` steps kept the commit trail moving.
  #
  # ⚠ EVERY TICK, NOT `WATCH_EVERY`. Unlike the account CENSUS dispatch in `step1-fanout-supervisor.yml`,
  # which is throttled because it is a heavy read against one shared Vast API key, this alarm makes NO API
  # call at all — it reads two committed files with stdlib Python. There is nothing to rate-limit, so
  # throttling it would only add latency to the one check that can see an unwatched host.
  #
  # It dispatches a REPORT-ONLY workflow: the alarm rents, destroys and reaps nothing (pinned by AST in
  # `tests/test_account_orphan_alarm.py`), so this job changes nothing about the tick's "it does not buy"
  # property. COST: $0.
  account-orphan-alarm:
    needs: tick
    if: ${{ always() && needs.tick.outputs.armed != 'false' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      actions: write
    steps:
      - name: Dispatch the account-keyed cross-lane alarm
        env:
          GH_TOKEN: ${{ github.token }}
          # No actions/checkout here, so `gh` has no git remote to infer a repo from and every subcommand
          # would die with "not a git repository" — the same defect the supervisor once shipped with.
          GH_REPO: ${{ github.repository }}
        run: |
          set -uo pipefail
          if gh workflow run account-orphan-alarm.yml --ref main -f branch=main; then
            echo "::notice title=ACCOUNT ALARM DISPATCHED::the account-keyed cross-lane alarm was dispatched — it asks the one question no lane-scoped watcher can: is any host billing whose lane has stopped reporting?"
          else
            # Never fatal, and never silent: a tick that quietly stopped dispatching the alarm would leave
            # every lane's hosts unwatched by anything outside their own supervisors — the exact shape being
            # fixed. Falls back to the alarm's own throttled cron until a later tick recovers it.
            echo "::warning title=ACCOUNT ALARM DISPATCH FAILED::the cross-lane alarm was not dispatched, so it is running on its throttled cron alone. A host whose lane has stalled would go unnoticed for longer."
          fi

  # ═══════════════════════════════════════════════════════════════════════════════════════════════════════
  # ★★ AND THE CENTRAL REAPER GETS THE SAME RIDE — BECAUSE NOTICING WITHOUT ACTING IS WHAT KEPT FAILING
  # ═══════════════════════════════════════════════════════════════════════════════════════════════════════
  # The job above dispatches the account-keyed ALARM, which is report-only by design. On 2026-08-01 that
  # alarm fired ATTENTION unattended, correctly, every ~8 min — and two selcal hosts kept billing anyway,
  # because every teardown path in the repo is PRIVATE TO A LANE and four of them were broken at once:
  # ternary reaped a live re-run off a five-day-old `done` record; NR-V04 retro's `retro_reap` never fired;
  # the GCP reaper worked and nothing relaunched; selcal's `mode=reap` ran, exited SUCCESS, and destroyed
  # neither a finished host nor a terminal one.
  #
  # `vast-account-reaper.yml` is the one thing that ACTS, on a narrow predicate, keyed on the ACCOUNT. It is
  # dispatched from here for exactly the reason `resurrect-supervisor` and the alarm are: A LANE SUPERVISOR
  # MUST NOT BE THE DRIVER OF THE THING THAT COVERS FOR LANE SUPERVISORS. Its own `schedule:` is the other
  # weak driver; two that fail for different reasons is the honest description and neither is a heartbeat.
  #
  # ⚠ `if: always()` — so it also fires when the tick FAILS, which is precisely when a host is most likely to
  # be left behind. COST: $0, and it only ever reduces spend.
  account-reaper:
    needs: tick
    if: ${{ always() && needs.tick.outputs.armed != 'false' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      actions: write
    steps:
      - name: Dispatch the account-keyed central reaper
        env:
          GH_TOKEN: ${{ github.token }}
          # No actions/checkout here, so `gh` has no git remote to infer a repo from and every subcommand
          # would die with "not a git repository" — the same defect the supervisor once shipped with.
          GH_REPO: ${{ github.repository }}
        run: |
          set -uo pipefail
          if gh workflow run vast-account-reaper.yml --ref main -f branch=main -f arm=true; then
            echo "::notice title=ACCOUNT REAPER DISPATCHED::the one central thing that destroys hosts on a terminal state, or on work verifiably banked, was dispatched. It never reaps on gpu_util, on age, or on a stale census."
          else
            echo "::warning title=ACCOUNT REAPER DISPATCH FAILED::the central reaper was not dispatched, so it is running on its throttled cron alone. A terminal or finished host would keep billing for longer."
          fi
