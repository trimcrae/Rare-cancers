name: Ternary cooperativity FEP — Vast lane (RUNG 2b, 4 fs)

# The ternary lane on VAST, per trimcrae's 2026-07-25 directive that all production GPU runs go on Vast.
# Before this, the ternary FEP could only run on GCP L4 (1-GPU quota, another session's lane) or on a
# script-shaped Vast path with no checkpoint/resume, no cache and no reap. Engine: research/modalities/
# ternary_vast_launch.py; recipe: run_ternary_leg.sh (single source of truth — never re-implemented here).
#
# IMAGE: docker.io/triskit23/ternary-fep (research/compute/Dockerfile.ternaryfep). PULL, DO NOT SOLVE — the
# image's mamba spec is byte-for-byte the one the GCP ternary lane builds on the fly, so it is the *correct*
# environment, not merely the fast one: analysing an OpenFE trajectory with a different pymbar/openmmtools
# than PRODUCED it can move the MBAR numbers.
#
# THE LADDER (cheapest-decisive-first; nothing auto-fires):
#   test    -> $0.    Pure-logic unit tests for the launcher. Runs on every push to the lane's files.
#   dry-run -> $0.    Print the exact JobSpec that WOULD be rented (env, image, caps). No rental.
#   prime   -> $0.    Stage every EDGE leg on a free CPU runner and upload the stage caches to S3, so the
#                     rented hosts get cache hits. Two wins, both real: it removes ~8-15 min of GPU-idle
#                     staging from EACH paid host, and it discovers a first-time staging failure for the
#                     binary and solvent legs at $0 instead of on a 4090.
#   smoke   -> ~$0.15 One instance, 8 warmup + 12 production iterations: proves image + repo pull + stage +
#                     pre-equil + setup + commit store + upload end to end before a real leg is paid for.
#   probe   -> ~$1-2  RUNG 2b STAGE 1. 48 warmup @1 fs -> 200 production @4 fs. The survival question:
#                     does 4 fs hold well past the 40 iterations the runbook demonstrated? A NO here costs
#                     ~$1-2 instead of a full edge.
#   edge    -> ~$4-6  RUNG 2b STAGE 2, only on a passing probe. The full matched re-calibration edge:
#                     ternary + binary + solvent at full science length, fanned out 3-wide.
#   collect -> $0.    Status board + PROGRESS check (committed iteration, not liveness) + anti-idle reap.
#   reduce  -> $0.    Pull the edge's leg JSONs, cross-check ddG_coop = ternary - binary by hand, and run
#                     the official reducer INSIDE the parity image that produced the trajectories.
#   stop    -> $0.    Destroy every tvast-* instance.
#
# DISPATCHING BEFORE THIS FILE IS ON main. A brand-new `workflow_dispatch` workflow 404s until it reaches
# the default branch, but a `push` trigger runs from the pushed branch with no such dependency. So the task
# can also be given in the COMMIT MESSAGE as a `[tvast:<task>]` marker, which is how this lane was
# bootstrapped and validated on a feature branch. Once the file is on main, use workflow_dispatch.

on:
  # ⏰ The market re-check. A `schedule:` fires ONLY from the default branch, so this covers main; it resolves
  # to `market-gate`, which either holds (committing the snapshot) or dispatches the launch itself.
  #
  # ⚠ THIS IS A BACKSTOP, NOT THE PRIMARY, AND THAT IS A MEASURED CALL RATHER THAN CAUTION. GitHub's
  # scheduled-event delivery to this repo STOPPED at 10:04 PM on 2026-07-26 — no `schedule` event on any
  # workflow after that, while `workflow_dispatch` kept working and all three watchdogs went green when
  # dispatched by hand. So a cron-only re-check would have been a gate that never re-checks, which is the
  # same "reports success while measuring nothing" shape this lane keeps paying for. The primary re-check is
  # a Claude-side Routine that dispatches this task; this cron is the second channel, not the only one.
  #
  # ⚠ THAT ROUTINE DID NOT EXIST UNTIL 2026-07-27 8:05 AM ET, though this comment already claimed it did.
  # The cost of the gap is measurable rather than hypothetical: over the 12 h to 7:46 AM ET this workflow saw
  # exactly TWO market re-checks — a `schedule` at 6:10 AM and a hand `workflow_dispatch` at 7:46 AM — with a
  # 277-MINUTE BLIND WINDOW from 1:32 AM to 6:10 AM. `push` events do not re-check: without a [tvast:...]
  # marker they resolve to the free `test`, so the busy push traffic at 7:08/7:24/7:28 AM priced nothing. A
  # held fleet is only correct while something is still looking for the price to fall, and for those 4.6 h
  # nothing was. The Routine now fires hourly at :05 independently of GitHub's scheduled-event delivery.
  schedule:
    - cron: "17 * * * *"
  push:
    branches:
      - main
      - claude/max-effort-2dq11l-4fs
    paths:
      - research/modalities/ternary_vast_launch.py
      - research/modalities/ternary_vast_watchdog.py
      - research/modalities/run_ternary_leg.sh
      - research/modalities/tests/test_ternary_vast_launch.py
      - .github/workflows/gpu-ternary-fep-vast.yml
      # The poke file exists ONLY to trigger this workflow from a feature branch, where
      # workflow_dispatch is not yet available. See research/modalities/ternary-vast-poke.txt.
      - research/modalities/ternary-vast-poke.txt
  workflow_dispatch:
    inputs:
      task:
        description: "test | dry-run | prime | smoke | probe | edge | collect | reduce | converge (CPU/$0 - pull the newest committed .nc per leg from S3 and run the convergence + contact-moiety pose diagnostics in the parity image) | stop || valB_mini replicates: reps-prime ($0, stage seeds 1+2 and PROVE the atom map is complete) | edge-reps (r1+r2, 4 legs in parallel) | reps-diag ($0, why an arm commits nothing — the container's OWN console via request_logs plus every archived attempt) | reduce-reps ($0, the cycle SD across seeds) || RUNG 5a-KS: 5aks-prime ($0, stage the co-folds and seed the cache) | 5aks-smoke (~$0.15) | 5aks (~$12, the two ternary legs) | 5aks-reduce ($0, the double difference S) | supersede-failed ($0, archive-and-clear a stale status=failed leg.json once its cause is fixed — use leg_only to select) || valB CLOSURE TRIANGLE (2 fs, seed 0, binary legs UNRESTRAINED): triangle-freeze ($0, derive cmpd4\" by two independent routes and commit the freeze) | triangle-prime ($0, stage all 4 legs on CPU + prove both new atom maps) | triangle-gate ($0, price the 4 legs and self-dispatch the launch the moment the board clears) | triangle-smoke (~$0.15, the closing edge end to end) | triangle (the 4 legs, ~$6.83 plan) | triangle-reduce ($0, the closure residual R)"
        type: choice
        options: [test, dry-run, prime, smoke, probe, edge, collect, reduce, converge, stop, market-gate, reps-prime, edge-reps, reps-diag, reduce-reps, 5aks-prime, 5aks-smoke, 5aks, 5aks-reduce, supersede-failed, triangle-freeze, triangle-prime, triangle-gate, triangle-smoke, triangle, triangle-reduce]
        default: test
      timestep_fs:
        description: "production MD timestep in fs (blank = 4.0, the thing RUNG 2b is testing)"
        type: string
        default: ""
      warmup_timestep_fs:
        description: "warmup/equilibration timestep in fs (blank = 1.0). Equilibration is DISCARDED, so this never enters dG."
        type: string
        default: ""
      vast_image:
        description: "override the image (blank = docker.io/triskit23/ternary-fep:latest)"
        type: string
        default: ""
      cofold_prefix:
        description: "5aks-prime: S3 prefix holding the Boltz co-fold CIFs (blank = rung5aks-cofold-v1)"
        type: string
        default: ""
      leg_only:
        description: "launch: restrict to units whose LEG ID contains this substring (e.g. `nr4a3`). Recovers ONE preempted arm without re-renting a sibling that has a known deterministic defect."
        type: string
        default: ""

permissions:
  contents: write

# NB there is deliberately NO workflow-level `concurrency` here. Serialising the whole workflow also
# serialises `collect`, and monitoring that has to queue behind a 25-minute `prime` is monitoring you cannot
# do during exactly the window when a rented GPU is running unproven code. The group is applied to the
# MUTATING jobs only (launch, prime), which is where a concurrent run actually causes harm: two submits can
# put two instances on one unit, writing the same S3 keys, doing the same work, billing twice.

jobs:
  resolve:
    runs-on: ubuntu-latest
    outputs:
      task: ${{ steps.pick.outputs.task }}
    steps:
      - id: pick
        env:
          DISPATCH_TASK: ${{ github.event.inputs.task }}
          MSG: ${{ github.event.head_commit.message }}
        run: |
          set -eo pipefail
          # Precedence: explicit dispatch input > a [tvast:<task>] marker in the pushed commit message >
          # `test` (free). The default is deliberately the $0 one: a push must never be able to rent a GPU
          # by accident, which is the spend-gated ladder's first rule.
          TASK="${DISPATCH_TASK:-}"
          # A SCHEDULE fires the market re-check, not `test`. `github.event.inputs.*` is empty on a schedule
          # event and there is no head_commit message either, so without this branch the cron would resolve
          # to the free `test` and re-check nothing — a scheduled gate that silently never runs, which is
          # strictly worse than having no schedule at all because it looks like coverage.
          if [ -z "$TASK" ] && [ "${{ github.event_name }}" = "schedule" ]; then
            TASK=market-gate
          fi
          if [ -z "$TASK" ]; then
            # `|| true` IS LOAD-BEARING. grep exits 1 when it matches nothing, and under `set -eo pipefail`
            # (plus the runner's own `bash -e`) that failure propagates out of the command substitution and
            # kills the step — so the "no marker -> fall back to the free `test`" branch could never be
            # reached, and EVERY marker-less push to this lane's files went red. Observed on run
            # 30169660474, whose only fault was a commit message without a [tvast:...] marker. A fallback
            # that cannot execute is not a fallback.
            TASK=$(printf '%s' "$MSG" | grep -oE '\[tvast:[a-z0-9-]+\]' | head -1 | sed 's/\[tvast://; s/\]//' || true)
          fi
          # THIS ALLOWLIST MUST BE KEPT IN SYNC WITH THE `task` INPUT'S OPTIONS. It is a silent downgrade, not an
          # error: an unlisted task falls back to `test`, which passes, prints a warning nobody reads, and does
          # none of the work that was asked for. Adding `converge` to the input's options without adding it here
          # would have produced a green run that analysed nothing — the exact "reports success while measuring
          # nothing" shape this lane's audit is about. Gated by
          # tests/test_workflows_parse.py::test_vast_task_allowlist_matches_the_input_options.
          case "${TASK:-test}" in
            test|dry-run|prime|smoke|probe|edge|collect|reduce|converge|stop|market-gate|reps-prime|edge-reps|reps-diag|reduce-reps|5aks-prime|5aks-smoke|5aks|5aks-reduce|supersede-failed|triangle-freeze|triangle-prime|triangle-gate|triangle-smoke|triangle|triangle-reduce) TASK="${TASK:-test}" ;;
            *) echo "::warning::unrecognised task '${TASK}' -> falling back to the free 'test'"; TASK=test ;;
          esac
          echo "task=$TASK" >> "$GITHUB_OUTPUT"
          echo "::notice title=TVAST task::$TASK"

  # ------------------------------------------------------------------ free: pure logic
  test:
    needs: resolve
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with: { ref: "${{ github.ref_name }}" }
      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }
      - name: Unit tests (identity round-trip, prefix keying, cost arithmetic)
        run: |
          set -eo pipefail
          python -m pip install -q pytest
          python -m pytest research/modalities/tests/test_ternary_vast_launch.py \
                           research/modalities/tests/test_ternary_vast_watchdog.py \
                           research/modalities/tests/test_ternary_launch_ledger.py -q

  dry-run:
    needs: [resolve, test]
    if: ${{ needs.resolve.outputs.task == 'dry-run' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with: { ref: "${{ github.ref_name }}" }
      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }
      - name: Print the JobSpec that would be rented
        env:
          GIT_BRANCH: ${{ github.ref_name }}
          TVAST_TIMESTEP_FS: ${{ github.event.inputs.timestep_fs }}
          TVAST_WARMUP_TIMESTEP_FS: ${{ github.event.inputs.warmup_timestep_fs }}
        run: |
          set -eo pipefail
          python research/modalities/ternary_vast_launch.py --mode probe --dry-run
          python research/modalities/ternary_vast_launch.py --mode edge --dry-run | head -5

  # ------------------------------------------------------------------ free: pre-stage on CPU
  prime:
    needs: [resolve, test]
    if: ${{ needs.resolve.outputs.task == 'prime' }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    concurrency:
      group: ternary-vast-mutate
      cancel-in-progress: false
    env:
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      # The credential a RENTED community host is given, forwarded in cleartext by _vast_onstart.
      # Scoped to the lane prefixes + six S3 actions a leg needs (s3_scoped_policy.py). Unset until
      # trimcrae creates the vast-leg-s3 user -> gpu_backend falls back to the broad key above, which
      # is why lanes in flight kept running. Runbook: research/compute/scoped-s3-credential-runbook.md
      VAST_S3_ACCESS_KEY_ID: ${{ secrets.VAST_S3_ACCESS_KEY_ID }}
      VAST_S3_SECRET_ACCESS_KEY: ${{ secrets.VAST_S3_SECRET_ACCESS_KEY }}
      VAST_S3_SCOPED_STS: ${{ vars.VAST_S3_SCOPED_STS }}
      AWS_DEFAULT_REGION: us-east-2
    steps:
      - uses: actions/checkout@v4
        with: { ref: "${{ github.ref_name }}" }
      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }
      - name: Stage every edge leg on CPU and upload the caches
        # PULL, DO NOT SOLVE: the same parity image the GPU hosts run, so the staged tree is byte-identical
        # to what a host would have built. Staging touches no GPU -- it is an RCSB fetch, a SMARCA4->SMARCA2
        # homology model and an assembly -- so paying a 4090 to do it is the exact anti-pattern the GCP
        # lane's CPU pre-bake exists to kill. CI runners have unrestricted internet, which the dev sandbox
        # does not.
        run: |
          set -eo pipefail
          python -m pip install -q boto3
          echo "${{ secrets.DOCKERHUB_TOKEN }}" | docker login -u triskit23 --password-stdin
          B="${VAST_CKPT_BUCKET:-sagemaker-us-east-2-646605541856}"
          mkdir -p /tmp/tin
          for LEG in calib_hi_to_lo__ternary_vhl calib_hi_to_lo__binary_vhl calib_hi_to_lo__solvent; do
            KEY="s3://$B/ternary-vast/stagecache/${LEG}__8G1Q__seed0__v1.tar"
            if aws s3 ls "$KEY" >/dev/null 2>&1; then echo "[prime] HIT  $LEG"; continue; fi
            echo "[prime] MISS $LEG -- staging on CPU"
            docker run --rm --entrypoint python \
              -v "$PWD/research/modalities:/work/research/modalities" -v /tmp/tin:/tmp/tin \
              -e SEED=0 -e SSL_CERT_FILE=/etc/ssl/certs/ca-certificates.crt \
              -w /work/research/modalities \
              docker.io/triskit23/ternary-fep:latest \
              /work/research/modalities/ternary_pdb_stage.py \
                --leg-id "$LEG" --template-pdb 8G1Q --out /tmp/tin 2>&1 | tail -20
            ls -la "/tmp/tin/$LEG"
            tar -C /tmp/tin -cf "/tmp/${LEG}.tar" "$LEG"
            aws s3 cp "/tmp/${LEG}.tar" "$KEY"
            echo "[prime] uploaded $KEY ($(du -h /tmp/${LEG}.tar | cut -f1))"
          done
          echo "[prime] done -- every edge host will now restore its stage tree in seconds"

  # ------------------------------------------------------------------ free: price the fan-out, rent nothing
  # Answers "would the market let us buy this right now, and at what number" WITHOUT renting anything, so a
  # hold can be reported with a live snapshot instead of an extrapolation from someone's earlier reading.
  # Same code path the launch job's gate uses — not a second opinion that is free to disagree with it.
  market_gate:
    needs: [resolve, test]
    if: ${{ needs.resolve.outputs.task == 'market-gate' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # `actions: write` is what lets this job dispatch the launch itself when the board clears — the
    # difference between a gate that reports and a gate that acts.
    permissions:
      contents: write
      actions: write
    env:
      VAST_API_KEY: ${{ secrets.VAST_API_KEY }}
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      # The credential a RENTED community host is given, forwarded in cleartext by _vast_onstart.
      # Scoped to the lane prefixes + six S3 actions a leg needs (s3_scoped_policy.py). Unset until
      # trimcrae creates the vast-leg-s3 user -> gpu_backend falls back to the broad key above, which
      # is why lanes in flight kept running. Runbook: research/compute/scoped-s3-credential-runbook.md
      VAST_S3_ACCESS_KEY_ID: ${{ secrets.VAST_S3_ACCESS_KEY_ID }}
      VAST_S3_SECRET_ACCESS_KEY: ${{ secrets.VAST_S3_SECRET_ACCESS_KEY }}
      VAST_S3_SCOPED_STS: ${{ vars.VAST_S3_SCOPED_STS }}
      AWS_DEFAULT_REGION: us-east-2
    steps:
      - uses: actions/checkout@v4
        with: { ref: "${{ github.ref_name }}", fetch-depth: 0 }
      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }
      - name: Price 4 legs, and LAUNCH THEM the moment the board clears
        # ★ SELF-CHAINING, BECAUSE AN AGENT IS NOT COVERAGE. The lesson from 7:47 PM is that a backgrounded
        # watcher does not survive the agent stopping, so "I have a poller armed" is not a plan. This step
        # does not report that the market cleared — it DISPATCHES the launch itself. The only thing anyone
        # (or any scheduler) has to do is re-run this task; whether that produces a hold or four rented
        # hosts is decided here, with no session in the loop.
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -eo pipefail
          python -m pip install -q boto3
          RC=0
          # ★★ `--gate-for-mode`, NOT `--market-gate 4` (2026-07-27). The literal 4 was the size of the
          # MODE, not of the purchase, so it stayed 4 after all four units were rented — and this gate went
          # on pricing a four-unit fleet, clearing, and dispatching a launch that could only rent nothing.
          # It did so at 12:08, 12:26 and 12:35 PM ET; the 12:39 PM rent row then recorded a 2.032x board
          # reading beside the word `launched`, which reads as buying over trimcrae's line. Nothing was
          # bought. The gate now derives the count from the units that actually still need a host, and
          # exit 3 means "nothing to launch" — a state that must NOT dispatch and is NOT a price hold.
          python research/modalities/ternary_vast_launch.py --mode edge_reps --gate-for-mode \
            --gate-out research/modalities/ternary-vast-market-hold.json || RC=$?
          git config user.name "Claude"; git config user.email "noreply@anthropic.com"
          # ★ RECORD THE AUTHORISATION ITSELF, BEFORE DISPATCHING (2026-07-27). This is the moment a launch
          # becomes authorised, and until today it left no durable trace of its own: the CLEAR snapshot went
          # into a file the dispatched launch then OVERWROTE with its own reading, so within four minutes
          # there was no evidence anywhere that a launch had ever been cleared and fired. The ledger row is
          # append-only and nothing downstream may rewrite it.
          if [ "$RC" = 0 ]; then
            python research/modalities/ternary_launch_ledger.py --record dispatched \
              --stage market-gate --gate research/modalities/ternary-vast-market-hold.json \
              --run-url "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}" \
              --reason "board cleared both ceilings; dispatching task=edge-reps" || true
          elif [ "$RC" = 3 ]; then
            # ⏭ NOTHING TO LAUNCH. Recorded — not silent — because CLAUDE.md §6's one prohibition on a gate
            # that declines to act is that declining must be VISIBLE. But recorded as its own word: this is
            # not a price hold (the board was never consulted) and it must not run the hold clock or fire
            # the hold warning, both of which exist for an expensive market rather than a working lane.
            python research/modalities/ternary_launch_ledger.py --record nothing-to-launch \
              --stage market-gate --gate research/modalities/ternary-vast-market-hold.json \
              --run-url "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}" \
              --reason "every unit already done or hosted; no launch dispatched, no rental attempted" || true
          fi
          git add research/modalities/ternary-vast-market-hold.json \
                  research/modalities/ternary-vast-launch-attempts.json
          if ! git diff --cached --quiet; then
            git commit -m "tvast market snapshot: $( [ "$RC" = 0 ] && echo CLEAR || echo HOLD ) for valB_mini r1+r2 (CI)"
            git pull --rebase --autostash origin "${{ github.ref_name }}" || true
            git push origin HEAD:"${{ github.ref_name }}" || true
          fi
          echo "market-gate exit=$RC (0 = clear to rent, 1 = hold on price, 3 = nothing needs a host)"

          if [ "$RC" = 0 ]; then
            echo "::notice title=TVAST MARKET CLEAR::board is within both ceilings — dispatching edge-reps."
            gh workflow run gpu-ternary-fep-vast.yml --ref "${{ github.ref_name }}" -f task=edge-reps
            exit 0
          fi

          if [ "$RC" = 3 ]; then
            # ⏭ THE SATISFIED-LANE PATH, AND THE WHOLE POINT OF THIS FIX: no dispatch. A launch here could
            # only print "nothing to rent", and three of them in 25 minutes is what made a working lane look
            # like a lane repeatedly buying over the buy line. Green, because nothing is wrong.
            echo "::notice title=TVAST NOTHING TO LAUNCH::every valB_mini unit is already done or already hosted — no launch dispatched and no rental attempted. The rates the lane is ALREADY paying are in research/modalities/ternary-vast-market-hold.json under live_host_rates."
            exit 0
          fi

          # ⏰ NO TIME-BASED ESCALATION. An earlier version failed this job once the hold passed 7:00 AM ET,
          # to fire GitHub's own notification without an agent awake. That was right while the hold was
          # still an open question, and is wrong now: the fork WAS surfaced to trimcrae on 2026-07-27 with
          # the numbers (gate CLEAR at $17.99 against a $22.28 ceiling, 2.05x basis, 12 h idle) and he chose
          # to keep holding until <=1.5x. Re-raising a question he has already answered is noise, and a
          # recurring red build is the most persistent kind of noise there is.
          #
          # So the hold is now a NORMAL, GREEN, VISIBLE state: the snapshot is committed on every single
          # evaluation, which is what makes it visible, and the job stays green because nothing is wrong.
          # Surface again only on a material CHANGE — the board clears and the launch fires (a ::notice::
          # above, plus the rented instances), or the 1.5x line turns out to be unreachable on this rung.
          echo "::warning title=TVAST MARKET HOLD::valB_mini r1+r2 held on price by trimcrae's <=1.5x-basis decision (2026-07-27). Snapshot: research/modalities/ternary-vast-market-hold.json. Re-checks hourly; launches itself the moment it clears."
          exit 0

  # ------------------------------------------------ free: valB_mini replicates — stage seeds 1+2 AND
  #                                                   prove the atom map before anything is rented
  # WHY THE REPLICATES NEED THEIR OWN PRIME. The `prime` job above hardcodes `seed0` in its cache key, and
  # that is correct rather than sloppy: `ternary_pdb_stage` sets starting_model_index = seed % n_models, so
  # seeds 1 and 2 start from DIFFERENT independently relaxed SMARCA2 models and sharing one cache would
  # silently collapse the replicate spread this programme uses as its error bar. The keys are built by
  # calling the launcher's own `stage_cache_key`, so there is exactly one expression for them in the repo.
  #
  # AND WHY IT ALSO RUNS THE MAP PRE-FLIGHT. `LomapAtomMapper(time=N)` is an MCS TIMEOUT and a timed-out MCS
  # returns its best PARTIAL match silently, so what the alchemical transformation IS depended on how fast
  # the rented host happened to be. Deriving the required heavy-atom count from the endpoints and checking
  # the production mapper against it costs $0 here and is the difference between two replicates and two
  # artifacts. It runs in the parity image, i.e. the same RDKit/OpenFE the hosts will run.
  reps_prime:
    needs: [resolve, test]
    if: ${{ needs.resolve.outputs.task == 'reps-prime' }}
    runs-on: ubuntu-latest
    timeout-minutes: 90
    concurrency:
      group: ternary-vast-mutate
      cancel-in-progress: false
    env:
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      # The credential a RENTED community host is given, forwarded in cleartext by _vast_onstart.
      # Scoped to the lane prefixes + six S3 actions a leg needs (s3_scoped_policy.py). Unset until
      # trimcrae creates the vast-leg-s3 user -> gpu_backend falls back to the broad key above, which
      # is why lanes in flight kept running. Runbook: research/compute/scoped-s3-credential-runbook.md
      VAST_S3_ACCESS_KEY_ID: ${{ secrets.VAST_S3_ACCESS_KEY_ID }}
      VAST_S3_SECRET_ACCESS_KEY: ${{ secrets.VAST_S3_SECRET_ACCESS_KEY }}
      VAST_S3_SCOPED_STS: ${{ vars.VAST_S3_SCOPED_STS }}
      AWS_DEFAULT_REGION: us-east-2
    steps:
      - uses: actions/checkout@v4
        with: { ref: "${{ github.ref_name }}" }
      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }
      - name: Stage every replicate unit on CPU and upload the seed-keyed caches
        run: |
          set -eo pipefail
          python -m pip install -q boto3
          echo "${{ secrets.DOCKERHUB_TOKEN }}" | docker login -u triskit23 --password-stdin
          mkdir -p /tmp/tin
          python - <<'PY' > /tmp/units.txt
          import sys
          sys.path.insert(0, "research/modalities")
          import ternary_vast_launch as tv
          for leg, seed, _d in tv.units_for("edge_reps"):
              print(leg, seed, tv.stage_cache_key(leg, "edge_reps", seed=seed))
          PY
          cat /tmp/units.txt
          while read -r LEG SEED KEY; do
            if aws s3 ls "$KEY" >/dev/null 2>&1; then echo "[reps-prime] HIT  $LEG seed=$SEED"; continue; fi
            echo "[reps-prime] MISS $LEG seed=$SEED -- staging on CPU"
            # ⚠ ONE STAGING DIRECTORY PER SEED, AND NEVER A DELETE. This loop first tried `rm -rf` on a
            # shared /tmp/tin/<leg> before restaging the next seed, and it FAILED THE WHOLE JOB at 7:47 PM
            # on 2026-07-26 (run 30225138660): the container writes as root into the bind mount, so the
            # staged tree is root-owned (`-rw-r--r-- 1 root root` in the job's own `ls -la`), the runner
            # user cannot remove it, `rm` exits 1 and `set -eo pipefail` kills the step. Both seed-1 units
            # had already staged and uploaded, so the failure was purely the cleanup between seeds.
            # `sudo rm -rf` would also work and is strictly worse: a per-seed directory removes the need to
            # delete anything, which means there is no ownership question and no half-deleted tree to
            # restage on top of.
            SDIR="/tmp/stage_seed${SEED}"
            mkdir -p "$SDIR"
            docker run --rm --entrypoint python \
              -v "$PWD/research/modalities:/work/research/modalities" -v "$SDIR:/tmp/tin" \
              -e SEED="$SEED" -e SSL_CERT_FILE=/etc/ssl/certs/ca-certificates.crt \
              -w /work/research/modalities \
              docker.io/triskit23/ternary-fep:latest \
              /work/research/modalities/ternary_pdb_stage.py \
                --leg-id "$LEG" --template-pdb 8G1Q --out /tmp/tin 2>&1 | tail -20
            ls -la "$SDIR/$LEG"
            # The staged tree MUST carry the seed's own SMARCA2 model. seed s -> model (s % n_models), so
            # seed 1 and seed 2 are different starting structures and a tar built from the wrong directory
            # would silently collapse the replicate spread this programme uses as its error bar.
            python3 - "$SDIR/$LEG/staging_manifest.json" "$SEED" <<'PY'
          import json, sys
          m = json.load(open(sys.argv[1])); want = int(sys.argv[2])
          sm = (m.get("starting_model") or {})
          got = sm.get("seed", m.get("seed"))
          if got is not None and int(got) != want:
              raise SystemExit(f"staged manifest says seed={got}, expected {want} — wrong tree")
          print(f"  [reps-prime] manifest ok: seed={got} model_index={sm.get('starting_model_index')} "
                f"of {sm.get('n_models_available')}")
          PY
            tar -C "$SDIR" -cf "/tmp/stage_${LEG}_${SEED}.tar" "$LEG"
            aws s3 cp "/tmp/stage_${LEG}_${SEED}.tar" "$KEY"
            echo "[reps-prime] uploaded $KEY ($(du -h /tmp/stage_${LEG}_${SEED}.tar | cut -f1))"
          done < /tmp/units.txt
      - name: $0 ATOM-MAP PRE-FLIGHT — refuse the launch if the map is short
        # This is the gate the whole replicate spend hangs on. A red step here means the map LOMAP returns
        # under the production budget is not the map the chemistry admits, i.e. the legs would run a
        # perturbation nobody designed — and would converge and report it confidently.
        run: |
          set -eo pipefail
          # ALWAYS FROM S3, never from whatever the staging step happened to leave on disk. The map is a
          # function of the two SmallMoleculeComponents built from ligands.sdf, and threed=False makes it
          # explicitly pose-independent — which is why one map is valid in the solvent, binary and ternary
          # legs (reviewer item 3). Reading the cache the HOSTS will read means this checks the bytes that
          # will actually be simulated, not a local copy that happens to agree.
          mkdir -p /tmp/tin
          while read -r LEG SEED KEY; do
            [ "$SEED" = "1" ] || continue
            aws s3 cp "$KEY" /tmp/pf.tar || { echo "::error::no stage cache at $KEY"; exit 1; }
            tar -C /tmp/tin -xf /tmp/pf.tar
          done < /tmp/units.txt
          ls -la /tmp/tin
          docker run --rm --entrypoint python \
            -v "$PWD/research/modalities:/work/research/modalities" -v /tmp/tin:/tmp/tin \
            -e RBFE_LOMAP_TIME_S=300 -e SSL_CERT_FILE=/etc/ssl/certs/ca-certificates.crt \
            -w /work/research/modalities \
            docker.io/triskit23/ternary-fep:latest \
            /work/research/modalities/valb_map_preflight.py \
              --input-dir /tmp/tin \
              --leg-id calib_hi_to_lo__ternary_vhl \
              --leg-id calib_hi_to_lo__binary_vhl \
              --out /tmp/tin/valb-map-preflight.json 2>&1 | tail -30
          cp /tmp/tin/valb-map-preflight.json research/modalities/valb-map-preflight.json
      - name: Commit the pre-flight record
        # The map each leg ran under is the one fact that decides whether replicates are comparable to each
        # other, and it is not recoverable after the fact from anything else in the artifacts.
        run: |
          set -eo pipefail
          git config user.name "Claude"; git config user.email "noreply@anthropic.com"
          git add research/modalities/valb-map-preflight.json
          if git diff --cached --quiet; then echo "pre-flight record unchanged"; else
            git commit -m "valB_mini reps: atom-map pre-flight record (CI)"
            git pull --rebase --autostash origin "${{ github.ref_name }}" || true
            git push origin HEAD:"${{ github.ref_name }}"
          fi

  # ------------------------------------------------------------ free: RUNG 5a-KS inputs (no crystal exists)
  # WHY 5a-KS NEEDS ITS OWN PRIME. The `prime` job above stages from a crystal (RCSB 8G1Q + a SMARCA2
  # homology model). RUNG 5a-KS has no crystal to stage from — there is no PDB entry for CRBN + an NR4A-LBD
  # + this construct, which is the entire reason the rung exists. Its inputs come from a Boltz-2 co-fold
  # (rung5aks-cofold.yml task=cofold) and are assembled here, on a free runner, then PRE-SEEDED into the
  # same stage cache the hosts read. `5aks`/`5aks_smoke` set STAGE_REQUIRED=1, so if this job has not run
  # the leg fails immediately with a clear message instead of silently falling through to the crystal
  # stager with a leg id it has never heard of.
  #
  # It runs in triskit23/ternary-fep for the standing parity reason: the RDKit that assigns the ligand's
  # bond orders here is the one the FEP leg will read that SDF with.
  prime_5aks:
    needs: [resolve, test]
    if: ${{ needs.resolve.outputs.task == '5aks-prime' }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    concurrency:
      group: ternary-vast-mutate
      cancel-in-progress: false
    env:
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      # The credential a RENTED community host is given, forwarded in cleartext by _vast_onstart.
      # Scoped to the lane prefixes + six S3 actions a leg needs (s3_scoped_policy.py). Unset until
      # trimcrae creates the vast-leg-s3 user -> gpu_backend falls back to the broad key above, which
      # is why lanes in flight kept running. Runbook: research/compute/scoped-s3-credential-runbook.md
      VAST_S3_ACCESS_KEY_ID: ${{ secrets.VAST_S3_ACCESS_KEY_ID }}
      VAST_S3_SECRET_ACCESS_KEY: ${{ secrets.VAST_S3_SECRET_ACCESS_KEY }}
      VAST_S3_SCOPED_STS: ${{ vars.VAST_S3_SCOPED_STS }}
      AWS_DEFAULT_REGION: us-east-2
      COFOLD_PREFIX: ${{ github.event.inputs.cofold_prefix }}
    steps:
      - uses: actions/checkout@v4
        with: { ref: "${{ github.ref_name }}" }
      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }
      - name: Pull the co-folds, stage both legs, and seed the stage cache
        run: |
          set -eo pipefail
          python -m pip install -q boto3
          echo "${{ secrets.DOCKERHUB_TOKEN }}" | docker login -u triskit23 --password-stdin
          B="${VAST_CKPT_BUCKET:-sagemaker-us-east-2-646605541856}"
          P="${COFOLD_PREFIX:-rung5aks-cofold-v1}"
          mkdir -p /tmp/cofold /tmp/5aks_in
          aws s3 cp "s3://$B/$P/" /tmp/cofold/ --recursive --exclude '*' --include '*.cif' --only-show-errors
          # A co-fold set that did not land is the ONLY thing this job can be missing, and staging nothing
          # would otherwise seed nothing and report success.
          test "$(find /tmp/cofold -name '*.cif' | wc -l)" -ge 2 \
            || { echo "::error::fewer than 2 co-fold CIFs under s3://$B/$P — run rung5aks-cofold.yml task=cofold first"; exit 1; }
          find /tmp/cofold -name '*.cif' -printf '  %s B  %p\n'
          docker run --rm --entrypoint python \
            -v "$PWD/research/modalities:/work/research/modalities" \
            -v /tmp/cofold:/tmp/cofold -v /tmp/5aks_in:/tmp/5aks_in \
            -w /work/research/modalities \
            docker.io/triskit23/ternary-fep:latest \
            /work/research/modalities/nr4a3_5aks_stage.py \
              --cofold-dir /tmp/cofold --out-dir /tmp/5aks_in
          echo "=== staged tree ==="; find /tmp/5aks_in -type f -printf '  %s B  %p\n'
          python research/modalities/ternary_vast_launch.py --mode 5aks --seed-stage-cache /tmp/5aks_in
      - name: The staged inputs are committed, so the structures that were simulated are auditable
        run: |
          set -eo pipefail
          mkdir -p research/modalities/5aks_fep_inputs
          # The manifests only -- complex.pdb is megabytes of predicted coordinates and lives in S3. What
          # has to be in git is WHICH structure each leg started from and what it resolved.
          for d in /tmp/5aks_in/*/; do
            leg=$(basename "$d"); mkdir -p "research/modalities/5aks_fep_inputs/$leg"
            cp "$d/staging_manifest.json" "research/modalities/5aks_fep_inputs/$leg/" || true
          done
          git config user.name "Claude"; git config user.email "noreply@anthropic.com"
          git add research/modalities/5aks_fep_inputs
          if git diff --cached --quiet; then echo "manifests unchanged"; else
            git commit -m "RUNG 5a-KS: staging manifests for the two ternary legs (CI)"
            git pull --rebase --autostash origin "${{ github.ref_name }}" || true
            git push origin HEAD:"${{ github.ref_name }}"
          fi


  # ============================================================================================ THE TRIANGLE
  # ★ WHAT THIS RUNG BUYS, because a reader six months from now will otherwise price it as "another edge".
  # The closure residual R = ddG_coop(T1) + ddG_coop(T2) - ddG_coop(T3) is IDENTICALLY ZERO for any error
  # that is a function of the endpoint STATE — force field, the SMARCA4->SMARCA2 homology substitution, NAGL
  # charges, protonation — because each is a per-endpoint bias and sum_cycle [eps(B)-eps(A)] telescopes to
  # exactly zero. R is non-zero ONLY for PATH error. So R decides whether r0's 1.478 kcal/mol miss is fixable
  # by sampling AT ALL: R ~ 0 says it is not (the miss is in the model or the reference data, where closure is
  # provably blind), R materially non-zero says it is. That is a discriminating experiment, which is the whole
  # reason 4 legs are worth buying — and it is 4, not 6, because r0 IS the T1 edge and is reused unaltered.
  #
  # THE THREE INVARIANTS, all of which turn R from a path-error detector into a protocol-difference detector
  # if broken, and every one of them is enforced in code rather than remembered:
  #   * 2 fs / 1 fs   — pinned by `MODES['triangle']`, because r0 is a 2 fs leg and this lane defaults to 4 fs.
  #   * SEED 0        — ternary seed s selects the s%n-th relaxed SMARCA2 model; mixed seeds are different
  #                     Hamiltonians and |R| would measure homology-model sensitivity instead.
  #   * UNRESTRAINED binary legs — matching r0. A separate lane is concurrently building a RESTRAINED binary
  #                     re-run for a DIFFERENT purpose; the two must never be conflated or their legs mixed.

  # ---------------------------------------------------------- free: derive the third vertex, once, and freeze it
  # cmpd4" exists in no crystal. It is DERIVED — exactly as cmpd4 itself is in `wurz-calib-frozen.json` — and
  # frozen here so that what was simulated is recoverable from git rather than recomputed by whatever RDKit
  # happens to be installed later. Two INDEPENDENT routes (edit the frozen cmpd4; edit the frozen cmpd1 twice)
  # must produce the identical canonical SMILES: that agreement is the closure PREREQUISITE, because if the
  # two constructions disagree the three edges do not share endpoints and R is not a closure residual at all.
  # Runs in the parity image: the RDKit that derives the molecule is the RDKit the legs will read it with.
  triangle_freeze:
    needs: [resolve, test]
    if: ${{ needs.resolve.outputs.task == 'triangle-freeze' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with: { ref: "${{ github.ref_name }}" }
      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }
      - name: Derive cmpd4" by two independent routes, in the production mapper's own container
        run: |
          set -eo pipefail
          # ⏱ RETRY THE LOGIN. Measured on run 30293740988: `docker login` failed with
          # `Get "https://registry-1.docker.io/v2/": context deadline exceeded` — a Docker Hub connect
          # timeout on the runner, nothing to do with this lane's code. It killed a $0 job that had
          # already checked out and set up Python. Three spaced attempts cost seconds and remove a
          # whole class of red builds that say nothing about the science.
          for i in 1 2 3; do
            echo "${{ secrets.DOCKERHUB_TOKEN }}" | docker login -u triskit23 --password-stdin && break
            echo "[docker] login attempt $i failed — retrying in 20s"; sleep 20
          done
          docker run --rm --entrypoint python \
            -v "$PWD/research/modalities:/work/research/modalities" \
            -w /work/research/modalities \
            docker.io/triskit23/ternary-fep:latest \
            /work/research/modalities/valb_triangle_legs.py --derive
          sudo chown "$(id -u):$(id -g)" research/modalities/valb-triangle-frozen.json 2>/dev/null || true
      - name: Re-derive and refuse any drift
        # `derive()` succeeding is not the same as the freeze on disk matching it — the same discipline
        # `ternary_coop.load_pilot_legs` applies to the pilot bundle. A freeze that no longer re-derives is a
        # silent scientific drift, and this is the last moment it costs nothing to catch.
        run: |
          set -eo pipefail
          docker run --rm --entrypoint python \
            -v "$PWD/research/modalities:/work/research/modalities" \
            -w /work/research/modalities \
            docker.io/triskit23/ternary-fep:latest \
            /work/research/modalities/valb_triangle_legs.py --verify
      - name: Commit the freeze — the molecule that will be simulated must be in git BEFORE it is simulated
        run: |
          set -eo pipefail
          git config user.name "Claude"; git config user.email "noreply@anthropic.com"
          git add research/modalities/valb-triangle-frozen.json
          if git diff --cached --quiet; then echo "freeze unchanged"; else
            git commit -m "valB closure triangle: freeze cmpd4\" (two independent routes agree) (CI)"
            git pull --rebase --autostash origin "${{ github.ref_name }}" || true
            git push origin HEAD:"${{ github.ref_name }}"
          fi

  # ------------------------------------------------- free: stage all four legs on CPU AND prove both new maps
  # Two wins, both real: it removes ~8-15 min of GPU-idle staging from EACH paid host, and it discovers a
  # first-time staging failure for two brand-new leg ids at $0 instead of on a 4090.
  #
  # AND THE ATOM-MAP PRE-FLIGHT IS THE GATE THE WHOLE SPEND HANGS ON. `LomapAtomMapper(time=N)` is an MCS
  # TIMEOUT, and a timed-out MCS returns its best PARTIAL match SILENTLY — so a leg can converge and report a
  # confident ΔG for a perturbation nobody designed. That risk is HIGHER here than on any previous rung,
  # because T3 (cmpd1 -> cmpd4") is a ring-nitrogen 1,2-SHIFT: two changed atoms rather than one, and the
  # first perturbation on this lane that no single-atom pose mutation can build.
  triangle_prime:
    needs: [resolve, test]
    if: ${{ needs.resolve.outputs.task == 'triangle-prime' }}
    runs-on: ubuntu-latest
    timeout-minutes: 90
    concurrency:
      group: ternary-vast-mutate
      cancel-in-progress: false
    env:
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      VAST_S3_ACCESS_KEY_ID: ${{ secrets.VAST_S3_ACCESS_KEY_ID }}
      VAST_S3_SECRET_ACCESS_KEY: ${{ secrets.VAST_S3_SECRET_ACCESS_KEY }}
      VAST_S3_SCOPED_STS: ${{ vars.VAST_S3_SCOPED_STS }}
      AWS_DEFAULT_REGION: us-east-2
    steps:
      - uses: actions/checkout@v4
        with: { ref: "${{ github.ref_name }}" }
      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }
      - name: The freeze must exist BEFORE anything is staged
        # Without it `ternary_coop_prep._morph_endpoints` returns calib_lo2 unresolved, and the stager would
        # fail deep inside a container with a message about a missing SMILES. Failing here says what to do.
        run: |
          set -eo pipefail
          test -s research/modalities/valb-triangle-frozen.json \
            || { echo "::error::no valb-triangle-frozen.json — run task=triangle-freeze first"; exit 1; }
          python3 -c "import json;d=json.load(open('research/modalities/valb-triangle-frozen.json'));print('calib_lo2 =', d['calib_lo2']['smiles'])"
      - name: Stage every triangle leg on CPU and upload the caches
        run: |
          set -eo pipefail
          python -m pip install -q boto3
          # ⏱ RETRY THE LOGIN. Measured on run 30293740988: `docker login` failed with
          # `Get "https://registry-1.docker.io/v2/": context deadline exceeded` — a Docker Hub connect
          # timeout on the runner, nothing to do with this lane's code. It killed a $0 job that had
          # already checked out and set up Python. Three spaced attempts cost seconds and remove a
          # whole class of red builds that say nothing about the science.
          for i in 1 2 3; do
            echo "${{ secrets.DOCKERHUB_TOKEN }}" | docker login -u triskit23 --password-stdin && break
            echo "[docker] login attempt $i failed — retrying in 20s"; sleep 20
          done
          mkdir -p /tmp/tin
          python - <<'PY' > /tmp/units.txt
          import sys
          sys.path.insert(0, "research/modalities")
          import ternary_vast_launch as tv
          for leg, seed, _d in tv.units_for("triangle"):
              print(leg, seed, tv.stage_cache_key(leg, "triangle", seed=seed))
          PY
          cat /tmp/units.txt
          while read -r LEG SEED KEY; do
            if aws s3 ls "$KEY" >/dev/null 2>&1; then echo "[triangle-prime] HIT  $LEG seed=$SEED"; continue; fi
            echo "[triangle-prime] MISS $LEG seed=$SEED -- staging on CPU"
            # One directory per leg and NEVER a delete: the container writes as root into the bind mount, so a
            # shared directory cannot be cleaned up by the runner user and `rm` would fail the whole job under
            # `set -eo pipefail` (measured on the reps-prime job, 2026-07-26, run 30225138660).
            SDIR="/tmp/stage_${LEG}"
            mkdir -p "$SDIR"
            T0=$(date +%s)
            # ⏱ STREAM IT, WITH TIMESTAMPS — DO NOT `| tail -20`. Measured on run 30295025398: this step sat
            # on its FIRST leg for 20+ minutes emitting NOTHING, because `tail` cannot print until the
            # container exits. A staging phase that is genuinely slow and one that has hung are then
            # indistinguishable, which is exactly the "liveness, not progress" trap CLAUDE.md §4 is about —
            # and it cost a cancellation decision made without evidence. `-u` and `PYTHONUNBUFFERED` are both
            # set because the stager's own prints are block-buffered into a pipe otherwise.
            docker run --rm --entrypoint python \
              -v "$PWD/research/modalities:/work/research/modalities" -v "$SDIR:/tmp/tin" \
              -e SEED="$SEED" -e PYTHONUNBUFFERED=1 -e SSL_CERT_FILE=/etc/ssl/certs/ca-certificates.crt \
              -w /work/research/modalities \
              docker.io/triskit23/ternary-fep:latest -u \
              /work/research/modalities/ternary_pdb_stage.py \
                --leg-id "$LEG" --template-pdb 8G1Q --out /tmp/tin 2>&1 \
              | while IFS= read -r line; do printf '%s [stage %s] %s\n' "$(date -u +%H:%M:%SZ)" "$LEG" "$line"; done
            echo "[triangle-prime] $LEG staged in $(( $(date +%s) - T0 ))s"
            ls -la "$SDIR/$LEG"
            tar -C "$SDIR" -cf "/tmp/stage_${LEG}_${SEED}.tar" "$LEG"
            aws s3 cp "/tmp/stage_${LEG}_${SEED}.tar" "$KEY"
            echo "[triangle-prime] uploaded $KEY ($(du -h /tmp/stage_${LEG}_${SEED}.tar | cut -f1))"
          done < /tmp/units.txt
      - name: $0 ATOM-MAP PRE-FLIGHT — refuse the launch if either new map is short
        run: |
          set -eo pipefail
          mkdir -p /tmp/pf
          while read -r LEG SEED KEY; do
            aws s3 cp "$KEY" /tmp/pf.tar || { echo "::error::no stage cache at $KEY"; exit 1; }
            tar -C /tmp/pf -xf /tmp/pf.tar
          done < /tmp/units.txt
          ls -la /tmp/pf
          docker run --rm --entrypoint python \
            -v "$PWD/research/modalities:/work/research/modalities" -v /tmp/pf:/tmp/pf \
            -e RBFE_LOMAP_TIME_S=300 -e SSL_CERT_FILE=/etc/ssl/certs/ca-certificates.crt \
            -w /work/research/modalities \
            docker.io/triskit23/ternary-fep:latest \
            /work/research/modalities/valb_map_preflight.py \
              --input-dir /tmp/pf \
              --leg-id calib_lo_to_lo2__ternary_vhl \
              --leg-id calib_lo_to_lo2__binary_vhl \
              --leg-id calib_hi_to_lo2__ternary_vhl \
              --leg-id calib_hi_to_lo2__binary_vhl \
              --out /tmp/pf/valb-triangle-map-preflight.json 2>&1 | tail -40
          cp /tmp/pf/valb-triangle-map-preflight.json research/modalities/valb-triangle-map-preflight.json
      - name: Commit the pre-flight record
        run: |
          set -eo pipefail
          git config user.name "Claude"; git config user.email "noreply@anthropic.com"
          git add research/modalities/valb-triangle-map-preflight.json
          if git diff --cached --quiet; then echo "pre-flight record unchanged"; else
            git commit -m "valB closure triangle: atom-map pre-flight for T2 and T3 (CI)"
            git pull --rebase --autostash origin "${{ github.ref_name }}" || true
            git push origin HEAD:"${{ github.ref_name }}"
          fi

  # ------------------------------------------------ free: price the 4 legs, rent nothing, and self-dispatch
  # Same code path the launch job's board snapshot uses — not a second opinion free to disagree with it. The
  # dollar ceiling here is the TRIANGLE's own costed range (`valb_triangle_closure.price_triangle`), not the
  # ladder's 4 fs recalibration band: judging one experiment's spend against another's authorisation is how a
  # guard comes to refuse a small approved purchase for a reason that does not apply to it.
  triangle_gate:
    needs: [resolve, test]
    if: ${{ needs.resolve.outputs.task == 'triangle-gate' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
      actions: write
    env:
      VAST_API_KEY: ${{ secrets.VAST_API_KEY }}
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      VAST_S3_ACCESS_KEY_ID: ${{ secrets.VAST_S3_ACCESS_KEY_ID }}
      VAST_S3_SECRET_ACCESS_KEY: ${{ secrets.VAST_S3_SECRET_ACCESS_KEY }}
      VAST_S3_SCOPED_STS: ${{ vars.VAST_S3_SCOPED_STS }}
      AWS_DEFAULT_REGION: us-east-2
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with: { ref: "${{ github.ref_name }}", fetch-depth: 0 }
      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }
      - name: Price the triangle, and LAUNCH it the moment the board clears
        run: |
          set -eo pipefail
          python -m pip install -q boto3
          RC=0
          python research/modalities/ternary_vast_launch.py --mode triangle --gate-for-mode \
            --gate-out research/modalities/valb-triangle-market-hold.json || RC=$?
          git config user.name "Claude"; git config user.email "noreply@anthropic.com"
          if [ "$RC" = 0 ]; then
            python research/modalities/ternary_launch_ledger.py --record dispatched \
              --stage triangle-gate --gate research/modalities/valb-triangle-market-hold.json \
              --run-url "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}" \
              --reason "board cleared both ceilings; dispatching task=triangle" || true
          elif [ "$RC" = 3 ]; then
            python research/modalities/ternary_launch_ledger.py --record nothing-to-launch \
              --stage triangle-gate --gate research/modalities/valb-triangle-market-hold.json \
              --run-url "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}" \
              --reason "every triangle leg already done or hosted; no launch dispatched, no rental attempted" || true
          fi
          # ⛔ THE SNAPSHOT IS COMMITTED ON EVERY EVALUATION, CLEAR OR HOLD. CLAUDE.md §6's one prohibition on
          # a gate that declines to buy is that declining must never be SILENT: a fleet that never launched
          # looks identical to one that finished, and the only thing that tells them apart is a hold readout
          # carrying the market snapshot that caused it.
          git add research/modalities/valb-triangle-market-hold.json \
                  research/modalities/ternary-vast-launch-attempts.json
          if ! git diff --cached --quiet; then
            git commit -m "valB triangle market snapshot: $( [ "$RC" = 0 ] && echo CLEAR || echo HOLD ) (CI)"
            git pull --rebase --autostash origin "${{ github.ref_name }}" || true
            git push origin HEAD:"${{ github.ref_name }}" || true
          fi
          echo "triangle-gate exit=$RC (0 = clear to rent, 1 = hold on price, 3 = nothing needs a host)"
          if [ "$RC" = 0 ]; then
            echo "::notice title=TRIANGLE MARKET CLEAR::board is within BOTH the triangle's own dollar ceiling and the \$/ns buy line — dispatching task=triangle."
            gh workflow run gpu-ternary-fep-vast.yml --ref "${{ github.ref_name }}" -f task=triangle
            exit 0
          fi
          if [ "$RC" = 3 ]; then
            echo "::notice title=TRIANGLE NOTHING TO LAUNCH::every triangle leg is already done or already hosted — no launch dispatched, no rental attempted."
            exit 0
          fi
          # A HOLD IS A NORMAL, GREEN, VISIBLE STATE — never a red build. The snapshot is committed above,
          # which is what makes it visible; failing the job would only add recurring noise to a decision that
          # is already recorded. Never raise a bid to clear it, and never launch past the ceiling.
          echo "::warning title=TRIANGLE MARKET HOLD::the valB closure triangle is HELD on price. Snapshot (with the offers that caused it): research/modalities/valb-triangle-market-hold.json. Re-checks on the next tick and launches itself the moment it clears."
          exit 0

  # ------------------------------------------------------------------------ free: the closure residual R
  # R is computed from SIX leg records: the four bought here plus r0's ternary and binary, which are FETCHED
  # rather than re-run — that reuse is the whole economy of the design. The reducer REFUSES a mixed seed, a
  # mixed direction, a solvent leg, a duplicate record or a missing leg, because each of those computes a
  # different quantity while looking identical.
  triangle_reduce:
    needs: resolve
    if: ${{ needs.resolve.outputs.task == 'triangle-reduce' }}
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      VAST_S3_ACCESS_KEY_ID: ${{ secrets.VAST_S3_ACCESS_KEY_ID }}
      VAST_S3_SECRET_ACCESS_KEY: ${{ secrets.VAST_S3_SECRET_ACCESS_KEY }}
      VAST_S3_SCOPED_STS: ${{ vars.VAST_S3_SCOPED_STS }}
      AWS_DEFAULT_REGION: us-east-2
    steps:
      - uses: actions/checkout@v4
        with: { ref: "${{ github.ref_name }}", fetch-depth: 0 }
      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }
      - id: auth
        name: Authenticate to GCP (keyless, WIF) — because T1 DOES NOT LIVE IN THIS LANE'S S3
        # ⚠ THE GAP THIS CLOSES, FOUND BEFORE IT COST A REDUCTION. r0 ran on the GCP L4 lane, so its two leg
        # records are in `gs://<project>-rbfe-ckpt/valB-6hax/results/`, NOT in `ternary-vast/legs/`. Fetching
        # T1 with the Vast launcher's `--fetch-legs` would return nothing and the reducer would report
        # INCOMPLETE — loudly, which is the design working, but for a reason that is pure plumbing. The
        # triangle's entire economy is that r0 is REUSED rather than re-bought, so the reduce job has to be
        # able to reach the lane r0 actually ran on.
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: projects/878095411563/locations/global/workloadIdentityPools/github-pool/providers/github-provider
          service_account: gpu-runner@project-a7ebde30-e2ed-4b8d-9a9.iam.gserviceaccount.com
      - name: Set up gcloud
        uses: google-github-actions/setup-gcloud@v2
      - name: Pull the four triangle legs (S3) AND r0's two (GCS) — T1 is reused, never re-run
        run: |
          set -eo pipefail
          python -m pip install -q boto3
          mkdir -p /tmp/tri
          python research/modalities/ternary_vast_launch.py --mode triangle --fetch-legs /tmp/tri 2>&1 | tail -20
          PROJECT=project-a7ebde30-e2ed-4b8d-9a9
          RESULTS="gs://${PROJECT}-rbfe-ckpt/valB-6hax/results"
          echo "=== pulling T1 (r0) from $RESULTS ==="
          for L in calib_hi_to_lo__ternary_vhl calib_hi_to_lo__binary_vhl; do
            # ⛔ THE UNSUFFIXED, FORWARD, SEED-0 NAME ONLY — never a glob. The GCP lane writes a RESTRAINED
            # leg's result to `leg_<id>_<dir>_r<seed>_rst.json` precisely so it is NOT folded into the
            # unrestrained cycle automatically, and it writes the REVERSE leg as `_rev_`. Both live in this
            # same bucket. A `leg_*.json` glob here would quietly pull a restrained or reverse T1 into an
            # unrestrained forward triangle, and R would then measure the PROTOCOL DIFFERENCE — the one
            # failure this whole rung is built to avoid. Naming the exact file makes that impossible.
            gcloud storage cp "$RESULTS/leg_${L}_fwd_r0.json" /tmp/tri/ \
              || { echo "::error::T1's leg record ${L} is not at $RESULTS — the triangle cannot close without r0"; exit 1; }
          done
          ls -la /tmp/tri
      - name: Reduce to R, in the SAME env that produced the trajectories
        run: |
          set -eo pipefail
          # ⏱ RETRY THE LOGIN. Measured on run 30293740988: `docker login` failed with
          # `Get "https://registry-1.docker.io/v2/": context deadline exceeded` — a Docker Hub connect
          # timeout on the runner, nothing to do with this lane's code. It killed a $0 job that had
          # already checked out and set up Python. Three spaced attempts cost seconds and remove a
          # whole class of red builds that say nothing about the science.
          for i in 1 2 3; do
            echo "${{ secrets.DOCKERHUB_TOKEN }}" | docker login -u triskit23 --password-stdin && break
            echo "[docker] login attempt $i failed — retrying in 20s"; sleep 20
          done
          docker run --rm --entrypoint python \
            -v "$PWD/research/modalities:/work/research/modalities" \
            -v /tmp/tri:/tmp/tri \
            -w /work/research/modalities \
            docker.io/triskit23/ternary-fep:latest \
            /work/research/modalities/valb_triangle_reduce.py --legs /tmp/tri \
              --out /work/research/modalities/valb-triangle-reduction.json
          sudo chown "$(id -u):$(id -g)" research/modalities/valb-triangle-reduction.json 2>/dev/null || true
      - name: The residual is the DELIVERABLE, so its absence is a failure
        run: |
          set -eo pipefail
          F=research/modalities/valb-triangle-reduction.json
          test -s "$F" || { echo "::error::no reduction written"; exit 1; }
          python3 - <<'PY'
          import json, sys
          d = json.load(open("research/modalities/valb-triangle-reduction.json"))
          print(json.dumps(d, indent=1)[:6000])
          dec = d.get("decision")
          if dec in ("REFUSED", "INCOMPLETE"):
              print(f"::error::the reduction returned {dec}: {d.get('reason')}")
              sys.exit(1)
          print("::notice title=valB CLOSURE TRIANGLE::R = %s (R_ternary = %s, R_binary = %s) -> %s"
                % (d.get("R_kcal"), d.get("R_ternary_kcal"), d.get("R_binary_kcal"), dec))
          PY
      - name: Verdict LAST — and both closures, never R alone
        run: |
          set +e
          echo "================ valB CLOSURE TRIANGLE ================"
          python3 - <<'PY'
          import json
          d = json.load(open("research/modalities/valb-triangle-reduction.json"))
          print("R_ternary = %s   R_binary = %s   R = %s" % (d.get("R_ternary_kcal"), d.get("R_binary_kcal"), d.get("R_kcal")))
          print("decision  =", d.get("decision"))
          print()
          print(d.get("reading", ""))
          print()
          print("HONEST LIMIT:", d.get("honest_limit", ""))
          PY
      - name: Commit the reduction
        run: |
          set -eo pipefail
          git config user.name "Claude"; git config user.email "noreply@anthropic.com"
          git add research/modalities/valb-triangle-reduction.json
          if git diff --cached --quiet; then echo "reduction unchanged"; else
            git commit -m "valB closure triangle: the residual R (CI, parity image)"
            git pull --rebase --autostash origin "${{ github.ref_name }}" || true
            git push origin HEAD:"${{ github.ref_name }}"
          fi

  # ------------------------------------------------------------------ paid: rent hosts
  launch:
    needs: [resolve, test]
    if: ${{ needs.resolve.outputs.task == 'smoke' || needs.resolve.outputs.task == 'probe' || needs.resolve.outputs.task == 'edge' || needs.resolve.outputs.task == 'edge-reps' || needs.resolve.outputs.task == '5aks-smoke' || needs.resolve.outputs.task == '5aks' || needs.resolve.outputs.task == 'triangle-smoke' || needs.resolve.outputs.task == 'triangle' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    concurrency:
      group: ternary-vast-mutate
      cancel-in-progress: false
    env:
      VAST_API_KEY: ${{ secrets.VAST_API_KEY }}
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      # The credential a RENTED community host is given, forwarded in cleartext by _vast_onstart.
      # Scoped to the lane prefixes + six S3 actions a leg needs (s3_scoped_policy.py). Unset until
      # trimcrae creates the vast-leg-s3 user -> gpu_backend falls back to the broad key above, which
      # is why lanes in flight kept running. Runbook: research/compute/scoped-s3-credential-runbook.md
      VAST_S3_ACCESS_KEY_ID: ${{ secrets.VAST_S3_ACCESS_KEY_ID }}
      VAST_S3_SECRET_ACCESS_KEY: ${{ secrets.VAST_S3_SECRET_ACCESS_KEY }}
      VAST_S3_SCOPED_STS: ${{ vars.VAST_S3_SCOPED_STS }}
      AWS_DEFAULT_REGION: us-east-2
      GIT_BRANCH: ${{ github.ref_name }}
      TVAST_IMAGE: ${{ github.event.inputs.vast_image }}
      TVAST_TIMESTEP_FS: ${{ github.event.inputs.timestep_fs }}
      TVAST_WARMUP_TIMESTEP_FS: ${{ github.event.inputs.warmup_timestep_fs }}
    steps:
      - uses: actions/checkout@v4
        # fetch-depth 0 because the arm step below commits and pushes the watch list, and a shallow clone
        # cannot rebase onto a branch another job (or the agent) has moved in the meantime.
        with: { ref: "${{ github.ref_name }}", fetch-depth: 0 }
      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }

      # ================================================================================================
      # ⛔ WHERE THE PRICE GUARD LIVES NOW, AND WHY IT MOVED (2026-07-27 — this cost two authorised launches)
      # ================================================================================================
      # WHAT USED TO BE HERE: a second, independent, FATAL `--market-gate 4` that ran AFTER the atom-map
      # pre-flight and re-decided the whole purchase from scratch.
      #
      # WHAT IT DID. At 9:12 AM ET the `market_gate` job read the board at 1.261x basis, cleared, and
      # dispatched this workflow. This job then spent 2 m 35 s pulling the ternary-fep image for the
      # pre-flight and re-read the board at 9:16:28 AM ET: 2.436x. HOLD, exit 1, nothing rented. Again at
      # 9:23 -> 9:26 AM ET (1.455x -> 1.904x). So a launch required TWO independent board reads, 3 m 24 s
      # apart, to BOTH clear the same 1.5x line — and on a board that doubles inside that window the second
      # read is close to an independent draw. The gate was not wrong either time; the pipeline was built so
      # that clearing it could not actually buy anything.
      #
      # WHY REMOVING IT IS NOT A WEAKENING — IT IS STRICTLY STRONGER. The board-mean test was always the
      # wrong instrument for "may we rent THIS host": a mean under the line can contain an offer over it,
      # pulled down by cheaper siblings (trimcrae, 2026-07-27: *"Why are there so many high $/ns rows that
      # are flagged but you're still paying for them?"*). The refusal now lives at SELECTION, as
      # `ResourceSpec.max_usd_per_ns` = 1.5x basis, travelling with the JobSpec into
      # `rank_offers_by_usd_per_ns` — so no offer above the line is even visible to the renter, on every
      # fallback after a capacity refusal too. Nothing above 1.5x can be bought by this lane, from any path,
      # including a resume. That is CLAUDE.md §6's "a relaunch is a new purchase" enforced structurally
      # rather than by a step someone has to remember to keep in front of the rental.
      #
      # AND UNITS ARE NO LONGER ALL-OR-NOTHING, which is trimcrae's own 2026-07-27 ruling on the sibling
      # lane: *"The fanout fleet doesn't all have to run at the same time. If 5 GPUs are cheap enough and
      # the rest aren't, only run 5."* What the board can supply under the line is bought; the rest are
      # picked up by the next hourly tick, from checkpoints, at no loss. §6's one prohibition — do not drop
      # units SILENTLY — is met by the ledger step below, and renting zero units is a RED job.
      - name: Board snapshot ($/ns) — FIRST, cheap, and advisory
        # Runs BEFORE the image pull, not after it, because a price reading taken behind a 2.5-minute
        # docker pull is a reading of a different market than the one that authorised the launch.
        # Non-fatal by design: it exists to put the numbers in the log and the ledger beside what was
        # actually bought, so a launch can be graded against the board it faced. It writes its OWN file —
        # the launch must never overwrite `ternary-vast-market-hold.json`, because on 2026-07-27 doing
        # exactly that erased the CLEAR snapshot that had authorised the dispatch and left the lane looking
        # like an ordinary hold.
        #
        # ⚠ AND IT PRICES THE UNITS THIS LAUNCH WILL ACTUALLY RENT, NOT A FIXED FOUR (2026-07-27). This step
        # is where the 12:39 PM ET row's `gate_ratio_vs_basis: 2.032` came from. It was a mean over the four
        # cheapest offers on the board — for a launch that went on to rent NOTHING, because all four units
        # were already running. A board mean for a purchase that never happens is not "the board it faced";
        # it is a number with no referent, and it sat in the ledger beside the word `launched` reading as a
        # 2.03x buy. With `--gate-for-mode` a zero-rental tick records "nothing to launch" instead.
        continue-on-error: true
        run: |
          set -eo pipefail
          python -m pip install -q boto3
          # ★ THE MODE BEING LAUNCHED, NOT A HARDCODED ONE. `--gate-for-mode` derives the unit count from
          # the units that still need a host, but the MODE decides which units those are AND which
          # authorisation the dollars are judged against — the triangle's band is `price_triangle()`'s, not
          # the ladder's 4 fs recalibration band. Pricing a triangle launch as edge_reps would put a board
          # reading for a purchase that is not happening beside the word `launched`, which is exactly the
          # 12:39 PM ET defect this step already carries a note about.
          MODE=$(printf '%s' "${{ needs.resolve.outputs.task }}" | tr '-' '_')
          python research/modalities/ternary_vast_launch.py --mode "$MODE" --gate-for-mode \
            --gate-out /tmp/launch-board.json || true

      - name: ATOM-MAP GATE — the launch cannot rent until the map is proven complete
        # ★ STRUCTURAL, NOT REMEMBERED. `reps-prime` already runs this, but a gate that depends on someone
        # having dispatched the right task first is not a gate. `LomapAtomMapper(time=N)` silently returns a
        # PARTIAL map when its MCS times out, and a leg under a short map converges and returns a confident
        # ΔG for a perturbation nobody designed — while `protocol_hash` (settings only), system identity
        # (particle counts, unchanged by dummy-isation) and the 5-part gate (which reads unmapped atoms as
        # evidence of "a real perturbation") all report green. This step derives the required heavy-atom
        # count from the endpoints' own MCS and fails the job BEFORE any rental if the mapper falls short.
        # Cost: one image pull. Cost of not having it: two full replicate rentals that answer nothing.
        #
        # ★★ AND IT RECORDS WHICH PHASE IT REACHED, BECAUSE A GATE THAT DIED IS NOT A GATE THAT REFUSED
        # (2026-07-27, 6:01 PM ET). `task=triangle-smoke` (run 30309074338) failed in this step and the
        # ledger filed `failed` / "job status failure". Read beside this step's NAME — which says the launch
        # cannot rent until the map is proven complete — that row is indistinguishable from the mapper
        # coming up short on T3's closing edge, the one genuinely hard map in the set and so the first thing
        # a reader suspects. It had not: `docker login` timed out 15.5 s in (`auth.docker.io ... context
        # deadline exceeded`), so the units file, the stage pull and the pre-flight container never ran, and
        # the four maps had already measured COMPLETE at 3:54 PM ET (`valb-triangle-map-preflight.json`:
        # 59/59 heavy atoms on all four legs, T3's closing edge included). A diagnostic turn went to an edge
        # that was never in question. `/tmp/mapgate.status` is now the discriminator and the ledger step at
        # the bottom of this job reads it. This is the rule the shell below already states about the stage
        # cache — "could not check" must never read as "checked and fine" — applied in the other direction:
        # could not check must never read as CHECKED AND REFUSED.
        if: ${{ needs.resolve.outputs.task == 'edge-reps' || needs.resolve.outputs.task == 'triangle' || needs.resolve.outputs.task == 'triangle-smoke' }}
        run: |
          set -eo pipefail
          # Every phase below overwrites this, so the file always names the LAST phase reached. It starts
          # populated rather than empty because a status nobody wrote cannot be told from a step that never
          # started, which is the ambiguity being removed.
          echo "could-not-run: docker login" > /tmp/mapgate.status
          python -m pip install -q boto3
          # ⏱ RETRY THE LOGIN — the identical transient that killed run 30293740988 earlier the same day.
          # It is already retried at three other sites in this file and was missed at this one, which is
          # the site where it costs the most: here a Docker Hub blip dies under an atom-map headline.
          for i in 1 2 3; do
            echo "${{ secrets.DOCKERHUB_TOKEN }}" | docker login -u triskit23 --password-stdin && break
            if [ "$i" = 3 ]; then
              echo "::error::ATOM-MAP GATE COULD NOT RUN — Docker Hub login failed 3x. The map was NOT measured; this row says nothing about the science."
              exit 1
            fi
            echo "[docker] login attempt $i failed — retrying in 20s"; sleep 20
          done
          echo "could-not-run: deriving units and cache keys" > /tmp/mapgate.status
          mkdir -p /tmp/tin
          # ★ THE MODE'S OWN UNITS AND ITS OWN CACHE KEYS. `stage_cache_key` is keyed by (leg, mode, seed),
          # so reading `edge_reps` keys while launching `triangle` would check maps in caches the triangle
          # hosts will never read — a gate passing on the wrong bytes.
          MODE=$(printf '%s' "${{ needs.resolve.outputs.task }}" | tr '-' '_')
          python - "$MODE" <<'PY' > /tmp/units.txt
          import sys
          sys.path.insert(0, "research/modalities")
          import ternary_vast_launch as tv
          mode = sys.argv[1]
          for leg, seed, _d in tv.units_for(mode):
              print(leg, seed, tv.stage_cache_key(leg, mode, seed=seed))
          PY
          cat /tmp/units.txt
          # A missing stage cache is a hard stop, not a fall-through: without ligands.sdf the map cannot be
          # checked at all, and "could not check" must never read as "checked and fine".
          echo "could-not-run: pulling the stage caches from S3" > /tmp/mapgate.status
          for LEG in $(awk '{print $1}' /tmp/units.txt | sort -u); do
            KEY=$(awk -v l="$LEG" '$1==l {print $3; exit}' /tmp/units.txt)
            aws s3 cp "$KEY" /tmp/stage.tar || { echo "::error::ATOM-MAP GATE COULD NOT RUN — no stage cache at $KEY; run the matching prime task first. The map was NOT measured."; exit 1; }
            tar -C /tmp/tin -xf /tmp/stage.tar
          done
          # ★ THE PRE-FLIGHT'S OWN MARKERS DECIDE WHETHER THIS WAS A REFUSAL, exactly as the launcher's
          # `TVAST HELD ON PRICE` decides that for the price gate. A non-zero exit here is ambiguous by
          # itself: `valb_map_preflight` exits 1 on a short map, and `docker run` exits non-zero when the
          # image cannot be pulled — the same code for "we measured and refuse" and "we measured nothing".
          # So the discriminator is the sentence the pre-flight prints, and an unrecognised failure falls
          # through to could-not-run: never file an unexplained death as the scientific finding.
          echo "could-not-run: running the pre-flight container" > /tmp/mapgate.status
          set +e
          docker run --rm --entrypoint python \
            -v "$PWD/research/modalities:/work/research/modalities" -v /tmp/tin:/tmp/tin \
            -e RBFE_LOMAP_TIME_S=300 -e SSL_CERT_FILE=/etc/ssl/certs/ca-certificates.crt \
            -w /work/research/modalities \
            docker.io/triskit23/ternary-fep:latest \
            /work/research/modalities/valb_map_preflight.py \
              --input-dir /tmp/tin \
              $(awk '{print "--leg-id", $1}' /tmp/units.txt | sort -u | tr '\n' ' ') > /tmp/mapgate.log 2>&1
          RC=$?
          set -e
          tail -30 /tmp/mapgate.log
          if grep -q "REFUSING TO LAUNCH" /tmp/mapgate.log; then
            # The one line naming which leg fell how far short, carried into the ledger row so the finding
            # is readable without opening the run.
            echo "refused: $(grep -m1 'REFUSING TO LAUNCH' /tmp/mapgate.log | cut -c1-400)" > /tmp/mapgate.status
            echo "::error::ATOM-MAP GATE REFUSED — the map was measured and is SHORT. This is a result about the edge, not a retryable failure."
            exit 1
          fi
          if [ "$RC" != 0 ] || ! grep -q "every leg's atom map is complete" /tmp/mapgate.log; then
            echo "::error::ATOM-MAP GATE COULD NOT RUN — the pre-flight container exited $RC without reaching a verdict. The map was NOT measured."
            exit 1
          fi
          echo "passed: every leg's atom map measured complete at the production budget" > /tmp/mapgate.status

      - name: Rent one host per unit
        id: rent
        run: |
          set -eo pipefail
          # boto3 is REQUIRED, not optional: the launcher lists S3 to skip units that are already done
          # BEFORE renting anything. Without it the skip list is empty and every unit is rented again.
          python -m pip install -q boto3
          # TASK -> MODE. The dispatch options read as a ladder (`5aks-smoke`), while `MODES` keys are
          # Python identifiers (`5aks_smoke`). Only this job's tasks reach the tr, and none of them
          # contains a meaningful dash. An unmapped mode would be an argparse `--mode` choice error, i.e.
          # a red job, not a silent no-op — checked by test_ternary_vast_launch.
          MODE=$(printf '%s' "${{ needs.resolve.outputs.task }}" | tr '-' '_')
          echo "MODE=$MODE" >> "$GITHUB_ENV"
          ONLY="${{ github.event.inputs.leg_only }}"
          # Tee'd so the NEXT step can read which of the two zero-rental outcomes this was. `pipefail` is set,
          # so tee cannot mask the launcher's exit code.
          python research/modalities/ternary_vast_launch.py --mode "$MODE" ${ONLY:+--only "$ONLY"} 2>&1 | tee /tmp/rent.log
          if grep -q "TVAST HELD ON PRICE" /tmp/rent.log; then
            # ⚠ AND SAY SO AS A STEP OUTPUT. Making a correct refusal GREEN means the steps after this one now
            # run on a launch that rented nothing — which they never did before, because the old fatal price
            # gate made that case red. Arming a watchdog for units that do not exist would be a fresh bug
            # introduced by the signal fix, so the hold is published for the arm step to skip on.
            echo "held=true" >> "$GITHUB_OUTPUT"
            echo "::notice title=TVAST held::task=${{ needs.resolve.outputs.task }} rented nothing — correctly refused on price, not a fault. Next tick re-checks."
          else
            echo "held=false" >> "$GITHUB_OUTPUT"
            echo "::notice title=TVAST launched::task=${{ needs.resolve.outputs.task }} (mode=$MODE) — poll with task=collect."
          fi

      - name: Record this launch attempt in the ledger — SUCCESS OR NOT
        # ★★ THE STEP WHOSE ABSENCE CAUSED A MISREPORT (2026-07-27). When this job died at its old price
        # gate, every artifact in the lane looked exactly like an ordinary hold: the hold snapshot said HOLD
        # (the dead launch had overwritten the CLEAR that authorised it), the watch list was empty, and S3's
        # `_last_launch.json` was hours stale because the launcher never ran. Nothing anywhere said "a
        # launch was authorised, dispatched, and died" — so it was read as "still holding".
        #
        # `if: always()` is the whole point: the row that matters most is the one written by a FAILED run.
        # It is the last step so it can see the rental's outcome, and it never fails the job — a launch must
        # not be marked failed because its bookkeeping could not push.
        if: always()
        continue-on-error: true
        run: |
          set -eo pipefail
          RUN_URL="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          # ★ THE OUTCOME WORD IS DECIDED BY THE LAUNCHER, NOT BY THE STEP'S EXIT CODE (2026-07-27).
          # `steps.rent.outcome` only knows pass/fail, and on 11:10 AM ET that produced `rented-nothing` for
          # what was actually a provider 403 — an outcome that named two possibilities and therefore neither.
          # The launcher now exits 0 with `TVAST HELD ON PRICE` for a correct refusal and 1 with
          # `TVAST LAUNCHER FAULT` for anything else, so the annotation it emitted is the discriminator.
          # Falling back to `submit-failed` (a FAULT) when neither marker is present is deliberate: an
          # unrecognised failure must never be filed as the benign outcome.
          # Read unconditionally, not inside one branch: the phase the atom-map gate reached belongs in
          # EVERY row it can explain, including the green ones — "the map was measured complete" is part of
          # what authorised a rental, not just part of why one did not happen.
          MAPGATE="$(cat /tmp/mapgate.status 2>/dev/null || true)"
          if [ "${{ steps.rent.outcome }}" = success ]; then
            if grep -q "TVAST HELD ON PRICE" /tmp/rent.log 2>/dev/null; then
              OUTCOME=refused-on-price
            else
              OUTCOME=launched
            fi
          elif [ "${{ steps.rent.outcome }}" = skipped ]; then
            # ★★ WHY THIS BRANCH IS NO LONGER JUST `failed` (2026-07-27, 6:01 PM ET). `skipped` means the
            # job died before the rental, and the atom-map gate is the step most likely to have killed it —
            # but there are two opposite reasons it can, and until now both wrote the same row. A REFUSAL is
            # a measured result about the edge (nothing to retry; the chemistry is the finding); a
            # COULD-NOT-RUN means the map was never measured (retry is the whole remedy). Filing the second
            # as the first is what happened to run 30309074338, where a Docker Hub login timeout was read as
            # T3's closing edge failing to map. The gate writes `/tmp/mapgate.status`; this reads it.
            case "$MAPGATE" in
              refused:*) OUTCOME=map-gate-refused ;;
              *)         OUTCOME=failed ;;    # died before the rental, gate not the proven cause
            esac
          elif grep -q "could not read the board" /tmp/launch-board.json 2>/dev/null; then
            OUTCOME=board-unreadable        # the gate could not price the market either — same root cause
          else
            OUTCOME=submit-failed
          fi
          # ★★ AND THE RENTAL RECEIPT DECIDES WHETHER `launched` IS EVEN LEGAL FOR THIS ROW (2026-07-27).
          # The word above still comes from the launcher's annotations, which is right for telling a price
          # refusal from a fault — but it CANNOT tell "rented four hosts" from "found all four already
          # running and rented nothing", because both exit 0 with no marker. That is exactly how 12:29 PM
          # and 12:39 PM ET were both filed as `launched` ("hosts were actually rented") having rented zero,
          # and how a 2.032x board reading came to sit beside the word. `submit()` writes what it actually
          # rented, per host, at the rate the INSTANCE is billed; `record()` reclassifies a zero-rental
          # `launched` and copies those rates in, so the row carries what we PAID and not just what the
          # board cost. The receipt is also what puts `n_rented` in the summary line.
          # ★ `reason` CARRIES THE ATOM-MAP PHASE, because "job status failure" is true of every red run and
          # therefore diagnoses none of them — the exact emptiness that sent 6:01 PM ET's row to be read as
          # a mapping failure. When the gate ran at all, its own sentence goes in the row.
          REASON="task=${{ needs.resolve.outputs.task }}; job status ${{ job.status }}"
          if [ -n "$MAPGATE" ]; then REASON="$REASON; atom-map gate: $MAPGATE"; fi
          python research/modalities/ternary_launch_ledger.py --record "$OUTCOME" \
            --stage "rent (steps.rent.outcome=${{ steps.rent.outcome }})" \
            --gate /tmp/launch-board.json --run-url "$RUN_URL" \
            --receipt research/modalities/ternary-vast-rental-receipt.json \
            --reason "$REASON"
          git config user.name "Claude"; git config user.email "noreply@anthropic.com"
          git add -f research/modalities/ternary-vast-rental-receipt.json 2>/dev/null || true
          git add research/modalities/ternary-vast-launch-attempts.json
          if ! git diff --cached --quiet -- research/modalities/ternary-vast-launch-attempts.json; then
            git commit -m "tvast launch attempt: $OUTCOME (CI)"
            git pull --rebase --autostash origin "${{ github.ref_name }}" || true
            git push origin HEAD:"${{ github.ref_name }}" || true
          fi
          echo "::notice title=TVAST launch attempt::$(python research/modalities/ternary_launch_ledger.py --print-last)"

      - name: Arm the session-independent watchdog for this task
        # The watch list is the ONLY input the cron watchdog reads, so a launch that does not register its
        # units is a launch nobody is watching. Committed to the branch so it survives this runner.
        #
        # SKIPPED ON A PRICE HOLD: there is nothing to watch, and `--verify-armed` would fail the job for a
        # launch that correctly chose not to buy — turning the benign outcome red again and undoing the whole
        # point of separating the two signals.
        if: ${{ steps.rent.outputs.held != 'true' }}
        run: |
          set -eo pipefail
          python research/modalities/ternary_vast_watchdog.py --arm "$MODE"
          git config user.name "Claude"; git config user.email "noreply@anthropic.com"
          git add research/modalities/ternary-vast-watch.json
          if ! git diff --cached --quiet -- research/modalities/ternary-vast-watch.json; then
            git commit -m "tvast: arm the watchdog for ${{ needs.resolve.outputs.task }}"
            git pull --rebase --autostash origin "${{ github.ref_name }}" || true
            git push origin HEAD:"${{ github.ref_name }}"
          else
            echo "watch list already current"
          fi
          # READ BACK WHAT WAS WRITTEN. arm() succeeding is not the same as the watch list covering this
          # launch: the file can be changed afterwards by something that has no idea a leg is running, and
          # on 2026-07-25 exactly that happened — a later edit rewrote "watch" to [] and pushed, so the
          # watchdog's only input said there was nothing to watch while a billed GPU leg ran. The config
          # guard cannot catch it (an empty list is a legitimate state), so only a check that knows which
          # units were just launched can. Failing here is correct: a leg billing with nothing watching it
          # is worse than a red build.
          python research/modalities/ternary_vast_watchdog.py --verify-armed "$MODE"

  # ------------------------------------------------------------------ free: monitor + reap
  collect:
    needs: resolve
    if: ${{ needs.resolve.outputs.task == 'collect' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      VAST_API_KEY: ${{ secrets.VAST_API_KEY }}
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      # The credential a RENTED community host is given, forwarded in cleartext by _vast_onstart.
      # Scoped to the lane prefixes + six S3 actions a leg needs (s3_scoped_policy.py). Unset until
      # trimcrae creates the vast-leg-s3 user -> gpu_backend falls back to the broad key above, which
      # is why lanes in flight kept running. Runbook: research/compute/scoped-s3-credential-runbook.md
      VAST_S3_ACCESS_KEY_ID: ${{ secrets.VAST_S3_ACCESS_KEY_ID }}
      VAST_S3_SECRET_ACCESS_KEY: ${{ secrets.VAST_S3_SECRET_ACCESS_KEY }}
      VAST_S3_SCOPED_STS: ${{ vars.VAST_S3_SCOPED_STS }}
      AWS_DEFAULT_REGION: us-east-2
    steps:
      - uses: actions/checkout@v4
        with: { ref: "${{ github.ref_name }}" }
      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }
      - name: Status board + progress check + anti-idle reap
        run: |
          set -eo pipefail
          python -m pip install -q boto3
          python research/modalities/ternary_vast_launch.py --collect 2>&1 | tee /tmp/board.txt
      - name: Summary LAST
        # A CI log is read from its TAIL, so whatever a monitor needs must be the last thing printed.
        run: |
          set -eo pipefail
          echo "================ TVAST BOARD ================"
          cat /tmp/board.txt

  # ---------------------------------------------------------------- free: why an arm commits nothing
  # $0 FORENSIC, AND THE ONLY ONE THAT CAN SEE THE LAST TWO MINUTES OF A DEAD CONTAINER. The onstart script
  # copies /tmp/run.log to S3 on a `sleep 120` loop, so for a leg that dies the fatal part of its output never
  # reaches S3 at all — which is why `collect`'s log tail shows three cohorts of ternary legs stopping at the
  # same innocuous line and cannot say what happened next. `request_logs` pulls the container's own console
  # from the provider; the `attempts/` archive supplies the same view for every PREVIOUS cohort, for free.
  # Read-only: it never rents, never nudges, never destroys.
  reps_diag:
    needs: resolve
    if: ${{ needs.resolve.outputs.task == 'reps-diag' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
    env:
      VAST_API_KEY: ${{ secrets.VAST_API_KEY }}
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      AWS_DEFAULT_REGION: us-east-2
    steps:
      - uses: actions/checkout@v4
        with: { ref: "${{ github.ref_name }}" }
      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }
      - name: Read every replicate leg's own output — S3 attempts archive + container console
        run: |
          set -eo pipefail
          python -m pip install -q boto3
          python research/modalities/ternary_reps_diag.py --mode edge_reps \
            --out research/modalities/ternary-reps-diag.json 2>&1 | tee /tmp/diag.txt
      - name: Commit the forensic — evidence nobody has to re-derive from a job log GitHub will expire
        run: |
          set -eo pipefail
          git config user.name "Claude"; git config user.email "noreply@anthropic.com"
          git add research/modalities/ternary-reps-diag.json
          if ! git diff --cached --quiet; then
            git commit -m "ternary replicate forensic: what the containers themselves said (CI)"
            git pull --rebase --autostash origin "${{ github.ref_name }}" || true
            git push origin HEAD:"${{ github.ref_name }}" || true
          fi
      - name: Summary LAST
        run: |
          set -eo pipefail
          echo "================ TERNARY REPS DIAG ================"
          cat /tmp/diag.txt

  # `reduce-reps` is the SAME job with one more fetch, deliberately: the replicate reduction differs from the
  # seed-0 one only in which leg JSONs land in the directory, and the reducer globs that directory. Giving it
  # a second job would be a second expression of the reduction, and the standing rule here is one fact, one
  # place — a divergence between "the reduction" and "the replicate reduction" is precisely how a cycle ends
  # up reported two ways.
  reduce:
    needs: resolve
    if: ${{ needs.resolve.outputs.task == 'reduce' || needs.resolve.outputs.task == 'reduce-reps' }}
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      # The credential a RENTED community host is given, forwarded in cleartext by _vast_onstart.
      # Scoped to the lane prefixes + six S3 actions a leg needs (s3_scoped_policy.py). Unset until
      # trimcrae creates the vast-leg-s3 user -> gpu_backend falls back to the broad key above, which
      # is why lanes in flight kept running. Runbook: research/compute/scoped-s3-credential-runbook.md
      VAST_S3_ACCESS_KEY_ID: ${{ secrets.VAST_S3_ACCESS_KEY_ID }}
      VAST_S3_SECRET_ACCESS_KEY: ${{ secrets.VAST_S3_SECRET_ACCESS_KEY }}
      VAST_S3_SCOPED_STS: ${{ vars.VAST_S3_SCOPED_STS }}
      AWS_DEFAULT_REGION: us-east-2
      TVAST_TIMESTEP_FS: ${{ github.event.inputs.timestep_fs }}
      TVAST_WARMUP_TIMESTEP_FS: ${{ github.event.inputs.warmup_timestep_fs }}
    steps:
      - uses: actions/checkout@v4
        with: { ref: "${{ github.ref_name }}" }
      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }
      - name: Pull the edge's leg JSONs and cross-check the identity
        run: |
          set -eo pipefail
          python -m pip install -q boto3
          mkdir -p /tmp/tred
          python research/modalities/ternary_vast_launch.py --mode edge --fetch-legs /tmp/tred \
            2>&1 | tee /tmp/identity.txt
          # THE REPLICATES LAND IN THE SAME DIRECTORY, because that is how the reducer finds them:
          # `ternary_fep_reduce._find_leg_files` globs `leg_<leg_id>_<direction>_r<seed>.json`, so seeds 0, 1
          # and 2 of one leg are three files that differ only in their `_r<seed>` suffix, and
          # `per_replicate_ddg_coop` pairs ternary with binary BY SEED to form one ΔΔG_coop per replicate.
          # The between-replicate sample SD of those values IS the cycle SD the frozen gate reads — it is a
          # replicate SD, never an MBAR SE.
          if [ "${{ needs.resolve.outputs.task }}" = "reduce-reps" ]; then
            python research/modalities/ternary_vast_launch.py --mode edge_reps --fetch-legs /tmp/tred \
              2>&1 | tee -a /tmp/identity.txt
          fi
          ls -la /tmp/tred
      - name: Official reduction, in the SAME env that produced the trajectories
        # PULL, DO NOT SOLVE. The image carries the exact openfe/openmmtools/pymbar the legs were run with,
        # and analysing an OpenFE trajectory with a different pymbar/openmmtools than PRODUCED it can move
        # the MBAR numbers — so this is the correct environment, not merely the fast one. The repo is mounted
        # over the image's baked copy so the reducer that runs is the branch's, not the build-time one.
        run: |
          set -eo pipefail
          echo "${{ secrets.DOCKERHUB_TOKEN }}" | docker login -u triskit23 --password-stdin
          docker run --rm --entrypoint python \
            -v "$PWD/research/modalities:/work/research/modalities" \
            -v /tmp/tred:/tmp/tred \
            -e CKPT_DIR=/tmp/tred -e INPUT_DIR=/tmp/tred -e MODE=reduce \
            -w /work/research/modalities \
            docker.io/triskit23/ternary-fep:latest \
            /work/research/modalities/nr4a3_ternary_fep.py 2>&1 | tail -60
          ls -la /tmp/tred
      # ⚠ SYSTEM IDENTITY, NOT JUST PROTOCOL IDENTITY. `protocol_hash` covers the OpenFE SETTINGS and says
      # nothing about the SYSTEM, and ΔΔG_coop is a DIFFERENCE of legs — so three legs can share one hash and
      # still describe different solvated systems. That is not hypothetical here: on 2026-07-25 four reverse-leg
      # attempts ran a 146,020-particle `v1` build against a 141,968-particle `v2pe` forward leg, and no check
      # in the repo reported it. The reducer computes `system_identity_consistency` over n_particles /
      # charge_method / setup_cache_version, with unrecorded fields reported as UNKNOWN rather than folded in as
      # agreement — but nothing printed it, so the gate was being read off the hash alone.
      - name: System identity across the cycle (the check protocol_hash cannot make)
        run: |
          set -eo pipefail
          python3 - <<'PY'
          import json
          d = json.load(open("/tmp/tred/ternary_coop_reduction.json"))
          si = d.get("system_identity_consistency")
          print("================ SYSTEM IDENTITY ================")
          print(json.dumps(si, indent=1) if si else "(absent from the reduction — reducer version mismatch?)")
          for k in ("valB_calibration_gate", "valB_calibration_decision"):
              if k in d:
                  print(f"--- {k} ---"); print(json.dumps(d[k], indent=1))
          PY

      - name: Verdict LAST
        run: |
          set -eo pipefail
          echo "================ TVAST 4 fs IDENTITY ================"
          cat /tmp/identity.txt
          echo "reference: the 2 fs r0 cycle gave ddG_coop = -0.534 kcal/mol"
          echo "  (legs binary 48.0046 / ternary 47.4701 / solvent 47.8060 — valB-mini-r0-verdict-2026-07-25.md)"

  # ------------------------------------------------------------------ free: CPU-only trajectory diagnostics
  # WHY THIS TASK EXISTS. `reduce` fetches the leg JSONs — one ΔG each — and computes ΔΔG_coop. That is the
  # NUMBER, and it says nothing about whether the trajectory behind it sampled the intended state. The 2 fs r0
  # cycle's BINARY leg has a confirmed pose failure (its receptor-contacting moiety leaves and does not return in
  # 8 of 12 replicas, while the ternary leg in the same cycle is 12/12 stable — audit §L.3–L.3c), and RUNG 2b's
  # 4 fs cycle agrees with r0 to |Δ| = 0.0215 kcal/mol. Two readings of that agreement:
  #
  #   2b's binary leg SHARES the departure  -> the agreement is a real timestep reproduction on a shared-broken-arm
  #                                            basis; the 2b PASS stands as a verdict about 4 fs, and neither
  #                                            absolute ΔΔG_coop is a valid cooperativity.
  #   2b's binary leg HOLDS its pose        -> a contaminated arm and a clean one agree to 0.02 kcal/mol, and the
  #                                            claim that the departure invalidates ΔG_binary needs substantial
  #                                            softening.
  #
  # The second would be evidence AGAINST the r0 finding, which is exactly why it has to be looked at rather than
  # assumed. $0: free runner, no GPU, no Vast instance — it reads S3 and analyses on CPU.
  #
  # PARITY, not just speed: the analysis runs in the SAME image that produced the trajectories, because analysing
  # an OpenFE trajectory with a different pymbar/openmmtools than PRODUCED it can move the MBAR numbers. The repo
  # is mounted over the image's baked copy so the analyser that runs is the branch's.
  # ------------------------------------------------------------------ free: RUNG 5a-KS -> S
  # The double difference is computed by the OFFICIAL reducer inside the parity image, never by hand. The
  # reducer refuses a binary or solvent 5a-KS leg outright: the binary and solvent legs cancel ALGEBRAICALLY
  # out of S, so including one adds noise at best and computes a different quantity at worst.
  reduce_5aks:
    needs: resolve
    if: ${{ needs.resolve.outputs.task == '5aks-reduce' }}
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      # The credential a RENTED community host is given, forwarded in cleartext by _vast_onstart.
      # Scoped to the lane prefixes + six S3 actions a leg needs (s3_scoped_policy.py). Unset until
      # trimcrae creates the vast-leg-s3 user -> gpu_backend falls back to the broad key above, which
      # is why lanes in flight kept running. Runbook: research/compute/scoped-s3-credential-runbook.md
      VAST_S3_ACCESS_KEY_ID: ${{ secrets.VAST_S3_ACCESS_KEY_ID }}
      VAST_S3_SECRET_ACCESS_KEY: ${{ secrets.VAST_S3_SECRET_ACCESS_KEY }}
      VAST_S3_SCOPED_STS: ${{ vars.VAST_S3_SCOPED_STS }}
      AWS_DEFAULT_REGION: us-east-2
    steps:
      - uses: actions/checkout@v4
        with: { ref: "${{ github.ref_name }}", fetch-depth: 0 }
      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }
      - name: Pull both ternary legs' engine records
        run: |
          set -eo pipefail
          python -m pip install -q boto3
          mkdir -p /tmp/5aks_legs
          python research/modalities/ternary_vast_launch.py --mode 5aks --fetch-legs /tmp/5aks_legs
          ls -la /tmp/5aks_legs
      - name: Reduce to S, in the SAME env that produced the trajectories
        run: |
          set -eo pipefail
          echo "${{ secrets.DOCKERHUB_TOKEN }}" | docker login -u triskit23 --password-stdin
          docker run --rm --entrypoint python \
            -v "$PWD/research/modalities:/work/research/modalities" \
            -v /tmp/5aks_legs:/tmp/5aks_legs \
            -w /work/research/modalities \
            docker.io/triskit23/ternary-fep:latest \
            /work/research/modalities/nr4a3_5aks_reduce.py --legs /tmp/5aks_legs \
              --out /work/research/modalities/nr4a3-5aks-reduction.json
      - name: The reduction is a DELIVERABLE, so its absence is a failure
        run: |
          set -eo pipefail
          F=research/modalities/nr4a3-5aks-reduction.json
          test -s "$F" || { echo "::error::no reduction written"; exit 1; }
          python3 - <<'PY'
          import json, sys
          d = json.load(open("research/modalities/nr4a3-5aks-reduction.json"))
          print(json.dumps(d, indent=1)[:4000])
          dec = d.get("decision")
          if dec in ("REFUSED", "INCOMPLETE"):
              print(f"::error::the reduction returned {dec}: {d.get('reason')}")
              sys.exit(1)
          print(f"::notice title=RUNG 5a-KS::S = {d.get('S_kcal')} +/- {d.get('S_err_kcal')} "
                f"({d.get('S_err_kind')}), decision={dec}")
          PY
      - name: Commit the reduction
        run: |
          set -eo pipefail
          git config user.name "Claude"; git config user.email "noreply@anthropic.com"
          git add research/modalities/nr4a3-5aks-reduction.json
          if git diff --cached --quiet; then echo "reduction unchanged"; else
            git commit -m "RUNG 5a-KS: the double difference S (CI, parity image)"
            git pull --rebase --autostash origin "${{ github.ref_name }}" || true
            git push origin HEAD:"${{ github.ref_name }}"
          fi

  # ------------------------------------------- $0: clear a stale FAILED record after its cause is fixed
  # `classify` returns FAILED only when `has_failed_record AND not instance_alive`, so relaunching a fixed leg
  # SUPPRESSES its old record rather than clearing it. The moment the new attempt exits without a leg.json the
  # stale record fires again — an alert pointing at a cause already fixed — and the watchdog's refusal to
  # relaunch a unit carrying a failed record then blocks the recovery it exists to trigger, overnight.
  # The record is ARCHIVED under `<unit>/superseded/`, never deleted; a `status=done` record is refused.
  supersede-failed:
    needs: resolve
    if: ${{ needs.resolve.outputs.task == 'supersede-failed' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      # The credential a RENTED community host is given, forwarded in cleartext by _vast_onstart.
      # Scoped to the lane prefixes + six S3 actions a leg needs (s3_scoped_policy.py). Unset until
      # trimcrae creates the vast-leg-s3 user -> gpu_backend falls back to the broad key above, which
      # is why lanes in flight kept running. Runbook: research/compute/scoped-s3-credential-runbook.md
      VAST_S3_ACCESS_KEY_ID: ${{ secrets.VAST_S3_ACCESS_KEY_ID }}
      VAST_S3_SECRET_ACCESS_KEY: ${{ secrets.VAST_S3_SECRET_ACCESS_KEY }}
      VAST_S3_SCOPED_STS: ${{ vars.VAST_S3_SCOPED_STS }}
      AWS_DEFAULT_REGION: us-east-2
    steps:
      - uses: actions/checkout@v4
        with: { ref: "${{ github.ref_name }}" }
      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }
      - name: Archive and clear the matching failed record(s)
        run: |
          set -eo pipefail
          python -m pip install -q boto3
          SEL="${{ github.event.inputs.leg_only }}"
          test -n "$SEL" || { echo "::error::set leg_only — refusing to clear every failed record at once"; exit 1; }
          python research/modalities/ternary_vast_launch.py --supersede-failed "$SEL"

  converge:
    needs: resolve
    if: ${{ needs.resolve.outputs.task == 'converge' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      # The credential a RENTED community host is given, forwarded in cleartext by _vast_onstart.
      # Scoped to the lane prefixes + six S3 actions a leg needs (s3_scoped_policy.py). Unset until
      # trimcrae creates the vast-leg-s3 user -> gpu_backend falls back to the broad key above, which
      # is why lanes in flight kept running. Runbook: research/compute/scoped-s3-credential-runbook.md
      VAST_S3_ACCESS_KEY_ID: ${{ secrets.VAST_S3_ACCESS_KEY_ID }}
      VAST_S3_SECRET_ACCESS_KEY: ${{ secrets.VAST_S3_SECRET_ACCESS_KEY }}
      VAST_S3_SCOPED_STS: ${{ vars.VAST_S3_SCOPED_STS }}
      AWS_DEFAULT_REGION: us-east-2
      TVAST_TIMESTEP_FS: ${{ github.event.inputs.timestep_fs }}
      TVAST_WARMUP_TIMESTEP_FS: ${{ github.event.inputs.warmup_timestep_fs }}
    steps:
      - uses: actions/checkout@v4
        with: { ref: "${{ github.ref_name }}" }
      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }
      - name: Pull the newest committed generation per leg from S3
        run: |
          set -eo pipefail
          python -m pip install -q boto3
          mkdir -p /tmp/tconv
          python research/modalities/ternary_vast_launch.py --mode edge --fetch-trajectories /tmp/tconv 2>&1 | tail -40
          echo "--- what landed ---"
          ls -laR /tmp/tconv | tail -40
      - name: Convergence + contact-moiety pose diagnostics, in the parity image
        run: |
          set -eo pipefail
          echo "${{ secrets.DOCKERHUB_TOKEN }}" | docker login -u triskit23 --password-stdin
          docker run --rm --entrypoint python \
            -v "$PWD/research/modalities:/work/research/modalities" \
            -v /tmp/tconv:/tmp/tconv \
            -e CKPT_DIR=/tmp/tconv -e INPUT_DIR=/tmp/tconv \
            -w /work/research/modalities \
            docker.io/triskit23/ternary-fep:latest \
            /work/research/modalities/ternary_fep_convergence.py 2>&1 | tail -30
          sudo chown -R "$(id -u):$(id -g)" /tmp/tconv 2>/dev/null || true
      - name: Verdict LAST — the 4 fs cycle's pose behaviour beside r0's
        run: |
          set +e
          echo "================ 4 fs CYCLE POSE / CONVERGENCE SUMMARY ================"
          cat /tmp/tconv/ternary_convergence_summary.txt
          echo
          echo "r0 (2 fs) for comparison — binary_vhl: contact_pose max 16.327 / med 4.333 A, 8 of 12 replicas"
          echo "ending beyond 4.0 A, classes DISPLACED_AND_STAYED 5 / INTERMEDIATE 3 / STABLE 4; ternary_vhl"
          echo "12/12 STABLE. See research/modalities/ternary-lane-guard-audit-2026-07-25.md sections L.3-L.3c."
          echo
          echo "READ IT AS: binary here ALSO displaced -> the |dDDG| = 0.0215 agreement is a timestep result on a"
          echo "shared broken arm. Binary here STABLE -> the departure barely moves dG_binary and the r0 claim"
          echo "needs softening. Either way the number to compare is the binary leg's contact_pose line."

  stop:
    needs: resolve
    if: ${{ needs.resolve.outputs.task == 'stop' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      VAST_API_KEY: ${{ secrets.VAST_API_KEY }}
    steps:
      - uses: actions/checkout@v4
        with: { ref: "${{ github.ref_name }}" }
      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }
      - name: Destroy every tvast-* instance (anti-idle backstop)
        run: python research/modalities/ternary_vast_launch.py --stop
