name: Ternary cooperativity FEP — Vast lane (RUNG 2b, 4 fs)

# The ternary lane on VAST, per trimcrae's 2026-07-25 directive that all production GPU runs go on Vast.
# Before this, the ternary FEP could only run on GCP L4 (1-GPU quota, another session's lane) or on a
# script-shaped Vast path with no checkpoint/resume, no cache and no reap. Engine: research/modalities/
# ternary_vast_launch.py; recipe: run_ternary_leg.sh (single source of truth — never re-implemented here).
#
# IMAGE: docker.io/triskit23/ternary-fep (research/compute/Dockerfile.ternaryfep). PULL, DO NOT SOLVE — the
# image's mamba spec is byte-for-byte the one the GCP ternary lane builds on the fly, so it is the *correct*
# environment, not merely the fast one: analysing an OpenFE trajectory with a different pymbar/openmmtools
# than PRODUCED it can move the MBAR numbers.
#
# THE LADDER (cheapest-decisive-first; nothing auto-fires):
#   test    -> $0.    Pure-logic unit tests for the launcher. Runs on every push to the lane's files.
#   dry-run -> $0.    Print the exact JobSpec that WOULD be rented (env, image, caps). No rental.
#   prime   -> $0.    Stage every EDGE leg on a free CPU runner and upload the stage caches to S3, so the
#                     rented hosts get cache hits. Two wins, both real: it removes ~8-15 min of GPU-idle
#                     staging from EACH paid host, and it discovers a first-time staging failure for the
#                     binary and solvent legs at $0 instead of on a 4090.
#   smoke   -> ~$0.15 One instance, 8 warmup + 12 production iterations: proves image + repo pull + stage +
#                     pre-equil + setup + commit store + upload end to end before a real leg is paid for.
#   probe   -> ~$1-2  RUNG 2b STAGE 1. 48 warmup @1 fs -> 200 production @4 fs. The survival question:
#                     does 4 fs hold well past the 40 iterations the runbook demonstrated? A NO here costs
#                     ~$1-2 instead of a full edge.
#   edge    -> ~$4-6  RUNG 2b STAGE 2, only on a passing probe. The full matched re-calibration edge:
#                     ternary + binary + solvent at full science length, fanned out 3-wide.
#   collect -> $0.    Status board + PROGRESS check (committed iteration, not liveness) + anti-idle reap.
#   reduce  -> $0.    Pull the edge's leg JSONs, cross-check ddG_coop = ternary - binary by hand, and run
#                     the official reducer INSIDE the parity image that produced the trajectories.
#   stop    -> $0.    Destroy every tvast-* instance.
#
# DISPATCHING BEFORE THIS FILE IS ON main. A brand-new `workflow_dispatch` workflow 404s until it reaches
# the default branch, but a `push` trigger runs from the pushed branch with no such dependency. So the task
# can also be given in the COMMIT MESSAGE as a `[tvast:<task>]` marker, which is how this lane was
# bootstrapped and validated on a feature branch. Once the file is on main, use workflow_dispatch.

on:
  # ⏰ The market re-check. A `schedule:` fires ONLY from the default branch, so this covers main; it resolves
  # to `market-gate`, which either holds (committing the snapshot) or dispatches the launch itself.
  #
  # ⚠ THIS IS A BACKSTOP, NOT THE PRIMARY, AND THAT IS A MEASURED CALL RATHER THAN CAUTION. GitHub's
  # scheduled-event delivery to this repo STOPPED at 10:04 PM on 2026-07-26 — no `schedule` event on any
  # workflow after that, while `workflow_dispatch` kept working and all three watchdogs went green when
  # dispatched by hand. So a cron-only re-check would have been a gate that never re-checks, which is the
  # same "reports success while measuring nothing" shape this lane keeps paying for. The primary re-check is
  # a Claude-side Routine that dispatches this task; this cron is the second channel, not the only one.
  #
  # ⚠ THAT ROUTINE DID NOT EXIST UNTIL 2026-07-27 8:05 AM ET, though this comment already claimed it did.
  # The cost of the gap is measurable rather than hypothetical: over the 12 h to 7:46 AM ET this workflow saw
  # exactly TWO market re-checks — a `schedule` at 6:10 AM and a hand `workflow_dispatch` at 7:46 AM — with a
  # 277-MINUTE BLIND WINDOW from 1:32 AM to 6:10 AM. `push` events do not re-check: without a [tvast:...]
  # marker they resolve to the free `test`, so the busy push traffic at 7:08/7:24/7:28 AM priced nothing. A
  # held fleet is only correct while something is still looking for the price to fall, and for those 4.6 h
  # nothing was. The Routine now fires hourly at :05 independently of GitHub's scheduled-event delivery.
  schedule:
    - cron: "17 * * * *"
  push:
    branches:
      - main
      - claude/max-effort-2dq11l-4fs
    paths:
      - research/modalities/ternary_vast_launch.py
      - research/modalities/ternary_vast_watchdog.py
      - research/modalities/run_ternary_leg.sh
      - research/modalities/tests/test_ternary_vast_launch.py
      - .github/workflows/gpu-ternary-fep-vast.yml
      # The poke file exists ONLY to trigger this workflow from a feature branch, where
      # workflow_dispatch is not yet available. See research/modalities/ternary-vast-poke.txt.
      - research/modalities/ternary-vast-poke.txt
  workflow_dispatch:
    inputs:
      task:
        description: "test | dry-run | prime | smoke | probe | edge | collect | reduce | converge (CPU/$0 - pull the newest committed .nc per leg from S3 and run the convergence + contact-moiety pose diagnostics in the parity image) | stop || valB_mini replicates: reps-prime ($0, stage seeds 1+2 and PROVE the atom map is complete) | edge-reps (r1+r2, 4 legs in parallel) | reps-setup-rss ($0, build BOTH arms' hybrid systems in the parity image under a memory meter — the controlled reproduction of the ternary setup death) | reps-diag ($0, why an arm commits nothing — the container's OWN console via request_logs plus every archived attempt) | reduce-reps ($0, the cycle SD across seeds) || RUNG 5a-KS: 5aks-prime ($0, stage the co-folds and seed the cache) | 5aks-smoke (~$0.15) | 5aks (the FOUR ternary legs — n = 2 seeds per arm since 2026-07-30, trimcrae go, STRATEGY Open decision 11; cost is DERIVED in vast-ladder-repricing.json -> '5a-KS primary' and is deliberately NOT typed here. SUPERSEDED: '~$12, the two ternary legs') | 5aks-gate ($0, price the 5a-KS legs that still need a host and self-dispatch task=5aks the moment the board clears — the re-placement path whose ABSENCE stranded nr4a3_r0 at production/840 on 2026-07-31) | 5aks-reduce ($0, the double difference S) | supersede-failed ($0, archive-and-clear a stale status=failed leg.json once its cause is fixed — use leg_only to select) || valB CLOSURE TRIANGLE (2 fs, seed 0, binary legs UNRESTRAINED): triangle-freeze ($0, derive cmpd4\" by two independent routes and commit the freeze) | triangle-prime ($0, stage all 4 legs on CPU + prove both new atom maps) | triangle-gate ($0, price the 4 legs and self-dispatch the launch the moment the board clears) | triangle-smoke (~$0.15, the closing edge end to end) | triangle (the 4 legs, ~$6.83 plan) | triangle-reduce ($0, the closure residual R) | triangle-converge ($0, the SAME pose/convergence diagnostic as `converge` but on the TRIANGLE's 4 legs — `converge` is pinned to RUNG 2b's `edge` legs so the published 4 fs comparison stays reproducible, and the mode rides on this input because the lane is AT GitHub's 10-input cap) | triangle-diag ($0, every triangle unit's FULL run.log plus the gate's SDF vs the host's SDF side by side) || blacklist-clear ($0, snapshot the shared machine-exclusion set to the repo and then EMPTY it, shared + every lane's own list) | blacklist-snapshot ($0, snapshot ONLY — the history survives a clear, so this recovers the record if the snapshot commit ever loses its race)"
        type: choice
        # ⚠ A NEW OPTION HERE IS NOT DISPATCHABLE UNTIL IT REACHES THE REF GITHUB VALIDATES AGAINST — MEASURED
        # 2026-07-30. CLAUDE.md §6's "dispatch an on-main workflow with ref=<branch> and it runs the BRANCH's
        # version" is true of the FILE BODY and false of a `type: choice` input's allowed values: dispatching
        # `task=triangle-converge` with `ref=<branch>` while the option existed only in the working tree was
        # rejected `422 Provided value 'triangle-converge' for input 'task' not in the list of allowed values`
        # BEFORE any run was created. So a new task option must be pushed (main and the branch carried
        # identical option lists at the time, so which of the two is authoritative was not separable) before
        # it can be exercised at all — plan on pushing first rather than discovering this mid-diagnostic.
        options: [test, dry-run, prime, smoke, probe, edge, collect, reduce, converge, stop, market-gate, blacklist-clear, blacklist-snapshot, reps-prime, edge-reps, reps-diag, reps-setup-rss, reduce-reps, 5aks-prime, 5aks-smoke, 5aks, 5aks-gate, 5aks-reduce, supersede-failed, triangle-freeze, triangle-prime, triangle-gate, triangle-smoke, triangle, triangle-reduce, triangle-converge, triangle-diag, charge-provenance, retire-host]
        default: test
      timestep_fs:
        description: "production MD timestep in fs (blank = 4.0, the thing RUNG 2b is testing)"
        type: string
        default: ""
      warmup_timestep_fs:
        description: "warmup/equilibration timestep in fs (blank = 1.0). Equilibration is DISCARDED, so this never enters dG."
        type: string
        default: ""
      vast_image:
        description: "override the image (blank = docker.io/triskit23/ternary-fep:latest)"
        type: string
        default: ""
      cofold_prefix:
        description: "5aks-prime: S3 prefix holding the Boltz co-fold CIFs (blank = rung5aks-cofold-v1)"
        type: string
        default: ""
      gpu_class:
        description: "override the GPU class the lane rents (blank = rtx4090, the lane default). Sets TVAST_GPU. ⚠ SOFT ONLY, and it CANNOT force a card: with require_gpu unset this value is consulted solely by the unmeasured fallback in _select_cheapest_offer, so any benched offer on the board sends the decision back to the $/ns ranking. It failed to do exactly this job on 2026-07-29 — use `min_ns_per_h` below when the requirement is speed."
        type: string
        default: ""
      bid_floor_mult:
        description: "multiply the interruptible BID above the market floor, to buy host RETENTION (blank = the derived tick policy). Sets VAST_BID_FLOOR_MULT — the escape hatch _vast_bid_price documents for 'a specific leg that genuinely cannot tolerate pauses'. On Vast the charge is min(bid, the machine's on-demand price), so this is capped by the real on-demand rate and cannot run away; the market gate's $/ns ceiling still refuses anything over the buy line, so too high a value fails a placement on price rather than overspending. ⚠ Use per-launch on a leg that is CHURNING, never standing: a higher bid on a stable host buys nothing and costs money."
        type: string
        default: ""
      min_ns_per_h:
        description: "HARD floor on the rented card's measured throughput, in ns/hr at the ternary system size (blank = no floor). Sets TVAST_MIN_NS_PER_H. This is the DEADLINE control: `40` admits the RTX 5090 class only, `31` admits 5090/4090/5080, `28` adds the 4080. Checked against `vast_cost_model.ns_per_hour` — the same validated table the $/ns ranking uses — so an unbenched card is excluded rather than guessed at. Use per-launch for a leg that has become the critical path; leaving it set turns the lane's cost discipline into a standing speed preference."
        type: string
        default: ""
      on_demand:
        description: "1 = rent the UNINTERRUPTIBLE (on-demand) tier instead of the community bid tier. Sets TVAST_ON_DEMAND. ⚠ Use for ONE leg that is the critical path and nothing else — on-demand costs multiples of the bid floor and the whole ladder is priced on interruptible rentals. It exists because no bid makes the bid tier safe: an on-demand renter preempts an interruptible one REGARDLESS of bid, so `bid_floor_mult` buys priority WITHIN the tier and cannot stop eviction. The $/ns buy line still applies unchanged — an on-demand offer over the line is REFUSED like any other."
        type: string
        default: ""
      leg_only:
        description: "launch: restrict to units whose LEG ID contains this substring (e.g. `nr4a3`). Recovers ONE preempted arm without re-renting a sibling that has a known deterministic defect."
        type: string
        default: ""

# ─────────────────────────────────────────────────────────────────────────────────────────────────────────
# ✅ THE OVERNIGHT DEADLINE WAIVER IS REMOVED (2026-07-30, when the closure residual R landed).
# It set RELAUNCH_MAX_RATIO_VS_BASIS=4.0, letting a relaunch buy at up to 4x basis — roughly twice the
# $0.006539/ns buy line — because the triangle was on a deadline and a paused leg cost more than a dear
# host. Its own banner said 'this overnight run only. Remove it once the closure residual R and the
# replicate cycle SD have landed.' Both have: valB_mini closed at n=3, and R = 0.2128 kcal/mol is in
# valb-triangle-reduction.json. So the waiver goes, and the lane is back on the derived DRIFT_MULTIPLE.
# Removing it is the whole reason it was written as a banner rather than a quiet env line: a temporary
# loosening that nobody ever takes out is just a permanent one with an apology attached.
# ─────────────────────────────────────────────────────────────────────────────────────────────────────────

permissions:
  contents: write

# NB there is deliberately NO workflow-level `concurrency` here. Serialising the whole workflow also
# serialises `collect`, and monitoring that has to queue behind a 25-minute `prime` is monitoring you cannot
# do during exactly the window when a rented GPU is running unproven code. The group is applied to the
# MUTATING jobs only (launch, prime), which is where a concurrent run actually causes harm: two submits can
# put two instances on one unit, writing the same S3 keys, doing the same work, billing twice.

jobs:
  resolve:
    runs-on: ubuntu-latest
    outputs:
      task: ${{ steps.pick.outputs.task }}
    steps:
      - id: pick
        env:
          DISPATCH_TASK: ${{ github.event.inputs.task }}
          MSG: ${{ github.event.head_commit.message }}
        run: |
          set -eo pipefail
          # Precedence: explicit dispatch input > a [tvast:<task>] marker in the pushed commit message >
          # `test` (free). The default is deliberately the $0 one: a push must never be able to rent a GPU
          # by accident, which is the spend-gated ladder's first rule.
          TASK="${DISPATCH_TASK:-}"
          # A SCHEDULE fires the market re-check, not `test`. `github.event.inputs.*` is empty on a schedule
          # event and there is no head_commit message either, so without this branch the cron would resolve
          # to the free `test` and re-check nothing — a scheduled gate that silently never runs, which is
          # strictly worse than having no schedule at all because it looks like coverage.
          if [ -z "$TASK" ] && [ "${{ github.event_name }}" = "schedule" ]; then
            TASK=market-gate
          fi
          if [ -z "$TASK" ]; then
            # `|| true` IS LOAD-BEARING. grep exits 1 when it matches nothing, and under `set -eo pipefail`
            # (plus the runner's own `bash -e`) that failure propagates out of the command substitution and
            # kills the step — so the "no marker -> fall back to the free `test`" branch could never be
            # reached, and EVERY marker-less push to this lane's files went red. Observed on run
            # 30169660474, whose only fault was a commit message without a [tvast:...] marker. A fallback
            # that cannot execute is not a fallback.
            TASK=$(printf '%s' "$MSG" | grep -oE '\[tvast:[a-z0-9-]+\]' | head -1 | sed 's/\[tvast://; s/\]//' || true)
          fi
          # THIS ALLOWLIST MUST BE KEPT IN SYNC WITH THE `task` INPUT'S OPTIONS. It is a silent downgrade, not an
          # error: an unlisted task falls back to `test`, which passes, prints a warning nobody reads, and does
          # none of the work that was asked for. Adding `converge` to the input's options without adding it here
          # would have produced a green run that analysed nothing — the exact "reports success while measuring
          # nothing" shape this lane's audit is about. Gated by
          # tests/test_workflows_parse.py::test_vast_task_allowlist_matches_the_input_options.
          case "${TASK:-test}" in
            test|dry-run|prime|smoke|probe|edge|collect|reduce|converge|stop|market-gate|reps-prime|edge-reps|reps-diag|reps-setup-rss|reduce-reps|5aks-prime|5aks-smoke|5aks|5aks-gate|5aks-reduce|supersede-failed|triangle-freeze|triangle-prime|triangle-gate|triangle-smoke|triangle|triangle-reduce|triangle-converge|triangle-diag|charge-provenance|retire-host|blacklist-clear|blacklist-snapshot) TASK="${TASK:-test}" ;;
            *) echo "::warning::unrecognised task '${TASK}' -> falling back to the free 'test'"; TASK=test ;;
          esac
          echo "task=$TASK" >> "$GITHUB_OUTPUT"
          echo "::notice title=TVAST task::$TASK"

  # ------------------------------------------------------------------ free: pure logic
  test:
    needs: resolve
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with: { ref: "${{ github.ref_name }}" }
      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }
      - name: Unit tests (identity round-trip, prefix keying, cost arithmetic)
        # ★★ `-m "not committed_artifact"` — WHY THIS JOB NO LONGER ASSERTS THE CONTENT OF A DATA FILE
        # (2026-07-28). This job is in the `needs:` of every task in this workflow, so anything red here
        # blocks market-gate, collect, launch and stop alike. On 2026-07-28 a launch job's own ledger write
        # evicted a row that `test_the_committed_ledger_is_valid_and_records_the_lost_windows` pins, and the
        # entire ternary lane went down for ~90 minutes across seven consecutive red runs — not because any
        # code was broken, but because a committed JSON file had drifted.
        #
        # A test of a MUTABLE ARTIFACT and a test of CODE fail for unrelated reasons and deserve unrelated
        # blast radii. The artifact tests still run, still fail loudly, and were NOT weakened — see the
        # `ledger-integrity` job below, which depends on nothing and is depended on by nothing.
        # `--strict-markers` is what stops the deselection silently matching nothing after a rename.
        run: |
          set -eo pipefail
          python -m pip install -q pytest
          python -m pytest research/modalities/tests/test_ternary_vast_launch.py \
                           research/modalities/tests/test_ternary_vast_watchdog.py \
                           research/modalities/tests/test_ternary_launch_ledger.py \
                           research/modalities/tests/test_vast_start_refusal.py \
                           research/modalities/tests/test_capacity_refusal_trend.py \
                           --strict-markers -m "not committed_artifact" -q

  # ------------------------------------------------------------------ free: LOUD, but gates nothing
  ledger-integrity:
    # ★★ THE GUARD THAT KEEPS THIS CLASS OF FAILURE OFF THE LANE'S CRITICAL PATH (2026-07-28).
    # Deliberately `needs: resolve` only, and named in NO other job's `needs:`. A row lost from the ledger
    # is a real finding and must be seen — the run goes red, and `--verify` prints an `::error` naming the
    # exact missing row and the one command that restores it — but it can no longer stop a fleet being
    # supervised, collected or stopped. The old arrangement inverted that: the bookkeeping outranked the
    # billing. `if: always()` so it reports on every dispatch of this workflow, including the GPU ones.
    needs: resolve
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with: { ref: "${{ github.ref_name }}", fetch-depth: 0 }   # depth 0: --verify reads the file's history
      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }
      - name: The committed ledger still holds every row marked to be kept
        run: |
          set -eo pipefail
          python -m pip install -q pytest
          # Read-only. It never repairs here: an auto-commit from a job that runs on every dispatch would
          # race the lanes that are appending to this same file, and the structural fix means an evidence
          # row can no longer be evicted in the first place. If this ever fires, `--repair` restores it by
          # union from git history and the annotation says so.
          python research/modalities/ternary_launch_ledger.py --verify
          python -m pytest research/modalities/tests/test_ternary_launch_ledger.py \
                           --strict-markers -m "committed_artifact" -q

  dry-run:
    needs: [resolve, test]
    if: ${{ needs.resolve.outputs.task == 'dry-run' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with: { ref: "${{ github.ref_name }}" }
      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }
      - name: Print the JobSpec that would be rented
        env:
          GIT_BRANCH: ${{ github.ref_name }}
          TVAST_GPU: ${{ github.event.inputs.gpu_class }}
          TVAST_MIN_NS_PER_H: ${{ github.event.inputs.min_ns_per_h }}
          TVAST_ON_DEMAND: ${{ github.event.inputs.on_demand }}
          TVAST_PRUNE_CHK: ${{ vars.TVAST_PRUNE_CHK }}
          VAST_BID_FLOOR_MULT: ${{ github.event.inputs.bid_floor_mult }}
          TVAST_TIMESTEP_FS: ${{ github.event.inputs.timestep_fs }}
          TVAST_WARMUP_TIMESTEP_FS: ${{ github.event.inputs.warmup_timestep_fs }}
        run: |
          set -eo pipefail
          python research/modalities/ternary_vast_launch.py --mode probe --dry-run
          python research/modalities/ternary_vast_launch.py --mode edge --dry-run | head -5

  # ------------------------------------------------------------------ free: pre-stage on CPU
  prime:
    needs: [resolve, test]
    if: ${{ needs.resolve.outputs.task == 'prime' }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    concurrency:
      group: ternary-vast-mutate
      cancel-in-progress: false
    env:
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      # The credential a RENTED community host is given, forwarded in cleartext by _vast_onstart.
      # Scoped to the lane prefixes + six S3 actions a leg needs (s3_scoped_policy.py). Unset until
      # trimcrae creates the vast-leg-s3 user -> gpu_backend falls back to the broad key above, which
      # is why lanes in flight kept running. Runbook: research/compute/scoped-s3-credential-runbook.md
      VAST_S3_ACCESS_KEY_ID: ${{ secrets.VAST_S3_ACCESS_KEY_ID }}
      VAST_S3_SECRET_ACCESS_KEY: ${{ secrets.VAST_S3_SECRET_ACCESS_KEY }}
      VAST_S3_SCOPED_STS: ${{ vars.VAST_S3_SCOPED_STS }}
      AWS_DEFAULT_REGION: us-east-2
    steps:
      - uses: actions/checkout@v4
        with: { ref: "${{ github.ref_name }}" }
      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }
      - name: Stage every edge leg on CPU and upload the caches
        # PULL, DO NOT SOLVE: the same parity image the GPU hosts run, so the staged tree is byte-identical
        # to what a host would have built. Staging touches no GPU -- it is an RCSB fetch, a SMARCA4->SMARCA2
        # homology model and an assembly -- so paying a 4090 to do it is the exact anti-pattern the GCP
        # lane's CPU pre-bake exists to kill. CI runners have unrestricted internet, which the dev sandbox
        # does not.
        run: |
          set -eo pipefail
          python -m pip install -q boto3
          echo "${{ secrets.DOCKERHUB_TOKEN }}" | docker login -u triskit23 --password-stdin
          B="${VAST_CKPT_BUCKET:-sagemaker-us-east-2-646605541856}"
          mkdir -p /tmp/tin
          for LEG in calib_hi_to_lo__ternary_vhl calib_hi_to_lo__binary_vhl calib_hi_to_lo__solvent; do
            KEY="s3://$B/ternary-vast/stagecache/${LEG}__8G1Q__seed0__v1.tar"
            if aws s3 ls "$KEY" >/dev/null 2>&1; then echo "[prime] HIT  $LEG"; continue; fi
            echo "[prime] MISS $LEG -- staging on CPU"
            docker run --rm --entrypoint python \
              -v "$PWD/research/modalities:/work/research/modalities" -v /tmp/tin:/tmp/tin \
              -e SEED=0 -e SSL_CERT_FILE=/etc/ssl/certs/ca-certificates.crt \
              -w /work/research/modalities \
              docker.io/triskit23/ternary-fep:latest \
              /work/research/modalities/ternary_pdb_stage.py \
                --leg-id "$LEG" --template-pdb 8G1Q --out /tmp/tin 2>&1 | tail -20
            ls -la "/tmp/tin/$LEG"
            tar -C /tmp/tin -cf "/tmp/${LEG}.tar" "$LEG"
            aws s3 cp "/tmp/${LEG}.tar" "$KEY"
            echo "[prime] uploaded $KEY ($(du -h /tmp/${LEG}.tar | cut -f1))"
          done
          echo "[prime] done -- every edge host will now restore its stage tree in seconds"

  # ------------------------------------------------------------------ free: price the fan-out, rent nothing
  # Answers "would the market let us buy this right now, and at what number" WITHOUT renting anything, so a
  # hold can be reported with a live snapshot instead of an extrapolation from someone's earlier reading.
  # Same code path the launch job's gate uses — not a second opinion that is free to disagree with it.
  market_gate:
    needs: [resolve, test]
    if: ${{ needs.resolve.outputs.task == 'market-gate' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # `actions: write` is what lets this job dispatch the launch itself when the board clears — the
    # difference between a gate that reports and a gate that acts.
    permissions:
      contents: write
      actions: write
    env:
      # priced with the SAME class the launch would buy — otherwise the gate projects a
      # market we would not actually rent from.
      TVAST_GPU: ${{ github.event.inputs.gpu_class }}
      TVAST_MIN_NS_PER_H: ${{ github.event.inputs.min_ns_per_h }}
      TVAST_ON_DEMAND: ${{ github.event.inputs.on_demand }}
      # ★★ A KILL SWITCH, NOT AN ENABLE — and a repository variable rather than a dispatch input, because
      # this lane is AT GitHub's 10-input cap and the 11th input does not fail, it silently EMPTIES every
      # `-f` value (test_workflow_dispatch_input_cap caught exactly that). `vars.*` costs no input.
      #
      # WHAT ENABLES THE PRUNE IS `ternary_vast_launch.PRUNE_ELIGIBLE_MODES`, a tuple in code with a test
      # that fails when it changes — NOT this variable. A variable is global, stays set until someone
      # remembers to unset it, and this lane SELF-DISPATCHES (`5aks-gate` fires `task=5aks`, which resumes
      # a stranded leg), so it could never have expressed "on for one experiment". Set it to `0` to force
      # the prune off everywhere without a deploy; that is the only direction worth a remote control.
      TVAST_PRUNE_CHK: ${{ vars.TVAST_PRUNE_CHK }}
      VAST_BID_FLOOR_MULT: ${{ github.event.inputs.bid_floor_mult }}
      VAST_API_KEY: ${{ secrets.VAST_API_KEY }}
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      # The credential a RENTED community host is given, forwarded in cleartext by _vast_onstart.
      # Scoped to the lane prefixes + six S3 actions a leg needs (s3_scoped_policy.py). Unset until
      # trimcrae creates the vast-leg-s3 user -> gpu_backend falls back to the broad key above, which
      # is why lanes in flight kept running. Runbook: research/compute/scoped-s3-credential-runbook.md
      VAST_S3_ACCESS_KEY_ID: ${{ secrets.VAST_S3_ACCESS_KEY_ID }}
      VAST_S3_SECRET_ACCESS_KEY: ${{ secrets.VAST_S3_SECRET_ACCESS_KEY }}
      VAST_S3_SCOPED_STS: ${{ vars.VAST_S3_SCOPED_STS }}
      AWS_DEFAULT_REGION: us-east-2
    steps:
      - uses: actions/checkout@v4
        with: { ref: "${{ github.ref_name }}", fetch-depth: 0 }
      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }
      - name: Price 4 legs, and LAUNCH THEM the moment the board clears
        # ★ SELF-CHAINING, BECAUSE AN AGENT IS NOT COVERAGE. The lesson from 7:47 PM is that a backgrounded
        # watcher does not survive the agent stopping, so "I have a poller armed" is not a plan. This step
        # does not report that the market cleared — it DISPATCHES the launch itself. The only thing anyone
        # (or any scheduler) has to do is re-run this task; whether that produces a hold or four rented
        # hosts is decided here, with no session in the loop.
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -eo pipefail
          python -m pip install -q boto3
          RC=0
          # ★★ `--gate-for-mode`, NOT `--market-gate 4` (2026-07-27). The literal 4 was the size of the
          # MODE, not of the purchase, so it stayed 4 after all four units were rented — and this gate went
          # on pricing a four-unit fleet, clearing, and dispatching a launch that could only rent nothing.
          # It did so at 12:08, 12:26 and 12:35 PM ET; the 12:39 PM rent row then recorded a 2.032x board
          # reading beside the word `launched`, which reads as buying over trimcrae's line. Nothing was
          # bought. The gate now derives the count from the units that actually still need a host, and
          # exit 3 means "nothing to launch" — a state that must NOT dispatch and is NOT a price hold.
          python research/modalities/ternary_vast_launch.py --mode edge_reps --gate-for-mode \
            --gate-out research/modalities/ternary-vast-market-hold.json || RC=$?
          git config user.name "Claude"; git config user.email "noreply@anthropic.com"
          # ★ RECORD THE AUTHORISATION ITSELF, BEFORE DISPATCHING (2026-07-27). This is the moment a launch
          # becomes authorised, and until today it left no durable trace of its own: the CLEAR snapshot went
          # into a file the dispatched launch then OVERWROTE with its own reading, so within four minutes
          # there was no evidence anywhere that a launch had ever been cleared and fired. The ledger row is
          # append-only and nothing downstream may rewrite it.
          if [ "$RC" = 0 ]; then
            python research/modalities/ternary_launch_ledger.py --record dispatched \
              --stage market-gate --gate research/modalities/ternary-vast-market-hold.json \
              --run-url "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}" \
              --reason "board cleared both ceilings; dispatching task=edge-reps" || true
          elif [ "$RC" = 3 ]; then
            # ⏭ NOTHING TO LAUNCH. Recorded — not silent — because CLAUDE.md §6's one prohibition on a gate
            # that declines to act is that declining must be VISIBLE. But recorded as its own word: this is
            # not a price hold (the board was never consulted) and it must not run the hold clock or fire
            # the hold warning, both of which exist for an expensive market rather than a working lane.
            python research/modalities/ternary_launch_ledger.py --record nothing-to-launch \
              --stage market-gate --gate research/modalities/ternary-vast-market-hold.json \
              --run-url "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}" \
              --reason "every unit already done or hosted; no launch dispatched, no rental attempted" || true
          elif [ "$RC" = 4 ]; then
            # BLOCKED. Its own word, deliberately: exit 3 would say the lane FINISHED and exit 1 would say
            # the market was too dear. Neither is true -- units need hosts, and we are declining to buy them
            # because they have died on several hosts in a row. $0 spent; the readout names each unit and
            # its failed-host count.
            python research/modalities/ternary_launch_ledger.py --record blocked \
              --stage market-gate --gate research/modalities/ternary-vast-market-hold.json \
              --run-url "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}" \
              --reason "units withheld by the failure breaker; no launch dispatched, no rental attempted" || true
          fi
          # ★★ THE SAME UNION-ON-RACE THE RENT STEP USES, AND FOR THE SAME REASON (2026-07-28).
          # This was `git pull --rebase --autostash || true` then `git push || true` — the pattern the rent
          # step documents as having silently dropped the record of a four-host purchase. A textual 3-way
          # rebase of two appends to one JSON array conflicts routinely between lanes, and `|| true` then
          # swallows the conflict, drops the commit and leaves the authorisation unrecorded. It survived
          # here, in the step that runs FAR more often than the rent step. A union keyed on
          # (utc, outcome, run_url) cannot conflict; `--merge-from` is that union, and it is idempotent.
          BR="${{ github.ref_name }}"
          HOLDFILE=research/modalities/ternary-vast-market-hold.json
          LEDGER=research/modalities/ternary-vast-launch-attempts.json
          git add "$HOLDFILE" "$LEDGER"
          if ! git diff --cached --quiet; then
            cp "$LEDGER" /tmp/ledger-ours.json; cp "$HOLDFILE" /tmp/hold-ours.json
            case "$RC" in 0) WORD=CLEAR;; 3) WORD=NOTHING-TO-LAUNCH;; 4) WORD=BLOCKED;; *) WORD=HOLD;; esac
            MSG="tvast market snapshot: $WORD for valB_mini r1+r2 (CI)"
            for attempt in 1 2 3 4 5; do
              git commit -q -m "$MSG" || true
              if git push origin HEAD:"$BR" 2>/dev/null; then break; fi
              echo "[gate] push attempt $attempt lost a race; re-basing onto origin/$BR, unioning the ledger row"
              # Onto ORIGIN, never HEAD~1: after a lost race HEAD is an ancestor of the branch, so a commit
              # on top of it can only be rejected again as non-fast-forward. See the rent step's note.
              git fetch -q origin "$BR"; git reset -q --hard "origin/$BR"
              cp /tmp/hold-ours.json "$HOLDFILE"
              python research/modalities/ternary_launch_ledger.py --merge-from /tmp/ledger-ours.json
              git add "$HOLDFILE" "$LEDGER"
              if git diff --cached --quiet; then break; fi
            done
          fi
          echo "market-gate exit=$RC (0 = clear to rent, 1 = hold on price, 3 = nothing needs a host, 4 = withheld by the failure breaker)"

          if [ "$RC" = 0 ]; then
            echo "::notice title=TVAST MARKET CLEAR::board is within both ceilings — dispatching edge-reps."
            # FORWARD gpu_class. Without it a gate priced against one card class self-dispatches a
            # launch that buys from another — the projection and the purchase would describe
            # different markets, which is the exact mismatch the gate exists to prevent.
            # ...and FORWARD THE TIER THE GATE CLEARED, for exactly the same reason (2026-07-31). The gate
            # prices both boards and prefers the uninterruptible one whenever it clears both ceilings; a
            # dispatch that forwarded the operator input instead would price on-demand and buy bid.
            OD="$(python3 research/modalities/ternary_vast_launch.py --gate-chose-on-demand research/modalities/ternary-vast-market-hold.json)"
            echo "::notice title=TVAST TIER::gate chose $( [ "$OD" = 1 ] && echo ON-DEMAND\ \(uninterruptible\) || echo bid\ \(interruptible\) )"
            gh workflow run gpu-ternary-fep-vast.yml --ref "${{ github.ref_name }}" \
              -f task=edge-reps -f gpu_class="${{ github.event.inputs.gpu_class }}" \
              -f min_ns_per_h="${{ github.event.inputs.min_ns_per_h }}" \
              -f on_demand="$OD" \
              -f bid_floor_mult="${{ github.event.inputs.bid_floor_mult }}"
            exit 0
          fi

          if [ "$RC" = 3 ]; then
            # ⏭ THE SATISFIED-LANE PATH, AND THE WHOLE POINT OF THIS FIX: no dispatch. A launch here could
            # only print "nothing to rent", and three of them in 25 minutes is what made a working lane look
            # like a lane repeatedly buying over the buy line. Green, because nothing is wrong.
            echo "::notice title=TVAST NOTHING TO LAUNCH::every valB_mini unit is already done or already hosted — no launch dispatched and no rental attempted. The rates the lane is ALREADY paying are in research/modalities/ternary-vast-market-hold.json under live_host_rates."
            exit 0
          fi

          if [ "$RC" = 4 ]; then
            # ★★ THE BLOCKED PATH NEEDED ITS OWN ANNOTATION, NOT JUST ITS OWN LEDGER ROW (2026-07-29).
            # This gate has recorded `blocked` since the breaker went live — and then fell through to the
            # price-hold warning below, so the only line an operator actually reads said the lane was
            # waiting on trimcrae's ≤1.5×-basis decision and would launch itself the moment the board
            # cleared. Both halves are false for a breaker block: the market is not what stopped it, and no
            # tick will ever clear it. Found when the triangle gate printed exactly that against four units
            # blocked on a code fault; this gate had the same hole one branch further down.
            echo "::warning title=TVAST BLOCKED ON REPEATED FAILURE::valB_mini units are withheld by the failure breaker after dying on several hosts each — NOT held on price, and this does NOT clear on the next tick. \$0 spent. Per-unit failed-host counts: research/modalities/ternary-vast-market-hold.json under units_blocked. Fix the cause, then task=supersede-failed with leg_only=<substring>, and re-run task=market-gate."
            exit 0
          fi

          # ⏰ NO TIME-BASED ESCALATION. An earlier version failed this job once the hold passed 7:00 AM ET,
          # to fire GitHub's own notification without an agent awake. That was right while the hold was
          # still an open question, and is wrong now: the fork WAS surfaced to trimcrae on 2026-07-27 with
          # the numbers (gate CLEAR at $17.99 against a $22.28 ceiling, 2.05x basis, 12 h idle) and he chose
          # to keep holding until <=1.5x. Re-raising a question he has already answered is noise, and a
          # recurring red build is the most persistent kind of noise there is.
          #
          # So the hold is now a NORMAL, GREEN, VISIBLE state: the snapshot is committed on every single
          # evaluation, which is what makes it visible, and the job stays green because nothing is wrong.
          # Surface again only on a material CHANGE — the board clears and the launch fires (a ::notice::
          # above, plus the rented instances), or the 1.5x line turns out to be unreachable on this rung.
          echo "::warning title=TVAST MARKET HOLD::valB_mini r1+r2 held on price by trimcrae's <=1.5x-basis decision (2026-07-27). Snapshot: research/modalities/ternary-vast-market-hold.json. Re-checks hourly; launches itself the moment it clears."
          exit 0

  # ------------------------------------------------ free: valB_mini replicates — stage seeds 1+2 AND
  #                                                   prove the atom map before anything is rented
  # WHY THE REPLICATES NEED THEIR OWN PRIME. The `prime` job above hardcodes `seed0` in its cache key, and
  # that is correct rather than sloppy: `ternary_pdb_stage` sets starting_model_index = seed % n_models, so
  # seeds 1 and 2 start from DIFFERENT independently relaxed SMARCA2 models and sharing one cache would
  # silently collapse the replicate spread this programme uses as its error bar. The keys are built by
  # calling the launcher's own `stage_cache_key`, so there is exactly one expression for them in the repo.
  #
  # AND WHY IT ALSO RUNS THE MAP PRE-FLIGHT. `LomapAtomMapper(time=N)` is an MCS TIMEOUT and a timed-out MCS
  # returns its best PARTIAL match silently, so what the alchemical transformation IS depended on how fast
  # the rented host happened to be. Deriving the required heavy-atom count from the endpoints and checking
  # the production mapper against it costs $0 here and is the difference between two replicates and two
  # artifacts. It runs in the parity image, i.e. the same RDKit/OpenFE the hosts will run.
  reps_prime:
    needs: [resolve, test]
    if: ${{ needs.resolve.outputs.task == 'reps-prime' }}
    runs-on: ubuntu-latest
    timeout-minutes: 90
    concurrency:
      group: ternary-vast-mutate
      cancel-in-progress: false
    env:
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      # The credential a RENTED community host is given, forwarded in cleartext by _vast_onstart.
      # Scoped to the lane prefixes + six S3 actions a leg needs (s3_scoped_policy.py). Unset until
      # trimcrae creates the vast-leg-s3 user -> gpu_backend falls back to the broad key above, which
      # is why lanes in flight kept running. Runbook: research/compute/scoped-s3-credential-runbook.md
      VAST_S3_ACCESS_KEY_ID: ${{ secrets.VAST_S3_ACCESS_KEY_ID }}
      VAST_S3_SECRET_ACCESS_KEY: ${{ secrets.VAST_S3_SECRET_ACCESS_KEY }}
      VAST_S3_SCOPED_STS: ${{ vars.VAST_S3_SCOPED_STS }}
      AWS_DEFAULT_REGION: us-east-2
    steps:
      - uses: actions/checkout@v4
        with: { ref: "${{ github.ref_name }}" }
      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }
      - name: Stage every replicate unit on CPU and upload the seed-keyed caches
        run: |
          set -eo pipefail
          python -m pip install -q boto3
          echo "${{ secrets.DOCKERHUB_TOKEN }}" | docker login -u triskit23 --password-stdin
          mkdir -p /tmp/tin
          python - <<'PY' > /tmp/units.txt
          import sys
          sys.path.insert(0, "research/modalities")
          import ternary_vast_launch as tv
          for leg, seed, _d in tv.units_for("edge_reps"):
              print(leg, seed, tv.stage_cache_key(leg, "edge_reps", seed=seed))
          PY
          cat /tmp/units.txt
          while read -r LEG SEED KEY; do
            if aws s3 ls "$KEY" >/dev/null 2>&1; then echo "[reps-prime] HIT  $LEG seed=$SEED"; continue; fi
            echo "[reps-prime] MISS $LEG seed=$SEED -- staging on CPU"
            # ⚠ ONE STAGING DIRECTORY PER SEED, AND NEVER A DELETE. This loop first tried `rm -rf` on a
            # shared /tmp/tin/<leg> before restaging the next seed, and it FAILED THE WHOLE JOB at 7:47 PM
            # on 2026-07-26 (run 30225138660): the container writes as root into the bind mount, so the
            # staged tree is root-owned (`-rw-r--r-- 1 root root` in the job's own `ls -la`), the runner
            # user cannot remove it, `rm` exits 1 and `set -eo pipefail` kills the step. Both seed-1 units
            # had already staged and uploaded, so the failure was purely the cleanup between seeds.
            # `sudo rm -rf` would also work and is strictly worse: a per-seed directory removes the need to
            # delete anything, which means there is no ownership question and no half-deleted tree to
            # restage on top of.
            SDIR="/tmp/stage_seed${SEED}"
            mkdir -p "$SDIR"
            docker run --rm --entrypoint python \
              -v "$PWD/research/modalities:/work/research/modalities" -v "$SDIR:/tmp/tin" \
              -e SEED="$SEED" -e SSL_CERT_FILE=/etc/ssl/certs/ca-certificates.crt \
              -w /work/research/modalities \
              docker.io/triskit23/ternary-fep:latest \
              /work/research/modalities/ternary_pdb_stage.py \
                --leg-id "$LEG" --template-pdb 8G1Q --out /tmp/tin 2>&1 | tail -20
            ls -la "$SDIR/$LEG"
            # The staged tree MUST carry the seed's own SMARCA2 model. seed s -> model (s % n_models), so
            # seed 1 and seed 2 are different starting structures and a tar built from the wrong directory
            # would silently collapse the replicate spread this programme uses as its error bar.
            python3 - "$SDIR/$LEG/staging_manifest.json" "$SEED" <<'PY'
          import json, sys
          m = json.load(open(sys.argv[1])); want = int(sys.argv[2])
          sm = (m.get("starting_model") or {})
          got = sm.get("seed", m.get("seed"))
          if got is not None and int(got) != want:
              raise SystemExit(f"staged manifest says seed={got}, expected {want} — wrong tree")
          print(f"  [reps-prime] manifest ok: seed={got} model_index={sm.get('starting_model_index')} "
                f"of {sm.get('n_models_available')}")
          PY
            tar -C "$SDIR" -cf "/tmp/stage_${LEG}_${SEED}.tar" "$LEG"
            aws s3 cp "/tmp/stage_${LEG}_${SEED}.tar" "$KEY"
            echo "[reps-prime] uploaded $KEY ($(du -h /tmp/stage_${LEG}_${SEED}.tar | cut -f1))"
          done < /tmp/units.txt
      - name: $0 ATOM-MAP PRE-FLIGHT — refuse the launch if the map is short
        # This is the gate the whole replicate spend hangs on. A red step here means the map LOMAP returns
        # under the production budget is not the map the chemistry admits, i.e. the legs would run a
        # perturbation nobody designed — and would converge and report it confidently.
        run: |
          set -eo pipefail
          # ALWAYS FROM S3, never from whatever the staging step happened to leave on disk. The map is a
          # function of the two SmallMoleculeComponents built from ligands.sdf, and threed=False makes it
          # explicitly pose-independent — which is why one map is valid in the solvent, binary and ternary
          # legs (reviewer item 3). Reading the cache the HOSTS will read means this checks the bytes that
          # will actually be simulated, not a local copy that happens to agree.
          mkdir -p /tmp/tin
          while read -r LEG SEED KEY; do
            [ "$SEED" = "1" ] || continue
            aws s3 cp "$KEY" /tmp/pf.tar || { echo "::error::no stage cache at $KEY"; exit 1; }
            tar -C /tmp/tin -xf /tmp/pf.tar
          done < /tmp/units.txt
          ls -la /tmp/tin
          docker run --rm --entrypoint python \
            -v "$PWD/research/modalities:/work/research/modalities" -v /tmp/tin:/tmp/tin \
            -e RBFE_LOMAP_TIME_S=300 -e SSL_CERT_FILE=/etc/ssl/certs/ca-certificates.crt \
            -w /work/research/modalities \
            docker.io/triskit23/ternary-fep:latest \
            /work/research/modalities/valb_map_preflight.py \
              --input-dir /tmp/tin \
              --leg-id calib_hi_to_lo__ternary_vhl \
              --leg-id calib_hi_to_lo__binary_vhl \
              --out /tmp/tin/valb-map-preflight.json 2>&1 | tail -30
          cp /tmp/tin/valb-map-preflight.json research/modalities/valb-map-preflight.json
      - name: Commit the pre-flight record
        # The map each leg ran under is the one fact that decides whether replicates are comparable to each
        # other, and it is not recoverable after the fact from anything else in the artifacts.
        run: |
          set -eo pipefail
          # ⛔ ONE HOME FOR THE PUBLISH. This was `git pull --rebase --autostash` + push: one conflict
          # leaves the repo mid-rebase, every retry dies on the wreckage of the first, and the step
          # ends GREEN having published nothing. Measured on three lanes — see the primitive's header.
          # PUBLISH_IF_CHANGED=1 because this records an EVENT, not a heartbeat: an empty commit here
          # would assert something that did not happen on this run.
          PUBLISH_IF_CHANGED=1 bash research/compute/publish_artifacts.sh "${{ github.ref_name }}" \
            "valB_mini reps: atom-map pre-flight record (CI)" \
            research/modalities/valb-map-preflight.json

  # ------------------------------------------------------------ free: RUNG 5a-KS inputs (no crystal exists)
  # WHY 5a-KS NEEDS ITS OWN PRIME. The `prime` job above stages from a crystal (RCSB 8G1Q + a SMARCA2
  # homology model). RUNG 5a-KS has no crystal to stage from — there is no PDB entry for CRBN + an NR4A-LBD
  # + this construct, which is the entire reason the rung exists. Its inputs come from a Boltz-2 co-fold
  # (rung5aks-cofold.yml task=cofold) and are assembled here, on a free runner, then PRE-SEEDED into the
  # same stage cache the hosts read. `5aks`/`5aks_smoke` set STAGE_REQUIRED=1, so if this job has not run
  # the leg fails immediately with a clear message instead of silently falling through to the crystal
  # stager with a leg id it has never heard of.
  #
  # It runs in triskit23/ternary-fep for the standing parity reason: the RDKit that assigns the ligand's
  # bond orders here is the one the FEP leg will read that SDF with.
  prime_5aks:
    needs: [resolve, test]
    if: ${{ needs.resolve.outputs.task == '5aks-prime' }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    concurrency:
      group: ternary-vast-mutate
      cancel-in-progress: false
    env:
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      # The credential a RENTED community host is given, forwarded in cleartext by _vast_onstart.
      # Scoped to the lane prefixes + six S3 actions a leg needs (s3_scoped_policy.py). Unset until
      # trimcrae creates the vast-leg-s3 user -> gpu_backend falls back to the broad key above, which
      # is why lanes in flight kept running. Runbook: research/compute/scoped-s3-credential-runbook.md
      VAST_S3_ACCESS_KEY_ID: ${{ secrets.VAST_S3_ACCESS_KEY_ID }}
      VAST_S3_SECRET_ACCESS_KEY: ${{ secrets.VAST_S3_SECRET_ACCESS_KEY }}
      VAST_S3_SCOPED_STS: ${{ vars.VAST_S3_SCOPED_STS }}
      AWS_DEFAULT_REGION: us-east-2
      COFOLD_PREFIX: ${{ github.event.inputs.cofold_prefix }}
    steps:
      - uses: actions/checkout@v4
        with: { ref: "${{ github.ref_name }}" }
      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }
      - name: Pull the co-folds, stage both legs, and seed the stage cache
        run: |
          set -eo pipefail
          python -m pip install -q boto3
          echo "${{ secrets.DOCKERHUB_TOKEN }}" | docker login -u triskit23 --password-stdin
          B="${VAST_CKPT_BUCKET:-sagemaker-us-east-2-646605541856}"
          P="${COFOLD_PREFIX:-rung5aks-cofold-v1}"
          mkdir -p /tmp/cofold /tmp/5aks_in
          aws s3 cp "s3://$B/$P/" /tmp/cofold/ --recursive --exclude '*' --include '*.cif' --only-show-errors
          # A co-fold set that did not land is the ONLY thing this job can be missing, and staging nothing
          # would otherwise seed nothing and report success.
          test "$(find /tmp/cofold -name '*.cif' | wc -l)" -ge 2 \
            || { echo "::error::fewer than 2 co-fold CIFs under s3://$B/$P — run rung5aks-cofold.yml task=cofold first"; exit 1; }
          find /tmp/cofold -name '*.cif' -printf '  %s B  %p\n'
          docker run --rm --entrypoint python \
            -v "$PWD/research/modalities:/work/research/modalities" \
            -v /tmp/cofold:/tmp/cofold -v /tmp/5aks_in:/tmp/5aks_in \
            -w /work/research/modalities \
            docker.io/triskit23/ternary-fep:latest \
            /work/research/modalities/nr4a3_5aks_stage.py \
              --cofold-dir /tmp/cofold --out-dir /tmp/5aks_in
          echo "=== staged tree ==="; find /tmp/5aks_in -type f -printf '  %s B  %p\n'
          python research/modalities/ternary_vast_launch.py --mode 5aks --seed-stage-cache /tmp/5aks_in
      - name: The staged inputs are committed, so the structures that were simulated are auditable
        run: |
          set -eo pipefail
          mkdir -p research/modalities/5aks_fep_inputs
          # The manifests only -- complex.pdb is megabytes of predicted coordinates and lives in S3. What
          # has to be in git is WHICH structure each leg started from and what it resolved.
          for d in /tmp/5aks_in/*/; do
            leg=$(basename "$d"); mkdir -p "research/modalities/5aks_fep_inputs/$leg"
            cp "$d/staging_manifest.json" "research/modalities/5aks_fep_inputs/$leg/" || true
          done
          # PUBLISH_IF_CHANGED=1: this records an EVENT, not a heartbeat — an empty commit would assert
          # something that did not happen on this run.
          # ⛔ ONE HOME FOR THE PUBLISH. The hand-rolled `git pull --rebase` this replaces wedges on a
          # conflict: the repo is left mid-rebase, every retry dies on the first one's wreckage, and the
          # step ends GREEN having published nothing. See research/compute/publish_artifacts.sh.
          PUBLISH_IF_CHANGED=1 bash research/compute/publish_artifacts.sh "${{ github.ref_name }}" \
            "RUNG 5a-KS: staging manifests for the two ternary legs (CI)" \
            research/modalities/5aks_fep_inputs


  # ============================================================================================ THE TRIANGLE
  # ★ WHAT THIS RUNG BUYS, because a reader six months from now will otherwise price it as "another edge".
  # The closure residual R = ddG_coop(T1) + ddG_coop(T2) - ddG_coop(T3) is IDENTICALLY ZERO for any error
  # that is a function of the endpoint STATE — force field, the SMARCA4->SMARCA2 homology substitution, NAGL
  # charges, protonation — because each is a per-endpoint bias and sum_cycle [eps(B)-eps(A)] telescopes to
  # exactly zero. R is non-zero ONLY for PATH error. So R decides whether r0's 1.478 kcal/mol miss is fixable
  # by sampling AT ALL: R ~ 0 says it is not (the miss is in the model or the reference data, where closure is
  # provably blind), R materially non-zero says it is. That is a discriminating experiment, which is the whole
  # reason 4 legs are worth buying — and it is 4, not 6, because r0 IS the T1 edge and is reused unaltered.
  #
  # THE THREE INVARIANTS, all of which turn R from a path-error detector into a protocol-difference detector
  # if broken, and every one of them is enforced in code rather than remembered:
  #   * 2 fs / 1 fs   — pinned by `MODES['triangle']`, because r0 is a 2 fs leg and this lane defaults to 4 fs.
  #   * SEED 0        — ternary seed s selects the s%n-th relaxed SMARCA2 model; mixed seeds are different
  #                     Hamiltonians and |R| would measure homology-model sensitivity instead.
  #   * UNRESTRAINED binary legs — matching r0. A separate lane is concurrently building a RESTRAINED binary
  #                     re-run for a DIFFERENT purpose; the two must never be conflated or their legs mixed.

  # ---------------------------------------------------------- free: derive the third vertex, once, and freeze it
  # cmpd4" exists in no crystal. It is DERIVED — exactly as cmpd4 itself is in `wurz-calib-frozen.json` — and
  # frozen here so that what was simulated is recoverable from git rather than recomputed by whatever RDKit
  # happens to be installed later. Two INDEPENDENT routes (edit the frozen cmpd4; edit the frozen cmpd1 twice)
  # must produce the identical canonical SMILES: that agreement is the closure PREREQUISITE, because if the
  # two constructions disagree the three edges do not share endpoints and R is not a closure residual at all.
  # Runs in the parity image: the RDKit that derives the molecule is the RDKit the legs will read it with.
  triangle_freeze:
    needs: [resolve, test]
    if: ${{ needs.resolve.outputs.task == 'triangle-freeze' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with: { ref: "${{ github.ref_name }}" }
      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }
      - name: Derive cmpd4" by two independent routes, in the production mapper's own container
        run: |
          set -eo pipefail
          # ⏱ RETRY THE LOGIN. Measured on run 30293740988: `docker login` failed with
          # `Get "https://registry-1.docker.io/v2/": context deadline exceeded` — a Docker Hub connect
          # timeout on the runner, nothing to do with this lane's code. It killed a $0 job that had
          # already checked out and set up Python. Three spaced attempts cost seconds and remove a
          # whole class of red builds that say nothing about the science.
          for i in 1 2 3; do
            echo "${{ secrets.DOCKERHUB_TOKEN }}" | docker login -u triskit23 --password-stdin && break
            echo "[docker] login attempt $i failed — retrying in 20s"; sleep 20
          done
          docker run --rm --entrypoint python \
            -v "$PWD/research/modalities:/work/research/modalities" \
            -w /work/research/modalities \
            docker.io/triskit23/ternary-fep:latest \
            /work/research/modalities/valb_triangle_legs.py --derive
          sudo chown "$(id -u):$(id -g)" research/modalities/valb-triangle-frozen.json 2>/dev/null || true
      - name: Re-derive and refuse any drift
        # `derive()` succeeding is not the same as the freeze on disk matching it — the same discipline
        # `ternary_coop.load_pilot_legs` applies to the pilot bundle. A freeze that no longer re-derives is a
        # silent scientific drift, and this is the last moment it costs nothing to catch.
        run: |
          set -eo pipefail
          docker run --rm --entrypoint python \
            -v "$PWD/research/modalities:/work/research/modalities" \
            -w /work/research/modalities \
            docker.io/triskit23/ternary-fep:latest \
            /work/research/modalities/valb_triangle_legs.py --verify
      - name: Commit the freeze — the molecule that will be simulated must be in git BEFORE it is simulated
        run: |
          set -eo pipefail
          # ⛔ ONE HOME FOR THE PUBLISH. The hand-rolled `git pull --rebase` this replaces wedges on a
          # conflict: the repo is left mid-rebase, every retry dies on the first one's wreckage, and
          # the step ends GREEN having published nothing. See research/compute/publish_artifacts.sh.
          # PUBLISH_IF_CHANGED=1: this records an EVENT, not a heartbeat — an empty commit would
          # assert something that did not happen on this run.
          PUBLISH_IF_CHANGED=1 bash research/compute/publish_artifacts.sh "${{ github.ref_name }}" \
            "valB closure triangle: freeze cmpd4\" (two independent routes agree) (CI)" \
            research/modalities/valb-triangle-frozen.json

  # ------------------------------------------------- free: stage all four legs on CPU AND prove both new maps
  # Two wins, both real: it removes ~8-15 min of GPU-idle staging from EACH paid host, and it discovers a
  # first-time staging failure for two brand-new leg ids at $0 instead of on a 4090.
  #
  # AND THE ATOM-MAP PRE-FLIGHT IS THE GATE THE WHOLE SPEND HANGS ON. `LomapAtomMapper(time=N)` is an MCS
  # TIMEOUT, and a timed-out MCS returns its best PARTIAL match SILENTLY — so a leg can converge and report a
  # confident ΔG for a perturbation nobody designed. That risk is HIGHER here than on any previous rung,
  # because T3 (cmpd1 -> cmpd4") is a ring-nitrogen 1,2-SHIFT: two changed atoms rather than one, and the
  # first perturbation on this lane that no single-atom pose mutation can build.
  triangle_prime:
    needs: [resolve, test]
    if: ${{ needs.resolve.outputs.task == 'triangle-prime' }}
    runs-on: ubuntu-latest
    timeout-minutes: 90
    concurrency:
      group: ternary-vast-mutate
      cancel-in-progress: false
    env:
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      VAST_S3_ACCESS_KEY_ID: ${{ secrets.VAST_S3_ACCESS_KEY_ID }}
      VAST_S3_SECRET_ACCESS_KEY: ${{ secrets.VAST_S3_SECRET_ACCESS_KEY }}
      VAST_S3_SCOPED_STS: ${{ vars.VAST_S3_SCOPED_STS }}
      AWS_DEFAULT_REGION: us-east-2
    steps:
      - uses: actions/checkout@v4
        with: { ref: "${{ github.ref_name }}" }
      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }
      - name: The freeze must exist BEFORE anything is staged
        # Without it `ternary_coop_prep._morph_endpoints` returns calib_lo2 unresolved, and the stager would
        # fail deep inside a container with a message about a missing SMILES. Failing here says what to do.
        run: |
          set -eo pipefail
          test -s research/modalities/valb-triangle-frozen.json \
            || { echo "::error::no valb-triangle-frozen.json — run task=triangle-freeze first"; exit 1; }
          python3 -c "import json;d=json.load(open('research/modalities/valb-triangle-frozen.json'));print('calib_lo2 =', d['calib_lo2']['smiles'])"
      - name: Stage every triangle leg on CPU and upload the caches
        run: |
          set -eo pipefail
          python -m pip install -q boto3
          # ⏱ RETRY THE LOGIN. Measured on run 30293740988: `docker login` failed with
          # `Get "https://registry-1.docker.io/v2/": context deadline exceeded` — a Docker Hub connect
          # timeout on the runner, nothing to do with this lane's code. It killed a $0 job that had
          # already checked out and set up Python. Three spaced attempts cost seconds and remove a
          # whole class of red builds that say nothing about the science.
          for i in 1 2 3; do
            echo "${{ secrets.DOCKERHUB_TOKEN }}" | docker login -u triskit23 --password-stdin && break
            echo "[docker] login attempt $i failed — retrying in 20s"; sleep 20
          done
          mkdir -p /tmp/tin
          python - <<'PY' > /tmp/units.txt
          import sys
          sys.path.insert(0, "research/modalities")
          import ternary_vast_launch as tv
          for leg, seed, _d in tv.units_for("triangle"):
              print(leg, seed, tv.stage_cache_key(leg, "triangle", seed=seed))
          PY
          cat /tmp/units.txt
          while read -r LEG SEED KEY; do
            if aws s3 ls "$KEY" >/dev/null 2>&1; then echo "[triangle-prime] HIT  $LEG seed=$SEED"; continue; fi
            echo "[triangle-prime] MISS $LEG seed=$SEED -- staging on CPU"
            # One directory per leg and NEVER a delete: the container writes as root into the bind mount, so a
            # shared directory cannot be cleaned up by the runner user and `rm` would fail the whole job under
            # `set -eo pipefail` (measured on the reps-prime job, 2026-07-26, run 30225138660).
            SDIR="/tmp/stage_${LEG}"
            mkdir -p "$SDIR"
            T0=$(date +%s)
            # ⏱ STREAM IT, WITH TIMESTAMPS — DO NOT `| tail -20`. Measured on run 30295025398: this step sat
            # on its FIRST leg for 20+ minutes emitting NOTHING, because `tail` cannot print until the
            # container exits. A staging phase that is genuinely slow and one that has hung are then
            # indistinguishable, which is exactly the "liveness, not progress" trap CLAUDE.md §4 is about —
            # and it cost a cancellation decision made without evidence. `-u` and `PYTHONUNBUFFERED` are both
            # set because the stager's own prints are block-buffered into a pipe otherwise.
            docker run --rm --entrypoint python \
              -v "$PWD/research/modalities:/work/research/modalities" -v "$SDIR:/tmp/tin" \
              -e SEED="$SEED" -e PYTHONUNBUFFERED=1 -e SSL_CERT_FILE=/etc/ssl/certs/ca-certificates.crt \
              -w /work/research/modalities \
              docker.io/triskit23/ternary-fep:latest -u \
              /work/research/modalities/ternary_pdb_stage.py \
                --leg-id "$LEG" --template-pdb 8G1Q --out /tmp/tin 2>&1 \
              | while IFS= read -r line; do printf '%s [stage %s] %s\n' "$(date -u +%H:%M:%SZ)" "$LEG" "$line"; done
            echo "[triangle-prime] $LEG staged in $(( $(date +%s) - T0 ))s"
            ls -la "$SDIR/$LEG"
            tar -C "$SDIR" -cf "/tmp/stage_${LEG}_${SEED}.tar" "$LEG"
            aws s3 cp "/tmp/stage_${LEG}_${SEED}.tar" "$KEY"
            echo "[triangle-prime] uploaded $KEY ($(du -h /tmp/stage_${LEG}_${SEED}.tar | cut -f1))"
          done < /tmp/units.txt
      - name: $0 ATOM-MAP PRE-FLIGHT — refuse the launch if either new map is short
        run: |
          set -eo pipefail
          mkdir -p /tmp/pf
          while read -r LEG SEED KEY; do
            aws s3 cp "$KEY" /tmp/pf.tar || { echo "::error::no stage cache at $KEY"; exit 1; }
            tar -C /tmp/pf -xf /tmp/pf.tar
          done < /tmp/units.txt
          ls -la /tmp/pf
          docker run --rm --entrypoint python \
            -v "$PWD/research/modalities:/work/research/modalities" -v /tmp/pf:/tmp/pf \
            -e RBFE_LOMAP_TIME_S=300 -e SSL_CERT_FILE=/etc/ssl/certs/ca-certificates.crt \
            -w /work/research/modalities \
            docker.io/triskit23/ternary-fep:latest \
            /work/research/modalities/valb_map_preflight.py \
              --input-dir /tmp/pf \
              --leg-id calib_lo_to_lo2__ternary_vhl \
              --leg-id calib_lo_to_lo2__binary_vhl \
              --leg-id calib_hi_to_lo2__ternary_vhl \
              --leg-id calib_hi_to_lo2__binary_vhl \
              --out /tmp/pf/valb-triangle-map-preflight.json 2>&1 | tail -40
          cp /tmp/pf/valb-triangle-map-preflight.json research/modalities/valb-triangle-map-preflight.json
      # ★★ AND AGAIN AGAINST THE BYTES THE HOST ACTUALLY RUNS (2026-07-27, 9:30 PM ET).
      #
      # THE BLINDNESS THIS CLOSES. The pre-flight above reads the STAGE cache. `run_ternary_leg.sh` copies the
      # PRE-EQUIL cache over the top of it before the engine sees anything, so the gate and the host were
      # grading different bytes — and on 2026-07-27 that gap passed both `calib_lo_to_lo2` legs at 7:51 PM ET
      # which then died 8 minutes into their rentals on a deterministic
      # `ValueError: Incorrect number of partial charges: 109 were provided for 110 atoms`, because the
      # relaxed SDF carried a stale charge array the rebuild's atom count no longer matched. The gate could
      # not have caught it: it called the very function that raised, on inputs the host never uses.
      #
      # The root cause is fixed at the engine boundary (`nr4a3_rbfe.strip_foreign_partial_charges`), so THIS
      # failure cannot recur. This step exists for the NEXT divergence between the two trees, which is a
      # structural hazard rather than a one-off bug: any future difference between what we grade and what we
      # run is exactly as invisible as this one was.
      #
      # A pre-equil cache MISS is not a failure — the overlay is then a no-op and the tree equals the stage
      # tree, which is the correct thing to grade when no relaxation exists yet.
      - name: $0 ATOM-MAP PRE-FLIGHT, ON THE AS-RUN TREE (stage + pre-equil overlay)
        run: |
          set -eo pipefail
          python -m pip install -q boto3
          mkdir -p /tmp/asrun
          python - <<'PYEOF'
          import sys
          sys.path.insert(0, "research/modalities")
          import valb_triangle_charge_forensic as f
          # Mirrors run_ternary_leg.sh exactly: the two tars have different layouts and are unpacked
          # differently. That mirroring is the whole point — a check that assembles the tree its own way
          # grades a third thing that nobody runs.
          f.fetch_caches("triangle", "/tmp/asrun")
          PYEOF
          ls -la /tmp/asrun/asrun || { echo "::error::the as-run tree was not assembled"; exit 1; }
          docker run --rm --entrypoint python \
            -v "$PWD/research/modalities:/work/research/modalities" -v /tmp/asrun:/tmp/asrun \
            -e RBFE_LOMAP_TIME_S=300 -e SSL_CERT_FILE=/etc/ssl/certs/ca-certificates.crt \
            -w /work/research/modalities \
            docker.io/triskit23/ternary-fep:latest \
            /work/research/modalities/valb_map_preflight.py \
              --input-dir /tmp/asrun/asrun \
              --leg-id calib_lo_to_lo2__ternary_vhl \
              --leg-id calib_lo_to_lo2__binary_vhl \
              --leg-id calib_hi_to_lo2__ternary_vhl \
              --leg-id calib_hi_to_lo2__binary_vhl \
              --out /tmp/asrun/valb-triangle-map-preflight-asrun.json 2>&1 | tail -40
          cp /tmp/asrun/valb-triangle-map-preflight-asrun.json \
             research/modalities/valb-triangle-map-preflight-asrun.json
      - name: Commit the pre-flight record
        run: |
          set -eo pipefail
          # ⛔ ONE HOME FOR THE PUBLISH. The hand-rolled `git pull --rebase` this replaces wedges on a
          # conflict: the repo is left mid-rebase, every retry dies on the first one's wreckage, and
          # the step ends GREEN having published nothing. See research/compute/publish_artifacts.sh.
          # PUBLISH_IF_CHANGED=1: this records an EVENT, not a heartbeat — an empty commit would
          # assert something that did not happen on this run.
          PUBLISH_IF_CHANGED=1 bash research/compute/publish_artifacts.sh "${{ github.ref_name }}" \
            "valB closure triangle: atom-map pre-flight for T2 and T3 (CI)" \
            research/modalities/valb-triangle-map-preflight.json \
            research/modalities/valb-triangle-map-preflight-asrun.json

  # ------------------------------------------------ free: price the 4 legs, rent nothing, and self-dispatch
  # Same code path the launch job's board snapshot uses — not a second opinion free to disagree with it. The
  # dollar ceiling here is the TRIANGLE's own costed range (`valb_triangle_closure.price_triangle`), not the
  # ladder's 4 fs recalibration band: judging one experiment's spend against another's authorisation is how a
  # guard comes to refuse a small approved purchase for a reason that does not apply to it.
  triangle_gate:
    needs: [resolve, test]
    if: ${{ needs.resolve.outputs.task == 'triangle-gate' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
      actions: write
    env:
      # priced with the SAME class the launch would buy — otherwise the gate projects a
      # market we would not actually rent from.
      TVAST_GPU: ${{ github.event.inputs.gpu_class }}
      TVAST_MIN_NS_PER_H: ${{ github.event.inputs.min_ns_per_h }}
      TVAST_ON_DEMAND: ${{ github.event.inputs.on_demand }}
      TVAST_PRUNE_CHK: ${{ vars.TVAST_PRUNE_CHK }}
      VAST_BID_FLOOR_MULT: ${{ github.event.inputs.bid_floor_mult }}
      VAST_API_KEY: ${{ secrets.VAST_API_KEY }}
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      VAST_S3_ACCESS_KEY_ID: ${{ secrets.VAST_S3_ACCESS_KEY_ID }}
      VAST_S3_SECRET_ACCESS_KEY: ${{ secrets.VAST_S3_SECRET_ACCESS_KEY }}
      VAST_S3_SCOPED_STS: ${{ vars.VAST_S3_SCOPED_STS }}
      AWS_DEFAULT_REGION: us-east-2
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with: { ref: "${{ github.ref_name }}", fetch-depth: 0 }
      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }
      - name: Price the triangle, and LAUNCH it the moment the board clears
        run: |
          set -eo pipefail
          python -m pip install -q boto3
          RC=0
          python research/modalities/ternary_vast_launch.py --mode triangle --gate-for-mode \
            --gate-out research/modalities/valb-triangle-market-hold.json || RC=$?
          git config user.name "Claude"; git config user.email "noreply@anthropic.com"
          if [ "$RC" = 0 ]; then
            python research/modalities/ternary_launch_ledger.py --record dispatched \
              --stage triangle-gate --gate research/modalities/valb-triangle-market-hold.json \
              --run-url "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}" \
              --reason "board cleared both ceilings; dispatching task=triangle" || true
          elif [ "$RC" = 3 ]; then
            python research/modalities/ternary_launch_ledger.py --record nothing-to-launch \
              --stage triangle-gate --gate research/modalities/valb-triangle-market-hold.json \
              --run-url "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}" \
              --reason "every triangle leg already done or hosted; no launch dispatched, no rental attempted" || true
          elif [ "$RC" = 4 ]; then
            # ★★ BLOCKED — AND IT HAD NO BRANCH HERE UNTIL 2026-07-29, WHICH IS WHY IT PRINTED AS A PRICE
            # HOLD. The valB_mini gate has carried exit 4 since the breaker went live; this gate, written
            # from the same template afterwards, stopped at 3. So when all four triangle legs went BLOCKED
            # on the partial-charge defect (15, 15, 7 and 21 dead hosts), the launcher's own readout said
            # "⛔ BLOCKED ON REPEATED FAILURE" one line above a job annotation reading "HELD on price …
            # re-checks on the next tick and launches itself the moment it clears".
            #
            # That is not a cosmetic mismatch, and it is the same defect as CLAUDE.md §1's "a row we are
            # paying and a row the gate refused must never render alike" seen from the other side. A price
            # hold is SELF-CLEARING: it is a true statement that the lane is alive and waiting on a number
            # that moves on its own. A breaker block is the opposite — nothing about the market will ever
            # change it, and the promise of a tick that clears it is a promise that cannot be kept. A lane
            # stalled on a code fault would have looked, in the only place an operator reads, exactly like a
            # lane patiently waiting out an expensive hour. One glyph, one meaning.
            python research/modalities/ternary_launch_ledger.py --record blocked \
              --stage triangle-gate --gate research/modalities/valb-triangle-market-hold.json \
              --run-url "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}" \
              --reason "triangle units withheld by the failure breaker; no launch dispatched, no rental attempted" || true
          fi
          # ⛔ THE SNAPSHOT IS COMMITTED ON EVERY EVALUATION, CLEAR OR HOLD. CLAUDE.md §6's one prohibition on
          # a gate that declines to buy is that declining must never be SILENT: a fleet that never launched
          # looks identical to one that finished, and the only thing that tells them apart is a hold readout
          # carrying the market snapshot that caused it.
          # Union-on-race, identical to the valB_mini gate above — same artifact, same defect, same fix.
          BR="${{ github.ref_name }}"
          HOLDFILE=research/modalities/valb-triangle-market-hold.json
          LEDGER=research/modalities/ternary-vast-launch-attempts.json
          git add "$HOLDFILE" "$LEDGER"
          if ! git diff --cached --quiet; then
            cp "$LEDGER" /tmp/ledger-ours.json; cp "$HOLDFILE" /tmp/hold-ours.json
            # The commit subject is the only part of this that survives into `git log`, so it carries the
            # same four words the ledger does — a `HOLD` subject on a breaker block would put the wrong
            # cause into the permanent record. Mirrors the valB_mini gate's case exactly.
            case "$RC" in 0) WORD=CLEAR;; 3) WORD=NOTHING-TO-LAUNCH;; 4) WORD=BLOCKED;; *) WORD=HOLD;; esac
            MSG="valB triangle market snapshot: $WORD (CI)"
            for attempt in 1 2 3 4 5; do
              git commit -q -m "$MSG" || true
              if git push origin HEAD:"$BR" 2>/dev/null; then break; fi
              echo "[gate] push attempt $attempt lost a race; re-basing onto origin/$BR, unioning the ledger row"
              git fetch -q origin "$BR"; git reset -q --hard "origin/$BR"
              cp /tmp/hold-ours.json "$HOLDFILE"
              python research/modalities/ternary_launch_ledger.py --merge-from /tmp/ledger-ours.json
              git add "$HOLDFILE" "$LEDGER"
              if git diff --cached --quiet; then break; fi
            done
          fi
          echo "triangle-gate exit=$RC (0 = clear to rent, 1 = hold on price, 3 = nothing needs a host, 4 = withheld by the failure breaker)"
          if [ "$RC" = 0 ]; then
            echo "::notice title=TRIANGLE MARKET CLEAR::board is within BOTH the triangle's own dollar ceiling and the \$/ns buy line — dispatching task=triangle."
            # FORWARD gpu_class. Without it a gate priced against one card class self-dispatches a
            # launch that buys from another — the projection and the purchase would describe
            # different markets, which is the exact mismatch the gate exists to prevent.
            # RESOLVE the retention bid. A SCHEDULED tick passes bid_floor_mult blank, and the tick re-places a
            # dead host within minutes — so an authorised hand dispatch carrying the override only lands if it
            # hits the gap between a host dying and the next tick, and measured 2026-07-30 it does not: T3
            # ternary was re-placed by auto ticks at 10:35 AM and 12:27/12:32/12:35 PM, ahead of two hand
            # dispatches. retention_bid.py supplies the multiple for a NAMED churning leg; an explicit input
            # always wins, and an empty or disabled list resolves to "" — byte-identical to the previous
            # behaviour for every leg not named. It cannot cause a rental: the gate has already cleared.
            BID="$(python3 research/modalities/retention_bid.py "${{ github.event.inputs.bid_floor_mult }}")"
            echo "::notice title=TVAST RETENTION BID::$(python3 research/modalities/retention_bid.py "${{ github.event.inputs.bid_floor_mult }}" --explain)"
            # ★★ THE LAUNCH BUYS THE TIER THE GATE PRICED AND CLEARED (trimcrae, 2026-07-31). The gate now
            # prices BOTH boards and prefers the uninterruptible tier whenever it clears both ceilings; if the
            # dispatch below still forwarded the operator input, a gate that cleared on-demand would
            # self-dispatch a BID launch — the projection and the purchase describing different markets, which
            # is the exact mismatch the gate exists to prevent (the same argument as forwarding `gpu_class`).
            OD="$(python3 research/modalities/ternary_vast_launch.py --gate-chose-on-demand research/modalities/valb-triangle-market-hold.json)"
            echo "::notice title=TVAST TIER::gate chose $( [ "$OD" = 1 ] && echo ON-DEMAND\ \(uninterruptible\) || echo bid\ \(interruptible\) )"
            gh workflow run gpu-ternary-fep-vast.yml --ref "${{ github.ref_name }}" \
              -f task=triangle -f gpu_class="${{ github.event.inputs.gpu_class }}" \
              -f min_ns_per_h="${{ github.event.inputs.min_ns_per_h }}" \
              -f on_demand="$OD" \
              -f bid_floor_mult="$BID"
            exit 0
          fi
          if [ "$RC" = 3 ]; then
            echo "::notice title=TRIANGLE NOTHING TO LAUNCH::every triangle leg is already done or already hosted — no launch dispatched, no rental attempted."
            exit 0
          fi
          if [ "$RC" = 4 ]; then
            # Green, like the hold below, and for the same reason: the fact is recorded and a red build every
            # tick would only bury it. But the SENTENCE is the opposite one — nothing here self-clears, and
            # naming the remedy is the point, because the operator reading this is the only thing that will
            # act on it.
            echo "::warning title=TRIANGLE BLOCKED ON REPEATED FAILURE::the valB closure triangle is NOT held on price — its units are withheld by the failure breaker after dying on several hosts each. This does NOT clear on the next tick and no rental was attempted (\$0). Fix the cause, then task=supersede-failed with leg_only=to_lo2 (or leg_failure_breaker.reset_for), and re-run task=triangle-gate."
            exit 0
          fi
          # A HOLD IS A NORMAL, GREEN, VISIBLE STATE — never a red build. The snapshot is committed above,
          # which is what makes it visible; failing the job would only add recurring noise to a decision that
          # is already recorded. Never raise a bid to clear it, and never launch past the ceiling.
          echo "::warning title=TRIANGLE MARKET HOLD::the valB closure triangle is HELD on price. Snapshot (with the offers that caused it): research/modalities/valb-triangle-market-hold.json. Re-checks on the next tick and launches itself the moment it clears."
          exit 0

  # ------------------------------------------------------------------- RUNG 5a-KS's re-placement gate
  # ★★ WHY THIS JOB EXISTS, AND WHAT ITS ABSENCE COST (2026-07-31). RUNG 5a-KS was the mode actually running
  # that day and it was the only running mode with NO gate. When `5aks_d0_to_d__ternary_nr4a3_r0` lost its
  # host to a capacity refusal on machine 145841, the lane destroyed the box, stopped billing and preserved
  # the checkpoint at `production/840` — all correct — and then printed "this pass dispatches the gate to
  # re-place it" while dispatching nothing, because `collect`'s re-placement map had entries only for
  # `edge_reps` and the triangle. The ledger shows the 7:39, 7:47 and 7:55 AM ET ticks each evaluating a
  # `market-gate` and a `triangle-gate` and no 5aks gate at all. A leg with an intact checkpoint would have
  # sat stranded until a human noticed.
  #
  # It is the `triangle_gate` job with `--mode 5aks` and its own snapshot file, deliberately rather than a
  # generalised gate: the two lanes' hold artifacts are read separately and merging them would give one fact
  # two homes. The MAP that routes a mode here is NOT duplicated in shell — see
  # `ternary_vast_launch.MODE_GATE_TASK`, whose whole point is that the next mode cannot be added without a
  # re-placement decision.
  gate_5aks:
    needs: [resolve, test]
    if: ${{ needs.resolve.outputs.task == '5aks-gate' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
      actions: write
    env:
      # priced with the SAME class the launch would buy — otherwise the gate projects a
      # market we would not actually rent from.
      TVAST_GPU: ${{ github.event.inputs.gpu_class }}
      TVAST_MIN_NS_PER_H: ${{ github.event.inputs.min_ns_per_h }}
      TVAST_ON_DEMAND: ${{ github.event.inputs.on_demand }}
      TVAST_PRUNE_CHK: ${{ vars.TVAST_PRUNE_CHK }}
      VAST_BID_FLOOR_MULT: ${{ github.event.inputs.bid_floor_mult }}
      VAST_API_KEY: ${{ secrets.VAST_API_KEY }}
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      VAST_S3_ACCESS_KEY_ID: ${{ secrets.VAST_S3_ACCESS_KEY_ID }}
      VAST_S3_SECRET_ACCESS_KEY: ${{ secrets.VAST_S3_SECRET_ACCESS_KEY }}
      VAST_S3_SCOPED_STS: ${{ vars.VAST_S3_SCOPED_STS }}
      AWS_DEFAULT_REGION: us-east-2
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with: { ref: "${{ github.ref_name }}", fetch-depth: 0 }
      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }
      - name: Price RUNG 5a-KS, and LAUNCH it the moment the board clears
        run: |
          set -eo pipefail
          python -m pip install -q boto3
          RC=0
          python research/modalities/ternary_vast_launch.py --mode 5aks --gate-for-mode \
            --gate-out research/modalities/5aks-market-hold.json || RC=$?
          git config user.name "Claude"; git config user.email "noreply@anthropic.com"
          if [ "$RC" = 0 ]; then
            python research/modalities/ternary_launch_ledger.py --record dispatched \
              --stage 5aks-gate --gate research/modalities/5aks-market-hold.json \
              --run-url "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}" \
              --reason "board cleared both ceilings; dispatching task=5aks" || true
          elif [ "$RC" = 3 ]; then
            python research/modalities/ternary_launch_ledger.py --record nothing-to-launch \
              --stage 5aks-gate --gate research/modalities/5aks-market-hold.json \
              --run-url "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}" \
              --reason "every 5a-KS leg already done or hosted; no launch dispatched, no rental attempted" || true
          elif [ "$RC" = 4 ]; then
            python research/modalities/ternary_launch_ledger.py --record blocked \
              --stage 5aks-gate --gate research/modalities/5aks-market-hold.json \
              --run-url "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}" \
              --reason "5a-KS units withheld by the failure breaker; no launch dispatched, no rental attempted" || true
          fi
          # The snapshot is committed on EVERY evaluation, clear or hold — CLAUDE.md §6's one prohibition is
          # that declining to buy must never be silent. Union-on-race, identical to the two gates above.
          BR="${{ github.ref_name }}"
          HOLDFILE=research/modalities/5aks-market-hold.json
          LEDGER=research/modalities/ternary-vast-launch-attempts.json
          git add "$HOLDFILE" "$LEDGER"
          if ! git diff --cached --quiet; then
            cp "$LEDGER" /tmp/ledger-ours.json; cp "$HOLDFILE" /tmp/hold-ours.json
            case "$RC" in 0) WORD=CLEAR;; 3) WORD=NOTHING-TO-LAUNCH;; 4) WORD=BLOCKED;; *) WORD=HOLD;; esac
            MSG="5a-KS market snapshot: $WORD (CI)"
            for attempt in 1 2 3 4 5; do
              git commit -q -m "$MSG" || true
              if git push origin HEAD:"$BR" 2>/dev/null; then break; fi
              echo "[gate] push attempt $attempt lost a race; re-basing onto origin/$BR, unioning the ledger row"
              git fetch -q origin "$BR"; git reset -q --hard "origin/$BR"
              cp /tmp/hold-ours.json "$HOLDFILE"
              python research/modalities/ternary_launch_ledger.py --merge-from /tmp/ledger-ours.json
              git add "$HOLDFILE" "$LEDGER"
              if git diff --cached --quiet; then break; fi
            done
          fi
          echo "5aks-gate exit=$RC (0 = clear to rent, 1 = hold on price, 3 = nothing needs a host, 4 = withheld by the failure breaker)"
          if [ "$RC" = 0 ]; then
            echo "::notice title=5a-KS MARKET CLEAR::board is within BOTH the rung's dollar ceiling and the \$/ns buy line — dispatching task=5aks."
            # FORWARD gpu_class and RESOLVE the retention bid, exactly as the triangle gate does: a gate
            # priced against one card class must not self-dispatch a launch that buys from another.
            BID="$(python3 research/modalities/retention_bid.py "${{ github.event.inputs.bid_floor_mult }}")"
            echo "::notice title=TVAST RETENTION BID::$(python3 research/modalities/retention_bid.py "${{ github.event.inputs.bid_floor_mult }}" --explain)"
            # ★★ THE LAUNCH BUYS THE TIER THE GATE PRICED AND CLEARED (trimcrae, 2026-07-31). The gate now
            # prices BOTH boards and prefers the uninterruptible tier whenever it clears both ceilings; if the
            # dispatch below still forwarded the operator input, a gate that cleared on-demand would
            # self-dispatch a BID launch — the projection and the purchase describing different markets, which
            # is the exact mismatch the gate exists to prevent (the same argument as forwarding `gpu_class`).
            OD="$(python3 research/modalities/ternary_vast_launch.py --gate-chose-on-demand research/modalities/5aks-market-hold.json)"
            echo "::notice title=TVAST TIER::gate chose $( [ "$OD" = 1 ] && echo ON-DEMAND\ \(uninterruptible\) || echo bid\ \(interruptible\) )"
            gh workflow run gpu-ternary-fep-vast.yml --ref "${{ github.ref_name }}" \
              -f task=5aks -f gpu_class="${{ github.event.inputs.gpu_class }}" \
              -f min_ns_per_h="${{ github.event.inputs.min_ns_per_h }}" \
              -f on_demand="$OD" \
              -f bid_floor_mult="$BID"
            exit 0
          fi
          if [ "$RC" = 3 ]; then
            echo "::notice title=5a-KS NOTHING TO LAUNCH::every 5a-KS leg is already done or already hosted — no launch dispatched, no rental attempted."
            exit 0
          fi
          if [ "$RC" = 4 ]; then
            echo "::warning title=5a-KS BLOCKED ON REPEATED FAILURE::RUNG 5a-KS is NOT held on price — its units are withheld by the failure breaker after dying on several hosts each. This does NOT clear on the next tick and no rental was attempted (\$0). Fix the cause, then task=supersede-failed with leg_only, and re-run task=5aks-gate."
            exit 0
          fi
          # A HOLD IS A NORMAL, GREEN, VISIBLE STATE — never a red build, and never cleared by raising a bid.
          echo "::warning title=5a-KS MARKET HOLD::RUNG 5a-KS is HELD on price. Snapshot (with the offers that caused it): research/modalities/5aks-market-hold.json. Re-checks on the next tick and launches itself the moment it clears."
          exit 0

  # ------------------------------------------------------------------------ free: the closure residual R
  # R is computed from SIX leg records: the four bought here plus r0's ternary and binary, which are FETCHED
  # rather than re-run — that reuse is the whole economy of the design. The reducer REFUSES a mixed seed, a
  # mixed direction, a solvent leg, a duplicate record or a missing leg, because each of those computes a
  # different quantity while looking identical.
  triangle_reduce:
    needs: resolve
    if: ${{ needs.resolve.outputs.task == 'triangle-reduce' }}
    runs-on: ubuntu-latest
    timeout-minutes: 25
    # ★ `id-token: write` — this job authenticates to GCP (WIF) and the workflow-level default is
    # `contents: write` only, which does NOT include it. The first REAL invocation of this task, on
    # 2026-07-30 the moment the fourth leg finally landed, died instantly on
    # "GitHub Actions did not inject $ACTIONS_ID_TOKEN_REQUEST_TOKEN". It had never been caught because
    # `reduce_triangle` refuses a partial cycle by construction, so until all four legs existed this job
    # had literally never run past its guard — the permission was latent for as long as the science was.
    permissions:
      contents: write
      id-token: write
    env:
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      VAST_S3_ACCESS_KEY_ID: ${{ secrets.VAST_S3_ACCESS_KEY_ID }}
      VAST_S3_SECRET_ACCESS_KEY: ${{ secrets.VAST_S3_SECRET_ACCESS_KEY }}
      VAST_S3_SCOPED_STS: ${{ vars.VAST_S3_SCOPED_STS }}
      AWS_DEFAULT_REGION: us-east-2
    steps:
      - uses: actions/checkout@v4
        with: { ref: "${{ github.ref_name }}", fetch-depth: 0 }
      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }
      - id: auth
        name: Authenticate to GCP (keyless, WIF) — because T1 DOES NOT LIVE IN THIS LANE'S S3
        # ⚠ THE GAP THIS CLOSES, FOUND BEFORE IT COST A REDUCTION. r0 ran on the GCP L4 lane, so its two leg
        # records are in `gs://<project>-rbfe-ckpt/valB-6hax/results/`, NOT in `ternary-vast/legs/`. Fetching
        # T1 with the Vast launcher's `--fetch-legs` would return nothing and the reducer would report
        # INCOMPLETE — loudly, which is the design working, but for a reason that is pure plumbing. The
        # triangle's entire economy is that r0 is REUSED rather than re-bought, so the reduce job has to be
        # able to reach the lane r0 actually ran on.
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: projects/878095411563/locations/global/workloadIdentityPools/github-pool/providers/github-provider
          service_account: gpu-runner@project-a7ebde30-e2ed-4b8d-9a9.iam.gserviceaccount.com
      - name: Set up gcloud
        uses: google-github-actions/setup-gcloud@v2
      - name: Pull the four triangle legs (S3) AND r0's two (GCS) — T1 is reused, never re-run
        run: |
          set -eo pipefail
          python -m pip install -q boto3
          mkdir -p /tmp/tri
          python research/modalities/ternary_vast_launch.py --mode triangle --fetch-legs /tmp/tri 2>&1 | tail -20
          PROJECT=project-a7ebde30-e2ed-4b8d-9a9
          RESULTS="gs://${PROJECT}-rbfe-ckpt/valB-6hax/results"
          echo "=== pulling T1 (r0) from $RESULTS ==="
          for L in calib_hi_to_lo__ternary_vhl calib_hi_to_lo__binary_vhl; do
            # ⛔ THE UNSUFFIXED, FORWARD, SEED-0 NAME ONLY — never a glob. The GCP lane writes a RESTRAINED
            # leg's result to `leg_<id>_<dir>_r<seed>_rst.json` precisely so it is NOT folded into the
            # unrestrained cycle automatically, and it writes the REVERSE leg as `_rev_`. Both live in this
            # same bucket. A `leg_*.json` glob here would quietly pull a restrained or reverse T1 into an
            # unrestrained forward triangle, and R would then measure the PROTOCOL DIFFERENCE — the one
            # failure this whole rung is built to avoid. Naming the exact file makes that impossible.
            gcloud storage cp "$RESULTS/leg_${L}_fwd_r0.json" /tmp/tri/ \
              || { echo "::error::T1's leg record ${L} is not at $RESULTS — the triangle cannot close without r0"; exit 1; }
          done
          ls -la /tmp/tri
      - name: Reduce to R, in the SAME env that produced the trajectories
        run: |
          set -eo pipefail
          # ⏱ RETRY THE LOGIN. Measured on run 30293740988: `docker login` failed with
          # `Get "https://registry-1.docker.io/v2/": context deadline exceeded` — a Docker Hub connect
          # timeout on the runner, nothing to do with this lane's code. It killed a $0 job that had
          # already checked out and set up Python. Three spaced attempts cost seconds and remove a
          # whole class of red builds that say nothing about the science.
          for i in 1 2 3; do
            echo "${{ secrets.DOCKERHUB_TOKEN }}" | docker login -u triskit23 --password-stdin && break
            echo "[docker] login attempt $i failed — retrying in 20s"; sleep 20
          done
          docker run --rm --entrypoint python \
            -v "$PWD/research/modalities:/work/research/modalities" \
            -v /tmp/tri:/tmp/tri \
            -w /work/research/modalities \
            docker.io/triskit23/ternary-fep:latest \
            /work/research/modalities/valb_triangle_reduce.py --legs /tmp/tri \
              --out /work/research/modalities/valb-triangle-reduction.json
          sudo chown "$(id -u):$(id -g)" research/modalities/valb-triangle-reduction.json 2>/dev/null || true
      - name: The residual is the DELIVERABLE, so its absence is a failure
        run: |
          set -eo pipefail
          F=research/modalities/valb-triangle-reduction.json
          test -s "$F" || { echo "::error::no reduction written"; exit 1; }
          python3 - <<'PY'
          import json, sys
          d = json.load(open("research/modalities/valb-triangle-reduction.json"))
          print(json.dumps(d, indent=1)[:6000])
          dec = d.get("decision")
          if dec in ("REFUSED", "INCOMPLETE"):
              print(f"::error::the reduction returned {dec}: {d.get('reason')}")
              sys.exit(1)
          print("::notice title=valB CLOSURE TRIANGLE::R = %s (R_ternary = %s, R_binary = %s) -> %s"
                % (d.get("R_kcal"), d.get("R_ternary_kcal"), d.get("R_binary_kcal"), dec))
          PY
      - name: Verdict LAST — and both closures, never R alone
        run: |
          set +e
          echo "================ valB CLOSURE TRIANGLE ================"
          python3 - <<'PY'
          import json
          d = json.load(open("research/modalities/valb-triangle-reduction.json"))
          print("R_ternary = %s   R_binary = %s   R = %s" % (d.get("R_ternary_kcal"), d.get("R_binary_kcal"), d.get("R_kcal")))
          print("decision  =", d.get("decision"))
          print()
          print(d.get("reading", ""))
          print()
          print("HONEST LIMIT:", d.get("honest_limit", ""))
          PY
      - name: Commit the reduction
        run: |
          set -eo pipefail
          # ⛔ ONE HOME FOR THE PUBLISH. This was `git pull --rebase --autostash` + push: one conflict
          # leaves the repo mid-rebase, every retry dies on the wreckage of the first, and the step
          # ends GREEN having published nothing. Measured on three lanes — see the primitive's header.
          # PUBLISH_IF_CHANGED=1 because this records an EVENT, not a heartbeat: an empty commit here
          # would assert something that did not happen on this run.
          PUBLISH_IF_CHANGED=1 bash research/compute/publish_artifacts.sh "${{ github.ref_name }}" \
            "valB closure triangle: the residual R (CI, parity image)" \
            research/modalities/valb-triangle-reduction.json

  # ------------------------------------------------------------------ paid: rent hosts
  launch:
    needs: [resolve, test]
    if: ${{ needs.resolve.outputs.task == 'smoke' || needs.resolve.outputs.task == 'probe' || needs.resolve.outputs.task == 'edge' || needs.resolve.outputs.task == 'edge-reps' || needs.resolve.outputs.task == '5aks-smoke' || needs.resolve.outputs.task == '5aks' || needs.resolve.outputs.task == 'triangle-smoke' || needs.resolve.outputs.task == 'triangle' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    concurrency:
      group: ternary-vast-mutate
      cancel-in-progress: false
    env:
      VAST_API_KEY: ${{ secrets.VAST_API_KEY }}
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      # The credential a RENTED community host is given, forwarded in cleartext by _vast_onstart.
      # Scoped to the lane prefixes + six S3 actions a leg needs (s3_scoped_policy.py). Unset until
      # trimcrae creates the vast-leg-s3 user -> gpu_backend falls back to the broad key above, which
      # is why lanes in flight kept running. Runbook: research/compute/scoped-s3-credential-runbook.md
      VAST_S3_ACCESS_KEY_ID: ${{ secrets.VAST_S3_ACCESS_KEY_ID }}
      VAST_S3_SECRET_ACCESS_KEY: ${{ secrets.VAST_S3_SECRET_ACCESS_KEY }}
      VAST_S3_SCOPED_STS: ${{ vars.VAST_S3_SCOPED_STS }}
      AWS_DEFAULT_REGION: us-east-2
      GIT_BRANCH: ${{ github.ref_name }}
      TVAST_IMAGE: ${{ github.event.inputs.vast_image }}
      TVAST_GPU: ${{ github.event.inputs.gpu_class }}
      TVAST_MIN_NS_PER_H: ${{ github.event.inputs.min_ns_per_h }}
      TVAST_ON_DEMAND: ${{ github.event.inputs.on_demand }}
      TVAST_PRUNE_CHK: ${{ vars.TVAST_PRUNE_CHK }}
      VAST_BID_FLOOR_MULT: ${{ github.event.inputs.bid_floor_mult }}
      TVAST_TIMESTEP_FS: ${{ github.event.inputs.timestep_fs }}
      TVAST_WARMUP_TIMESTEP_FS: ${{ github.event.inputs.warmup_timestep_fs }}
    steps:
      - uses: actions/checkout@v4
        # fetch-depth 0 because the arm step below commits and pushes the watch list, and a shallow clone
        # cannot rebase onto a branch another job (or the agent) has moved in the meantime.
        with: { ref: "${{ github.ref_name }}", fetch-depth: 0 }
      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }

      # ================================================================================================
      # ⛔ WHERE THE PRICE GUARD LIVES NOW, AND WHY IT MOVED (2026-07-27 — this cost two authorised launches)
      # ================================================================================================
      # WHAT USED TO BE HERE: a second, independent, FATAL `--market-gate 4` that ran AFTER the atom-map
      # pre-flight and re-decided the whole purchase from scratch.
      #
      # WHAT IT DID. At 9:12 AM ET the `market_gate` job read the board at 1.261x basis, cleared, and
      # dispatched this workflow. This job then spent 2 m 35 s pulling the ternary-fep image for the
      # pre-flight and re-read the board at 9:16:28 AM ET: 2.436x. HOLD, exit 1, nothing rented. Again at
      # 9:23 -> 9:26 AM ET (1.455x -> 1.904x). So a launch required TWO independent board reads, 3 m 24 s
      # apart, to BOTH clear the same 1.5x line — and on a board that doubles inside that window the second
      # read is close to an independent draw. The gate was not wrong either time; the pipeline was built so
      # that clearing it could not actually buy anything.
      #
      # WHY REMOVING IT IS NOT A WEAKENING — IT IS STRICTLY STRONGER. The board-mean test was always the
      # wrong instrument for "may we rent THIS host": a mean under the line can contain an offer over it,
      # pulled down by cheaper siblings (trimcrae, 2026-07-27: *"Why are there so many high $/ns rows that
      # are flagged but you're still paying for them?"*). The refusal now lives at SELECTION, as
      # `ResourceSpec.max_usd_per_ns` = 1.5x basis, travelling with the JobSpec into
      # `rank_offers_by_usd_per_ns` — so no offer above the line is even visible to the renter, on every
      # fallback after a capacity refusal too. Nothing above 1.5x can be bought by this lane, from any path,
      # including a resume. That is CLAUDE.md §6's "a relaunch is a new purchase" enforced structurally
      # rather than by a step someone has to remember to keep in front of the rental.
      #
      # AND UNITS ARE NO LONGER ALL-OR-NOTHING, which is trimcrae's own 2026-07-27 ruling on the sibling
      # lane: *"The fanout fleet doesn't all have to run at the same time. If 5 GPUs are cheap enough and
      # the rest aren't, only run 5."* What the board can supply under the line is bought; the rest are
      # picked up by the next hourly tick, from checkpoints, at no loss. §6's one prohibition — do not drop
      # units SILENTLY — is met by the ledger step below, and renting zero units is a RED job.
      - name: Board snapshot ($/ns) — FIRST, cheap, and advisory
        # Runs BEFORE the image pull, not after it, because a price reading taken behind a 2.5-minute
        # docker pull is a reading of a different market than the one that authorised the launch.
        # Non-fatal by design: it exists to put the numbers in the log and the ledger beside what was
        # actually bought, so a launch can be graded against the board it faced. It writes its OWN file —
        # the launch must never overwrite `ternary-vast-market-hold.json`, because on 2026-07-27 doing
        # exactly that erased the CLEAR snapshot that had authorised the dispatch and left the lane looking
        # like an ordinary hold.
        #
        # ⚠ AND IT PRICES THE UNITS THIS LAUNCH WILL ACTUALLY RENT, NOT A FIXED FOUR (2026-07-27). This step
        # is where the 12:39 PM ET row's `gate_ratio_vs_basis: 2.032` came from. It was a mean over the four
        # cheapest offers on the board — for a launch that went on to rent NOTHING, because all four units
        # were already running. A board mean for a purchase that never happens is not "the board it faced";
        # it is a number with no referent, and it sat in the ledger beside the word `launched` reading as a
        # 2.03x buy. With `--gate-for-mode` a zero-rental tick records "nothing to launch" instead.
        continue-on-error: true
        run: |
          set -eo pipefail
          python -m pip install -q boto3
          # ★ THE MODE BEING LAUNCHED, NOT A HARDCODED ONE. `--gate-for-mode` derives the unit count from
          # the units that still need a host, but the MODE decides which units those are AND which
          # authorisation the dollars are judged against — the triangle's band is `price_triangle()`'s, not
          # the ladder's 4 fs recalibration band. Pricing a triangle launch as edge_reps would put a board
          # reading for a purchase that is not happening beside the word `launched`, which is exactly the
          # 12:39 PM ET defect this step already carries a note about.
          MODE=$(printf '%s' "${{ needs.resolve.outputs.task }}" | tr '-' '_')
          python research/modalities/ternary_vast_launch.py --mode "$MODE" --gate-for-mode \
            --gate-out /tmp/launch-board.json || true

      - name: ATOM-MAP GATE — the launch cannot rent until the map is proven complete
        # ★ STRUCTURAL, NOT REMEMBERED. `reps-prime` already runs this, but a gate that depends on someone
        # having dispatched the right task first is not a gate. `LomapAtomMapper(time=N)` silently returns a
        # PARTIAL map when its MCS times out, and a leg under a short map converges and returns a confident
        # ΔG for a perturbation nobody designed — while `protocol_hash` (settings only), system identity
        # (particle counts, unchanged by dummy-isation) and the 5-part gate (which reads unmapped atoms as
        # evidence of "a real perturbation") all report green. This step derives the required heavy-atom
        # count from the endpoints' own MCS and fails the job BEFORE any rental if the mapper falls short.
        # Cost: one image pull. Cost of not having it: two full replicate rentals that answer nothing.
        #
        # ★★ AND IT RECORDS WHICH PHASE IT REACHED, BECAUSE A GATE THAT DIED IS NOT A GATE THAT REFUSED
        # (2026-07-27, 6:01 PM ET). `task=triangle-smoke` (run 30309074338) failed in this step and the
        # ledger filed `failed` / "job status failure". Read beside this step's NAME — which says the launch
        # cannot rent until the map is proven complete — that row is indistinguishable from the mapper
        # coming up short on T3's closing edge, the one genuinely hard map in the set and so the first thing
        # a reader suspects. It had not: `docker login` timed out 15.5 s in (`auth.docker.io ... context
        # deadline exceeded`), so the units file, the stage pull and the pre-flight container never ran, and
        # the four maps had already measured COMPLETE at 3:54 PM ET (`valb-triangle-map-preflight.json`:
        # 59/59 heavy atoms on all four legs, T3's closing edge included). A diagnostic turn went to an edge
        # that was never in question. `/tmp/mapgate.status` is now the discriminator and the ledger step at
        # the bottom of this job reads it. This is the rule the shell below already states about the stage
        # cache — "could not check" must never read as "checked and fine" — applied in the other direction:
        # could not check must never read as CHECKED AND REFUSED.
        if: ${{ needs.resolve.outputs.task == 'edge-reps' || needs.resolve.outputs.task == 'triangle' || needs.resolve.outputs.task == 'triangle-smoke' }}
        run: |
          set -eo pipefail
          # Every phase below overwrites this, so the file always names the LAST phase reached. It starts
          # populated rather than empty because a status nobody wrote cannot be told from a step that never
          # started, which is the ambiguity being removed.
          echo "could-not-run: docker login" > /tmp/mapgate.status
          python -m pip install -q boto3
          # ⏱ RETRY THE LOGIN — the identical transient that killed run 30293740988 earlier the same day.
          # It is already retried at three other sites in this file and was missed at this one, which is
          # the site where it costs the most: here a Docker Hub blip dies under an atom-map headline.
          for i in 1 2 3; do
            echo "${{ secrets.DOCKERHUB_TOKEN }}" | docker login -u triskit23 --password-stdin && break
            if [ "$i" = 3 ]; then
              echo "::error::ATOM-MAP GATE COULD NOT RUN — Docker Hub login failed 3x. The map was NOT measured; this row says nothing about the science."
              exit 1
            fi
            echo "[docker] login attempt $i failed — retrying in 20s"; sleep 20
          done
          echo "could-not-run: deriving units and cache keys" > /tmp/mapgate.status
          mkdir -p /tmp/tin
          # ★ THE MODE'S OWN UNITS AND ITS OWN CACHE KEYS. `stage_cache_key` is keyed by (leg, mode, seed),
          # so reading `edge_reps` keys while launching `triangle` would check maps in caches the triangle
          # hosts will never read — a gate passing on the wrong bytes.
          MODE=$(printf '%s' "${{ needs.resolve.outputs.task }}" | tr '-' '_')
          python - "$MODE" <<'PY' > /tmp/units.txt
          import sys
          sys.path.insert(0, "research/modalities")
          import ternary_vast_launch as tv
          mode = sys.argv[1]
          for leg, seed, direction in tv.units_for(mode):
              spec = tv.build_jobspec(leg, seed=seed, direction=direction, mode=mode)
              print(leg, seed, tv.stage_cache_key(leg, mode, seed=seed), spec.env["PE_CACHE"])
          PY
          cat /tmp/units.txt
          # A missing stage cache is a hard stop, not a fall-through: without ligands.sdf the map cannot be
          # checked at all, and "could not check" must never read as "checked and fine".
          echo "could-not-run: pulling the stage caches from S3" > /tmp/mapgate.status
          for LEG in $(awk '{print $1}' /tmp/units.txt | sort -u); do
            KEY=$(awk -v l="$LEG" '$1==l {print $3; exit}' /tmp/units.txt)
            aws s3 cp "$KEY" /tmp/stage.tar || { echo "::error::ATOM-MAP GATE COULD NOT RUN — no stage cache at $KEY; run the matching prime task first. The map was NOT measured."; exit 1; }
            tar -C /tmp/tin -xf /tmp/stage.tar
            # ★★ AND THEN THE PRE-EQUIL CACHE OVER THE TOP, BECAUSE THAT IS WHAT THE HOST READS
            # (2026-07-27). `run_ternary_leg.sh` step 2 copies the RELAXED complex.pdb + ligands.sdf over
            # the staged ones before the engine starts, so a gate that reads only the stage cache is
            # checking bytes no leg ever consumes. It is not a hypothetical gap: on run 30315113060 this
            # step reported "every leg's atom map measured complete" at 7:51 PM ET and both
            # `calib_lo_to_lo2` legs died at 7:59 PM ET inside `_build_components` — the very function
            # this gate calls — because the RELAXED SDF carried an `atom.dprop.PartialCharge` array the
            # staged one did not. Overlaying the same way the host does closes that blindness.
            # A MISS is not fatal here (the first launch of a leg legitimately has no pre-equil cache yet);
            # a HIT must be used, and either way the log says which bytes were graded.
            # NB the two tars have DIFFERENT layouts, exactly as the onstart script unpacks them: the stage
            # tar holds `<leg>/...` and extracts at the tree root, the pre-equil tar holds `complex.pdb`
            # and `ligands.sdf` at ITS root and extracts INTO the leg directory. Getting this backwards
            # would silently leave the staged SDF in place and re-create the blindness being closed.
            PEKEY=$(awk -v l="$LEG" '$1==l {print $4; exit}' /tmp/units.txt)
            if aws s3 cp "$PEKEY" /tmp/pe.tar 2>/dev/null; then
              tar -C "/tmp/tin/$LEG" -xf /tmp/pe.tar
              echo "[mapgate] $LEG: graded on the PRE-EQUIL cache (what the host reads) <- $PEKEY"
            else
              echo "[mapgate] $LEG: no pre-equil cache yet ($PEKEY) — graded on the stage cache; the host will build its own"
            fi
          done
          # ★ THE PRE-FLIGHT'S OWN MARKERS DECIDE WHETHER THIS WAS A REFUSAL, exactly as the launcher's
          # `TVAST HELD ON PRICE` decides that for the price gate. A non-zero exit here is ambiguous by
          # itself: `valb_map_preflight` exits 1 on a short map, and `docker run` exits non-zero when the
          # image cannot be pulled — the same code for "we measured and refuse" and "we measured nothing".
          # So the discriminator is the sentence the pre-flight prints, and an unrecognised failure falls
          # through to could-not-run: never file an unexplained death as the scientific finding.
          echo "could-not-run: running the pre-flight container" > /tmp/mapgate.status
          set +e
          docker run --rm --entrypoint python \
            -v "$PWD/research/modalities:/work/research/modalities" -v /tmp/tin:/tmp/tin \
            -e RBFE_LOMAP_TIME_S=300 -e SSL_CERT_FILE=/etc/ssl/certs/ca-certificates.crt \
            -w /work/research/modalities \
            docker.io/triskit23/ternary-fep:latest \
            /work/research/modalities/valb_map_preflight.py \
              --input-dir /tmp/tin \
              $(awk '{print "--leg-id", $1}' /tmp/units.txt | sort -u | tr '\n' ' ') > /tmp/mapgate.log 2>&1
          RC=$?
          set -e
          tail -30 /tmp/mapgate.log
          if grep -q "REFUSING TO LAUNCH" /tmp/mapgate.log; then
            # The one line naming which leg fell how far short, carried into the ledger row so the finding
            # is readable without opening the run.
            echo "refused: $(grep -m1 'REFUSING TO LAUNCH' /tmp/mapgate.log | cut -c1-400)" > /tmp/mapgate.status
            echo "::error::ATOM-MAP GATE REFUSED — the map was measured and is SHORT. This is a result about the edge, not a retryable failure."
            exit 1
          fi
          if [ "$RC" != 0 ] || ! grep -q "every leg's atom map is complete" /tmp/mapgate.log; then
            echo "::error::ATOM-MAP GATE COULD NOT RUN — the pre-flight container exited $RC without reaching a verdict. The map was NOT measured."
            exit 1
          fi
          echo "passed: every leg's atom map measured complete at the production budget" > /tmp/mapgate.status

      - name: Rent one host per unit
        id: rent
        run: |
          set -eo pipefail
          # boto3 is REQUIRED, not optional: the launcher lists S3 to skip units that are already done
          # BEFORE renting anything. Without it the skip list is empty and every unit is rented again.
          python -m pip install -q boto3
          # TASK -> MODE. The dispatch options read as a ladder (`5aks-smoke`), while `MODES` keys are
          # Python identifiers (`5aks_smoke`). Only this job's tasks reach the tr, and none of them
          # contains a meaningful dash. An unmapped mode would be an argparse `--mode` choice error, i.e.
          # a red job, not a silent no-op — checked by test_ternary_vast_launch.
          MODE=$(printf '%s' "${{ needs.resolve.outputs.task }}" | tr '-' '_')
          echo "MODE=$MODE" >> "$GITHUB_ENV"
          ONLY="${{ github.event.inputs.leg_only }}"
          # Tee'd so the NEXT step can read which of the two zero-rental outcomes this was. `pipefail` is set,
          # so tee cannot mask the launcher's exit code.
          python research/modalities/ternary_vast_launch.py --mode "$MODE" ${ONLY:+--only "$ONLY"} 2>&1 | tee /tmp/rent.log
          if grep -q "TVAST HELD ON PRICE" /tmp/rent.log; then
            # ⚠ AND SAY SO AS A STEP OUTPUT. Making a correct refusal GREEN means the steps after this one now
            # run on a launch that rented nothing — which they never did before, because the old fatal price
            # gate made that case red. Arming a watchdog for units that do not exist would be a fresh bug
            # introduced by the signal fix, so the hold is published for the arm step to skip on.
            echo "held=true" >> "$GITHUB_OUTPUT"
            echo "::notice title=TVAST held::task=${{ needs.resolve.outputs.task }} rented nothing — correctly refused on price, not a fault. Next tick re-checks."
          else
            echo "held=false" >> "$GITHUB_OUTPUT"
            echo "::notice title=TVAST launched::task=${{ needs.resolve.outputs.task }} (mode=$MODE) — poll with task=collect."
          fi

      - name: Record this launch attempt in the ledger — SUCCESS OR NOT
        # ★★ THE STEP WHOSE ABSENCE CAUSED A MISREPORT (2026-07-27). When this job died at its old price
        # gate, every artifact in the lane looked exactly like an ordinary hold: the hold snapshot said HOLD
        # (the dead launch had overwritten the CLEAR that authorised it), the watch list was empty, and S3's
        # `_last_launch.json` was hours stale because the launcher never ran. Nothing anywhere said "a
        # launch was authorised, dispatched, and died" — so it was read as "still holding".
        #
        # `if: always()` is the whole point: the row that matters most is the one written by a FAILED run.
        # It is the last step so it can see the rental's outcome, and it never fails the job — a launch must
        # not be marked failed because its bookkeeping could not push.
        if: always()
        continue-on-error: true
        run: |
          set -eo pipefail
          RUN_URL="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          # ★ THE OUTCOME WORD IS DECIDED BY THE LAUNCHER, NOT BY THE STEP'S EXIT CODE (2026-07-27).
          # `steps.rent.outcome` only knows pass/fail, and on 11:10 AM ET that produced `rented-nothing` for
          # what was actually a provider 403 — an outcome that named two possibilities and therefore neither.
          # The launcher now exits 0 with `TVAST HELD ON PRICE` for a correct refusal and 1 with
          # `TVAST LAUNCHER FAULT` for anything else, so the annotation it emitted is the discriminator.
          # Falling back to `submit-failed` (a FAULT) when neither marker is present is deliberate: an
          # unrecognised failure must never be filed as the benign outcome.
          # Read unconditionally, not inside one branch: the phase the atom-map gate reached belongs in
          # EVERY row it can explain, including the green ones — "the map was measured complete" is part of
          # what authorised a rental, not just part of why one did not happen.
          MAPGATE="$(cat /tmp/mapgate.status 2>/dev/null || true)"
          if [ "${{ steps.rent.outcome }}" = success ]; then
            if grep -q "TVAST HELD ON PRICE" /tmp/rent.log 2>/dev/null; then
              OUTCOME=refused-on-price
            else
              OUTCOME=launched
            fi
          elif [ "${{ steps.rent.outcome }}" = skipped ]; then
            # ★★ WHY THIS BRANCH IS NO LONGER JUST `failed` (2026-07-27, 6:01 PM ET). `skipped` means the
            # job died before the rental, and the atom-map gate is the step most likely to have killed it —
            # but there are two opposite reasons it can, and until now both wrote the same row. A REFUSAL is
            # a measured result about the edge (nothing to retry; the chemistry is the finding); a
            # COULD-NOT-RUN means the map was never measured (retry is the whole remedy). Filing the second
            # as the first is what happened to run 30309074338, where a Docker Hub login timeout was read as
            # T3's closing edge failing to map. The gate writes `/tmp/mapgate.status`; this reads it.
            case "$MAPGATE" in
              refused:*) OUTCOME=map-gate-refused ;;
              *)         OUTCOME=failed ;;    # died before the rental, gate not the proven cause
            esac
          elif grep -q "could not read the board" /tmp/launch-board.json 2>/dev/null; then
            OUTCOME=board-unreadable        # the gate could not price the market either — same root cause
          else
            OUTCOME=submit-failed
          fi
          # ★★ AND THE RENTAL RECEIPT DECIDES WHETHER `launched` IS EVEN LEGAL FOR THIS ROW (2026-07-27).
          # The word above still comes from the launcher's annotations, which is right for telling a price
          # refusal from a fault — but it CANNOT tell "rented four hosts" from "found all four already
          # running and rented nothing", because both exit 0 with no marker. That is exactly how 12:29 PM
          # and 12:39 PM ET were both filed as `launched` ("hosts were actually rented") having rented zero,
          # and how a 2.032x board reading came to sit beside the word. `submit()` writes what it actually
          # rented, per host, at the rate the INSTANCE is billed; `record()` reclassifies a zero-rental
          # `launched` and copies those rates in, so the row carries what we PAID and not just what the
          # board cost. The receipt is also what puts `n_rented` in the summary line.
          # ★ `reason` CARRIES THE ATOM-MAP PHASE, because "job status failure" is true of every red run and
          # therefore diagnoses none of them — the exact emptiness that sent 6:01 PM ET's row to be read as
          # a mapping failure. When the gate ran at all, its own sentence goes in the row.
          REASON="task=${{ needs.resolve.outputs.task }}; job status ${{ job.status }}"
          if [ -n "$MAPGATE" ]; then REASON="$REASON; atom-map gate: $MAPGATE"; fi
          python research/modalities/ternary_launch_ledger.py --record "$OUTCOME" \
            --stage "rent (steps.rent.outcome=${{ steps.rent.outcome }})" \
            --gate /tmp/launch-board.json --run-url "$RUN_URL" \
            --receipt research/modalities/ternary-vast-rental-receipt.json \
            --reason "$REASON"
          git config user.name "Claude"; git config user.email "noreply@anthropic.com"
          # ★★ THE RECORD OF A PURCHASE MUST NOT BE LOST TO A MERGE (2026-07-27, 9:31 PM ET).
          #
          # WHAT HAPPENED. This was `git pull --rebase --autostash || true` then `git push || true`. The
          # ledger is an APPEND-ONLY array that several lanes append to concurrently, so a rebase of our
          # commit onto theirs conflicts routinely. It did:
          #
          #     error: could not apply 5c654a3e... tvast launch attempt: launched (CI)
          #     Everything up-to-date
          #     [ledger] no launch attempt recorded yet
          #
          # Both failures were swallowed by `|| true`, the commit was dropped, the repo was left mid-rebase,
          # and the readout then reported that no launch had ever been attempted — for a run that had just
          # rented FOUR hosts. Money was going out with no record that it had been authorised.
          #
          # THE FIX IS TO RE-APPEND, NOT TO RE-MERGE. A textual 3-way merge of two appends to one JSON array
          # is exactly the conflict above. Instead each attempt takes origin's CURRENT ledger, unions our
          # already-written row onto it, and pushes; a lost race just means the next attempt unions onto a
          # newer file.
          #
          # ⚠ AND THE RECOVERY RESETS ONTO `origin/$BR`, NOT ONTO `HEAD~1` (measured 2026-07-28). It used to
          # be `git reset --hard HEAD~1`, which leaves HEAD at the job's ORIGINAL checkout — an ANCESTOR of
          # the branch the other lane has since advanced. Committing on top of that produces a history that
          # does not contain theirs, so the retry push is rejected as non-fast-forward for exactly the same
          # reason the first one was, and every one of the five attempts fails identically. Reproduced end to
          # end in a scratch repo: push 1 rejected, recover, push 2 rejected with the same
          # "Note about fast-forwards"; resetting onto `origin/$BR` instead pushes clean and origin ends up
          # holding BOTH rows. The loop was therefore loud-but-useless on a real race — it could only ever
          # reach the "NOT PERSISTED" error below.
          #
          # ⚠ AND THIS RETRY LOOP IS **NOT** WHAT LOST A ROW ON 2026-07-28. It was the leading suspect and
          # it is innocent: the losing commit still contained the row written by the commit immediately
          # before it, so its base was current and no race or stale checkout was involved. The cause was
          # inside `record()` — the cap deleted the OLDEST row on every write once the file was full — and
          # both the evidence and the fix have their one home in `ternary_launch_ledger.py`. Do not
          # re-diagnose it here.
          #
          # AND IT FAILS LOUD. `|| true` on the record of a rental is the wrong default: a purchase nobody
          # recorded is worse than a red build (the same argument `--verify-armed` already makes for a leg
          # billing with nothing watching it). If every attempt fails, the row is printed IN FULL to the log
          # so it is recoverable by hand, and the step exits non-zero.
          BR="${{ github.ref_name }}"
          LEDGER=research/modalities/ternary-vast-launch-attempts.json
          git add -f research/modalities/ternary-vast-rental-receipt.json 2>/dev/null || true
          # ★ THE ROW IS RECORDED ONCE AND THEN UNIONED, NEVER RE-RECORDED (2026-07-28). `--record` stamps
          # `utc` from the wall clock, so re-running it per retry mints a row with a DIFFERENT key each
          # time — five retries that each half-succeeded could leave five rows for one launch. Keeping our
          # copy and unioning it onto origin's is idempotent, and it preserves any other local row instead
          # of discarding it with the checkout.
          RECEIPT=research/modalities/ternary-vast-rental-receipt.json
          cp "$LEDGER" /tmp/ledger-ours.json
          cp "$RECEIPT" /tmp/receipt-ours.json 2>/dev/null || true
          LEDGER_PUSHED=0
          for attempt in 1 2 3 4 5; do
            git add "$LEDGER"
            git add -f "$RECEIPT" 2>/dev/null || true
            if git diff --cached --quiet -- "$LEDGER"; then LEDGER_PUSHED=1; break; fi
            git commit -q -m "tvast launch attempt: $OUTCOME (CI)"
            if git push origin HEAD:"$BR" 2>/dev/null; then LEDGER_PUSHED=1; break; fi
            echo "[ledger] push attempt $attempt lost a race; re-basing onto origin/$BR and unioning our row"
            # Onto ORIGIN, not HEAD~1 — see the fast-forward note above. This takes origin's whole tree,
            # including its ledger, so our row is put back by the union and the receipt from our copy.
            git fetch -q origin "$BR"
            git reset -q --hard "origin/$BR"
            cp /tmp/receipt-ours.json "$RECEIPT" 2>/dev/null || true
            python research/modalities/ternary_launch_ledger.py --merge-from /tmp/ledger-ours.json
          done
          if [ "$LEDGER_PUSHED" != 1 ]; then
            echo "::error title=LAUNCH RECORD NOT PERSISTED::a rental may have happened and the ledger row could not be pushed. The row follows IN FULL so it can be re-applied by hand."
            cat "$LEDGER" | tail -c 4000
            exit 1
          fi
          echo "::notice title=TVAST launch attempt::$(python research/modalities/ternary_launch_ledger.py --print-last)"

      - name: Arm the session-independent watchdog for this task
        # The watch list is the ONLY input the cron watchdog reads, so a launch that does not register its
        # units is a launch nobody is watching. Committed to the branch so it survives this runner.
        #
        # SKIPPED ON A PRICE HOLD: there is nothing to watch, and `--verify-armed` would fail the job for a
        # launch that correctly chose not to buy — turning the benign outcome red again and undoing the whole
        # point of separating the two signals.
        if: ${{ steps.rent.outputs.held != 'true' }}
        run: |
          set -eo pipefail
          python research/modalities/ternary_vast_watchdog.py --arm "$MODE"
          # PUBLISH_IF_CHANGED=1: this records an EVENT, not a heartbeat — an empty commit would assert
          # something that did not happen on this run.
          # ⛔ ONE HOME FOR THE PUBLISH. The hand-rolled `git pull --rebase` this replaces wedges on a
          # conflict: the repo is left mid-rebase, every retry dies on the first one's wreckage, and the
          # step ends GREEN having published nothing. See research/compute/publish_artifacts.sh.
          PUBLISH_IF_CHANGED=1 bash research/compute/publish_artifacts.sh "${{ github.ref_name }}" \
            "tvast: arm the watchdog for ${{ needs.resolve.outputs.task }}" \
            research/modalities/ternary-vast-watch.json
          # READ BACK WHAT WAS WRITTEN. arm() succeeding is not the same as the watch list covering this
          # launch: the file can be changed afterwards by something that has no idea a leg is running, and
          # on 2026-07-25 exactly that happened — a later edit rewrote "watch" to [] and pushed, so the
          # watchdog's only input said there was nothing to watch while a billed GPU leg ran. The config
          # guard cannot catch it (an empty list is a legitimate state), so only a check that knows which
          # units were just launched can. Failing here is correct: a leg billing with nothing watching it
          # is worse than a red build.
          python research/modalities/ternary_vast_watchdog.py --verify-armed "$MODE"

  # --------------------------------------------------- free: look again ~5 min after renting, and only then
  # ★★ THE BLIND WINDOW AFTER A RENTAL WAS THIS LANE'S LARGEST REAL LOSS (measured 2026-07-29).
  #
  # WHAT HAPPENS. `gpu_backend._ensure_running` files a start as `accepted` on Vast's optimistic echo
  # (`[vast] start 46209462 attempt 1: intended=running actual=None`). Vast then settles a fraction of those
  # boxes back to `intended=stopped` MINUTES later — documented at gpu_backend.py:1281-1300 — and the nudge
  # that reads the real reply lives in `collect`. So between renting and the next `collect`, a box that will
  # never run looks exactly like one that is pulling its image, and we hold a slot we do not have.
  #
  # THE COST, measured rather than argued. Eight ternary rentals on 2026-07-29 produced ZERO committed
  # iterations; three of them read `up=created` / `up=loading` and never executed at all. Today's gaps
  # between `collect` runs were 7, 13, 15, 21, 24, 27, 29 and 69 minutes. The dollars are small (~$0.50 —
  # this is weather-scale money) but the wall-clock is not: the closure triangle spent the afternoon with
  # arms repeatedly re-placed instead of advancing, and each re-placement restarts a ~15-40 min pull before
  # the first checkpoint can land.
  #
  # WHY THE FAN-OUT DOES NOT HAVE THIS PROBLEM, which is what identified the fix. Same account, same board,
  # same window: the fan-out's rentals averaged 1.02 h against ternary's 0.35 h, and its stopped boxes carry
  # `status_msg: "success, running …"` — they EXECUTED. Its tick nudges and re-places in one job, so the
  # window never opens. This job gives the ternary lane the same property using the machinery it already has.
  #
  # ⚠ IT DISPATCHES `collect`, WHICH ADDS NO NEW REAPING RULE. That is deliberate: a legitimately slow
  # 20-40 minute image pull must not be reaped, and `collect` already owns that discrimination (the 15-minute
  # cold-start floor, and `vast_idle_guard`'s inviolable rule that GPU idleness never condemns a box). Adding
  # a second, faster discriminator here is exactly how a guard starts killing healthy hosts.
  #
  # ⚠ AND IT IS DELIBERATELY *NOT* IN THE `ternary-vast-mutate` CONCURRENCY GROUP. Sleeping five minutes
  # inside `launch` would hold the mutate lock and delay a queued launch by five minutes — paying for this
  # fix with the very latency it exists to remove. `needs: launch` gives the ordering; a separate job gives
  # the lock back immediately.
  #
  # $0: five minutes of a free runner, one `gh workflow run`. Rents nothing, destroys nothing.
  post_launch_recheck:
    needs: launch
    if: ${{ always() && needs.launch.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      actions: write
      contents: read
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: Wait out the settle-back window, then dispatch one collect
        run: |
          set -eo pipefail
          echo "sleeping 300 s so Vast has time to settle a falsely-accepted start back to 'stopped'"
          sleep 300
          # ⚠ `-R` IS LOAD-BEARING: this job has no `actions/checkout`, deliberately (it only sleeps and
          # dispatches), and without a git working directory `gh` cannot infer the repository — it exits 1
          # with `fatal: not a git repository`, which is exactly how this job failed on its first live run
          # at 1:56 PM ET on 2026-07-29. Naming the repo is cheaper than checking out a tree we never read.
          gh workflow run gpu-ternary-fep-vast.yml -R "${{ github.repository }}" \
            --ref "${{ github.ref_name }}" -f task=collect
          echo "::notice title=POST-LAUNCH RECHECK::collect dispatched ~5 min after the rental — this is what closes the accepted-but-never-running window; it reaps nothing that collect would not reap anyway."

  # ------------------------------------------------ free: retire ONE unit's host, keeping its checkpoint
  # For a host measurably underperforming its own card class. The `$/ns` column cannot see this: it is
  # derived from each card's TABLE throughput, so a host delivering half its class rate still renders a
  # cheap-looking figure while the REALISED rate is double it. Full case in `retire_host.__doc__`.
  # Destroys a HOST, never a RESULT — the commit store is in S3 and the next gate tick resumes from it.
  retire_host:
    needs: resolve
    if: ${{ needs.resolve.outputs.task == 'retire-host' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    concurrency:
      group: ternary-vast-mutate
      cancel-in-progress: false
    env:
      VAST_API_KEY: ${{ secrets.VAST_API_KEY }}
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      AWS_DEFAULT_REGION: us-east-2
    steps:
      - uses: actions/checkout@v4
        with: { ref: "${{ github.ref_name }}" }
      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }
      - name: Retire the matching unit's host
        run: |
          set -eo pipefail
          python -m pip install -q boto3
          SEL="${{ github.event.inputs.leg_only }}"
          test -n "$SEL" || { echo "::error::set leg_only — refusing to retire every host at once"; exit 1; }
          python research/modalities/ternary_vast_launch.py --retire-host "$SEL"

  # ------------------------------------------------------- free: empty the machine-exclusion set, on purpose
  # ★★ trimcrae, 2026-07-27 9:45 PM ET: "Clear out our blacklist then and don't add anything back unless you
  # have a real reason to." The set had reached 48 permanent machines and was the BINDING constraint on
  # placement — 2 of 2 authorised units failed with `no rentable verified offer` against a 189-offer board
  # whose price was fine, and 4 of 5 on an earlier occasion. Its own history records at least three entries
  # (53989, 31035, 24573) as provably wrong: every one had run this repo's container at 94-99 % GPU.
  #
  # SNAPSHOT FIRST, ALWAYS — the CLI refuses `--clear` without `--snapshot`. Emptying the set without
  # recording it would destroy the only evidence of what was excluded and why.
  #
  # $0: two S3 reads and two S3 writes. Rents nothing, destroys nothing, touches no instance.
  blacklist_clear:
    needs: resolve
    if: ${{ needs.resolve.outputs.task == 'blacklist-clear' || needs.resolve.outputs.task == 'blacklist-snapshot' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    env:
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      AWS_DEFAULT_REGION: us-east-2
    steps:
      - uses: actions/checkout@v4
        with: { ref: "${{ github.ref_name }}" }
      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }
      - name: Snapshot the exclusion set, then empty it
        run: |
          set -eo pipefail
          python -m pip install -q boto3
          CLEAR_ARGS=""
          if [ "${{ needs.resolve.outputs.task }}" = "blacklist-clear" ]; then
            CLEAR_ARGS=1
          fi
          if [ -z "$CLEAR_ARGS" ]; then
            # SNAPSHOT ONLY. `clear_all` keeps `history`, so a later snapshot still carries every pre-clear
            # entry plus the CLEARED event — which is what makes the record recoverable when the commit
            # below loses its push race, as it did at 9:55 PM ET on 2026-07-27.
            # ★ A DATED PATH, so a later read-only snapshot can NEVER clobber the pre-clear record. Both
            # modes used to write `...-before-clear.json`; running this task the day after a clear would
            # have replaced the only committed copy of what was excluded with an empty one.
            # ★ AND EVERY LANE'S OWN LIST, classified by each entry's ORIGINAL recorded reason. The shared
            # set alone cannot answer "why is the fan-out filtering 49 machines?" — its list is its own, and
            # reading only the shared key is what made a lane-local 41 invisible for a night.
            # ★ `--project-retire` IS THE $0 VERIFICATION PATH. The retires themselves run inside the fan-out's
            # LAUNCH tick, and a launch tick rents GPUs — so "just run it and look" is not a free check. This
            # computes the same answer with the same classification functions over the live lists: zero
            # writes, zero contact with any host, one S3 GET per key. It is what makes "the filter is N today
            # and would be M" answerable without spending anything.
            python research/modalities/vast_machine_blacklist.py \
              --snapshot "research/modalities/vast-blacklist-snapshot-$(date -u +%Y-%m-%dT%H%MZ).json" \
              --project-retire \
              --lane-list "nr4a3-step1-fanout/results/_excluded_machines.json" \
              --lane-list "ternary-vast/_lane_state.json" \
              --lane-list "protfep-vast/_lane_state.json" \
              2>&1 | tee /tmp/bl.txt
            exit 0
          fi
          # ★ A DATED PATH HERE TOO. The clear used to write the fixed
          # `vast-blacklist-snapshot-before-clear.json`, so a SECOND clear would overwrite the first clear's
          # record — the 41-machine pre-clear snapshot, which is the only evidence of what was excluded and
          # why, and the input to `retire_perishable_exclusions`' own justification. The CLI now refuses to
          # overwrite an existing snapshot outright; this makes the refusal unreachable rather than fatal.
          #
          # ⚠⚠ AND THE LANE KEYS ARE THE REAL ONES. `nr4a3-step1-fanout/results/_lane_state.json` was a key
          # the fan-out HAS NEVER WRITTEN — its list is `_excluded_machines.json` under `machine_ids`. On
          # 2026-07-27 that line printed "no lane state — nothing to clear", the operator read a successful
          # 74-entry clear, and the fan-out's own 41 machines survived it untouched: its 10:10 PM tick, five
          # minutes later, filtered 41. `clear_lane_state` now handles both doc shapes AND reports an absent
          # key as MISSING rather than as clean, so this class of miss cannot look like a success again.
          python research/modalities/vast_machine_blacklist.py \
            --snapshot "research/modalities/vast-blacklist-snapshot-$(date -u +%Y-%m-%dT%H%MZ)-before-clear.json" \
            --clear "trimcrae 2026-07-27: the set reached 48 machines and became the binding constraint on placement (2 of 2 authorised units failed on \`no rentable verified offer\` against a 189-offer board at healthy prices). Capacity refusals were being stored as permanent host verdicts." \
            --lane-state "ternary-vast/_lane_state.json" \
            --lane-state "nr4a3-step1-fanout/results/_excluded_machines.json" \
            --lane-state "protfep-vast/_lane_state.json" 2>&1 | tee /tmp/bl.txt
      - name: Commit the snapshot — the record must outlive the set
        run: |
          set -eo pipefail
          # PUBLISH_IF_CHANGED=1: this records an EVENT, not a heartbeat — an empty commit would assert
          # something that did not happen on this run.
          # PUBLISH_FAIL_HARD=1 + 6 TRIES, both kept from the hand-rolled version and for its reason:
          # main takes a lot of CI commits, three tries at 7/14/21 s lost all three at 9:55 PM ET, and
          # the exclusion set was cleared with its record unpushed. The record must outlive the clear.
          # ⛔ ONE HOME FOR THE PUBLISH. The hand-rolled `git pull --rebase` this replaces wedges on a
          # conflict: the repo is left mid-rebase, every retry dies on the first one's wreckage, and the
          # step ends GREEN having published nothing. See research/compute/publish_artifacts.sh.
          PUBLISH_IF_CHANGED=1 PUBLISH_FAIL_HARD=1 PUBLISH_TRIES=6 bash research/compute/publish_artifacts.sh "${{ github.ref_name }}" \
            "vast blacklist: snapshot of the exclusion set immediately before the clear (CI)" \
            research/modalities/vast-blacklist-snapshot-*.json
          # The snapshot is printed regardless, so it survives in the job log even if the push failed.
          cat research/modalities/vast-blacklist-snapshot-*.json 2>/dev/null || true
      - name: Summary LAST
        if: ${{ always() }}
        run: cat /tmp/bl.txt

  # ------------------------------------------------------------------ free: monitor + reap
  collect:
    needs: resolve
    if: ${{ needs.resolve.outputs.task == 'collect' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # `actions: write` is what lets this job REPAIR what it detects. Without it, collect could only write
    # "the next gate tick re-places it" and exit — see the re-place step at the end of this job.
    permissions:
      contents: write
      actions: write
    env:
      # ★ ESCALATE ON THE FIRST LOST HOST ON THIS LANE (2026-07-30). The module default is 3, which is the
      # right number when the escalated tier is the EXPENSIVE one — one preemption is routine (§6) and does
      # not justify multiples of the bid floor. Here it is not: the on-demand board priced an RTX 5090 at
      # $0.003677/ns, 1.08x basis, BELOW the interruptible 4080S this leg keeps re-renting at 1.48x. When the
      # reliable tier is also the cheaper one there is nothing to protect by waiting, and waiting is what
      # cost this leg six hosts and three hours at production/1840.
      # Safe by construction in both directions: an escalated rental still faces the $0.006539/ns buy line
      # (so this can never overspend, only be refused), and the counter resets to zero the moment the census
      # advances — so the first committed segment puts the lane straight back on the cheap tier.
      TVAST_ESCALATE_AFTER: "1"
      VAST_API_KEY: ${{ secrets.VAST_API_KEY }}
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      # The credential a RENTED community host is given, forwarded in cleartext by _vast_onstart.
      # Scoped to the lane prefixes + six S3 actions a leg needs (s3_scoped_policy.py). Unset until
      # trimcrae creates the vast-leg-s3 user -> gpu_backend falls back to the broad key above, which
      # is why lanes in flight kept running. Runbook: research/compute/scoped-s3-credential-runbook.md
      VAST_S3_ACCESS_KEY_ID: ${{ secrets.VAST_S3_ACCESS_KEY_ID }}
      VAST_S3_SECRET_ACCESS_KEY: ${{ secrets.VAST_S3_SECRET_ACCESS_KEY }}
      VAST_S3_SCOPED_STS: ${{ vars.VAST_S3_SCOPED_STS }}
      AWS_DEFAULT_REGION: us-east-2
    steps:
      - uses: actions/checkout@v4
        with: { ref: "${{ github.ref_name }}" }
      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }
      - name: Status board + progress check + anti-idle reap
        run: |
          set -eo pipefail
          python -m pip install -q boto3
          python research/modalities/ternary_vast_launch.py --collect 2>&1 | tee /tmp/board.txt
      # ★★ THE BOARD IS COMMITTED, NOT ONLY LOGGED (2026-07-29, 3:41 PM ET).
      #
      # WHY. The board existed only inside this job's log, which means reading it requires an authenticated
      # Actions log download. A scheduled Routine that fires WITHOUT connector tools — which is exactly what
      # `create_trigger` warns it produces — therefore cannot read the one artifact it was created to report,
      # and an hourly board post would have failed silently every hour. It is also the artifact trimcrae is
      # most likely to want to glance at directly, and a number that lives only in a CI log is a number
      # nobody can check.
      #
      # WHAT IT COSTS: one file, one commit, no GPU, no Vast call. Committed on EVERY collect including the
      # ones where nothing changed, because a stale timestamp must mean "the collect did not run" and never
      # "the collect ran and chose not to say" — the same rule the market-hold snapshots follow.
      - name: Commit the in-flight board so it is readable without a log download
        run: |
          set -eo pipefail
          BOARD=research/modalities/inflight-board.md
          # ★ THE BILLED-HOURS LEDGER RIDES WITH THE BOARD. `collect` is the step that destroys hosts, so it
          # is where `ternary_billed_ledger` rows are written — and a row that never leaves the runner is a
          # row nobody has. This step already pushes on every collect with a rebase-retry, so the ledger gets
          # the same durability as the board for free rather than growing a second push loop to go wrong.
          LEDGERF=research/modalities/ternary-billed-hours.json
          # This lane's STRUCTURED fragment, written by the collect that just ran (see the comment beside
          # `ifb.write_fragment(ifb.TERNARY, _rows)` in ternary_vast_launch.py). Same rows as the block
          # below, as cells rather than fixed-width text, so a reader never has to parse this table back.
          FRAGF=research/modalities/inflight-board.d/ternary.json
          {
            echo "<!-- GENERATED by gpu-ternary-fep-vast.yml task=collect. Do not edit by hand:"
            echo "     every collect overwrites it. Source of every cell: inflight_board.py. -->"
            echo "# In-flight board"
            echo
            echo "Generated $(TZ=America/New_York date '+%-I:%M %p ET %a %b %-d, %Y') by \`task=collect\`."
            echo
            echo '```'
            sed -n '/---- TVAST-BOARD ----/,/---- END TVAST-BOARD ----/p' /tmp/board.txt || true
            echo '```'
          } > "$BOARD"
          git config user.name "Claude"; git config user.email "noreply@anthropic.com"
          git add "$BOARD"
          git add -f "$LEDGERF" 2>/dev/null || true
          git add -f "$FRAGF" 2>/dev/null || true
          # ★★ RE-MERGE THE ALL-LANE BOARD, OR THIS LANE REPORTS ITSELF STALE ON SOMEBODY ELSE'S SCHEDULE.
          # `$BOARD` is the ternary lane's single-writer file; `inflight-board-all.md` TRANSCLUDES it, and
          # is regenerated only by whoever calls `inflight_board --write`. Until 2026-08-01 this step wrote
          # `$BOARD` and stopped, so the merged board carried the PREVIOUS transclusion until some other
          # lane's tick happened to re-merge — and this lane's section rendered `STALE (> 15 min)` purely
          # because nobody else had ticked. Measured that afternoon on the GCP lane, the same defect one
          # lane over: fragment 1.8 min old carrying an ETA of 4:36 AM Aug 2, board saying 16 min / STALE /
          # no ETA. STALE is the alarm for "a lane went quiet while it was billing"; a lane that raises it
          # about itself from full health is that alarm being trained into noise.
          #
          # ⚠ FETCH THE SIBLING FRAGMENTS FIRST — the merge is DERIVED IN FULL from every lane's fragment,
          # so merging against this checkout's copies would stamp THEIR staleness onto upstream and roll
          # back rows the other three lanes had already published. All four lines are `|| true`-guarded:
          # this step's push loop has been broken twice by additions that could fail (a `git stash pop` with
          # no stash, 3:46 PM ET 2026-07-29), so nothing added here may turn a healthy collect red.
          #
          # ⛔ AND OURS IS RESTORED AFTERWARDS, BECAUSE THE CHECKOUT TAKES IT TOO (measured 2026-08-01, the
          # same afternoon, ~90 min after the line above was added — by me, in the commit that added it).
          # `git checkout FETCH_HEAD -- inflight-board.d/` refreshes the WHOLE directory, so it overwrote
          # this lane's `ternary.json` — the file the collect had just written — with upstream's older copy,
          # and then staged that. The signature was unmistakable once looked at: `inflight-board.md` kept
          # publishing (19:21, 19:29) while `inflight-board.d/ternary.json` froze at 19:19, so the lane's
          # TEXT board advanced and its STRUCTURED board did not — and the structured one is what every
          # reader now uses. Ours out, siblings in, ours back.
          cp "$FRAGF" /tmp/frag-ternary-ours.json 2>/dev/null || true
          git fetch -q origin "${{ github.ref_name }}" 2>/dev/null || true
          git checkout -q FETCH_HEAD -- research/modalities/inflight-board.d/ 2>/dev/null || true
          mkdir -p "$(dirname "$FRAGF")"
          cp /tmp/frag-ternary-ours.json "$FRAGF" 2>/dev/null || true
          git add -f "$FRAGF" 2>/dev/null || true
          python3 research/modalities/inflight_board.py --write >/dev/null 2>&1 \
            || echo "::warning title=ALL-LANE BOARD NOT RE-MERGED::inflight_board --write failed; the ternary rows are published in $BOARD but inflight-board-all.md will render this lane stale until another lane ticks."
          git add research/modalities/inflight-board-all.md 2>/dev/null || true
          # ★★ COMMIT UNCONDITIONALLY. **THE REDUNDANT-LOOKING COMMIT IS THE MECHANISM.**
          # (Coordinator ruling, 2026-08-01, on measured volume: 1,591 commits on `main` in 24 h, 1,392 of
          # them fragment churn, `.git` at 267 MB — KEPT, because that history is load-bearing and this
          # lane supplied two of the proofs: the `5aks-market-hold.json` series is what exposed two
          # differently-configured gates writing one file, and the `ternary-vast-rental-receipt.json`
          # series is the only reason the lane's session-length distribution exists at all, since it
          # records no `billed_h`.)
          #
          # ⚠ THESE TWO LINES USED TO BE GUARDED BY `git diff --cached --quiet -- "$BOARD"`, and that is
          # the shape the ruling forbids. It never fired in practice — the generation stamp changes every
          # tick, so the file always differs — which is exactly what made it a LANDMINE rather than a bug:
          # it does nothing until someone stabilises the timestamp as an "optimisation", and from that
          # moment a healthy IDLE lane commits nothing and renders byte-identically to a DEAD one. **The
          # timestamp IS the heartbeat**, and it is the only input to a staleness readout. Distinguishing
          # those two states is most of what 2026-07-31 turned on.
          #
          # `--allow-empty` in BOTH places, so the step can neither silently skip (the old landmine) nor
          # fail red on a no-diff (the naive fix). Publishing is unconditional in both directions.
          git commit -q --allow-empty -m "in-flight board (CI)"
          # ⚠ NO `git stash` HERE. The first version stashed, reset, and popped — but the board file is
          # the ONLY thing this step changes and it is already committed by the time we push, so there is
          # nothing to stash. `git stash pop` then failed with "No stash entries found", and the following
          # `git add` hit a path the reset had removed: `fatal: pathspec ... did not match any files`,
          # turning a healthy collect red at 3:46 PM ET on 2026-07-29. Keep our copy in /tmp, reset onto
          # origin, restore it, re-commit. No stash, no dependence on the working tree surviving a reset.
          cp "$BOARD" /tmp/board-ours.md
          cp "$LEDGERF" /tmp/ledger-billed.json 2>/dev/null || true
          # The fragment rides in /tmp for the same reason as the other two: `reset --hard` below removes
          # every file this job wrote, and a `git add` of a path the reset deleted is what turned a healthy
          # collect red on 2026-07-29.
          cp "$FRAGF" /tmp/frag-ternary.json 2>/dev/null || true
          for a in 1 2 3 4 5; do
            git push origin "HEAD:${{ github.ref_name }}" 2>/dev/null && break
            git fetch -q origin "${{ github.ref_name }}"
            git reset -q --hard "origin/${{ github.ref_name }}"
            cp /tmp/board-ours.md "$BOARD"
            cp /tmp/ledger-billed.json "$LEDGERF" 2>/dev/null || true
            mkdir -p "$(dirname "$FRAGF")"; cp /tmp/frag-ternary.json "$FRAGF" 2>/dev/null || true
            git add "$BOARD"
            git add -f "$LEDGERF" 2>/dev/null || true
            git add -f "$FRAGF" 2>/dev/null || true
            # The reset above already put upstream's sibling fragments in the tree, so this merge needs no
            # fetch of its own — it is the same regeneration as before the loop, against fresher inputs.
            python3 research/modalities/inflight_board.py --write >/dev/null 2>&1 || true
            git add research/modalities/inflight-board-all.md 2>/dev/null || true
            git commit -q --allow-empty -m "in-flight board (CI)"
          done
      # ★★ RETIRE THE WATCH ENTRY OF ANY LEG THAT HAS ALREADY LANDED (2026-07-27, 7:45 PM ET).
      #
      # WHY HERE AND NOT ONLY IN THE CRON WATCHDOG. `ternary-vast-watchdog.yml`'s schedule is throttled the
      # same way every schedule in this repo is (CLAUDE.md §6: 25 of 30 step-1 ticks were hand-dispatched),
      # so hanging the reap off it alone means a finished unit can stay `enabled: true` for hours. `collect`
      # is dispatched constantly by whoever is supervising, which makes it the path with a real cadence.
      #
      # WHAT IT COSTS: one S3 listing, no GPU, no Vast call. It can only move enabled true -> false, and
      # only on a leg.json that says status=done — it cannot arm, rent, or silence unfinished work.
      - name: Reap the watch entries of legs that already landed
        run: |
          set -eo pipefail
          python research/modalities/ternary_vast_watchdog.py --reap-landed 2>&1 | tee /tmp/reap.txt
          # PUBLISH_IF_CHANGED=1: this records an EVENT, not a heartbeat — an empty commit would assert
          # something that did not happen on this run.
          # A lost race is not a failure of the reap — the next collect re-derives the same answer
          # from S3, so the primitive's ::error annotation (not a red build) is the right severity.
          # ⛔ ONE HOME FOR THE PUBLISH. The hand-rolled `git pull --rebase` this replaces wedges on a
          # conflict: the repo is left mid-rebase, every retry dies on the first one's wreckage, and the
          # step ends GREEN having published nothing. See research/compute/publish_artifacts.sh.
          PUBLISH_IF_CHANGED=1 bash research/compute/publish_artifacts.sh "${{ github.ref_name }}" \
            "ternary watch: retire the entries of legs that have landed (CI)" \
            research/modalities/ternary-vast-watch.json
      # ★★ REPAIR WHAT THIS PASS DETECTED, NOW — not next tick (2026-07-30).
      # `collect` is what notices a host died; the gate is what buys a new one. They were different workflow
      # runs, so the FLOOR on recovery was one tick even with a healthy board and money already authorised.
      # Capacity refusals are routine on Vast (§6: pick another host, never queue), and the T3 ternary leg
      # took two in a row at lunchtime and sat NO HOST ~20 min across three runs — each repair prompt only
      # because a human dispatched it. A recovery path that costs a tick per refusal does not work
      # unattended, which is the only thing it is for.
      #
      # ⚠ THIS DOES NOT DECIDE TO BUY. It wakes the gate; the gate re-reads the board, applies the rung's
      # dollar ceiling AND the $/ns buy line, and HOLDS if the market is bad. Nothing here can spend past a
      # ceiling, raise a bid, or launch a unit that already has a host — collect only names units it has
      # established are hostless-and-not-done, and only when the Vast instance list actually READ (an
      # unreadable list means UNKNOWN, and UNKNOWN never buys).
      - name: Re-place any unit this pass found with no host
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -eo pipefail
          F=/tmp/tvast-needs-replacement.txt
          if [ ! -s "$F" ]; then
            echo "no unit needs re-placing this pass"; exit 0
          fi
          while read -r mode escalate; do
            [ -n "$mode" ] || continue
            # mode -> the gate that owns it, DERIVED from `ternary_vast_launch.MODE_GATE_TASK` rather than
            # re-listed here. ★★ THIS WAS A HARDCODED `case` UNTIL 2026-07-31 AND IT STRANDED A LEG. It read
            #     triangle|triangle_smoke) TASK=triangle-gate ;;  edge_reps) TASK=market-gate ;;
            #     *) "::warning title=NO GATE FOR MODE::…"; continue ;;
            # so `5aks` — the mode actually running that day — fell through to a warning nobody was awake to
            # read, while the board one line up promised "this pass dispatches the gate to re-place it".
            # nr4a3_r0 kept an intact checkpoint at production/840 and nothing looked for a host for it. A
            # list that must be edited in lockstep with `MODES` and is never checked against it is the same
            # shape as NR-V04's AUTHORIZED_STAGES prose-vs-code split; the map is now beside `MODES` and
            # tests/test_mode_gate_coverage.py fails the build if a launchable mode is missing from it.
            #
            # Exit codes are the discriminator, and the two "no dispatch" cases are NOT the same event:
            #   0 -> a task on stdout, dispatch it
            #   3 -> this mode has no re-placement BY DECISION (a finished RUNG 2b mode); say so and move on
            #   * -> the mode is unknown to the map: that is the trap itself, so it is an ERROR, not a notice
            TASK=""; GTRC=0
            TASK=$(python3 research/modalities/ternary_vast_launch.py --gate-task-for "$mode" 2>/tmp/gt) || GTRC=$?
            if [ "$GTRC" = 3 ]; then
              echo "::notice title=NO RE-PLACEMENT BY DESIGN::$(cat /tmp/gt)"; continue
            elif [ "$GTRC" != 0 ]; then
              echo "::error title=MODE HAS NO RE-PLACEMENT DECISION::$(cat /tmp/gt)"; continue
            fi
            # ★ BUY RETENTION ON A RE-PLACEMENT (trimcrae authorised raising the bid on these last legs).
            # A re-placement is BY DEFINITION a leg whose previous host did not survive, so it is exactly the
            # "specific leg that genuinely cannot tolerate pauses" that `_vast_bid_price` documents
            # VAST_BID_FLOOR_MULT for. On Vast the cheapest bids in the interruptible tier are evicted first,
            # and the charge is min(bid, the machine's real on-demand price) — so this cannot run away, and
            # the gate's own $/ns ceiling still REFUSES anything over the $0.006539/ns buy line. A raised bid
            # therefore either lands under the line or is declined on price; it can never overspend.
            # ⚠ Deliberately NOT applied to a first placement: a higher bid on a leg that has never been
            # interrupted buys nothing and costs money (§6).
            # ESCALATION, decided by collect from the unit's own history of lost hosts (see the note at
            # `_ESCALATE_AFTER`). 1 = this unit has burned >= N hosts without committing, so the cheap tier
            # has demonstrably failed to hold it and no bid can fix that — an on-demand renter preempts an
            # interruptible one regardless of bid. The rental is still gated on $/ns, and the counter resets
            # to zero the moment the census advances, so this is a temporary, evidence-backed escalation.
            # ⛔⛔ THE ESCALATION COUNTER NO LONGER CHOOSES THE TIER — THE GATE DOES (trimcrae, 2026-07-31:
            # *"add a new rule where if anything on-demand comes in under the buy line, we just take it to
            # avoid the outage"*). `market_gate` now prices BOTH boards on EVERY evaluation and prefers the
            # uninterruptible tier whenever it clears both ceilings, so a second mechanism that also picks a
            # tier can only disagree with it — and two deciders disagreeing about what to buy is the defect,
            # not a belt and braces. This line used to append `-f on_demand=1` once a unit had burned
            # `TVAST_ESCALATE_AFTER` hosts.
            # SUBORDINATE, NOT DELETED: the counter still runs and still PRINTS, because "this unit has lost
            # N hosts without committing" is a real signal worth seeing in the readout. It simply no longer
            # forces a purchase. SUPERSEDED, retained: `OD=""; [ "$escalate" = "1" ] && OD="-f on_demand=1"`.
            OD=""
            [ "${escalate:-0}" = "1" ] && echo "::notice title=ESCALATION SIGNAL (advisory)::mode=$mode has lost enough hosts to trip TVAST_ESCALATE_AFTER — the GATE decides the tier now and already prefers on-demand whenever it clears both ceilings, so no tier is forced here."
            # ★★ THE CARD FLOOR IS PER-MODE AND DERIVED, NOT TYPED (2026-07-31). This line used to read
            # `-f min_ns_per_h=28` unconditionally, so a floor argued for the closure triangle was applied to
            # RUNG 5a-KS too — and went on being applied after trimcrae REVERTED the 5a-KS floor on the
            # supervisor tick, because that revert only touched the other dispatcher. Two dispatchers
            # disagreeing about one lane's card policy is how a reverted decision keeps running.
            # `ternary_vast_launch.MODE_MIN_NS_PER_H` is the one home; the evidence for each entry is beside
            # it. 0 => the input is passed empty, which is `resource_spec`'s own "unset".
            NSF="$(python3 research/modalities/ternary_vast_launch.py --min-ns-per-h-for "$mode" 2>/dev/null || echo 0)"
            [ "$NSF" = "0" ] && NSF=""
            echo "::notice title=SELF-HEAL::mode=$mode escalate=${escalate:-0} min_ns_per_h='${NSF:-none}' -> dispatching $TASK (it still prices and may HOLD)"
            gh workflow run gpu-ternary-fep-vast.yml --ref "${{ github.ref_name }}" \
              -f task="$TASK" -f min_ns_per_h="$NSF" -f bid_floor_mult=2.0 $OD \
              || echo "::warning title=REPLACE DISPATCH FAILED::$TASK — the scheduled tick remains the backstop"
          done < "$F"

      # ★★ AND FIRE THE REDUCTION THE MOMENT A MODE'S *LAST* LEG LANDS (2026-08-01).
      #
      # The step above repairs what died; this one finishes what lived. Until now nothing did: `collect`
      # retired a landed leg's watch entry and stopped there, so a rung whose last leg landed sat COMPLETE
      # AND UNREDUCED until a person dispatched `task=5aks-reduce` by hand. RUNG 5a-KS's readout S is a
      # double difference over four legs that land ~20 h apart, the last of them overnight — "when someone
      # notices" is not a mechanism, and a finished-but-unreduced rung is indistinguishable from a running
      # one in every artifact a reader can reach. It found one on its FIRST tick: the valB closure
      # triangle's four legs had all landed and its residual R had never been formed.
      #
      # ⚠ THIS SPENDS NOTHING. Every reduce task is $0 CPU: it pulls the legs' committed JSON from S3 and
      # runs the reducer in the parity image. It cannot rent, and it cannot run before its inputs exist —
      # `collect` names a mode only when EVERY unit of it is `status=done`.
      #
      # THE LATCH IS WRITTEN AFTER THE DISPATCH SUCCEEDS, NOT BEFORE. Latching on intent would swallow
      # exactly the dispatch that failed to reach GitHub; latching on delivery costs one duplicate reduce in
      # the worst case, and a duplicate $0 reduction is strictly cheaper than a rung nobody reduces.
      - name: Fire a mode's reduction if this pass saw its last leg land
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -eo pipefail
          F=/tmp/tvast-mode-complete.txt
          if [ ! -s "$F" ]; then
            echo "no mode completed this pass — nothing to reduce"; exit 0
          fi
          while read -r mode task fp; do
            [ -n "$mode" ] || continue
            echo "::notice title=MODE COMPLETE::$mode — every leg has landed; dispatching $task (\$0 CPU)"
            if gh workflow run gpu-ternary-fep-vast.yml --ref "${{ github.ref_name }}" -f task="$task"; then
              python3 research/modalities/ternary_vast_launch.py \
                --latch-reduce-dispatched "$mode:$fp" \
                || echo "::warning title=REDUCE LATCH NOT WRITTEN::$mode — the reduction WAS dispatched, so the next tick may dispatch it again. A duplicate \$0 reduce is harmless; a missed one is not."
            else
              echo "::warning title=REDUCE DISPATCH FAILED::$task for mode=$mode — NOT latched, so the next collect retries it"
            fi
          done < "$F"

      - name: Summary LAST
        # A CI log is read from its TAIL, so whatever a monitor needs must be the last thing printed.
        run: |
          set -eo pipefail
          echo "================ TVAST BOARD ================"
          cat /tmp/board.txt

  # ---------------------------------------------------------------- free: why an arm commits nothing
  # $0 FORENSIC, AND THE ONLY ONE THAT CAN SEE THE LAST TWO MINUTES OF A DEAD CONTAINER. The onstart script
  # copies /tmp/run.log to S3 on a `sleep 120` loop, so for a leg that dies the fatal part of its output never
  # reaches S3 at all — which is why `collect`'s log tail shows three cohorts of ternary legs stopping at the
  # same innocuous line and cannot say what happened next. `request_logs` pulls the container's own console
  # from the provider; the `attempts/` archive supplies the same view for every PREVIOUS cohort, for free.
  # Read-only: it never rents, never nudges, never destroys.
  # ------------------------------------------------- free: the gate's bytes vs the host's bytes, side by side
  # $0 FORENSIC FOR THE CLOSURE TRIANGLE. `collect` prints a FILTERED head plus a 5-line tail of each leg's
  # run.log, and on 2026-07-27 that filtering hid a fatal `ValueError` behind an innocuous `committed=none/0`
  # for 38 minutes — two dead legs rendered exactly like two healthy cold starts. This dumps every triangle
  # unit's run.log IN FULL, then assembles the two input trees (stage cache alone = what the atom-map gate
  # grades; stage + pre-equil overlay = what `run_ternary_leg.sh` actually hands the engine) and runs the
  # production `_build_components` against BOTH inside the parity image. Read-only end to end: no rent, no
  # nudge, no destroy.
  triangle_diag:
    needs: resolve
    if: ${{ needs.resolve.outputs.task == 'triangle-diag' }}
    runs-on: ubuntu-latest
    timeout-minutes: 40
    permissions:
      contents: write
    env:
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      AWS_DEFAULT_REGION: us-east-2
    steps:
      - uses: actions/checkout@v4
        with: { ref: "${{ github.ref_name }}" }
      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }
      # ★★ WHAT DID **EVERY** ATTEMPT DIE OF? (added 2026-07-29.) The two valB_mini ternary replicates had
      # 35 and 49 ARCHIVED attempts — 84 separately-rented hosts, each of which wrote its own run.log before
      # the next overwrote the live one. `strip_foreign_partial_charges` landed in the MIDDLE of that series,
      # so the archive spans both sides of a code change and can answer, from the hosts' own output, the
      # question one traceback cannot: did the failure signature CHANGE when the fix landed? A single
      # `--logs` dump reads only the newest attempt and is structurally blind to that.
      #
      # Bare runner, boto3 + rdkit, no openfe and no docker: grouping tracebacks and counting an SD tag's
      # per-atom expansion needs neither. ~3 min, $0, read-only.
      - name: What did EVERY archived attempt die of, and on which side of the fix?
        run: |
          set -eo pipefail
          python -m pip install -q boto3 rdkit
          mkdir -p /tmp/census
          python research/modalities/valb_triangle_charge_forensic.py \
            --mode triangle,triangle_smoke,edge_reps \
            --attempts --attempts-full 80 --charge-census /tmp/census \
            --attempts-grep '^\s*\[(rbfe|tfep)\]|cache HIT|cache MISS|INHERITED|inherited partial|pose repair|status.:..done' \
            --out research/modalities/valb-triangle-attempt-forensic.json 2>&1 | tee /tmp/attempts.txt
      # ★★ WHICH COMMITTED GENERATIONS CAN A RENTED HOST ACTUALLY RESUME FROM? (added 2026-07-30.)
      # The board and the restorer read the same S3 prefix under different rules — the board counted any
      # object under iter-N, the restorer accepts only a generation carrying its COMMITTED.json. On this
      # very leg that produced `committed: production/1800` alongside `restore -> production@iter 1760`,
      # and the 40 iterations in between were re-run after every host change with nothing saying so.
      # committed_progress now applies the manifest rule too; this step is the finer instrument, because
      # it ALSO reads each manifest and reports a fingerprint rejection, which a listing cannot see.
      - name: Commit-store audit — board frontier vs the frontier a host would resume from
        run: |
          set -eo pipefail
          python -m pip install -q boto3
          # Into the REPO, not /tmp. The first run of this step proved why: it printed the answer into a
          # job log whose middle is unreachable through the API (the two steps after it emit ~600k
          # characters, so every tail that fits stops short of it) and whose download host the sandbox's
          # egress proxy 403s. An artifact nobody can read is the same as no artifact.
          mkdir -p research/modalities/commit-audits
          for leg in calib_hi_to_lo2__ternary_vhl calib_hi_to_lo2__binary_vhl \
                     calib_lo_to_lo2__ternary_vhl calib_lo_to_lo2__binary_vhl; do
            # ⚠ `cmd | tee ... || warn` DOES NOT WORK HERE and the first run proved it: the shell reads
            # tee's status, so four consecutive TypeError tracebacks reported the step GREEN. Capture the
            # python exit status itself, and make a failure a visible ::error.
            if python research/modalities/commit_store_audit.py --leg "$leg" --mode triangle \
                 --timestep-fs 2.0 --warmup-timestep-fs 1.0 \
                 --out "research/modalities/commit-audits/$leg.json" > /tmp/one_audit.txt 2>&1; then
              cat /tmp/one_audit.txt | tee -a /tmp/commit_audit.txt
            else
              echo "::error title=COMMIT AUDIT FAILED::$leg"
              cat /tmp/one_audit.txt | tee -a /tmp/commit_audit.txt
            fi
          done
      - name: Every triangle unit's FULL run.log, and both input trees pulled side by side
        run: |
          set -eo pipefail
          python -m pip install -q boto3
          mkdir -p /tmp/tridiag
          # `edge_reps` too: the valB_mini binary arms are the only units of this shape that COMPLETED, so
          # their run.log is the control every failure explanation has to be consistent with.
          python research/modalities/valb_triangle_charge_forensic.py --mode triangle,edge_reps \
            --logs 2>&1 | tee /tmp/tri_logs.txt
          python research/modalities/valb_triangle_charge_forensic.py --mode triangle \
            --fetch-caches /tmp/tridiag 2>&1 | tee -a /tmp/tri_logs.txt
      - name: Build the endpoints from EACH tree, in the image that produced the failure
        run: |
          set -eo pipefail
          for i in 1 2 3; do
            echo "${{ secrets.DOCKERHUB_TOKEN }}" | docker login -u triskit23 --password-stdin && break
            [ "$i" = 3 ] && { echo "::error::forensic could not pull the parity image"; exit 1; }
            sleep 20
          done
          docker run --rm --entrypoint python \
            -v "$PWD/research/modalities:/work/research/modalities" -v /tmp/tridiag:/tmp/tridiag \
            -e RBFE_LOMAP_TIME_S=300 -e SSL_CERT_FILE=/etc/ssl/certs/ca-certificates.crt \
            -w /work/research/modalities \
            docker.io/triskit23/ternary-fep:latest \
            /work/research/modalities/valb_triangle_charge_forensic.py --mode triangle \
              --audit /tmp/tridiag --out /tmp/tridiag/report.json 2>&1 | tee /tmp/tri_audit.txt
          cp /tmp/tridiag/report.json research/modalities/valb-triangle-charge-forensic.json
      - name: Commit the forensic — evidence nobody should have to re-derive from an expiring job log
        run: |
          set -eo pipefail
          # ⛔ ONE HOME FOR THE PUBLISH. This was `git pull --rebase --autostash` + push: one conflict
          # leaves the repo mid-rebase, every retry dies on the wreckage of the first, and the step
          # ends GREEN having published nothing. Measured on three lanes — see the primitive's header.
          # PUBLISH_IF_CHANGED=1 because this records an EVENT, not a heartbeat: an empty commit here
          # would assert something that did not happen on this run.
          PUBLISH_IF_CHANGED=1 bash research/compute/publish_artifacts.sh "${{ github.ref_name }}" \
            "valB triangle forensic: the gate's SDF vs the host's SDF (CI)" \
            research/modalities/valb-triangle-charge-forensic.json \
            research/modalities/valb-triangle-attempt-forensic.json \
            research/modalities/commit-audits
      - name: Summary LAST
        run: |
          set -eo pipefail
          echo "================ EVERY ARCHIVED ATTEMPT ================"
          cat /tmp/attempts.txt || true
          echo "================ TRIANGLE ENDPOINT AUDIT ================"
          cat /tmp/tri_audit.txt
          # LAST, so the frontier comparison is inside every tail that fits — the reason this step exists.
          echo "================ COMMIT-STORE AUDIT ================"
          cat /tmp/commit_audit.txt || true

  # ------------------------------------------------- free: which charge set did each BANKED leg actually run?
  # ★★ THE ONE QUESTION A LOG CANNOT ANSWER. `_protocol()` prints `partial_charge_method = nagl` whether or not
  # OpenFF then used it — OpenFF PREFERS user-supplied charges over the configured method, and until the strip
  # landed at 2026-07-28T00:54Z every pose file handed the engine a complete charge set to prefer. The
  # serialized hybrid `System` in each leg's SETUP CACHE records what was actually PARAMETERIZED, so the
  # provenance of every banked ΔG is answerable from stored bytes.
  #
  # WHY IT IS NOT COSMETIC: ΔΔG_coop = ΔΔG_ternary − ΔΔG_binary, and the charge model cancels from that cycle
  # ONLY IF BOTH ARMS USED THE SAME ONE. `use_preequil` is per-leg, so an arm-asymmetric inheritance is exactly
  # the shape that breaks the cancellation — and this job's decisive comparison (the two arms' alchemical
  # charge columns, element-wise) settles it without needing any reference charge model at all.
  #
  # BOTH STORES IN ONE JOB, deliberately: the r0 cycle the manuscript rests on ran on GCP (GCS) while its
  # replicates ran on Vast (S3), and the question is precisely whether those two agree. Read-only end to end —
  # it lists and GETs, and provisions nothing. $0, bare runner, no docker, no GPU.
  charge_provenance:
    needs: resolve
    if: ${{ needs.resolve.outputs.task == 'charge-provenance' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
      id-token: write
    env:
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      AWS_DEFAULT_REGION: us-east-2
    steps:
      - uses: actions/checkout@v4
        with: { ref: "${{ github.ref_name }}" }
      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }
      # Keyless WIF, same provider + SA the GCP ternary lane uses. `continue-on-error` because the GCS half is
      # ADDITIVE: if the federation is unavailable the S3 legs must still be measured, and the GCS legs must
      # then be reported as UNMEASURED rather than silently omitted (which would read as "clean").
      - id: auth
        continue-on-error: true
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: projects/878095411563/locations/global/workloadIdentityPools/github-pool/providers/github-provider
          service_account: gpu-runner@project-a7ebde30-e2ed-4b8d-9a9.iam.gserviceaccount.com
      - if: ${{ steps.auth.outcome == 'success' }}
        continue-on-error: true
        uses: google-github-actions/setup-gcloud@v2
      # ONE INVOCATION, ONE ARTIFACT. The listing is not decoration: which SETUP_CACHE_VERSION a leg was
      # built under is only knowable from what EXISTS, and reading that off a job log that expires — while
      # the verdict it supports is committed — is how the repo ended up inferring a leg's setup version from
      # the ABSENCE of a directory (the defect ternary-watch.json flags by name). Both go in the same file.
      - name: What caches exist, and what charges does every banked leg's System carry?
        run: |
          set -eo pipefail
          python -m pip install -q boto3
          python research/modalities/charge_provenance_forensic.py --list-caches --audit \
            --out research/modalities/charge-provenance-forensic.json 2>&1 | tee /tmp/audit.txt
      - name: Commit the forensic — provenance nobody should have to re-derive from an expiring job log
        run: |
          set -eo pipefail
          # PUBLISH_IF_CHANGED=1: this records an EVENT, not a heartbeat — an empty commit would assert
          # something that did not happen on this run.
          # ⛔ ONE HOME FOR THE PUBLISH. The hand-rolled `git pull --rebase` this replaces wedges on a
          # conflict: the repo is left mid-rebase, every retry dies on the first one's wreckage, and the
          # step ends GREEN having published nothing. See research/compute/publish_artifacts.sh.
          PUBLISH_IF_CHANGED=1 bash research/compute/publish_artifacts.sh "${{ github.ref_name }}" \
            "charge provenance: which charge set each banked valB leg's System carried (CI)" \
            research/modalities/charge-provenance-forensic.json
      - name: Summary LAST
        run: |
          set -eo pipefail
          echo "================ CHARGE PROVENANCE ================"
          cat /tmp/audit.txt

  reps_diag:
    needs: resolve
    if: ${{ needs.resolve.outputs.task == 'reps-diag' }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: write
    env:
      VAST_API_KEY: ${{ secrets.VAST_API_KEY }}
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      AWS_DEFAULT_REGION: us-east-2
    steps:
      - uses: actions/checkout@v4
        with: { ref: "${{ github.ref_name }}" }
      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }
      - name: FIRST — what does the ACCOUNT hold? (a per-mode board structurally cannot answer this)
        # ★★ RUN BEFORE THE PER-MODE LOOP, DELIBERATELY. This is the only step that can say whether a host
        # is STILL BILLING, and the loop below takes tens of minutes; a census printed after a timeout is a
        # census nobody gets. `collect` builds its board from the units of ONE mode, so a host rented for an
        # un-enumerated unit — a smoke, a parked leg — is invisible to it whether it is alive or destroyed,
        # and reading that silence as "gone" is the §4a mistake. $0: one GET, destroys nothing.
        # ⚠ `|| true`: a provider hiccup here must not cost the forensic below.
        run: |
          set -eo pipefail
          python -m pip install -q boto3
          python research/modalities/ternary_reps_diag.py --census \
            --instance 46459452 \
            --out research/modalities/ternary-vast-account-census.json 2>&1 | tee /tmp/acct-census.txt || true
      - name: Read every replicate leg's own output — S3 attempts archive + container console
        run: |
          set -eo pipefail
          python -m pip install -q boto3
          python research/modalities/ternary_reps_diag.py --mode edge_reps \
            --out research/modalities/ternary-reps-diag.json 2>&1 | tee /tmp/diag.txt
      - name: ...and the SAME forensic for every OTHER re-placeable mode, not just the reps arm
        # ★★ WHY THIS IS NOT AN `edge_reps` TOOL (2026-07-31). The idle guard condemned two 5a-KS legs as
        # WEDGED — `run.log` re-uploaded byte-identical for 18 min with the committed scalar frozen — and the
        # only thing that can say WHY is this diagnostic: the `attempts/` archive holds the last lines the
        # container actually wrote, and those lines survive the host being destroyed. It was pinned to
        # `--mode edge_reps`, so the lane that was actually running was the one it could not see. Exactly the
        # shape of the `collect` re-placement map that stranded a 5a-KS leg two days earlier.
        #
        # The mode list is DERIVED from `MODE_GATE_TASK` — the same map that decides which modes are
        # re-placeable at all — so a new mode is covered without anybody remembering to edit a second list.
        # $0: S3 list + GET, plus `request_logs` for instances still listed. Rents nothing.
        run: |
          set -eo pipefail
          MODES=$(python3 research/modalities/ternary_vast_launch.py --replaceable-modes)
          MODES=$(echo "$MODES" | tr ' ' '\n' | grep -v '^edge_reps$' | tr '\n' ' ')
          echo "other re-placeable modes: $MODES"
          for M in $MODES; do
            echo "================ mode=$M ================"
            python research/modalities/ternary_reps_diag.py --mode "$M" \
              --out "research/modalities/ternary-diag-$M.json" 2>&1 | tee "/tmp/diag-$M.txt" || \
              echo "::warning title=DIAG FAILED::mode=$M"
          done
      - name: THE SETUP TAX — how much of each rental is bought and not spent on science
        # ★ trimcrae, 2026-07-31: *"What do we have to do to get back to the good throughput we had in prior
        # sessions?"* The fan-out churned HARDER (208 rentals / 19 units) and still landed 18 of 19, so churn
        # is not the answer; what differs is how much of each rental is PRODUCTIVE. A rental shorter than
        # time-to-first-commit buys nothing at all, and 25 % of this lane's sessions are.
        # `setup_tax.py` reads the three caches' own HIT/MISS lines out of the archived run.logs plus the
        # self-timed `SETUP done in Ns` / `restore took Ns` lines. $0: S3 LIST + GET, rents nothing.
        # `--head` prints a real log so the anchors this parser does NOT know about stay discoverable.
        run: |
          set -eo pipefail
          for M in 5aks triangle; do
            echo "================ setup tax: $M ================"
            python research/modalities/setup_tax.py --mode "$M" --limit 6 --head 60 \
              --out "research/modalities/setup-tax-$M.json" 2>&1 | tee "/tmp/tax-$M.txt" || \
              echo "::warning title=SETUP TAX FAILED::mode=$M"
          done
      - name: Are the seeds' staged inputs even the same kind of thing? — structural census across seeds
        # $0 and ~30 s. `ternary_pdb_stage` takes starting_model_index = seed % n_models with n_models=2, so
        # seed 2 is NOMINALLY the same relaxed SMARCA2 model as seed 0 — the leg that ran to completion. If
        # seed 2's staged tree does not match seed 0's, the seed keying is not doing what its comment says.
        run: |
          set -eo pipefail
          python research/modalities/ternary_reps_diag.py --mode edge_reps --compare-stage \
            --leg calib_hi_to_lo__ternary_vhl \
            --out research/modalities/ternary-reps-stage-census.json 2>&1 | tee /tmp/census.txt
      - name: Measure the per-arm iteration rate the checkpoint cadence is derived from
        # $0, read-only (list + GET of leg.json), rents nothing and touches no instance. This is the ONE HOME
        # of `ternary_vast_launch.arm_iteration_rates()`: the per-arm checkpoint interval is derived from a
        # MEASURED seconds-per-iteration, and a measured number that is typed into a source file is one nobody
        # re-derives when the fleet moves to a different card. Re-run this and the cadence follows.
        run: |
          set -eo pipefail
          python research/modalities/ternary_arm_rates.py \
            --out research/modalities/ternary-arm-iteration-rates.json 2>&1 | tee /tmp/rates.txt
      - name: The discriminator — container memory vs its limit across the window the ternary legs die in
        # `watch_minutes` blank = skip. The forensic above says the ternary legs die deterministically at
        # HybridTopologyFactory and that the kill takes the WHOLE CONTAINER (bash never reaches the
        # deliverable path it runs unconditionally). It cannot say whether that is an out-of-memory kill on
        # the ~142k-particle system or a provider-side stop — and the remedies are opposite, so this measures
        # it rather than guessing. Needs to be running WHILE a ternary leg is in setup.
        if: ${{ vars.TVAST_WATCH_MINUTES != '' }}
        run: |
          set -eo pipefail
          python research/modalities/ternary_reps_diag.py --mode edge_reps \
            --watch-memory "${{ vars.TVAST_WATCH_MINUTES }}" --every 20 \
            --out research/modalities/ternary-reps-memory-trace.json 2>&1 | tee /tmp/mem.txt
      - name: Commit the forensic — evidence nobody has to re-derive from a job log GitHub will expire
        run: |
          set -eo pipefail
          git config user.name "Claude"; git config user.email "noreply@anthropic.com"
          git add research/modalities/ternary-reps-diag.json
          for f in ternary-reps-memory-trace.json ternary-reps-stage-census.json ternary-arm-iteration-rates.json \
                   ternary-vast-account-census.json; do
            [ -f "research/modalities/$f" ] && git add "research/modalities/$f" || true
          done
          # ...and every other mode's forensic, so a wedged 5a-KS leg's own last lines outlive the job log.
          git add research/modalities/ternary-diag-*.json 2>/dev/null || true
          git add research/modalities/setup-tax-*.json 2>/dev/null || true
          # PUBLISH_IF_CHANGED=1: this records an EVENT, not a heartbeat — an empty commit would assert
          # something that did not happen on this run.
          # ⚠ THE GLOBBED FAMILIES MUST BE ARGUMENTS, NOT PRE-STAGED. The primitive resets the working
          # tree to the fetched tip before laying our copies back down, so anything staged before it
          # runs is DISCARDED. Passing the globs here lets the caller's shell expand them, and an
          # unmatched glob arrives as a literal that the primitive's own `[ -e ]` filter drops.
          # ⛔ ONE HOME FOR THE PUBLISH. The hand-rolled `git pull --rebase` this replaces wedges on a
          # conflict: the repo is left mid-rebase, every retry dies on the first one's wreckage, and the
          # step ends GREEN having published nothing. See research/compute/publish_artifacts.sh.
          PUBLISH_IF_CHANGED=1 bash research/compute/publish_artifacts.sh "${{ github.ref_name }}" \
            "ternary replicate forensic: what the containers themselves said (CI)" \
            research/modalities/ternary-reps-diag.json \
            research/modalities/ternary-reps-memory-trace.json \
            research/modalities/ternary-reps-stage-census.json \
            research/modalities/ternary-arm-iteration-rates.json \
            research/modalities/ternary-vast-account-census.json \
            research/modalities/ternary-diag-*.json \
            research/modalities/setup-tax-*.json
      - name: Summary LAST
        run: |
          set -eo pipefail
          echo "================ VAST ACCOUNT CENSUS (is anything still billing?) ================"
          cat /tmp/acct-census.txt 2>/dev/null || echo "(no census — the step did not produce one)"
          echo "================ TERNARY REPS DIAG ================"
          cat /tmp/diag.txt
          [ -f /tmp/census.txt ] && { echo "======== STAGED INPUT CENSUS BY SEED ========"; cat /tmp/census.txt; } || true
          [ -f /tmp/mem.txt ] && { echo "======== CONTAINER MEMORY TRACE ========"; cat /tmp/mem.txt; } || true

  # ------------------------------------------- free: the CONTROLLED REPRODUCTION of the ternary setup death
  # ★★ THE MEASUREMENT §4 ASKS FOR — instrument the code and reproduce it, rather than explain it. The
  # replicate forensic shows the ternary legs dying at HybridTopologyFactory construction, deterministically,
  # on every host; the live memory trace watches a rented box through that window. Both depend on catching a
  # box at the right moment. This does not: it runs the SAME `HybridTopologySetupUnit` the leg dies inside —
  # `nr4a3_ternary_fep.py` with MODE=smoke executes it explicitly, on CPU, with no MD — under `peak_rss.py`,
  # for the ternary AND the matched binary leg, printing every new high-water mark AS IT IS REACHED. That last
  # part is not a detail: the process under test may be SIGKILLed, and a meter that only reports at exit
  # (`/usr/bin/time -v`, `resource.getrusage`) reports nothing at all about the run that was killed. `time` is
  # also not in this image — the first attempt printed `bash: /usr/bin/time: No such file or directory`.
  #
  # ⚠ ITS FAILURE MODE IS ALSO AN ANSWER. A GitHub runner has ~16 GB. If the ternary setup needs more than
  # that the step is killed here too, which is a REPRODUCTION on hardware nobody is billing us for, and a far
  # cleaner one than a rented box that also happens to be preemptible.
  #
  # PARITY, NOT CONVENIENCE (CLAUDE.md §6): it runs in `triskit23/ternary-fep`, the byte-for-byte image the
  # legs run in, with the repo mounted over the baked copy. A different openfe/openmm would measure a
  # different allocation and answer a question nobody asked.
  reps_setup_rss:
    needs: resolve
    if: ${{ needs.resolve.outputs.task == 'reps-setup-rss' }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      AWS_DEFAULT_REGION: us-east-2
    steps:
      - uses: actions/checkout@v4
        with: { ref: "${{ github.ref_name }}" }
      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }
      - run: echo "${{ secrets.DOCKERHUB_TOKEN }}" | docker login -u triskit23 --password-stdin
      - name: How much memory this runner actually has — the number the result is judged against
        run: |
          free -g; echo "---"; df -h /; echo "---"; nproc
      - name: Build every cell's hybrid system in the parity image, under a meter that survives a SIGKILL
        # ★★ THE MATRIX IS THE EXPERIMENT, NOT THE MEMORY NUMBER. The ternary arm has a POSITIVE CONTROL that
        # nobody had used: `calib_hi_to_lo__ternary_vhl` at SEED 0 ran to completion on a rented host
        # (dG_morph = 47.61 +/- 0.13, 17.0 s/iter) at the same 4 fs, in the same image, on the same ~142k
        # particles. Seeds 1 and 2 die. So running seed 0 and seed 1 BACK TO BACK ON ONE RUNNER, with one
        # memory limit and one openfe, separates the two families of cause outright:
        #
        #   * seed 0 passes and seed 1 dies  -> the system SIZE is not the cause and neither is the host.
        #                                       What differs is the SEED-KEYED STAGED INPUT that `reps-prime`
        #                                       built, and the fix is in staging, not in `resource_spec`.
        #   * both die at ~the same peak     -> it is the ternary system itself against the memory available,
        #                                       i.e. the SPEC problem, and more retries can never help.
        #
        # The binary seed-1 cell is the third leg of the comparison: it is the arm that DOES commit today.
        run: |
          set -eo pipefail
          python -m pip install -q boto3
          mkdir -p /tmp/tout
          # unit_id : leg : seed : what we expect, stated BEFORE the run so the result can contradict it
          CELLS="binary1:calib_hi_to_lo__binary_vhl:1:PASS-today-on-a-real-host
          ternary0:calib_hi_to_lo__ternary_vhl:0:PASS-completed-on-a-real-host-dG-47.61
          ternary1:calib_hi_to_lo__ternary_vhl:1:FAIL-dies-on-every-host
          ternary2:calib_hi_to_lo__ternary_vhl:2:FAIL-dies-on-every-host"
          for CELL in $CELLS; do
            NAME="${CELL%%:*}"; REST="${CELL#*:}"; LEG="${REST%%:*}"; REST="${REST#*:}"
            SEED="${REST%%:*}"; EXPECT="${REST#*:}"
            IN="/tmp/tin-$NAME"
            echo "================ $NAME  leg=$LEG seed=$SEED  (expected: $EXPECT) ================"
            # Per-cell input dir: two seeds of one leg unpack to the SAME <leg_id>/ subdirectory, so a shared
            # one would silently have the last seed's structures under every cell's name — a matrix that
            # compares one input against itself and reports agreement.
            rm -rf "$IN"; mkdir -p "$IN"
            python research/modalities/ternary_reps_diag.py --mode edge_reps --seed "$SEED" \
              --leg "$LEG" --fetch-stage "$IN" || { echo "  (no stage cache for $LEG seed $SEED — skipping)"; continue; }
            docker run --rm --entrypoint bash \
              -v "$PWD/research/modalities:/work/research/modalities" \
              -v "$IN:$IN" -v /tmp/tout:/tmp/tout \
              -e MODE=smoke -e LEG_ID="$LEG" -e SEED="$SEED" -e DIRECTION=fwd \
              -e INPUT_DIR="$IN" -e OUTPUT_DIR=/tmp/tout -e CKPT_DIR=/tmp/tout \
              -e CHARGE_METHOD=nagl -e N_WINDOWS=12 -e RBFE_TIMESTEP_FS=4.0 \
              docker.io/triskit23/ternary-fep:latest \
              -c "cd /work/research/modalities && python peak_rss.py python nr4a3_ternary_fep.py" \
              2>&1 | tee "/tmp/rss-$NAME.txt" || true
            echo "---- $NAME ----"
            grep -E "\[peak-rss\]" "/tmp/rss-$NAME.txt" | tail -4 || \
              echo "  (no [peak-rss] line at all — the sampler itself never ran; read the tail above)"
          done
      - name: Summary LAST — every cell's verdict, peak and last line, in one block
        run: |
          set -eo pipefail
          echo "================ HYBRID-SYSTEM SETUP BY CELL ================"
          free -g | sed -n 2p
          for NAME in binary1 ternary0 ternary1 ternary2; do
            [ -f "/tmp/rss-$NAME.txt" ] || { echo "-- $NAME: not run"; continue; }
            echo "-- $NAME"
            grep -E "\[peak-rss\] EXIT" "/tmp/rss-$NAME.txt" || echo "   no EXIT line — the sampler's parent died too"
            echo "   last line: $(grep -v '^\[peak-rss\]' "/tmp/rss-$NAME.txt" | grep -v '^$' | tail -1 | cut -c1-160)"
          done
          echo "================ FULL TAILS ================"
          for NAME in binary1 ternary0 ternary1 ternary2; do
            [ -f "/tmp/rss-$NAME.txt" ] && { echo "-- $NAME"; tail -18 "/tmp/rss-$NAME.txt"; } || true
          done

      # ★★ COMMIT THE MEASUREMENT — A RESULT THAT LIVES ONLY IN A CI LOG IS A RESULT NOBODY HAS
      # (2026-08-01). This task's whole purpose is to decide whether the 32 GB `cpu_ram` floor can be
      # relaxed — the largest single priced filter on the board, worth 35.7 % of achievable $/ns in the
      # ablation. It printed its answer to stdout and committed nothing, so reading it needs an
      # authenticated Actions log download, and the log ages out. The measurement was asked for, and there
      # was nothing durable to read: no `reps_setup_rss` job appears in the last 400 workflow runs.
      #
      # ⚠ AND THE ARTIFACT CARRIES ITS OWN SCOPE LIMIT, because the number is a LOWER BOUND for this lane:
      # it meters the ~146k-particle valB_mini system, while 5a-KS is ~285k. A peak that fits in 32 GB here
      # does not license anything for a system nearly twice the size, and a reader who finds the JSON in six
      # months will not be carrying that caveat in their head.
      - name: Commit the peak-RSS measurement so it can be read without a log download
        if: always()
        run: |
          set -eo pipefail
          OUT=research/modalities/ternary-setup-rss.json
          python - <<'PY' > "$OUT"
          import glob, json, os, re, time
          doc = {"_what": "peak resident set size while BUILDING each cell's hybrid system, in the parity "
                          "image, under a meter that survives a SIGKILL. The evidence for whether the 32 GB "
                          "cpu_ram floor can be relaxed.",
                 "_scope_limit": "MEASURES THE ~146k-PARTICLE valB_mini SYSTEM. 5a-KS is ~285k particles, so "
                                 "every figure here is a LOWER BOUND for that lane and does not on its own "
                                 "license relaxing the floor for it.",
                 "utc": time.strftime("%Y-%m-%dT%H:%M:%SZ", time.gmtime()), "cells": {}}
          for f in sorted(glob.glob("/tmp/rss-*.txt")):
              name = os.path.basename(f)[4:-4]
              txt = open(f, errors="replace").read()
              m = re.search(r"\[peak-rss\] EXIT.*?peak[= ]([0-9.]+)\s*([KMG]i?B)?", txt)
              doc["cells"][name] = {
                  "peak_raw": m.group(0)[:200] if m else None,
                  "peak_value": float(m.group(1)) if m else None,
                  "peak_unit": (m.group(2) if m else None),
                  "exit_line_present": bool(m),
                  "last_line": ([ln for ln in txt.splitlines() if ln.strip()
                                 and not ln.startswith("[peak-rss]")] or [None])[-1],
                  "bytes": os.path.getsize(f)}
          doc["cells_measured"] = sum(1 for c in doc["cells"].values() if c["exit_line_present"])
          doc["runner_mem_line"] = os.popen("free -g | sed -n 2p").read().strip()
          print(json.dumps(doc, indent=1))
          PY
          cat "$OUT"
          # ⛔ ONE HOME FOR THE PUBLISH. This was `git pull -q --rebase` + push: one conflict leaves the
          # repo mid-rebase and every retry dies on the first one's wreckage, while the step stays GREEN.
          # ⚠ NO PUBLISH_IF_CHANGED HERE, and that is deliberate: this step already committed
          # `--allow-empty`, because a run that measured nothing is itself the finding — "the meter
          # produced no EXIT line" is what `exit_line_present: false` records. Suppressing the commit
          # would delete that measurement rather than report it.
          bash research/compute/publish_artifacts.sh "${{ github.ref_name }}" \
            "ternary setup peak-RSS measurement (CI)" \
            "$OUT"

  # `reduce-reps` is the SAME job with one more fetch, deliberately: the replicate reduction differs from the
  # seed-0 one only in which leg JSONs land in the directory, and the reducer globs that directory. Giving it
  # a second job would be a second expression of the reduction, and the standing rule here is one fact, one
  # place — a divergence between "the reduction" and "the replicate reduction" is precisely how a cycle ends
  # up reported two ways.
  reduce:
    needs: resolve
    if: ${{ needs.resolve.outputs.task == 'reduce' || needs.resolve.outputs.task == 'reduce-reps' }}
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      # The credential a RENTED community host is given, forwarded in cleartext by _vast_onstart.
      # Scoped to the lane prefixes + six S3 actions a leg needs (s3_scoped_policy.py). Unset until
      # trimcrae creates the vast-leg-s3 user -> gpu_backend falls back to the broad key above, which
      # is why lanes in flight kept running. Runbook: research/compute/scoped-s3-credential-runbook.md
      VAST_S3_ACCESS_KEY_ID: ${{ secrets.VAST_S3_ACCESS_KEY_ID }}
      VAST_S3_SECRET_ACCESS_KEY: ${{ secrets.VAST_S3_SECRET_ACCESS_KEY }}
      VAST_S3_SCOPED_STS: ${{ vars.VAST_S3_SCOPED_STS }}
      AWS_DEFAULT_REGION: us-east-2
      TVAST_GPU: ${{ github.event.inputs.gpu_class }}
      TVAST_MIN_NS_PER_H: ${{ github.event.inputs.min_ns_per_h }}
      TVAST_ON_DEMAND: ${{ github.event.inputs.on_demand }}
      TVAST_PRUNE_CHK: ${{ vars.TVAST_PRUNE_CHK }}
      VAST_BID_FLOOR_MULT: ${{ github.event.inputs.bid_floor_mult }}
      TVAST_TIMESTEP_FS: ${{ github.event.inputs.timestep_fs }}
      TVAST_WARMUP_TIMESTEP_FS: ${{ github.event.inputs.warmup_timestep_fs }}
    steps:
      - uses: actions/checkout@v4
        with: { ref: "${{ github.ref_name }}" }
      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }
      - name: Pull the edge's leg JSONs and cross-check the identity
        run: |
          set -eo pipefail
          python -m pip install -q boto3
          mkdir -p /tmp/tred
          python research/modalities/ternary_vast_launch.py --mode edge --fetch-legs /tmp/tred \
            2>&1 | tee /tmp/identity.txt
          # THE REPLICATES LAND IN THE SAME DIRECTORY, because that is how the reducer finds them:
          # `ternary_fep_reduce._find_leg_files` globs `leg_<leg_id>_<direction>_r<seed>.json`, so seeds 0, 1
          # and 2 of one leg are three files that differ only in their `_r<seed>` suffix, and
          # `per_replicate_ddg_coop` pairs ternary with binary BY SEED to form one ΔΔG_coop per replicate.
          # The between-replicate sample SD of those values IS the cycle SD the frozen gate reads — it is a
          # replicate SD, never an MBAR SE.
          if [ "${{ needs.resolve.outputs.task }}" = "reduce-reps" ]; then
            python research/modalities/ternary_vast_launch.py --mode edge_reps --fetch-legs /tmp/tred \
              2>&1 | tee -a /tmp/identity.txt
          fi
          ls -la /tmp/tred
      - name: Official reduction, in the SAME env that produced the trajectories
        # PULL, DO NOT SOLVE. The image carries the exact openfe/openmmtools/pymbar the legs were run with,
        # and analysing an OpenFE trajectory with a different pymbar/openmmtools than PRODUCED it can move
        # the MBAR numbers — so this is the correct environment, not merely the fast one. The repo is mounted
        # over the image's baked copy so the reducer that runs is the branch's, not the build-time one.
        run: |
          set -eo pipefail
          echo "${{ secrets.DOCKERHUB_TOKEN }}" | docker login -u triskit23 --password-stdin
          docker run --rm --entrypoint python \
            -v "$PWD/research/modalities:/work/research/modalities" \
            -v /tmp/tred:/tmp/tred \
            -e CKPT_DIR=/tmp/tred -e INPUT_DIR=/tmp/tred -e MODE=reduce \
            -w /work/research/modalities \
            docker.io/triskit23/ternary-fep:latest \
            /work/research/modalities/nr4a3_ternary_fep.py 2>&1 | tail -60
          ls -la /tmp/tred
      # ⚠ SYSTEM IDENTITY, NOT JUST PROTOCOL IDENTITY. `protocol_hash` covers the OpenFE SETTINGS and says
      # nothing about the SYSTEM, and ΔΔG_coop is a DIFFERENCE of legs — so three legs can share one hash and
      # still describe different solvated systems. That is not hypothetical here: on 2026-07-25 four reverse-leg
      # attempts ran a 146,020-particle `v1` build against a 141,968-particle `v2pe` forward leg, and no check
      # in the repo reported it. The reducer computes `system_identity_consistency` over n_particles /
      # charge_method / setup_cache_version, with unrecorded fields reported as UNKNOWN rather than folded in as
      # agreement — but nothing printed it, so the gate was being read off the hash alone.
      - name: System identity across the cycle (the check protocol_hash cannot make)
        run: |
          set -eo pipefail
          python3 - <<'PY'
          import json
          d = json.load(open("/tmp/tred/ternary_coop_reduction.json"))
          si = d.get("system_identity_consistency")
          print("================ SYSTEM IDENTITY ================")
          print(json.dumps(si, indent=1) if si else "(absent from the reduction — reducer version mismatch?)")
          for k in ("valB_calibration_gate", "valB_calibration_decision"):
              if k in d:
                  print(f"--- {k} ---"); print(json.dumps(d[k], indent=1))
          PY

      # ★★ THE REPLICATE REDUCTION IS A DELIVERABLE, AND IT WAS LIVING IN A RUNNER'S /tmp (2026-08-01, found
      # by the lane-registry contract test).
      #
      # `ternary-valb-reps` declares `terminal_artifact: valb-replicate-reduction.json`, and that name
      # appeared at EXACTLY ONE site in the whole repo — the registry line declaring it. This job wrote its
      # reduction to `/tmp/tred/ternary_coop_reduction.json` and neither committed nor uploaded it, so:
      #
      #   * `read_ternary_family`'s terminal-artifact route to FINISHED was UNREACHABLE for this lane alone,
      #     while both siblings commit theirs. A lane that cannot report FINISHED is indistinguishable from
      #     one that stalled — and the `ledger_seen` branch would have called it "STARTED AND NOT FINISHED"
      #     forever if its watch entries were ever cleared.
      #   * the analysis died with the runner, so anybody who wanted the cycle SD recomputed it.
      #
      # ⚠ `reduce-reps` ONLY. The plain `reduce` task reduces RUNG 2b's `edge` cycle, whose verdict is
      # already published and whose registry lane declares no terminus; writing the same filename from both
      # would make one lane's committed artifact silently depend on which task ran last.
      - name: Commit the replicate reduction — the terminus this lane declares and never produced
        if: ${{ needs.resolve.outputs.task == 'reduce-reps' }}
        run: |
          set -eo pipefail
          SRC=/tmp/tred/ternary_coop_reduction.json
          DST=research/modalities/valb-replicate-reduction.json
          # ⚠ ABSENCE IS A FAILURE, NOT A NO-OP. This job's whole output is that file; a reducer that wrote
          # nothing and a reducer that wrote a null result are opposite findings, and skipping quietly would
          # leave the lane in exactly the state this step exists to end.
          test -s "$SRC" || { echo "::error title=NO REPLICATE REDUCTION::the reducer produced no $SRC — there is nothing to commit, and the lane still has no terminus"; exit 1; }
          python3 - "$SRC" "$DST" <<'PY'
          import json, sys, time
          src, dst = sys.argv[1], sys.argv[2]
          d = json.load(open(src))
          # Provenance the raw reducer output does not carry, because a reader six months from now needs to
          # know WHICH task produced this file and that it is a copy of a runner-side artifact, not a
          # second, independently-computed number.
          d["_what"] = ("the valB_mini REPLICATE reduction (seeds 0/1/2) — the cycle SD across replicates, "
                        "which is a replicate SD and never an MBAR SE. Written by task=reduce-reps in "
                        "gpu-ternary-fep-vast.yml, inside the parity image that produced the trajectories.")
          d["_produced_utc"] = time.strftime("%Y-%m-%dT%H:%M:%SZ", time.gmtime())
          d["_source"] = "gpu-ternary-fep-vast.yml task=reduce-reps -> nr4a3_ternary_fep.py MODE=reduce"
          json.dump(d, open(dst, "w"), indent=1, default=str)
          open(dst, "a").write("\n")
          print(f"wrote {dst}")
          PY
          # PUBLISH_IF_CHANGED=1: this records an EVENT, not a heartbeat — an empty commit would assert
          # something that did not happen on this run.
          # PUBLISH_FAIL_HARD=1: this file IS this job's terminus. Computed-but-unpushed leaves the
          # lane with no result at all, so a failed publish must be a RED BUILD, not an annotation.
          # ⛔ ONE HOME FOR THE PUBLISH. The hand-rolled `git pull --rebase` this replaces wedges on a
          # conflict: the repo is left mid-rebase, every retry dies on the first one's wreckage, and the
          # step ends GREEN having published nothing. See research/compute/publish_artifacts.sh.
          PUBLISH_IF_CHANGED=1 PUBLISH_FAIL_HARD=1 bash research/compute/publish_artifacts.sh "${{ github.ref_name }}" \
            "valB_mini replicates: the cycle SD across seeds (CI, parity image)" \
            "$DST"
      - name: Verdict LAST
        run: |
          set -eo pipefail
          echo "================ TVAST 4 fs IDENTITY ================"
          cat /tmp/identity.txt
          echo "reference: the 2 fs r0 cycle gave ddG_coop = -0.534 kcal/mol"
          echo "  (legs binary 48.0046 / ternary 47.4701 / solvent 47.8060 — valB-mini-r0-verdict-2026-07-25.md)"

  # ------------------------------------------------------------------ free: CPU-only trajectory diagnostics
  # WHY THIS TASK EXISTS. `reduce` fetches the leg JSONs — one ΔG each — and computes ΔΔG_coop. That is the
  # NUMBER, and it says nothing about whether the trajectory behind it sampled the intended state. The 2 fs r0
  # cycle's BINARY leg has a confirmed pose failure (its receptor-contacting moiety leaves and does not return in
  # 8 of 12 replicas, while the ternary leg in the same cycle is 12/12 stable — audit §L.3–L.3c), and RUNG 2b's
  # 4 fs cycle agrees with r0 to |Δ| = 0.0215 kcal/mol. Two readings of that agreement:
  #
  #   2b's binary leg SHARES the departure  -> the agreement is a real timestep reproduction on a shared-broken-arm
  #                                            basis; the 2b PASS stands as a verdict about 4 fs, and neither
  #                                            absolute ΔΔG_coop is a valid cooperativity.
  #   2b's binary leg HOLDS its pose        -> a contaminated arm and a clean one agree to 0.02 kcal/mol, and the
  #                                            claim that the departure invalidates ΔG_binary needs substantial
  #                                            softening.
  #
  # The second would be evidence AGAINST the r0 finding, which is exactly why it has to be looked at rather than
  # assumed. $0: free runner, no GPU, no Vast instance — it reads S3 and analyses on CPU.
  #
  # PARITY, not just speed: the analysis runs in the SAME image that produced the trajectories, because analysing
  # an OpenFE trajectory with a different pymbar/openmmtools than PRODUCED it can move the MBAR numbers. The repo
  # is mounted over the image's baked copy so the analyser that runs is the branch's.
  # ------------------------------------------------------------------ free: RUNG 5a-KS -> S
  # The double difference is computed by the OFFICIAL reducer inside the parity image, never by hand. The
  # reducer refuses a binary or solvent 5a-KS leg outright: the binary and solvent legs cancel ALGEBRAICALLY
  # out of S, so including one adds noise at best and computes a different quantity at worst.
  reduce_5aks:
    needs: resolve
    if: ${{ needs.resolve.outputs.task == '5aks-reduce' }}
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      # The credential a RENTED community host is given, forwarded in cleartext by _vast_onstart.
      # Scoped to the lane prefixes + six S3 actions a leg needs (s3_scoped_policy.py). Unset until
      # trimcrae creates the vast-leg-s3 user -> gpu_backend falls back to the broad key above, which
      # is why lanes in flight kept running. Runbook: research/compute/scoped-s3-credential-runbook.md
      VAST_S3_ACCESS_KEY_ID: ${{ secrets.VAST_S3_ACCESS_KEY_ID }}
      VAST_S3_SECRET_ACCESS_KEY: ${{ secrets.VAST_S3_SECRET_ACCESS_KEY }}
      VAST_S3_SCOPED_STS: ${{ vars.VAST_S3_SCOPED_STS }}
      AWS_DEFAULT_REGION: us-east-2
    steps:
      - uses: actions/checkout@v4
        with: { ref: "${{ github.ref_name }}", fetch-depth: 0 }
      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }
      - name: Pull both ternary legs' engine records
        run: |
          set -eo pipefail
          python -m pip install -q boto3
          mkdir -p /tmp/5aks_legs
          python research/modalities/ternary_vast_launch.py --mode 5aks --fetch-legs /tmp/5aks_legs
          ls -la /tmp/5aks_legs
      - name: Reduce to S, in the SAME env that produced the trajectories
        run: |
          set -eo pipefail
          echo "${{ secrets.DOCKERHUB_TOKEN }}" | docker login -u triskit23 --password-stdin
          docker run --rm --entrypoint python \
            -v "$PWD/research/modalities:/work/research/modalities" \
            -v /tmp/5aks_legs:/tmp/5aks_legs \
            -w /work/research/modalities \
            docker.io/triskit23/ternary-fep:latest \
            /work/research/modalities/nr4a3_5aks_reduce.py --legs /tmp/5aks_legs \
              --out /work/research/modalities/nr4a3-5aks-reduction.json
      - name: The reduction is a DELIVERABLE, so its absence is a failure
        run: |
          set -eo pipefail
          F=research/modalities/nr4a3-5aks-reduction.json
          test -s "$F" || { echo "::error::no reduction written"; exit 1; }
          python3 - <<'PY'
          import json, sys
          d = json.load(open("research/modalities/nr4a3-5aks-reduction.json"))
          print(json.dumps(d, indent=1)[:4000])
          dec = d.get("decision")
          if dec in ("REFUSED", "INCOMPLETE"):
              print(f"::error::the reduction returned {dec}: {d.get('reason')}")
              sys.exit(1)
          print(f"::notice title=RUNG 5a-KS::S = {d.get('S_kcal')} +/- {d.get('S_err_kcal')} "
                f"({d.get('S_err_kind')}), decision={dec}")
          PY
      - name: Commit the reduction
        run: |
          set -eo pipefail
          # ⛔ ONE HOME FOR THE PUBLISH. This was `git pull --rebase --autostash` + push: one conflict
          # leaves the repo mid-rebase, every retry dies on the wreckage of the first, and the step
          # ends GREEN having published nothing. Measured on three lanes — see the primitive's header.
          # PUBLISH_IF_CHANGED=1 because this records an EVENT, not a heartbeat: an empty commit here
          # would assert something that did not happen on this run.
          PUBLISH_IF_CHANGED=1 bash research/compute/publish_artifacts.sh "${{ github.ref_name }}" \
            "RUNG 5a-KS: the double difference S (CI, parity image)" \
            research/modalities/nr4a3-5aks-reduction.json

  # ------------------------------------------- $0: clear a stale FAILED record after its cause is fixed
  # `classify` returns FAILED only when `has_failed_record AND not instance_alive`, so relaunching a fixed leg
  # SUPPRESSES its old record rather than clearing it. The moment the new attempt exits without a leg.json the
  # stale record fires again — an alert pointing at a cause already fixed — and the watchdog's refusal to
  # relaunch a unit carrying a failed record then blocks the recovery it exists to trigger, overnight.
  # The record is ARCHIVED under `<unit>/superseded/`, never deleted; a `status=done` record is refused.
  supersede-failed:
    needs: resolve
    if: ${{ needs.resolve.outputs.task == 'supersede-failed' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      # The credential a RENTED community host is given, forwarded in cleartext by _vast_onstart.
      # Scoped to the lane prefixes + six S3 actions a leg needs (s3_scoped_policy.py). Unset until
      # trimcrae creates the vast-leg-s3 user -> gpu_backend falls back to the broad key above, which
      # is why lanes in flight kept running. Runbook: research/compute/scoped-s3-credential-runbook.md
      VAST_S3_ACCESS_KEY_ID: ${{ secrets.VAST_S3_ACCESS_KEY_ID }}
      VAST_S3_SECRET_ACCESS_KEY: ${{ secrets.VAST_S3_SECRET_ACCESS_KEY }}
      VAST_S3_SCOPED_STS: ${{ vars.VAST_S3_SCOPED_STS }}
      AWS_DEFAULT_REGION: us-east-2
    steps:
      - uses: actions/checkout@v4
        with: { ref: "${{ github.ref_name }}" }
      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }
      - name: Archive and clear the matching failed record(s)
        run: |
          set -eo pipefail
          python -m pip install -q boto3
          SEL="${{ github.event.inputs.leg_only }}"
          test -n "$SEL" || { echo "::error::set leg_only — refusing to clear every failed record at once"; exit 1; }
          python research/modalities/ternary_vast_launch.py --supersede-failed "$SEL"

  # ★★ WHICH LEGS THIS ANALYSES IS A PARAMETER, NOT A CONSTANT (2026-07-30). It used to hardcode
  # `--mode edge` on the `--fetch-trajectories` call, so the $0 pose diagnostic could only ever see RUNG 2b's
  # 4 fs legs — and nr4a3-program-map.md's own instruction is to run it on the CLOSURE TRIANGLE's legs, which are a
  # different mode at a different timestep (`..._dt2.0fs_wu1.0_triangle` vs `..._dt4.0fs_wu1.0_edge`).
  # Dispatched at the triangle, the hardcoded call would have listed a prefix nobody ever wrote, downloaded
  # nothing, and printed a clean summary over zero legs. The task->mode map has one home,
  # `ternary_vast_launch.CONVERGE_TASK_MODES`, and `converge` still means `edge` byte-for-byte so the
  # published 2b comparison stays reproducible. The mode rides on the `task` input rather than an 11th
  # dispatch input because this lane is AT GitHub's cap of 10 and an 11th silently empties them all
  # (tests/test_workflow_dispatch_input_cap.py).
  converge:
    needs: resolve
    if: ${{ needs.resolve.outputs.task == 'converge' || needs.resolve.outputs.task == 'triangle-converge' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      # The credential a RENTED community host is given, forwarded in cleartext by _vast_onstart.
      # Scoped to the lane prefixes + six S3 actions a leg needs (s3_scoped_policy.py). Unset until
      # trimcrae creates the vast-leg-s3 user -> gpu_backend falls back to the broad key above, which
      # is why lanes in flight kept running. Runbook: research/compute/scoped-s3-credential-runbook.md
      VAST_S3_ACCESS_KEY_ID: ${{ secrets.VAST_S3_ACCESS_KEY_ID }}
      VAST_S3_SECRET_ACCESS_KEY: ${{ secrets.VAST_S3_SECRET_ACCESS_KEY }}
      VAST_S3_SCOPED_STS: ${{ vars.VAST_S3_SCOPED_STS }}
      AWS_DEFAULT_REGION: us-east-2
      TVAST_GPU: ${{ github.event.inputs.gpu_class }}
      TVAST_MIN_NS_PER_H: ${{ github.event.inputs.min_ns_per_h }}
      TVAST_ON_DEMAND: ${{ github.event.inputs.on_demand }}
      TVAST_PRUNE_CHK: ${{ vars.TVAST_PRUNE_CHK }}
      VAST_BID_FLOOR_MULT: ${{ github.event.inputs.bid_floor_mult }}
      TVAST_TIMESTEP_FS: ${{ github.event.inputs.timestep_fs }}
      TVAST_WARMUP_TIMESTEP_FS: ${{ github.event.inputs.warmup_timestep_fs }}
      # The `TVAST_*` escape hatch, in the lane's own idiom: it points the diagnostic at ANY mode without
      # spending one of the 10 dispatch-input slots. Unset by default -> the task->mode map decides, so
      # `task=converge` is unchanged. Validated against MODES (an unknown value is an ERROR, never a silent
      # fallback) and announced loudly below, because a sticky repository variable that quietly changed what
      # `task=converge` measures would be the very bug this job was just fixed for.
      TVAST_CONVERGE_MODE: ${{ vars.TVAST_CONVERGE_MODE }}
      TVAST_TASK: ${{ needs.resolve.outputs.task }}
    steps:
      - uses: actions/checkout@v4
        with: { ref: "${{ github.ref_name }}" }
      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }
      - name: Pull the newest committed generation per leg from S3
        run: |
          set -eo pipefail
          python -m pip install -q boto3
          mkdir -p /tmp/tconv
          # DERIVED FROM THE TASK, never typed here. `--converge-mode-for-task` exits non-zero on a task with
          # no registered mode rather than guessing, so a new converge task added to the input options
          # without a map entry fails HERE, loudly, instead of analysing the wrong legs quietly.
          MODE=$(python research/modalities/ternary_vast_launch.py --converge-mode-for-task "$TVAST_TASK")
          echo "MODE=$MODE" >> "$GITHUB_ENV"
          if [ -n "${TVAST_CONVERGE_MODE:-}" ]; then
            echo "::warning title=TVAST CONVERGE MODE OVERRIDDEN::the repository variable TVAST_CONVERGE_MODE=$TVAST_CONVERGE_MODE is in force, so task=$TVAST_TASK is NOT analysing its own legs. Clear the variable to restore the task's own mapping."
          fi
          echo "::notice title=TVAST converge::task=$TVAST_TASK -> mode=$MODE"
          python research/modalities/ternary_vast_launch.py --mode "$MODE" --fetch-trajectories /tmp/tconv 2>&1 | tail -40
          echo "--- what landed ---"
          ls -laR /tmp/tconv | tail -40
      - name: Convergence + contact-moiety pose diagnostics, in the parity image
        run: |
          set -eo pipefail
          echo "${{ secrets.DOCKERHUB_TOKEN }}" | docker login -u triskit23 --password-stdin
          docker run --rm --entrypoint python \
            -v "$PWD/research/modalities:/work/research/modalities" \
            -v /tmp/tconv:/tmp/tconv \
            -e CKPT_DIR=/tmp/tconv -e INPUT_DIR=/tmp/tconv \
            -w /work/research/modalities \
            docker.io/triskit23/ternary-fep:latest \
            /work/research/modalities/ternary_fep_convergence.py 2>&1 | tail -30
          sudo chown -R "$(id -u):$(id -g)" /tmp/tconv 2>/dev/null || true
      - name: Verdict LAST — this cycle's pose behaviour beside the two on record
        run: |
          set +e
          echo "================ POSE / CONVERGENCE SUMMARY — task=$TVAST_TASK mode=$MODE ================"
          cat /tmp/tconv/ternary_convergence_summary.txt
          echo
          # ★ THE BASELINES ARE READ OUT OF THEIR ONE HOME, NOT TYPED HERE (CLAUDE.md rule 1). This step
          # used to carry its own copy of r0's numbers; a copy in a workflow is a number nobody re-checks
          # when the audit is corrected. The audit file is checked out in this job, so print its L.3d table.
          AUD=research/modalities/ternary-lane-guard-audit-2026-07-25.md
          echo "ON RECORD FOR COMPARISON (verbatim from $AUD section L.3d):"
          awk '/\*\*2 fs \(r0/{p=1} p&&/^\|/{print} p&&!/^\|/{exit}' "$AUD" \
            || echo "  (table not found — read section L.3d by hand; do NOT substitute a remembered number)"
          echo
          if [ "$MODE" = "triangle" ]; then
            echo "READ IT AS (closure triangle): the triangle's TWO BINARY legs are the same unrestrained"
            echo "construction that departs in both cycles above, so the pre-registered prediction is that they"
            echo "depart here too. Departure PRESENT -> the non-zero R_binary is attributable to it. Departure"
            echo "ABSENT -> R_binary is ordinary path error and the restrained re-run's rationale weakens."
            echo "R_binary itself is NOT reprinted here -- one home, valb-triangle-reduction.json:"
            python -c "import json;d=json.load(open('research/modalities/valb-triangle-reduction.json'));print('  R_binary=%s  R_ternary=%s  R=%s  decision=%s'%(d['R_binary_kcal'],d['R_ternary_kcal'],d['R_kcal'],d['decision']))"
            echo "The classification rule is valb_triangle_closure.binary_departure_prereg() and it, not this"
            echo "echo, is what decides. Both ternary legs are expected clean in both cases."
          else
            echo "READ IT AS: binary here ALSO displaced -> the |dDDG| = 0.0215 agreement is a timestep result on a"
            echo "shared broken arm. Binary here STABLE -> the departure barely moves dG_binary and the r0 claim"
            echo "needs softening. Either way the number to compare is the binary leg's contact_pose line."
          fi

  stop:
    needs: resolve
    if: ${{ needs.resolve.outputs.task == 'stop' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      VAST_API_KEY: ${{ secrets.VAST_API_KEY }}
    steps:
      - uses: actions/checkout@v4
        with: { ref: "${{ github.ref_name }}" }
      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }
      - name: Destroy every tvast-* instance (anti-idle backstop)
        run: python research/modalities/ternary_vast_launch.py --stop
