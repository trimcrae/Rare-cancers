name: Ternary cooperativity FEP — Vast lane (RUNG 2b, 4 fs)

# The ternary lane on VAST, per trimcrae's 2026-07-25 directive that all production GPU runs go on Vast.
# Before this, the ternary FEP could only run on GCP L4 (1-GPU quota, another session's lane) or on a
# script-shaped Vast path with no checkpoint/resume, no cache and no reap. Engine: research/modalities/
# ternary_vast_launch.py; recipe: run_ternary_leg.sh (single source of truth — never re-implemented here).
#
# IMAGE: docker.io/triskit23/ternary-fep (research/compute/Dockerfile.ternaryfep). PULL, DO NOT SOLVE — the
# image's mamba spec is byte-for-byte the one the GCP ternary lane builds on the fly, so it is the *correct*
# environment, not merely the fast one: analysing an OpenFE trajectory with a different pymbar/openmmtools
# than PRODUCED it can move the MBAR numbers.
#
# THE LADDER (cheapest-decisive-first; nothing auto-fires):
#   test    -> $0.    Pure-logic unit tests for the launcher. Runs on every push to the lane's files.
#   dry-run -> $0.    Print the exact JobSpec that WOULD be rented (env, image, caps). No rental.
#   prime   -> $0.    Stage every EDGE leg on a free CPU runner and upload the stage caches to S3, so the
#                     rented hosts get cache hits. Two wins, both real: it removes ~8-15 min of GPU-idle
#                     staging from EACH paid host, and it discovers a first-time staging failure for the
#                     binary and solvent legs at $0 instead of on a 4090.
#   smoke   -> ~$0.15 One instance, 8 warmup + 12 production iterations: proves image + repo pull + stage +
#                     pre-equil + setup + commit store + upload end to end before a real leg is paid for.
#   probe   -> ~$1-2  RUNG 2b STAGE 1. 48 warmup @1 fs -> 200 production @4 fs. The survival question:
#                     does 4 fs hold well past the 40 iterations the runbook demonstrated? A NO here costs
#                     ~$1-2 instead of a full edge.
#   edge    -> ~$4-6  RUNG 2b STAGE 2, only on a passing probe. The full matched re-calibration edge:
#                     ternary + binary + solvent at full science length, fanned out 3-wide.
#   collect -> $0.    Status board + PROGRESS check (committed iteration, not liveness) + anti-idle reap.
#   reduce  -> $0.    Pull the edge's leg JSONs, cross-check ddG_coop = ternary - binary by hand, and run
#                     the official reducer INSIDE the parity image that produced the trajectories.
#   stop    -> $0.    Destroy every tvast-* instance.
#
# DISPATCHING BEFORE THIS FILE IS ON main. A brand-new `workflow_dispatch` workflow 404s until it reaches
# the default branch, but a `push` trigger runs from the pushed branch with no such dependency. So the task
# can also be given in the COMMIT MESSAGE as a `[tvast:<task>]` marker, which is how this lane was
# bootstrapped and validated on a feature branch. Once the file is on main, use workflow_dispatch.

on:
  push:
    branches:
      - main
      - claude/max-effort-2dq11l-4fs
    paths:
      - research/modalities/ternary_vast_launch.py
      - research/modalities/ternary_vast_watchdog.py
      - research/modalities/run_ternary_leg.sh
      - research/modalities/tests/test_ternary_vast_launch.py
      - .github/workflows/gpu-ternary-fep-vast.yml
      # The poke file exists ONLY to trigger this workflow from a feature branch, where
      # workflow_dispatch is not yet available. See research/modalities/ternary-vast-poke.txt.
      - research/modalities/ternary-vast-poke.txt
  workflow_dispatch:
    inputs:
      task:
        description: "test | dry-run | prime | smoke | probe | edge | collect | reduce | converge (CPU/$0 - pull the newest committed .nc per leg from S3 and run the convergence + contact-moiety pose diagnostics in the parity image) | stop"
        type: choice
        options: [test, dry-run, prime, smoke, probe, edge, collect, reduce, converge, stop]
        default: test
      timestep_fs:
        description: "production MD timestep in fs (blank = 4.0, the thing RUNG 2b is testing)"
        type: string
        default: ""
      warmup_timestep_fs:
        description: "warmup/equilibration timestep in fs (blank = 1.0). Equilibration is DISCARDED, so this never enters dG."
        type: string
        default: ""
      vast_image:
        description: "override the image (blank = docker.io/triskit23/ternary-fep:latest)"
        type: string
        default: ""

permissions:
  contents: write

# NB there is deliberately NO workflow-level `concurrency` here. Serialising the whole workflow also
# serialises `collect`, and monitoring that has to queue behind a 25-minute `prime` is monitoring you cannot
# do during exactly the window when a rented GPU is running unproven code. The group is applied to the
# MUTATING jobs only (launch, prime), which is where a concurrent run actually causes harm: two submits can
# put two instances on one unit, writing the same S3 keys, doing the same work, billing twice.

jobs:
  resolve:
    runs-on: ubuntu-latest
    outputs:
      task: ${{ steps.pick.outputs.task }}
    steps:
      - id: pick
        env:
          DISPATCH_TASK: ${{ github.event.inputs.task }}
          MSG: ${{ github.event.head_commit.message }}
        run: |
          set -eo pipefail
          # Precedence: explicit dispatch input > a [tvast:<task>] marker in the pushed commit message >
          # `test` (free). The default is deliberately the $0 one: a push must never be able to rent a GPU
          # by accident, which is the spend-gated ladder's first rule.
          TASK="${DISPATCH_TASK:-}"
          if [ -z "$TASK" ]; then
            # `|| true` IS LOAD-BEARING. grep exits 1 when it matches nothing, and under `set -eo pipefail`
            # (plus the runner's own `bash -e`) that failure propagates out of the command substitution and
            # kills the step — so the "no marker -> fall back to the free `test`" branch could never be
            # reached, and EVERY marker-less push to this lane's files went red. Observed on run
            # 30169660474, whose only fault was a commit message without a [tvast:...] marker. A fallback
            # that cannot execute is not a fallback.
            TASK=$(printf '%s' "$MSG" | grep -oE '\[tvast:[a-z-]+\]' | head -1 | sed 's/\[tvast://; s/\]//' || true)
          fi
          # THIS ALLOWLIST MUST BE KEPT IN SYNC WITH THE `task` INPUT'S OPTIONS. It is a silent downgrade, not an
          # error: an unlisted task falls back to `test`, which passes, prints a warning nobody reads, and does
          # none of the work that was asked for. Adding `converge` to the input's options without adding it here
          # would have produced a green run that analysed nothing — the exact "reports success while measuring
          # nothing" shape this lane's audit is about. Gated by
          # tests/test_workflows_parse.py::test_vast_task_allowlist_matches_the_input_options.
          case "${TASK:-test}" in
            test|dry-run|prime|smoke|probe|edge|collect|reduce|converge|stop) TASK="${TASK:-test}" ;;
            *) echo "::warning::unrecognised task '${TASK}' -> falling back to the free 'test'"; TASK=test ;;
          esac
          echo "task=$TASK" >> "$GITHUB_OUTPUT"
          echo "::notice title=TVAST task::$TASK"

  # ------------------------------------------------------------------ free: pure logic
  test:
    needs: resolve
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with: { ref: "${{ github.ref_name }}" }
      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }
      - name: Unit tests (identity round-trip, prefix keying, cost arithmetic)
        run: |
          set -eo pipefail
          python -m pip install -q pytest
          python -m pytest research/modalities/tests/test_ternary_vast_launch.py \
                           research/modalities/tests/test_ternary_vast_watchdog.py -q

  dry-run:
    needs: [resolve, test]
    if: ${{ needs.resolve.outputs.task == 'dry-run' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with: { ref: "${{ github.ref_name }}" }
      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }
      - name: Print the JobSpec that would be rented
        env:
          GIT_BRANCH: ${{ github.ref_name }}
          TVAST_TIMESTEP_FS: ${{ github.event.inputs.timestep_fs }}
          TVAST_WARMUP_TIMESTEP_FS: ${{ github.event.inputs.warmup_timestep_fs }}
        run: |
          set -eo pipefail
          python research/modalities/ternary_vast_launch.py --mode probe --dry-run
          python research/modalities/ternary_vast_launch.py --mode edge --dry-run | head -5

  # ------------------------------------------------------------------ free: pre-stage on CPU
  prime:
    needs: [resolve, test]
    if: ${{ needs.resolve.outputs.task == 'prime' }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    concurrency:
      group: ternary-vast-mutate
      cancel-in-progress: false
    env:
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      AWS_DEFAULT_REGION: us-east-2
    steps:
      - uses: actions/checkout@v4
        with: { ref: "${{ github.ref_name }}" }
      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }
      - name: Stage every edge leg on CPU and upload the caches
        # PULL, DO NOT SOLVE: the same parity image the GPU hosts run, so the staged tree is byte-identical
        # to what a host would have built. Staging touches no GPU -- it is an RCSB fetch, a SMARCA4->SMARCA2
        # homology model and an assembly -- so paying a 4090 to do it is the exact anti-pattern the GCP
        # lane's CPU pre-bake exists to kill. CI runners have unrestricted internet, which the dev sandbox
        # does not.
        run: |
          set -eo pipefail
          python -m pip install -q boto3
          echo "${{ secrets.DOCKERHUB_TOKEN }}" | docker login -u triskit23 --password-stdin
          B="${VAST_CKPT_BUCKET:-sagemaker-us-east-2-646605541856}"
          mkdir -p /tmp/tin
          for LEG in calib_hi_to_lo__ternary_vhl calib_hi_to_lo__binary_vhl calib_hi_to_lo__solvent; do
            KEY="s3://$B/ternary-vast/stagecache/${LEG}__8G1Q__seed0__v1.tar"
            if aws s3 ls "$KEY" >/dev/null 2>&1; then echo "[prime] HIT  $LEG"; continue; fi
            echo "[prime] MISS $LEG -- staging on CPU"
            docker run --rm --entrypoint python \
              -v "$PWD/research/modalities:/work/research/modalities" -v /tmp/tin:/tmp/tin \
              -e SEED=0 -e SSL_CERT_FILE=/etc/ssl/certs/ca-certificates.crt \
              -w /work/research/modalities \
              docker.io/triskit23/ternary-fep:latest \
              /work/research/modalities/ternary_pdb_stage.py \
                --leg-id "$LEG" --template-pdb 8G1Q --out /tmp/tin 2>&1 | tail -20
            ls -la "/tmp/tin/$LEG"
            tar -C /tmp/tin -cf "/tmp/${LEG}.tar" "$LEG"
            aws s3 cp "/tmp/${LEG}.tar" "$KEY"
            echo "[prime] uploaded $KEY ($(du -h /tmp/${LEG}.tar | cut -f1))"
          done
          echo "[prime] done -- every edge host will now restore its stage tree in seconds"

  # ------------------------------------------------------------------ paid: rent hosts
  launch:
    needs: [resolve, test]
    if: ${{ needs.resolve.outputs.task == 'smoke' || needs.resolve.outputs.task == 'probe' || needs.resolve.outputs.task == 'edge' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    concurrency:
      group: ternary-vast-mutate
      cancel-in-progress: false
    env:
      VAST_API_KEY: ${{ secrets.VAST_API_KEY }}
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      AWS_DEFAULT_REGION: us-east-2
      GIT_BRANCH: ${{ github.ref_name }}
      TVAST_IMAGE: ${{ github.event.inputs.vast_image }}
      TVAST_TIMESTEP_FS: ${{ github.event.inputs.timestep_fs }}
      TVAST_WARMUP_TIMESTEP_FS: ${{ github.event.inputs.warmup_timestep_fs }}
    steps:
      - uses: actions/checkout@v4
        # fetch-depth 0 because the arm step below commits and pushes the watch list, and a shallow clone
        # cannot rebase onto a branch another job (or the agent) has moved in the meantime.
        with: { ref: "${{ github.ref_name }}", fetch-depth: 0 }
      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }
      - name: Rent one host per unit
        run: |
          set -eo pipefail
          # boto3 is REQUIRED, not optional: the launcher lists S3 to skip units that are already done
          # BEFORE renting anything. Without it the skip list is empty and every unit is rented again.
          python -m pip install -q boto3
          python research/modalities/ternary_vast_launch.py --mode "${{ needs.resolve.outputs.task }}"
          echo "::notice title=TVAST launched::task=${{ needs.resolve.outputs.task }} — poll with task=collect."
      - name: Arm the session-independent watchdog for this task
        # The watch list is the ONLY input the cron watchdog reads, so a launch that does not register its
        # units is a launch nobody is watching. Committed to the branch so it survives this runner.
        run: |
          set -eo pipefail
          python research/modalities/ternary_vast_watchdog.py --arm "${{ needs.resolve.outputs.task }}"
          git config user.name "Claude"; git config user.email "noreply@anthropic.com"
          git add research/modalities/ternary-vast-watch.json
          if ! git diff --cached --quiet -- research/modalities/ternary-vast-watch.json; then
            git commit -m "tvast: arm the watchdog for ${{ needs.resolve.outputs.task }}"
            git pull --rebase --autostash origin "${{ github.ref_name }}" || true
            git push origin HEAD:"${{ github.ref_name }}"
          else
            echo "watch list already current"
          fi
          # READ BACK WHAT WAS WRITTEN. arm() succeeding is not the same as the watch list covering this
          # launch: the file can be changed afterwards by something that has no idea a leg is running, and
          # on 2026-07-25 exactly that happened — a later edit rewrote "watch" to [] and pushed, so the
          # watchdog's only input said there was nothing to watch while a billed GPU leg ran. The config
          # guard cannot catch it (an empty list is a legitimate state), so only a check that knows which
          # units were just launched can. Failing here is correct: a leg billing with nothing watching it
          # is worse than a red build.
          python research/modalities/ternary_vast_watchdog.py --verify-armed "${{ needs.resolve.outputs.task }}"

  # ------------------------------------------------------------------ free: monitor + reap
  collect:
    needs: resolve
    if: ${{ needs.resolve.outputs.task == 'collect' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      VAST_API_KEY: ${{ secrets.VAST_API_KEY }}
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      AWS_DEFAULT_REGION: us-east-2
    steps:
      - uses: actions/checkout@v4
        with: { ref: "${{ github.ref_name }}" }
      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }
      - name: Status board + progress check + anti-idle reap
        run: |
          set -eo pipefail
          python -m pip install -q boto3
          python research/modalities/ternary_vast_launch.py --collect 2>&1 | tee /tmp/board.txt
      - name: Summary LAST
        # A CI log is read from its TAIL, so whatever a monitor needs must be the last thing printed.
        run: |
          set -eo pipefail
          echo "================ TVAST BOARD ================"
          cat /tmp/board.txt

  reduce:
    needs: resolve
    if: ${{ needs.resolve.outputs.task == 'reduce' }}
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      AWS_DEFAULT_REGION: us-east-2
      TVAST_TIMESTEP_FS: ${{ github.event.inputs.timestep_fs }}
      TVAST_WARMUP_TIMESTEP_FS: ${{ github.event.inputs.warmup_timestep_fs }}
    steps:
      - uses: actions/checkout@v4
        with: { ref: "${{ github.ref_name }}" }
      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }
      - name: Pull the edge's leg JSONs and cross-check the identity
        run: |
          set -eo pipefail
          python -m pip install -q boto3
          mkdir -p /tmp/tred
          python research/modalities/ternary_vast_launch.py --mode edge --fetch-legs /tmp/tred \
            2>&1 | tee /tmp/identity.txt
      - name: Official reduction, in the SAME env that produced the trajectories
        # PULL, DO NOT SOLVE. The image carries the exact openfe/openmmtools/pymbar the legs were run with,
        # and analysing an OpenFE trajectory with a different pymbar/openmmtools than PRODUCED it can move
        # the MBAR numbers — so this is the correct environment, not merely the fast one. The repo is mounted
        # over the image's baked copy so the reducer that runs is the branch's, not the build-time one.
        run: |
          set -eo pipefail
          echo "${{ secrets.DOCKERHUB_TOKEN }}" | docker login -u triskit23 --password-stdin
          docker run --rm --entrypoint python \
            -v "$PWD/research/modalities:/work/research/modalities" \
            -v /tmp/tred:/tmp/tred \
            -e CKPT_DIR=/tmp/tred -e INPUT_DIR=/tmp/tred -e MODE=reduce \
            -w /work/research/modalities \
            docker.io/triskit23/ternary-fep:latest \
            /work/research/modalities/nr4a3_ternary_fep.py 2>&1 | tail -60
          ls -la /tmp/tred
      # ⚠ SYSTEM IDENTITY, NOT JUST PROTOCOL IDENTITY. `protocol_hash` covers the OpenFE SETTINGS and says
      # nothing about the SYSTEM, and ΔΔG_coop is a DIFFERENCE of legs — so three legs can share one hash and
      # still describe different solvated systems. That is not hypothetical here: on 2026-07-25 four reverse-leg
      # attempts ran a 146,020-particle `v1` build against a 141,968-particle `v2pe` forward leg, and no check
      # in the repo reported it. The reducer computes `system_identity_consistency` over n_particles /
      # charge_method / setup_cache_version, with unrecorded fields reported as UNKNOWN rather than folded in as
      # agreement — but nothing printed it, so the gate was being read off the hash alone.
      - name: System identity across the cycle (the check protocol_hash cannot make)
        run: |
          set -eo pipefail
          python3 - <<'PY'
          import json
          d = json.load(open("/tmp/tred/ternary_coop_reduction.json"))
          si = d.get("system_identity_consistency")
          print("================ SYSTEM IDENTITY ================")
          print(json.dumps(si, indent=1) if si else "(absent from the reduction — reducer version mismatch?)")
          for k in ("valB_calibration_gate", "valB_calibration_decision"):
              if k in d:
                  print(f"--- {k} ---"); print(json.dumps(d[k], indent=1))
          PY

      - name: Verdict LAST
        run: |
          set -eo pipefail
          echo "================ TVAST 4 fs IDENTITY ================"
          cat /tmp/identity.txt
          echo "reference: the 2 fs r0 cycle gave ddG_coop = -0.534 kcal/mol"
          echo "  (legs binary 48.0046 / ternary 47.4701 / solvent 47.8060 — valB-mini-r0-verdict-2026-07-25.md)"

  # ------------------------------------------------------------------ free: CPU-only trajectory diagnostics
  # WHY THIS TASK EXISTS. `reduce` fetches the leg JSONs — one ΔG each — and computes ΔΔG_coop. That is the
  # NUMBER, and it says nothing about whether the trajectory behind it sampled the intended state. The 2 fs r0
  # cycle's BINARY leg has a confirmed pose failure (its receptor-contacting moiety leaves and does not return in
  # 8 of 12 replicas, while the ternary leg in the same cycle is 12/12 stable — audit §L.3–L.3c), and RUNG 2b's
  # 4 fs cycle agrees with r0 to |Δ| = 0.0215 kcal/mol. Two readings of that agreement:
  #
  #   2b's binary leg SHARES the departure  -> the agreement is a real timestep reproduction on a shared-broken-arm
  #                                            basis; the 2b PASS stands as a verdict about 4 fs, and neither
  #                                            absolute ΔΔG_coop is a valid cooperativity.
  #   2b's binary leg HOLDS its pose        -> a contaminated arm and a clean one agree to 0.02 kcal/mol, and the
  #                                            claim that the departure invalidates ΔG_binary needs substantial
  #                                            softening.
  #
  # The second would be evidence AGAINST the r0 finding, which is exactly why it has to be looked at rather than
  # assumed. $0: free runner, no GPU, no Vast instance — it reads S3 and analyses on CPU.
  #
  # PARITY, not just speed: the analysis runs in the SAME image that produced the trajectories, because analysing
  # an OpenFE trajectory with a different pymbar/openmmtools than PRODUCED it can move the MBAR numbers. The repo
  # is mounted over the image's baked copy so the analyser that runs is the branch's.
  converge:
    needs: resolve
    if: ${{ needs.resolve.outputs.task == 'converge' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      AWS_DEFAULT_REGION: us-east-2
      TVAST_TIMESTEP_FS: ${{ github.event.inputs.timestep_fs }}
      TVAST_WARMUP_TIMESTEP_FS: ${{ github.event.inputs.warmup_timestep_fs }}
    steps:
      - uses: actions/checkout@v4
        with: { ref: "${{ github.ref_name }}" }
      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }
      - name: Pull the newest committed generation per leg from S3
        run: |
          set -eo pipefail
          python -m pip install -q boto3
          mkdir -p /tmp/tconv
          python research/modalities/ternary_vast_launch.py --mode edge --fetch-trajectories /tmp/tconv 2>&1 | tail -40
          echo "--- what landed ---"
          ls -laR /tmp/tconv | tail -40
      - name: Convergence + contact-moiety pose diagnostics, in the parity image
        run: |
          set -eo pipefail
          echo "${{ secrets.DOCKERHUB_TOKEN }}" | docker login -u triskit23 --password-stdin
          docker run --rm --entrypoint python \
            -v "$PWD/research/modalities:/work/research/modalities" \
            -v /tmp/tconv:/tmp/tconv \
            -e CKPT_DIR=/tmp/tconv -e INPUT_DIR=/tmp/tconv \
            -w /work/research/modalities \
            docker.io/triskit23/ternary-fep:latest \
            /work/research/modalities/ternary_fep_convergence.py 2>&1 | tail -30
          sudo chown -R "$(id -u):$(id -g)" /tmp/tconv 2>/dev/null || true
      - name: Verdict LAST — the 4 fs cycle's pose behaviour beside r0's
        run: |
          set +e
          echo "================ 4 fs CYCLE POSE / CONVERGENCE SUMMARY ================"
          cat /tmp/tconv/ternary_convergence_summary.txt
          echo
          echo "r0 (2 fs) for comparison — binary_vhl: contact_pose max 16.327 / med 4.333 A, 8 of 12 replicas"
          echo "ending beyond 4.0 A, classes DISPLACED_AND_STAYED 5 / INTERMEDIATE 3 / STABLE 4; ternary_vhl"
          echo "12/12 STABLE. See research/modalities/ternary-lane-guard-audit-2026-07-25.md sections L.3-L.3c."
          echo
          echo "READ IT AS: binary here ALSO displaced -> the |dDDG| = 0.0215 agreement is a timestep result on a"
          echo "shared broken arm. Binary here STABLE -> the departure barely moves dG_binary and the r0 claim"
          echo "needs softening. Either way the number to compare is the binary leg's contact_pose line."

  stop:
    needs: resolve
    if: ${{ needs.resolve.outputs.task == 'stop' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      VAST_API_KEY: ${{ secrets.VAST_API_KEY }}
    steps:
      - uses: actions/checkout@v4
        with: { ref: "${{ github.ref_name }}" }
      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }
      - name: Destroy every tvast-* instance (anti-idle backstop)
        run: python research/modalities/ternary_vast_launch.py --stop
