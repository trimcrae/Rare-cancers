name: RUNG 5b-T — rebuild the NR4A1/2/3 ternaries by the ASSEMBLY route ($0 CPU, no GPU, no rental)

# ═══════════════════════════════════════════════════════════════════════════════════════════════════════
# WHAT THIS RUNG IS, AND WHY IT NEEDS NO AUTHORIZATION
# ═══════════════════════════════════════════════════════════════════════════════════════════════════════
# The roadmap's top open row (§10.1 row 1). Its derived cost is $0 — it buys 0.0 reference GPU-hours
# (ternary-rebuild-cost.json, regenerated by ternary_rebuild_cost.py --check) — because the whole chain is
# CPU: the generator is patched cuda->cpu, `V1` is pure Python, and the construct check is RDKit. ⛔ NO GPU,
# NO RENTAL, NOTHING TO APPROVE.
#
# FIVE ARMS, AND THE ORDER IS THE POINT
#   1. 6HAX_B_A_FWZ  — VHL/SMARCA2 harness positive control, DeepTernary's OWN shipped benchmark inputs.
#   2. 6BN7*         — CRBN harness positive control. ⛔ A VHL-ONLY CONTROL DOES NOT COVER THIS RUNG,
#                      whose E3 is CRBN. Both are inside the model's 2023-10-14 data horizon, so they
#                      control the HARNESS AND THE INSTRUMENTS and NEVER generalisation.
#   3-5. NR4A3 / NR4A1 / NR4A2 — assembled by nr4a3_5bt_assemble.py from the RECORDED degrader SMILES.
#
# ⛔ THERE IS NO NATIVE NR4A3 TERNARY. DeepTernary's published unbound protocol superposes both binaries
# into the NATIVE ternary frame; for these arms that reference does not exist, so the RUNG-5a orientation
# basin `crbn|M0` supplies the arrangement instead and every result is conditional on it. That is the real
# technical constraint of this rung, and the PRE-FLIGHT SNAP-MASK ASSERTION is what stops the empty-mask
# crash that killed runs 30753431082 and 30754028742.
#
# ⛔ REFUSALS, NOT RESULTS. An empty snap mask or an infeasible embed is a REFUSAL, never a zero. A failed
# harness positive control makes the WHOLE RUN UNINTERPRETABLE and the gate says so instead of reading the
# arms — enforced by the final job, which goes red on it.

on:
  workflow_dispatch:
    inputs:
      n_confs:
        description: "conformers per arm for the two-end restrained embed"
        default: "200"
      e3_binary:
        description: "pin the DDB1-CRBN binary IMiD deposit (blank = discover from the registry's own list)"
        default: ""
  push:
    branches: [claude/nr4a1-protac-positive-control-xnszjl]
    paths:
      - .github/workflows/rung-5bt-ternary-rebuild.yml
      - research/modalities/nr4a3_5bt_assemble.py
      - research/modalities/nr4a3_5bt_gate.py
      - research/modalities/tests/test_nr4a3_5bt.py

permissions:
  contents: write

concurrency:
  group: rung-5bt-ternary-rebuild
  cancel-in-progress: false

env:
  # The SAME frozen commit the harness positive control already passed on. Changing it would make this rung's
  # numbers incomparable with `selcal-deepternary-poscontrol.json`.
  DT_COMMIT: "827821dccca31a5918bd0355e2d6bf70c072b6dd"

jobs:
  # ═════════════════════════════════════════════════════════════════════════════════════════════════════
  # 1 · GUARDS + ASSEMBLY. Nothing is predicted until the pre-flight passes on all three paralogue arms.
  # ═════════════════════════════════════════════════════════════════════════════════════════════════════
  assemble:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    outputs:
      ready: ${{ steps.build.outputs.ready }}
    steps:
      - uses: actions/checkout@v4
        with: { ref: "${{ github.ref_name }}" }
      - uses: actions/setup-python@v5
        with: { python-version: "3.10" }

      - name: Deps
        run: |
          set -eo pipefail
          python -m pip install -q "numpy<2" rdkit pytest

      - name: The rung's own guards hold before anything runs
        run: python3 -m pytest research/modalities/tests/test_nr4a3_5bt.py -q

      - name: Pre-flight over the COMMITTED inputs only (no network, no smina, no model)
        run: |
          set -eo pipefail
          python3 research/modalities/nr4a3_5bt_assemble.py --mode plan \
            --out research/modalities/nr4a3-5bt-frame-plan.json
          python3 -c "
          import json; d=json.load(open('research/modalities/nr4a3-5bt-frame-plan.json'))
          print(json.dumps({k:v for k,v in d.items() if k not in ('boxes',)}, indent=1)[:2500])"

      # ── the docked warhead sub-pose. $0 CPU; smina is the pipeline's own tool at its own settings.
      - name: Install smina
        run: |
          set -eo pipefail
          cd "$RUNNER_TEMP"
          curl -sSL https://micro.mamba.pm/api/micromamba/linux-64/latest | tar -xvj bin/micromamba
          ./bin/micromamba create -y -p "$RUNNER_TEMP/denv" -c conda-forge -c bioconda smina >/dev/null
          echo "$RUNNER_TEMP/denv/bin" >> "$GITHUB_PATH"
      - name: smina is really here
        run: smina --version 2>&1 | head -2

      - name: Dock the warhead into each matched opened pocket
        run: |
          set -eo pipefail
          python3 research/modalities/nr4a3_5bt_assemble.py --mode dock-inputs \
            --workdir /tmp/nr4a3_5bt --out /tmp/nr4a3_5bt/dock-inputs.json
          python3 - <<'PY'
          import json, os, subprocess, sys
          d = json.load(open('/tmp/nr4a3_5bt/dock-inputs.json'))
          for p, rec in d['receptors'].items():
              box = d['boxes'][p]
              out = '/tmp/nr4a3_5bt/docked_%s_warhead.sdf' % p.lower()
              cmd = ['smina', '-r', rec['prepared'], '-l', d['warhead']['sdf'], '-o', out,
                     '--center_x', str(box['center'][0]), '--center_y', str(box['center'][1]),
                     '--center_z', str(box['center'][2]),
                     '--size_x', str(box['size'][0]), '--size_y', str(box['size'][1]),
                     '--size_z', str(box['size'][2]),
                     '--exhaustiveness', '8', '--num_modes', '9', '--seed', '20260803']
              print('[dock]', p, ' '.join(cmd[:6]), flush=True)
              r = subprocess.run(cmd, capture_output=True, text=True)
              print(r.stdout[-1500:], r.stderr[-800:], flush=True)
              if not os.path.exists(out) or os.path.getsize(out) == 0:
                  print('::error::smina produced no pose for %s — REFUSED, not a zero' % p)
                  sys.exit(4)
          PY

      - name: Assemble the three paralogue arms + run the PRE-FLIGHT SNAP-MASK ASSERTION
        id: build
        run: |
          set -eo pipefail
          mkdir -p /tmp/nr4a3_5bt/protac22
          python3 research/modalities/nr4a3_5bt_assemble.py --mode build \
            --workdir /tmp/nr4a3_5bt \
            --base /tmp/nr4a3_5bt/protac22 \
            --docked-dir /tmp/nr4a3_5bt \
            --n-confs "${{ github.event.inputs.n_confs || '200' }}" \
            ${{ github.event.inputs.e3_binary && format('--e3-binary {0}', github.event.inputs.e3_binary) || '' }} \
            --out research/modalities/nr4a3-5bt-frame.json
          python3 -c "
          import json,os
          d=json.load(open('research/modalities/nr4a3-5bt-frame.json'))
          open(os.environ['GITHUB_OUTPUT'],'a').write('ready=%s\n' % ','.join(d.get('ready_arms') or []))
          print(d['sentence'])"

      - uses: actions/upload-artifact@v4
        if: ${{ always() }}
        with:
          name: dt-inputs
          path: /tmp/nr4a3_5bt/protac22
          if-no-files-found: warn

      - name: Publish the frame artifact
        if: ${{ always() }}
        env:
          PUBLISH_IF_CHANGED: "1"
        run: |
          set -eo pipefail
          bash research/compute/publish_artifacts.sh "${{ github.ref_name }}" \
            "RUNG 5b-T: assembled paralogue ternary inputs + the snap-mask pre-flight (CI, \$0)" \
            research/modalities/nr4a3-5bt-frame.json \
            research/modalities/nr4a3-5bt-frame-plan.json

  # ═════════════════════════════════════════════════════════════════════════════════════════════════════
  # 2 · PREDICT. One job per arm — the litmus test in CLAUDE.md §6 says fan out when no single result could
  #     cancel the rest, and none could: the harness controls and the three paralogue arms are all needed.
  # ═════════════════════════════════════════════════════════════════════════════════════════════════════
  predict:
    needs: assemble
    if: ${{ always() && needs.assemble.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 330
    strategy:
      fail-fast: false
      matrix:
        arm: [harness-vhl, harness-crbn, NR4A3, NR4A1, NR4A2]
    steps:
      - uses: actions/checkout@v4
        with: { ref: "${{ github.ref_name }}" }
      - uses: actions/setup-python@v5
        with: { python-version: "3.10" }

      - uses: actions/download-artifact@v4
        with: { name: dt-inputs, path: /tmp/dt_inputs }

      # ⚠ THE PATCH BLOCK BELOW IS THE ONE THE HARNESS POSITIVE CONTROL ALREADY PASSED WITH, kept
      # byte-for-byte. Changing the environment would make this rung's numbers incomparable with
      # `selcal-deepternary-poscontrol.json`, which is the only thing that says the plumbing works.
      - name: Clone DeepTernary at the frozen commit + CPU deps
        run: |
          set -eo pipefail
          cd "$RUNNER_TEMP"
          git clone -q https://github.com/youqingxiaozhua/DeepTernary.git dt
          cd dt && git checkout -q "$DT_COMMIT"
          echo "=== PROVENANCE ==="; git rev-parse HEAD
          grep -viE 'cu121|^torch==|^dgl==|--extra-index-url|--find-links' requirements.txt > requirements-cpu.txt
          pip install -q torch==2.3.1 --index-url https://download.pytorch.org/whl/cpu
          pip install -q dgl==2.3.0 -f https://data.dgl.ai/wheels/torch-2.3/repo.html
          pip install -q -r requirements-cpu.txt
          pip install -q "numpy<2" DockQ
          wget -q https://github.com/youqingxiaozhua/DeepTernary/releases/download/v1.0.0/output.zip
          unzip -q output.zip
          #  (a) device: the script hardcodes 'cuda'; this runner has no GPU.
          #  (b) SEED_NUM 40 -> 16: CPU budget. Reported as best-of-16, never as best-of-40.
          #  (c) the predictions are otherwise DELETED — `cfg.tmp_dir` is a TemporaryDirectory whose cleanup
          #      is the last line of the script. `int` is a builtin, pickles by reference to the five pool
          #      workers, and `int()` is 0, so it is a no-op cleanup that survives the fork (a `lambda` does
          #      not: run 30755062993 died with `Can't pickle <function <lambda>>`).
          sed -i "s/^    device = 'cuda'/    device = 'cpu'/" predict_cpu.py
          sed -i 's/SEED_NUM = 40/SEED_NUM = 16/g' predict_cpu.py
          sed -i "s|cfg.tmp_dir = tempfile.TemporaryDirectory()|import types as _t; os.makedirs('predictions', exist_ok=True); cfg.tmp_dir = _t.SimpleNamespace(name='predictions', cleanup=int)|" predict_cpu.py
          #  (d) `predict_cpu.py` imports `DockQ.dockq_util`, WHICH EXISTS IN NO PUBLISHED DockQ — run
          #      30755252274 died there INSIDE the per-seed loop, after the complex had been written, because
          #      the import sits OUTSIDE the `try:` meant to tolerate a scoring failure.
          #      ⛔ THE SENTINEL IS `nan`, NOT 0: a table of `0.0000` would read as "scored zero" when the
          #      truth is "not measured".
          python3 - <<'PYPATCH'
          import io
          src = io.open("predict_cpu.py", newline="").read()
          old = "        from DockQ.dockq_util import cal_dockq"
          new = ("        try:\n"
                 "            from DockQ.dockq_util import cal_dockq\n"
                 "        except Exception:\n"
                 "            def cal_dockq(*a, **k):\n"
                 "                print('[internal-dockq-unavailable] not measured -> nan')\n"
                 "                return float('nan'), float('nan'), float('nan'), float('nan')")
          out, n = [], 0
          for line in src.split("\n"):
              if line.rstrip("\r") == old:
                  cr = "\r" if line.endswith("\r") else ""
                  out.extend(l + cr for l in new.split("\n")); n += 1
              else:
                  out.append(line)
          assert n >= 1, "the DockQ import line was not found — predict_cpu.py has changed"
          io.open("predict_cpu.py", "w", newline="").write("\n".join(out))
          print("guarded %d DockQ import site(s)" % n)
          PYPATCH
          python3 - <<'PYCHK'
          import ast, pickle, re, types
          src = open("predict_cpu.py").read()
          assert "cleanup=int" in src and "cleanup=lambda" not in src, "tmp_dir patch wrong"
          assert re.search(r"^    device = 'cpu'", src, re.M), "device patch did not apply"
          assert "SEED_NUM = 16" in src, "seed patch did not apply"
          assert "internal-dockq-unavailable" in src, "the DockQ guard did not apply"
          ast.parse(src)
          pickle.loads(pickle.dumps(types.SimpleNamespace(name="predictions", cleanup=int)))
          print("patches applied, file parses, replacement tmp_dir pickles")
          PYCHK

      - name: Resolve this arm's case name
        id: case
        run: |
          set -eo pipefail
          cd "$RUNNER_TEMP/dt"
          case "${{ matrix.arm }}" in
            harness-vhl)  NAME=6HAX_B_A_FWZ ;;
            harness-crbn) NAME=$(ls -1 output/protac22 | grep -i '^6BN7' | head -1) ;;
            *)            NAME="${{ matrix.arm }}_5BT_LIG" ;;
          esac
          if [ -z "$NAME" ]; then
            echo "::error::no benchmark directory for ${{ matrix.arm }} — REFUSED, not a zero"; exit 4
          fi
          echo "name=$NAME" >> "$GITHUB_OUTPUT"
          echo "resolved ${{ matrix.arm }} -> $NAME"

      - name: Stage the assembled inputs (paralogue arms only)
        if: ${{ !startsWith(matrix.arm, 'harness') }}
        run: |
          set -eo pipefail
          cd "$RUNNER_TEMP/dt"
          N="${{ steps.case.outputs.name }}"
          if [ ! -d "/tmp/dt_inputs/$N" ]; then
            echo "::error::$N was not built by the assemble job — this arm was REFUSED at pre-flight and is "\
                 "NOT run with a worse input to see"; exit 5
          fi
          mkdir -p "output/protac22/$N" "data/TernaryDB/ligand_ideal"
          cp -r "/tmp/dt_inputs/$N/." "output/protac22/$N/"
          cp "output/protac22/$N/ligand.sdf" "data/TernaryDB/ligand_ideal/$(echo "$N" | awk -F_ '{print $NF}')_ideal.sdf"
          ls -1 "output/protac22/$N"
          python3 - <<'PY'
          import os, sys
          d = os.path.join("output/protac22", os.environ["N"])
          need = ["unbound_protein1.pdb","unbound_lig1.pdb","unbound_protein2.pdb","unbound_lig2.pdb",
                  "ligand.pdb","ligand.sdf","protein1.pdb","protein2.pdb","gt_complex.pdb"]
          bad = [f for f in need if not os.path.exists(os.path.join(d,f)) or os.path.getsize(os.path.join(d,f))==0]
          print("missing/empty:", bad or "none")
          sys.exit(6 if bad else 0)
          PY
        env:
          N: ${{ steps.case.outputs.name }}

      - name: Predict (CPU, 16 seeds)
        run: |
          set -eo pipefail
          cd "$RUNNER_TEMP/dt"
          echo "${{ steps.case.outputs.name }}" > data/PROTAC/protac22.txt
          python3 predict_cpu.py output/checkpoints/PROTAC \
            --config deepternary/configs/protac.py \
            --checkpoint output/checkpoints/PROTAC/checkpoint.pth 2>&1 | tail -60
          echo "predictions written: $(ls -1 predictions 2>/dev/null | wc -l)"
          ls -1 predictions 2>/dev/null | head -5

      # The harness controls are re-scored by OUR instruments, against the deposit's own sealed native —
      # because the numbers this lane quotes come from our scorers, and a control that only exercises the
      # author's does not control the scorer we actually use.
      - name: Harness control — re-score with OUR two instruments
        if: ${{ startsWith(matrix.arm, 'harness') }}
        run: |
          set -eo pipefail
          python -m pip install -q DockQ "numpy<2"
          python3 research/modalities/selcal_deepternary_poscontrol.py \
            --pred-dir "$RUNNER_TEMP/dt/predictions" \
            --native "$RUNNER_TEMP/dt/output/protac22/${{ steps.case.outputs.name }}/gt_complex.pdb" \
            --out "research/modalities/nr4a3-5bt-poscontrol-${{ matrix.arm }}.json"
          python3 -c "
          import json; print(json.load(open('research/modalities/nr4a3-5bt-poscontrol-${{ matrix.arm }}.json'))['sentence'])"

      - uses: actions/upload-artifact@v4
        if: ${{ always() }}
        with:
          name: pred-${{ matrix.arm }}
          path: |
            /home/runner/work/_temp/dt/predictions
            research/modalities/nr4a3-5bt-poscontrol-*.json
          if-no-files-found: warn

  # ═════════════════════════════════════════════════════════════════════════════════════════════════════
  # 3 · READ. `V1` over all 16 models per arm, then the pre-registered three-arm gate.
  # ═════════════════════════════════════════════════════════════════════════════════════════════════════
  read:
    needs: [assemble, predict]
    if: ${{ always() && needs.assemble.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with: { ref: "${{ github.ref_name }}" }
      - uses: actions/setup-python@v5
        with: { python-version: "3.10" }
      - run: python -m pip install -q "numpy<2" rdkit pytest

      - uses: actions/download-artifact@v4
        with: { pattern: "pred-*", path: /tmp/preds, merge-multiple: true }
      - uses: actions/download-artifact@v4
        with: { name: dt-inputs, path: /tmp/dt_inputs }

      - name: What actually landed
        run: |
          set -eo pipefail
          find /tmp/preds -name 'complex_pred_*.pdb' | sed 's#.*/##' | sed 's/_[0-9]*\.pdb//' | sort | uniq -c
          # ⚠ FOUND, NOT ASSUMED. `upload-artifact` roots the archive at the common ancestor of everything it
          # is given, so the depth of these files depends on what else was in the same upload. A hard-coded
          # path that silently finds nothing would leave the gate with no positive control and it would
          # (correctly) call the run uninterpretable — a refusal manufactured by packaging.
          find /tmp/preds -name 'nr4a3-5bt-poscontrol-*.json' -exec cp -f {} research/modalities/ \; || true
          ls -1 research/modalities/nr4a3-5bt-poscontrol-*.json 2>/dev/null || echo "no positive-control artifact"

      - name: V1 — the descriptor over ALL 16 models per arm
        continue-on-error: true
        run: |
          set -eo pipefail
          mkdir -p /tmp/v1
          python3 - <<'PY'
          import glob, os, shutil
          # `nr4a_ternary_signature` selects by PATH TOKEN with a deny-list and globs *.cif. Give it a tree
          # whose paths carry exactly one paralogue token each, and .cif names its parser reads the same way.
          # ⚠ ONE file per arm must end `_model_0.cif`. `nr4a_ternary_signature.main` resolves a paralogue
          # to a SINGLE structure and REFUSES when several candidates tie — its tie-break is exactly that
          # suffix. Sixteen equally-named models would be an "unresolved paralogue" refusal, i.e. the single
          # -structure read silently lost while the replicated read it also runs was fine.
          src = glob.glob('/tmp/preds/**/complex_pred_*.pdb', recursive=True)
          n = 0
          for p in sorted(src):
              b = os.path.basename(p)
              for tok in ('NR4A3','NR4A1','NR4A2'):
                  if not b.startswith('complex_pred_%s_' % tok):
                      continue
                  seed = b.rsplit('_', 1)[-1].split('.')[0]
                  d = os.path.join('/tmp/v1', tok); os.makedirs(d, exist_ok=True)
                  name = ('%s_model_0.cif' % tok) if seed == '0' else ('%s_pred_%s.cif' % (tok, seed))
                  shutil.copyfile(p, os.path.join(d, name))
                  n += 1
          print('staged %d model(s) for V1' % n)
          PY
          python3 research/modalities/nr4a_ternary_signature.py --root /tmp/v1 --recursive \
            --out research/modalities/nr4a3-5bt-signature.json || true
          python3 -c "
          import json; d=json.load(open('research/modalities/nr4a3-5bt-signature.json'))
          print(d.get('sentence') or d.get('error')); print(d.get('sentence_replicated'))" || true

      - name: THE PRE-REGISTERED GATE
        run: |
          set -eo pipefail
          ARGS=""
          for f in research/modalities/nr4a3-5bt-poscontrol-*.json; do
            [ -e "$f" ] && ARGS="$ARGS --control $f"
          done
          python3 research/modalities/nr4a3_5bt_gate.py \
            --pred-root /tmp/preds $ARGS \
            --frame research/modalities/nr4a3-5bt-frame.json \
            --out research/modalities/nr4a3-5bt-gate.json
          python3 -c "
          import json; d=json.load(open('research/modalities/nr4a3-5bt-gate.json'))
          print('VERDICT:', d['verdict']); print(d['sentence'])
          print('interpretable:', d.get('run_is_interpretable'))"

      - name: Every routed map edit still applies against the LIVE map
        if: ${{ always() }}
        run: |
          set -eo pipefail
          python3 research/modalities/verify_map_edits.py \
            --write research/modalities/nr4a3-5bt-map-edits-verify.json \
            research/modalities/nr4a3-5bt-gate.json || true
          cat research/modalities/nr4a3-5bt-map-edits-verify.json 2>/dev/null || true

      - name: Publish
        if: ${{ always() }}
        env:
          PUBLISH_IF_CHANGED: "1"
        run: |
          set -eo pipefail
          bash research/compute/publish_artifacts.sh "${{ github.ref_name }}" \
            "RUNG 5b-T: the V1 read over all 16 models per arm + the pre-registered three-arm gate (CI, \$0)" \
            research/modalities/nr4a3-5bt-gate.json \
            research/modalities/nr4a3-5bt-signature.json \
            research/modalities/nr4a3-5bt-map-edits-verify.json \
            research/modalities/nr4a3-5bt-poscontrol-harness-vhl.json \
            research/modalities/nr4a3-5bt-poscontrol-harness-crbn.json

      # ⛔ THE RUN DOES NOT GO GREEN ON A FAILED HARNESS CONTROL. A harness that cannot score a known-good
      # ternary cannot grade a suspect one, and a green tick would say the opposite. Artifacts are kept
      # either way — the state is recorded, not hidden.
      - name: The run has to be interpretable
        if: ${{ always() }}
        run: |
          set -eo pipefail
          python3 - <<'PY'
          import json, os, sys
          p = "research/modalities/nr4a3-5bt-gate.json"
          if not os.path.exists(p):
              print("::error::the gate produced no artifact — it did not run to a verdict"); sys.exit(4)
          d = json.load(open(p))
          print(d.get("sentence"))
          if not d.get("run_is_interpretable"):
              print("::error::a harness positive control did not pass — the whole run is UNINTERPRETABLE "
                    "and the paralogue arms are not read"); sys.exit(5)
          PY
