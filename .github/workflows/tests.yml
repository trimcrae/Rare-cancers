name: tests (modalities)

# Runs the complete test population on main pushes, pull requests and manual dispatches.
# Work branches are checked by their PR or after integration, avoiding the duplicate full run
# for a branch push immediately followed by its merge. No test is removed or path-filtered.
# These tests gate the parsing/mapping logic that the fpocket off-by-one bug lived in — no GPU/AWS
# needed. Keep this green before dispatching any SageMaker experiment.
#
# ⭐ TWO JOBS, NOT ONE, SINCE 2026-08-24 — and the name is now the fastest thing about a red build:
#   `gates`   the doc linters, the artifact `--check` verify modes and the CI-shape guards.  ~2 min.
#   `pytest`  the ~9,200-test suite over modalities / manuscripts / systems / scripts.       ~10 min.
# Neither `needs:` the other, so a guard failure can no longer skip the suite and the suite's
# runtime no longer hides the guards. The rationale and the measurements are at each job.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# ⛔⛔ EVERY PUSH USED TO LEAVE ITS PREDECESSOR RUNNING, AND THE PREDECESSOR'S VERDICT IS WORTHLESS
# (measured 2026-08-24). In the 30 most recent runs of this workflow, ONE branch
# (claude/emc-tsc-alterations-frequency-ou1rv7) accounted for 15 of them — pushes at 03:37, 03:39,
# 03:41, 03:43, 03:45, 03:49, 04:01, 04:05 and 04:06 — and 12 runs were in flight simultaneously.
# Fourteen of those fifteen were obsolete the moment the next commit landed, and each still ran to
# completion: ~25 min of runner time apiece, on a tree nobody would ever read a verdict for.
# ⚠ NOTHING IS LOST BY CANCELLING ONE. A cancelled run reports as CANCELLED, never as green, so
# this cannot manufacture a pass — which is the property that separates it from the loosened gates
# CLAUDE.md §4 is written about. The superseding run measures the superseding tree.
# ⭐ AND `main` IS DELIBERATELY EXEMPT. Feature branches are worked in bursts and only the tip
# matters; `main` is the trunk that ~50 other workflows dispatch from, so every commit on it keeps
# its own per-commit verdict rather than inheriting the next one's. Cancelling there would save
# runner time by giving up exactly the history that gets consulted when a lane goes red.
# The same idiom is already in `modalities-run.yml`, which has carried `cancel-in-progress` since it
# was written; this workflow is the one that never got it.
# ⛔⛔ AND THE EXEMPTION ABOVE DID NOT WORK — MEASURED 2026-08-28 (AUT-PD-130). The nine most recent
# completed runs on `main` were ALL `cancelled`, each within 1-3 s of the NEXT run on main being
# created (8c14cc5 at 20:24:23 as 3937db8 was created at 20:24:22; and so on through 12a5f34).
# ⭐ THE OBSERVATION THAT NAMES THE CAUSE, and it refutes the obvious guess: run 33207278897 on
# 86098c2 was `pending`, NOT running, when it was cancelled. `cancel-in-progress` only ever cancels
# a RUNNING run, so the flag was never the mechanism. A concurrency group holds at most ONE running
# and ONE pending run; a third arrival EVICTS THE PENDING ONE whatever the flag says. With every
# push to main sharing one ref-keyed group, and this loop pushing every 2-4 minutes against a
# ~17-minute suite, main's runs evicted each other and the trunk went >20 minutes with NO verdict.
# ⛔ THAT IS THE AUTHORITY GATE SILENTLY OFF: preflight deliberately does not run the two large
# suites on the stated grounds that "CI runs both on push and it is the authority" — so while this
# held, nothing ran them at all. It is also the mechanism behind health.py's `gates_green` reading
# NO-GATE-VERDICT for 47.2 h.
# ★ THE FIX IS TO THE GROUP, NOT THE FLAG. A run on `main` gets a group of its OWN (`run_id`), so
# main runs never queue against one another and each commit keeps the per-commit verdict the
# comment above always intended. Feature branches keep sharing a ref-keyed group, so they still
# collapse to the tip and the runner-time saving that motivated this block is unchanged.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref == 'refs/heads/main' && github.run_id || github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

# ⛔ ONE LIST, ONE PLACE (CLAUDE.md §1). This install list is not a convenience — every entry below
# is annotated at length at its point of use, because each was added after a guard was found to be
# SKIPPING rather than passing. Splitting this file into two jobs means two `pip install` lines, and
# two hand-maintained copies of a load-bearing list is a drift that would be found the same way the
# originals were: by a guard quietly not running. So the list lives here once and both jobs read it.
env:
  # rdkit is needed for the null-map guard regression test (stereo-only edges must fail setup) and the
  # structural-alerts / nrv04 tests; without it those importorskip-skip and the guard goes untested.
  # pyyaml backs test_workflows_parse.py, which catches an unparseable workflow. GitHub reports
  # that as a MISSING TRIGGER rather than a syntax error, and a cron on such a file silently
  # never fires — so without this gate a broken workflow looks like a workflow with nothing to do.
  # boto3 is NOT optional here, and a skip would have been the wrong fix. `test_congeneric_fanout.py`'s
  # credential pre-flight test monkeypatches `boto3.client` to prove the launcher FAILS CLOSED on a dead
  # object-store credential — the guard standing between a rented GPU and a leg that cannot write its
  # checkpoints. Without the package that test errored on import and main stayed red, and a red main is
  # not cosmetic: on 2026-07-27 another lane's red assertions took the whole step-1 supervision tick down
  # with them (the tick gated on pytest before it measured). The test CAN run anywhere — it needs no
  # credentials and touches no network — so the fix is to install the dependency, not to skip the test.
  # biopython backs junction_aso_thermo.py's nearest-neighbour table. Without it that module
  # REFUSES to run rather than hand-entering the table, which is correct behaviour and which
  # made test_the_16mer_thermo_artifact_still_reproduces read as an artifact drift when it was
  # a missing dependency. Verified 2026-08-14: with biopython the check answers "thermo
  # artifact is current". A guard that cannot run is not a guard that passed.
  # pdfminer.six reads the TEXT LAYER of the built submission PDF, which is the only artifact a
  # depositor uploads and a screener opens. Added 2026-08-17 after a blind screen of the PDF
  # found table sequences printed without their 5′-/-3′ delimiters, adjacent to numeric cells —
  # a wrong-reagent hazard for a paper whose deliverable is orderable oligos, and one that seven
  # rounds of review over the MARKDOWN could not see. Same rule as boto3 and biopython above:
  # the test needs no credentials and no network, so the fix is to install the dependency.
  # ⛔ pypdf ADDED 2026-08-19, AND IT IS NOT OPTIONAL ANY MORE. The submission builder now writes
  # the PDF outline and the DOI/URL link annotations through pypdf, so without it the builder
  # itself fails rather than degrading. Two guards in the deposit suite had ALSO been importing
  # pypdf and pymupdf, neither of which was ever installed here -- so both had been SKIPPING in
  # CI and reporting green for a check that never ran. They are ported to pdfminer.six; this
  # line covers the builder.
  # ⭐ pytest-xdist ADDED 2026-08-24 — see the suite step for the parity measurement. It is only
  # USED by the `pytest` job, but it is listed here rather than appended in that job so there is
  # exactly one list to keep correct.
  PIP_PACKAGES: >-
    pytest pytest-xdist numpy scipy pymbar rdkit pyyaml boto3 jsonschema biopython
    pdfminer.six pypdf pdfplumber matplotlib

jobs:
  # ⭐⭐ THE LINTERS AND GUARDS ARE THEIR OWN JOB AS OF 2026-08-24, AND THE SPLIT IS A CORRECTNESS
  # FIX BEFORE IT IS A SPEED ONE (trimcrae: the suite *"takes forever and … ends up blocking a lot
  # of work"*).
  #
  # MEASURED on run 32717951013, the whole job wall clock 20 m 53 s:
  #   setup + all 29 guard steps below   1 m 57 s   <-  9.4 %
  #   the pytest suite (one step)       18 m 54 s   <- 90.6 %
  # and on run 32687069810 the same suite step took 28 m 25 s. So every linter in this file — the
  # ones that actually catch things, and that name the offending file:line in their own step — was
  # invisible for twenty to thirty minutes behind a suite they do not depend on.
  #
  # ⛔ AND THE COUPLING WAS ALREADY KNOWN TO BE A BUG. The suite step carried `if: always()` with a
  # note recording that on 2026-07-29 a failing guard step SKIPPED it for 9+ commits, so the repo's
  # test gate did not run at all while every merge in that window reported red for an unrelated
  # reason. `if: always()` patched the symptom; two jobs remove the mechanism, because a job cannot
  # skip a job it has no `needs:` on. Neither job gates the other — both are reported, both go red
  # on their own evidence, and which KIND of failure occurred is now readable from the check name
  # instead of from a traceback twenty minutes in.
  gates:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: .github/workflows/tests.yml
      - run: pip install $PIP_PACKAGES
      # Run the doc linters FIRST and standalone. Both are also asserted inside the pytest
      # suite, but a doc author who breaks one should see the offending file:line as a
      # failing step named after the linter, not a traceback buried in ~1500 tests.
      # Stdlib-only, ~1 s each.
      - name: Cross-document numeric consistency (one fact, one place)
        run: python3 research/manuscripts/lint_consistency.py
      - name: Manuscript language discipline
        run: python3 research/manuscripts/lint_claims.py
      # ADDED 2026-08-09. Both of these were documented as preflight gates and wired into
      # scripts/preflight.sh, and neither ran in CI. A gate that only fires when somebody
      # remembers to run preflight locally is a gate that will be green on the day it matters --
      # the same shape as the fake --check that shipped before and kept CI green for weeks.
      # ⭐ AND SINCE 2026-08-27 THIS ONE COMMAND CARRIES TWO CHECKS (AUT-PROP-007). It also runs
      # `lint_citation_types.py`: where prose calls a paper a review, a case report or a randomised
      # controlled trial, PubMed's cached `article_types` must agree. On 2026-08-26 a
      # national-registry cohort and two single-patient case reports were cited as "the review
      # literature" with every identifier real, every one anchored, and this step green.
      - name: Citation provenance and publication type (an identifier's origin, and its KIND)
        run: python3 research/manuscripts/lint_citations.py
      - name: Manuscript prose style (journal register, not repository register)
        run: python3 research/manuscripts/lint_style.py
      # ⛔ ADDED 2026-08-28 WITH PREFLIGHT GATE 16 (AUT-PROP-032), AND IT IS HERE FOR THE REASON THE
      # BLOCK ABOVE GIVES IN ITS OWN WORDS: a gate that only fires when somebody remembers to run
      # preflight locally is a gate that will be green on the day it matters. arXiv applies a
      # one-year submission ban for incontrovertible evidence of unverified LLM output, and its named
      # triggers are hallucinated references, residual model meta-comments and unremoved placeholder
      # text. This step covers the second and third, over the documents that actually go out; the
      # first is the citation-provenance step above, and is partial (the module names the gaps).
      # ⚠ The policy is SEARCH-grade here — arxiv.org is refused at the sandbox's egress proxy — so
      # the CHECKLIST is implemented and the policy's wording, date and scope stay UNKNOWN.
      - name: Unverified-output residue in the documents that go out
        run: python3 research/manuscripts/lint_submission_residue.py
      # ⛔ A LINE-NUMBER CITATION IS A CLAIM AND IT ROTS SILENTLY. `check_links` validates that a FILE and
      # an ANCHOR exist; neither reaches inside a file to a LINE, so a citation that has drifted still
      # resolves — it just points at a sentence that does not say what it is cited for. Measured
      # 2026-08-06: all 39 of the roadmap's `:NNNN` citations into the paper and SI were stale, by a
      # systematic +16 to +35 lines. Its own step, for the same reason as the two above: a red build
      # should name the defect, and `--fix` is one command away.
      - name: Roadmap line citations resolve to the sentence they quote
        run: python3 research/manuscripts/line_citations.py
      # The EMC route registry's invariants. Same standalone-step reasoning as above, plus one it
      # does not share: this check reads artifacts AS THEY EXIST ON THE PUBLISH REF, not in the
      # working tree, because the failure it exists to catch is a document on `main` printing a
      # results table out of a file that is a "cannot compute" stub on `main`. `actions/checkout`
      # fetches only the pushed ref, so without the fetch below the check silently degrades to the
      # working tree -- it says so loudly when that happens, and a guard that announces its own
      # weakening is the only kind worth having.
      - name: EMC systems map — registry invariants (routes / objects / evidence / instruments / artifacts / claims)
        run: |
          git fetch --no-tags --depth=1 origin main:refs/remotes/origin/main || \
            echo "could not fetch origin/main -- the claim check will fall back and say so"
          python3 research/manuscripts/emc_systems_map_check.py --check

      # ⛔ GENERATED EVIDENCE ARTIFACTS COULD DRIFT FROM THEIR GENERATORS AND NOTHING CHECKED
      # (measured 2026-08-08). Each carries `_do_not_hand_edit`, and these files hold the pooled
      # clinical proportions and the endpoint readings the EMC papers quote — so a silent drift is a
      # wrong figure in a manuscript, not a stale cache.
      #
      # ⚠ ONLY TWO OF THE THREE ARE WIRED, AND THE OMISSION IS THE POINT.
      # `emc_systemic_therapy_pooling.py` was going to be added here too. It was tested first, and it
      # PARSES NO ARGUMENTS AT ALL: `--check` is ignored, the script REGENERATES AND OVERWRITES the
      # artifact, and exits 0 unconditionally. Adding it would have (a) rewritten an evidence artifact
      # on every CI run and (b) passed every time no matter what — a guard that measures nothing,
      # wearing the name of one, over the repository's pooled clinical numbers.
      # ⛔ AND ITS OWN HEADER IS THEREFORE FALSE TODAY: the file promises a hand edit "will be
      # silently overwritten", which is only true if something regenerates it, and nothing does. A
      # hand edit to the pooled proportions currently persists undetected. Fixing that means giving
      # the generator a real verify mode (regenerate to a temp path, diff, exit non-zero on a
      # difference) — a code change, not a workflow line, so it is NOT smuggled in here.
      - name: EMC evidence artifacts reproduce from their generators
        run: |
          python3 research/manuscripts/emc_endpoint_discordance.py --check
          python3 research/manuscripts/emc_endpoint_alternatives.py --check
          python3 research/manuscripts/endpoint_corpus.py --check
          python3 research/manuscripts/orr_dcr_reread.py --check
          python3 research/manuscripts/endpoint_regime_map.py --check
          python3 research/manuscripts/placebo_arm_calibration.py --check
          python3 research/manuscripts/endpoint_prior_art_audit.py --check
          python3 research/manuscripts/endpoint_regime_figure.py --check
          python3 research/manuscripts/endpoint_result_figures.py --check
      # ⛔⛔ THE DEPOSIT GENERATORS RAN IN NO CI GATE AT ALL (round 15 seat 4, 2026-08-22). All six
      # were wired into scripts/preflight.sh and nowhere else, while their ENDPOINT siblings sit in
      # the step above under a comment saying preflight-only is not enough. Measured: a mutation to
      # Table 2's caption AND its cell, with both PDFs rebuilt, passed seven CI linters and 848
      # tests, and `13 bp` shipped twice in the deposited PDF — only `aso_journal_tables.py --check`
      # sees that, and CI never called it.
      # ⚠ THESE PRODUCE THE FILES A DEPOSITOR UPLOADS. A local-only gate protects a commit made on
      # a machine that ran it; it protects nothing about what reaches Zenodo or a journal portal.
      - name: ASO deposit artifacts reproduce from their generators
        run: |
          python3 research/manuscripts/submission_tables.py --check
          python3 research/manuscripts/submission_citations.py --check
          python3 research/manuscripts/submission_metrics.py --check
          python3 research/manuscripts/aso_sequence_manifest.py --check
          python3 research/manuscripts/aso_journal_tables.py --check
          python3 research/manuscripts/submission_packet.py --check
          # --check-archive, not --check: the manifest stamps git_revision, which advances on every
          # commit, so the strict form is red the instant you commit the manifest you just built.
          python3 research/manuscripts/aso_archive_manifest.py --check-archive
      # ⭐ ITS OWN STEP, NOT A LINE IN THE ONE ABOVE, BECAUSE IT IS NOT AN ASO DEPOSIT ARTIFACT
      # (AUT-PD-130, 2026-09-01). The census covers all 27 censused manuscripts, and a reader
      # scanning the CI log for why the job went red should see the census named rather than a
      # traceback under a step called "ASO deposit artifacts".
      # ⛔ THE PAIR IT GUARDS SPANS TWO DIRECTORIES, WHICH IS WHY NOTHING ELSE CATCHES IT:
      # `claim-coverage.json` harvests its guard patterns from `research/manuscripts/tests/`, so
      # widening a guard's regex moves `covered` with NO manuscript byte touched. `83aede1` did
      # exactly that, `covered` went 99 -> 101, and `main` was red on a clean tree for ~35 minutes.
      # ⚠ The comparison has existed since 2026-08-22 inside `test_claim_coverage_has_not_regressed`,
      # in the manuscripts suite -- which is the OTHER job in this file, i.e. behind the 19-28 minute
      # pytest step this job was split off from. Here it is ~2 s and names its own document.
      # Stdlib-only, no git history, so the shallow checkout above is sufficient.
      - name: The claim-coverage census reproduces from the live corpus
        run: python3 research/manuscripts/claim_coverage.py --check
      - name: Endpoint producer logic and --check are real (not just wired)
        run: |
          python3 -m pytest research/manuscripts/tests/test_endpoint_logic.py \
                            research/manuscripts/tests/test_endpoint_producers_check.py -q
      # The systems model (systems/graph/*.json) and its generated views. Standalone for the same
      # reason as the linters above -- a doc author who breaks it should see the failing step name,
      # not a traceback in ~1500 tests. Three distinct things fail here, all red:
      #   - an invariant (a permanent blocker claiming a technology would retire it; a failing
      #     instrument cited as SUPPORT; a route in no strategy family; a forecast with no basis);
      #   - an unresolvable pointer -- it caught a genuinely broken anchor on its first run, where a
      #     heading had gained a glyph after the anchor was registered;
      #   - VIEW DRIFT: every view under systems/views/ is re-rendered in memory and compared to what
      #     is committed, so a hand-edited generated file cannot merge. Prose drifts and cannot be
      #     checked; a generated view cannot drift without failing this step.
      - name: Systems model — invariants, pointer resolution and view drift
        run: python3 systems/systems_check.py --check
      # The fail-red guard, and it is deliberately SEPARATE from the checks above because it guards a
      # different failure: not a wrong answer, but a parser that finds nothing and exits 0. The plan
      # scanner honestly reports `NOT SCANNED -- the plan is invisible this run` and the build stays
      # green, so a renamed heading yields a board with nothing on it that looks exactly like a board
      # with nothing left to do. This asserts every registered parser can still LOCATE its input. It
      # does not import them: a guard that runs the code it guards inherits that code's failure modes,
      # and the mode being guarded against is succeeding while finding nothing.
      - name: Parser guard (every registered parser can still find what it parses)
        run: python3 systems/parser_guard.py
      # The pooled clinical proportions. Same standalone-step reasoning as the two verify modes
      # above, and one reason neither of them has: this artifact carries PATIENT-FACING numbers --
      # objective-response and disease-control rates with Wilson intervals, pooled under
      # systems/POLICY-evidence.md 2.1-2.4.
      #
      # ⛔ THE MODE THIS INVOKES DID NOT EXIST UNTIL 2026-08-08, AND ITS ABSENCE WAS INVISIBLE.
      # `emc_systemic_therapy_pooling.py` parsed no arguments at all: `--check` was accepted by the
      # shell, ignored by the script, and the artifact was OVERWRITTEN and the run exited 0. Its own
      # `_do_not_hand_edit` note promised a hand edit "will be silently overwritten" -- true only of
      # a regeneration somebody remembered to make, and nothing in CI made one, so a hand-edited
      # pooled proportion persisted undetected. A broken guard that no-ops into the previous
      # behaviour produces NO SYMPTOM, which is why the wiring here is worth nothing on its own:
      # research/manuscripts/tests/test_emc_systemic_therapy_pooling_check.py perturbs the REAL
      # committed artifact on disk and asserts the REAL --check refuses it. That test is what makes
      # this step evidence rather than decoration.
      - name: EMC systemic-therapy pooling — the committed artifact re-derives from its counts
        run: python3 research/manuscripts/emc_systemic_therapy_pooling.py --check
      # Its sibling. This one's `--check` was already REAL — it re-derives to memory and exits 1 on
      # drift — and was invoked by NOTHING: not by preflight, not by CI, only by a docstring line
      # telling a human to run it. A correct guard nobody calls protects exactly as much as a broken
      # one, which is why it is wired here rather than merely noted. Verified 2026-08-08 by
      # perturbing D1's objective-response proportion on disk: exit 1, message names the artifact.
      - name: EMC endpoint discordance — the committed artifact re-derives from its counts
        run: python3 research/manuscripts/emc_endpoint_discordance.py --check
      # The partner-stratified clinical pool. Same standalone-step reasoning as the verify modes
      # above, and the same reason the systemic-therapy one has: this artifact is nothing BUT
      # patient-level event counts — partner-stratified deaths, local recurrences and metastases,
      # pooled with Wilson intervals under systems/POLICY-evidence.md §2.1–§2.4.
      #
      # ⛔ THE MODE THIS INVOKES DID NOT EXIST UNTIL 2026-08-08, AND IT IS THE SECOND INSTANCE OF
      # THE SAME DEFECT FOUND THAT DAY. `emc_fusion_partner_pooling.py` parsed no arguments at all:
      # `--check` was accepted by the shell, ignored by the script, the artifact was OVERWRITTEN and
      # the run exited 0 — so the `_do_not_hand_edit` banner the artifact carries in its own body
      # was unenforced and a hand-edited pooled clinical event count persisted with nothing able to
      # say so. ⚠ Wiring alone is worth nothing here, because the failure being replaced produces NO
      # SYMPTOM: a `--check` that regenerates its own reference compares the generator against
      # itself and exits 0 forever. What makes this step evidence rather than decoration is
      # research/manuscripts/tests/test_emc_fusion_partner_pooling_check.py, which perturbs the REAL
      # committed artifact on disk — a pooled event count, a Wilson bound, a per-cohort stratum, the
      # tumour-size defeater and the `_do_not_hand_edit` note itself — and asserts the REAL
      # `--check` refuses each AND writes nothing. That last assertion is the discriminating one:
      # return code alone cannot separate the repair from the defect, because a regenerating check
      # returns 0 precisely because it just made the file match.
      - name: EMC fusion-partner pooling — the committed artifact re-derives from its counts
        run: python3 research/manuscripts/emc_fusion_partner_pooling.py --check
      # The two ST-CARE-DELIVERY generators (added 2026-08-09), wired here for the same reason as
      # their three siblings above and built to the same idiom rather than a fourth one: `build()`
      # is pure and touches no file, `check()` re-derives to MEMORY and compares against the
      # committed copy, so neither can regenerate its own reference and pass against itself.
      #
      # ⭐ AND UNLIKE THE THREE ABOVE, BOTH ARE ALSO COVERED BY PREFLIGHT, WHICH IS THE POINT.
      # CLAUDE.md §7 records the 2026-08-06 incident where a medical-integrity gate ran in CI and
      # nowhere else, so a session could read `PREFLIGHT OK`, merge, and only then turn `main` red.
      # research/modalities/tests/test_emc_ipd_survival.py and
      # research/modalities/tests/test_emc_care_delivery_evidence.py live under the directory
      # preflight's pytest gate already walks, and each perturbs the REAL committed artifact on
      # disk and asserts the REAL `--check` refuses it AND writes nothing. These steps are the
      # belt; those tests are the braces, and they are what makes the steps evidence.
      #
      # ⛔ THE IPD ARTIFACT CARRIES A CONSTRAINT THE OTHERS DO NOT: its CURVES table must stay
      # EMPTY until a real published figure is digitized WITH PROVENANCE, because a Kaplan-Meier
      # coordinate nobody read is a fabricated clinical datum — the golden rule this repository
      # opens with. test_the_curves_table_is_empty_and_the_artifact_says_so fails the build if one
      # appears, and the schema requires `digitized_by` on every curve so the hand step is named.
      - name: EMC IPD survival reconstruction — the committed artifact re-derives
        run: python3 research/modalities/emc_ipd_survival.py --check
      - name: EMC care-delivery evidence — the committed artifact re-derives
        run: python3 research/modalities/emc_care_delivery_evidence.py --check
      # Same standalone-step reasoning, for the two CI-shape linters. Both exist because a guard
      # that fails OPEN leaves no trace: a `skipped` step and a silently-loosened threshold both
      # render as a green tick, so the only place they can be caught is before they merge.
      #   - optional-input guards: `if: ${{ github.event.inputs.x != '0' }}` is FALSE on a
      #     `schedule:` (null casts to 0), which is how the step-1 fan-out stopped placing units
      #     for 1 h 47 m across seven green ticks on 2026-07-27.
      #   - derived thresholds: a gate typed as a MULTIPLE of a correctable denominator silently
      #     changes meaning when that denominator is re-anchored (§1: the invariant is the
      #     absolute $/ns; the multiple is derived).
      # Both parse (YAML AST / Python AST) rather than grep, so the incident write-ups that quote
      # the broken forms as evidence do not trip them.
      - name: Optional-input guards (a null inputs context must not switch a guard off)
        run: python3 research/modalities/lint_optional_input_guards.py
      - name: Derived thresholds (no typed multiple of a moving basis)
        run: python3 research/modalities/lint_derived_thresholds.py
      # Shell-based tests pytest cannot collect. The watchdog census test EXTRACTS its logic from
      # .github/workflows/ternary-leg-watchdog.yml at run time, so it fails loudly if the workflow's
      # markers move rather than passing against a stale copy.
      - name: Watchdog progress-census logic (direction / warmup-dt / base-10 / -e survival)
        run: bash research/modalities/tests/test_watchdog_census.sh
      # The spot commit prefix must carry the direction. A rev leg that resumes the FORWARD trajectory reports
      # forward sampling as reverse -- and on 2026-07-25 it did, because DIRSUF was assigned in the VM's shell
      # and read in the runner's. Only OpenFE's particle-count check stopped it becoming a published number.
      - name: Spot commit prefix carries the direction (no silent fwd/rev resume)
        run: bash research/modalities/tests/test_commit_prefix_direction.sh
      # The same keying bug with NO safety net underneath it. A restrained and an unrestrained leg are different
      # HAMILTONIANS but IDENTICAL IN COMPOSITION -- same atoms, same particle count, one extra
      # CustomCentroidBondForce -- so OpenFE's assert_multistate_system_equality, the check that caught the
      # fwd/rev collision by luck, provably cannot fire. This test EXTRACTS the workflow's real DIRSUF/RSTSUF/
      # COMMIT_PREFIX lines and its refusal block and evaluates them, rather than restating the rule and then
      # agreeing with itself.
      - name: Spot commit prefix carries the restraint state (no restrained/unrestrained cross-resume)
        run: bash research/modalities/tests/test_commit_prefix_restraint.sh
      # The workflow GENERATES a ~235-line bash script inside an unquoted heredoc and nothing on the runner
      # parses it, so a syntax error there is found by booting a GPU and reading a serial console — a
      # ~20-40 min round trip on the single GPU the whole project shares. This renders the real heredoc with
      # the runner's own expansion rules and runs `bash -n` on the result. It also pins the two RESULT-file
      # keying failures: an unkeyed idempotent-skip makes a restrained re-run report success having computed
      # nothing, and an unkeyed upload overwrites the unrestrained dG_binary the r0 cycle is built on.
      - name: Generated VM startup script parses, and the leg result is restraint-keyed
        run: python3 research/modalities/tests/test_startup_script_renders.py
      # A watchdog that cannot honour its watch list must REFUSE, not improvise. Without the restraint key a
      # restrain=1 entry resolves the UNRESTRAINED result — already in the bucket for the r0 binary arm — and
      # reports a green DONE for a leg that never ran while its VM keeps holding the project's only GPU.
      # Both guards are EXTRACTED from the real watchdog_run.sh and executed, not restated.
      - name: Watchdog refuses a watch list it cannot honour (restraint capability + result key)
        run: bash research/modalities/tests/test_watchdog_restraint_guards.sh
      # mode=provenance exists to stop a leg's setup version being INFERRED FROM AN ABSENCE. Its own first run
      # reproduced that defect: with every leg unrecorded, `len(set(versions)) > 1` was false and the check
      # passed silently on no evidence. A verdict of "no disagreement found" over an unmeasured population is
      # NOT a pass. The verdict logic is extracted from the real workflow and executed.
      - name: Leg-provenance verdict — absence is NOT agreement
        run: python3 research/modalities/tests/test_provenance_absence_is_not_agreement.py
      # A relaunch that drops `restrain` is a SILENT STALL, not a wrong answer: the launcher's own prefix
      # assertion refuses to provision, so there is no leg, no VM, and the watchdog still logs "RELAUNCHED".
      # It only executes on the DIED branch, so no happy-path test touches it — and restrained vs unrestrained
      # are identical in composition, so OpenFE's particle check provably cannot catch it either. The dispatch
      # is extracted from the real script and run against a stubbed `gh` that records its argv.
      - name: Watchdog relaunch reproduces the run it is rescuing (restrain + every keying param)
        run: bash research/modalities/tests/test_watchdog_relaunch_passes_restrain.sh
      # Generalises that fix: in an UNQUOTED heredoc, a variable assigned inside it lives in the VM's shell,
      # so referencing it unescaped asks the RUNNER for a value it never had and silently yields "". The file
      # already warned about this trap in a comment (for STAGE_CACHE) and DIRSUF broke it anyway -- prose is
      # not a guard.
      - name: No two-shell variable in the VM startup heredoc
        run: python3 research/modalities/tests/test_heredoc_two_shell.py
      # LANE 13 chains itself: `collect` exits 0 and the workflow immediately queues `analyse`. So the guards
      # that stop an EMPTY ensemble reaching the verdict have to hold on every push, not only when someone
      # dispatches that lane's own `selftest` task -- which is where this file's only invocation used to be.
      - name: Paralogue-dynamics guards (an empty ensemble must never become a verdict)
        # No `| tail` here: the default shell is `bash -e` WITHOUT pipefail, so a pipe would take the exit
        # status of `tail` and swallow the very failure this step exists to surface.
        run: python3 research/modalities/tests/test_paralogue_dynamics.py
      # Params that change the PHYSICS but are absent from the commit prefix (setup version, charge method,
      # windows). OpenFE's particle check cannot catch a v1-vs-v2pe mismatch because pre-equilibration only moves
      # coordinates, so the manifest fingerprint is the only guard. Needs no scientific stack: it drives
      # restore_latest through a fake store.
      - name: Commit-manifest system fingerprint (no cross-provenance resume)
        run: python3 research/modalities/tests/test_system_fingerprint.py
      # ddG_coop is a DIFFERENCE of legs and |dG_fwd + dG_rev| a SUM of them, so both are meaningless if the legs
      # describe different systems. protocol_hash covers the OpenFE settings and NOT the system: on 2026-07-25
      # four rev attempts ran a 146,020-particle v1 build against fwd's 141,968-particle v2pe one and nothing
      # reported it. Also asserts that 'unrecorded' reports as UNKNOWN rather than as agreement.
      - name: Cross-leg system identity (particles / charge / setup version)
        run: python3 research/modalities/tests/test_system_identity_consistency.py

  # ★★ THE SUITE. Its own job as of 2026-08-24 — see the `gates` header above for why, and note
  # what that split RETIRES: this step used to carry `if: always()` because every guard was a
  # sibling `run:` step and any one of them failing SKIPPED the suite (2026-07-29: it did, for 9+
  # commits, and every merge in that window was reported on a suite nobody executed). A job with no
  # `needs:` cannot be skipped by another job's failure, so the property that note was defending is
  # now structural rather than a flag somebody has to remember to keep. The two jobs report
  # separately and each goes red on its own evidence.
  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: .github/workflows/tests.yml
      - run: pip install $PIP_PACKAGES
      # --continue-on-collection-errors, because ONE unimportable file must not be able to hide the other
      # ~2000 results. Twice on 2026-07-26 a module-scope failure in a single test file (a sys.exit(0) in an
      # import guard, then an unguarded open() after a partial-environment staging failure) aborted collection
      # and the job reported "no tests ran" — a red build that looked ordinary while the guard gate in front of
      # every GPU launch had stopped checking anything. With this flag the broken file is one ERROR, the build
      # is still red, and everything else still reports. It does not excuse the bug; it stops the blast radius.
      # research/manuscripts/tests was added 2026-08-03 for the EMC systems-map guards. It is listed
      # explicitly rather than by widening to `research/` because a bare directory walk would start
      # collecting whatever lands anywhere under research/ — and a suite that silently changes what
      # it runs is the same failure as a suite that silently stops running (the incident above).
      - name: The suite (modalities, manuscripts, systems, scripts)
        # ⛔ `--durations` IS NOT DECORATION HERE, AND ITS ABSENCE COST A WHOLE DIAGNOSIS
        # (2026-08-08). This step ran 22.7 min and nothing recorded WHERE. Profiling it locally
        # was actively misleading: numpy, scipy, rdkit and boto3 are absent from the dev sandbox,
        # so ~48 tests that run HERE do not run there, and the local profile put 96.8% of the cost
        # on one test that is only ~7 min of this job. A suite can only be profiled where it
        # actually runs. Cost of the flag itself: zero.
        #
        # ⭐⭐ `-n 4 --dist loadfile` ADDED 2026-08-24. THE SUITE HAD BEEN SINGLE-THREADED ON A
        # FOUR-CORE RUNNER FOR ITS ENTIRE LIFE, AND THAT WAS THE WHOLE COST OF THIS WORKFLOW:
        # 1,132 s of the 20 m 53 s job (run 32717951013), and 1,705 s on run 32687069810.
        # The `--durations=25` above is what made the shape readable, and the shape is why
        # parallelism is the right lever rather than pruning: the slowest 25 tests are ~600 s, so
        # the other ~535 s is ~9,200 tests at ~58 ms each. There is no fat to cut — there is a long
        # tail to spread over idle cores.
        #
        # ⚠ `--dist loadfile` IS LOAD-BEARING, NOT A TUNING CHOICE, and it is the same reasoning
        # `scripts/preflight.sh` records for its own copy: several tests here regenerate a committed
        # artifact and then assert against it, so distributing by TEST rather than by FILE would let
        # two workers race the same file and produce failures that look real and are not. Keeping a
        # file's tests on one worker preserves the within-file ordering they rely on.
        #
        # ⛔ MEASURED OVER THIS EXACT FOUR-DIRECTORY SET BEFORE THE FLAG WENT IN, NOT INFERRED FROM
        # PREFLIGHT'S NUMBER (which covers the MODALITIES half only). Clean worktree at HEAD, same
        # box, serial vs `-n 4 --dist loadfile`:
        #     serial     1196.0 s   59 failed, 8615 passed, 132 skipped, 36 errors
        #     parallel    455.1 s   59 failed, 8615 passed, 131 skipped, 36 errors   (2.62x)
        # The PASSED and FAILED sets were compared two-sided by NODE ID, not by count — 8,615 and
        # 59 names, identical both directions — and `git status --porcelain` was empty after each
        # run, which is the evidence that nothing regenerated or raced.
        #
        # ⚠ AND THE ONE DIFFERENCE IS A REPORTING ARTIFACT, RUN DOWN RATHER THAN WAVED AT, BECAUSE
        # "131 vs 132" IS EXACTLY THE SHAPE OF A TEST THAT SILENTLY STOPPED RUNNING. It is not one.
        # `test_contact_moiety_pose_rmsd.py` and `test_contact_pose_timeseries.py` both take a
        # module-level skip through `_skip_guard.py:34` with the identical reason "numpy
        # unavailable" (numpy is absent from the dev sandbox; CI installs it, so neither skips
        # there). xdist deduplicates collection-time skip reports keyed on (location, reason), so
        # the two collapse into one tally entry. Discriminating experiment: run either file ALONE
        # under `-n 4` and it reports its skip; run the two together and the tally is 1; pair one of
        # them with `test_5aks_pose.py`, whose skip shares the LOCATION but carries a different
        # REASON, and the tally is correctly 2. Zero tests execute inside a module-level-skipped
        # file in either mode, so no coverage moved.
        # ⛔ WHAT THIS DOES COST, STATED SO NOBODY REDISCOVERS IT: under xdist the skip COUNT is not
        # a reliable tripwire when two modules skip for the same reason at the same line. Assert on
        # the PASSED/FAILED node IDs, never on the skip tally.
        #
        # ⭐ AND HERE IS THE MEASUREMENT IN CI ITSELF, run 32723621338, which is the only one that
        # measures the real population — SO THE LOCAL RATIO ABOVE MUST NOT BE QUOTED AS THIS
        # WORKFLOW'S SPEEDUP:
        #     before (serial, run 32717951013)   9233 passed, 52 skipped in 1132.19s
        #     after  (-n 4,   run 32723621338)   9233 passed, 52 skipped in  582.94s   1.94x
        # The verdict is byte-identical. ⚠ The dev sandbox lacks numpy/scipy/rdkit/boto3, so it runs
        # 8,615 passed + 59 failed + 36 errors where CI runs 9,233 passed: the two boxes execute
        # DIFFERENT POPULATIONS, and scaling the local wall clock to predict this one was wrong by
        # 35 % when it was tried. Local parity answers "is the verdict the same?"; only CI answers
        # "how long does it take?".
        # ⭐ The skip-tally artifact documented above does NOT appear here, as expected: numpy is
        # installed in CI, so neither numpy-guarded module skips, and both runs report 52.
        # ⚠ 1.94x is well short of the 4x an ideal split would give, and WHY is NOT established —
        # the plausible mechanism is that `--dist loadfile` bounds the critical path by the slowest
        # single FILE, and the heaviest here are whole files (test_nrv04_retro_collect_contract.py
        # ~126 s across four tests, test_ternary_ligand_identification.py ~101 s), but
        # `--durations` cannot show per-worker totals so that is a hypothesis, not a finding. Do not
        # write it down as a cause without measuring per-worker load. The headroom is real and
        # unclaimed; `--dist loadfile` is not negotiable for it (see above).

        # ⛔ `-n 4`, NOT `-n auto`. `auto` follows whatever the runner reports, so a runner-image
        # change silently changes how this suite is distributed — and the parity above was measured
        # at 4. A hosted `ubuntu-latest` runner is 4 cores today; if that changes, re-measure parity
        # and then change this number, in that order.
        # ⛔ `research/autonomy/tests` ADDED 2026-08-27, AND IT WAS RUN BY NOTHING UNTIL THAT DAY.
        # Neither this list nor preflight named it, and there is no pytest.ini or testpaths to
        # collect it by accident, so 53 assertions guarding the loop's own instruments — the
        # continuity checker, the session reaper, the receipt schema — were asserted by nobody. All
        # three suites were written as guards against defects that had already happened. This is the
        # same shape as `scripts/tests` (unrun until 2026-08-22) and as `subagent_width` itself,
        # which CLAUDE.md §1 records as a governed number no code read.
        # ⭐ AUT-PD-052 (filed 2026-08-28, three days after the line above) asked for this exact
        # wiring on the strength of a stale evidence pointer — the directory-absent state it cited
        # predates this very commit. Re-verified rather than re-added: run 33173323019 (2026-08-28,
        # this file's HEAD at the time) shows the pytest job executing this line with 0 failures
        # inside research/autonomy/tests (its 4 failures are all in systems/tests, pre-existing and
        # unrelated — a `test_autonomy_priority.py`/weights-file drift, tracked separately). And a
        # genuine `git clone --depth 1` of this HEAD — the actions/checkout@v4 default this suite
        # never gets to see locally — still passes all 264: `test_stuck_clock_a_retry_is_not_an_advance.py`
        # and `test_stalls_are_named_reaches_the_board.py` already carry the shallow-horizon
        # degrade-gracefully path this row asked someone to go build. ~100 tests landed the same day
        # this row was filed (session_cap, learning_rate, queue_view, stuck_clock, the priority age
        # term) and all are already covered by the line below, which they never had to be added to.
        run: >-
          python -m pytest research/modalities/tests research/manuscripts/tests systems/tests scripts/tests
          research/autonomy/tests
          -q --continue-on-collection-errors --durations=25 -n 4 --dist loadfile
