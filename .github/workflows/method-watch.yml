name: Method-watch

# Weekly newsletter digest. Four watches, in the order the digest prints them:
#   1. CLINICAL / TREATMENT NEWS (added 2026-08-24) — ClinicalTrials.gov API v2 + dated
#      RSS/Atom feeds. This is the only layer that can carry a trial readout announced by
#      press release; before it existed, a Phase 3 topline could not appear in the
#      newsletter by any query. It leads the digest because it outranks everything below.
#   2. The in-silico capabilities we are waiting on (virtual-cell / perturbation
#      prediction, AF3-class ternary modelling, de-novo binder design, cryptic pockets,
#      in-silico oligo/nanoparticle tumour-DELIVERY prediction, + direct NR4A3 advances).
#   3. Tool / model releases.  4. Open AI/compute funding (grants.gov).
# Runs scripts/method-watch.mjs and publishes the dated digest to the
# `method-watch-cache` branch. Read it with:
#   git fetch origin method-watch-cache
#   git show origin/method-watch-cache:research/method-watch-digest.md
# The watch config + capability->action trigger table is tracked at research/method-watch.md.

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "send (generate digest + email) | dry_run (generate + publish digest, no email — used by the summary-writer Routine)"
        default: "send"
        required: false
      backfill_from:
        description: "One-off BACKFILL: sweep clinical/treatment news + registry over a PAST window (YYYY-MM-DD). Set with backfill_to. Publishes research/method-watch-backfill.md to method-watch-cache and SENDS NO EMAIL."
        default: ""
        required: false
      backfill_to:
        description: "Backfill window end (YYYY-MM-DD)."
        default: ""
        required: false
      backfill_slice_days:
        description: "Backfill slice size in days (default 14). Google News caps results per query, so a long window must be swept in slices or it silently returns only its recent end."
        default: "14"
        required: false
      probe_grants:
        description: "One-off diagnostic: space-separated grants.gov opportunity IDs to print applicant-eligibility detail for (prints to the job log; the digest still runs)"
        default: ""
        required: false
  schedule:
    - cron: "0 11 * * 5"   # 11:00 UTC Fridays = 7:00 AM ET (weekly newsletter; UTC-based, no DST tracking)

permissions:
  contents: write

concurrency:
  group: method-watch
  cancel-in-progress: false

jobs:
  watch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Grants eligibility probe (one-off diagnostic)
        if: ${{ inputs.probe_grants != '' }}
        env:
          PROBE_GRANTS: ${{ inputs.probe_grants }}
        run: node scripts/fetch-grants-eligibility.mjs $PROBE_GRANTS

      - name: Backfill sweep (one-off; past window)
        if: ${{ inputs.backfill_from != '' && inputs.backfill_to != '' }}
        run: |
          node scripts/method-watch-backfill.mjs \
            "${{ inputs.backfill_from }}" "${{ inputs.backfill_to }}" \
            research/method-watch-backfill.md "${{ inputs.backfill_slice_days }}"

      - name: Generate method-watch digest
        if: ${{ inputs.backfill_from == '' || inputs.backfill_to == '' }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node scripts/method-watch.mjs research/method-watch-digest.md

      # ── MATCH THE WEEK'S NEWS AGAINST WHAT OUR PAPERS CLAIM (added 2026-08-28, trimcrae) ──────
      # The reopening-trigger scan decides relevance with hand-written keyword lists, and that is
      # fragile in a way this repository measured: the closest human prior art the junction-vaccine
      # route has matched NONE of the 38 triggers' queries, because none of them contained the word
      # "vaccine". We already hold both halves of the answer — the headlines this digest just
      # generated, and `what_it_would_claim` for all 32 publications — so the match is one model
      # call. Rationale, prompt and guards: scripts/news_match.py.
      #
      # ⛔ IT RUNS HERE AND NOT IN THE TRIGGER SCAN. That scan's bottleneck is its QUERY: Europe PMC
      # returns only what the query asked for, so a model placed downstream of a narrow query still
      # never sees the paper the query missed. These feeds are broad — a deliberately unscoped
      # oncology catch-all, ClinicalTrials.gov, dated RSS — and are the layer that actually caught it.
      #
      # ⛔ continue-on-error IS DELIBERATE AND IS NOT LAZINESS. The newsletter is the thing trimcrae
      # actually reads on a Friday; a matcher outage must never be able to stop it sending. The
      # script fails loudly rather than writing an empty queue, so a failure here is visible in the
      # run log and the previous queue stays committed and correctly dated — it does not degrade
      # into "the model considered this week and found nothing".
      - name: Match news items against what each paper claims (LLM)
        if: ${{ (inputs.backfill_from == '' || inputs.backfill_to == '') && vars.NEWS_MATCH != 'off' }}
        continue-on-error: true
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          NEWS_MATCH_MODEL: ${{ vars.NEWS_MATCH_MODEL }}
        run: python3 scripts/news_match.py --digest research/method-watch-digest.md

      # Published to the TRIGGERING branch, not to method-watch-cache. The queue is a work item a
      # session acts on beside citation-debt.json, and the cache branch is a firehose nothing reads
      # in the ordinary loop. ⚠ It must also land BEFORE the digest-publish step below, which does a
      # `git checkout -B method-watch-cache` and takes the tree with it.
      - name: Publish the news-match queue to the triggering branch (best effort)
        if: ${{ always() && (inputs.backfill_from == '' || inputs.backfill_to == '') }}
        continue-on-error: true
        env:
          TARGET_REF: ${{ github.ref_name }}
        run: |
          [ -f research/literature/news-match-queue.json ] || { echo "no queue produced"; exit 0; }
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add research/literature/news-match-queue.json
          git diff --cached --quiet && { echo "no change"; exit 0; }
          git commit -q -m "news-match: proposed matches for $(date -u +%Y-%m-%d) (UNVALIDATED LEADS)"
          for i in 1 2 3; do
            git push origin "HEAD:$TARGET_REF" && { echo "pushed"; exit 0; }
            git fetch origin "$TARGET_REF" && git rebase "origin/$TARGET_REF" || true
          done
          echo "::warning::queue push failed; the artifact below is the record"

      - name: Keep the news-match queue as a run artifact
        if: ${{ always() && (inputs.backfill_from == '' || inputs.backfill_to == '') }}
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: news-match-queue-${{ github.run_id }}
          path: research/literature/news-match-queue.json
          if-no-files-found: ignore

      # Pick up a Claude-written newsletter summary (the "LLM filter") if a scheduled Claude session
      # committed a fresh one to email-outbox. Weekly cadence, so accept up to ~2 days old. Mirrors the
      # daily email's "Pick up today's Claude-written summary" step.
      - name: Pick up Claude-written newsletter summary (from email-outbox, if fresh)
        id: sum
        run: |
          git fetch origin email-outbox --depth=1 2>/dev/null || true
          if git cat-file -e origin/email-outbox:newsletter-summary.md 2>/dev/null; then
            last=$(git log -1 --format=%cI origin/email-outbox -- newsletter-summary.md 2>/dev/null || echo "")
            now=$(date -u +%s)
            lastsec=$(date -u -d "$last" +%s 2>/dev/null || echo 0)
            age_days=$(( (now - lastsec) / 86400 ))
            if [ "$lastsec" -gt 0 ] && [ "$age_days" -le 2 ]; then
              git show origin/email-outbox:newsletter-summary.md > "$RUNNER_TEMP/newsletter-summary.md"
              echo "Using Claude-written newsletter summary from email-outbox (age ${age_days}d)."
              echo "file=$RUNNER_TEMP/newsletter-summary.md" >> "$GITHUB_OUTPUT"
            else
              echo "email-outbox newsletter summary is stale (age ${age_days}d); using generated summary."
            fi
          else
            echo "No email-outbox newsletter summary; using generated summary."
          fi

      - name: Email the digest (bite-sized summary + full digest)
        if: ${{ vars.NEWSLETTER_EMAIL != 'off' && (github.event_name == 'schedule' || inputs.mode != 'dry_run') && (inputs.backfill_from == '' || inputs.backfill_to == '') }}
        env:
          DIGEST_FILE: research/method-watch-digest.md
          DIGEST_TITLE: "Method-watch newsletter"
          SUMMARY_OVERRIDE_FILE: ${{ steps.sum.outputs.file }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          ANTHROPIC_MODEL: ${{ vars.ANTHROPIC_MODEL }}
          MAIL_TO: ${{ vars.MAIL_TO }}
          MAIL_FROM: ${{ vars.MAIL_FROM }}
          MAIL_USERNAME: ${{ secrets.MAIL_USERNAME }}
          MAIL_PASSWORD: ${{ secrets.MAIL_PASSWORD }}
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: us-east-2
        run: |
          pip install boto3 >/dev/null 2>&1 || true
          python3 research/modalities/email_digest.py

      - name: Publish digest to method-watch-cache branch
        if: always()
        run: |
          set -e
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          mkdir -p "$RUNNER_TEMP/res"
          cp research/method-watch-digest.md "$RUNNER_TEMP/res/" 2>/dev/null || true
          cp research/method-watch-backfill.md "$RUNNER_TEMP/res/" 2>/dev/null || true
          git fetch origin method-watch-cache || true
          rm -f research/method-watch-digest.md research/method-watch-backfill.md
          if git show-ref --verify --quiet refs/remotes/origin/method-watch-cache; then
            git checkout -B method-watch-cache origin/method-watch-cache
          else
            git checkout --orphan method-watch-cache
            git rm -rf . >/dev/null 2>&1 || true
          fi
          mkdir -p research
          cp "$RUNNER_TEMP/res/method-watch-digest.md" research/ 2>/dev/null || true
          cp "$RUNNER_TEMP/res/method-watch-backfill.md" research/ 2>/dev/null || true
          git add research/method-watch-digest.md research/method-watch-backfill.md 2>/dev/null || \
            git add research/method-watch-digest.md
          git commit -m "Method-watch digest $(date -u +%Y-%m-%d)" || { echo "no changes"; exit 0; }
          git push origin method-watch-cache
