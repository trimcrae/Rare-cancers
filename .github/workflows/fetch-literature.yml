name: Fetch literature

# Pulls open-access research papers from the GitHub-hosted runner (which has
# full internet access - no sandbox egress allowlist needed).
#
# TWO INPUT PATHS, and until 2026-08-05 only one of them was implemented:
#   * `query`        -> Europe PMC search + open-access full text, scripts/fetch-paper.mjs sync
#   * `targets_file` -> an explicit {name: url} corpus, scripts/lit_fetch_urls.py
# The header claimed the first for months while the workflow ran only the second, so a dispatch
# carrying a query searched for nothing and reported success. Wired up 2026-08-05; ASSERTED
# 2026-08-06 (scripts/lit_query_assert.py + the `expect_pmids` known-positive control), because a
# wired search that matches nothing is still a green run with no retrieval behind it.
# A query-only dispatch now runs the query path ONLY — see the guard on the URL-fetch step.
# The fetched corpus is published to the
# `literature-cache` branch, which Pages never serves (pages.yml only copies
# index.html, 404.html, assets/, data/, cancers/). A Claude session then does
# `git fetch origin literature-cache` and extracts cited data into data/cancers/.
#
# Raw full text is a working cache, not site content. Record each paper's
# licence when promoting facts into a cancer page; cite every clinical value.

on:
  workflow_dispatch:
    inputs:
      query:
        description: "Europe PMC search query"
        required: true
        default: '"extraskeletal myxoid chondrosarcoma" OR "extra-skeletal myxoid chondrosarcoma" OR "chordoid sarcoma" OR (NR4A3 AND chondrosarcoma)'
      slug:
        description: "Output folder under literature/ (defaults to a slug derived from the query)"
        required: false
        default: "extraskeletal-myxoid-chondrosarcoma"
      targets_file:
        description: "Optional JSON {name: url} corpus to fetch instead of the built-in TARGETS"
        required: false
        default: ""
      targets_json:
        description: "Inline JSON {name: url} corpus. Use when the URLs are not already committed in this ref — targets_file names a PATH IN THE CHECKED-OUT TREE, so it cannot reach a URL nobody has pushed yet. Layers over targets_file when both are given."
        required: false
        default: ""
      targets_mode:
        description: "replace (default) or extend — how targets_file/targets_json combine with built-in TARGETS"
        required: false
        default: "replace"
      browser_harvest_links:
        description: >-
          browser-fetch mode only: comma-separated target NAMES whose links should be enumerated
          into the artifact. Use when a page LISTS documents but names none of their paths in its
          visible text -- SEER's ICD-O-3 archive page lists fourteen errata PDFs that way, and
          guessing their URLs is the invented-path failure scripts/venue_policy_browser_fetch.py
          already paid for once.
        required: false
        default: ""
      browser_harvest_all_links:
        description: >-
          browser-fetch mode only: set to 1 to keep EVERY harvested link instead of only the
          author-facing ones. The default filter is tuned to publisher navigation and would drop,
          for example, an errata PDF named by its date.
        required: false
        default: ""
      expect_pmids:
        description: >-
          Known-positive control: PMID(s) the query MUST return, comma/space separated. Missing -> the run FAILS.
          ⛔ THE CONTROL MUST BE A PAPER THE QUERY WOULD ACTUALLY RETURN, NOT A PAPER YOU TRUST.
          Measured 2026-08-09: a BH3/MCL-1-in-sarcoma query was given this repository's EMC
          drug-screen PMID as its control because that paper is well verified here. The search ran
          for 53 minutes and SUCCEEDED; the control failed, and the whole corpus was correctly
          discarded unpublished. Pick the control from the query's own subject matter -- a canonical
          paper in the field being searched -- and if you cannot name one you are confident the query
          returns, leave this empty and verify the retrieved corpus by hand instead. A control that
          fails on a good search costs the entire run.
        required: false
        default: ""

permissions:
  contents: write

concurrency:
  # Per-CORPUS group. Nine parallel research sweeps dispatch this file at once; a single shared
  # group serialises them and (when a sibling's copy sets cancel-in-progress) kills queued runs
  # outright — measured 2026-08-07, two runs on this branch cancelled while merely pending.
  #
  # ⚠ KEYING ON `github.ref_name` DOES NOT SEPARATE THEM, and that was the first fix attempted:
  # the sweeps all run on ONE shared branch, so every dispatch lands in the same per-branch group
  # and the contention is unchanged. What is actually distinct per sweep is the CORPUS it fetches,
  # which is also exactly the right granularity — two dispatches of the SAME corpus genuinely
  # should serialise (they publish to the same literature/<slug>/ directory), and two dispatches
  # of DIFFERENT corpora have no reason to. Superseded, retained: `group: fetch-literature-${{ github.ref_name }}`.
  group: fetch-literature-${{ github.ref_name }}-${{ inputs.slug || inputs.targets_file || inputs.query || 'default' }}
  cancel-in-progress: false

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install PDF text extractor
        run: python3 -m pip install --quiet pypdf

      # ── BATCH CITATION PROBE (query begins `PROBE:`) ────────────────────────────────────
      # Europe PMC + ClinicalTrials.gov over the query set in scripts/lit_probe_queries.json,
      # printed to THIS LOG and committed nowhere; a session reads it back with
      # mcp__github__get_job_logs. Recovered from origin/claude/lit-probe-immuno-architectures
      # on 2026-09-02: `scripts/lit_probe_queries.json` was already on main and NOTHING READ IT —
      # its only consumer, scripts/lit_batch_probe.py, existed on two stranded branches and on no
      # path of main.
      # ⚠ Superseded, retained (rule 1.2): the branch also keyed `concurrency.group` per-ref, so a
      # read-only probe queued behind sibling sweeps would not be cancelled. `main` already solves
      # that, and more finely — the group is keyed per ref AND per slug/targets/query above.
      - name: Batch citation probe (read-only, log-only)
        if: ${{ startsWith(inputs.query, 'PROBE:') }}
        run: python3 scripts/lit_batch_probe.py

      # ⛔ THE SEARCH THIS WORKFLOW HAS ALWAYS CLAIMED TO DO WAS NEVER WIRED UP (found 2026-08-05).
      # This file's own header says it "Pulls open-access research papers ... using the Europe PMC API
      # via scripts/fetch-paper.mjs". That script exists, has exactly the `sync "<query>"` command the
      # header describes -- and NOTHING IN THIS WORKFLOW EVER INVOKED IT. The `query` input was
      # decorative: its only use was deriving a default slug in the publish step.
      #
      # ⚠ SO A DISPATCH WITH A QUERY SEARCHED FOR NOTHING, re-fetched the built-in URL list, and
      # reported SUCCESS. CLAUDE.md §6 names this workflow as the Europe PMC escape hatch, on the
      # strength of the header -- so the rule pointed every session at a search that did not run.
      # ── LANE PROBE (slug == 'lane-probe') ───────────────────────────────────────────────
      # A metadata-only mode: run scripts/lit_lane_probe.py's fixed query list against Europe PMC
      # and commit the STRUCTURED HITS (pmid/doi/title/year/citations) + each query's hitCount back
      # to the triggering branch. It exists because the two directions a research sweep needs are
      # BOTH unavailable from the dev sandbox — the egress proxy 403s www.ebi.ac.uk,
      # pubmed.ncbi.nlm.nih.gov and pmc.ncbi.nlm.nih.gov on CONNECT:
      #   * a real PMID to cite, instead of a remembered one;
      #   * a real hitCount of ZERO, which is the only honest basis for "nothing exists".
      # It deliberately does NOT touch .cache/literature or the literature-cache branch — this is
      # a citation index, not a full-text corpus, and mixing the two is the mislabelled-record bug
      # documented in the publish step below.
      - name: Lane probe — Europe PMC metadata only
        if: ${{ inputs.slug == 'lane-probe' }}
        run: python3 scripts/lit_lane_probe.py

      # ── RT PROBE (slug == 'rt-probe') ───────────────────────────────────────────────────
      # Same metadata-only shape as the lane probe. Question, asked 2026-08-10: has ablative
      # radiotherapy ever been given to an EMC lung metastasis? The clinical registry names
      # metastasectomy, pazopanib, anthracycline, trabectedin and watchful waiting for metastatic
      # disease and names ablative RT nowhere — an absence in this repository, which is only
      # distinguishable from an absence in the world by running the query. Rationale and the
      # per-group reasoning are in scripts/lit_rt_probe.py's docstring.
      - name: RT probe — Europe PMC on radiotherapy to EMC lung metastases
        if: ${{ inputs.slug == 'rt-probe' }}
        run: python3 scripts/lit_rt_probe.py

      - name: Publish RT probe to the triggering branch (best effort)
        if: ${{ always() && inputs.slug == 'rt-probe' }}
        continue-on-error: true
        env:
          TARGET_REF: ${{ github.ref_name }}
        run: |
          [ -f research/literature/rt-lung-mets-probe.json ] || {
            echo "::error::rt probe produced no artifact"; exit 1; }
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add research/literature/rt-lung-mets-probe.json
          git diff --cached --quiet && { echo "no change"; exit 0; }
          git commit -q -m "rt probe: Europe PMC citation index for radiotherapy to EMC lung metastases"
          for i in 1 2 3; do
            git push origin "HEAD:$TARGET_REF" && { echo "pushed"; exit 0; }
            git fetch origin "$TARGET_REF" && git rebase "origin/$TARGET_REF" || true
          done
          echo "::warning::ref push failed; the digest in this log and the artifact are the record"

      - name: Keep RT probe as a run artifact
        if: ${{ always() && inputs.slug == 'rt-probe' }}
        uses: actions/upload-artifact@v4
        with:
          name: rt-probe-${{ github.run_id }}
          path: research/literature/rt-lung-mets-probe.json
          if-no-files-found: error

      # ── CONSENSUS PROBE (slug == 'consensus-probe') ─────────────────────────────────────
      # Same metadata-only shape as the lane probe, different question: how much of the field
      # actually holds the view the transcriptional-output manuscript re-reads. Added 2026-08-08
      # after trimcrae asked whether that paper is refuting a consensus or two papers nobody
      # cites — a question the repository had no artifact for. Rationale, queries and the limits
      # of what a hit count can conclude are in scripts/lit_consensus_probe.py's docstring.
      - name: Consensus probe — Europe PMC citation weight of the anchors
        if: ${{ inputs.slug == 'consensus-probe' }}
        run: python3 scripts/lit_consensus_probe.py

      # ── VENUE POLICY, VIA A REAL BROWSER (slug == 'venue-policy-browser') ──────────────
      # Added 2026-08-10. Publisher journal pages return HTTP 403 to plain urllib from BOTH the dev
      # sandbox and this runner, because the protection is keyed on TLS fingerprint and header order
      # rather than on IP reputation -- so it is not a sandbox limit and no amount of retrying, or
      # of setting a browser User-Agent string, clears it. bioRxiv separately returns 429 to runner
      # IPs, which are shared and rate-limited (measured: five attempts across three runs).
      # A headless Chromium is an actual browser and clears both. Public policy and author-guidance
      # pages only -- no login, no paywalled content, no article full text.
      - name: Install Playwright Chromium
        if: ${{ inputs.slug == 'venue-policy-browser' }}
        run: |
          python3 -m pip install --quiet playwright
          python3 -m playwright install --with-deps chromium

      - name: Fetch venue policy pages with a real browser
        if: ${{ inputs.slug == 'venue-policy-browser' }}
        run: python3 scripts/venue_policy_browser_fetch.py

      - name: Publish venue policy fetch to the triggering branch (best effort)
        if: ${{ always() && inputs.slug == 'venue-policy-browser' }}
        continue-on-error: true
        env:
          TARGET_REF: ${{ github.ref_name }}
        run: |
          [ -f research/literature/venue-policy-browser-fetch.json ] || {
            echo "::error::browser fetch produced no artifact"; exit 1; }
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add research/literature/venue-policy-browser-fetch.json
          git diff --cached --quiet && { echo "no change"; exit 0; }
          git commit -q -m "venue policy: publisher pages fetched with a real browser"
          for i in 1 2 3; do
            git push origin "HEAD:$TARGET_REF" && { echo "pushed"; exit 0; }
            git fetch origin "$TARGET_REF" && git rebase "origin/$TARGET_REF" || true
          done
          echo "::warning::ref push failed; the run artifact is the record"

      - name: Keep venue policy fetch as a run artifact
        if: ${{ always() && inputs.slug == 'venue-policy-browser' }}
        uses: actions/upload-artifact@v4
        with:
          name: venue-policy-browser-fetch
          path: research/literature/venue-policy-browser-fetch.json
          if-no-files-found: warn

      # ── GENERIC BROWSER FETCH (slug == 'browser-fetch') ────────────────────────────────
      # Added 2026-08-23. The `venue-policy-browser` mode above proved the METHOD -- a real
      # headless Chromium defeats bot protection keyed on TLS fingerprint, which no amount of
      # retrying or User-Agent spoofing does -- but wired it to ONE hardcoded corpus. The ESMO
      # clinical practice guidelines are the case that forced the seam: they are free to read on
      # annalsofoncology.org and return HTTP 403 to plain urllib from the sandbox AND from this
      # runner, so the question "where do the sarcoma guidelines place EMC" had no route at all.
      # Targets come from `targets_json`, the same input the plain-HTTP path already takes.
      # ⛔ PUBLIC PAGES ONLY. This is not a paywall route. A subscription article a browser cannot
      # read without a login is UNREACHABLE, and recording it as unreachable is the finding.
      - name: Install Playwright Chromium (generic browser fetch)
        if: ${{ inputs.slug == 'browser-fetch' }}
        run: |
          python3 -m pip install --quiet playwright
          python3 -m playwright install --with-deps chromium

      - name: Fetch caller-supplied pages with a real browser
        if: ${{ inputs.slug == 'browser-fetch' }}
        env:
          BROWSER_TARGETS_JSON: ${{ inputs.targets_json }}
          BROWSER_OUT: research/literature/browser-fetch.json
          BROWSER_HARVEST_LINKS: ${{ inputs.browser_harvest_links }}
          BROWSER_HARVEST_ALL_LINKS: ${{ inputs.browser_harvest_all_links }}
        run: python3 scripts/venue_policy_browser_fetch.py

      - name: Keep generic browser fetch as a run artifact
        if: ${{ always() && inputs.slug == 'browser-fetch' }}
        uses: actions/upload-artifact@v4
        with:
          name: browser-fetch-${{ github.run_id }}
          path: research/literature/browser-fetch.json
          if-no-files-found: error

      # ⛔ A RUN ARTIFACT IS NOT A READABLE RESULT (measured 2026-08-23, the first run of this
      # mode). The artifact upload succeeded and the JSON was 5,191 bytes — and a run artifact
      # needs an authenticated download that the dev sandbox cannot make, so the only thing
      # actually readable was the one status line per target the job log prints. Every other mode
      # in this file publishes to the triggering branch for exactly this reason; this one was
      # written without that step and the omission cost a re-dispatch.
      - name: Publish generic browser fetch to the triggering branch (best effort)
        if: ${{ always() && inputs.slug == 'browser-fetch' }}
        continue-on-error: true
        env:
          TARGET_REF: ${{ github.ref_name }}
        run: |
          [ -f research/literature/browser-fetch.json ] || {
            echo "::error::browser fetch produced no artifact"; exit 1; }
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add research/literature/browser-fetch.json
          git diff --cached --quiet && { echo "no change"; exit 0; }
          git commit -q -m "browser fetch: caller-supplied pages retrieved with a real browser"
          for i in 1 2 3; do
            git push origin "HEAD:$TARGET_REF" && { echo "pushed"; exit 0; }
            git fetch origin "$TARGET_REF" && git rebase "origin/$TARGET_REF" || true
          done
          echo "::warning::ref push failed; the run artifact and the per-target status lines in"
          echo "::warning::this log are the record — do NOT record these sources as unreachable"

      # ── KAPLAN-MEIER FIGURE GRAPHICS (slug starts with 'km-figures') ──────────────────
      # Added 2026-08-25. research/literature/emc-ipd-admissibility-2026-08-12.json ended with one
      # open step -- "look at the four figure graphics" -- and no route to the graphics. The route
      # ladder, and why the previously-unresolved HTTPS mirror was the wrong question, are in
      # scripts/emc_km_figure_fetch.py's docstring. Output lands in .cache/literature, so the
      # existing publish step carries it to literature-cache/<slug>/ unchanged.
      # ⛔ POPPLER IS NOT OPTIONAL FOR THE PDF ARM AND ITS ABSENCE MUST NOT PASS QUIETLY: the
      # script records `poppler: false` and saves the PDF unrendered, so a run without this step
      # publishes a PDF nobody can look at while reporting success.
      - name: Install poppler (PDF page rasteriser)
        if: ${{ startsWith(inputs.slug, 'km-figures') }}
        run: sudo apt-get update -qq && sudo apt-get install -y -qq poppler-utils

      # ⛔ ONLY WHEN THE CALLER ASKS, because it costs ~40 s of install for a rung most runs do not
      # need. `browser` in the knob string turns on the Chromium retry for a PDF Unpaywall has
      # already graded open access and the publisher has already refused to plain urllib.
      - name: Install Playwright Chromium (km-figures browser rung)
        if: ${{ startsWith(inputs.slug, 'km-figures') && contains(inputs.browser_harvest_links, 'browser') }}
        run: |
          python3 -m pip install --quiet playwright
          python3 -m playwright install --with-deps chromium

      - name: Fetch Kaplan-Meier figure graphics
        if: ${{ startsWith(inputs.slug, 'km-figures') }}
        env:
          KM_TARGETS_JSON: ${{ inputs.targets_json }}
          KM_OUT_DIR: .cache/literature
          # `browser_harvest_links` is reused as a plain knob string for this mode; setting it to
          # `no-raster` publishes the PDFs without page PNGs, which is a ~7x smaller corpus and
          # loses nothing a local `pdftoppm` cannot regenerate at higher resolution.
          KM_RASTERISE: ${{ contains(inputs.browser_harvest_links, 'no-raster') && '0' || '1' }}
          KM_BROWSER: ${{ contains(inputs.browser_harvest_links, 'browser') && '1' || '0' }}
        run: python3 scripts/emc_km_figure_fetch.py

      # ⭐ THE PRINTED PAGE COUNT IS A COST, NOT A PREFERENCE (2026-08-20). Nucleic Acid
      # Therapeutics charges $90 per printed page, so a manuscript's page count has to be estimated
      # before submission. A journal publishes its SUBMISSION format and not its TYPESET design, so
      # the design is measured off its own published PDFs instead. Europe PMC is unreachable from
      # the dev sandbox; this runner reaches it.
      - name: Mine the venue's typeset geometry from its published PDFs
        if: ${{ inputs.slug == 'venue-typeset-geometry' }}
        run: |
          python3 -m pip install --quiet pdfminer.six
          python3 scripts/venue_typeset_geometry.py --journal "${{ inputs.query }}" --limit 20

      - name: Publish typeset geometry to the triggering branch (best effort)
        if: ${{ always() && inputs.slug == 'venue-typeset-geometry' }}
        continue-on-error: true
        env:
          TARGET_REF: ${{ github.ref_name }}
        run: |
          [ -f research/literature/venue-typeset-geometry.json ] || {
            echo "::error::geometry mine produced no artifact"; exit 1; }
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add research/literature/venue-typeset-geometry.json
          git diff --cached --quiet && { echo "no change"; exit 0; }
          git commit -q -m "venue geometry: typeset design measured from the journal's own PDFs"
          for i in 1 2 3; do
            git push origin "HEAD:$TARGET_REF" && { echo "pushed"; exit 0; }
            git fetch origin "$TARGET_REF" && git rebase "origin/$TARGET_REF" || true
          done
          echo "::warning::ref push failed; the run artifact is the record"

      - name: Keep typeset geometry as a run artifact
        if: ${{ always() && inputs.slug == 'venue-typeset-geometry' }}
        uses: actions/upload-artifact@v4
        with:
          name: venue-typeset-geometry
          path: research/literature/venue-typeset-geometry.json
          if-no-files-found: warn

      - name: Publish consensus probe to the triggering branch (best effort)
        if: ${{ always() && inputs.slug == 'consensus-probe' }}
        continue-on-error: true
        env:
          TARGET_REF: ${{ github.ref_name }}
        run: |
          [ -f research/literature/fusion-consensus-probe.json ] || {
            echo "::error::consensus probe produced no artifact"; exit 1; }
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add research/literature/fusion-consensus-probe.json
          git diff --cached --quiet && { echo "no change"; exit 0; }
          git commit -q -m "consensus probe: Europe PMC citation weight of the fusion paper's anchors"
          for i in 1 2 3; do
            git push origin "HEAD:$TARGET_REF" && { echo "pushed"; exit 0; }
            git fetch origin "$TARGET_REF" && git rebase "origin/$TARGET_REF" || true
          done
          echo "::warning::ref push failed; the digest in this log and the artifact are the record"

      - name: Keep consensus probe as a run artifact
        if: ${{ always() && inputs.slug == 'consensus-probe' }}
        uses: actions/upload-artifact@v4
        with:
          name: consensus-probe-${{ github.run_id }}
          path: research/literature/fusion-consensus-probe.json
          if-no-files-found: error

      # ⛔ PUSHING TO THE TRIGGERING BRANCH LOSES THE RESULT TO A RACE (measured 2026-08-07).
      # Nine parallel sweeps share one working tree and push to each other's branches; run
      # 31134790934 completed all 31 queries, committed 8,749 lines, and then died on
      # `! [rejected] (fetch first)` — the retrieval was real and the artifact was discarded.
      # A read-only citation index has no reason to contend for a shared ref at all, so it gets
      # its own run-scoped ref, which cannot collide with anything by construction. Uploaded as a
      # run artifact too, with if: always(), so a push failure can never again be total loss.
      # ⛔ A RUN-SCOPED REF IS REFUSED, AND THE REASON IS NOT ABOUT THIS FILE'S CONTENT (2026-08-07).
      # Pushing a NEW branch carries the whole tree, INCLUDING .github/workflows/fetch-literature.yml,
      # and the Actions token has no `workflows` scope -> "refusing to allow a GitHub App to create or
      # update workflow ... without `workflows` permission". Pushing to an EXISTING branch whose copy
      # of the workflow is already identical is fine, because nothing about a workflow changes.
      # So the ref push is best-effort (|| true) and the DIGEST IN THE JOB LOG is the real channel;
      # the artifact upload below is the second. Never let this step's failure discard the retrieval.
      - name: Publish lane probe to the triggering branch (best effort)
        if: ${{ always() && inputs.slug == 'lane-probe' }}
        continue-on-error: true
        env:
          TARGET_REF: ${{ github.ref_name }}
        run: |
          [ -f research/literature/lane-probe-metabolism-strategy.json ] || {
            echo "::error::lane probe produced no artifact"; exit 1; }
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add research/literature/lane-probe-metabolism-strategy.json
          git diff --cached --quiet && { echo "no change"; exit 0; }
          git commit -q -m "lane probe: Europe PMC citation index for the metabolism/strategy sweep"
          for i in 1 2 3; do
            git push origin "HEAD:$TARGET_REF" && { echo "pushed"; exit 0; }
            git fetch origin "$TARGET_REF" && git rebase "origin/$TARGET_REF" || true
          done
          echo "::warning::ref push failed; the digest in this log and the artifact are the record"

      - name: Keep lane probe as a run artifact
        if: ${{ always() && inputs.slug == 'lane-probe' }}
        uses: actions/upload-artifact@v4
        with:
          name: lane-probe-${{ github.run_id }}
          path: research/literature/lane-probe-metabolism-strategy.json
          if-no-files-found: error

      # ── MORTALITY PROBE (slug == 'mortality-probe') ─────────────────────────────────────
      # Same metadata-only shape as the two probes above plus one thing neither does: it
      # retrieves the OPEN-ACCESS EMC full-text corpus and keeps every sentence containing a
      # death cue, verbatim, with its PMCID. Added 2026-08-09 for the mechanism-of-death
      # question — what actually kills EMC patients, and whether anything symptom-directed
      # could move survival without touching the tumour. EMC's published record is case
      # reports and small series, which state the terminal event in prose while every pooled
      # outcome table reduces it to a vital status, so the prose IS the dataset.
      # ⛔ It classifies nothing. Retrieval is mechanical; the reading is done downstream
      # against the quoted sentences, so a cause-of-death row can always be checked against
      # its source rather than trusted.
      - name: Mortality probe — Europe PMC index + terminal-event corpus
        if: ${{ inputs.slug == 'mortality-probe' }}
        run: python3 scripts/lit_mortality_probe.py

      - name: Publish mortality probe to the triggering branch (best effort)
        if: ${{ always() && inputs.slug == 'mortality-probe' }}
        continue-on-error: true
        env:
          TARGET_REF: ${{ github.ref_name }}
        run: |
          [ -f research/literature/emc-mortality-probe.json ] || {
            echo "::error::mortality probe produced no artifact"; exit 1; }
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add research/literature/emc-mortality-probe.json
          git diff --cached --quiet && { echo "no change"; exit 0; }
          git commit -q -m "mortality probe: EMC terminal-event corpus + Europe PMC citation index"
          for i in 1 2 3; do
            git push origin "HEAD:$TARGET_REF" && { echo "pushed"; exit 0; }
            git fetch origin "$TARGET_REF" && git rebase "origin/$TARGET_REF" || true
          done
          echo "::warning::ref push failed; the digest in this log and the artifact are the record"

      - name: Keep mortality probe as a run artifact
        if: ${{ always() && inputs.slug == 'mortality-probe' }}
        uses: actions/upload-artifact@v4
        with:
          name: mortality-probe-${{ github.run_id }}
          path: research/literature/emc-mortality-probe.json
          if-no-files-found: error

      # ── HOST-FACTOR PROBE (slug == 'host-factor-probe') ─────────────────────────────────
      # Modifiable host factors (obesity, comorbidity, body composition, smoking) versus EMC
      # survival, added 2026-08-09 on trimcrae's question about treating common commodities
      # independently. Metadata-only, like the lane and consensus probes.
      # ⛔ ITS FIRST QUERY IS THE POINT: does EMC's own record contain ANY host factor at all?
      # Every prognostic factor in the clinical registry is a property of the tumour or its
      # treatment, so the expected hitCount is near zero -- and an absence asserted without a
      # count is an impression. It also retrieves the causal-inference hazards (obesity
      # paradox, reverse causation, collider and immortal-time bias) alongside the association
      # literature, because a naive host-factor analysis recommends weight GAIN to cancer
      # patients and would be confidently wrong.
      - name: Host-factor probe — Europe PMC citation index
        if: ${{ inputs.slug == 'host-factor-probe' }}
        run: python3 scripts/lit_host_factor_probe.py

      - name: Publish host-factor probe to the triggering branch (best effort)
        if: ${{ always() && inputs.slug == 'host-factor-probe' }}
        continue-on-error: true
        env:
          TARGET_REF: ${{ github.ref_name }}
        run: |
          [ -f research/literature/emc-host-factor-probe.json ] || {
            echo "::error::host-factor probe produced no artifact"; exit 1; }
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add research/literature/emc-host-factor-probe.json
          git diff --cached --quiet && { echo "no change"; exit 0; }
          git commit -q -m "host-factor probe: Europe PMC citation index for modifiable host factors"
          for i in 1 2 3; do
            git push origin "HEAD:$TARGET_REF" && { echo "pushed"; exit 0; }
            git fetch origin "$TARGET_REF" && git rebase "origin/$TARGET_REF" || true
          done
          echo "::warning::ref push failed; the digest in this log and the artifact are the record"

      - name: Keep host-factor probe as a run artifact
        if: ${{ always() && inputs.slug == 'host-factor-probe' }}
        uses: actions/upload-artifact@v4
        with:
          name: host-factor-probe-${{ github.run_id }}
          path: research/literature/emc-host-factor-probe.json
          if-no-files-found: error

      # ── ATTRIBUTION-PROBE (slug == 'attribution-probe') ─────────────────────────────
      # How a death gets called cancer-caused, and how well that works. Every disease-specific
      # survival figure this project quotes -- including the stratified antitumour ceiling, which is
      # its headline -- inherits whatever error the cause-assignment instrument carries. Retrieves the
      # SEER algorithm, death-certificate accuracy, relative/net survival (the methods that avoid
      # attribution entirely), trial adjudication, and whether sarcoma has ever examined its own.
      - name: attribution-probe — Europe PMC citation index
        if: ${{ inputs.slug == 'attribution-probe' }}
        run: python3 scripts/lit_attribution_probe.py

      - name: Publish attribution-probe to the triggering branch (best effort)
        if: ${{ always() && inputs.slug == 'attribution-probe' }}
        continue-on-error: true
        env:
          TARGET_REF: ${{ github.ref_name }}
        run: |
          [ -f research/literature/emc-attribution-probe.json ] || { echo "::error::attribution-probe produced no artifact"; exit 1; }
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add research/literature/emc-attribution-probe.json
          git diff --cached --quiet && { echo "no change"; exit 0; }
          git commit -q -m "attribution-probe: Europe PMC citation index"
          for i in 1 2 3; do
            git push origin "HEAD:$TARGET_REF" && { echo "pushed"; exit 0; }
            git fetch origin "$TARGET_REF" && git rebase "origin/$TARGET_REF" || true
          done
          echo "::warning::ref push failed; the digest in this log and the artifact are the record"

      - name: Keep attribution-probe as a run artifact
        if: ${{ always() && inputs.slug == 'attribution-probe' }}
        uses: actions/upload-artifact@v4
        with:
          name: attribution-probe-${{ github.run_id }}
          path: research/literature/emc-attribution-probe.json
          if-no-files-found: error

      # ── LUNG-PROBE (slug == 'lung-probe') ─────────────────────────────
      # Lung-directed options for a lung-metastasis-dominant sarcoma. ⚠ Commissioned on a premise the
      # terminal-event classification had not yet settled -- that respiratory failure is EMC's dominant
      # terminal mechanism. Splits TUMOUR-DIRECTED (metastasectomy, SBRT, ablation, regional delivery --
      # these belong to the locoregional families and are NOT supportive care) from SYMPTOM-DIRECTED
      # (effusion, airway, breathlessness, rehabilitation), because conflating them would let
      # metastasectomy evidence license a supportive-care claim.
      - name: lung-probe — Europe PMC citation index
        if: ${{ inputs.slug == 'lung-probe' }}
        run: python3 scripts/lit_lung_probe.py

      - name: Publish lung-probe to the triggering branch (best effort)
        if: ${{ always() && inputs.slug == 'lung-probe' }}
        continue-on-error: true
        env:
          TARGET_REF: ${{ github.ref_name }}
        run: |
          [ -f research/literature/emc-lung-probe.json ] || { echo "::error::lung-probe produced no artifact"; exit 1; }
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add research/literature/emc-lung-probe.json
          git diff --cached --quiet && { echo "no change"; exit 0; }
          git commit -q -m "lung-probe: Europe PMC citation index"
          for i in 1 2 3; do
            git push origin "HEAD:$TARGET_REF" && { echo "pushed"; exit 0; }
            git fetch origin "$TARGET_REF" && git rebase "origin/$TARGET_REF" || true
          done
          echo "::warning::ref push failed; the digest in this log and the artifact are the record"

      - name: Keep lung-probe as a run artifact
        if: ${{ always() && inputs.slug == 'lung-probe' }}
        uses: actions/upload-artifact@v4
        with:
          name: lung-probe-${{ github.run_id }}
          path: research/literature/emc-lung-probe.json
          if-no-files-found: error

      - name: Europe PMC search + open-access full text (the `query` path)
        # ⛔ A TARGETS-ONLY DISPATCH MUST NOT ALSO RUN THE KEYWORD SWEEP (fixed 2026-08-07).
        # `query` is `required: true` WITH a default, so passing an empty string does not
        # produce an empty `inputs.query` — GitHub substitutes the default, the guard below
        # sees a non-empty value, and the EMC keyword sweep runs anyway. Measured: a dispatch
        # that asked only for a URL corpus published ~700 unrelated EMC papers into that
        # corpus's slug, and a second one did the same alongside 21 mmCIFs. That is the
        # mislabelled-record failure this workflow's own slug guard exists to prevent,
        # arriving by a path the guard does not cover — a corpus that reads as its label but
        # is mostly something else is worse than an empty one, because it looks answered.
        # ⚠ Fixed by INTENT, not by removing the default: a caller supplying a targets corpus
        # is asking for those URLs, so the sweep is suppressed. Callers who want both pass a
        # query explicitly and get both, which is the only case that ever wanted both.
        if: ${{ inputs.query != '' && inputs.slug != 'lane-probe' && inputs.slug != 'consensus-probe' && inputs.slug != 'mortality-probe' && inputs.slug != 'host-factor-probe' && inputs.slug != 'attribution-probe' && inputs.slug != 'lung-probe' && inputs.slug != 'rt-probe' && inputs.slug != 'venue-typeset-geometry' && inputs.slug != 'browser-fetch' && !startsWith(inputs.slug, 'km-figures') && !startsWith(inputs.query, 'PROBE:')
                && inputs.targets_file == '' && inputs.targets_json == '' }}
        env:
          QUERY: ${{ inputs.query }}
        run: node scripts/fetch-paper.mjs sync "$QUERY"

      # ⛔ AND A WIRED-UP SEARCH THAT RETURNS NOTHING STILL REPORTS SUCCESS (added 2026-08-06).
      # Wiring the step in was necessary and not sufficient: `sync` writes an _index.json and exits 0
      # whether the API returned 400 records or 0, so "the workflow is green" was still not evidence
      # that anything was retrieved. This step asserts the retrieval — non-empty, and containing the
      # known-positive PMID(s) the caller names — so the ASSERTION is what the log carries, not a
      # description of the wiring. (Same lesson as tests/test_fleet_armed.py's exempt-lane wiring
      # test: a property asserted in prose about a value a caller passes is a hope, not a property.)
      - name: Assert the query path actually searched (non-empty + known-positive control)
        # ⛔ A TARGETS-ONLY DISPATCH MUST NOT ALSO RUN THE KEYWORD SWEEP (fixed 2026-08-07).
        # `query` is `required: true` WITH a default, so passing an empty string does not
        # produce an empty `inputs.query` — GitHub substitutes the default, the guard below
        # sees a non-empty value, and the EMC keyword sweep runs anyway. Measured: a dispatch
        # that asked only for a URL corpus published ~700 unrelated EMC papers into that
        # corpus's slug, and a second one did the same alongside 21 mmCIFs. That is the
        # mislabelled-record failure this workflow's own slug guard exists to prevent,
        # arriving by a path the guard does not cover — a corpus that reads as its label but
        # is mostly something else is worse than an empty one, because it looks answered.
        # ⚠ Fixed by INTENT, not by removing the default: a caller supplying a targets corpus
        # is asking for those URLs, so the sweep is suppressed. Callers who want both pass a
        # query explicitly and get both, which is the only case that ever wanted both.
        if: ${{ inputs.query != '' && inputs.slug != 'lane-probe' && inputs.slug != 'consensus-probe' && inputs.slug != 'mortality-probe' && inputs.slug != 'host-factor-probe' && inputs.slug != 'attribution-probe' && inputs.slug != 'lung-probe' && inputs.slug != 'rt-probe' && inputs.slug != 'venue-typeset-geometry' && inputs.slug != 'browser-fetch' && !startsWith(inputs.slug, 'km-figures') && !startsWith(inputs.query, 'PROBE:')
                && inputs.targets_file == '' && inputs.targets_json == '' }}
        env:
          LIT_EXPECT_PMIDS: ${{ inputs.expect_pmids }}
        run: python3 scripts/lit_query_assert.py

      # ⛔ RUNNING BOTH PATHS INTO ONE DIRECTORY IS THE MISLABELLED-RECORD BUG WEARING A NEW HAT.
      # `lit_fetch_urls.py` falls back to its BUILT-IN FEP-methodology TARGETS when no targets_file is
      # given, and both paths write into .cache/literature, which the publish step copies wholesale
      # into literature/<slug>/. So before this guard, a query-only dispatch published its Europe PMC
      # corpus INTERLEAVED with 25 files about lomap, cinnabar and Schrödinger cycle-closure patents —
      # the same contamination the publish step's slug guard below was written to prevent, arriving
      # from the other direction. A query-only run now runs the query path ONLY.
      - name: Fetch literature URLs (generic, runner has unrestricted egress)
        if: ${{ (inputs.targets_file != '' || inputs.targets_json != '' || inputs.query == '') && inputs.slug != 'lane-probe' && inputs.slug != 'consensus-probe' && inputs.slug != 'mortality-probe' && inputs.slug != 'host-factor-probe' && inputs.slug != 'attribution-probe' && inputs.slug != 'lung-probe' && inputs.slug != 'rt-probe' && inputs.slug != 'venue-typeset-geometry' && inputs.slug != 'browser-fetch' && !startsWith(inputs.slug, 'km-figures') }}
        env:
          LIT_TARGETS_FILE: ${{ inputs.targets_file }}
          LIT_TARGETS_JSON: ${{ inputs.targets_json }}
          LIT_TARGETS_MODE: ${{ inputs.targets_mode }}
        run: python3 scripts/lit_fetch_urls.py

      - name: Keep full-text artifact (ephemeral, 14 days)
        uses: actions/upload-artifact@v4
        with:
          name: literature-${{ github.run_id }}
          path: .cache/literature
          retention-days: 14
          if-no-files-found: warn

      - name: Publish corpus to literature-cache branch
        # Inputs are passed via env (never interpolated into the script) so quotes
        # in the query can't break tokenization or inject shell commands.
        env:
          QUERY: ${{ inputs.query }}
          SLUG: ${{ inputs.slug }}
          TARGETS_FILE: ${{ inputs.targets_file }}
        run: |
          set -e
          [ -d .cache/literature ] || { echo "Nothing fetched"; exit 0; }

          # ⛔ A SLUG IS A CLAIM ABOUT CONTENTS, AND NOTHING USED TO CHECK IT (2026-08-05).
          #
          # `lit_fetch_urls.py` reads LIT_TARGETS_FILE and falls back to its BUILT-IN `TARGETS` list;
          # only this step consumes QUERY. So a dispatch carrying a `query` and a custom `slug` but no
          # `targets_file` re-fetches the built-in FEP-methodology corpus and publishes it under
          # whatever name was chosen -- and the run reports SUCCESS.
          #
          # That happened: `literature/bangerter-2023-emc-exvivo/` was published holding 25 files about
          # lomap, Schrödinger's cycle-closure patents, cinnabar and diffnet, and NOT ONE about
          # Bangerter or EMC. A future session greps this branch and finds a directory whose name
          # promises the one piece of ex-vivo EMC evidence this repository has failed to resolve.
          # ⚠ A MISLABELLED RECORD IS WORSE THAN A MISSING ONE: nothing inside contradicts the name,
          # because the name is the only claim being made.
          #
          # So a CUSTOM slug now requires a custom target set. The default slug is unaffected -- it
          # describes the built-in corpus honestly, which is exactly what it is for.
          if [ -n "$SLUG" ] && [ -z "$TARGETS_FILE" ] && [ -z "$QUERY" ]; then
            echo "::error::Refusing to publish under the custom slug '$SLUG': this run used the" \
                 "BUILT-IN TARGETS list, because neither targets_file nor query was given. The slug" \
                 "would assert a subject the manifest cannot show. Pass a query, or a" \
                 "targets_file={name:url,...}, or drop the slug and accept the default."
            exit 1
          fi
          slug="$SLUG"
          [ -n "$slug" ] || slug=$(printf '%s' "$QUERY" | tr '[:upper:]' '[:lower:]' | tr -cs 'a-z0-9' '-' | sed 's/^-//;s/-$//')
          tmp="$RUNNER_TEMP/litdata"
          rm -rf "$tmp"; mkdir -p "$tmp"
          cp -r .cache/literature/. "$tmp"/

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin literature-cache || true
          if git show-ref --verify --quiet refs/remotes/origin/literature-cache; then
            git checkout -B literature-cache origin/literature-cache
          else
            git checkout --orphan literature-cache
          fi
          # Keep the literature/ tree (other slugs/corpora) and .git; drop stray
          # top-level files, then refresh ONLY this slug. Multi-slug safe.
          find . -mindepth 1 -maxdepth 1 -not -name '.git' -not -name 'literature' -exec rm -rf {} +
          rm -rf "literature/$slug"
          mkdir -p "literature/$slug"
          cp -r "$tmp"/. "literature/$slug"/
          git add -A
          git commit -m "Literature cache update: $slug" || { echo "No changes"; exit 0; }

          # ⚠ THE PUSH THAT CARRIES THE CORPUS WAS THE ONE WITH NO RETRY (measured 2026-08-08).
          # The two lane-probe pushes above have retried 3x for months; this one — the only push that
          # publishes the fetched papers — was bare. Five parallel sweeps dispatched this workflow at
          # once and TWO reported `failure` with every file ALREADY FETCHED, having lost a
          # non-fast-forward race on this shared ref.
          # ⛔ THE COST IS A MISREAD, NOT A LOST FETCH: the run's conclusion says `failure`, so a
          # session reading only the conclusion concludes THE SOURCES WERE UNREACHABLE — the opposite
          # of what happened — and re-plans around a retrieval failure that did not occur. The papers
          # were on disk the whole time, and the run artifact below still held them.
          # ⚠ RE-APPLY ONTO THE NEW TIP, NEVER FORCE. The race is with a SIBLING SLUG, so a force-push
          # would resolve our failure by destroying their corpus — trading a visible error for a
          # silent deletion. Each attempt re-fetches, resets to the new tip, and lays this slug back
          # down; `$tmp` is $RUNNER_TEMP, outside the work tree, so the reset cannot eat our own copy.
          for attempt in 1 2 3 4 5; do
            if git push origin literature-cache; then
              echo "pushed '$slug' on attempt $attempt"; exit 0
            fi
            echo "push rejected (attempt $attempt) — re-applying '$slug' onto the new tip"
            sleep $(( attempt * 5 ))
            git fetch origin literature-cache || true
            git reset --hard origin/literature-cache
            rm -rf "literature/$slug"
            mkdir -p "literature/$slug"
            cp -r "$tmp"/. "literature/$slug"/
            git add -A
            git commit -m "Literature cache update: $slug" \
              || { echo "No changes after re-apply — a sibling already carries this slug"; exit 0; }
          done
          echo "::error::Corpus push for '$slug' failed after 5 attempts. THE PAPERS WERE FETCHED —" \
               "read them from the 'literature-${{ github.run_id }}' run artifact above, and do NOT" \
               "record these sources as unreachable."
          exit 1
