name: Fetch literature

# TEMPORARY branch-local override (branch litverify-tmp only; never merged to main).
# Fetches open-access full text for the RBFE replicate-count literature check from
# a GitHub runner, which has unrestricted internet. Publishes extracted text to the
# `litverify-cache` branch.

on:
  workflow_dispatch:
    inputs:
      query:
        description: "unused"
        required: false
        default: ""
      slug:
        description: "unused"
        required: false
        default: ""

permissions:
  contents: write

concurrency:
  group: fetch-literature
  cancel-in-progress: false

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install poppler
        run: sudo apt-get update -qq && sudo apt-get install -y -qq poppler-utils

      - name: Fetch sources
        run: python3 scripts/litverify_fetch.py "$RUNNER_TEMP/litverify"

      - name: Show manifest
        run: cat "$RUNNER_TEMP/litverify/MANIFEST.txt" || true

      - uses: actions/upload-artifact@v4
        with:
          name: litverify-${{ github.run_id }}
          path: ${{ runner.temp }}/litverify
          retention-days: 14
          if-no-files-found: warn

      - name: Publish to litverify-cache branch
        run: |
          set -e
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin litverify-cache || true
          if git show-ref --verify --quiet refs/remotes/origin/litverify-cache; then
            git checkout -B litverify-cache origin/litverify-cache
          else
            git checkout --orphan litverify-cache
          fi
          find . -mindepth 1 -maxdepth 1 -not -name '.git' -exec rm -rf {} +
          cp -r "$RUNNER_TEMP/litverify/." .
          rm -f ./*.pdf
          git add -A
          git commit -m "litverify corpus" || { echo "No changes"; exit 0; }
          git push -f origin litverify-cache
