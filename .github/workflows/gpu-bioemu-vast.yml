name: BioEmu cryptic-pocket cross-check (Vast)

# NR4A3 LBD BioEmu ensemble -> harmonized Pocket-5 detection, as an ORTHOGONAL cross-check on the metadynamics
# cryptic-pocket result (method-watch trigger, BioEmu v1.4.0, 2026-07-20). Provider: Vast.ai (the repo's paid
# wide-parallel workhorse since 2026-07-22). Tasks:
#   bake    -> build+push the triskit23/bioemu Vast boot image (Dockerfile.bioemu). Run ONCE (and on dep bumps).
#   smoke   -> rent one cheap host, run the WHOLE chain on chignolin (10 aa) to prove image+plumbing (~$0.10).
#   launch  -> rent one host, run the real 254-residue NR4A3 LBD cross-check; result JSON -> S3.
#   collect -> pull the result JSON (+ phase log) from S3 and commit it into the branch.
#   stop    -> destroy any lingering nr4a3-bioemu instances (anti-idle backstop).
#
# Run a feature branch's version by dispatching with ref=<branch> (the image + code come from that branch).

on:
  workflow_dispatch:
    inputs:
      task:
        description: bake | smoke | launch | collect | stop
        type: choice
        options: [bake, smoke, launch, collect, stop]
        default: launch
      num_samples:
        description: "number of BioEmu samples (launch/smoke; blank = default 200 real / 5 smoke)"
        type: string
        default: ""
      batch_size_100:
        description: "BioEmu batch_size_100 (lower if 24GB OOMs; blank = default 10 real / 5 smoke)"
        type: string
        default: ""
      vast_image:
        description: "override the Vast image (blank = docker.io/triskit23/bioemu:latest)"
        type: string
        default: ""
      vast_ckpt_bucket:
        description: "S3 bucket for results (blank = sagemaker-us-east-2-646605541856)"
        type: string
        default: ""
      protfep_task:
        # BRIDGE (temporary, 2026-07-24). The 5a-KS protein-mutation FEP lane has its own workflow,
        # .github/workflows/gpu-protfep-vast.yml, but a workflow_dispatch workflow cannot be
        # dispatched until its file is on the DEFAULT branch. This input is the documented
        # run-a-feature-branch's-CI escape hatch: dispatch THIS on-main workflow with
        # ref=<feature-branch> and protfep_task=<task>, and GitHub runs that branch's file + code.
        # Leave blank for a normal BioEmu run — a blank value changes nothing. Delete this input and
        # its job once gpu-protfep-vast.yml is merged to main.
        description: "5a-KS protein-FEP bridge: bake | stage-test | refcheck | introspect | build-test | alt-probe | pmx-probe | smoke | pilot | launch | collect | stop (blank = off)"
        type: string
        default: ""

permissions:
  contents: write

jobs:
  bake:
    if: ${{ github.event.inputs.task == 'bake' }}
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      DOCKERHUB_USER: triskit23
    steps:
      - uses: actions/checkout@v4
      - name: Reclaim runner disk (the CUDA + torch image is multi-GB)
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/lib/android "$AGENT_TOOLSDIRECTORY" || true
          df -h /
      - name: Log in to Docker Hub
        run: echo "${{ secrets.DOCKERHUB_TOKEN }}" | docker login -u "$DOCKERHUB_USER" --password-stdin
      - name: Build + push the BioEmu Vast image
        run: |
          set -eo pipefail
          IMG="docker.io/${DOCKERHUB_USER}/bioemu:latest"
          docker build -f research/compute/Dockerfile.bioemu -t "$IMG" research/compute/
          docker push "$IMG"
          echo "PUSHED $IMG — ensure the Docker Hub repo is PUBLIC so Vast pulls it unauthenticated."

  run:
    if: ${{ github.event.inputs.task == 'smoke' || github.event.inputs.task == 'launch' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      VAST_API_KEY: ${{ secrets.VAST_API_KEY }}
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      AWS_DEFAULT_REGION: us-east-2
      GIT_BRANCH: ${{ github.ref_name }}
      VAST_IMAGE: ${{ github.event.inputs.vast_image }}
      VAST_CKPT_BUCKET: ${{ github.event.inputs.vast_ckpt_bucket }}
      BIOEMU_MODE: ${{ github.event.inputs.task == 'smoke' && 'smoke' || 'real' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Submit the Vast instance
        run: |
          set -eo pipefail
          python -m pip install -q awscli || true
          ARGS="--mode $BIOEMU_MODE"
          [ -n "${{ github.event.inputs.num_samples }}" ] && ARGS="$ARGS --num-samples ${{ github.event.inputs.num_samples }}"
          [ -n "${{ github.event.inputs.batch_size_100 }}" ] && ARGS="$ARGS --batch-size-100 ${{ github.event.inputs.batch_size_100 }}"
          echo "launching: nr4a3_bioemu_vast_launch.py $ARGS"
          python research/modalities/nr4a3_bioemu_vast_launch.py $ARGS
          echo "Instance submitted. Poll progress via task=collect (reads S3 phase.txt + result JSON)."

  collect:
    if: ${{ github.event.inputs.task == 'collect' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      AWS_DEFAULT_REGION: us-east-2
      BUCKET: ${{ github.event.inputs.vast_ckpt_bucket }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
      - name: Pull the result JSON (+ phase log) from S3
        run: |
          set -eo pipefail
          python3 -m pip install -q awscli >/dev/null 2>&1 || true
          B="${BUCKET:-sagemaker-us-east-2-646605541856}"
          PREFIX="s3://${B}/nr4a3-bioemu-crosscheck/nr4a3-bioemu-crosscheck"
          echo "=== phase.txt ==="; aws s3 cp "$PREFIX/phase.txt" - 2>/dev/null || echo "(no phase.txt yet)"
          mkdir -p research/modalities
          if aws s3 cp "$PREFIX/bioemu-crosscheck.json" research/modalities/nr4a3-bioemu-crosscheck.json 2>/dev/null; then
            echo "=== result ==="; cat research/modalities/nr4a3-bioemu-crosscheck.json
          else
            echo "::warning::no result JSON yet — the run may still be sampling. Re-run collect later."; exit 0
          fi
      - name: Commit the result into the branch
        run: |
          set -eo pipefail
          git config user.name "Claude"; git config user.email "noreply@anthropic.com"
          if ! git diff --quiet -- research/modalities/nr4a3-bioemu-crosscheck.json; then
            git add research/modalities/nr4a3-bioemu-crosscheck.json
            git commit -m "bioemu: capture NR4A3 cryptic-pocket cross-check result from Vast run"
            git push origin HEAD:${{ github.ref_name }}
          else
            echo "no change to commit"
          fi

  stop:
    if: ${{ github.event.inputs.task == 'stop' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      VAST_API_KEY: ${{ secrets.VAST_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Destroy any lingering nr4a3-bioemu Vast instances (anti-idle backstop)
        run: |
          set -eo pipefail
          python - <<'PY'
          import os, sys
          sys.path.insert(0, "research/modalities")
          from gpu_backend import _vast_request
          key = os.environ["VAST_API_KEY"]
          insts = _vast_request("GET", "/instances/", key).get("instances", [])
          for it in insts:
              label = (it.get("label") or "")
              if label.startswith("nr4a3-bioemu"):
                  iid = it.get("id")
                  print(f"destroying {iid} ({label})")
                  try:
                      _vast_request("DELETE", f"/instances/{iid}/", key)
                  except Exception as e:  # noqa: BLE001
                      print(f"  destroy {iid} failed: {e}")
          print("done")
          PY

  # ----------------------------------------------------------------------------------------------
  # BRIDGE JOB (temporary) — runs the 5a-KS protein-mutation FEP lane off a feature branch.
  # See the `protfep_task` input above for why this lives here instead of in gpu-protfep-vast.yml.
  # Remove together with that input once gpu-protfep-vast.yml is on main.
  # ----------------------------------------------------------------------------------------------
  protfep:
    if: ${{ github.event.inputs.protfep_task != '' }}
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      VAST_API_KEY: ${{ secrets.VAST_API_KEY }}
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      AWS_DEFAULT_REGION: us-east-2
      GIT_BRANCH: ${{ github.ref_name }}
      VAST_IMAGE: ${{ github.event.inputs.vast_image }}
      VAST_CKPT_BUCKET: ${{ github.event.inputs.vast_ckpt_bucket }}
      TASK: ${{ github.event.inputs.protfep_task }}
      DOCKERHUB_USER: triskit23
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Bake the protfep Vast image
        if: ${{ github.event.inputs.protfep_task == 'bake' }}
        run: |
          set -eo pipefail
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/lib/android "$AGENT_TOOLSDIRECTORY" || true
          echo "${{ secrets.DOCKERHUB_TOKEN }}" | docker login -u "$DOCKERHUB_USER" --password-stdin
          IMG="docker.io/${DOCKERHUB_USER}/protfep:latest"
          docker build -f research/compute/Dockerfile.protfep -t "$IMG" research/compute/
          docker push "$IMG"
          echo "PUSHED $IMG — the Docker Hub repo must be PUBLIC so Vast pulls it unauthenticated."

      - name: Stage-test (free — RCSB fetch, chain surgery, mutation-site verification)
        if: ${{ github.event.inputs.protfep_task == 'stage-test' }}
        run: |
          set -eo pipefail
          python -m pip install -q pytest
          python -m pytest research/modalities/tests/test_protein_fep.py \
                           research/modalities/tests/test_protfep_bench.py -q
          cd research/modalities
          python - <<'PY'
          import json, protfep_bench as b
          ok = True
          for name in b.BENCHMARKS:
              for env in ("complex", "apo"):
                  spec = b.leg_spec(name, env, 0)
                  try:
                      r = b.stage_leg(spec, "/tmp/protfep_in")["report"]
                      print(f"OK  {spec['leg_id']}: chains={r['chains']} atoms={r['atoms_per_chain']} "
                            f"residues={r['residues_per_chain']} site={r['mutation_site_observed']} "
                            f"(expected {r['mutation_site_expected']})")
                  except Exception as e:
                      ok = False
                      print(f"FAIL {spec['leg_id']}: {type(e).__name__}: {e}")
          print(json.dumps(b.verify_status(), indent=2))
          raise SystemExit(0 if ok else 1)
          PY

      - name: Verify benchmark reference ddG values against SKEMPI 2.0
        if: ${{ github.event.inputs.protfep_task == 'refcheck' || github.event.inputs.protfep_task == 'stage-test' }}
        run: |
          set -eo pipefail
          python research/modalities/protfep_refcheck.py \
            --out research/modalities/protfep-reference-check.json
          git config user.name "Claude"; git config user.email "noreply@anthropic.com"
          if ! git diff --quiet -- research/modalities/protfep-reference-check.json; then
            git add research/modalities/protfep-reference-check.json
            git commit -m "5a-KS: verify benchmark reference ddG values against SKEMPI 2.0"
            git push origin HEAD:${{ github.ref_name }}
          fi

      - name: Introspect the perses install (FREE — runs the image on the CI runner, no GPU rented)
        if: ${{ github.event.inputs.protfep_task == 'introspect' }}
        # The smoke leg died in PointMutationExecutor.__init__ on `from openeye import oechem`, a
        # LAZY import (which is why the build-time module import assertion passed). OpenEye is
        # commercial and license-gated, so the question is whether perses offers an OpenEye-free
        # path to the same hybrid topology. That is answerable for $0 by running the image here
        # instead of renting another GPU to find out.
        run: |
          set -eo pipefail
          IMG="docker.io/triskit23/protfep:latest"
          docker pull "$IMG"
          P=/opt/mamba/envs/protfep/lib/python3.11/site-packages/perses
          cat > /tmp/probe.py <<'PROBE'
          import importlib
          targets = [
              ("perses.rjmc.topology_proposal", "PointMutationEngine"),
              ("perses.annihilation.relative", "HybridTopologyFactory"),
              ("perses.rjmc.geometry", "FFAllAngleGeometryEngine"),
              ("perses.annihilation.lambda_protocol", "LambdaProtocol"),
              ("perses.samplers.multistate", "HybridRepexSampler"),
              ("perses.app.relative_point_mutation_setup", "PointMutationExecutor"),
          ]
          for mod, name in targets:
              try:
                  getattr(importlib.import_module(mod), name)
                  print("OK    %s.%s" % (mod, name))
              except Exception as exc:
                  print("FAIL  %s.%s -> %s: %s" % (mod, name, type(exc).__name__, exc))
          try:
              import openeye
              print("openeye PRESENT:", getattr(openeye, "__version__", "?"))
          except Exception as exc:
              print("openeye ABSENT (expected):", type(exc).__name__)
          PROBE
          echo "=== every openeye import site in perses ==="
          docker run --rm "$IMG" bash -lc "grep -rn '^ *from openeye\|^ *import openeye' $P --include=*.py | head -40; echo '--- files touching openeye ---'; grep -rln openeye $P --include=*.py | wc -l"
          echo "=== the failing frame in context ==="
          docker run --rm "$IMG" bash -lc "sed -n '210,265p' $P/app/relative_point_mutation_setup.py"
          echo "=== which entry points import WITHOUT openeye? ==="
          docker run --rm -v /tmp/probe.py:/tmp/probe.py "$IMG" python /tmp/probe.py

      - name: Build-test the hybrid topology (FREE — full perses build on a CPU CI runner)
        if: ${{ github.event.inputs.protfep_task == 'build-test' }}
        # THE POINT: building the hybrid topology is CPU work. Only the SAMPLING needs a GPU. So the
        # entire risky half — RCSB staging, PDBFixer prep, perses' PointMutationExecutor, solvation,
        # system generation, the OpenEye shim — can be proven here for $0, and a GPU gets rented only
        # once we know a hybrid actually builds. The first smoke rented a 4090 to discover an import
        # error; this step is how that stops happening.
        run: |
          set -eo pipefail
          IMG="docker.io/triskit23/protfep:latest"
          docker pull "$IMG"
          docker run --rm -e GIT_BRANCH="$GIT_BRANCH" -e PROTFEP_ALLOW_CPU=1 "$IMG" bash -lc '
            set -eo pipefail
            export PATH=/opt/mamba/envs/protfep/bin:$PATH
            cd /root
            curl -Ls "https://github.com/trimcrae/Rare-cancers/archive/refs/heads/$GIT_BRANCH.tar.gz" | tar xz
            cd Rare-cancers-*/research/modalities
            python - <<"PY"
          import protfep_bench as pb, protfep_run as pr
          spec = pb.leg_spec(pb.PILOT_BENCHMARK, "apo", 0)
          staged = pb.stage_leg(spec, "/tmp/in")
          pdb = staged["report"]["prepared"]
          print("staged:", pdb, staged["report"]["atoms_per_chain"],
                "site:", staged["report"]["mutation_site_observed"])
          htf, meta = pr.build_htf(pdb, spec["mutation"])
          print("HYBRID BUILT: %d particles, shim=%s" % (meta["n_particles"], meta["openeye_shim"]))
          assert meta["n_particles"] > 5000, "solvated apo barstar should be >5k particles"
          print("BUILD-TEST PASS")
          PY'

      - name: Probe alternatives to perses' OpenEye dependency (FREE)
        if: ${{ github.event.inputs.protfep_task == 'alt-probe' }}
        # The build-test proved perses' PROTEIN mutation path itself needs OpenEye
        # (PolymerProposalEngine.generate_oemol_from_pdb_template -> createOEMolFromSDF ->
        # oechem.oemolistream), not just its ligand branch. Before that becomes a decision, price the
        # options with evidence: is there a non-OpenEye map path in this perses, and does pmx — the
        # free, published, GROMACS-based protein-mutation FEP engine — actually install?
        run: |
          set -eo pipefail
          IMG="docker.io/triskit23/protfep:latest"
          docker pull "$IMG"
          P=/opt/mamba/envs/protfep/lib/python3.11/site-packages/perses
          echo "=== is the OpenEye map path optional anywhere in the polymer engine? ==="
          docker run --rm "$IMG" bash -lc "grep -n 'generate_oemol_from_pdb_template\|createOEMolFromSDF\|def _construct_atom_map\|rdkit' $P/rjmc/topology_proposal.py | head -30"
          echo "=== does perses offer an RDKit-backed alternative at all? ==="
          docker run --rm "$IMG" bash -lc "grep -rln 'rdkit' $P --include=*.py | head -20; echo '--- perses version ---'; python -c 'import perses; print(perses.__version__)'"
          echo "=== is pmx installable from conda-forge? (the free GROMACS-based alternative) ==="
          docker run --rm "$IMG" bash -lc "micromamba create -y -n pmxprobe -c conda-forge pmx gromacs --dry-run 2>&1 | tail -30" || echo "pmx dry-run FAILED (see above)"
          echo "=== what does conda-forge actually offer for protein mutation FEP? ==="
          docker run --rm "$IMG" bash -lc "micromamba search -c conda-forge pmx 2>&1 | tail -12; echo '--- gromacs ---'; micromamba search -c conda-forge gromacs 2>&1 | tail -6"

      - name: Probe the pmx + GROMACS stack before baking it (FREE)
        if: ${{ github.event.inputs.protfep_task == 'pmx-probe' }}
        # trimcrae chose pmx + GROMACS over a commercial OpenEye licence (2026-07-24). Two facts
        # decide the image, and both are free to establish. Round 1 answered both in the negative for
        # the WRONG reasons, which is why the corrections are spelled out here:
        #   1. `gromacs=*=*cuda*` failed to solve with "__cuda is missing on the system" — that is the
        #      GPU-LESS CI RUNNER lacking the virtual package, NOT an absence of CUDA builds. The fix
        #      is CONDA_OVERRIDE_CUDA, which is also required at BAKE time since the builder has no GPU.
        #   2. pip install from the pmx default branch refused Python 3.11 ("requires <3,>=2.7") — that
        #      branch is the legacy PYTHON 2 codebase. The Python-3 line lives on `develop`.
        run: |
          set -eo pipefail
          echo "=== do CUDA GROMACS builds exist on conda-forge? (override the missing __cuda) ==="
          docker run --rm -e CONDA_OVERRIDE_CUDA=12.4 mambaorg/micromamba:latest bash -lc "
            micromamba create -y -n g -c conda-forge 'gromacs=*=*cuda*' --dry-run 2>&1 | tail -25"
          echo "=== which gromacs build would we actually get? ==="
          docker run --rm -e CONDA_OVERRIDE_CUDA=12.4 mambaorg/micromamba:latest bash -lc "
            micromamba search -c conda-forge gromacs 2>&1 | grep -i cuda | tail -15 || echo '(no cuda in the short listing; the dry-run above is authoritative)'"
          echo "=== pmx from the develop branch (Python 3) ==="
          docker run --rm python:3.11-slim bash -lc "
            apt-get update -q >/dev/null 2>&1 && apt-get install -y -q git build-essential >/dev/null 2>&1
            pip install -q numpy 'scipy<2' matplotlib 2>&1 | tail -2
            pip install -q 'git+https://github.com/deGrootLab/pmx.git@develop' 2>&1 | tail -20
            python -c \"
          import pmx, pkgutil
          print('pmx from', pmx.__file__)
          print('submodules:', sorted(m.name for m in pkgutil.iter_modules(pmx.__path__)))
          from pmx import Model
          print('pmx.Model OK')
          try:
              from pmx.scripts.workflows import *
              print('workflows importable')
          except Exception as e:
              print('workflows import:', type(e).__name__, e)
          \"" || echo "PMX DEVELOP INSTALL FAILED — see above"

      - name: Submit Vast leg(s)
        if: ${{ contains(fromJSON('["smoke","pilot","launch"]'), github.event.inputs.protfep_task) }}
        run: |
          set -eo pipefail
          MODE="$TASK"; [ "$MODE" = "launch" ] && MODE="full"
          # Replicate count stays at the launcher's default (3). BioEmu's num_samples input means
          # something entirely different, so it is deliberately NOT reused here.
          python research/modalities/protfep_vast_launch.py --mode "$MODE"

      - name: Collect — status board, anti-idle reap, reduce to verdict + price
        if: ${{ github.event.inputs.protfep_task == 'collect' }}
        run: |
          set -eo pipefail
          python -m pip install -q boto3
          python research/modalities/protfep_vast_launch.py --collect
          B="${VAST_CKPT_BUCKET:-sagemaker-us-east-2-646605541856}"
          python research/modalities/protfep_reduce.py --source "s3://${B}/protfep-benchmark" \
            --out research/modalities/protfep-benchmark-result.json
          git config user.name "Claude"; git config user.email "noreply@anthropic.com"
          if ! git diff --quiet -- research/modalities/protfep-benchmark-result.json; then
            git add research/modalities/protfep-benchmark-result.json
            git commit -m "5a-KS: capture protein-mutation FEP benchmark reduction from Vast legs"
            git push origin HEAD:${{ github.ref_name }}
          fi

      - name: Stop — destroy every protfep-bench instance
        if: ${{ github.event.inputs.protfep_task == 'stop' }}
        run: python research/modalities/protfep_vast_launch.py --stop
