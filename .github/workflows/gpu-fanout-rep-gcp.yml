name: GCP GPU — STEP 1 fan-out REPLICATE on the free L4 (cycle_3carbonyl; WIF keyless)

# ONE unit of the `[ ]` STRATEGY item "Step 1 fan-out · REPLICATES ON THE OPEN CYCLE", on the single serial
# GCP GPU, paid for with expiring trial credit ($0 real dollars — a SEPARATE LEDGER, CLAUDE.md §6).
# The reasoning, the key contract and the teardown predicate all live in research/modalities/gcp_fanout_rep.py;
# this file is the plumbing and must not restate them (rule 1).
#
#   mode=autofeed: THE DEFAULT, and what every scheduled tick runs. Reap, then DECIDE whether to buy the
#                 next unit of the queue, then buy it. The decision is gcp_fanout_rep.feed_decision and it
#                 is PURE — see below for why the lane had no launch side at all until 2026-08-01.
#   mode=mirror : $0 CPU. Copy the COMMON-MODE staged pose tree S3 -> GCS, byte-size verified. Idempotent.
#                 Must run once before the first smoke. NO VM.
#   mode=smoke  : GPU, minutes. RBFE_TINY splittest of the REAL edge in the REAL container, on an L4, writing
#                 to a throwaway GCS prefix. Proves image pull + CUDA-in-docker + GCS read of the stage tree +
#                 GCSCommitStore write + the engine's own setup. The §6 shakeout, before any long spend.
#   mode=run    : GPU, detached. ONE replicate unit: complex then solvent, per-leg idempotent, continuous GCS
#                 commits. Bounded at CREATE by --max-run-duration + --instance-termination-action=DELETE.
#   mode=tail   : $0. VM list, quota usage, phase marker, last log lines. NO VM.
#   mode=reap   : $0. The evidence-based teardown. Also runs at the head of EVERY dispatch (see below).
#
# ★★ THE REAP RUNS FIRST ON EVERY DISPATCH, and that is deliberate. gcp-gpu-facts.md §6b measured that a
# `schedule:` cron is not a safety mechanism on this repo (delivered gaps of 125-222 min against a */15
# request) and §6 that a GCE VM cannot delete itself. Hanging teardown off a cron would repeat both mistakes.
# Hanging it off every dispatch means the act of touching this lane at all cleans it up, and the create-time
# max-run cap is the bound that needs nothing alive at all.
#
# ★★ AND THE LAUNCH SIDE NOW RUNS THERE TOO — THE ASYMMETRY WAS THE BUG (measured 2026-08-01, the lane's
# second idle in two days and the first that was structural). Every tick could END work and none of them
# could START it: this file's own `schedule:` cron and `step1-fanout-supervisor.yml`'s ~8-minute loop both
# dispatch with NO inputs, `MODE` therefore defaulted to `reap`, and the create step was gated on
# `github.event.inputs.mode` — which a `schedule:` event leaves empty, so no scheduled run could ever have
# provisioned whatever it was named. Buying required a human or an agent typing `mode=run`; when the agent
# stopped, buying stopped, and the free L4 sat idle 8 h 11 m against credit that expires 2026-10-10 while
# every tick's board row correctly reported it and nothing acted on the report.
# The default is now `autofeed`, and the gates read `env.MODE` so a scheduled tick reaches them.

on:
  workflow_dispatch:
    inputs:
      mode:      { description: "autofeed | mirror | smoke | run | tail | forensic | reap", default: "tail", required: true }
      edge:      { description: "edge id, or a cycle id for mirror/plan. mode=run needs ONE edge.", default: "e_zaienne_cmpd19__cw_ms_free_acid", required: false }
      replicate: { description: "replicate index (>=1; 0 IS the original unit, not a repeat)", default: "1", required: false }
      zone:      { description: "GCE zone — us-central1 ONLY, quota exists nowhere else (CLAUDE.md §6)", default: "us-central1-a", required: false }
      provisioning: { description: "standard (on-demand; the GCP default per the _gcp_cost_frame ruling — wall clock is the scarce thing here, not money) | spot", default: "standard", required: false }
      force:     { description: "1 = provision even if the unit's ddg.json is already in GCS (overwrites)", default: "0", required: false }
  schedule:
    # ⚠ A REQUEST, NOT A CADENCE (CLAUDE.md §6) — GitHub throttles this repo's schedules to a small
    # fraction of what the cron asks for, and the gaps actually delivered are MEASURED by
    # fleet-supervision-alarm.yml, which is their one home. Do not read `*/10` as "every ten minutes".
    #
    # THE REAL CADENCE IS `step1-fanout-supervisor.yml`, whose long-lived loop dispatches this lane
    # `mode=reap` every ~8 min alongside the ternary gates and the NR-V04 retro tick. This entry is the
    # BACKSTOP for the window where that loop is between generations — measured 2026-08-01: the running
    # supervisor and its queued successor were both pinned to SHAs predating the tick, so the loop could
    # not pick it up for one full generation. An hourly cron over that window left the lane's board row
    # reading STALE (> 15 min) for most of a 48 h leg, which is the condition this lane exists to make
    # visible rather than to embody.
    #
    # Asking for more costs nothing and is bounded by what the mode can do. ⚠ The bound is NO LONGER
    # "it can never buy" — that WAS the bound, and it is exactly what left the GPU idle for 8 h with a
    # supervision tick running the whole time. A scheduled tick now runs `autofeed` and may provision;
    # what stops it running away is `gcp_fanout_rep.feed_decision`, which refuses on a live instance
    # (GPUS_ALL_REGIONS = 1), on a unit that already has a ddg.json, and on the no-progress breaker.
    - cron: "*/10 * * * *"

permissions:
  id-token: write
  contents: write   # ONLY to publish this lane's own in-flight fragment (one file, one writer, no race).

concurrency:
  group: gcp-gpu-fanout-rep
  cancel-in-progress: false

jobs:
  s1f-rep:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      # ⚠ `autofeed`, not `reap`. A `schedule:` event carries no inputs, so this default IS what every
      # unattended tick does — and while it was `reap` the lane had no launch side at all.
      MODE: ${{ github.event.inputs.mode || 'autofeed' }}
      EDGE: ${{ github.event.inputs.edge || 'e_zaienne_cmpd19__cw_ms_free_acid' }}
      REP: ${{ github.event.inputs.replicate || '1' }}
      ZONE: ${{ github.event.inputs.zone || 'us-central1-a' }}
      PROVISIONING: ${{ github.event.inputs.provisioning || 'standard' }}
      FORCE: ${{ github.event.inputs.force || '0' }}
      GITREF: ${{ github.ref_name }}
      VM_PREFIX: gcp-s1frep-
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      AWS_DEFAULT_REGION: us-east-2
      S3_BUCKET: sagemaker-us-east-2-646605541856
      IMAGE: docker.io/triskit23/nr4a3fep:latest

    steps:
      - uses: actions/checkout@v4

      - id: auth
        name: Authenticate to GCP (keyless, WIF)
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: projects/878095411563/locations/global/workloadIdentityPools/github-pool/providers/github-provider
          service_account: gpu-runner@project-a7ebde30-e2ed-4b8d-9a9.iam.gserviceaccount.com

      - name: Set up gcloud
        uses: google-github-actions/setup-gcloud@v2

      - name: Resolve project
        run: |
          P=project-a7ebde30-e2ed-4b8d-9a9
          gcloud config set project "$P" >/dev/null 2>&1 || true
          echo "PROJECT=$P" >> "$GITHUB_ENV"
          echo "BUCKET=${P}-rbfe-ckpt" >> "$GITHUB_ENV"

      # ===================================================================================================
      # REAP — FIRST, ON EVERY DISPATCH. Age is NEVER consulted; the predicate is gcp_fanout_rep.reap_decision.
      # ===================================================================================================
      - name: Reap finished VMs (evidence-based; age is never a reason)
        run: |
          set -uo pipefail
          echo "=== reap sweep over ${VM_PREFIX}* ==="
          # ⚠ LABELS ARE READ OUT OF **JSON**, NEVER OUT OF A `value(labels.s1f-edge)` PROJECTION.
          # gcloud's projection grammar and its filter grammar are different parsers and a HYPHEN in a label
          # key is where they diverge — a projection can return EMPTY for a label the filter matches fine.
          # This reaper's correct response to an unlabelled VM is to REFUSE, so an empty projection would
          # give a teardown that politely declines to work forever while every log line says it ran. The
          # parsing has one home: gcp_fanout_rep.vm_rows (see its docstring).
          LIST=$(gcloud compute instances list --filter="name~^${VM_PREFIX}" --format=json 2>/dev/null \
                   | python3 research/modalities/gcp_fanout_rep.py vms || true)
          if [ -z "$LIST" ]; then echo "  no ${VM_PREFIX}* instances — nothing to reap"; else
          printf '%s\n' "$LIST" | while IFS=$'\t' read -r NAME Z ST CREATED EDGE_L REP_L MODE_L; do
            [ -z "${NAME:-}" ] && continue
            Z="${Z##*/}"
            echo "  VM $NAME zone=$Z status=$ST created=$CREATED edge=${EDGE_L:-<unlabelled>} rep=${REP_L:-<unlabelled>}"
            if [ -z "${EDGE_L:-}" ]; then
              echo "    ⛔ REFUSED: unlabelled — cannot resolve its unit, so cannot prove its work is banked. Not reaped."
              continue
            fi
            KEY=$(python3 research/modalities/gcp_fanout_rep.py plan --edge "$EDGE_L" --replicate "${REP_L:-1}" \
                    --pick 0 --bucket "$BUCKET" --shell 2>/dev/null | sed -n 's/^RESULT_KEY=//p')
            if [ -z "$KEY" ]; then echo "    ⛔ REFUSED: could not resolve a result key. Not reaped."; continue; fi
            # `updated` is the object's own last-write time. Absent object -> empty -> the predicate refuses.
            UPD=$(gcloud storage objects describe "gs://$BUCKET/$KEY" --format="value(updated)" 2>/dev/null || true)
            # A SMOKE writes no result object, so the clause above can never retire it and its only bound
            # would be the 7 h cap — 7 h of the account's ONE GPU for a job that finished in twenty minutes.
            # It does write a TERMINAL marker as its last act, which is evidence of the same kind, so the
            # predicate is given the mode label and that marker. Strictly scoped: a RUN's markers are
            # progress, not termination, and are never consulted.
            UURI=$(python3 research/modalities/gcp_fanout_rep.py plan --edge "$EDGE_L" --replicate "${REP_L:-1}" \
                     --pick 0 --bucket "$BUCKET" --shell 2>/dev/null | sed -n 's/^UNIT_URI=//p')
            # The phase is read in BOTH modes now. A `run` writes its markers at $UURI/phase.txt and a
            # smoke at $UURI/smoke/phase.txt; the predicate decides what each one licenses. Reading it only
            # for smokes is the gap the first real leg found: a run that died in bootstrap had no evidence
            # any reaper could act on and sat on the account's ONE GPU until its 48 h cap.
            if [ "${MODE_L:-run}" = smoke ]; then
              PH=$(gcloud storage cat "$UURI/smoke/phase.txt" 2>/dev/null | tail -1 || true)
            else
              PH=$(gcloud storage cat "$UURI/phase.txt" 2>/dev/null | tail -1 || true)
            fi
            OUT=$(python3 research/modalities/gcp_fanout_rep.py reap --edge-id "$EDGE_L" --replicate "${REP_L:-1}" \
                    --vm-created "$CREATED" --result-updated "$UPD" \
                    --vm-mode "${MODE_L:-run}" --phase "${PH:-}" --json)
            ACT=$(printf '%s' "$OUT" | python3 -c "import sys,json;print(json.load(sys.stdin)['action'])")
            WHY=$(printf '%s' "$OUT" | python3 -c "import sys,json;print(json.load(sys.stdin)['why'])")
            if [ "$ACT" = reap ]; then
              echo "    ✅ REAP: $WHY"
              gcloud compute instances delete "$NAME" --zone="$Z" --quiet 2>&1 | tail -2 || \
                echo "    ::warning::delete failed for $NAME"
            else
              CAU=$(printf '%s' "$OUT" | python3 -c "import sys,json;print(json.load(sys.stdin)['cause'])")
              echo "    ⛔ REFUSED ($CAU): $WHY"
            fi
          done
          fi
          echo "=== GPU quota after the sweep (usage>=1 with no VM above = a zombie outside this lane) ==="
          Q=$(gcloud compute regions describe us-central1 --flatten="quotas[]" \
                --format="value(quotas.metric, quotas.limit, quotas.usage)" 2>/dev/null)
          for M in NVIDIA_L4_GPUS PREEMPTIBLE_NVIDIA_L4_GPUS; do
            printf '%s\n' "$Q" | awk -v m="$M" '$1==m {print "  "m": limit="$2" usage="$3}'
          done

      # ===================================================================================================
      # AUTOFEED — the LAUNCH side of the tick. Runs after the reap, before any create.
      # ===================================================================================================
      # ⚠ THE DECISION IS NOT MADE HERE. `gcp_fanout_rep.tick` gathers the facts (GCE instance list, each
      # unit's ddg.json, each unit's committed-checkpoint census, each unit's launch ledger) and hands them
      # to the PURE `feed_decision`, so what this lane will buy is exercisable from a canned document with
      # no cloud and no credit (`--facts`). This step only carries the verdict into the job's env.
      - name: Autofeed — decide whether to buy the next unit (mode=autofeed)
        if: ${{ env.MODE == 'autofeed' }}
        run: |
          set -uo pipefail
          python3 research/modalities/gcp_fanout_rep.py tick --bucket "$BUCKET" \
            --vm-prefix "$VM_PREFIX" --dump-facts /tmp/facts.json > /tmp/feed.env
          sed 's/^/  /' /tmp/feed.env
          # FEED_WHY can contain anything, so it goes through the multiline form; the rest are single-token.
          grep -E '^FEED_(ACTION|CAUSE|UNIT_ID|EDGE|REP)=' /tmp/feed.env >> "$GITHUB_ENV"
          { echo 'FEED_WHY<<S1FEOF'; sed -n 's/^FEED_WHY=//p' /tmp/feed.env; echo 'S1FEOF'; } >> "$GITHUB_ENV"
          sed -n 's/^NEXT_ATTEMPT_JSON=//p' /tmp/feed.env > /tmp/next_attempt.json || true
          A=$(sed -n 's/^FEED_ACTION=//p' /tmp/feed.env)
          if [ "$A" = launch ]; then
            # ★ THE MODE BECOMES `run`, AND THAT IS THE WHOLE HAND-OFF. Everything downstream — the
            # idempotent skip, SMOKE=0, the 48 h cap, the `s1f-mode=run` GCE label the reaper keys on — is
            # the existing mode=run path unchanged. An autofeed launch and a hand-typed one are the SAME
            # purchase, so there is no second code path to drift.
            {
              echo "MODE=run"
              sed -n 's/^FEED_EDGE=/EDGE=/p' /tmp/feed.env
              sed -n 's/^FEED_REP=/REP=/p' /tmp/feed.env
            } >> "$GITHUB_ENV"
            echo "::notice title=S1F-REP AUTOFEED::launching $(sed -n 's/^FEED_UNIT_ID=//p' /tmp/feed.env)"
          else
            echo "::notice title=S1F-REP AUTOFEED $A::$(sed -n 's/^FEED_CAUSE=//p' /tmp/feed.env) — $(sed -n 's/^FEED_WHY=//p' /tmp/feed.env)"
          fi

      # ===================================================================================================
      # MIRROR — the COMMON-MODE inputs, S3 -> GCS. $0, no VM.
      # ===================================================================================================
      - name: Mirror the staged pose tree S3 -> GCS (mode=mirror; $0, NO VM)
        if: ${{ env.MODE == 'mirror' }}
        run: |
          set -eo pipefail
          # WHY A MIRROR AND NOT A RE-STAGE. congeneric_pose_stage.py builds every analogue by MCS-core-
          # constrained embedding onto ONE anchor pose, and all 18 landed edges read that exact tree. Running
          # the stager again would re-embed and could land core coordinates a fraction of an angstrom
          # elsewhere — which is invisible to any check this lane runs and fatal to calling the result a
          # REPLICATE. So: copy the bytes, then prove they are the same bytes.
          pip -q install awscli >/dev/null 2>&1 || pip -q install awscli
          SRC="s3://$S3_BUCKET/nr4a3-step1-fanout/stage"
          DST="gs://$BUCKET/nr4a3-step1-fanout/stage"
          echo "=== source: $SRC ==="
          aws s3 ls "$SRC/" --recursive | sed 's/^/  /'
          mkdir -p /tmp/stage
          aws s3 cp "$SRC/" /tmp/stage/ --recursive --only-show-errors
          echo "=== copying to $DST ==="
          gcloud storage cp -r /tmp/stage/* "$DST/" 2>&1 | tail -5
          echo "=== VERIFY: per-object size, S3 vs GCS ==="
          FAIL=0
          while read -r _d _t SZ KEY; do
            [ -z "${KEY:-}" ] && continue
            REL="${KEY#nr4a3-step1-fanout/stage/}"
            G=$(gcloud storage objects describe "$DST/$REL" --format="value(size)" 2>/dev/null || echo MISSING)
            if [ "$G" = "$SZ" ]; then echo "  ok   $REL ($SZ B)"; else echo "  FAIL $REL s3=$SZ gcs=$G"; FAIL=1; fi
          done < <(aws s3 ls "$SRC/" --recursive)
          [ "$FAIL" = 0 ] || { echo "::error::mirror verification failed — a replicate MUST read byte-identical inputs"; exit 1; }
          echo "::notice title=S1F-REP MIRROR::staged pose tree mirrored and byte-size verified into $DST"

      # ===================================================================================================
      # PLAN — resolve the unit and publish everything the create step needs.
      # ===================================================================================================
      - name: Resolve the unit
        if: ${{ env.MODE == 'smoke' || env.MODE == 'run' || env.MODE == 'tail' }}
        run: |
          set -eo pipefail
          N=$(python3 research/modalities/gcp_fanout_rep.py plan --edge "$EDGE" --replicate "$REP" \
                --bucket "$BUCKET" 2>/dev/null | python3 -c "import sys,json;d=json.load(sys.stdin);print(len(d) if isinstance(d,list) else 1)")
          if [ "${MODE}" != tail ] && [ "$N" != 1 ]; then
            echo "::error::edge='$EDGE' resolves to $N units. mode=$MODE buys ONE unit at a time — GPUS_ALL_REGIONS=1 makes this GPU strictly serial, so name a single edge id, not a cycle."
            exit 1
          fi
          MODE_CAP="$MODE"; [ "$MODE" = tail ] && MODE_CAP=smoke
          python3 research/modalities/gcp_fanout_rep.py plan --edge "$EDGE" --replicate "$REP" --pick 0 \
            --bucket "$BUCKET" --mode-for-cap "$MODE_CAP" --shell > /tmp/plan.env
          grep -vE '^ENV_' /tmp/plan.env | sed 's/^/  /'
          grep -vE '^ENV_' /tmp/plan.env >> "$GITHUB_ENV"
          echo "VM=${VM_PREFIX}${GITHUB_RUN_ID}" >> "$GITHUB_ENV"

      # ===================================================================================================
      # TAIL — $0 status. No VM.
      # ===================================================================================================
      - name: Tail (mode=tail — $0, NO VM)
        if: ${{ env.MODE == 'tail' }}
        run: |
          set -uo pipefail
          echo "=== unit ==="; echo "  $UNIT_ID"
          echo "=== live ${VM_PREFIX}* VMs ==="
          gcloud compute instances list --filter="name~^${VM_PREFIX}" \
            --format="table(name,zone,status,creationTimestamp)" 2>/dev/null || echo "  (none)"
          echo "=== unit objects in GCS ==="
          gcloud storage ls -l "$UNIT_URI/**" 2>/dev/null | sed 's/^/  /' || echo "  (nothing yet)"
          echo "=== phase ==="
          gcloud storage cat "$UNIT_URI/phase.txt" 2>/dev/null | sed 's/^/  /' || echo "  (no phase marker)"
          echo "=== last 25 wrapper log lines (carries the 120 s heartbeat + GPU counters) ==="
          gcloud storage cat "$UNIT_URI/run.log" 2>/dev/null | tail -25 | sed 's/^/  /' || echo "  (no log yet)"
          # ★ THE LEG'S OWN LOG, LIVE. It is shipped on the same 120 s heartbeat, so this is where
          # `Iteration n/2000` shows up — the one reading that makes a PROGRESS check possible between
          # commit markers, which are ~23 min apart in production (CLAUDE.md §4).
          for L in complex solvent; do
            echo "=== last 20 lines of the $L leg's own log ==="
            gcloud storage cat "$UNIT_URI/$L.log" 2>/dev/null | grep -aE 'Iteration|timing|barrier|Error|Exception' \
              | tail -20 | sed 's/^/  /' || echo "  (not started, or nothing shipped yet)"
          done

      # ===================================================================================================
      # FORENSIC — $0, no VM. Everything mode=tail cannot show: the DERIVED per-leg checkpoint census, the
      # driver's own target line, and the window of the leg log AROUND its last error rather than the tail
      # of the wrapper's. CLAUDE.md §4: a diagnosis needs the observation that discriminates, and
      # `run.log | tail -40` is a fixed window that happened not to contain one.
      # ===================================================================================================
      - name: Forensic (mode=forensic — $0, NO VM)
        if: ${{ env.MODE == 'forensic' }}
        run: |
          set -uo pipefail
          python3 research/modalities/gcp_fanout_rep.py plan --edge "$EDGE" --replicate "$REP" \
            --pick 0 --bucket "$BUCKET" --shell 2>/dev/null | grep -vE '^ENV_' > /tmp/plan.env
          UURI=$(sed -n 's/^UNIT_URI=//p' /tmp/plan.env)
          RECEPTOR=$(sed -n 's/^RECEPTOR=//p' /tmp/plan.env)
          echo "=== unit: $UURI ==="
          gcloud storage ls -l "$UURI/**" 2>/dev/null > /tmp/ls.txt || true
          echo "objects listed: $(grep -c 'gs://' /tmp/ls.txt || echo 0)"
          # ⚠ THE TARGET LINE IS FETCHED FIRST AND HANDED IN. Without it the census has no DENOMINATOR and
          # prints `pct: null` with "the driver's target line has not been read" — which is TRUE and reads
          # as a defect in the very diagnostic you ran to rule one out. `tick` always passes it; forensic
          # must too, or the two disagree about a lane that is fine.
          gcloud storage cat "$UURI/complex.log" 2>/dev/null > /tmp/complex.log || true
          TGT=$({ grep -aE 'warmup_target=' /tmp/complex.log || true; } | head -1)
          echo "=== DERIVED census (gcp_fanout_rep census; smoke prefix excluded) ==="
          echo "  targets from: ${TGT:-<no target line in complex.log>}"
          python3 research/modalities/gcp_fanout_rep.py census --json --targets-line "${TGT:-}" < /tmp/ls.txt
          echo "=== the two result JSONs the reduce needs ==="
          for L in complex solvent; do
            gcloud storage objects describe "$UURI/leg_${RECEPTOR}_${L}.json" \
              --format="value(name,size,updated)" 2>/dev/null || echo "  leg_${RECEPTOR}_${L}.json: ABSENT"
          done
          gcloud storage objects describe "$UURI/ddg.json" --format="value(name,size,updated)" 2>/dev/null \
            || echo "  ddg.json: ABSENT"
          # ⚠ EVERY PIPELINE ENDS `|| true`. GitHub runs `run:` under `bash -e`, this step sets `pipefail`,
          # and `grep … | head -20` makes grep die of SIGPIPE the moment head has its twenty lines — so the
          # pipeline "fails" and the step aborts HALFWAY THROUGH A DIAGNOSTIC. Measured 2026-08-01: the
          # first forensic run printed two sections, exited 2, and the four sections that carried the
          # actual failure evidence never ran. A diagnostic that stops early is worse than none, because
          # its silence reads as "nothing there".
          echo "=== driver target line + the rate lines it prints ==="
          { grep -aE 'warmup_target=|prod_target=|\[timing\]' /tmp/complex.log || true; } | head -20 | sed 's/^/  /'
          echo "=== system size / setup lines ==="
          { grep -aiE 'particles|atoms|n_replicas|n_windows|hybrid|solvat|padding|box' /tmp/complex.log || true; } \
            | head -30 | sed 's/^/  /'
          echo "=== every line mentioning CUDA / nvidia / memory / device ==="
          { grep -aniE 'cuda|nvidia|out of memory|device|Xid|OpenMMException' /tmp/complex.log || true; } \
            | head -40 | sed 's/^/  /'
          echo "=== the 40 lines BEFORE the traceback (what the leg was doing when it died) ==="
          N=$({ grep -an 'Traceback' /tmp/complex.log || true; } | head -1 | cut -d: -f1)
          if [ -n "${N:-}" ]; then
            S=$(( N > 40 ? N - 40 : 1 )); sed -n "${S},${N}p" /tmp/complex.log | sed 's/^/  /' || true
          else echo "  (no traceback in complex.log)"; fi
          echo "=== cuda_probe.log (the boot-time probe that PASSED) ==="
          { gcloud storage cat "$UURI/cuda_probe.log" 2>/dev/null || echo "  (none)"; } | sed 's/^/  /'
          echo "=== run.log around the failure (the wrapper's view) ==="
          { gcloud storage cat "$UURI/run.log" 2>/dev/null || true; } | tail -25 | sed 's/^/  /'

      # ===================================================================================================
      # PROVISION — smoke and run share one create; they differ in the startup script and the cap.
      # ===================================================================================================
      - name: Provision an L4 and run (mode=smoke | mode=run)
        if: ${{ env.MODE == 'smoke' || env.MODE == 'run' }}
        run: |
          set -eo pipefail
          IMG_FAMILY=$(gcloud compute images list --project=deeplearning-platform-release \
            --filter="family~'^common-cu'" --format="value(family)" --sort-by=~creationTimestamp 2>/dev/null | head -1)
          [ -z "$IMG_FAMILY" ] && { echo "::error::no DLVM CUDA image family"; exit 1; }
          echo "image=$IMG_FAMILY mode=$MODE unit=$UNIT_ID maxrun=$MAXRUN"

          # ---- REFUSE TO BUY WHAT IS ALREADY BOUGHT --------------------------------------------------
          # The idempotent skip lives HERE, on the control plane, not on the VM. gcp-gpu-facts.md §6c layer 4:
          # a redundant dispatch that buys an L4 and then skips after ~37 s is the ONE shape both reapers
          # deliberately spare (so a real force is never destroyed), so not making the purchase is the only
          # fix that does not weaken a reaper.
          if [ "$MODE" = run ] && [ "$FORCE" != 1 ]; then
            if gcloud storage objects describe "gs://$BUCKET/$RESULT_KEY" --format="value(name)" >/dev/null 2>&1; then
              echo "::notice title=S1F-REP SKIP::$UNIT_ID already has a ddg.json in GCS — not provisioning. Pass force=1 to overwrite."
              echo "SKIPPED=1" >> "$GITHUB_ENV"; exit 0
            fi
          fi

          # ---- REFUSE TO BUY A SECOND GPU ------------------------------------------------------------
          # GPUS_ALL_REGIONS=1 is the binding cap (gcp-gpu-facts.md #1) and is NOT readable by this service
          # account (§1d: project-info describe returns rc=2 for gpu-runner@). So the freeness check rests on
          # `instances list` — quota can only be held by an instance — which does work.
          LIVE=$(gcloud compute instances list --filter="status:(RUNNING PROVISIONING STAGING REPAIRING)" \
                   --format="value(name)" 2>/dev/null | wc -l | tr -d ' ')
          if [ "${LIVE:-0}" != 0 ]; then
            echo "::error::$LIVE instance(s) already live — GPUS_ALL_REGIONS=1 means at most ONE GPU on this account. Not provisioning."
            gcloud compute instances list --format="table(name,zone,status,creationTimestamp)" 2>/dev/null || true
            exit 1
          fi

          # ---- REFUSE TO BUY WITHOUT INPUTS ----------------------------------------------------------
          # A VM that boots, finds no staged tree and dies still holds the single GPU for its whole boot.
          for F in ligand/docked_${RECEPTOR}.sdf receptor/${RECEPTOR}-opened.pdb; do
            gcloud storage objects describe "$STAGE_URI/$F" --format="value(size)" >/dev/null 2>&1 || {
              echo "::error::$STAGE_URI/$F is missing — run mode=mirror first (it is \$0 and takes seconds)."; exit 1; }
          done
          echo "staged inputs present under $STAGE_URI"

          if [ "$PROVISIONING" = standard ]; then
            PROV_FLAGS="--provisioning-model=STANDARD --instance-termination-action=DELETE"
          else
            PROV_FLAGS="--provisioning-model=SPOT --instance-termination-action=DELETE"
          fi
          # ⚠ --instance-termination-action is REQUIRED whenever --max-run-duration is set, for BOTH spot and
          # standard (gcp-gpu-facts.md §3 — omitting it on the standard branch silently broke on-demand for
          # months and was mislabelled "stocked out"). Both branches carry it above; the test pins that.

          # ---- the VM's startup script ---------------------------------------------------------------
          {
            echo '#!/bin/bash'
            echo 'set -uo pipefail'
            for V in UNIT_URI STAGE_URI CKPT_URI IMAGE RECEPTOR GITREF BUCKET \
                     EDGE_ID LEG_ID FRAME REPLICATE SEED N_WINDOWS; do
              printf "%s='%s'\n" "$V" "$(eval printf '%s' "\"\${$V:-}\"")"
            done
            echo "MACHINE_TYPE='g2-standard-8'"
            echo "SMOKE='$([ "$MODE" = smoke ] && echo 1 || echo 0)'"
            cat research/compute/s1f_rep_gcp_startup.sh
          } > /tmp/startup.sh
          # The leg env is generated by gcp_fanout_rep.plan (which delegates to congeneric_fanout.unit_env)
          # and handed to `docker run --env-file`. Nothing about the science is typed in YAML.
          # ⚠ NO `export ` PREFIX. docker's --env-file parser splits on the FIRST `=`, so `export FOO=1`
          # sets a variable literally named `export FOO` and FOO itself is never set — the engine would then
          # run on its defaults (LEG=complex, no SEED, no commit store) and report a confident wrong-unit
          # result. Plain KEY=VALUE, pinned by tests/test_gcp_fanout_rep.py.
          grep -E '^ENV_COMPLEX_' /tmp/plan.env | sed 's/^ENV_COMPLEX_//' > /tmp/env.complex
          grep -E '^ENV_SOLVENT_' /tmp/plan.env | sed 's/^ENV_SOLVENT_//' > /tmp/env.solvent
          echo "=== complex leg env (from congeneric_fanout.unit_env) ==="; sed 's/^/  /' /tmp/env.complex

          LABELS="lane=s1frep,s1f-edge=${EDGE_ID},s1f-rep=${REPLICATE},s1f-mode=${MODE}"
          OK=0
          for Z in "$ZONE" us-central1-b us-central1-c us-central1-f; do
            # us-central1 ONLY — quota exists nowhere else (CLAUDE.md §6). Never add another region.
            if gcloud compute instances create "$VM" \
                --zone="$Z" --machine-type=g2-standard-8 \
                $PROV_FLAGS \
                --max-run-duration="$MAXRUN" --maintenance-policy=TERMINATE --no-restart-on-failure \
                --labels="$LABELS" --scopes=cloud-platform \
                --image-family="$IMG_FAMILY" --image-project=deeplearning-platform-release \
                --boot-disk-size=150GB \
                --metadata-from-file=startup-script=/tmp/startup.sh,s1f-env-complex=/tmp/env.complex,s1f-env-solvent=/tmp/env.solvent \
                --metadata=s1f-unit-id="$UNIT_ID" 2>/tmp/cerr; then
              echo "ZONE=$Z" >> "$GITHUB_ENV"; ZONE="$Z"; OK=1
              echo "provisioned g2-standard-8 in $Z (cap $MAXRUN)"; break
            fi
            echo "  create failed [$Z]: $(grep -iE 'ERROR|exhausted|quota|exceeded|Invalid|required|termination' /tmp/cerr | head -1 | sed 's/^ *//')"
          done
          [ "$OK" = 1 ] || { echo "::error::L4 create failed in every us-central1 zone — see the real gcloud errors above (a malformed request says Invalid/required; genuine capacity says ZONE_RESOURCE_POOL_EXHAUSTED)"; exit 1; }
          echo "VM_LIVE=1" >> "$GITHUB_ENV"

          # ---- THE LAUNCH LEDGER, WRITTEN ONLY AFTER THE CREATE SUCCEEDED --------------------------------
          # `gcp_fanout_rep.next_attempt` decides what it says: the counter RESETS when the store proves the
          # previous launch banked a new generation, and increments when it did not. That is what makes the
          # no-progress breaker a measurement of PROGRESS rather than a count of tries — and writing it here,
          # after the create, means a run that never bought anything never charges the breaker.
          # It lives in GCS beside the unit, not in the repo: the feeder must be able to read it on a cold
          # runner with no checkout state, and a durable object is the only thing both sides can see.
          if [ -s /tmp/next_attempt.json ]; then
            gcloud storage cp /tmp/next_attempt.json "$UNIT_URI/attempts.json" >/dev/null 2>&1 \
              && echo "launch ledger updated: $(cat /tmp/next_attempt.json)" \
              || echo "::warning::could not write $UNIT_URI/attempts.json — the breaker will under-count"
          fi

      - name: Watch the smoke to its terminus (mode=smoke only)
        if: ${{ env.MODE == 'smoke' && env.VM_LIVE == '1' }}
        run: |
          set -uo pipefail
          # A PROGRESS check, not a liveness ping (CLAUDE.md §4): the phase marker must MOVE, and every
          # transition is stamped with the elapsed seconds so the NEXT run's window is sized from a
          # measurement rather than from a guess. (The first smoke burned 300 s waiting for a docker that
          # did not exist; nothing in the readout said which stage was slow, which is why this prints.)
          # 80 x 45 s = 60 min against a 90-min job timeout: the bootstrap now installs docker AND the
          # NVIDIA container toolkit AND pulls a multi-GB image before any MD starts, and a watcher that
          # gives up two minutes early destroys a smoke that was about to pass.
          T0=$(date +%s); LAST="__init__"; DONE=0
          for i in $(seq 1 80); do
            sleep 45
            P=$(gcloud storage cat "$UNIT_URI/smoke/phase.txt" 2>/dev/null | tail -1 || echo "")
            S=$(gcloud compute instances describe "$VM" --zone="$ZONE" --format="value(status)" 2>/dev/null || echo GONE)
            EL=$(( $(date +%s) - T0 ))
            if [ "$P" != "$LAST" ]; then echo "  [+${EL}s] PHASE -> '${P:-<none>}' (status=$S)"; LAST="$P"
            else echo "  [+${EL}s] status=$S phase unchanged"; fi
            case "$P" in *SMOKE-OK*) DONE=1; break ;; *SMOKE-FAIL*) DONE=2; break ;; esac
            [ "$S" = GONE ] || [ "$S" = TERMINATED ] && { echo "  VM gone"; break; }
          done
          echo "  watched for $(( ($(date +%s) - T0) / 60 )) min"
          echo "=== smoke log ==="
          gcloud storage cat "$UNIT_URI/smoke/run.log" 2>/dev/null | tail -80 | sed 's/^/  /' || echo "  (no log)"
          gcloud compute instances delete "$VM" --zone="$ZONE" --quiet 2>/dev/null && echo "smoke VM deleted" || echo "smoke VM delete no-op"
          [ "$DONE" = 1 ] || { echo "::error::smoke did not reach SMOKE-OK — do NOT launch the real leg until it does"; exit 1; }
          echo "::notice title=S1F-REP SMOKE OK::image + CUDA-in-docker + GCS stage read + GCSCommitStore write all proven on the L4"

      # ===================================================================================================
      # THE IN-FLIGHT FRAGMENT — published on EVERY dispatch, in EVERY outcome, including failure.
      # ★ AN IDLE LANE SAYS SO. A lane that publishes only while busy reads as finished when it is merely
      # stopped, which is precisely what inflight_board's lane registry exists to prevent. (That registry
      # now carries this lane's entry, so the fragment is merged and rendered.)
      #
      # ⚠ IT PUBLISHES THE WHOLE QUEUE, NOT THE UNIT IN FRONT OF IT. Rendering only `$EDGE` made a
      # three-unit programme look like a one-unit job that had stopped, and gave a reader no way to see the
      # two waiting behind it — which is exactly what nobody noticed was not being fed. `tick` reads every
      # unit's ddg.json, committed-checkpoint census and launch ledger, so the % DONE and ETA cells are
      # DERIVED here rather than left blank.
      # ===================================================================================================
      - name: Publish the in-flight fragment (always — an idle lane says so)
        if: ${{ always() && env.MODE != 'mirror' }}
        env:
          # ⚠ BOTH DERIVED FILES ARE REGENERATED AFTER THE RESET, NEVER STAMPED FROM THIS CHECKOUT.
          #   • gcp-gpu-facts.md §1e — `rate --sync-doc` rewrites only the bytes between the
          #     GCP-S1F-REP-RATE-TABLE fences and fails closed unless it finds exactly one well-ordered
          #     pair, so the staged diff can only ever be the generated block. Stamping the file instead
          #     would revert hand edits to §1f/§3b, both made by hand the morning this was written. It is
          #     regenerated in the same commit that moves the artifact it quotes, because when that was
          #     left to a human CI went red 3 min 41 s after the last hand regeneration.
          #   • inflight-board-all.md — DERIVED IN FULL from every lane's fragment, so a post-reset merge
          #     reads upstream's freshest ternary / step1 / nrv04-retro fragments plus ours. Merging
          #     pre-reset would roll back three sibling lanes' rows — a fix for one lane's false staleness
          #     turned into three lanes' real staleness.
          # ⚠ `;` NOT `|| true &&`. The old form swallowed a `rate --sync-doc` failure entirely — its exit
          # code went to `|| true`, so a doc that FAILED to sync was indistinguishable from one already
          # current, and §1e could drift into a red build with nothing in the log saying so. Now each part
          # runs and reports for itself, and the primitive keeps their output.
          PUBLISH_REGEN: >-
            { [ -f research/modalities/gcp-s1f-rep-rate.json ] &&
            python3 research/modalities/gcp_fanout_rep.py rate --sync-doc ; } ;
            python3 research/modalities/inflight_board.py --write
          PUBLISH_REGEN_ADD: research/compute/gcp-gpu-facts.md research/modalities/inflight-board-all.md
        run: |
          set -uo pipefail
          # A SECOND tick, deliberately: run after the create, it sees the VM the autofeed step just bought
          # and renders RUNNING off the instance list — evidence, not the intent the earlier pass had.
          python3 research/modalities/gcp_fanout_rep.py tick --bucket "$BUCKET" --vm-prefix "$VM_PREFIX" \
            > /tmp/publish.env || echo "::warning::tick failed; publishing whatever fragment exists"
          sed 's/^/  /' /tmp/publish.env || true
          # ⛔ ONE HOME FOR THE PUBLISH. This step already rewrote onto upstream rather than merging — it was
          # written after `git pull --rebase` hit a conflict here (run 30701290485), left the rebase
          # MID-CONFLICT, and `git push HEAD:main` then pushed the upstream commit back to itself: a no-op
          # that exits 0 while the step printed "fragment published" and main's fragment stayed 67 s old.
          # What it did NOT have is the second half: it stamped its two files whether or not this run wrote
          # them. Measured on the sibling lane 2026-08-01 — a selcal `status` tick republished a `collect`
          # artifact seven seconds after it was measured, taking `landed: 5` back to `landed: 0` with a
          # three-hour-old timestamp, with nothing red anywhere.
          # ⚠ NO PUBLISH_IF_CHANGED. This fragment IS the lane's heartbeat and the only input to
          # `_As of … STALE (> 15 min)`, so a tick that changed no bytes must still leave a dated commit.
          bash research/compute/publish_artifacts.sh "${GITHUB_REF_NAME}" \
            "gcp s1f-rep lane: in-flight fragment (CI)" \
            research/modalities/inflight-board.d/gcp-s1f-rep.json \
            research/modalities/gcp-s1f-rep-rate.json

      - name: Detached launch summary (mode=run)
        if: ${{ env.MODE == 'run' && env.VM_LIVE == '1' }}
        run: |
          echo "::notice title=S1F-REP LAUNCHED::$UNIT_ID on $VM ($ZONE), cap $MAXRUN, \$0 real dollars (GCP trial credit)."
          echo "Teardown, in order of how little must be alive:"
          echo "  1. --max-run-duration=$MAXRUN + --instance-termination-action=DELETE — enforced by GCE, needs nothing."
          echo "  2. this workflow's reap step, which runs FIRST on every dispatch of any mode (and hourly)."
          echo "  3. per-leg idempotence + the GCS commit store — a boundary costs latency, never sampling."
          echo "Monitor: gpu-fanout-rep-gcp.yml mode=tail"
