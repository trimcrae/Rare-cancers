name: Verify release candidate (full preflight)

# An explicit release-branch push requests verification of that exact commit.
# This workflow uploads evidence only; it cannot publish a paper or write repository contents.
on:
  push:
    branches: ['codex/release/*']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: verify-release-${{ github.sha }}
  cancel-in-progress: false

jobs:
  verify:
    if: startsWith(github.ref, 'refs/heads/codex/release/')
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: scripts/dev-setup.sh

      - name: Install the existing full-gate dependencies
        run: |
          set -euo pipefail
          python3 -m pip install --quiet --disable-pip-version-check uv
          ./scripts/dev-setup.sh --if-needed

      - name: Run the actual unscoped full preflight
        shell: bash
        env:
          PINNED_SHA: ${{ github.sha }}
          PREFLIGHT_FULL: '1'
        run: |
          set -euo pipefail
          log="$RUNNER_TEMP/preflight-full.log"
          printf 'PINNED_SHA=%s\nACTUAL_SHA=%s\n' "$PINNED_SHA" "$(git rev-parse HEAD)" > "$log"
          cat "$log"
          if [ "$(git rev-parse HEAD)" != "$PINNED_SHA" ]; then
            printf 'Pinned checkout mismatch\nEXIT=1\n' >> "$log"
            cat "$log"
            exit 1
          fi
          set +e
          ./scripts/preflight.sh 2>&1 | tee -a "$log"
          # Preserve both exits before another command overwrites PIPESTATUS.
          pipeline_status=("${PIPESTATUS[@]}")
          set -e
          rc="${pipeline_status[0]}"
          if [ "${pipeline_status[1]}" -ne 0 ]; then
            printf 'Verification log capture failed (tee exit %s)\n' "${pipeline_status[1]}" >&2
            if [ "$rc" -ne 0 ]; then
              exit "$rc"
            fi
            exit "${pipeline_status[1]}"
          fi
          log_rc=0
          printf '\nEXIT=%s\n' "$rc" | tee -a "$log" || log_rc=$?
          if [ "$rc" -eq 0 ]; then
            rc="$log_rc"
          fi
          exit "$rc"

      - name: Preserve the complete verification log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: full-preflight-${{ github.sha }}
          path: ${{ runner.temp }}/preflight-full.log
          if-no-files-found: error
          retention-days: 30
