name: Verify external references

# Reviewer-grade verification of claims we cannot check offline (the egress allowlist blocks
# Crossref/EuropePMC from the dev sandbox; CI has full internet). Verifies external DOIs via
# Crossref, pulls Bangerter 2023 full text from Europe PMC to confirm the named drugs, and
# searches for primary pazopanib/sunitinib EMC reports. Prints to the run log; commits nothing.

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Verify DOIs, Bangerter full text, and pazopanib/sunitinib EMC reports
        run: |
          set +e
          # CENSUS THE OUTCOME, don't just print it. This step is `set +e` with no failure path: every curl
          # here can time out or hit a Crossref/Europe PMC outage, the node one-liners then print PARSE-ERR or
          # an undefined DOI, and the job still ends GREEN. A green "Verify external references" run is exactly
          # the kind of thing whose conclusion gets trusted — so a run where most lookups silently returned
          # nothing must not be indistinguishable from one where they all resolved. Mirror stdout to a file and
          # count the failure markers at the end. (Same defect class as the ternary-lane guards audited in
          # research/modalities/ternary-lane-guard-audit-2026-07-25.md, section D: a verdict readable only by
          # excavating the log is a verdict nobody checks.)
          # Save the REAL stdout/stderr on fds 3/4 first. Both 1 and 2 are about to point at the same tee, so
          # without a saved copy there is nothing left to restore them to — `exec 1>&2` would just re-point
          # stdout at the tee, the tee's stdin would never close, and the wait below would hang forever.
          exec 3>&1 4>&2
          exec > >(tee /tmp/verify.log) 2>&1
          echo "===== 1) Crossref: DOI -> title / journal / year ====="
          # ⛔ THE EXPECTED COUNT IS DERIVED FROM THIS LIST, NEVER TYPED (CLAUDE.md rule 1: "a total is
          # DERIVED, never typed"). It used to be a literal `6` in three places in the verdict below, and the
          # comment there called the list "FIXED" — which was true only until someone added a DOI. Registering
          # the 7th entry while the verdict still demanded 6 would leave a gate that goes GREEN while measuring
          # one fewer reference than the list actually contains: the exact "reports while measuring nothing
          # actionable" defect this job's own header was written about. Adding a DOI is now a ONE-LINE change.
          FIXED_DOIS=(
            "10.1038/s41591-024-03233-x#TxGNN (expect: foundation model, clinician-centered drug repurposing; Nat Med 2024)"
            "10.1016/S0140-6736(23)02268-7#KEYNOTE-942 (expect: mRNA-4157/V940 + pembrolizumab, melanoma; Lancet 2024)"
            "10.1038/s12276-023-01086-x#LNP review (expect: immunogenicity of lipid nanoparticles; Exp Mol Med 2023)"
            "10.1093/nar/gkaa1084#DGIdb (expect: Drug-Gene Interaction Database 4.0; NAR 2021)"
            "10.1093/nar/gkz1029#AFND 2020 (expect: Allele Frequency Net Database 2020 update; NAR 2020)"
            "10.1186/1471-2105-7-153#IEDB population coverage (expect: Bui 2006, T-cell epitope population coverage; BMC Bioinformatics 2006)"
            # EV-EB-TCIP-2025 — the RT-TCIP route's ONLY cited source. Added 2026-08-06 because the route memo
            # (research/modalities/nr4a3-tcip-route-memo.md section 6) measured `grep -c "jacs.5c05634"` -> 0
            # here, i.e. the repo's stated gate ("must clear verify-refs before any manuscript quotes it") could
            # not be cleared by dispatching verify-refs at all. Filed in THIS list rather than section 8a
            # because section 8a is print-only and degrader-scoped: only section 1 is enforced by the verdict.
            "10.1021/jacs.5c05634#EV-EB-TCIP-2025 (expect: Rewiring the fusion oncoprotein EWSR1::FLI1 in Ewing sarcoma with bivalent small molecules; J Am Chem Soc 2025, 147(49):44739-44758; PMC12851799)"
            # PUB-VACCINE-PATH's reference list, added 2026-08-22 at round 1 of its hardening cycle.
            # ⛔ WHY EACH IS HERE. The vaccine paper shipped two entries reading literally
            # "[citation to verify]" and a third — its class II predictor — with no bibliographic record
            # anywhere in this repository, while its Methods depended on all three. A reference a gate
            # cannot see is not a reference, and this list is the gate.
            "10.1016/j.modpat.2023.100161#Huang 2023 (expect: EMC, TAF15::NR4A3 significance; Mod Pathol 2023, 58-case molecular series)"
            "10.1016/S1470-2045(19)30319-5#Stacchiotti 2019 pazopanib (expect: single-arm phase 2 in advanced EMC; Lancet Oncol 2019)"
            "10.1016/j.ejca.2014.03.013#Stacchiotti 2014 sunitinib (expect: activity of sunitinib in EMC; Eur J Cancer 2014)"
            "10.3389/fcell.2021.763875#glycogenes (expect: TITLE MUST NAME PLACENTA AND COLORECTAL CANCER; Front Cell Dev Biol 2021)"
            "10.1007/s13577-025-01250-7#NCC-EMC1-C1 (expect: patient-derived EMC cell line; Human Cell 2025)"
            "10.1007/s13577-022-00818-x#Bangerter 2023 (expect: two ex vivo EMC cell models; Human Cell 2023)"
            "10.1007/s00432-025-06316-5#Remiszewski 2025 (expect: comprehensive EMC review; J Cancer Res Clin Oncol 2025)"
            "10.1136/jitc-2020-001561#IMMUNOSARC I (expect: nivolumab + sunitinib phase Ib/II in STS; J Immunother Cancer 2020)"
            "10.1200/JCO.2025.43.16_suppl.11513#IMMUNOSARC II EMC (expect: ASCO 2025 abstract 11513; CONFERENCE ABSTRACT, not a full paper)"
            "10.1016/j.cels.2020.09.001#MHCflurry 2.0 (expect: pan-allele MHC-I presentation prediction; Cell Systems 2020)"
          )
          NFIXED=${#FIXED_DOIS[@]}
          for entry in "${FIXED_DOIS[@]}"; do
            doi="${entry%%#*}"; note="${entry#*#}"
            echo "  DOI $doi"
            echo "    expect: $note"
            curl -s -m 30 -A "rare-cancers-verify/1.0 (mailto:trimcrae@gmail.com)" "https://api.crossref.org/works/$doi" \
              | node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>{try{const m=JSON.parse(s).message;console.log("    crossref: "+((m.title||[])[0]||"?")+" | "+((m["container-title"]||[])[0]||"?")+" | "+(((m.published||m.issued||{})["date-parts"]||[[ "?" ]])[0][0]));}catch(e){console.log("    PARSE-ERR "+s.slice(0,80))}})'
          done
          echo
          echo "===== 2) Bangerter 2023 (PMC9813045) full text — try multiple sources ====="
          echo "  -- 2a) PMC open-access service (is full text freely available?) --"
          curl -s -m 30 "https://www.ncbi.nlm.nih.gov/pmc/utils/oa/oa.fcgi?id=PMC9813045" | head -c 500; echo
          echo "  -- 2b) Europe PMC isOpenAccess flag --"
          curl -s -m 30 "https://www.ebi.ac.uk/europepmc/webservices/rest/search?query=PMC9813045&format=json&resultType=core" \
            | node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>{try{const r=JSON.parse(s).resultList.result[0]||{};console.log("    isOpenAccess:",r.isOpenAccess,"| inEPMC:",r.inEPMC,"| inPMC:",r.inPMC,"| hasTextMinedTerms:",r.hasTextMinedTerms);}catch(e){console.log("    parse-err",s.slice(0,120))}})'
          echo "  -- 2c) NCBI efetch PMC XML --"
          curl -s -m 60 "https://eutils.ncbi.nlm.nih.gov/entrez/eutils/efetch.fcgi?db=pmc&id=9813045&rettype=xml" -o b.xml
          echo "    bytes: $(wc -c < b.xml)"
          for drug in venetoclax carfilzomib doxorubicin bortezomib panobinostat romidepsin brigatinib synerg; do
            n=$(grep -io "$drug" b.xml | wc -l); [ "$n" -gt 0 ] && echo "    $drug: $n"
          done
          echo "    sentences naming the drugs:"; grep -ioE "[^.<>]*\b(venetoclax|carfilzomib|doxorubicin)\b[^.<>]*" b.xml | sed 's/<[^>]*>//g' | sort -u | head -10
          echo "  -- 2d) Europe PMC text-mined chemicals for PMC9813045 --"
          curl -s -m 30 "https://www.ebi.ac.uk/europepmc/webservices/rest/PMC9813045/textMinedTerms?format=json" \
            | node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>{try{const j=JSON.parse(s);const ch=((j.semanticTypeList&&j.semanticTypeList.semanticType)||[]).find(t=>/chem/i.test(t.name));console.log("    chemicals:",ch?ch.tmSummary.map(x=>x.term).join(", "):"none/none-OA");}catch(e){console.log("    none/parse-err")}})'
          echo
          echo "===== 3) Europe PMC: primary pazopanib/sunitinib EMC reports ====="
          curl -s -m 40 -G "https://www.ebi.ac.uk/europepmc/webservices/rest/search" \
            --data-urlencode 'query="extraskeletal myxoid chondrosarcoma" AND (pazopanib OR sunitinib OR anti-angiogenic OR antiangiogenic)' \
            --data-urlencode 'format=json' --data-urlencode 'pageSize=25' --data-urlencode 'resultType=lite' -o pz.json
          echo "  raw head: $(head -c 120 pz.json)"
          node -e 'const fs=require("fs");try{const j=JSON.parse(fs.readFileSync("./pz.json","utf8"));console.log("  hitCount:",j.hitCount);const r=(j.resultList&&j.resultList.result)||[];r.forEach(x=>console.log("   ",(x.pmid||x.id||"?"),"|",x.pubYear||"?","|",(x.title||"").replace(/\s+/g," ").slice(0,95)));}catch(e){console.log("  PARSE-ERR",e.message)}'
          echo
          echo "===== 4) Crossref bibliographic search: resolve DOIs for novel-modalities refs ====="
          # Find the DOI for each cited title so the manuscript can cite verified DOIs (not memorised ones).
          while IFS='#' read -r q note; do
            [ -z "$q" ] && continue
            echo "  query: $q"
            echo "    expect: $note"
            curl -s -m 30 -A "rare-cancers-verify/1.0 (mailto:trimcrae@gmail.com)" -G "https://api.crossref.org/works" \
              --data-urlencode "query.bibliographic=$q" --data-urlencode "filter=type:journal-article" --data-urlencode "rows=3" \
              | node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>{try{const items=JSON.parse(s).message.items||[];const m=items.find(x=>!/Faculty Opinions/i.test(((x["container-title"]||[])[0]||""))) || items[0] || {};console.log("    -> DOI:",m.DOI,"|",((m.title||[])[0]||"?").slice(0,80),"|",((m["container-title"]||[])[0]||"?"),"|",(((m.published||m.issued||{})["date-parts"]||[["?"]])[0][0]));}catch(e){console.log("    PARSE-ERR")}})'
          done <<'REFS'
          Structure and function of Nurr1 identifies a class of ligand-independent nuclear receptors#Wang 2003 Nature, Nurr1 LBD no classical pocket
          Cancer-specific retargeting of BAF complexes by a prion-like domain#Boulay 2017 Cell, EWS-FLI1 prion-like domain
          Phase transition of a disordered nuage protein generates environmentally responsive membraneless organelles#Kwon 2013 Cell, low-complexity domain phase transition
          Highly accurate protein structure prediction with AlphaFold#Jumper 2021 Nature, AlphaFold
          AlphaFold Protein Structure Database massively expanding the structural coverage of protein-sequence space#Varadi 2022 NAR, AFDB
          Fpocket an open source platform for ligand pocket detection#Le Guilloux 2009 BMC Bioinformatics
          MHCflurry 2.0 improved pan-allele prediction of MHC class I-presented peptides#O'Donnell 2020 Cell Systems
          PROTAC targeted protein degraders the past is prologue#Bekes Crews 2022 Nat Rev Drug Discov
          The dTAG system for immediate and target-specific protein degradation#Nabet 2018 Nat Chem Biol
          Antisense technology an overview and prospectus#Crooke 2021 Nat Rev Drug Discov
          MHCnuggets deep neural network prediction of peptide-MHC binding#the class II predictor behind PUB-VACCINE-PATH's B4; NO bibliographic record exists in this repository, so this query is the only way that reference can be written without inventing it
          REFS
          echo
          echo "===== 5) Targeted resolution for the 2 stragglers (author + title; print top 5) ====="
          # Boulay 2017 Cell and Jumper 2021 Nature returned near-title decoys (an AACR
          # abstract; a 2023 assembly paper). Constrain by author + title and print the
          # top journal-article candidates with container + year so the right DOI is picked.
          while IFS='#' read -r title author note; do
            [ -z "$title" ] && continue
            echo "  >>> $note"
            echo "      title=\"$title\" author=\"$author\""
            curl -s -m 30 -A "rare-cancers-verify/1.0 (mailto:trimcrae@gmail.com)" -G "https://api.crossref.org/works" \
              --data-urlencode "query.bibliographic=$title" --data-urlencode "query.author=$author" \
              --data-urlencode "filter=type:journal-article" --data-urlencode "rows=5" \
              | node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>{try{const items=JSON.parse(s).message.items||[];items.forEach((m,i)=>console.log("      ["+i+"] DOI:",m.DOI,"|",((m.title||[])[0]||"?").slice(0,70),"|",((m["container-title"]||[])[0]||"?"),"|",(((m.published||m.issued||{})["date-parts"]||[["?"]])[0][0])))}catch(e){console.log("      PARSE-ERR")}})'
          done <<'STRAG'
          Cancer-specific retargeting of BAF complexes by a prion-like domain#Boulay#Boulay 2017 Cell (want container=Cell, year 2017, NOT an Abstract)
          Highly accurate protein structure prediction with AlphaFold#Jumper#Jumper 2021 Nature (want container=Nature, year 2021)
          STRAG
          echo
          echo "===== 6) Treatment-precedent refs for the personalised-immunotherapy framing ====="
          while IFS='#' read -r title author note; do
            [ -z "$title" ] && continue
            echo "  >>> $note"
            curl -s -m 30 -A "rare-cancers-verify/1.0 (mailto:trimcrae@gmail.com)" -G "https://api.crossref.org/works" \
              --data-urlencode "query.bibliographic=$title" --data-urlencode "query.author=$author" \
              --data-urlencode "filter=type:journal-article" --data-urlencode "rows=5" \
              | node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>{try{const items=JSON.parse(s).message.items||[];items.forEach((m,i)=>console.log("      ["+i+"] DOI:",m.DOI,"|",((m.title||[])[0]||"?").slice(0,72),"|",((m["container-title"]||[])[0]||"?"),"|",(((m.published||m.issued||{})["date-parts"]||[["?"]])[0][0])))}catch(e){console.log("      PARSE-ERR")}})'
          done <<'TREAT'
          Individualised neoantigen therapy mRNA-4157 V940 plus pembrolizumab in resected melanoma#Weber#mRNA-4157/KEYNOTE-942 melanoma (Lancet 2024)
          Personalized RNA neoantigen vaccines stimulate T cells in pancreatic cancer#Rojas#autogene cevumeran, pancreatic (Nature 2023)
          TREAT
          echo
          echo "===== 7) NR4A3 DEGRADER manuscript refs (verify cited IDs + resolve [to-confirm]) ====="
          echo "  -- 7a) Europe PMC core for cited PMIDs/PMCIDs (author | title | journal | year | DOI) --"
          for id in 30664630 30416039 17515897 PMC6341107 PMC7864866 PMC4535767 PMC8006468 PMC7565926; do
            echo -n "    $id -> "
            curl -s -m 30 -G "https://www.ebi.ac.uk/europepmc/webservices/rest/search" \
              --data-urlencode "query=$id" --data-urlencode "format=json" --data-urlencode "resultType=core" \
              | node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>{try{const r=JSON.parse(s).resultList.result[0]||{};console.log((r.authorString||"?").split(",")[0],"|",(r.title||"?").slice(0,66),"|",((r.journalInfo||{}).journal||{}).title||r.bookOrReportDetails||"?","|",r.pubYear||"?","| DOI:",r.doi||"?");}catch(e){console.log("parse-err")}})'
          done
          echo "  -- 7b) Crossref resolve the [to-confirm] titles to DOI | journal | year --"
          while IFS='#' read -r q note; do
            [ -z "$q" ] && continue
            echo "    [$note]"
            curl -s -m 30 -A "rare-cancers-verify/1.0 (mailto:trimcrae@gmail.com)" -G "https://api.crossref.org/works" \
              --data-urlencode "query.bibliographic=$q" --data-urlencode "filter=type:journal-article" --data-urlencode "rows=2" \
              | node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>{try{const m=(JSON.parse(s).message.items||[])[0]||{};console.log("      -> DOI:",m.DOI,"|",((m.title||[])[0]||"?").slice(0,72),"|",((m["container-title"]||[])[0]||"?"),"|",(((m.published||m.issued||{})["date-parts"]||[["?"]])[0][0]));}catch(e){console.log("      PARSE-ERR")}})'
          done <<'NR4A'
          In Silico Adoption of an Orphan Nuclear Receptor NR4A1#PMC4535767 Nur77 cryptic pocket MD
          Assessment of NR4A Ligands that Directly Bind and Modulate the Orphan Nuclear Receptor Nurr1#Munoz-Tello amodiaquine NMR
          Oncogenic orphan nuclear receptor NR4A3 interacts and cooperates with MYB in acinic cell carcinoma#Haller 2020 NR4A3-MYB AciCC
          NR4A transcription factors limit CAR T cell function in solid tumours#Chen 2019 Nature triple-NR4A
          NR4A

          # ---- verdict ----------------------------------------------------------------------------------
          # Restore the saved descriptors: that closes the tee's stdin, so it flushes and exits. Then wait for
          # it (bash tracks the process-substitution child) with a short settle as a belt-and-braces flush.
          exec 1>&3 2>&4
          wait 2>/dev/null || true
          sleep 1
          LOG=/tmp/verify.log
          NPARSE=$(grep -c 'PARSE-ERR' "$LOG" 2>/dev/null | tr -dc '0-9'); NPARSE=$((10#${NPARSE:-0}))
          NUNDEF=$(grep -cE '\-> DOI: (undefined|\?)$|DOI: undefined' "$LOG" 2>/dev/null | tr -dc '0-9'); NUNDEF=$((10#${NUNDEF:-0}))
          NRESOLVED=$(grep -cE 'DOI: 10\.' "$LOG" 2>/dev/null | tr -dc '0-9'); NRESOLVED=$((10#${NRESOLVED:-0}))
          NCROSSREF=$(grep -c 'crossref: ' "$LOG" 2>/dev/null | tr -dc '0-9'); NCROSSREF=$((10#${NCROSSREF:-0}))
          echo "reference-verification census: crossref_titles=$NCROSSREF dois_resolved=$NRESOLVED parse_errors=$NPARSE undefined_dois=$NUNDEF"
          # Section 1 has an ENUMERATED list of DOIs, so its expected count is knowable rather than inferred —
          # and it is read off `FIXED_DOIS` above rather than re-typed, so the two can never disagree.
          if [ "$NCROSSREF" -lt "$NFIXED" ]; then
            echo "::error title=VERIFY-REFS INCOMPLETE::Section 1 resolved only $NCROSSREF/$NFIXED enumerated DOIs — Crossref was unreachable or rate-limited for the rest. Do NOT treat this run as having verified anything; re-run before trusting the output."
            FAILED=1
          fi
          if [ "$NPARSE" -gt 0 ] || [ "$NUNDEF" -gt 0 ]; then
            echo "::warning title=VERIFY-REFS PARTIAL::$NPARSE parse error(s) and $NUNDEF unresolved DOI(s) — those specific references were NOT verified by this run. Check the log lines before flipping any citation's verified flag."
            grep -nE 'PARSE-ERR|DOI: undefined' "$LOG" | head -20
          fi
          if [ "${FAILED:-0}" = 1 ]; then exit 1; fi
          echo "::notice title=VERIFY-REFS OK::$NCROSSREF/$NFIXED enumerated DOIs resolved, $NRESOLVED DOI(s) resolved overall, no parse errors."
  # ---------------------------------------------------------------------------------------------
  # Section 8 was added 2026-07-25 for the degrader manuscript's mechanism-first prospective stage
  # (RUNG 5a/5b). It verifies (a) three journal DOIs the manuscript must cite, (b) the primary
  # citation of every PDB entry the E3 staging / transfer-anchor work consumed, and (c) the method
  # references for the new geometry kernels. It prints only; it commits nothing.
  verify-degrader-refs:
    runs-on: ubuntu-latest
    steps:
      - name: Crossref DOIs + RCSB primary citations for the RUNG 5a/5b additions
        run: |
          set +e
          UA="rare-cancers-verify/1.0 (mailto:trimcrae@gmail.com)"
          echo "===== 8a) Crossref: DOIs cited by name in the manuscript ====="
          for entry in \
            "10.1039/C8CC06140H#Zhang 2018 (expect: celastrol covalent engagement of NR4A1/Nur77 Cys; Chem Commun 2018)" \
            "10.1021/acs.jmedchem.4c01305#9CUO primary citation (expect: cereblon ligand; J Med Chem 2024)" \
            "10.1021/acsmedchemlett.4c00582#9GIO primary citation (expect: VHL/VH032-class ligand; ACS Med Chem Lett 2025)"; do
            doi="${entry%%#*}"; note="${entry#*#}"
            echo "  DOI $doi"; echo "    expect: $note"
            curl -s -m 30 -A "$UA" "https://api.crossref.org/works/$doi" \
              | node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>{try{const m=JSON.parse(s).message;console.log("    crossref: "+((m.title||[])[0]||"?")+" | "+((m["container-title"]||[])[0]||"?")+" | "+(((m.published||m.issued||{})["date-parts"]||[["?"]])[0][0])+" | vol "+(m.volume||"?")+" | p "+(m.page||"?")+" | authors: "+((m.author||[]).map(a=>(a.family||"")+" "+((a.given||"").split(/[\s-]+/).map(x=>x[0]||"").join(""))).join("; ")||"?"));}catch(e){console.log("    PARSE-ERR "+s.slice(0,120))}})'
          done
          echo
          echo "===== 8b) RCSB: entry title + primary citation for every consumed PDB entry ====="
          for pdb in 8R5H 9UUM 5T35 6BOY 9CUO 9GIO 8G46 8RQC 7Z76; do
            echo -n "  $pdb -> "
            curl -s -m 30 -A "$UA" "https://data.rcsb.org/rest/v1/core/entry/$pdb" \
              | node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>{try{const j=JSON.parse(s);const c=(j.citation||[]).find(x=>x.id==="primary")||(j.citation||[])[0]||{};console.log((j.struct||{}).title||"?","|| method:",((j.exptl||[])[0]||{}).method||"?","| res:",((j.rcsb_entry_info||{}).resolution_combined||["?"])[0],"|| PRIMARY:",(c.rcsb_authors||["?"])[0],"et al.,",c.title||"?","|",c.rcsb_journal_abbrev||"?",c.year||"?","| DOI:",c.pdbx_database_id_doi||"?","| PMID:",c.pdbx_database_id_pub_med||"?");}catch(e){console.log("PARSE-ERR "+s.slice(0,100))}})'
          done
          echo
          echo "===== 8c) Crossref bibliographic: method references for the new geometry kernels ====="
          while IFS='#' read -r title author note; do
            [ -z "$title" ] && continue
            echo "  >>> $note"
            curl -s -m 30 -A "$UA" -G "https://api.crossref.org/works" \
              --data-urlencode "query.bibliographic=$title" --data-urlencode "query.author=$author" \
              --data-urlencode "rows=4" \
              | node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>{try{const items=JSON.parse(s).message.items||[];items.forEach((m,i)=>console.log("      ["+i+"] DOI:",m.DOI,"|",((m.title||[])[0]||"?").slice(0,78),"|",((m["container-title"]||[])[0]||"?"),"|",(((m.published||m.issued||{})["date-parts"]||[["?"]])[0][0]),"| vol",m.volume||"?","| p",m.page||"?"))}catch(e){console.log("      PARSE-ERR")}})'
          done <<'METH'
          Environment and exposure to solvent of protein atoms lysozyme and insulin#Shrake#Shrake-Rupley 1973 JMB solvent-accessible surface
          LIGSITE automatic and efficient detection of potential small molecule binding sites in proteins#Hendlich#Hendlich 1997 LIGSITE pocket detection
          Closed-form solution of absolute orientation using unit quaternions#Horn#Horn 1987 JOSA A quaternion superposition
          Probability distributions in classical and continuum polymer models#Thirumalai#Thirumalai-Ha worm-like-chain end-to-end distribution
          Structural basis for protac-induced target protein degradation by recruitment of VHL and BRD4#Gadd#Gadd 2017 Nat Chem Biol MZ1 ternary (PDB 5T35)
          Plasticity in binding confers selectivity in ligand-induced protein degradation#Nowak#Nowak 2018 Nat Chem Biol dBET6 (PDB 6BOY)
          METH
          echo
          echo "===== 8d) census ====="
          echo "(read the lines above; a '?' or PARSE-ERR means that reference was NOT verified by this run)"
