name: GCP reap VMs (kill orphan gpu VMs, project-wide)

# ROBUST, UNIVERSAL VM KILLER. One dispatch deletes every orphaned GCP GPU VM in the project — no need to know
# VM names or zones. This is the belt-and-braces backstop behind the in-VM self-delete trap + the max-run-duration
# on each GPU job: however a VM orphans (self-delete trap failed, max-run misconfigured, a half-provisioned VM, a
# STOPPING spot instance that never got cleaned), a single `mode=reap` run mops it up.
#
# SAFE BY DEFAULT: mode=dry_run just LISTS what would be deleted (deletes nothing). Flip to mode=reap to act.
# A live leg is protected two ways: (1) RUNNING VMs younger than `max_age_min` are always spared (a just-launched
# leg is never killed), and (2) `exclude` names are never touched. DEAD VMs (STOPPING/STOPPED/TERMINATED/
# SUSPENDED) are always reaped — they hold quota + the deterministic VM name and can never resume useful work.
#
# Covers ALL gpu lanes (gcp-ternary-*, gcp-rbfe-*, gcp-bench-*, gcp-smoke-*) via the `prefix` filter (default gcp-).
# Read-only auth is the same WIF path as gcp-quota-check.yml.

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "dry_run = list only (default, safe); reap = actually delete; extend = raise a RUNNING VM's max-run-duration in place (deletes nothing)"
        type: choice
        options: [dry_run, reap, extend]
        default: dry_run
      extend_vm:
        description: "mode=extend ONLY - exact VM name whose max-run-duration to raise. Required; there is no default and no wildcard, on purpose."
        default: ""
      extend_seconds:
        description: "mode=extend ONLY - new max-run-duration in seconds (e.g. 259200 = 72h). Must be LARGER than the current value; the step refuses to shorten."
        default: "259200"
      max_age_min:
        description: "Spare RUNNING VMs younger than this many minutes (protects a just-launched leg). Dead VMs are reaped regardless."
        default: "20"
      exclude:
        description: "VM names to NEVER delete (space/comma separated) — protect a live leg, e.g. gcp-ternary-29693980740"
        default: ""
      prefix:
        description: "Only consider VMs whose name starts with this prefix"
        default: "gcp-"

permissions:
  id-token: write
  contents: read

jobs:
  # ------------------------------------------------------------------ mode=extend: buy wall clock, delete nothing
  # WHY THIS LIVES IN THE REAPER rather than the read-only quota workflow: this MUTATES a VM, and the reaper is
  # already the lane's VM-lifecycle tool with the right auth. It is the opposite operation to reaping — it keeps a
  # VM alive longer — but it belongs with the thing that manages VM lifetimes, not with the thing that reads
  # quotas.
  #
  # WHY IT EXISTS AT ALL. On GCP the credits are free and expiring, so the binding constraint is GPUS_ALL_REGIONS=1
  # and therefore WALL CLOCK. A VM hitting its max-run cap mid-leg costs 2-4 h of dead time, because recovery
  # depends on the watchdog cron and GitHub delivers this repo's crons at ~2-4 h intervals whatever the expression
  # says. Extending in place removes that boundary outright.
  #
  # SAFETY, because this touches a live billed leg carrying many hours of committed sampling:
  #   - the VM name is REQUIRED and exact. No default, no prefix, no wildcard — an "extend everything" mode is a
  #     mode that can extend the wrong thing.
  #   - it REFUSES TO SHORTEN. Lowering a max-run-duration below the VM's current age would terminate it
  #     immediately, which is the single worst outcome available here and is exactly the mistake a fat-fingered
  #     seconds value makes.
  #   - it asserts the VM is still RUNNING afterwards, and errors loudly if it is not.
  # The operation itself was validated on a DECOY e2-micro first (gcp-quota-check.yml), never discovered here.
  extend:
    if: ${{ github.event.inputs.mode == 'extend' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions: { id-token: write, contents: read }
    steps:
      - name: Auth to GCP (WIF)
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: projects/878095411563/locations/global/workloadIdentityPools/github-pool/providers/github-provider
          service_account: gpu-runner@project-a7ebde30-e2ed-4b8d-9a9.iam.gserviceaccount.com
      - uses: google-github-actions/setup-gcloud@v2
      - name: Extend the named VM in place
        env:
          VM: ${{ github.event.inputs.extend_vm }}
          SECS: ${{ github.event.inputs.extend_seconds }}
        run: |
          set -uo pipefail
          PROJECT=project-a7ebde30-e2ed-4b8d-9a9
          gcloud config set project "$PROJECT" 2>/dev/null
          if [ -z "${VM:-}" ]; then
            echo "::error title=EXTEND NEEDS A VM NAME::mode=extend requires extend_vm. Refusing to guess."
            exit 1
          fi
          case "${SECS:-}" in ''|*[!0-9]*) echo "::error::extend_seconds must be a positive integer"; exit 1 ;; esac
          ROW=$(gcloud compute instances list --filter="name=$VM" \
                  --format="value(zone.basename(),status,scheduling.maxRunDuration.seconds)" 2>/dev/null | head -1)
          if [ -z "$ROW" ]; then
            echo "::error title=EXTEND VM NOT FOUND::$VM does not exist in $PROJECT — nothing extended."
            exit 1
          fi
          ZONE=$(printf '%s' "$ROW" | awk '{print $1}')
          STATUS=$(printf '%s' "$ROW" | awk '{print $2}')
          CUR=$(printf '%s' "$ROW" | awk '{print $3}')
          echo "found $VM in $ZONE, status=$STATUS, current max-run-duration=${CUR:-<unset>}s, requested=${SECS}s"
          # REFUSE TO SHORTEN. Lowering the cap below the VM's current age terminates it on the spot.
          case "${CUR:-}" in
            ''|*[!0-9]*) : ;;
            *) if [ "$SECS" -le "$CUR" ]; then
                 echo "::error title=EXTEND WOULD SHORTEN::requested ${SECS}s is not greater than the current ${CUR}s. Lowering a cap below the VM's age terminates it immediately. Refusing."
                 exit 1
               fi ;;
          esac
          gcloud compute instances set-scheduling "$VM" --zone="$ZONE" --max-run-duration="${SECS}s" 2>/tmp/eerr
          RC=$?
          AFTER=$(gcloud compute instances list --filter="name=$VM" \
                    --format="value(status,scheduling.maxRunDuration.seconds)" 2>/dev/null | head -1)
          NEW_STATUS=$(printf '%s' "$AFTER" | awk '{print $1}')
          NEW_DUR=$(printf '%s' "$AFTER" | awk '{print $2}')
          echo "after: status=$NEW_STATUS max-run-duration=${NEW_DUR}s (rc=$RC)"
          if [ "$RC" != 0 ]; then
            echo "--- set-scheduling error ---"; head -5 /tmp/eerr
            echo "::error title=EXTEND FAILED::$VM was NOT extended (rc=$RC). It still expires at ${CUR:-<unset>}s; plan around the boundary."
            exit 1
          fi
          if [ "$NEW_STATUS" != "RUNNING" ]; then
            echo "::error title=EXTEND STOPPED THE VM::$VM is now '$NEW_STATUS', not RUNNING. The extension was applied but the instance is not alive — treat the leg as dead and let the watchdog relaunch it."
            exit 1
          fi
          echo "::notice title=EXTEND OK::$VM max-run-duration ${CUR:-<unset>}s -> ${NEW_DUR}s, still RUNNING. Its VM boundary (and the 2-4 h cron recovery latency behind it) is removed."

  reap:
    # GUARDED so it does not also run on mode=extend. It would not DELETE there (its inner check is
    # `[ "$MODE" = reap ]`), but it would list every VM and fire the RUNNING-VM warning alongside an
    # unrelated operation — and a job that runs in a mode it was not written for is one edit away from
    # acting in it.
    if: ${{ github.event.inputs.mode != 'extend' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Auth to GCP (WIF)
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: projects/878095411563/locations/global/workloadIdentityPools/github-pool/providers/github-provider
          service_account: gpu-runner@project-a7ebde30-e2ed-4b8d-9a9.iam.gserviceaccount.com
      - uses: google-github-actions/setup-gcloud@v2
      - name: Reap orphan VMs
        env:
          MODE: ${{ github.event.inputs.mode }}
          MAX_AGE_MIN: ${{ github.event.inputs.max_age_min }}
          EXCLUDE: ${{ github.event.inputs.exclude }}
          PREFIX: ${{ github.event.inputs.prefix }}
        run: |
          set -uo pipefail
          PROJECT=project-a7ebde30-e2ed-4b8d-9a9
          gcloud config set project "$PROJECT" 2>/dev/null
          MODE="${MODE:-dry_run}"; MAX_AGE_MIN="${MAX_AGE_MIN:-20}"; PREFIX="${PREFIX:-gcp-}"
          # normalize exclude to a space-padded lookup string
          EXCL=" $(printf '%s' "${EXCLUDE:-}" | tr ',' ' ' | tr -s ' ') "
          NOW=$(date -u +%s)
          echo "=== reap: mode=$MODE max_age_min=$MAX_AGE_MIN prefix='$PREFIX' exclude='${EXCLUDE:-<none>}' now=$(date -u) ==="

          # name,zone,status,creationTimestamp for every instance (zone is already the short name here).
          LIST=$(gcloud compute instances list \
                   --format="csv[no-heading](name,zone,status,creationTimestamp)" 2>/tmp/lerr) \
                || { echo "::error::instances list failed:"; cat /tmp/lerr; exit 1; }

          if [ -z "$LIST" ]; then echo "no instances in project — nothing to reap"; fi

          CONSIDERED=0; DELETED=0; SPARED=0; FAILED=0
          DEADRE='STOPPING|STOPPED|TERMINATED|SUSPENDED|SUSPENDING'
          # iterate line by line
          while IFS=, read -r NAME ZONE STATUS CTS; do
            [ -z "$NAME" ] && continue
            case "$NAME" in
              ${PREFIX}*) : ;;                       # matches prefix -> consider
              *) continue ;;                          # not ours -> ignore silently
            esac
            CONSIDERED=$((CONSIDERED+1))
            # age in minutes from creationTimestamp (RFC3339 -> epoch; GNU date on the runner)
            CEPOCH=$(date -u -d "$CTS" +%s 2>/dev/null || echo 0)
            AGE_MIN=$(( (NOW - CEPOCH) / 60 ))
            EXPLAIN="$NAME [$ZONE] status=$STATUS age=${AGE_MIN}m"

            # excluded names are always spared
            case "$EXCL" in *" $NAME "*) echo "  SPARE  $EXPLAIN (excluded)"; SPARED=$((SPARED+1)); continue ;; esac

            REAP=0; REASON=""
            if printf '%s' "$STATUS" | grep -qE "$DEADRE"; then
              REAP=1; REASON="dead (holds quota+name, cannot resume)"
            elif [ "$AGE_MIN" -ge "$MAX_AGE_MIN" ]; then
              REAP=1; REASON="orphan (age ${AGE_MIN}m >= ${MAX_AGE_MIN}m)"
              # ⚠ THE AGE HEURISTIC INVERTS FOR LONG LEGS, and with the default max_age_min=20 it inverts for
              # EVERY real leg. A healthy ternary leg legitimately runs for tens of hours — the on-demand cap is
              # 40 h — so "old" is evidence it is WORKING, not evidence it is orphaned. Observed 2026-07-26: a
              # dry_run listed gcp-ternary-30177970643 as WOULD-DELETE at age 860m while it was mid-production
              # (iteration 320/2000) with 14 h of committed sampling behind it. A `mode=reap` with defaults would
              # have destroyed the leg the whole lane is waiting on.
              #
              # Deliberately NOT changed to spare it automatically: this workflow's stated job includes reaping a
              # RUNNING VM whose leg has crashed (a billing zombie holding the single L4), and that case is also
              # "RUNNING and old". Age genuinely cannot separate the two — only committed-iteration progress can,
              # which is the watchdog's job and not this one's. So the semantics stay, and the hazard becomes
              # LOUD instead of implicit.
              if [ "$STATUS" = RUNNING ]; then
                REASON="$REASON ⚠ RUNNING — age alone cannot tell a healthy long leg from a crashed zombie"
                echo "::warning title=REAP WOULD KILL A RUNNING VM::$NAME is RUNNING at age ${AGE_MIN}m and would be deleted on mode=reap. A ternary leg legitimately runs up to 40 h, so age is NOT evidence it is orphaned. CHECK PROGRESS FIRST — dispatch gpu-ternary-fep-gcp.yml mode=tail (or read the ternary-leg-watchdog annotations) and confirm the committed iteration is NOT advancing before reaping. To spare it, pass exclude=$NAME."
              fi
            else
              echo "  SPARE  $EXPLAIN (younger than ${MAX_AGE_MIN}m — likely a live leg)"; SPARED=$((SPARED+1)); continue
            fi

            if [ "$MODE" = reap ]; then
              echo "  DELETE $EXPLAIN — $REASON"
              if gcloud compute instances delete "$NAME" --zone="$ZONE" --quiet 2>/tmp/derr; then
                DELETED=$((DELETED+1))
              else
                echo "    ::warning::delete failed: $(tail -1 /tmp/derr)"; FAILED=$((FAILED+1))
              fi
            else
              echo "  WOULD-DELETE $EXPLAIN — $REASON"
              DELETED=$((DELETED+1))   # in dry_run, DELETED counts the would-delete set
            fi
          done <<< "$LIST"

          echo "=== remaining ${PREFIX}* VMs after reap ==="
          gcloud compute instances list --filter="name~^${PREFIX}" \
            --format="table(name,zone,status,creationTimestamp)" 2>/dev/null || echo "  (none / list failed)"

          echo "=== L4 quota usage now (should drop after a reap) ==="
          Q=$(gcloud compute regions describe us-central1 --flatten="quotas[]" \
                --format="value(quotas.metric, quotas.limit, quotas.usage)" 2>/dev/null)
          for M in NVIDIA_L4_GPUS PREEMPTIBLE_NVIDIA_L4_GPUS; do
            L=$(printf '%s\n' "$Q" | awk -v m="$M" '$1==m {print "limit="$2" usage="$3}')
            echo "  ${M}: ${L:-NOT PRESENT}"
          done

          VERB="would-delete"; [ "$MODE" = reap ] && VERB="deleted"
          echo "[REAP-SUMMARY] mode=$MODE considered=$CONSIDERED $VERB=$DELETED spared=$SPARED failed=$FAILED"
