name: Materialize audited EMC public source
on:
  push:
    branches: ['codex/ci-stage/emc-tree-bridge-20260907']
    paths: ['.ci-bridge/loader-input.json']
permissions:
  contents: write
concurrency:
  group: emc-public-source-materialization-20260907
  cancel-in-progress: false
jobs:
  materialize:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true
      - name: Materialize exact public source tree
        run: python3 .ci-bridge/materialize_public_source.py
      - name: Prepare minimal provenance repair in separate clean public worktree
        env:
          GIT_AUTHOR_NAME: github-actions[bot]
          GIT_AUTHOR_EMAIL: 41898282+github-actions[bot]@users.noreply.github.com
          GIT_COMMITTER_NAME: github-actions[bot]
          GIT_COMMITTER_EMAIL: 41898282+github-actions[bot]@users.noreply.github.com
        run: python3 .ci-bridge/prepare_public_repair.py
      - name: Preserve actual public-source receipt
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: emc-public-source-receipt
          path: |
            ${{ runner.temp }}/emc-public-source-receipt.json
            ${{ runner.temp }}/emc-provenance-evidence/
            ${{ runner.temp }}/emc-public-repair-ref.json
          if-no-files-found: error
