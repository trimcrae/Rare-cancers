# A SUPERVISOR THAT DOES NOT DEPEND ON GITHUB'S SCHEDULER.
#
# WHY THIS EXISTS, measured 2026-07-27. A fan-out unit that loses its host loses NOTHING — every leg is
# checkpointed in S3 and resumes where it stopped. What it loses is WALL CLOCK, and the size of that loss is
# exactly the gap until the next tick re-places it. So re-placement latency IS the supervision cadence.
#
# `step1-fanout-autoscale.yml` asks for `*/20`. What GitHub actually delivered on 2026-07-27 was four
# schedule events all day, at 12:52 AM, 4:19 AM, 7:44 AM and 10:05 AM ET — gaps of 220, 208, 205 and 141
# MINUTES. Of that day's 30 runs, 26 were `workflow_dispatch`: an agent remembering to fire it. The median
# gap between SUCCESSFUL ticks was 7.8 min while an agent was watching, against 141-220 min when one was not.
#
# That difference is what stretched a unit's completion from Tuesday morning to Thursday. Rate was never the
# problem: the fastest long-lived hosts run ~234-300 iterations/h and a unit needs 4800, so ~20 h of UPTIME.
# The slow units were not computing slowly — they were spending hours with no host at all, waiting for a
# tick that a throttled cron was not delivering.
#
# HOW THIS FIXES IT. One long-lived job that loops internally and dispatches the real tick every
# TICK_EVERY_MIN. A single run holds the cadence for its whole life, so the interval is OURS, not GitHub's
# queue's. Nothing here duplicates the tick's logic — it only decides WHEN, which is the part that was broken.
#
# WHAT THIS DELIBERATELY DOES NOT DO:
#   * It does not rent, price, reap or condemn anything. Every spend decision stays inside the tick, behind
#     the buy line and the spend cap. A supervisor that could also buy would be a second, unreviewed
#     purchasing path, which is precisely the shape this repo keeps paying for.
#   * It does not replace the cron. `schedule:` stays on the autoscale workflow as the cold-start path — when
#     no supervisor is alive, a throttled tick is still far better than none, and it is what restarts this.
#   * It DOES self-restart, and verifies the successor exists rather than assuming the dispatch worked. The
#     6 h job ceiling means a window always ends; the fan-out runs for days. A chain that is checked is the
#     only way the cadence survives that without a human in the loop.
#
# COST: $0. GitHub-hosted minutes are free on a public repo, and this job is asleep almost all of its life.
name: step1 fan-out supervisor (cadence that does not depend on cron)

on:
  workflow_dispatch:
    inputs:
      hours:
        description: "how long to hold the cadence for (max 5.8 - the 6 h job ceiling, minus setup)"
        default: "5.5"
      tick_every_min:
        description: "minutes between dispatched ticks"
        default: "8"
      fleet_branch:
        description: "passed through to the tick - the branch the RENTED INSTANCES run, not this file's ref"
        default: "main"
      release_fanout:
        description: "1 = ticks may place units; 0 = progress check only. Passed through unchanged."
        default: "1"
      watch_every_ticks:
        description: "dispatch the CROSS-LANE staleness watch every Nth tick (0 = never). THIS LOOP IS THAT
          WATCH'S REAL CADENCE - its own `schedule:` is a cold-start path only, because a cron does not
          supervise a billing fleet (CLAUDE.md section 6). $0, and it covers the four lanes this tick does not."
        default: "2"

# Never let two supervisors hold the same cadence - they would double the dispatch rate into the one Vast
# API key that returned an nginx 403 to a four-unit launch on 2026-07-27.
concurrency:
  group: step1-fanout-supervisor
  cancel-in-progress: false

permissions:
  contents: read
  actions: write          # the only thing it needs: dispatching the tick

jobs:
  supervise:
    runs-on: ubuntu-latest
    timeout-minutes: 355          # under the 360 ceiling, so the loop exits cleanly rather than being killed
    steps:
      - name: Hold the cadence
        env:
          GH_TOKEN: ${{ github.token }}
          # gh needs a repo to act on. With no actions/checkout step there is no git remote to
          # infer one from, so `gh workflow run` fails with "not a git repository" on EVERY
          # iteration - a supervisor that looks alive and dispatches nothing. GH_REPO supplies it
          # without paying for a checkout this job does not otherwise need.
          GH_REPO: ${{ github.repository }}
          HOURS: ${{ github.event.inputs.hours || '5.5' }}
          EVERY: ${{ github.event.inputs.tick_every_min || '8' }}
          FLEET_BRANCH: ${{ github.event.inputs.fleet_branch || 'main' }}
          RELEASE_FANOUT: ${{ github.event.inputs.release_fanout || '1' }}
          WATCH_EVERY: ${{ github.event.inputs.watch_every_ticks || '2' }}
        run: |
          set -uo pipefail
          # Coerce in BASH, not in a GitHub-expression comparison. An optional input is null on a non-dispatch event
          # and GitHub casts null -> 0 when the operands differ in type, so an `inputs.x != '0'` expression reads FALSE in
          # exactly the case it was written to allow. That defect skipped placement on seven green ticks on
          # 2026-07-27 and decayed the fleet 18 -> 5 while the board was clearing at 1.03x-1.29x basis.
          END=$(( $(date +%s) + $(python3 -c "print(int(float('${HOURS}')*3600))") ))
          SLEEP=$(( EVERY * 60 ))
          # This generation's OWN copy of this file, as a blob SHA. There is no checkout here (see GH_REPO
          # above), so it is read from the API at the commit that started the run rather than hashed on
          # disk. Empty on any failure, and the comparison below is skipped when either side is empty —
          # an unreadable SHA must never be mistaken for a changed one, or a transient API blip would
          # restart the supervisor for no reason (CLAUDE.md §4).
          SELF_SHA=$(gh api "repos/${GH_REPO}/contents/.github/workflows/step1-fanout-supervisor.yml?ref=${GITHUB_SHA}" \
                       --jq .sha 2>/dev/null || echo "")
          echo "[self] generation running workflow blob ${SELF_SHA:-UNREADABLE} at ${GITHUB_SHA:0:8}"
          n=0; ok=0; fail=0
          echo "cadence: a tick every ${EVERY} min until $(date -u -d "@${END}" '+%H:%M UTC')"
          while [ "$(date +%s)" -lt "$END" ]; do
            n=$((n+1))
            # --- one tick -------------------------------------------------------------------------------
            if gh workflow run step1-fanout-autoscale.yml \
                 --ref main \
                 -f fleet_branch="${FLEET_BRANCH}" \
                 -f release_fanout="${RELEASE_FANOUT}" 2>/tmp/e; then
              ok=$((ok+1))
              echo "[$(date -u '+%H:%M:%SZ')] tick ${n} dispatched (ok=${ok} fail=${fail})"
            else
              fail=$((fail+1))
              # A dispatch failure is NOT fatal to the cadence - a throttle or a blip must not end a
              # supervisor that still has hours of useful life. It is recorded and the loop continues.
              echo "::warning title=SUPERVISOR TICK DISPATCH FAILED::tick ${n}: $(head -2 /tmp/e | tr '\n' ' ')"
            fi
            # --- and, every Nth tick, the CROSS-LANE staleness watch ------------------------------------
            # WHY IT RIDES THIS LOOP RATHER THAN ITS OWN CRON. The autoscale tick measures ONE lane. Four
            # others can bill or stall - the valB replicates, the closure triangle, 5a-KS, the GCP watch list
            # - and on 2026-07-27 every one of them failed in a way the tick could not see, including a
            # triangle that sat idle ~3 h with no host at all. This loop already owns a cadence GitHub's
            # scheduler does not, so the cheapest way to give the other four the same cadence is to dispatch
            # from here. It costs $0 and it dispatches a REPORT-ONLY workflow: the watch rents, destroys and
            # reaps nothing, so nothing about the supervisor's "it does not buy" property changes.
            if [ "${WATCH_EVERY}" -gt 0 ] 2>/dev/null && [ $(( n % WATCH_EVERY )) -eq 0 ]; then
              if gh workflow run lane-staleness-watch.yml --ref main \
                   -f fleet_branch="${FLEET_BRANCH}" 2>/tmp/w; then
                echo "[$(date -u '+%H:%M:%SZ')] cross-lane staleness watch dispatched (tick ${n})"
              else
                # Never fatal, and never silent: a supervisor that quietly stopped dispatching the watch
                # would leave four lanes unwatched while still looking healthy - the exact shape being fixed.
                echo "::warning title=STALENESS WATCH DISPATCH FAILED::tick ${n}: $(head -2 /tmp/w | tr '\n' ' ')"
              fi
            fi
            # ★★ THE ACCOUNT CENSUS, ON THE SAME EVERY-Nth-TICK SLOT AND FOR A SHARPER REASON (2026-08-01).
            # `ternary-vast-account-census.json` is the ONLY artifact that can see an instance NO LANE
            # CLAIMS — its own `_what` says it: "the account-level view a per-mode board structurally cannot
            # give, because it filters to one mode's labels". It is what answered, in a single call, a
            # question that had been carried as "status unknown" across hours of reports (the prune smoke's
            # instance 46459452, which had billed overnight and been destroyed leaving no trace).
            #
            # AND IT WAS ITSELF UNSUPERVISED. Measured that morning: exactly two commits ever, 12:13Z and
            # 12:20Z, then 26 minutes stale with nothing refreshing it — because its writer lives in
            # `ternary_reps_diag.py`, a DIAGNOSTIC that runs only when a human or an agent dispatches it.
            # So the one detector that can find a 5-day orphan only ran when somebody already suspected one.
            # That is the same shape as the retro tick that could reap but never launch, and the GCP lane
            # that sat idle 15 h because nothing queued work: the guard existed and nothing drove it.
            #
            # Report-only, exactly like the staleness watch above: `reps-diag` reads `GET /instances/` and
            # archived logs. It rents nothing and destroys nothing, so the supervisor's "it does not buy"
            # property is untouched. On WATCH_EVERY rather than every tick because it is a heavy read and
            # the Vast API is one shared key — a 403 from over-polling would blind the very gates that
            # depend on it (CLAUDE.md §6).
            if [ "${WATCH_EVERY}" -gt 0 ] 2>/dev/null && [ $(( n % WATCH_EVERY )) -eq 0 ]; then
              if gh workflow run gpu-ternary-fep-vast.yml --ref main -f task=reps-diag 2>/tmp/c; then
                echo "[$(date -u '+%H:%M:%SZ')] vast ACCOUNT census dispatched (tick ${n})"
              else
                # Never silent: a stale census cannot authorise anything, but a census nobody notices is
                # stale is how an orphan bills for days. The readout that consumes it treats a stale census
                # as UNKNOWN and escalates on the second consecutive report.
                echo "::warning title=ACCOUNT CENSUS DISPATCH FAILED::tick ${n}: $(head -2 /tmp/c | tr '\n' ' ')"
              fi
            fi
            # --- and the TERNARY lane's two gates, on the same loop and for the same reason ---------------
            # ★★ WHY THIS IS HERE (2026-07-29). The ternary lane already re-places a dead host WITHOUT a
            # human: `ternary_vast_watchdog.tick()`'s DIED branch calls `tv.submit` directly, behind the
            # $/ns buy line. What it does not have is a CADENCE. Its own cron asks `*/15`; the gaps
            # DELIVERED on 2026-07-29 were 202, 172, 163, 134, 141 and 90 minutes. So a leg whose host is
            # capacity-refused at 12:05 can sit unplaced until the next tick lands, and on this repo that
            # is measured in hours rather than the quarter-hour the cron requests.
            #
            # This loop already owns the cadence GitHub's scheduler will not deliver, and it already
            # dispatches a second workflow on the same principle (the staleness watch above). Giving the
            # ternary gates a ride is therefore two lines of an idiom already proven here, not a new
            # mechanism — which is exactly why it is the change that was made.
            #
            # ⚠ THESE DISPATCH GATES, NOT LAUNCHES, AND THAT DISTINCTION IS THE SAFETY ARGUMENT. Neither
            # task rents anything itself: each prices the board, and only self-dispatches a launch when it
            # clears BOTH the rung's dollar ceiling and the $/ns buy line. A gate with nothing to place
            # exits 3 (`nothing to launch`) and dispatches nothing at all, so a higher tick rate on a
            # satisfied lane costs $0 and produces no rental. Double-renting is guarded four deep beneath
            # this — `submit`'s live-host skip, fail-closed on an unreadable instance list, the failure
            # breaker, and the gates' own exit-3 path.
            #
            # ⚠ AND IT CANNOT REVIVE A LEG THAT DIED ON A REAL FAULT. `watchdog_policy` refuses to relaunch
            # a unit carrying a `status=failed` record with no live instance, deliberately — that veto is
            # what stopped the closure triangle for a day on the partial-charge defect, and clearing it
            # still requires a human's `task=supersede-failed` after the CAUSE is fixed. Cadence is the
            # only thing being restored here; the breaker and the veto are untouched.
            if gh workflow run gpu-ternary-fep-vast.yml --ref main -f task=market-gate 2>/tmp/t1; then
              echo "[$(date -u '+%H:%M:%SZ')] ternary market-gate dispatched (tick ${n})"
            else
              echo "::warning title=TERNARY MARKET-GATE DISPATCH FAILED::tick ${n}: $(head -2 /tmp/t1 | tr '\n' ' ')"
            fi
            # ★★ THE TICK CARRIES A CARD FLOOR, BECAUSE A 3090 CANNOT FINISH A CHECKPOINT INTERVAL BEFORE
            # IT IS PREEMPTED (measured 2026-07-30). The triangle's ternary legs commit every 40 iterations
            # and that interval is FIXED on resume — `rbfe_spot_driver` reads it from the committed .nc and
            # overrides any request — so the only lever is s/iter. On this 146k-particle system a 3090 runs
            # ~34 s/iter, i.e. ~23 min per interval, against host lifetimes measured at ~15-25 min. The leg
            # therefore loses its entire interval on every preemption and the committed census never moves:
            # `calib_hi_to_lo2__ternary_vhl` sat at production/1720 for over two hours across three hosts,
            # and advanced on the very next cycle once it landed on a 5090.
            #
            # 28 ns/h is chosen to exclude that class and NOTHING ELSE. It admits RTX 5090 / 4090 / 5080 /
            # 4080 (43.1 / 33.5 / 31.3 / 28.9 ns/h) and drops A100-PCIe and below, which are the cards whose
            # interval exceeds a typical lifetime. A tighter floor (40, the 5090-only value used by hand
            # earlier) narrows the board when AVAILABILITY is the binding constraint — and it was, twice
            # this morning, when placements came back `resources_unavailable`. Wide board, fast enough
            # cards.
            #
            # ⚠ WHY IT BELONGS ON THE TICK RATHER THAN A HAND DISPATCH. The agent placed this leg on a fast
            # card by hand twice and the unmodified tick re-placed it on a 3090 both times, because the tick
            # runs every 8 min and a hand dispatch cannot reliably win that race. A per-launch override that
            # the automation does not carry is not a fix, it is a chore.
            if gh workflow run gpu-ternary-fep-vast.yml --ref main -f task=triangle-gate -f min_ns_per_h=28 2>/tmp/t2; then
              echo "[$(date -u '+%H:%M:%SZ')] ternary triangle-gate dispatched (tick ${n})"
            else
              echo "::warning title=TERNARY TRIANGLE-GATE DISPATCH FAILED::tick ${n}: $(head -2 /tmp/t2 | tr '\n' ' ')"
            fi
            # ★★ AND RUNG 5a-KS, WHICH HAD NO TICK AT ALL UNTIL 2026-07-31 — THE LANE THAT WAS ACTUALLY
            # RUNNING WAS THE ONE NOT BEING RE-PLACED. Two lists had to be edited in lockstep for a mode to
            # be re-placeable, this loop and `collect`'s map, and 5a-KS was in neither. When
            # `5aks_d0_to_d__ternary_nr4a3_r0` lost its host to a capacity refusal on machine 145841, the
            # box was destroyed and the checkpoint kept at production/840 — both correct — and then nothing
            # went looking for a replacement host. The ledger shows the 7:39 / 7:47 / 7:55 AM ET ticks each
            # evaluating market-gate and triangle-gate and no 5aks gate at all.
            #
            # ★★ NO CARD FLOOR — I ADDED ONE 2026-07-31 AND THE DATA REFUTED IT WITHIN THE HOUR.
            #
            # I added `min_ns_per_h=28` on the argument that a 3090 cannot close a checkpoint interval
            # inside a host lifetime. trimcrae pushed back — 'make sure we're considering 3090s too' — and
            # the fan-out's own 208-rental ledger settles it. Split by rate:
            #     <= $0.12/hr (3090-class): n=34, median lifetime 1.50 h, 62 % over 1 h, max 6.6 h
            #     >  $0.12/hr (4090/5090) : n=174, median 1.65 h, 67 % over 1 h
            # Cheap hosts hold essentially as long as expensive ones. CARD CLASS DOES NOT PREDICT HOST
            # LIFETIME on this account, so the floor's premise fails and its only effect is to delete the
            # cheapest third of an already-starved board.
            #
            # ⚠ AND MY OBSERVATIONAL EVIDENCE WAS MISREAD. The '3090 frozen at 40.9 % for 33 min' row also
            # carried `targets not in the record` and `no openmmtools rate line` — the collector could not
            # READ its progress. I took a telemetry gap for a stall, which is the same error this repo
            # keeps paying for in the other direction.
            #
            # The real problem is BOARD WIDTH: the gate saw ONE offer against a census of 90 priceable.
            # Short lifetimes look like a symptom of being forced onto whatever single host exists, not a
            # property of the cards. Superseded reasoning retained below, per CLAUDE.md §1 rule 2.
            #
            # SUPERSEDED 2026-07-31, retained: the card-floor argument that briefly stood here.
            #
            # SUPERSEDED, retained because its reasoning was sound and only its premise was wrong: "NO
            # `min_ns_per_h` FLOOR, deliberately … 5a-KS is not in that position — its seed-0 legs have been
            # committing on a 3090 and a 4080S all morning — so imposing a card floor here would narrow the
            # board, and a narrower board at the same buy line means more holds for no safety gained. Add
            # one only if a 5a-KS leg is measured losing whole checkpoint intervals to preemption."
            #
            # It has now been measured, which is exactly the trigger that text named. Board history
            # 12:02–12:35 PM ET: the RTX 5090 leg advanced 78.9 → 82.2 % steadily (~1.1 % per 10 min) while
            # the RTX 3090 leg sat at 40.9 % for 33 MINUTES and its ETA slipped from 5:20 PM to 4:10 AM the
            # next day. A fourth leg held `warmup/1024` across six consecutive board reads and then moved to
            # `warmup/1088` — exactly ONE 64-iteration interval in ~50 min.
            #
            # And 5a-KS is in a WORSE position than the triangle, not a better one. Its staged system is
            # 285,133 particles against the triangle's ~146k, and its WARMUP interval is 64 iterations, not
            # 40. Scaling the triangle's measured ~34 s/iter on a 3090 by particle count puts a 5a-KS warmup
            # interval near 71 min and a production interval near 44 min, against host lifetimes measured at
            # 15–25 min. (That s/iter is EXTRAPOLATED and labelled as such; the frozen-census observation
            # above is direct and does not depend on it.) A card that cannot close an interval does not
            # merely make no progress — it BILLS while committing nothing, so the "no safety gained"
            # premise was inverted: the narrower board is the cheaper one.
            #
            # 28 ns/h is the triangle's value and is deliberately NOT re-derived here — one home, in the
            # triangle-gate comment above.
            if gh workflow run gpu-ternary-fep-vast.yml --ref main -f task=5aks-gate 2>/tmp/t4; then
              echo "[$(date -u '+%H:%M:%SZ')] ternary 5aks-gate dispatched (tick ${n})"
            else
              echo "::warning title=TERNARY 5AKS-GATE DISPATCH FAILED::tick ${n}: $(head -2 /tmp/t4 | tr '\n' ' ')"
            fi
            # ★★ AND A COLLECT, BECAUSE NOTHING ELSE DISPATCHES ONE (measured 2026-07-29, 7:37 PM ET).
            #
            # WHAT WAS FOUND. The in-flight board's own "Generated" stamp read 7:02 PM ET at 7:37 PM ET —
            # 35 minutes stale — while the ternary workflow had run EIGHT times in that window. Every one
            # of those was a gate. `task=collect` is the only task that writes the board, and nothing in
            # the repo dispatches it on a cadence: every collect on 2026-07-29 was either an agent typing
            # it or the 5-minute `post_launch_recheck` after a rental. When the agent stopped, the board
            # froze — and a frozen board with a plausible-looking table is worse than no board, because it
            # reads as current. That is CLAUDE.md §6's cron finding arriving through a different door: not
            # "the schedule is throttled" but "there was never a schedule at all".
            #
            # ⚠ AND THE BOARD IS THE SMALLER HALF OF WHAT WAS MISSING. `collect` is also the lane's PROGRESS
            # check and its reaper: it advances the committed-iteration census that `no_advance_polls` and
            # the stall verdict are computed from, runs `vast_idle_guard` over every live host, and destroys
            # boxes that are up and producing no evidence of work. CLAUDE.md §6 is explicit that the host
            # cannot stop its own billing and the guarantee is the guard acting FROM CI — so a lane with no
            # collect cadence has no idle-billing guarantee at all, however healthy its gates look. Six legs
            # were billing overnight on exactly that footing.
            #
            # $0 and it rents nothing: S3 reads, one Vast instance list, and destroys only a box the guard
            # condemns on a measured absence of writes.
            if gh workflow run gpu-ternary-fep-vast.yml --ref main -f task=collect 2>/tmp/t3; then
              echo "[$(date -u '+%H:%M:%SZ')] ternary collect dispatched (tick ${n})"
            else
              echo "::warning title=TERNARY COLLECT DISPATCH FAILED::tick ${n}: $(head -2 /tmp/t3 | tr '\n' ' ')"
            fi
            # ★★ AND THE NR-V04 RETROSPECTIVE (Arm E / R1, 18 endpoint-MD legs) — added 2026-07-31, and it
            # was the lane with NO automation of any kind. Measured that morning: `fusion-cpu-extras.yml` is
            # `workflow_dispatch`-only and is the ONLY workflow that runs the lane; the lane is absent from
            # `lane_staleness_watch.LANES`; `vast_idle_guard` had never been run against the `nrv04retro-`
            # namespace; and `retro_reap` destroyed a `stopped` host as `terminal-state` with no nudge and
            # nothing to re-place it. So a preempted or capacity-refused retro leg simply stopped existing,
            # silently, until a human dispatched `retro_full` — the same shape that left 5a-KS unplaced
            # above, on a lane about to be sixteen legs wide.
            #
            # `retro_collect` IS this lane's whole tick: it reaps finished/stale hosts, nudges a box we hold
            # back to `running` before condemning it, runs `vast_idle_guard` over every live retro host,
            # re-places every hostless unrun unit behind the SAME market gate and `$/ns` buy line as any
            # other rental, and refuses to re-buy a unit the failure breaker has blocked
            # (`nrv04_vast_launch.retro_breaker` — no leg record after `leg_failure_breaker.DEFAULT_THRESHOLD`
            # paid hosts). It also writes the lane's board fragment, so a retro section that goes stale is
            # visible rather than merely absent.
            #
            # ⚠ IT CAN BUY — unlike the gates above, which only price. That is deliberate and it is the point
            # of the change; the safety is that it buys through `retro_launch`, so there is no privileged
            # path into this lane's wallet, and the breaker bounds how many times a broken unit can be
            # re-bought. A tick with nothing to place rents nothing and costs $0.
            # ⚠ `md_mode` IS PASSED EXPLICITLY, and it is not cosmetic. `fusion-cpu-extras.yml`'s `md_mode`
            # is a `choice` input whose default is **smoke**, so omitting it here set `MODE=smoke` on the
            # tick — and on 2026-07-31 the tick's re-placer then bought 16 legs that ran 500 steps with ZERO
            # equilibration and wrote leg records the collector counted as landed
            # (`nrv04_retro_panel.production_leg_check`). The launcher now pins `MODE=run` for a heal
            # regardless of what the dispatcher says; this line makes the dispatcher agree, so the two can
            # never drift back apart silently.
            if gh workflow run fusion-cpu-extras.yml --ref main \
                 -f task=nrv04_vast_launch \
                 -f vast_launch_mode=retro_collect \
                 -f md_mode=run \
                 -f vast_ckpt_bucket=sagemaker-us-east-2-646605541856 2>/tmp/t5; then
              echo "[$(date -u '+%H:%M:%SZ')] nrv04 retro collect+supervise dispatched (tick ${n})"
            else
              echo "::warning title=NRV04 RETRO TICK DISPATCH FAILED::tick ${n}: $(head -2 /tmp/t5 | tr '\n' ' ')"
            fi
            # ★★ AND THE SELECTIVITY-CONTROL MD PANEL — added 2026-08-02, the night it billed 4.5 hours for
            # nothing. Same door as every entry above, one turn further along.
            #
            # WHAT WAS FOUND. This lane's ONLY supervision is its own `watch` job, which runs a ~55-minute
            # window and re-arms itself at the end. That is a chain with no anchor: the moment one re-arm
            # fails — a cancelled run, a `pending` job holding the concurrency group, a red guard step — the
            # lane has NO tick at all, and nothing outside it notices, because nothing outside it ever
            # dispatched it. Measured that night: three hosts sat `running` at `gpu_util: 0.0` producing
            # nothing while the reaper printed SPARED ~120 times, and the fix for the reaper (a failure
            # terminus, `selcal_vast_launch.md_failure_terminus`) is worth nothing on a lane whose reaper
            # has stopped being run. A guard that cannot fire is absent (CLAUDE.md §6).
            #
            # ⚠ `reap`, NOT `watch`. A `watch` from here would start a SECOND 55-minute supervisor racing
            # the lane's own, and two watches re-placing the same unit is how a lane double-rents. `reap` is
            # a single pass: it lists this lane's hosts, applies `reap_decision` — which now recognises a
            # host-written FAILURE terminus as well as success — destroys what that condemns, and writes
            # `selcal-reap.json` either way. It rents NOTHING, so this can never buy behind the market gate.
            # A tick with nothing to reap costs $0 and still stamps the artifact, which is what makes a lane
            # whose watch has died visibly ticking rather than silently absent.
            if gh workflow run selectivity-control-vast.yml --ref main -f mode=reap 2>/tmp/t6; then
              echo "[$(date -u '+%H:%M:%SZ')] selcal reap dispatched (tick ${n})"
            else
              echo "::warning title=SELCAL REAP TICK DISPATCH FAILED::tick ${n}: $(head -2 /tmp/t6 | tr '\n' ' ')"
            fi
            # ★★ AND THE GCP L4 STEP-1 FAN-OUT REPLICATE LANE — added 2026-08-01, for the reason every other
            # entry above was added, arriving through yet another door.
            #
            # WHAT WAS FOUND. The lane's board fragment is written by `gpu-fanout-rep-gcp.yml` on every
            # dispatch of every mode — which is the correct place for it and is worth nothing on its own,
            # because NOTHING DISPATCHES THE LANE. Its first render read `STALE (> 15 min)` within half an
            # hour, and a leg bounded at 48 h whose fragment refreshes only when a human types something
            # would read STALE for essentially its whole life. The row is honest about it ("this row is
            # THAT report, not a current reading"), and honest staleness is still staleness.
            #
            # ⚠ AND THE BOARD IS AGAIN THE SMALLER HALF. `mode=reap` is also this lane's TEARDOWN: it runs
            # `gcp_fanout_rep.reap_decision` over every `gcp-s1frep-*` VM and deletes the ones whose own
            # evidence says the work is banked or the container is gone. That predicate was written to close
            # three measured 48 h holds on 2026-07-31 — and it only ever runs "on every dispatch of every
            # mode", so with nothing dispatching, NOTHING REAPS. The 48 h hold that was fixed inside the
            # lane simply reappeared one layer up, at scheduling. This closes that loop, and it is the same
            # finding as the ternary `collect` block above: a guard that exists but has no cadence is not a
            # guarantee, it is a guarantee-shaped absence.
            #
            # ★★ SUPERSEDED 2026-08-01, DELIBERATELY: THIS TICK NOW BUYS, AND IT HAD TO.
            # This block used to say "⚠ IT CANNOT BUY ... there is no route from this tick to a rental",
            # and treated that as the safety property. It was instead the DEFECT. A tick that can end work
            # and never start it guarantees the GPU idles the moment a unit finishes — measured the next
            # morning: the leg raised at 11:50 PM ET, this lane's reap step correctly destroyed the VM 96 s
            # later, and then NOTHING relaunched for 8 h 11 m while every 8-minute tick honestly reported
            # an idle GPU and acted on none of it. The reap half of "reap+board" was doing its job; the
            # missing half was the whole problem. So `mode=autofeed`, which reaps FIRST and then decides.
            #
            # ⚠ WHAT STOPS IT RUNNING AWAY IS A PREDICATE, NOT AN ABSENT CODE PATH — and a predicate is the
            # stronger of the two, because it is PURE and unit-tested rather than a property of which `if:`
            # happens to be written where. `gcp_fanout_rep.feed_decision` refuses on: ANY live GCE instance
            # in the project (GPUS_ALL_REGIONS = 1 — this lane, the ternary lane, anything); a unit whose
            # ddg.json is already in GCS; and a no-progress breaker that holds after
            # MAX_NOPROGRESS_LAUNCHES launches which bank no new committed generation. The create step then
            # re-checks the live-instance count independently, and this workflow's own
            # `concurrency: gcp-gpu-fanout-rep` serialises the ticks — so two guards, plus a queue, stand
            # between an 8-minute cadence and a second GPU. A tick with nothing to do still prints
            # "no gcp-s1frep-* instances - nothing to reap" and costs $0.
            #
            # ⚠ AND WHAT IT SPENDS IS FREE CREDIT ON A SEPARATE LEDGER (CLAUDE.md §6) — GCP trial credit,
            # expiring 2026-10-10, never summed into realized or ladder spend. There is still no route from
            # this tick to a Vast rental or to a real dollar.
            #
            # ⚠ IT TARGETS ONLY THIS LANE'S OWN WORKFLOW, DELIBERATELY. `gpu-ternary-fep-gcp.yml` runs its
            # launch guard BEFORE its idempotent skip, so a redundant dispatch of already-landed work exits
            # with a red `::error` rather than a green "already done" - which is exactly what happened at
            # 7:31 AM ET 2026-07-31. Putting THAT workflow on an 8-minute tick would manufacture a stream of
            # false failures, and a lane that always has a red run is a lane whose real failures stop being
            # read. The ordering is reported for its owner to fix; this tick does not depend on it.
            # ⚠ NO `-f edge=` / `-f replicate=`. `autofeed` chooses the unit itself from the queue
            # (`gcp_fanout_rep.queue_units`) — most-advanced-unbanked first, map order as the tiebreak —
            # so pinning one edge here would be a second home for that choice and would silently strand
            # the other two units of the cycle the moment this one landed.
            if gh workflow run gpu-fanout-rep-gcp.yml --ref main \
                 -f mode=autofeed 2>/tmp/t6; then
              echo "[$(date -u '+%H:%M:%SZ')] gcp s1f-rep autofeed (reap -> decide -> launch) dispatched (tick ${n})"
            else
              echo "::warning title=GCP S1F-REP TICK DISPATCH FAILED::tick ${n}: $(head -2 /tmp/t6 | tr '\n' ' ')"
            fi
            # ★★ HAND OFF EARLY WHEN THIS FILE ITSELF HAS CHANGED ON MAIN (2026-08-01).
            # This loop is long-lived and checked its code out at start, so an edit to THIS workflow is
            # inert until the next generation. Measured that morning: the generation began 7:51 AM ET on
            # a73aca84; the ACCOUNT-census tick landed 8:49 AM and the GCP autofeed tick 8:37 AM, so both
            # fixes sat dead for the remaining ~3.5 h of a 5.5 h generation. The GCP lane hit the same wall
            # and had to add a backstop cron to work around it. A supervision fix that cannot take effect
            # for hours is the same failure this whole file exists to prevent, one level up.
            #
            # ⚠ THE PREDICATE IS *THIS FILE*, NOT "main moved". `main` moves constantly — ~1,400 artifact
            # commits a day from the lanes' own heartbeats — so "has main advanced" is always true and
            # would restart the supervisor every tick, which is strictly worse than the lag.
            #
            # And it does NOT shorten the generation. Cutting HOURS would multiply hand-offs (each one a
            # chance for the chain to break) to fix a problem that only exists when the file changes,
            # which is rare. This costs one cheap API read per tick and nothing at all when nobody is
            # editing. The successor is dispatched by the existing "Hand off to a successor" step, which
            # always runs; `resurrect-supervisor` in the autoscale workflow is the backstop if it does not.
            LIVE_SHA=$(gh api "repos/${GH_REPO}/contents/.github/workflows/step1-fanout-supervisor.yml?ref=main" \
                         --jq .sha 2>/dev/null || echo "")
            if [ -n "$LIVE_SHA" ] && [ -n "$SELF_SHA" ] && [ "$LIVE_SHA" != "$SELF_SHA" ]; then
              # One line deliberately: a backslash continuation at column 1 inside a `run: |` block breaks
              # the YAML scan, which is how this same file was broken on 2026-07-31 (commit 27bd6a1e).
              echo "::notice title=SUPERVISOR SUPERSEDED::generation runs ${SELF_SHA:0:8}, main now carries ${LIVE_SHA:0:8} - handing off early at tick ${n} so the change takes effect now, not at the deadline."
              break
            fi
            # Stop early rather than sleep past the deadline and be killed mid-iteration.
            [ $(( $(date +%s) + SLEEP )) -ge "$END" ] && break
            sleep "${SLEEP}"
          done
          echo "dispatched ${ok} tick(s), ${fail} failure(s) over ${HOURS} h"
          # A supervisor that dispatched NOTHING is indistinguishable from one that was never started, so
          # say so loudly rather than exiting 0 on an empty run.
          if [ "$ok" -eq 0 ]; then
            echo "::error title=SUPERVISOR DISPATCHED NOTHING::${n} attempt(s), all failed - the fleet was NOT supervised for ${HOURS} h"
            exit 1
          fi

      - name: Hand off to a successor
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          HOURS: ${{ github.event.inputs.hours || '5.0' }}
          EVERY: ${{ github.event.inputs.tick_every_min || '8' }}
          FLEET_BRANCH: ${{ github.event.inputs.fleet_branch || 'main' }}
          RELEASE_FANOUT: ${{ github.event.inputs.release_fanout || '1' }}
          WATCH_EVERY: ${{ github.event.inputs.watch_every_ticks || '2' }}
        run: |
          set -uo pipefail
          # WHY THIS CHAINS, having previously refused to. The first version of this file asserted that a
          # GITHUB_TOKEN-authenticated dispatch cannot create a workflow run, and declined to self-restart on
          # that basis. THAT WAS FALSE — gpu-ternary-fep-vast.yml:329 dispatches its own launch with
          # github.token and those launches really rented hosts. A remembered platform rule was written into
          # a comment and then used to justify a design decision, in the one file whose job is to stop
          # unsupervised billing.
          #
          # The job ceiling is 6 h and cannot be raised, so a window ALWAYS ends. The fan-out runs for days.
          # Without a chain the cadence dies mid-run and re-placement silently reverts to a cron measured at
          # 141-220 min gaps — which is the exact loss this workflow exists to prevent, arriving on a timer.
          #
          # The honest objection to chaining is that a chain whose last link fails leaves no supervisor AND
          # no signal. That is answered by VERIFYING the successor exists rather than assuming the dispatch
          # worked, and shouting if it does not.
          gh workflow run step1-fanout-supervisor.yml --ref main \
             -f hours="${HOURS}" -f tick_every_min="${EVERY}" \
             -f fleet_branch="${FLEET_BRANCH}" -f release_fanout="${RELEASE_FANOUT}" \
             -f watch_every_ticks="${WATCH_EVERY}" 2>/tmp/h || true
          # ★★ ONE LOOK AFTER 25 s WAS NOT ENOUGH, AND IT MADE EVERY HANDOVER RED (measured 2026-07-30,
          # 11:09 PM ET). Run 30493589020 dispatched its successor at 03:09:21Z — the API even printed the
          # new run's URL, 30510411940 — and then failed at 03:09:46Z with "SUPERVISOR CHAIN BROKEN: no
          # successor exists". The successor was alive the whole time and is running now; `gh run list`
          # simply had not published it 25 seconds in.
          #
          # This is CLAUDE.md §6's measured Actions-API lag arriving in a new place: that rule says to read
          # a step's timing from its COMPLETED record because a live poll manufactures stalls that are not
          # there, and a single immediate poll here manufactures a broken chain that is not there.
          #
          # WHY IT MATTERS MORE THAN A COSMETIC RED. The whole point of this check is that a broken chain
          # must be LOUD. A check that cries wolf on every successful handover destroys exactly that: both
          # prior runs are already `failure` for this reason, so the signal a real break would raise is one
          # nobody can pick out. Same principle as the lane's own rule that a red job meaning "correctly
          # refused on price" must be distinguishable at a glance from a red job meaning "the launcher is
          # broken".
          #
          # So: poll with backoff and only shout if it is STILL absent after ~2 minutes. A dispatched run
          # appears well inside that; a dispatch that genuinely failed never will.
          # Confirm from the API that a successor actually EXISTS and is not this same run. A dispatch that
          # returns 0 and creates nothing is precisely how the first supervisor "ran" for six minutes while
          # dispatching zero ticks.
          SUCC=0
          for attempt in 1 2 3 4 5 6; do
            SUCC=$(gh run list --workflow=step1-fanout-supervisor.yml --limit 5 \
                     --json databaseId,status \
                     --jq "[.[] | select(.databaseId != ${{ github.run_id }}) | select(.status==\"queued\" or .status==\"in_progress\")] | length" 2>/dev/null || echo 0)
            [ "${SUCC:-0}" -ge 1 ] && break
            echo "[handoff] attempt ${attempt}: successor not published by the API yet, waiting"
            sleep 20
          done
          if [ "${SUCC:-0}" -ge 1 ]; then
            echo "::notice title=SUPERVISOR HANDED OFF::a successor is queued or running - the cadence continues without a human."
          else
            echo "::error title=SUPERVISOR CHAIN BROKEN::no successor exists after ~2 min of polling, so tick delivery has just fallen back to GitHub's throttled schedule (MEASURED 141-220 min gaps, against this job's 8 min). The fan-out is still billing. Relaunch: gh workflow run step1-fanout-supervisor.yml --ref main"
            exit 1
          fi
