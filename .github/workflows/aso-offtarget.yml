name: ASO off-target screen + uncapped full-transcriptome eval (junction gapmers)

# Two transcriptome-wide specificity analyses for the fusion-junction gapmer ASOs, at a
# breakpoint chosen via the workflow inputs (blank = canonical):
#   1. junction_aso_offtarget.py — BLASTs each fusion-specific gapmer's target window against
#      human RefSeq RNA (NCBI BLAST URL API), resolving gap-spanning (RNase-H cleavage) vs
#      wing-only (affinity) liabilities to the gap-mismatch level.
#   2. aso_insilico.py — UNCAPPED full-RefSeq (186k-transcript) off-target scan + ViennaRNA
#      target-site accessibility + siRNA-seed module, removing the BLAST HITLIST-50 over-call.
# Internet-only — the dev sandbox can't reach NCBI, so this runs on a GitHub-hosted runner.
#
# ⛔ THIS WORKFLOW OWNS THE `modalities-cache` BRANCH FOR THE ASO/siRNA ARTIFACT FAMILIES. It is the
# only writer of junction-aso-designs*, junction-aso-offtarget*, aso-insilico-evaluation* and
# junction-sirna-designs*, and its publish step OVERWRITES the branch's copies of whatever the run
# produced. So a correction applied to those files by any other means is temporary by construction;
# the durable place for one is this file's publish step, which is where the retracted-seam sweep
# lives. See the comment there and research/modalities/junction_seam_retraction.py.
#
# Result JSON is pushed to the `modalities-cache` branch:
#   git fetch origin modalities-cache && git checkout modalities-cache -- research/modalities/junction-aso-offtarget.json
# CPU only; no AWS/SageMaker/GPU.

on:
  workflow_dispatch:
    inputs:
      codon_breakpoint:
        description: >-
          LEGACY codon-space breakpoint as "ewsKeep,nr4From" — e.g. "200,8". Blank leaves both at the
          canonical 264,2. ⛔ ONE INPUT BECAUSE THE CAP IS TEN AND THIS FILE WAS AT TEN: replacing the
          separate `ews_keep` and `nr4_from` knobs freed the slot `screen_mode` needed, and they were
          always dispatched together and are one concept — the same consolidation `gapmer_geometry`
          made for `oligo_len` and `wing`, for the same reason. Over the cap GitHub delivers EVERY
          input as empty with no error (test_workflow_dispatch_input_cap.py).
        required: false
      out_suffix:
        description: "Output filename suffix, e.g. -bp200-8"
        required: false
      real_junctions:
        description: "REAL exon junctions, separated by spaces or commas. Two-field 'donorExon:NR4A3exon' means EWSR1 (e.g. '12:3 7:3'); three-field 'DONOR:donorExon:NR4A3exon' selects any partner this repo holds a transcript model for (e.g. 'TAF15:11:3 FUS:10:3'). If set, runs the real-junction pipeline (design + gap-resolved BLAST + uncapped eval + junction siRNA) and skips the codon-space screen."
        required: false
      sirna_only_junctions:
        description: "Space-separated REAL exon junctions EWSR1exon:NR4A3exon for which to run ONLY the (fast, no-BLAST) siRNA design — e.g. junctions whose gapmer pipeline is already done ('7:3 12:3')."
        required: false
      gapmer_geometry:
        description: >-
          Gapmer geometry as "length,wing" — e.g. "16,5" (5-6-5, the default) or "20,5" (5-10-5).
          Blank leaves both at the script defaults. ⛔ THIS IS ONE INPUT BECAUSE IT HAS TO BE:
          it replaces the separate `oligo_len` and `wing` knobs, which were always dispatched
          together and are one concept, after adding an 11th input put this workflow OVER
          GitHub's cap of 10 — at which point GitHub silently delivers EVERY input as empty and
          the job runs on defaults with no error (test_workflow_dispatch_input_cap.py).
        required: false
      suffix_tag:
        description: "Extra suffix appended to real-junction outputs, e.g. -20mer (avoids overwriting the 16-mer files)"
        required: false
      hybrid_intron:
        description: "Run hybrid_intron.py in CI mode: Ensembl genomic intron fetch + hybrid-intron seam designs + the SAME gap-resolved BLAST screen. Blank/false = skip."
        required: false
        type: boolean
        default: false
      hybrid_bp_fractions:
        description: "hybrid_intron: comma-separated MODELLED breakpoint positions as a fraction into EWSR1 intron 7 (default 0.25,0.5,0.75). The real per-patient breakpoint is not held by this repo."
        required: false
      seam_retraction_sweep:
        description: "Run NOTHING but the retracted-seam sweep over the modalities-cache tree and publish the banners. No design, no BLAST, no network. Use to repair the branch after a defect is found at source."
        required: false
        type: boolean
        default: false
      screen_mode:
        description: >-
          Which extra screen to run instead of the default pipeline. `premrna` closes the compartment
          the manuscript concedes is unmeasured: an exhaustive <=2-mismatch scan of every design
          against the six parent transcripts' UNSPLICED sequence, gap-resolved and classified as
          intronic / exonic / boundary-spanning. `premrna_genomic` adds the best-effort genome-wide
          BLAST arm for the designs the cleanliness claim rests on. `none` = unchanged behaviour.
        required: false
        type: choice
        options: [none, premrna, premrna_genomic]
        default: none

permissions:
  contents: write

concurrency:
  # ⛔ KEYED BY THE JUNCTION SET, BECAUSE A GLOBAL GROUP MADE EVERY SCREEN SERIAL (2026-08-12).
  # `group: aso-offtarget` with `cancel-in-progress: true` meant a second dispatch KILLED the first,
  # so twelve junctions could only ever be screened one run at a time -- 12 x ~28 min against a
  # 6-hour job ceiling -- and a 20-mer tiling run was silently cancelled by the next dispatch. The
  # guard was aimed at re-dispatching the SAME work, which is still what it does: the key is now the
  # junction set, so a repeat of the same junctions still supersedes its predecessor while different
  # junctions run side by side.
  group: aso-offtarget-${{ inputs.real_junctions }}${{ inputs.sirna_only_junctions }}${{ inputs.suffix_tag }}
  cancel-in-progress: true

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Transcriptome-wide off-target screen (NCBI BLAST, stdlib only)
        if: ${{ inputs.real_junctions == '' && !inputs.hybrid_intron && !inputs.seam_retraction_sweep && inputs.screen_mode == 'none' }}
        working-directory: research/modalities
        env:
          CODON_BREAKPOINT: ${{ inputs.codon_breakpoint }}
          OUT_SUFFIX: ${{ inputs.out_suffix }}
        run: |
          set -u
          # One input, two env vars the scripts already read — the gapmer_geometry pattern. A blank
          # value leaves both unset, which is what the scripts' own defaults expect.
          EWSR1_KEEP_AA="${CODON_BREAKPOINT%%,*}"
          case "$CODON_BREAKPOINT" in *,*) NR4A3_KEEP_AA_FROM="${CODON_BREAKPOINT#*,}" ;; *) NR4A3_KEEP_AA_FROM="" ;; esac
          export EWSR1_KEEP_AA NR4A3_KEEP_AA_FROM
          python junction_aso_offtarget.py

      # ⭐ THE MTIME BASELINE THE PUBLISH STEP STAGES AGAINST. Written before any science step, so
      # `find -newer` can separate "this run wrote it" from "the checkout has always carried it".
      # Its ABSENCE is a hard error at publish rather than a fallback to the glob, because the glob
      # is what overwrote four runs' results on 2026-08-12.
      - name: Mark job start (publish staging baseline)
        run: touch "$RUNNER_TEMP/job-start"

      - name: Install ViennaRNA (for target-site accessibility)
        # Skipped on a seam sweep: that mode runs no design and no evaluation, so a pip install
        # there is pure wall-clock and one more thing that can fail in a repair job.
        if: ${{ !inputs.seam_retraction_sweep }}
        run: pip install ViennaRNA

      - name: Real-junction pipeline (Ensembl exon junctions; design + gap-resolved BLAST + uncapped eval + siRNA)
        if: ${{ inputs.real_junctions != '' }}
        working-directory: research/modalities
        env:
          FUSION_JUNCTION_MODE: real
          JUNCS: ${{ inputs.real_junctions }}
          GAPMER_GEOMETRY: ${{ inputs.gapmer_geometry }}
          SUFFIX_TAG: ${{ inputs.suffix_tag }}
        run: |
          set -u
          # One input, two env vars the scripts already read. A blank geometry leaves both unset,
          # which is what `${OLIGO_LEN:-16}` below and junction_aso._env_int expect.
          OLIGO_LEN="${GAPMER_GEOMETRY%%,*}"
          case "$GAPMER_GEOMETRY" in *,*) WING="${GAPMER_GEOMETRY#*,}" ;; *) WING="" ;; esac
          export OLIGO_LEN WING
          # ⭐ THREE-FIELD FORM ADDED 2026-08-12: `DONOR:donorExon:acceptorExon` (e.g. `TAF15:11:3`)
          # alongside the existing two-field `donorExon:acceptorExon`, which still means EWSR1. EMC
          # is defined by NR4A3 rearrangement to a VARIABLE partner, and until the design lane went
          # donor-generic this screen could only ever run at EWSR1 junctions — so the pan-partner
          # atlas could design at 32 junctions while the transcriptome screen reached 8.
          # ⛔ THE SUFFIX MUST CARRY THE DONOR TOO. `-e11n3` for a TAF15 junction would overwrite
          # nothing today and collide with EWSR1 e11 tomorrow, and a screen filed under a junction
          # label its sequence does not match is the exact shape of the 2026-08-06 retraction.
          # EWSR1 keeps the bare `-e{n}n{n}` suffix so every committed artifact path is unchanged.
          # ⛔ COMMAS ARE ACCEPTED, BECAUSE THEY WERE SILENTLY MIS-PARSED (measured 2026-08-12).
          # This loop word-splits on whitespace. A dispatch of `TAF15:6:3,TCF12:19:3,TCF12:7:3` is
          # therefore ONE token: the three-field arm matches, `%%:*` takes `TAF15`, `%%:*` on the
          # remainder takes `6`, and `##*:` takes the LAST colon-field of the whole string — so it
          # ran TAF15 e6 and discarded two junctions without a word. The run reported success, the
          # publish step committed one junction's artifacts, and the two missing screens looked
          # like reproducible remote failures rather than screens that never ran. Separator
          # confusion in a free-text input is not a user error to be documented; it is a parsing
          # bug, and the fix is to accept both.
          JUNCS="$(printf '%s' "$JUNCS" | tr ',' ' ')"
          for jpair in $JUNCS; do
            case "$jpair" in
              *:*:*) donor="${jpair%%:*}"; rest="${jpair#*:}"; e="${rest%%:*}"; n="${rest##*:}" ;;
              *)     donor="EWSR1"; e="${jpair%%:*}"; n="${jpair##*:}" ;;
            esac
            case "$donor" in
              EWSR1) sfx="-e${e}n${n}${SUFFIX_TAG}" ;;
              *)     sfx="-$(echo "$donor" | tr '[:upper:]' '[:lower:]')e${e}n${n}${SUFFIX_TAG}" ;;
            esac
            echo "::group::real junction ${donor} e${e} :: NR4A3 e${n} (suffix ${sfx}; len=${OLIGO_LEN:-16})"
            # ⚠ WHICH EXON VAR IS SET IS DELIBERATE. `EWSR1_EXON_END` still wins in junction_aso when
            # both are present, so an EWSR1 run passes exactly the variable it always passed and its
            # behaviour is bit-for-bit unchanged. A non-EWSR1 run passes `DONOR_EXON_END` instead,
            # because `EWSR1_EXON_END=11 DONOR_GENE=TAF15` reads like a bug to anyone opening this
            # file and would eventually be "fixed" by someone into a real one.
            export DONOR_GENE="$donor"
            case "$donor" in EWSR1) export EWSR1_EXON_END="$e" ;; *) export DONOR_EXON_END="$e" ;; esac
            NR4A3_EXON_START="$n" OUT_SUFFIX="$sfx" python junction_aso.py          || echo "design failed ${donor} e${e} n${n}"
            NR4A3_EXON_START="$n" OUT_SUFFIX="$sfx" python junction_aso_offtarget.py || echo "offtarget failed ${donor} e${e} n${n}"
            NR4A3_EXON_START="$n" OUT_SUFFIX="$sfx" python aso_insilico.py           || echo "insilico failed ${donor} e${e} n${n}"
            unset DONOR_GENE EWSR1_EXON_END DONOR_EXON_END
            echo "::endgroup::"
          done

      - name: siRNA-only for already-screened real junctions (fast; no BLAST/FASTA)
        if: ${{ inputs.sirna_only_junctions != '' }}
        working-directory: research/modalities
        env:
          FUSION_JUNCTION_MODE: real
          JUNCS: ${{ inputs.sirna_only_junctions }}
        run: |
          set -u
          # ⛔ COMMAS ARE ACCEPTED, BECAUSE THEY WERE SILENTLY MIS-PARSED (measured 2026-08-12).
          # This loop word-splits on whitespace. A dispatch of `TAF15:6:3,TCF12:19:3,TCF12:7:3` is
          # therefore ONE token: the three-field arm matches, `%%:*` takes `TAF15`, `%%:*` on the
          # remainder takes `6`, and `##*:` takes the LAST colon-field of the whole string — so it
          # ran TAF15 e6 and discarded two junctions without a word. The run reported success, the
          # publish step committed one junction's artifacts, and the two missing screens looked
          # like reproducible remote failures rather than screens that never ran. Separator
          # confusion in a free-text input is not a user error to be documented; it is a parsing
          # bug, and the fix is to accept both.
          JUNCS="$(printf '%s' "$JUNCS" | tr ',' ' ')"
          for jpair in $JUNCS; do
            e="${jpair%%:*}"; n="${jpair##*:}"
            sfx="-e${e}n${n}"
            echo "::group::siRNA-only EWSR1 e${e} :: NR4A3 e${n} (suffix ${sfx})"
            EWSR1_EXON_END="$e" NR4A3_EXON_START="$n" OUT_SUFFIX="$sfx" python junction_sirna.py || echo "sirna failed e${e} n${n}"
            echo "::endgroup::"
          done

      # ⛔ NO `|| echo` HERE. The 2026-08-06 incident (run 31130625823) is recorded in
      # junction_aso.py's `_env_int` block: a swallowed command exited 0 after one second and the
      # publish step then republished stale artifacts under a fresh-screen commit message. This
      # step fails the job instead, so a green run means the fetch and the gates really ran.
      - name: Hybrid intron — genomic fetch, seam designs, gap-resolved BLAST screen
        if: ${{ inputs.hybrid_intron }}
        working-directory: research/modalities
        env:
          HYBRID_INTRON_MODE: ci
          TRANSCRIPT_SOURCE: auto        # live Ensembl, diffed against the committed cache
          HYBRID_BP_FRACTIONS: ${{ inputs.hybrid_bp_fractions }}
          GAPMER_GEOMETRY: ${{ inputs.gapmer_geometry }}
        run: |
          set -u
          OLIGO_LEN="${GAPMER_GEOMETRY%%,*}"
          case "$GAPMER_GEOMETRY" in *,*) WING="${GAPMER_GEOMETRY#*,}" ;; *) WING="" ;; esac
          export OLIGO_LEN WING
          python hybrid_intron.py

      # ⭐ THE COMPARTMENT THE MANUSCRIPT CONCEDES IS UNMEASURED. Its Limitations say both committed
      # screens search mature transcript only, that RNase-H1 is nuclear, and that "that gap is
      # closable by a genomic screen and is not closed here" — and until 2026-08-13 that sentence was
      # the ONLY place in the repository where the work appeared. Exhaustive by construction over the
      # six parent transcripts' unspliced sequence, so its completeness is a property of the seeding
      # rather than of a search's sensitivity. Needs Ensembl, so it cannot run in the dev sandbox.
      - name: Pre-mRNA off-target screen (Ensembl unspliced fetch + exhaustive gap-resolved scan)
        if: ${{ inputs.screen_mode == 'premrna' || inputs.screen_mode == 'premrna_genomic' }}
        working-directory: research/modalities
        env:
          # The genomic arm is opt-in and records which database answered; it must never fall back to
          # a transcript database, which would reproduce the defect this step exists to close.
          PREMRNA_GENOMIC: ${{ inputs.screen_mode == 'premrna_genomic' && '1' || '' }}
          PREMRNA_OUT: aso-premrna-offtarget${{ inputs.suffix_tag }}.json
        run: python aso_premrna_offtarget.py

      - name: Uncapped full-transcriptome evaluation (off-target + accessibility + siRNA seed)
        if: ${{ inputs.real_junctions == '' && !inputs.hybrid_intron && !inputs.seam_retraction_sweep && inputs.screen_mode == 'none' }}
        working-directory: research/modalities
        env:
          CODON_BREAKPOINT: ${{ inputs.codon_breakpoint }}
          OUT_SUFFIX: ${{ inputs.out_suffix }}
        run: |
          set -u
          EWSR1_KEEP_AA="${CODON_BREAKPOINT%%,*}"
          case "$CODON_BREAKPOINT" in *,*) NR4A3_KEEP_AA_FROM="${CODON_BREAKPOINT#*,}" ;; *) NR4A3_KEEP_AA_FROM="" ;; esac
          export EWSR1_KEEP_AA NR4A3_KEEP_AA_FROM
          python aso_insilico.py

      - name: Publish result to modalities-cache branch
        if: always()
        run: |
          set -e
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          mkdir -p "$RUNNER_TEMP/res"

          # ⛔⛔ STAGE THE SWEEP TOOL *BEFORE* THE BRANCH SWITCH — `modalities-cache` CARRIES NO CODE.
          # Measured 2026-08-08: `git ls-tree -r origin/modalities-cache | grep -c '\.py$'` returns
          # ZERO. That branch holds artifacts and nothing else, so after the `git checkout -B
          # modalities-cache` below, junction_seam_retraction.py, junction_aso.py,
          # fusion_breakpoints.py and nr4a3-exon-audit.json are all GONE from the working tree.
          # Running the sweep from `research/modalities` after the switch would therefore fail with
          # a missing file on every publish — and because the sweep is a hard gate, it would block
          # ALL publishing from this workflow, converting a data-integrity guard into an outage.
          # So the tool and every input it reads are copied out first and invoked from there, with
          # `--dir` pointing at the checked-out artifact tree. The module resolves its imports and
          # its exon audit relative to its OWN directory, which is why the inputs travel with it.
          mkdir -p "$RUNNER_TEMP/tool"
          cp research/modalities/junction_seam_retraction.py \
             research/modalities/junction_aso.py \
             research/modalities/fusion_breakpoints.py \
             research/modalities/nr4a3-exon-audit.json \
             research/modalities/emc-construct-inputs.json \
             research/modalities/fusion-object-inventory.json "$RUNNER_TEMP/tool/"
          # Fail NOW, on the ref that has the code, rather than after the switch: a self-test here
          # proves the staged copy can build its reference sets at all. `--dir` on an empty
          # directory grades nothing and is a pure import/derivation check.
          mkdir -p "$RUNNER_TEMP/selftest"
          python3 "$RUNNER_TEMP/tool/junction_seam_retraction.py" --check --dir "$RUNNER_TEMP/selftest" || {
            echo "::error::the staged seam-sweep tool cannot run — refusing to publish"; exit 1; }

          # ⛔⛔ A SWEEP DISPATCH MUST STAGE NOTHING FROM THE CHECKOUT, AND LEARNING THAT COST DATA.
          # MEASURED, run 31277458528 (2026-08-08): the first seam-sweep dispatch ran no science
          # step, so these `cp`s staged the *repository's committed copies* of these globs and the
          # publish then wrote them over the branch's own. `hybrid-intron-model.json` went from
          # 134,817 bytes on `modalities-cache` to the 16,934-byte copy tracked in the repo — a
          # 3,130-line deletion in a commit whose subject said it was bannering seams.
          # ⛔ THAT IS THIS FILE'S OWN RECORDED FAILURE, REINTRODUCED BY A NEW MODE: the
          # hybrid-intron step above carries the note about run 31130625823, where a swallowed
          # command let the publish "republish stale artifacts under a fresh-screen commit
          # message". The commit message here was honest; the staging was not. A mode that runs no
          # producer has no outputs, and copying a checked-in file is not a result.
          # The branch is the accumulating home for these artifacts; the checkout is not.
          # ⛔⛔ STAGE ONLY WHAT THIS RUN PRODUCED — A GLOB STAGES THE CHECKOUT'S STALE COPIES TOO.
          # MEASURED 2026-08-12, and it destroyed real results. Five screens ran concurrently for the
          # first time (the concurrency group used to serialise them). Each one's publish copied
          # `junction-aso-offtarget*.json` FROM THE REPO CHECKOUT, which carries committed copies of
          # every junction — including the ones this run did not screen — and wrote them over the
          # branch's newer artifacts. The commit chain shows it plainly: f53c6c7c ADDED e12n3
          # (+194 lines), the next run REMOVED it (-194) while adding its own, the next removed
          # those, and only the last run's junctions survived. Four of five runs' science was
          # overwritten by stale files while every run reported success.
          # ⛔ THIS IS THIS FILE'S OWN RECORDED FAILURE IN A NEW MODE. The block above documents
          # exactly it for `seam_retraction_sweep` — "copying a checked-in file is not a result" —
          # and guarded only that one path. The normal screening path had the same defect and was
          # invisible while runs were serial, because a serial run's checkout was never staler than
          # the branch by more than its own output.
          # The fix is to stage by MTIME against a marker written before the science steps, so only
          # files this job actually wrote can travel. A run that produced nothing now stages
          # nothing, instead of republishing the repository at the branch.
          if [ "${{ inputs.seam_retraction_sweep }}" != "true" ]; then
            if [ -f "$RUNNER_TEMP/job-start" ]; then
              find research/modalities -maxdepth 1 -name 'junction-aso-designs*.json' \
                   -newer "$RUNNER_TEMP/job-start" -exec cp {} "$RUNNER_TEMP/res/" \; 2>/dev/null || true
              find research/modalities -maxdepth 1 -name 'junction-aso-offtarget*.json' \
                   -newer "$RUNNER_TEMP/job-start" -exec cp {} "$RUNNER_TEMP/res/" \; 2>/dev/null || true
              # ⚠ `aso-premrna-*` NEEDS ITS OWN LINE: the glob above is `junction-aso-offtarget*` and
              # does NOT match `aso-premrna-offtarget*`, so without this the pre-mRNA screen would run,
              # report success, and publish nothing — the shape of every silent-loss incident recorded
              # in this step. The SEQUENCE CACHE travels too, deliberately: it is what makes the screen
              # re-derivable offline, which is what the manuscript's availability statement claims.
              find research/modalities -maxdepth 1 -name 'aso-premrna-*.json' \
                   -newer "$RUNNER_TEMP/job-start" -exec cp {} "$RUNNER_TEMP/res/" \; 2>/dev/null || true
              echo "staged $(ls -1 "$RUNNER_TEMP/res" 2>/dev/null | wc -l) file(s) written by THIS run"
            else
              echo "::error::no job-start marker — refusing to stage by glob, which would republish"
              echo "::error::the checkout's stale copies over this branch's newer artifacts"
              exit 1
            fi
            cp research/modalities/aso-insilico-evaluation*.json "$RUNNER_TEMP/res/" 2>/dev/null || true
            cp research/modalities/junction-sirna-designs*.json "$RUNNER_TEMP/res/" 2>/dev/null || true
            cp research/modalities/hybrid-intron-model.json "$RUNNER_TEMP/res/" 2>/dev/null || true
          else
            echo "seam sweep: staging nothing from the checkout — the branch's artifacts are the subject, not the output"
          fi
          git fetch origin modalities-cache || true
          rm -f research/modalities/*.json research/modalities/*.png
          if git show-ref --verify --quiet refs/remotes/origin/modalities-cache; then
            git checkout -B modalities-cache origin/modalities-cache
          else
            git checkout --orphan modalities-cache
            git rm -rf . >/dev/null 2>&1 || true
          fi
          mkdir -p research/modalities
          # ⛔⛔ RESTORE THE BRANCH'S OWN TREE BEFORE COPYING. MEASURED, run 31696283722 (2026-08-13):
          # this publish DELETED 39 `junction-aso-designs*.json` artifacts from `modalities-cache`
          # under a commit message that said it had published screens. Mechanism, and it is a shell
          # bug rather than a git one: `rm -f research/modalities/*.json` above deletes the
          # FEATURE-BRANCH copies; `git checkout -B` then CARRIES those working-tree deletions across,
          # because for a file whose content is identical in both refs the deletion is an uncommitted
          # local change git can preserve. The tree therefore arrives on `modalities-cache` with 39
          # files missing. Then `git add research/modalities/junction-aso-designs*.json` — with the
          # glob matching NOTHING in the working tree — is passed to git LITERALLY by the shell, git
          # expands it as a pathspec against the INDEX instead, and stages all 39 deletions.
          # ⭐ THAT IS WHY THE OFF-TARGET GLOB ON THE NEXT LINE DID NOT DO THE SAME THING: it matched
          # at least one `-graded.json` file that exists only on this branch, so the shell expanded it
          # to real paths and no deletion was ever staged. Whether a family survives depended on
          # whether a sibling file happened to exist. Nothing about that is a property anyone chose.
          # The recorded guards did not fire because they all reason about what the run PRODUCED, and
          # this loss came from what the checkout carried IN.
          git checkout HEAD -- research/modalities 2>/dev/null || true
          cp "$RUNNER_TEMP"/res/*.json research/modalities/ 2>/dev/null || true
          git add research/modalities/junction-aso-designs*.json 2>/dev/null || true
          git add research/modalities/junction-aso-offtarget*.json 2>/dev/null || true
          git add research/modalities/aso-insilico-evaluation*.json 2>/dev/null || true
          git add research/modalities/junction-sirna-designs*.json 2>/dev/null || true
          git add research/modalities/hybrid-intron-model.json 2>/dev/null || true
          git add research/modalities/aso-premrna-*.json 2>/dev/null || true

          # ⛔⛔ THE RETRACTED-SEAM SWEEP, AND IT RUNS ON *EVERY* PUBLISH — NOT ONLY IN SWEEP MODE.
          # Measured 2026-08-08 at this branch's tip: THIRTEEN committed design artifacts carried the
          # acceptor seam `TTGTCCGTACAG` — NR4A3 CDS nt 1081, residue 361, one of the three resume
          # residues the exon-index off-by-two produced — with no banner of any kind, while
          # research/manuscripts/aso/fusion-junction-aso-working-record.md told readers those files "do not exist
          # ... on origin/modalities-cache". They had existed since commit 30eb5684 (2026-07-03), the
          # single CI commit FROM THIS WORKFLOW that created all thirteen.
          #
          # ⛔ THIS IS WHY THE SWEEP LIVES HERE AND NOT IN A CRON OR A ONE-OFF REPAIR. A banner
          # committed to the branch by any other means is a banner this step overwrites on its next
          # run: the publish copies the run's outputs over the branch's copies, so anything this
          # workflow regenerates loses whatever was stamped into it elsewhere. Putting the grader
          # INSIDE the publish makes the repair a property of the WRITER instead of a state of the
          # branch — the workflow that owns `modalities-cache` can no longer publish an unbannered
          # retracted artifact, whatever it was dispatched to do. It also covers the files this run
          # did not touch, which is the entire population that went unwatched for a month.
          #
          # $0 CPU over committed inputs: no network, no design, no prediction. It BANNERS, it does
          # not rewrite — every number in a banner is counted from what is already in the file, and
          # the grade is re-derived from the committed transcript model, so when a panel is genuinely
          # regenerated this same pass LIFTS the banner instead of stamping it.
          python3 "$RUNNER_TEMP/tool/junction_seam_retraction.py" --write --dir research/modalities || {
            echo "::error::seam-retraction sweep failed - refusing to publish unswept artifacts"; exit 1; }
          git add research/modalities/*.json 2>/dev/null || true

          # ⛔ AND THEN REFUSE. A sweep whose failure does not stop the publish is a report, not a
          # guard. `--write` above repairs the tree; this proves it did, and re-reads the tree so an
          # artifact the write path skipped for any reason still blocks the push.
          python3 "$RUNNER_TEMP/tool/junction_seam_retraction.py" --check --dir research/modalities || {
            echo "::error::a retracted junction seam is still unbannered after the sweep - NOT publishing"; exit 1; }

          # ⛔ THE COMMIT MESSAGE MUST DESCRIBE WHAT ACTUALLY RAN. A seam-sweep dispatch runs no
          # design, no BLAST and no evaluation, so committing it under the screen message would
          # label a banner-only repair as a fresh screen — bit-for-bit the failure this file already
          # records at the hybrid-intron step (run 31130625823: a swallowed command exited 0 and the
          # publish then republished stale artifacts under a fresh-screen commit message). A commit
          # subject is the only description of a CI write most readers will ever see.
          if [ "${{ inputs.seam_retraction_sweep }}" = "true" ]; then
            MSG="retracted-seam sweep: banner every design artifact whose acceptor seam the corrected transcript model does not produce (no design, no BLAST, no network)"
          else
            MSG="ASO real/reference junction screens: design + gap-resolved BLAST + uncapped eval + siRNA"
          fi
          # ⛔⛔ THIS WORKFLOW ADDS AND UPDATES ARTIFACTS. IT NEVER DELETES ONE. Every guard above
          # reasons about what the run PRODUCED — the mtime baseline, the "copying a checked-in file
          # is not a result" rule, the commit-message check — and run 31696283722 lost 39 artifacts
          # anyway, because the loss came from what the checkout carried IN rather than from what the
          # run wrote out. A guard on the diff is the only one that cannot be sidestepped by a new
          # mode: whatever the cause, a staged deletion means this publish is about to remove someone
          # else's result, so it stops. Recovering a deleted artifact costs a git archaeology session;
          # a red build costs a re-dispatch.
          if git diff --cached --diff-filter=D --name-only | grep -q . ; then
            echo "::error::this publish would DELETE artifacts from modalities-cache — refusing"
            git diff --cached --diff-filter=D --name-only | sed 's|^|::error::  would delete |'
            echo "::error::a mode that produces nothing must publish nothing, not remove what is there"
            exit 1
          fi
          git commit -m "$MSG" || { echo "no changes"; exit 0; }
          git push origin modalities-cache
