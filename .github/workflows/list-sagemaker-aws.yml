name: List in-progress SageMaker jobs (AWS, read-only)

# Read-only SageMaker/S3 forensics. Starts nothing, rents nothing, stops nothing — every call is a
# Describe/List. Free (a GitHub-hosted CPU runner).
#
# ⚠ THE BLIND SPOT THIS WORKFLOW EXISTS TO NOT HAVE AGAIN (2026-08-02). Every LISTING call here is
# `StatusEquals`-filtered, so a **Failed** training job matches none of the default modes. On 2026-08-02 that
# produced three independent "nothing here" reads for a job that existed, had failed, and had a FailureReason
# — and the absence was read as non-existence (CLAUDE.md §4). `mode=job` and `mode=forensic` are the
# unfiltered reads: `DescribeTrainingJob` answers for a job in ANY state.
#
# REQUIRES secrets: AWS_ACCESS_KEY_ID, AWS_SECRET_ACCESS_KEY (region is a workflow input).

on:
  workflow_dispatch:
    inputs:
      s3_prefix:
        description: "optional: list this S3 prefix (under the default bucket) and return, instead of jobs"
        default: ""
        required: false
      mode:
        description: "'job' = FULL terminal record of one job by name, ANY state (status, FailureReason, transitions, billable, CloudWatch log) — the only mode that can see a FAILED job; 'forensic' = the whole sel-cbp30 incident (ckpt provenance + every matching job + spend), commits abfe-sel-ckpt-forensic.json; 'spend_census' = READ-ONLY census of everything billing at rest (S3/ECR/EBS/CloudWatch/SageMaker-per-hour) + Cost Explorer if permitted, commits aws-spend-census.json; 'savings' = realized managed-spot discount (now includes Failed); 'abfe_rate' = measured per-leg ABFE rate; 'abfe_ready' = ABFE dispatch-readiness; blank = in-progress jobs"
        default: ""
        required: false
      job_name:
        description: "mode=job: exact training-job name, or a substring (then the FULL paginated history across EVERY status is searched)"
        default: ""
        required: false
      forensic_tag:
        description: "mode=forensic: the S3 checkpoint tag to investigate"
        default: "sel-cbp30-v1"
        required: false
      instance_filter:
        description: "savings mode: restrict to instance types containing this string, e.g. ml.g5.xlarge. abfe_rate mode: the job-NAME substring to match (default 'abfe'). abfe_ready mode: the checkpoint TAG to check (default 'sel-cbp30-v1')"
        default: ""
        required: false
      shutdown_targets:
        description: "mode=shutdown: comma list of what to switch off — mpu_abort, log_retention, log_delete, ecr_prune, ecr_delete_all, ebs_detached, ebs_snapshots, s3_prefixes, s3_purge, s3_glacier. Default is the two that lose no data."
        default: "mpu_abort,log_retention"
        required: false
      shutdown_apply:
        description: "mode=shutdown: 'true' actually performs the actions. ANY OTHER VALUE IS A DRY RUN. Deletion is irreversible — dry-run first and read the object counts."
        default: "false"
        required: false
      keep_images:
        description: "mode=shutdown, TARGETS=ecr_prune: how many newest images to KEEP per repo. 0 empties the repo. ecr_prune uses BatchDeleteImage, a different IAM action from ecr_delete_all's DeleteRepository — so it can work where the other is denied."
        default: "1"
        required: false
      purge_include_tooling:
        description: "mode=shutdown, TARGETS=s3_purge: 'true' also deletes TOOLING_PREFIXES (mdenv/). The bucket is then completely empty."
        default: "false"
        required: false
      purge_confirm:
        description: "mode=shutdown, TARGETS=s3_purge: must be the literal DELETE-EVERYTHING. The whole-bucket delete does nothing without it, so no default or typo can reach it."
        default: ""
        required: false

permissions:
  contents: write

jobs:
  list:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install boto3
      - name: List SageMaker jobs
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          # ⛔ NOT A DISPATCH INPUT, AND THE REASON IS A HARD LIMIT RATHER THAN A PREFERENCE.
          # GitHub caps `workflow_dispatch` at TEN inputs; this workflow declared ELEVEN, so it could
          # not be dispatched at all and `test_workflow_dispatch_input_cap` was red on clean main.
          # ★ REGION IS THE ONE THAT COULD LEAVE WITHOUT COSTING ANYTHING. The other ten are either
          # selectors that decide WHICH resources a run touches or interlocks that decide WHETHER it
          # may delete them (`shutdown_apply`, `purge_confirm`, `purge_include_tooling`) — and
          # collapsing two interlocks into one to satisfy a lint would weaken a guard on a
          # resource-DELETING path for a linter's convenience. Region selects nothing and guards
          # nothing; it is configuration with a default.
          # ⚠ CONFIGURABILITY IS KEPT, NOT DROPPED: set the repository variable SAGEMAKER_REGION to
          # override. A hardcoded constant would have been the smaller diff and the worse answer.
          AWS_DEFAULT_REGION: ${{ vars.SAGEMAKER_REGION || 'us-east-2' }}
          S3_PREFIX: ${{ inputs.s3_prefix }}
          MODE: ${{ inputs.mode }}
          JOB_NAME: ${{ inputs.job_name }}
          ABFE_TAG: ${{ inputs.forensic_tag }}
          INSTANCE_FILTER: ${{ inputs.instance_filter }}
          TARGETS: ${{ inputs.shutdown_targets }}
          APPLY: ${{ inputs.shutdown_apply == 'true' && '1' || '0' }}
          PURGE_CONFIRM: ${{ inputs.purge_confirm }}
          KEEP_IMAGES: ${{ inputs.keep_images }}
          PURGE_INCLUDE_TOOLING: ${{ inputs.purge_include_tooling == 'true' && '1' || '0' }}
        run: |
          if [ -z "$AWS_ACCESS_KEY_ID" ]; then
            echo "::error::Add AWS_ACCESS_KEY_ID, AWS_SECRET_ACCESS_KEY repo secrets first."
            exit 1
          fi
          cd research/modalities
          if [ "$MODE" = "forensic" ]; then
            python abfe_sel_forensic.py --tag "$ABFE_TAG"
          elif [ "$MODE" = "spend_census" ]; then
            python aws_spend_census.py
          elif [ "$MODE" = "spend_probe" ]; then
            python aws_spend_probe.py
          elif [ "$MODE" = "shutdown" ]; then
            # The census artifact is the ONLY source of what gets touched, so the run acts on numbers a
            # human has already read rather than on whatever it discovers at execution time.
            python aws_spend_census.py > /dev/null
            python aws_spend_shutdown.py
          else
            python list_sagemaker.py
          fi
      - name: Commit the forensic artifact back to the triggering branch
        if: ${{ inputs.mode == 'forensic' }}
        run: |
          PUBLISH_IF_CHANGED=1 bash research/compute/publish_artifacts.sh "${{ github.ref_name }}" \
            "abfe sel-cbp30 forensic: terminal job state, FailureReason, billable, ckpt provenance (CI, \$0)" \
            research/modalities/abfe-sel-ckpt-forensic.json
      - name: Commit the spend census back to the triggering branch
        if: ${{ inputs.mode == 'spend_census' }}
        run: |
          PUBLISH_IF_CHANGED=1 bash research/compute/publish_artifacts.sh "${{ github.ref_name }}" \
            "aws spend census: what still bills at rest with every AWS lane retired (CI, \$0)" \
            research/modalities/aws-spend-census.json
      - name: Commit the capability probe back to the triggering branch
        if: ${{ inputs.mode == 'spend_probe' }}
        run: |
          PUBLISH_IF_CHANGED=1 bash research/compute/publish_artifacts.sh "${{ github.ref_name }}" \
            "aws spend probe: which shutdown routes the CI key is permitted to take (CI, \$0)" \
            research/modalities/aws-spend-probe.json
      - name: Commit the shutdown ledger and the post-action census
        if: ${{ inputs.mode == 'shutdown' }}
        run: |
          PUBLISH_IF_CHANGED=1 bash research/compute/publish_artifacts.sh "${{ github.ref_name }}" \
            "aws shutdown: ${{ inputs.shutdown_apply == 'true' && 'APPLIED' || 'dry run' }} targets=${{ inputs.shutdown_targets }} (CI, \$0)" \
            research/modalities/aws-spend-shutdown.json research/modalities/aws-spend-census.json
