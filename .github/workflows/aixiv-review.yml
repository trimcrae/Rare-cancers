# Drive aiXiv's automated adversarial review from CI, where the token lives.
#
# WHY THIS IS A WORKFLOW AT ALL. AIXIV_TOKEN is a GitHub Actions secret, so the dev sandbox cannot
# hold it and every authenticated aiXiv call has to originate here. This is `ci-escape-hatches` §0
# rung 1 used correctly: not because the question is hard, but because the credential exists in
# exactly one place.
#
# ⛔ THE LOGS OF THIS REPOSITORY ARE WORLD-READABLE. Nothing here prints a response body. The
# `verify` mode prints an allowlist of fields (see scripts/aixiv_review.py), and the token is a
# secret so Actions masks it — but masking is a backstop, not a licence to echo it.
#
# ⛔ `submit` IS OUTWARD-FACING AND DOUBLE-GATED, ON PURPOSE. The workflow input below must be set
# to true AND the script's own --i-understand-this-is-outward-facing flag is passed only when it is.
# Uploading a manuscript to a third party is not undone by deleting a row: it may have been fetched,
# cached or indexed in between (CLAUDE.md §3). Default is `verify`, which writes nothing anywhere.
name: aiXiv — verify, review, fetch

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "What to do"
        type: choice
        options: [verify, dry-run-submit, submit, new-version, review, fetch, status, calibrate]
        default: verify
      pdf:
        description: "Path to the PDF (submit / dry-run-submit / review)"
        required: false
        default: ""
      meta:
        description: "Path to the SubmissionCreate metadata JSON (submit / dry-run-submit)"
        required: false
        default: ""
      aixiv_id:
        description: "aiXiv id (review / fetch)"
        required: false
        default: ""
      version:
        # ⛔ BARE, NOT `v`-PREFIXED. aiXiv LABELS versions `v1.4` but /api/get-review rejects that
        # form with HTTP 422 — "version must be in the format 'X.Y' or 'X.Y.Z'" (run 32648024032).
        # The client normalises it now, so either form reaches the API correctly; this default is
        # bare anyway because it is also what the commit message below interpolates, and `v${{...}}`
        # over a `v`-prefixed input produced "vv1.4".
        description: "Submission version WITHOUT the v prefix, e.g. 1.0 (review / fetch)"
        required: false
        default: "1.0"
      seed:
        description: "Review seed — record it with the round's pin so the round is re-runnable"
        required: false
        default: ""
      calibrate_limit:
        description: "calibrate only: how many papers to pull reviews for. 2000 = the whole corpus."
        required: false
        default: "150"
      is_public:
        description: "submit only: metadata about intent, NOT access control. Measured 2026-08-22: is_public=0 still serves the paper publicly at /abs/ and /api/pdf/. BOTH VALUES PUBLISH."
        required: false
        default: "0"
      i_understand_this_is_outward_facing:
        description: "submit only: must be true. Uploading to a third party is not reversible in practice."
        type: boolean
        default: false

permissions:
  # `fetch` commits the reviews back — see the publish step. A review that exists only in a job log
  # or a 90-day run artifact is one nobody can quote in a hardening round's record.
  contents: write

concurrency:
  group: aixiv-${{ inputs.mode }}-${{ inputs.aixiv_id || 'none' }}
  cancel-in-progress: false

jobs:
  aixiv:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Verify the token (read-only, writes nothing)
        if: ${{ inputs.mode == 'verify' }}
        env:
          AIXIV_TOKEN: ${{ secrets.AIXIV_TOKEN }}
        run: python3 scripts/aixiv_review.py verify

      # No token: the dry run is a payload printer and must stay runnable without one, so that
      # checking the metadata never requires holding the credential.
      - name: Dry-run the submission payload
        if: ${{ inputs.mode == 'dry-run-submit' }}
        run: |
          python3 scripts/aixiv_review.py submit \
            --pdf "${{ inputs.pdf }}" --meta "${{ inputs.meta }}" \
            --public "${{ inputs.is_public }}" --dry-run

      - name: ⛔ Refuse a submit that was not explicitly acknowledged
        if: ${{ inputs.mode == 'submit' && !inputs.i_understand_this_is_outward_facing }}
        run: |
          echo "::error::mode=submit requires i_understand_this_is_outward_facing=true. This uploads" \
               "a manuscript to a third party and is not reversible in practice (CLAUDE.md §3)." \
               "Run mode=dry-run-submit first and read the payload."
          exit 1

      - name: Submit to aiXiv (OUTWARD-FACING)
        if: ${{ inputs.mode == 'submit' && inputs.i_understand_this_is_outward_facing }}
        env:
          AIXIV_TOKEN: ${{ secrets.AIXIV_TOKEN }}
        run: |
          python3 scripts/aixiv_review.py submit \
            --pdf "${{ inputs.pdf }}" --meta "${{ inputs.meta }}" \
            --public "${{ inputs.is_public }}" --i-understand-this-is-outward-facing

      - name: ⛔ Refuse a new-version post that was not explicitly acknowledged
        if: ${{ inputs.mode == 'new-version' && !inputs.i_understand_this_is_outward_facing }}
        run: |
          echo "::error::mode=new-version requires i_understand_this_is_outward_facing=true. A" \
               "revision publishes new text and does NOT withdraw the previous version."
          exit 1

      - name: Post a revised version (OUTWARD-FACING)
        if: ${{ inputs.mode == 'new-version' && inputs.i_understand_this_is_outward_facing }}
        env:
          AIXIV_TOKEN: ${{ secrets.AIXIV_TOKEN }}
        run: |
          python3 scripts/aixiv_review.py new-version \
            --aixiv-id "${{ inputs.aixiv_id }}" \
            --pdf "${{ inputs.pdf }}" --meta "${{ inputs.meta }}" \
            --public "${{ inputs.is_public }}" --i-understand-this-is-outward-facing

      # No token: /api/submissions/public and /api/get-review both carry no security requirement.
      - name: Calibrate what a Rating means against the public corpus
        if: ${{ inputs.mode == 'calibrate' }}
        run: |
          python3 scripts/aixiv_review.py calibrate --limit "${{ inputs.calibrate_limit }}" --mine 6

      - name: Start an attack review
        if: ${{ inputs.mode == 'review' }}
        env:
          AIXIV_TOKEN: ${{ secrets.AIXIV_TOKEN }}
        run: |
          python3 scripts/aixiv_review.py review \
            --aixiv-id "${{ inputs.aixiv_id }}" --version "${{ inputs.version }}" \
            --pdf "${{ inputs.pdf }}" ${{ inputs.seed && format('--seed {0}', inputs.seed) || '' }}

      # ⛔ WHAT TO RUN WHEN `fetch` COMES BACK EMPTY. An empty review_list cannot distinguish "the
      # version does not exist" from "it exists but is not queued" from "it is queued and the
      # reviewer has not run", and polling harder distinguishes none of them. This prints every
      # version aiXiv holds for the id with its status and review count. Needs no token.
      # ⚠ NEEDS THE TOKEN, unlike the other read-only modes: the pending-review queue takes it as a
      # QUERY PARAMETER (measured — a bearer header gets HTTP 422 there). The client puts it in the
      # URL and never prints the URL, because these logs are world-readable.
      - name: What aiXiv holds for this paper (versions, status, review counts)
        if: ${{ inputs.mode == 'status' }}
        env:
          AIXIV_TOKEN: ${{ secrets.AIXIV_TOKEN }}
        run: python3 scripts/aixiv_review.py status --aixiv-id "${{ inputs.aixiv_id }}"

      - name: Fetch recorded reviews
        if: ${{ inputs.mode == 'fetch' }}
        run: |
          python3 scripts/aixiv_review.py fetch \
            --aixiv-id "${{ inputs.aixiv_id }}" --version "${{ inputs.version }}" \
            --out research/literature/aixiv-reviews

      # ⚠ THE REVIEW IS THE DELIVERABLE. Committed to the triggering branch so a hardening round can
      # cite it by path, not by run id — a 90-day artifact is not a record.
      #
      # ⛔ VIA THE PRIMITIVE, NOT BY HAND. The first version of this step hand-rolled
      # add/commit/push with a fetch+rebase retry loop, and `test_no_hand_rolled_publish` failed it
      # in PREFLIGHT_FULL — correctly: that shape leaves the repo MID-REBASE on the first conflict,
      # every retry then dies on the wreckage rather than on anything new, and the step ends on a
      # warning while reporting SUCCESS. `research/compute/publish_artifacts.sh` is the one home for
      # this operation. PUBLISH_IF_CHANGED=1 because a review is an EVENT, not a heartbeat: there is
      # no timestamp here whose freshness anything grades, so an unchanged tree should stay silent.
      - name: Publish the reviews to the triggering branch
        if: ${{ always() && inputs.mode == 'fetch' }}
        continue-on-error: true
        env:
          PUBLISH_IF_CHANGED: "1"
        run: |
          ls research/literature/aixiv-reviews/*.json >/dev/null 2>&1 || {
            echo "::warning::no reviews fetched; nothing to publish"; exit 0; }
          bash research/compute/publish_artifacts.sh "${{ github.ref_name }}" \
            "aixiv reviews: ${{ inputs.aixiv_id }} v${{ inputs.version }} (CI)" \
            research/literature/aixiv-reviews

      # ⚠ THE REVIEW IS THE DELIVERABLE, SO IT MUST SURVIVE THE RUNNER. A review read only in a job
      # log is one nobody can quote in a hardening round's record.
      - name: Keep the fetched reviews
        if: ${{ always() && inputs.mode == 'fetch' }}
        uses: actions/upload-artifact@v4
        with:
          name: aixiv-reviews-${{ github.run_id }}
          path: research/literature/aixiv-reviews
          if-no-files-found: warn
