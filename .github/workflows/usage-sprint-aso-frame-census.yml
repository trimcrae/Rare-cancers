name: ASO frame census sprint
on:
  push:
    branches:
      - codex/usage-sprint-2026-10-01-frame-census
    paths:
      - .github/workflows/usage-sprint-aso-frame-census.yml
      - research/autonomy/usage-sprint-2026-10-01/frame-census/**
      - research/modalities/aso_independent_verification.py
      - research/modalities/tests/test_aso_independent_verification_integrity.py
permissions:
  contents: read
concurrency:
  group: usage-sprint-aso-frame-census-${{ github.ref }}
  cancel-in-progress: false
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install targeted test dependency
        timeout-minutes: 3
        run: python3 -m pip install pytest
      - name: Targeted verifier behavior
        run: >-
          python3 -m pytest
          research/modalities/tests/test_aso_independent_verification.py
          research/modalities/tests/test_aso_independent_verification_integrity.py -q
      - name: Reproduce unchanged scientific verification artifact
        run: python3 research/modalities/aso_independent_verification.py --check
      - name: Generate and capture derived census and live metadata
        run: |
          set -euo pipefail
          git rev-parse HEAD
          test -z "$(git status --porcelain)"
          snapshot=$(mktemp)
          cp research/manuscripts/aso/fusion-junction-aso-preprint-checklist.md "$snapshot"
          trap 'git restore research/manuscripts/aso/fusion-junction-aso-archive-manifest.json research/manuscripts/aso/fusion-junction-aso-preprint-checklist.md; rm -f research/autonomy/usage-sprint-2026-10-01/frame-census/aso-frame-candidate-census.json "$snapshot"' EXIT
          python3 research/autonomy/usage-sprint-2026-10-01/frame-census/aso_frame_candidate_census.py
          python3 research/autonomy/usage-sprint-2026-10-01/frame-census/aso_frame_candidate_census.py --check
          python3 research/manuscripts/aso_archive_manifest.py
          python3 research/manuscripts/aso_archive_manifest.py --check
          python3 research/manuscripts/aso_deposit_drift.py
          python3 research/manuscripts/aso_deposit_drift.py --check
          python3 - "$snapshot" <<'PY'
          from pathlib import Path
          import subprocess
          import sys
          allowed = {
              "research/manuscripts/aso/fusion-junction-aso-archive-manifest.json",
              "research/manuscripts/aso/fusion-junction-aso-preprint-checklist.md",
          }
          changed = set(subprocess.check_output(["git", "diff", "--name-only"], text=True).splitlines())
          assert changed == allowed, changed
          old = Path(sys.argv[1]).read_bytes()
          new = Path("research/manuscripts/aso/fusion-junction-aso-preprint-checklist.md").read_bytes()
          begin = b"<!-- BEGIN GENERATED deposit-drift"
          end = b"<!-- END GENERATED deposit-drift -->"
          assert old[:old.index(begin)] == new[:new.index(begin)]
          assert old[old.index(end):] == new[new.index(end):]
          print("CHECKLIST MANUAL HEAD AND TAIL PRESERVED")
          PY
          python3 - <<'PY'
          import base64
          import hashlib
          from pathlib import Path
          paths = {
              "CENSUS": "research/autonomy/usage-sprint-2026-10-01/frame-census/aso-frame-candidate-census.json",
              "ARCHIVE": "research/manuscripts/aso/fusion-junction-aso-archive-manifest.json",
              "CHECKLIST": "research/manuscripts/aso/fusion-junction-aso-preprint-checklist.md",
          }
          for label, path in paths.items():
              raw = Path(path).read_bytes()
              blob = hashlib.sha1(b"blob " + str(len(raw)).encode("ascii") + b"\0" + raw).hexdigest()
              print(f"{label}_METADATA bytes={len(raw)} sha256={hashlib.sha256(raw).hexdigest()} git_blob={blob}")
              print(f"{label}_B64_BEGIN")
              encoded = base64.b64encode(raw).decode("ascii")
              for offset in range(0, len(encoded), 76):
                  print(encoded[offset:offset + 76])
              print(f"{label}_B64_END")
          
          PY
      - name: Confirm preview restoration
        if: ${{ !cancelled() }}
        run: |
          test -z "$(git status --porcelain)"
          git diff --exit-code
