name: R3 — frame-level generation-receptor dependency audit (Gate A)

# $0. CPU-only ubuntu-latest, no GPU, no rental, nothing to tear down. It LISTS the release-druggable S3
# prefix and reads one small JSON manifest, then classifies the result with the pure logic in
# research/modalities/r3_generation_frame_audit.py and commits the artifact.
#
# WHAT IT SETTLES. The paper carries an open SUBMISSION gate: the harmonized pocket rerun "must additionally
# confirm that the exact release-derived frame used to generate `denovo_401` still qualifies as the same
# mapped orthosteric site and still exceeds D*", and "if the generation frame does not qualify, the
# generation receptor -- not merely a reported frame-fraction -- is affected." The committed harmonized
# artifact cannot discharge that, and the reason is stronger than the paper states: the generation receptor
# was never an ENTRY in the rerun at all (sagemaker_src/entry_pocket_reharmonize.py scores af2_static,
# calibration, 8xtt, metad and release_rep0..2 -- there is no release_druggable entry, although
# nr4a3_pocket_reharmonize.detection_from_result implements that kind and the redesign brief's own rerun
# list ends with "exact generation receptor frame").
#
# ⚠ THIS JOB CAN RETURN A REFUSAL, AND A REFUSAL IS THE DELIVERABLE WHEN IT DOES. Four verdicts:
# DISCHARGED_PASS / DISCHARGED_FAIL / FRAME_NAMED_UNSCORED (the manifest names the frame but recorded a
# LEGACY-mode score -- pocket_tracking.match_mode defaults to LEGACY and release-druggable-aws.yml sets no
# POCKET_MATCH) / FRAME_NOT_RECOVERABLE. It never substitutes a nearby frame for the real one.
#
# ⚠ IT LISTS BEFORE IT READS, so "the collector could not read it" stays distinguishable from "it is not
# there" (CLAUDE.md §4: an absent reading is not a reading of absence). The full listing goes into the
# artifact either way.

on:
  workflow_dispatch:
    inputs:
      bucket:
        description: "S3 bucket holding the Step-0 receptor outputs"
        default: "sagemaker-us-east-2-646605541856"
        required: false
      prefix:
        description: "S3 prefix for the release-druggable receptor manifest"
        default: "nr4a3-release-druggable"
        required: false
      region:
        description: "AWS region"
        default: "us-east-2"
        required: false
      score_harmonized:
        description: "true (default) = also score the generation receptor under POCKET_MATCH=harmonized; false = part 1 only"
        default: "true"
        required: false

permissions:
  contents: write

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with: { ref: "${{ github.ref_name }}" }
      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }
      - run: pip install -q boto3
      - name: Audit the generation frame
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: ${{ github.event.inputs.region }}
        run: |
          set -eo pipefail
          python research/modalities/r3_generation_frame_audit.py \
            --bucket "${{ github.event.inputs.bucket }}" \
            --prefix "${{ github.event.inputs.prefix }}"
      - name: Verdict LAST
        run: |
          set +e
          echo "================ R3 GENERATION-FRAME AUDIT ================"
          python -c "
          import json
          d = json.load(open('research/modalities/r3-generation-frame-audit.json'))
          v = d['verdict']
          print('VERDICT :', v['verdict'])
          print('REASON  :', v['reason'])
          print('FRAME   :', json.dumps(v.get('frame_id')))
          print('SCORE   :', v.get('score'), ' MODE:', v.get('mode'), ' D*:', d['d_star'])
          if v.get('unblocker'): print('UNBLOCK :', v['unblocker'])
          if v.get('reaches'):   print('REACHES :', v['reaches'])
          c = d['reharmonize_coverage']
          print('HARMONIZED RERUN COVERS THE GENERATION RECEPTOR:', c['covered'])
          print('  rows scored:', c['rows'])
          print('  missing kind:', c['missing_kind'])
          l = d['s3_listing']
          print('S3 LISTING: n_keys=%s error=%s' % (l.get('n_keys'), l.get('error')))
          "
      # ── PART 2: the named unblocker. Score that ONE structure under the harmonized matcher. ────────
      # The manifest's 0.667 predates the harmonized tracker (no pocket_match block, written 2026-06-29
      # against a freeze of 2026-07-11), so it cannot discharge a harmonized gate. This step closes the
      # gate rather than reporting that it is open.
      #
      # fpocket comes from conda-forge on a FREE runner. CLAUDE.md §6's "never build an environment on a
      # machine we are paying for" is honoured because nothing here is paid for and no baked image in the
      # repo carries fpocket -- the same reasoning, and the same micromamba idiom, as
      # pose-recovery-check.yml. Pinned to 4.2.3, which is what entry_pocket_reharmonize.py built the
      # committed table with, so the score is protocol-parity rather than merely similar.
      - name: Install fpocket 4.2.3 (free runner, pinned for parity with the committed table)
        if: ${{ github.event.inputs.score_harmonized != 'false' }}
        run: |
          set -e
          cd "$RUNNER_TEMP"
          curl -Ls https://micro.mamba.pm/api/micromamba/linux-64/latest | tar -xj bin/micromamba
          ./bin/micromamba create -y -p "$RUNNER_TEMP/fenv" -c conda-forge fpocket=4.2.3
          echo "$RUNNER_TEMP/fenv/bin" >> "$GITHUB_PATH"
      - name: Score the generation receptor under POCKET_MATCH=harmonized
        if: ${{ github.event.inputs.score_harmonized != 'false' }}
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: ${{ github.event.inputs.region }}
          POCKET_MATCH: harmonized
        run: |
          set -eo pipefail
          which fpocket && (fpocket -h 2>&1 | head -3 || true)
          mkdir -p /tmp/r3pdb
          python - <<'PY'
          import boto3, os
          s3 = boto3.client("s3", region_name=os.environ.get("AWS_DEFAULT_REGION", "us-east-2"))
          key = "${{ github.event.inputs.prefix }}".rstrip("/") + "/nr4a3-release-druggable.pdb"
          s3.download_file("${{ github.event.inputs.bucket }}", key, "/tmp/r3pdb/generation-receptor.pdb")
          print("downloaded", key, os.path.getsize("/tmp/r3pdb/generation-receptor.pdb"), "bytes")
          PY
          cd research/modalities
          python r3_score_generation_frame.py --pdb /tmp/r3pdb/generation-receptor.pdb
      # ── THE IDENTITY CROSS-CHECK. $0, one extra fpocket call on a file already in the repo. ────────
      # r3-generation-frame-audit.json asserts that a `release_rep*` trajectory row "is not a measurement
      # of it even at per-frame granularity", because the generation receptor is re-extracted and re-boxed
      # and `nr4a3_release_druggable.confirm_filter` says the reused summary and the fresh confirmation
      # "can disagree". That is an ARGUMENT, and CLAUDE.md §4 says a free observation settles it instead:
      # the committed reharmonize frame results/nr4a3-pocket-reharmonize/release_rep0/fp_95_539ml58c is
      # rep 0, frame 95 — the same (rep, frame) the manifest names — so score it under the identical
      # matcher and COMPARE. Agreement discharges the caveat for this frame; disagreement is a finding.
      - name: Cross-check — score the committed rep0/frame-95 trajectory PDB under the same matcher
        if: ${{ github.event.inputs.score_harmonized != 'false' }}
        env:
          POCKET_MATCH: harmonized
        run: |
          set -eo pipefail
          FR=results/nr4a3-pocket-reharmonize/release_rep0/fp_95_539ml58c/frame.pdb
          if [ ! -f "$FR" ]; then echo "::warning::$FR absent — cross-check skipped"; exit 0; fi
          cd research/modalities
          python r3_score_generation_frame.py \
            --pdb "../../$FR" \
            --out "$PWD/r3-generation-frame-repframe.json"
      - name: Gate A verdict LAST
        if: ${{ always() && github.event.inputs.score_harmonized != 'false' }}
        run: |
          set +e
          echo "================ R3 GATE A — HARMONIZED SCORE ================"
          python -c "
          import json, os
          p = 'research/modalities/r3-generation-frame-harmonized.json'
          if not os.path.exists(p):
              print('NOT PRODUCED — the harmonized score did not run to completion.')
              print('⚠ That is a REFUSAL, not a pass: the gate stays open and part 1 stands.')
              raise SystemExit(0)
          d = json.load(open(p))
          v = d['verdict']
          print('VERDICT   :', v['verdict'])
          print('REASON    :', v['reason'])
          print('DRUGGABIL :', v['druggability'], ' D*:', v['d_star'])
          print('NUMBERING :', d['numbering'], '->', d['mapped_lining_resseqs'])
          print('FPOCKET   :', d['fpocket_version'], ' MODE:', d['match_mode'])
          print('MATCHED   :', json.dumps(d['matched_pocket']))
          print('PRIOR     :', json.dumps(d['_prior_manifest_score']))
          print('ACCEPTED BY THE GATE: %s of %s cavities' % (d.get('n_accepted_by_gate'),
                                                             d.get('n_candidate_pockets')))
          print('MOST DRUGGABLE CAVITY ANYWHERE:', json.dumps(d.get('most_druggable_cavity_anywhere')))
          for r in (d.get('per_candidate_gate') or [])[:6]:
              print('   ', json.dumps(r))
          if v.get('reaches'): print('REACHES   :', v['reaches'])
          print()
          print('---- WHAT THE TWO ACCEPTED CAVITIES ACTUALLY ARE ----')
          print('REF LINING:', d.get('reference_lining_labels'))
          for n in [str(r['pocket']) for r in (d.get('per_candidate_gate') or []) if r['accepted_by_gate']]:
              pi = (d.get('pocket_identity') or {}).get(n, {})
              print(f'  pocket {n}: drug={pi.get(\"druggability\")} vol={pi.get(\"volume_a3\")} '
                    f'spheres={pi.get(\"alpha_spheres\")} n_res={pi.get(\"n_lining_residues\")}')
              print('     shares with reference:', pi.get('reference_lining_shared_labels'))
          for p in ((d.get('site_choice_contrast') or {}).get('pairs') or []):
              print('  PAIR', p['pockets'], 'shared', p['n_shared'], 'jaccard', p['pairwise_jaccard'],
                    'centroid sep', p['centroid_separation_ang'], '->', p['relationship'])
          "
      - name: Cross-check verdict — re-extracted receptor vs committed trajectory frame
        if: ${{ always() && github.event.inputs.score_harmonized != 'false' }}
        run: |
          set +e
          python -c "
          import json, os
          a='research/modalities/r3-generation-frame-harmonized.json'
          b='research/modalities/r3-generation-frame-repframe.json'
          if not (os.path.exists(a) and os.path.exists(b)):
              print('cross-check NOT PRODUCED — one side missing; the caveat stands unresolved'); raise SystemExit(0)
          A,B=json.load(open(a)),json.load(open(b))
          ka=['n_candidate_pockets','n_accepted_by_gate']
          same=all(A.get(k)==B.get(k) for k in ka) and A['matched_pocket']==B['matched_pocket']
          print('S3 re-extracted receptor :', A['verdict']['druggability'], A['matched_pocket'])
          print('committed rep0 frame 95  :', B['verdict']['druggability'], B['matched_pocket'])
          print('IDENTICAL HARMONIZED READING:', same)
          print('=> the \'re-extraction can disagree\' caveat is', 'DISCHARGED for this frame' if same else 'REAL — they differ')
          "
      - name: Publish
        if: ${{ always() }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PUBLISH_IF_CHANGED: "1"
        run: |
          bash research/compute/publish_artifacts.sh "${{ github.ref_name }}" \
            "R3 frame-level generation-receptor dependency audit (CI, \$0)" \
            research/modalities/r3-generation-frame-audit.json \
            research/modalities/r3-generation-frame-harmonized.json \
            research/modalities/r3-generation-frame-repframe.json
