name: ASO archive metadata preview
on:
  push:
    branches:
      - codex/usage-sprint-2026-10-01-aso-verifier
    paths:
      - .github/workflows/usage-sprint-aso-archive-preview.yml
      - research/manuscripts/aso_archive_manifest.py
permissions:
  contents: read
jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install archive generator dependencies
        timeout-minutes: 3
        run: python3 -m pip install pyyaml biopython jsonschema
      - name: Generate exact live metadata, emit preview, and restore input
        shell: bash
        run: |
          set -euo pipefail
          manifest=research/manuscripts/aso/fusion-junction-aso-archive-manifest.json
          test -z "$(git status --porcelain)"
          git rev-parse HEAD
          trap 'git restore -- "$manifest"' EXIT
          python3 research/manuscripts/aso_archive_manifest.py
          python3 research/manuscripts/aso_archive_manifest.py --check
          python3 - <<'PY'
          import base64
          import hashlib
          from pathlib import Path
          import subprocess
          import textwrap

          manifest = "research/manuscripts/aso/fusion-junction-aso-archive-manifest.json"
          changed = subprocess.check_output(["git", "diff", "--name-only"], text=True).splitlines()
          assert changed == [manifest], changed
          raw = Path(manifest).read_bytes()
          blob = b"blob " + str(len(raw)).encode("ascii") + b"\0" + raw
          print(f"ASO_MANIFEST_BYTES={len(raw)}")
          print(f"ASO_MANIFEST_SHA256={hashlib.sha256(raw).hexdigest()}")
          print(f"ASO_MANIFEST_GIT_BLOB={hashlib.sha1(blob).hexdigest()}")
          print("ASO_MANIFEST_BASE64_BEGIN")
          for line in textwrap.wrap(base64.b64encode(raw).decode("ascii"), 76):
              print(line)
          print("ASO_MANIFEST_BASE64_END")
          PY
      - name: Confirm preview preserved all tracked inputs
        if: ${{ !cancelled() }}
        run: |
          test -z "$(git status --porcelain)"
          git diff --exit-code
