      - name: "Summary — part-b"
        if: always() && inputs.mode != 'gse-series' && inputs.mode != 'aso-junction' && inputs.mode != 'panels'
      # ⭐ THE CONTROLS PRINT FIRST AND THE RAW DELTAS PRINT LAST. A reader who stops after two
      # screens must have seen whether the instrument reproduced its known answers and how big the
      # platform's global offset is, BEFORE seeing any "HIGHER in EMC" number.
      - name: "Summary — fusion-targets"
        if: always() && inputs.mode == 'fusion-targets'
        run: |
          python3 - <<'PY'
          import json
          d = json.load(open("research/modalities/nr4a3-fusion-targets.json"))
          c = d["controls"]
          print("=" * 96)
          print("INSTRUMENT CONTROLS — read these before any number below")
          for name, chk in c["checks"].items():
              p = chk.get("pass")
              tag = "PASS" if p is True else ("FAIL" if p is False else "NOT-GRADED")
              print(f"  {tag:<10} {name}")
              for mf, m in (chk.get("per_platform") or {}).items():
                  print(f"        {mf[:28]:30s} {m.get('state'):<15} delta={m.get('delta')} "
                        f"t={m.get('t')} {(m.get('why') or '')[:80]}")
          print(" ->", c.get("_reading"))
          print("-" * 96)
          for mf, p in d["platforms"].items():
              if p.get("_status") != "read":
                  print(f"{mf}: {p.get('_status')}")
                  continue
              go = p.get("global_offset") or {}
              print(f"{p['gse']}/{p['platform']}  EMC={p['n_EMC']} comp={p['n_comparator']} "
                    f"symbols={p.get('n_distinct_symbols_on_platform')} "
                    f"null_pool={(p.get('null_pool_spec') or {}).get('drawn')}")
              print("   GLOBAL OFFSET:", go.get("reading") or go.get("why"))
              print("   probe mapping:", (p.get("probe_mapping") or {}).get("reading"))
          print("-" * 96)
          print("CIRCULARITY:", d["circularity_reading"].get("verdict"))
          print("-" * 96)
          for name, per in d["set_scores"].items():
              print(name)
              for mf, r in per.items():
                  print(f"   {mf[:28]:30s} {str(r.get('verdict'))[:200]}")
          print("-" * 96)
          print("PER-GENE, evidence-typed:")
          rows = {r["gene"]: r for r in d["evidence_table"]["rows"]}
          for g, per in sorted(d["gene_reads"].items()):
              if g not in rows:
                  continue
              cls = rows[g]["evidence_class"]
              exp = rows[g]["expected_direction_in_EMC"]
              bits = []
              for mf, r in per.items():
                  if not r.get("readable"):
                      bits.append(f"{mf[:12]}=NOT_READABLE")
                      continue
                  w = r.get("welch_EMC_vs_comparator") or {}
                  nc = r.get("null_calibration") or {}
                  bits.append(f"{mf[:12]}: d={w.get('delta_a_minus_b')} t={w.get('t')} "
                              f"p_emp={nc.get('p_empirical_two_sided')}")
              print(f"  {g:<10} [{cls:<26}] expect={exp:<32} " + " | ".join(bits))
          PY

      - name: "Summary — part-b"
        if: always() && inputs.mode != 'gse-series' && inputs.mode != 'aso-junction'
             && inputs.mode != 'fusion-targets'
        if: always() && inputs.mode != 'gse-series' && inputs.mode != 'aso-junction' && inputs.mode != 'panels' && inputs.mode != 'ret-cistrome' && inputs.mode != 'ret-motif'
      - name: "Summary — part-b"
        if: always() && steps.guard.outputs.part_b == 'true'
        run: |
          python3 - <<'PY'
          import json
          d = json.load(open("research/modalities/emc-atr-vulnerability.json"))
          b = d["part_b_emc_tumour_signature"]
          print("TIER:", d["grading"]["tier"])
          print("PART B:", b.get("verdict"), "| series used:", b.get("series_carrying_the_verdict"))
          print("readable platforms anywhere:", b.get("readable_platforms_in_ANY_series"))
          for s, r in sorted((b.get("series_readability") or {}).items()):
              print(f"  {s}: EMC={r['n_EMC']} comp={r['n_comparator']} "
                    f"scored_concepts={r['max_scored_concepts_on_one_platform']} "
                    f"readable={len(r['readable_platforms'])}")
          PY
