name: EMC expression datasets — part B of the ATR vulnerability assessment

# ⭐ WHY THIS IS ITS OWN WORKFLOW.
# Part B of `emc_atr_vulnerability.py` asks whether a readable EMC expression dataset exists at
# all. It is the ONLY part of that assessment that failed for want of DATA rather than for want of
# signal, and that failure is what the tier hung on — an instrument failure, not a biological
# result (the tier's one home is the assessment's own §6.1; it is not restated here, per CLAUDE.md
# §1). So it is the part most worth re-running, and it is the part
# that is cheapest to re-run: parts A/C/D need a ~1 GB DepMap expression matrix that part B never
# touches, so `--refresh-part-b` refreshes part B alone into the existing inputs cache and
# re-derives everything from it. Minutes, not an hour, and it cannot perturb the other parts.
#
# It also stays clear of `depmap-dependency.yml`, which rewrites a dozen other artifacts that
# other work is editing at the same time. One lane, two files.
#
# ⭐ TWO MODES, added 2026-08-05, and they touch DIFFERENT artifacts on purpose.
#   `part-b`     — the multi-series EMC signature read (emc-atr-vulnerability.json).
#   `gse-series` — characterise ONE GEO series from its per-sample metadata
#                  (atr_hrd_sarcoma_series.py -> atr-hrd-sarcoma-series.json), which is how
#                  GSE299349 was read. It shares this lane because it is the same $0 NCBI-fetch
#                  capability and the same "the sandbox cannot reach GEO" reason, and it is a
#                  SEPARATE mode because a series characterisation must never rewrite — or be
#                  able to perturb — a committed grading artifact.
#
# ⭐ THIRD MODE, added 2026-08-06: `aso-junction`.
#   It is here on the precedent the paragraph above sets in this file's own words — "the same $0
#   NCBI-fetch capability and the same 'the sandbox cannot reach GEO' reason". This one reaches
#   Ensembl rather than GEO; the egress proxy 403s both, and the job is the same shape: pure
#   stdlib, CPU, minutes, one artifact. Standing up a second workflow for it would have put one
#   capability in two homes (CLAUDE.md §1) and, because a NEW workflow file on a feature branch
#   404s on dispatch, would also have been undispatchable until it reached `main`.
#
#   WHAT IT IS FOR. The route framing audit (`systems/AUDIT-2026-08-06-routes.md` X14) found the
#   ChemRxiv-queued ASO design panel built on a seam this repo had already RETRACTED — NR4A3
#   resuming at residue 361, which `fusion-neoantigen-retraction.json` grades SEAM_NOT_PRODUCED.
#   The code was fixed the same day but the panel was never regenerated, because regeneration
#   needs Ensembl. This mode is that regeneration.
#
#   ⛔ IT DOES NOT PUBLISH, AND THAT IS DELIBERATE. Everything it produces is printed between
#   `===BEGIN <name>===` / `===END <name>===` markers and uploaded as a run artifact. A panel that
#   has just been rebuilt on a corrected exon index is a thing a human should read BEFORE it lands
#   next to the six files still carrying retraction banners — publishing it automatically would
#   put a fresh unreviewed panel and a retracted one in the same directory with nothing to tell
#   them apart, which is the failure this whole exercise is a correction for.
#
# ⭐ FOURTH MODE, added 2026-08-07: `panels`.
#   Same precedent, same reasons, third time: the same $0 NCBI-fetch capability, the same "the
#   sandbox cannot reach GEO", and a NEW workflow file on a feature branch cannot be dispatched
#   until it reaches `main` (CLAUDE.md §6). Standing one up would have put one capability in two
#   homes (CLAUDE.md §1).
#
#   WHAT IT IS FOR. `research/manuscripts/program/emc-unexplored-treatment-lanes.md` §4 records that SIX
#   treatment lanes resolve on ONE dispatch against the two readable EMC series — ASS1 (arginine
#   auxotrophy), the CS/GAG + PAPS module (oncofetal chondroitin sulfate, CSPG4), a PPARγ
#   TARGET-GENE signature (the receptor-ACTIVITY readout `pparg-direction-emc.md` §6 names as the
#   one measurement nobody has ever made), the DLL3/ASCL1/NEUROD1/INSM1/HES1 neuroendocrine panel,
#   a published hypoxia metagene, and NR2F1. This mode is that dispatch.
#
#   ⚠ IT IS A SEPARATE MODE AND A SEPARATE ARTIFACT FOR THE SAME REASON `gse-series` IS. Part B's
#   inputs cache holds per-sample values only for the genes its MSigDB/Reactome concepts happen to
#   contain, so almost none of the six reads' genes are in it — and a panel read has no business
#   being able to perturb a committed grading artifact. `emc_expression_panels.py` writes
#   `emc-expression-panels.json` + `-inputs.json` and touches nothing part B owns.
#
#   ✅ IT DOES PUBLISH, unlike `aso-junction` immediately above, and the difference is not
#   inconsistency. That mode withholds because a freshly rebuilt panel would land beside six files
#   carrying retraction banners with nothing to tell them apart. This mode writes a NEW artifact
#   under a NEW name that nothing has ever cited, so there is no file it can be confused with — and
#   three other lanes are waiting on reads 2, 3 and 6, which they cannot consume from a run
#   artifact that expires.
#
#   ⛔ AND IT CARRIES ITS OWN HONESTY GUARDS, because six lanes will be read off it. Every gene
#   row says whether the READ COULD BE TAKEN, separately from what it said — a gene with no probe
#   is `readable: false`, never "not expressed" (CLAUDE.md §4) — and the offline tests that run
#   BEFORE the fetch assert exactly that, over the whole serialised artifact.
#
# ⭐ FIFTH MODE, added 2026-08-07: `ret-cistrome`.
#   Same precedent, same reasons, fourth time — the same $0 fetch capability against hosts the
#   dev sandbox's proxy 403s (measured this session: chip-atlas.dbcls.jp, remap.univ-amu.fr,
#   eutils.ncbi.nlm.nih.gov all return curl exit 56 from the sandbox), and a NEW workflow file on
#   a feature branch cannot be dispatched until it reaches `main` (CLAUDE.md §6).
#
#   WHAT IT IS FOR. `research/modalities/emc-ret-lane.md` §2d found that NO `EWSR1::NR4A3`
#   cistrome exists anywhere, and that WILD-TYPE NR4A3 ChIP-seq does — including one human
#   dataset carrying all three paralogues in the same cells. Intersecting those peaks with the
#   RET locus substitutes MEASURED OCCUPANCY for the NBRE motif string the lane was originally
#   given, and carries a paralogue-overlap read this repository has only ever argued from domain
#   sequence identity. That memo lists it as next step 1, cheapest first, and it was blocked on
#   exactly one branch push plus one dispatch.
#
#   ⛔ IT PUBLISHES, on the same test `panels` passes: it writes NEW artifacts under NEW names
#   (`emc-ret-cistrome.json` + `-inputs.json`) that nothing has ever cited, so there is no file
#   it can be confused with, and it cannot perturb `emc-ret-target-scan.json` — the sibling motif
#   scan — which owns a different question and is allowed to disagree with it.
#
#   ⛔ AND IT CARRIES A GENOME-BUILD GUARD, because this lane has already been burned twice by a
#   coordinate convention that produced a plausible-looking artifact. RET is on chr10, where
#   GRCh37 and GRCh38 differ by a large constant: a build mix-up does not throw, it silently
#   reports another locus. `--selftest` runs BEFORE the fetch and asserts the interval algebra,
#   the strand-aware window, the cross-build refusal, and that an empty cache can never emit a
#   biological verdict. Failing there costs seconds; failing after the fetch costs the run.
#
# ⭐ SIXTH MODE, added 2026-08-07: `ret-motif`.
#   The SIBLING of `ret-cistrome`, and it is a separate mode because it answers a DIFFERENT
#   question. `emc_ret_target_scan.py` asks whether RET's regulatory window carries an NBRE
#   octamer more often than a dinucleotide-preserving null and than a 200-gene background panel —
#   a SEQUENCE question. The cistrome mode asks whether anyone has MEASURED an NR4A protein
#   sitting there. The two are allowed to disagree; neither supersedes the other, and they write
#   different artifacts so neither can overwrite the other's answer.
#
#   ⛔ IT WAS BLOCKED ON A BRANCH PUSH AND NOTHING ELSE. `emc-ret-lane.md` §5 records the whole
#   chain: Ensembl REST answers 403 to CONNECT from the dev sandbox, CLAUDE.md §6's remedy is a
#   runner, a dispatch runs the code on the ref it is dispatched against — and the agent that
#   built the scanner was told not to push, so no ref carried the file. That is now closed.
#
# $0 — a GitHub-hosted CPU runner, no GPU, no rental. Pure stdlib: no pip install at all.
# The dev sandbox's egress proxy 403s NCBI/GEO/Europe PMC on CONNECT, which is the whole reason
# this runs here (CLAUDE.md §6).

# ⚠ DISPATCH ONLY, deliberately. A `push:` trigger would fire on the feature branch AND on main
# after the merge, so two runs would fetch GEO minutes apart and commit two artifacts that
# `--check` then has to reconcile. One run, one artifact, merged by hand (CLAUDE.md §7).
on:
  workflow_dispatch:
    inputs:
      mode:
        description: >-
          part-b   = re-run part B of the ATR assessment (the multi-series EMC signature read).
          gse-series = characterise ONE GEO series at SAMPLE level and answer the three questions
          in `atr_hrd_sarcoma_series.py`. The two modes touch DIFFERENT artifacts and must not
          share a run: part B rewrites the 7 MB assessment artifact, and a series characterisation
          has no business perturbing a committed grading.
          aso-junction = grade every declared EWSR1::NR4A3 exon pair at the mRNA level against
          Ensembl and regenerate the ASO design panel for the ones that survive. Publishes
          NOTHING — it prints and uploads, on purpose (see the header).
          panels = the targeted gene/panel reads in the two READABLE EMC series (ASS1;
          CS/GAG+PAPS; a PPARγ TARGET-GENE signature; DLL3/ASCL1/NEUROD1/INSM1/HES1; a published
          hypoxia metagene; NR2F1). Writes its OWN artifact and cannot perturb part B's.
          fusion-targets = score the published EWSR1::NR4A3 / NR4A3 direct-target set in the two
          readable EMC series against a SIZE-MATCHED EMPIRICAL NULL on the same platform
          (`nr4a3_fusion_targets.py` -> nr4a3-fusion-targets.json). Its own artifact; touches
          nothing part B or the panels lane owns.
          fusion-figures = REDRAW the five figures that read the artifact the mode above writes,
          and re-stamp their provenance. No network at all: it reads seven committed artifacts and
          writes only research/manuscripts/figures/fig[1-5]-* plus figure-provenance.json.
          ret-cistrome = retrieve every public NR4A1/NR4A2/NR4A3 ChIP-seq peak set reachable at
          $0, characterise each BEFORE using it, and intersect it with the RET locus on a stated
          genome build, with the paralogue overlap. Writes its OWN artifact.
          ret-motif = the SIBLING instrument: emc_ret_target_scan.py --fetch, the NBRE/NurRE motif
          scan against two nulls plus the RET expression read. A sequence question, not an
          occupancy one; the two are allowed to disagree and neither supersedes the other.        required: false
          hypoxia metagene; NR2F1; and from 2026-08-07 a SURFACE-ANTIGEN panel). Writes its OWN
          artifact and cannot perturb part B's. The authoritative list of reads is
          `emc_expression_panels.PANELS`, not this description.
          cohort-search = ask GEO whether a FOURTH EMC expression cohort exists, and dedup every
          candidate at accession, publication and SAMPLE level before counting it. Writes its OWN
          artifact; reads no expression value and can perturb nothing.
          data-level-sweep = the COMPLEMENT of cohort-search. That mode's negative is bounded to
          depositor PROSE by its own header; this one asks what lies outside that bound — the public
          splice-junction index (a property of the reads, not of the description) and a pan-sarcoma
          methylation deposit whose title names no disease. Probe first: it measures what each
          endpoint serves and emits no fusion search. Writes its OWN artifact.
        required: false
        default: "part-b"
        type: choice
        options: ["part-b", "gse-series", "aso-junction", "panels", "fusion-targets", "fusion-figures", "ret-cistrome", "ret-motif", "hypoxia-confounds", "gse28866", "cohort-search", "sra-study", "ret-cistrome-zenodo", "gse243553-eno3", "ret-cistrome-named-geo", "aso-offtarget-expression", "fusion-read-probe", "fusion-read-scan", "nuccore-sweep", "data-level-sweep"]
      junctions:
        description: >-
          aso-junction mode only: comma-separated EWSR1/NR4A3 TRANSCRIPT exon pairs to design
          against, e.g. "7:3,12:3". Each is designed only if the frame audit grades it EMITTABLE;
          a refusal is recorded and reported, never silently skipped.
        required: false
        default: "7:3,12:3"
      skip_null_background:
        description: >-
          hypoxia-confounds mode only: "true" skips the ~25-minute genome-wide null background
          fetch and runs only the clinical retrieval + re-derive. Use when the background artifact
          is already committed and correct and only the retrieval needs re-running — the two halves
          hit different hosts and fail for unrelated reasons. Default false, so forgetting it costs
          time rather than silently leaving the null unfetched.
        required: false
        default: "false"
        type: choice
        options: ["false", "true"]
      sweep_arm:
        description: >-
          data-level-sweep mode only: which arm to fetch. The two arms hit different hosts, fail
          for unrelated reasons and answer different questions, so re-running the junction search
          to re-read a methylation deposit spends a runner AND overwrites arm 1's measured numbers
          for nothing. "methylation" and "snaptron" MERGE into the existing inputs cache, carrying
          the other arm through verbatim; "both" refetches everything, which is what a cold start
          needs. Refusing to fetch an arm is never the same as that arm returning nothing, and the
          artifact records which arm was refetched.
        required: false
        default: "both"
        type: choice
        options: ["both", "methylation", "snaptron"]
      series:
        description: "gse-series mode only: the GEO series accession to characterise."
        required: false
        default: "GSE299349"
      probe_targets:
        description: >-
          fusion-read-probe mode only. Space-separated deposits to CHARACTERISE without
          downloading a read: archive accessions (SRR/SRP/PRJNA/ERR) go to the ENA run table,
          anything else is fetched as a landing page and its file links are listed. Defaults to
          the three deposits the EMC breakpoint route actually turns on — the CRO Aviano handle
          from PMID 31020999 (12 EMC, 7 EWSR1 + 5 TAF15, whole-transcriptome, the highest-value
          unknown on the board), the one public whole-transcriptome EMC run, and the dbGaP-
          registered EMC WGS study whose reads ENA reports as protected.
        required: false
        default: "http://opendocuments.cro.it/cod/handle/item/9167 SRR33903995 SRP445369"
      scan_runs:
        description: >-
          fusion-read-scan mode only. Space-separated run/study accessions whose reads are
          STREAMED and matched against the committed partner x NR4A3 seams. Reads are never
          written to disk. ⚠ Run the probe first: a targeted-panel deposit is refused by the
          assay gate rather than scanned, and scanning one would produce a meaningless zero.
        required: false
        default: "SRR33903995"
      acc_bridge_budget_s:
        description: >-
          part-b AND panels modes. Seconds of TOTAL budget for the EST accession->symbol bridge
          (GSE4303 only). Lower it to get the readable-series answer fast; the bridge is the
          expensive, failure-prone half and none of the other series need it. ⚠ In `panels` mode
          it is the ONLY thing standing between the run and a GPL3290 read whose genes are
          unreadable for a transport reason rather than an array reason — so a run that comes back
          with a low measured mapping rate on GPL3290 should be re-dispatched with a HIGHER budget
          before anything is concluded from it.
        required: false
        default: "1500"
      cistrome_budget_s:
        description: >-
          ret-cistrome mode only. Seconds of TOTAL network budget. ChIP-Atlas's experiment list is
          hundreds of MB and is streamed rather than held, so the budget is what stops one slow
          catalogue destroying the retrievals that already succeeded. Every endpoint that runs out
          of budget is RECORDED as `budget_exhausted`, never as "not found".
        required: false
        default: "3000"

permissions:
  contents: write

# ⛔ THE GROUP IS KEYED ON THE MODE, AND THAT IS A BUG FIX, NOT TIDINESS (measured 2026-08-07).
# It used to be keyed on the ref alone. `cancel-in-progress: false` does NOT mean "queue them
# all": GitHub keeps at most ONE pending run per group and CANCELS the older pending one when a
# new one arrives. Measured that day, on this workflow: a `panels` run was created 17:04:48Z,
# never started a job (`jobs: []`), and flipped to `cancelled` at 17:11:10Z — three seconds after
# an unrelated `ret-motif` dispatch entered the same group. Nothing failed and nothing said so;
# a dispatched-and-silently-dropped run is indistinguishable from one that ran, which is the
# exact shape CLAUDE.md §4 is written about.
#
# The modes touch DIFFERENT artifacts by design (each mode's header says so), so they were never
# in genuine contention — only the group name put them there. Keyed on the mode:
#   * two runs of the SAME mode still serialize, which is the contention that is real: two
#     `part-b` runs would fetch GEO minutes apart and fight over one 7 MB artifact;
#   * different modes now run concurrently, and their concurrent publishes are safe because they
#     go through `publish_artifacts.sh` — the repo's own primitive, which exists precisely because
#     a hand-rolled `git pull --rebase` + push lost artifacts on three separate lanes.
concurrency:
  group: emc-expression-datasets-${{ github.ref_name }}-${{ inputs.mode }}
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    # Backstop only. The real guards are inside the module: a per-series compressed-size limit on
    # the matrix fetch, and a wall-clock budget on the NCBI accession chain, both of which record
    # what they refused rather than silently truncating.
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # ─────────────────────────────────────────────────────────────────────────────────────
      # ⛔ THE PART-B GUARD, COMPUTED ONCE. IT WAS A RESTATED LIST TWICE AND THAT COST A RUN.
      #
      # Part B's step and its summary were each gated on a hand-written exclusion list —
      # `mode != 'gse-series' && mode != 'aso-junction' && mode != 'panels'` — so EVERY new mode
      # had to be added to both, and the fourth one was not. Measured 2026-08-07, run 31199787306:
      # a `hypoxia-confounds` dispatch started the 75-minute PART B step, which rewrites the 7 MB
      # committed grading artifact this file's own header says a new mode must not be able to
      # perturb. It was cancelled at step 5 of 23. The mode list was correct in three places and
      # stale in two, which is precisely what a restated list always does (CLAUDE.md §1).
      #
      # ⚠ THE NEGATIVE FORM IS STILL DELIBERATE AND IS PRESERVED HERE, not replaced. A dispatch
      # that sends NO inputs at all must fall through to part B, which is what this file has
      # always done; `== 'part-b'` would silently turn that dispatch into a no-op reporting
      # success. So the predicate is still "mode is not one of the named non-part-b modes" — it is
      # now written ONCE, and `test_emc_expression_datasets_workflow.py` fails the build if any
      # step goes back to restating the list.
      - name: "Resolve the part-B guard once (see the comment — a restated list already cost a run)"
        id: guard
        env:
          MODE: ${{ inputs.mode }}
        run: |
          set -euo pipefail
          case "${MODE:-}" in
            gse-series|aso-junction|panels|hypoxia-confounds|fusion-targets|fusion-figures|ret-cistrome|ret-motif|gse28866|cohort-search|sra-study|ret-cistrome-zenodo|gse243553-eno3|ret-cistrome-named-geo|aso-offtarget-expression|fusion-read-probe|fusion-read-scan|nuccore-sweep|data-level-sweep) PART_B=false ;;
            *)                                               PART_B=true  ;;
          esac
          echo "part_b=${PART_B}" >> "$GITHUB_OUTPUT"
          echo "mode='${MODE:-}' (empty falls through to part-b) -> part_b=${PART_B}"

      # The derive half must be exercisable with no network, so it is tested before the fetch.
      # A broken derive would otherwise be discovered only after the fetch had spent its time.
      - name: Unit tests (derive half, offline)
        timeout-minutes: 10
        # ⚠ MODE-AWARE, and the aso-junction set is not optional. Both defects that produced the
        # retracted seam were arithmetic over a committed exon index, and both would have been
        # caught by an offline test. Running them before the Ensembl fetch means a reintroduced
        # off-by-two fails in seconds rather than after a network round trip — and, more to the
        # point, means no panel can be emitted by a build whose arithmetic is unproven.
        run: |
          python -m pip install --upgrade pip
          pip install pytest
          if [ "${{ inputs.mode }}" = "gse28866" ]; then
            echo "gse28866: header read only, no offline suite to gate on"
          elif [ "${{ inputs.mode }}" = "aso-junction" ]; then
            python -m pytest research/modalities/tests/test_junction_aso_seam.py -q
          elif [ "${{ inputs.mode }}" = "ret-cistrome" ] \
            || [ "${{ inputs.mode }}" = "ret-cistrome-zenodo" ] \
            || [ "${{ inputs.mode }}" = "ret-cistrome-named-geo" ]; then
            # ⛔ NOT OPTIONAL. Two of the three ways this module could lie are pure arithmetic and
            # are assertable with no network: a half-open/inclusive off-by-one, and a cross-build
            # intersection that would silently report another locus on chr10. The third — an
            # empty cache emitting a biological verdict — is the failure CLAUDE.md §4 exists for.
            # All three are covered here and run BEFORE one byte is fetched.
            python research/modalities/emc_ret_cistrome.py --selftest
            python -m pytest research/modalities/tests/test_emc_ret_cistrome.py -q
          elif [ "${{ inputs.mode }}" = "ret-motif" ]; then
            # Same reasoning as ret-cistrome: the motif engine's nulls, its p convention and its
            # sample classifier are all assertable with no network, and its own selftest already
            # caught two real defects (emc-ret-lane.md §5). Run both before the fetch.
            python research/modalities/emc_ret_target_scan.py --selftest
            python -m pytest research/modalities/tests/test_emc_ret_target_scan.py -q
          elif [ "${{ inputs.mode }}" = "panels" ]; then
            # ⛔ NOT OPTIONAL, for the same reason the aso-junction set is not. Six lanes will be
            # read off this artifact, and the two ways it could lie — an absent reading rendering
            # as absence, and a thin panel rendering like a covered one — are both assertable
            # offline. Failing here costs seconds; failing after the GEO fetch costs the run.
            python -m pytest research/modalities/tests/test_emc_expression_panels.py -q
          elif [ "${{ inputs.mode }}" = "fusion-targets" ]; then
            # ⛔ NOT OPTIONAL. The whole point of this mode is that a raw "HIGHER in EMC" is
            # refused unless it clears a size-matched null, and that refusal is arithmetic. The
            # suite constructs a KNOWN pure global offset and asserts the module declines it, and
            # constructs a KNOWN set-specific signal on the same offset and asserts it does not.
            # A build whose null calibration is broken must not be able to emit an artifact.
            python -m pytest research/modalities/tests/test_nr4a3_fusion_targets.py -q
          elif [ "${{ inputs.mode }}" = "fusion-figures" ]; then
            # ⛔ THE TWO STAMP TESTS ARE DESELECTED HERE, AND ONLY HERE, BECAUSE THEY ARE THE THING
            # THIS MODE EXISTS TO REPAIR. A pre-flight gate that asserts the drift is already gone
            # would fail every run that had a reason to exist, and would fail it BEFORE the redraw
            # — so the mode could never fix the state it was dispatched to fix. They are not being
            # skipped: the step AFTER the redraw runs this same file with nothing deselected, and
            # that is where they have to pass. What runs here is the half that must hold BEFORE the
            # redraw — the artifact lookups behind every cell, which is where this figure module
            # has actually shipped a defect (a lookup that missed rendered as "not computed" and
            # produced a finished-looking figure with two empty columns).
            python -m pytest research/modalities/tests/test_nr4a3_fusion_targets_figures.py -q \
              --deselect research/modalities/tests/test_nr4a3_fusion_targets_figures.py::test_the_provenance_stamp_matches_the_committed_artifacts \
              --deselect research/modalities/tests/test_nr4a3_fusion_targets_figures.py::test_check_mode_reports_ok_on_a_clean_tree
          elif [ "${{ inputs.mode }}" = "cohort-search" ]; then
            # ⛔ NOT OPTIONAL, and the reason is that this mode's most likely output is a NEGATIVE.
            # A negative is only worth anything if the thing producing it could have said yes, and
            # every way this module could say the wrong thing is offline arithmetic over a cached
            # search: a re-deposit passing the dedup, a curated GDS view of a cohort already used
            # reading as new, and a series with NO sample-level read being promoted rather than
            # marked ungraded. All three are asserted here, before one byte is fetched.
            python -m pytest research/modalities/tests/test_emc_cohort_search.py -q
          elif [ "${{ inputs.mode }}" = "data-level-sweep" ]; then
            # ⛔ NOT OPTIONAL, and this mode has the sharpest reason of any here: its most likely
            # output is a ZERO, and a zero is worthless unless the thing producing it could have
            # said yes. Every way this module could report the wrong zero is offline arithmetic — a
            # dead transport control reporting target counts anyway, an absent control that leaks
            # records, a header-only read rendering as "no EMC samples", and a substring hit on the
            # SKELETAL tumour being summed into the extraskeletal count. All four are asserted here,
            # before one byte is fetched.
            python research/modalities/emc_data_level_sweep.py --selftest
          elif [ "${{ inputs.mode }}" = "nuccore-sweep" ]; then
            # ⛔ NOT OPTIONAL. This mode's whole value is an ALIAS TABLE — NR4A3 is TEC/CHN/NOR1
            # in the era when fusion cDNAs were actually deposited, and AF289510's DEFINITION line
            # contains no "NR4A3" at all. A sweep that quietly lost those aliases would search only
            # the years in which nobody deposited and would report a confident, empty negative.
            # The selftest asserts the aliases survive, that a query using them is built, and that
            # the KNOWN control record is parsed and its junction assigned from its own sequence.
            python research/modalities/nr4a3_nuccore_sweep.py --selftest
          elif [ "${{ inputs.mode }}" = "fusion-read-probe" ] \
            || [ "${{ inputs.mode }}" = "fusion-read-scan" ]; then
            # ⛔ NOT OPTIONAL, and this is the one lane where the offline suite is the ONLY thing
            # standing between a stream of reads and a fabricated breakpoint. A junction this
            # module emits would go straight into the ASO panel as a new reagent, so the suite
            # asserts BOTH directions against the committed transcripts: every known seam is
            # recovered and named with the right exon pair, and the wild-type NR4A3 exon2->exon3
            # read — the commonest read in any NR4A3-expressing tumour — is NOT called a fusion.
            # It also asserts the chunk-boundary carry, because a seam landing on an 8 MB boundary
            # would otherwise produce a silent, size-dependent false negative on a real fusion.
            python research/modalities/emc_fusion_read_scan.py --selftest
            python -m pytest research/modalities/tests/test_emc_fusion_read_scan.py -q
          elif [ "${{ inputs.mode }}" = "sra-study" ]; then
            # ⛔ NOT OPTIONAL, and the asymmetry is the reason. This mode's output is a verdict on
            # whether an accession exists, and the two ways of being wrong cost different things:
            # a false "does not exist" retires the highest-value lead on the board (BLK-NO-EMC-DATA
            # holds more routes than any other blocker), while a false "exists" puts a phantom
            # cohort into the graph. Both are offline arithmetic over cached payloads — the
            # transport gate in both directions, and the run-count/sample-count separation that
            # keeps "12 runs" from being read as 12 patients. The selftest runs first so a broken
            # derivation costs seconds rather than the fetch.
            python research/modalities/emc_sra_study.py --selftest
            python -m pytest research/modalities/tests/test_emc_sra_study.py -q
          elif [ "${{ inputs.mode }}" = "gse243553-eno3" ]; then
            # ⛔ NOT OPTIONAL. The two ways this module could lie are both offline arithmetic and
            # both were caught by this selftest before a byte was fetched: (1) the ENO3 NBRE
            # coordinates are DERIVED from the committed motif scan rather than typed, and the
            # derivation's first version assumed a strand-oriented `offset_from_tss` that the
            # artifact does not use — it failed on KDR, a minus-strand gene, by 29,657 bp;
            # (2) a non-200 fetch must render as `not_retrieved`, never as an empty file listing,
            # which is the difference between "GEO holds no peak call" and "we could not read GEO".
            python research/modalities/gse243553_eno3_overlap.py --selftest
            python -m pytest research/modalities/tests/test_gse243553_eno3_overlap.py -q
          elif [ "${{ inputs.mode }}" = "hypoxia-confounds" ]; then
            # ⛔ THE MERGE GUARD IS THE ONE THAT MATTERS HERE. This mode fetches a SECOND cache of
            # the same two matrices and the audit reads both; if they could disagree silently,
            # every merged score would be a blend of two experiments. The test asserts they cannot,
            # and it costs seconds against a fetch that costs the run.
            python -m pytest research/modalities/tests/test_emc_hypoxia_confounds.py -q
          elif [ "${{ inputs.mode }}" = "aso-offtarget-expression" ]; then
            # ⛔ NOT OPTIONAL, and this mode has the strongest version of the reason. Its output is
            # the expression half of a LIABILITY assessment for the one clinically-relevant reagent
            # in the ASO panel, and every way it could lie is offline arithmetic: an absent
            # reference row rendering as "not expressed" rather than "not measured"; a shifted GCT
            # parse emitting tissue figures that are internally consistent and wrong; a transcript
            # RECORD count being read as a risk ranking. The selftest asserts the first two against
            # constructed inputs — including a deliberately shifted matrix whose controls must
            # withhold every locus verdict — and it runs BEFORE the ~1 GB GTEx download, so a broken
            # derivation costs seconds rather than the run.
            python research/modalities/aso_offtarget_tissue_expression.py --selftest
            python -m pytest research/modalities/tests/test_aso_offtarget_tissue_expression.py -q
          else
            python -m pytest research/modalities/tests/test_emc_atr_vulnerability.py \
                             research/modalities/tests/test_atr_hrd_sarcoma_series.py -q
          fi

      # ⚠ THE NEGATIVE FORM IS DELIBERATE AND MUST STAY. An empty `inputs.mode` — a dispatch that
      # sends no inputs at all — has to fall through to part B, which is what this file has always
      # done. `== 'part-b'` would silently turn that dispatch into a no-op that reports success.
      # ─────────────────────────────────────────────────────────────────────────────────────
      # fusion-targets — what the fusion is published to transcribe, read in EMC tissue
      # ─────────────────────────────────────────────────────────────────────────────────────
      # ⭐ WHY IT NEEDS ITS OWN FETCH RATHER THAN part B's OR the panels lane's INPUTS CACHE.
      # Both of those caches hold per-sample values only for the genes THEIR concepts contain, and
      # this read wants a different list — the evidence-typed direct-target table, two published
      # EMC-vs-sarcoma profiles, the Brenca axon-guidance sets — plus two things neither cache
      # holds at all: the per-sample mean z over EVERY mapped symbol (the platform's global
      # offset) and a seeded random NULL POOL from which size-matched random gene sets are drawn.
      # Without those two the read is a raw contrast on a platform whose arms differ globally.
      - name: "Fusion targets — score the published NR4A3/fusion target set against a size-matched null"
        if: inputs.mode == 'fusion-targets'
        timeout-minutes: 75
        env:
          EMC_ACC_BRIDGE_BUDGET_S: ${{ inputs.acc_bridge_budget_s || '1500' }}
        run: python research/modalities/nr4a3_fusion_targets.py --fetch

      - name: "Fusion targets — offline re-derive must reproduce the artifact from its own cache"
        if: always() && inputs.mode == 'fusion-targets'
        timeout-minutes: 10
        run: |
          python research/modalities/nr4a3_fusion_targets.py --check \
            || echo "--check reported drift; non-blocking, but READ IT"

      # ─────────────────────────────────────────────────────────────────────────────────────
      # fusion-figures — redraw the five figures that read the artifact the mode above writes
      # ─────────────────────────────────────────────────────────────────────────────────────
      # ⭐ WHY THIS MODE EXISTS AT ALL. `nr4a3_fusion_targets_figures.py` stamps a content hash of
      # every artifact it drew from, and `--check` compares those hashes against the files on disk.
      # That stamp is the only staleness signal the figures have — the script's own `_why` field
      # says so — and until now NOTHING could re-stamp it except `depmap-dependency.yml`, a
      # ~90-minute network job that rebuilds the figures as a side effect of refreshing a dozen
      # unrelated artifacts. So the cheapest possible repair (redraw from files already on disk,
      # no network, ~1 minute) could only be bought by re-running the most expensive lane in the
      # repo and merging its entire blast radius.
      #
      # ⛔ MEASURED 2026-08-13, and it is exactly the failure that shape predicts. Commit 0dce79be
      # — the sweep that moved the manuscripts into per-route subfolders — rewrote THREE PROSE
      # STRINGS inside nr4a3-fusion-targets.json, all of them file cross-references
      # (`research/manuscripts/pparg-direction-emc.md` -> `.../repurposing/pparg-direction-emc.md`,
      # and the same for nr4a3-emc-biology-evidence.md). Not one number moved; not one field any
      # figure reads moved. But the stamp is a hash of the WHOLE FILE, so `--check` reported drift,
      # two tests went red, and `main`'s test workflow stayed red for days over three edited
      # comments — with the only repair route buried inside a DepMap refresh.
      #
      # ⚠ SO READ THE DRIFT SIGNAL FOR WHAT IT IS. A whole-file hash cannot tell "the data these
      # figures draw has moved" from "a comment in the same file was reworded", and it is not
      # supposed to: narrowing it to the read fields would make it stop catching the case it was
      # built for. What was missing was not a smarter hash but a cheap way to answer it — this.
      #
      # $0, no network, and it publishes ONLY what it draws.
      - name: "Fusion figures — redraw from the committed artifacts and re-stamp their provenance"
        if: inputs.mode == 'fusion-figures'
        timeout-minutes: 20
        run: |
          set -euo pipefail
          # The drawing needs matplotlib + numpy. Everything else in the chain
          # (nr4a3_fusion_targets -> emc_atr_vulnerability -> depmap_sarcoma_dependency,
          # fet_ddr_axis_scan) is pure stdlib at import time, which is why this lane's "no pip
          # install" rule needs only this one narrow exception.
          pip install matplotlib numpy
          echo "=== stamp BEFORE (what the committed figures claim they were drawn from) ==="
          cat research/manuscripts/figures/figure-provenance.json
          echo "=== the drift this run was dispatched to close ==="
          python research/modalities/nr4a3_fusion_targets_figures.py --check || true
          echo "=== redraw ==="
          python research/modalities/nr4a3_fusion_targets_figures.py
          echo "=== stamp AFTER ==="
          cat research/manuscripts/figures/figure-provenance.json

      # ⛔ HARD, NOT `|| echo`. Every other reproduce-check in this file is non-blocking because it
      # grades a FETCH that may have been degraded by a remote. This one grades nothing but local
      # arithmetic over files already on disk, so a failure here means the redraw did not do what
      # it claims — and publishing a stamp that does not match its own artifacts would write the
      # exact false provenance the stamp exists to prevent (CLAUDE.md §4: a populated field is not
      # a measured one). The full test file runs too, with the two stamp tests NOT deselected:
      # this is the step where they have to pass.
      - name: "Fusion figures — the re-stamped provenance must match, and the stamp tests must pass"
        if: inputs.mode == 'fusion-figures'
        timeout-minutes: 10
        run: |
          set -euo pipefail
          python research/modalities/nr4a3_fusion_targets_figures.py --check
          python -m pytest research/modalities/tests/test_nr4a3_fusion_targets_figures.py -q

      # The guard is `steps.guard.outputs.part_b`, resolved once at the top of this job. The reason
      # it is not `inputs.mode == 'part-b'`, and the run a restated list already cost, are both
      # recorded there — do not re-inline the list here.
      - name: "Part B — search four archives for an EMC expression dataset, then read every candidate series"
        if: steps.guard.outputs.part_b == 'true'
        timeout-minutes: 75
        env:
          # ⚠ Must stay comfortably BELOW `timeout-minutes` above. A step that times out returns
          # nothing at all — `collect_part_b` never returns, so the series that were already read
          # successfully are lost with it. The budget is what makes the expensive EST bridge unable
          # to destroy the cheap reads' results.
          EMC_ACC_BRIDGE_BUDGET_S: ${{ inputs.acc_bridge_budget_s || '1500' }}
        run: python research/modalities/emc_atr_vulnerability.py --refresh-part-b

      # ⚠ SAMPLE-LEVEL, deliberately. A GEO series TITLE is a claim by its depositors, and this repo
      # has been bitten twice by reading one as a measurement (GSE24369 is titled after LGFMS and
      # carries six EMC tumours; DepMap's one "EMC" model is recorded as carrying no EWSR1 fusion).
      - name: "GEO series — characterise ONE series from its per-sample metadata"
        if: inputs.mode == 'gse-series'
        timeout-minutes: 30
        run: python research/modalities/atr_hrd_sarcoma_series.py --fetch --series "${{ inputs.series || 'GSE299349' }}"

      # ⭐ THE IDENTITY CHECK, and it runs by default rather than on request. This repo's most
      # consequential recent finding is that its one "EMC" cell line is recorded as carrying no
      # EWSR1 fusion — an EMC LABEL held for a month while a `[to verify]` flag sat beside it. A
      # new EMC-labelled sample gets the same question asked BEFORE anything is built on it.
      # Self-limiting on a series with no per-sample quantification: it downloads nothing.
      - name: "GEO series — corroborate (or fail to corroborate) the disease labels from the data"
        if: inputs.mode == 'gse-series'
        timeout-minutes: 45
        run: python research/modalities/atr_hrd_sarcoma_series.py --fetch-quant

      # ─────────────────────────────────────────────────────────────────────────────────────
      # aso-junction — the regeneration the route framing audit left owed
      # ─────────────────────────────────────────────────────────────────────────────────────

      # ⭐ THE AUDIT RUNS FIRST AND IT DESIGNS NOTHING. It grades every declared exon pair from the
      # spliced cDNA: is the acceptor exon coding, where does NR4A3 resume, how many acceptor 5'UTR
      # bases the fusion retains, is the chimeric ORF in frame, what the real mRNA seam is. This
      # table is the instrument the lane never had — the old code emitted a panel with a junction
      # LABEL and no graded offsets, so the wrong seam was invisible in the file depending on it.
      - name: "ASO — grade every declared EWSR1::NR4A3 exon pair at the mRNA level (Ensembl)"
        if: inputs.mode == 'aso-junction'
        timeout-minutes: 20
        run: |
          set -o pipefail
          python research/modalities/junction_aso.py --audit
          echo "===BEGIN junction-mrna-frame-audit.json==="
          cat research/modalities/junction-mrna-frame-audit.json
          echo "===END junction-mrna-frame-audit.json==="

      # A refusal is a RESULT and is reported as one. The loop never swallows an exception: an exon
      # pair that cannot be built produces a recorded refusal carrying the exact reason, because
      # "the panel is missing" and "the panel was refused, for this reason" are different facts and
      # this lane has already been burned once by making them render alike.
      - name: "ASO — regenerate the design panel for every junction the audit grades EMITTABLE"
        if: inputs.mode == 'aso-junction'
        timeout-minutes: 20
        env:
          JUNCTIONS: ${{ inputs.junctions || '7:3,12:3' }}
        run: |
          python3 - <<'PY'
          import json, os, subprocess, sys
          MOD = "research/modalities"
          audit = json.load(open(f"{MOD}/junction-mrna-frame-audit.json"))
          grade = {r["junction_label"]: r for r in audit["rows"]}
          out = {"requested": [], "emitted": [], "refused": []}
          for pair in os.environ["JUNCTIONS"].split(","):
              e, n = (x.strip() for x in pair.strip().split(":"))
              label = f"EWSR1_e{e}__NR4A3_e{n}"
              row = grade.get(label)
              out["requested"].append(label)
              if row is None:
                  out["refused"].append({"junction": label,
                                         "why": "not in the declared breakpoint windows"})
                  continue
              if row.get("grade") != "EMITTABLE":
                  out["refused"].append({"junction": label, "grade": row.get("grade"),
                                         "why": row.get("why")})
                  continue
              env = dict(os.environ, FUSION_JUNCTION_MODE="real", EWSR1_EXON_END=e,
                         NR4A3_EXON_START=n, OUT_SUFFIX=f"-e{e}n{n}")
              r = subprocess.run([sys.executable, f"{MOD}/junction_aso.py"], env=env,
                                 capture_output=True, text=True)
              if r.returncode != 0:
                  out["refused"].append({"junction": label, "grade": "BUILD_FAILED",
                                         "why": r.stderr.strip()[-2000:]})
                  continue
              out["emitted"].append({"junction": label,
                                     "file": f"junction-aso-designs-e{e}n{n}.json"})
          json.dump(out, open(f"{MOD}/junction-aso-regen-manifest.json", "w"), indent=2)
          print(json.dumps(out, indent=2))
          PY
          for f in research/modalities/junction-aso-designs-e*.json; do
            echo "===BEGIN $(basename "$f")==="; cat "$f"; echo; echo "===END $(basename "$f")==="
          done

      - name: "ASO — upload every artifact this run produced"
        if: always() && inputs.mode == 'aso-junction'
        uses: actions/upload-artifact@v4
        with:
          name: aso-junction-regen
          if-no-files-found: warn
          path: |
            research/modalities/junction-mrna-frame-audit.json
            research/modalities/junction-aso-regen-manifest.json
            research/modalities/junction-aso-designs-e*.json

      # ─────────────────────────────────────────────────────────────────────────────────────
      # panels — the six reads §4 of emc-unexplored-treatment-lanes.md turns on
      # ─────────────────────────────────────────────────────────────────────────────────────

      # ⭐ ONE FETCH, TWO NAMED MATRIX FILES, AND NOTHING PART B OWNS. The module names
      # GSE24369/GPL6244 and GSE4303-GPL3290 explicitly rather than re-running part B's search,
      # because both have already been CHARACTERISED — their probe mapping rates have their one
      # home in emc-atr-vulnerability.json, and this run reports its own MEASURED rate against
      # that prior so a silently-degraded annotation cannot pass as a biological reading.
      - name: "Panels — the targeted reads in the two readable EMC series"
        if: inputs.mode == 'panels'
        timeout-minutes: 90
        env:
          # ⚠ Must stay comfortably BELOW `timeout-minutes` above, for the reason part B's copy of
          # this comment gives: a step that times out returns NOTHING, so the cheap GPL6244 read
          # would be destroyed by the expensive GPL3290 bridge. GPL6244 is fetched FIRST in
          # `TARGETS` order for the same reason.
          EMC_ACC_BRIDGE_BUDGET_S: ${{ inputs.acc_bridge_budget_s || '1500' }}
        run: python research/modalities/emc_expression_panels.py --fetch

      - name: "Panels — reproduce check (the derive half must be offline-reproducible)"
        if: always() && inputs.mode == 'panels'
        timeout-minutes: 10
        run: |
          python research/modalities/emc_expression_panels.py --check \
            || echo "--check reported drift; non-blocking, but READ IT"

      # ⭐ THE OTHER HALF OF A SURFACE-ANTIGEN READING, IN THE SAME DISPATCH (added 2026-08-07).
      # Read 7 measures antigens in EMC tumour tissue against OTHER SARCOMAS. That contrast cannot
      # speak to on-target/off-tumour toxicity, and normal-tissue expression is what kills surface
      # antigens — so an EMC-tumour number without a normal-tissue window is an antigen nobody can
      # grade. `emc_surface_normal_window.py` is the one home of that axis (HPA RNA, with
      # DLL3/GPC3 as RESTRICTED positive controls, B2M as BROAD and CD3E as the hard immune
      # control); it is run here so the two halves land together instead of one waiting on a
      # separate omnibus dispatch. CLAUDE.md §6: fan out when no result could cancel the other.
      #
      # ⚠ NON-BLOCKING BY DESIGN. HPA is a third-party API; a failure there must not destroy the
      # GEO read that just spent up to 90 minutes. A missing normal-window artifact is an ABSENT
      # reading and the panel artifact says so in its own text — it is never a finding of no
      # liability.
      - name: "Panels — normal-tissue therapeutic-window (HPA) for the same antigens"
        if: always() && inputs.mode == 'panels'
        timeout-minutes: 20
        working-directory: research/modalities
        run: python emc_surface_normal_window.py || echo "::warning::normal-window failed — the EMC-tumour read stands, the normal-tissue axis is ABSENT (not negative)"

      # Belt and braces: the run artifact survives even if the publish step below cannot push.
      - name: "Panels — upload the artifact and its inputs cache"
        if: always() && inputs.mode == 'panels'
        uses: actions/upload-artifact@v4
        with:
          name: emc-expression-panels
          if-no-files-found: warn
          path: |
            research/modalities/emc-expression-panels.json
            research/modalities/emc-expression-panels-inputs.json
            research/modalities/emc-surface-normal-window.json

      # ─────────────────────────────────────────────────────────────────────────────────────
      # ret-cistrome — measured NR4A occupancy at the RET locus
      # ─────────────────────────────────────────────────────────────────────────────────────

      # ⭐ ONE STEP, EVERY CATALOGUE, EVERY ATTEMPT RECORDED. The module never raises on a dead
      # endpoint: a 404 from ChIP-Atlas and a 404 from ReMap are READINGS about those catalogues
      # and are written into the artifact with their status codes. "We did not look" and "we
      # looked and it is not there" are different facts and this lane keeps them different.
      - name: "RET cistrome — retrieve, characterise, intersect"
        if: inputs.mode == 'ret-cistrome'
        timeout-minutes: 90
        env:
          # ⚠ Must stay comfortably BELOW `timeout-minutes`. A step that times out returns
          # NOTHING — the peak sets already retrieved would be lost with it — so the module's own
          # budget stops one slow catalogue destroying the retrievals that succeeded, and records
          # `budget_exhausted` rather than letting it read as "not found".
          RET_CISTROME_BUDGET_S: ${{ inputs.cistrome_budget_s || '3000' }}
        run: python research/modalities/emc_ret_cistrome.py --fetch

      # ⭐ ADD ONE SOURCE WITHOUT RE-FETCHING EVERY CATALOGUE. `--fetch` is all-or-nothing, and two
      # dispatches showed that is not reliably available: one spent its whole 3000 s budget and
      # retrieved zero peak sets where an earlier run spent 344 s of 2400 s and retrieved 86. The
      # peak coordinates are already committed, so this makes a handful of HTTP calls, merges
      # Zenodo into that cache and re-derives. It cannot starve, and it is still subject to the
      # coverage guard — a merge that would shrink the artifact is refused like any other write.
      - name: "RET cistrome — fetch ONLY Zenodo and merge it into the committed inputs cache"
        if: inputs.mode == 'ret-cistrome-zenodo'
        timeout-minutes: 25
        env:
          # ⚠ MUST STAY COMFORTABLY BELOW `timeout-minutes`, the same rule every other network step
          # in this file carries — and this step shipped without it. The module's default budget is
          # 3000 s (50 min) against a 25-minute step timeout, so the graceful-exit path could NEVER
          # fire: the runner would kill the step first, and a killed step prints nothing and writes
          # nothing, which is precisely the diagnostic this mode exists to produce. One unresponsive
          # peak file can take 20 minutes on its own here (`get` is tries=4 × timeout=300).
          RET_CISTROME_BUDGET_S: "900"
        run: python research/modalities/emc_ret_cistrome.py --fetch-zenodo

      # ⭐ SAME SHAPE AS THE ZENODO MERGE, DIFFERENT BLIND SPOT. Every GEO query this module runs
      # asks for ChIP, and CUT&Tag / CUT&RUN are occupancy but are not ChIP — which is how
      # GSE254076 (NR4A3 CUT&Tag, mouse VSMC) sat unretrieved while the lane reported that it had
      # searched GEO for NR4A3 occupancy. This mode fetches the NAMED_GEO_SERIES accessions by
      # accession, merges them into the committed inputs cache and re-derives.
      # ⚠ IT ADDS DISCOVERY, NOT A PEAK SET. A series enters part 2 only if its supplementary
      # listing serves peak coordinates; one whose only supplementary file is a _RAW.tar serves
      # none, and must land in peaksets_not_intersected_and_why rather than inflating the count.
      - name: "RET cistrome — fetch ONLY the named GEO accessions and merge them"
        if: inputs.mode == 'ret-cistrome-named-geo'
        timeout-minutes: 25
        env:
          # ⚠ Comfortably below `timeout-minutes`, per the sibling step's rule: a killed step
          # prints nothing and writes nothing, which is the opposite of the diagnostic wanted.
          RET_CISTROME_BUDGET_S: "900"
        run: python research/modalities/emc_ret_cistrome.py --fetch-named-geo

      - name: "RET cistrome — reproduce check (the derive half must be offline-reproducible)"
        if: always() && (inputs.mode == 'ret-cistrome' || inputs.mode == 'ret-cistrome-zenodo' || inputs.mode == 'ret-cistrome-named-geo')
        timeout-minutes: 10
        run: |
          python research/modalities/emc_ret_cistrome.py --check \
            || echo "--check reported drift; non-blocking, but READ IT"

      # ⚠ `-inputs-FAILED.json` IS UPLOADED AND MUST NEVER BE PUBLISHED. A refused run writes its
      # cache there instead of over the real one, and uploading it is how that cache stays
      # diagnosable without a commit — which is the whole point, since the publish arm below is
      # `always()` and would otherwise ship a failure stub over 52 MB of peak coordinates. It did,
      # once: commit 5190923.
      - name: "RET cistrome — upload the artifact and its inputs cache"
        if: always() && (inputs.mode == 'ret-cistrome' || inputs.mode == 'ret-cistrome-zenodo' || inputs.mode == 'ret-cistrome-named-geo')
        uses: actions/upload-artifact@v4
        with:
          name: emc-ret-cistrome
          if-no-files-found: warn
          path: |
            research/modalities/emc-ret-cistrome.json
            research/modalities/emc-ret-cistrome-inputs.json
            research/modalities/emc-ret-cistrome-inputs-FAILED.json

      # ─────────────────────────────────────────────────────────────────────────────────────
      # cohort-search — is there a FOURTH EMC expression cohort?
      # ─────────────────────────────────────────────────────────────────────────────────────

      # ⭐ THE GUARD IS THE DELIVERABLE AS MUCH AS THE SEARCH IS, which is why this is its own mode
      # rather than a few extra queries bolted onto part B. GSE170983 is 99 samples, four of them
      # EMC, with its own accession and its own series record — and it is the SAME Brunner deposit
      # as GSE28866, already this paper's 3SEQ arm, with the same four tumours. A search that
      # returned it and counted it would have inflated the manuscript's n while every number in the
      # manuscript stayed arithmetically correct. So every candidate is checked at accession,
      # publication AND sample level, and a candidate with no sample-level read is graded UNGRADED
      # rather than promoted.
      - name: "Cohort search — ask GEO for a fourth EMC expression cohort, dedup at sample level"
        if: inputs.mode == 'cohort-search'
        timeout-minutes: 30
        run: python research/modalities/emc_cohort_search.py --fetch

      - name: "Cohort search — the verdict must re-derive offline from its own cached queries"
        if: always() && inputs.mode == 'cohort-search'
        timeout-minutes: 10
        run: |
          python research/modalities/emc_cohort_search.py --check \
            || echo "--check reported drift; non-blocking, but READ IT"

      - name: "Cohort search — upload the verdict and the raw query record"
        if: always() && inputs.mode == 'cohort-search'
        uses: actions/upload-artifact@v4
        with:
          name: emc-cohort-search
          if-no-files-found: warn
          path: |
            research/modalities/emc-cohort-search.json
            research/modalities/emc-cohort-search-inputs.json

      # ─────────────────────────────────────────────────────────────────────────────────────
      # data-level-sweep — what carries EMC that a PROSE search cannot reach?
      # ─────────────────────────────────────────────────────────────────────────────────────

      # ⭐ WHY IT IS A SEPARATE MODE FROM cohort-search, WHICH IT COMPLETES RATHER THAN REPEATS.
      # `emc_cohort_search.py` asked GEO and returned a bounded negative; its own header states the
      # bound — GEO esearch matches DEPOSITOR PROSE, so a pan-sarcoma deposit under a generic title
      # is invisible to it however many EMC samples it holds. That is not a hypothetical: this
      # repository already reads six EMC tumours out of GSE24369, a series TITLED "low-grade
      # fibromyxoid sarcoma". Every EMC count here descends from prose searches that could only have
      # found that series by accident. This mode asks the complement, and it must be its own
      # artifact because a bound and the thing outside the bound are different measurements.
      #
      # ⛔ IT PROBES BEFORE IT SEARCHES, ON PURPOSE. Whether a splice-junction index carries the
      # junction classes a fusion transcript produces is not answerable from documentation and must
      # not be answered from recollection. This run measures the served columns and record counts and
      # emits `PROBED_NOT_SEARCHED`; the searchable design is written against that measurement.
      # openpyxl only — the supplementary diagnosis table is a spreadsheet. If it is missing the
      # module records `openpyxl unavailable` against that file and the arm reports LABELS_NOT_
      # LOCATED; it never reports "no EMC" for a file it could not open.
      - name: "Data-level sweep — the junction index and the pan-sarcoma methylation deposit"
        if: inputs.mode == 'data-level-sweep'
        timeout-minutes: 60
        run: |
          python -m pip install --quiet openpyxl
          ARM="${{ inputs.sweep_arm }}"
          if [ -z "$ARM" ] || [ "$ARM" = "both" ]; then
            python research/modalities/emc_data_level_sweep.py --fetch
          else
            python research/modalities/emc_data_level_sweep.py --fetch --only "$ARM"
          fi

      - name: "Data-level sweep — derive the verdict from the cached inputs"
        if: always() && inputs.mode == 'data-level-sweep'
        timeout-minutes: 10
        run: python research/modalities/emc_data_level_sweep.py || echo "derive reported a problem; READ IT"

      - name: "Data-level sweep — the verdict must re-derive offline from its own inputs"
        if: always() && inputs.mode == 'data-level-sweep'
        timeout-minutes: 10
        run: |
          python research/modalities/emc_data_level_sweep.py --check \
            || echo "--check reported drift; non-blocking, but READ IT"

      - name: "Data-level sweep — upload the verdict and the raw retrieval record"
        if: always() && inputs.mode == 'data-level-sweep'
        uses: actions/upload-artifact@v4
        with:
          name: emc-data-level-sweep
          if-no-files-found: warn
          path: |
            research/modalities/emc-data-level-sweep.json
            research/modalities/emc-data-level-sweep-inputs.json

      # ─────────────────────────────────────────────────────────────────────────────────────
      # aso-offtarget-expression — WHERE are the junction gapmer's off-target loci expressed?
      # ─────────────────────────────────────────────────────────────────────────────────────

      # ⭐ WHAT IT IS FOR, AND WHY IT IS THE HIGHEST-VALUE READ ON THIS LANE.
      # Five screens stand behind the ASO panel and all five ask a SEQUENCE question: does something
      # in the transcriptome resemble this oligonucleotide closely enough to hybridise. None asks
      # the question that decides whether such a resemblance can matter in a patient — is the
      # transcript carrying it PRESENT in a tissue the drug reaches. At the tenfold-deeper ceiling
      # the one clinically-relevant reagent returns 123 gap-paired hybridisable near-matches over
      # six gene loci, and without this read the manuscript can only report that number.
      #
      # ⭐ THE COMPARTMENT SPLIT IS THE DELIVERABLE. Systemically dosed phosphorothioate gapmers
      # distribute predominantly to liver and kidney, so those organs carry the EXPOSURE question,
      # while deep soft tissue of the extremities carries the ON-SITE one. A gene can be a serious
      # exposure liability and irrelevant on site, or the reverse, so the two are read into separate
      # blocks and are never summed. GTEx contains no EMC and no sarcoma, so the soft-tissue block
      # is labelled a NORMAL-TISSUE PROXY and the actual tumour reading is the EMC array arm.
      #
      # ⛔ IT PUBLISHES, on the same test `panels`, `cohort-search` and `sra-study` pass: NEW
      # artifacts under NEW names nothing has ever cited, so there is no file it can be confused
      # with. It CANNOT perturb the panels lane's artifact — arm B calls
      # `emc_expression_panels._read_target`, which is a pure read, and the output lands only in
      # this module's own inputs cache. Reusing that function rather than re-implementing it is a
      # correctness argument: probe-to-symbol mapping on these two platforms is the part that has
      # actually been hard here, and a second implementation would be free to disagree with the
      # panels lane about whether a gene is readable at all.
      #
      # ⚠ THE FETCH IS ~1 GB (the GTEx v8 median-TPM release matrix), which is why the timeout is
      # generous and why the offline suite above runs first.
      - name: "ASO off-target expression — GTEx exposure organs, EMC tumours, and locus identity"
        if: inputs.mode == 'aso-offtarget-expression'
        timeout-minutes: 75
        env:
          EMC_ACC_BRIDGE_BUDGET_S: ${{ inputs.acc_bridge_budget_s || '1500' }}
        run: python research/modalities/aso_offtarget_tissue_expression.py --fetch

      - name: "ASO off-target expression — the verdict must re-derive offline from its own cache"
        if: always() && inputs.mode == 'aso-offtarget-expression'
        timeout-minutes: 10
        run: |
          python research/modalities/aso_offtarget_tissue_expression.py --check \
            || echo "--check reported drift; non-blocking, but READ IT"

      - name: "ASO off-target expression — upload the verdict and the raw retrievals"
        if: always() && inputs.mode == 'aso-offtarget-expression'
        uses: actions/upload-artifact@v4
        with:
          name: aso-offtarget-tissue-expression
          if-no-files-found: warn
          path: |
            research/modalities/aso-offtarget-tissue-expression.json
            research/modalities/aso-offtarget-tissue-expression-inputs.json

      # ─────────────────────────────────────────────────────────────────────────────────────
      # sra-study — the SRA-side sibling: characterise ONE named archive study
      # ─────────────────────────────────────────────────────────────────────────────────────

      # ⭐ WHY IT IS A SEPARATE MODE FROM cohort-search, WHICH ASKS THE SAME QUESTION.
      # `emc_cohort_search.py` asks GEO, and its own header bounds the negative it produces to what
      # a GEO term search can reach. `nr4a3-fusion-transcriptional-output.md` §3.13 records "no
      # fourth EMC cohort exists" off a GEO-side search too. An SRA-only deposit — registered in
      # SRA, never given a GEO series — is outside BOTH, and `SRP640302` is already named in this
      # repository with a title and nothing else (`emc-atr-vulnerability-inputs.json` ->
      # part_b.dataset_search.sra.studies[0]). A title is not a characterisation.
      #
      # ⛔ IT PUBLISHES, on the same test `panels` and `cohort-search` pass: NEW artifacts under
      # NEW names nothing has ever cited, so there is no file it can be confused with, and it
      # cannot perturb part B's committed grading artifact or the GEO-side cohort search's verdict.
      # The two are allowed to disagree — they searched different archives.
      - name: "SRA study — characterise the named deposit across NCBI and ENA, with controls"
        if: inputs.mode == 'sra-study'
        timeout-minutes: 30
        run: python research/modalities/emc_sra_study.py --fetch

      - name: "SRA study — derive the verdict from the payloads just cached"
        if: always() && inputs.mode == 'sra-study'
        timeout-minutes: 10
        run: python research/modalities/emc_sra_study.py

      - name: "SRA study — the verdict must re-derive offline from its own cached payloads"
        if: always() && inputs.mode == 'sra-study'
        timeout-minutes: 10
        run: |
          python research/modalities/emc_sra_study.py --check \
            || echo "--check reported drift; non-blocking, but READ IT"

      - name: "SRA study — upload the verdict and every raw payload"
        if: always() && inputs.mode == 'sra-study'
        uses: actions/upload-artifact@v4
        with:
          name: emc-sra-study
          if-no-files-found: warn
          path: |
            research/modalities/emc-sra-study.json
            research/modalities/emc-sra-study-inputs.json

      # ─────────────────────────────────────────────────────────────────────────────────────
      # fusion-read-probe / fusion-read-scan — breakpoints from DEPOSITED READS, not from prose
      # ─────────────────────────────────────────────────────────────────────────────────────
      #
      # ⭐ WHY THIS LANE EXISTS. Every junction ASO needs its own breakpoint, so patient coverage
      # is capped by how many breakpoints can be NAMED. Three literature sweeps (~1,030 papers)
      # produced seven exon-resolved junctions and exactly ONE paper that prints a per-case exon
      # table. Several cohorts publish complete per-case PARTNER splits with no exons: those
      # breakpoints WERE resolved by the assays used and simply were not printed. Literature
      # search is therefore exhausted; deposited reads are the only remaining source.
      #
      # ⛔ TWO MODES, and the PROBE MUST COME FIRST. `fusion-read-probe` characterises what a
      # deposit actually serves — open or controlled, reads or a processed matrix, whole
      # transcriptome or a targeted panel — WITHOUT downloading a read. That ordering is not
      # politeness: a processed expression matrix cannot carry a breakpoint, and neither can a
      # TARGETED probe assay. PRJNA1357027 is the measured case — its own SRA experiment title is
      # "Targeted RNA-seq (TempO-Seq) of EMC" and every read is a fixed 50 nt amplicon inside one
      # gene, so scanning it would burn the run to produce a zero that carries NO information.
      # The scanner REFUSES such a deposit rather than reporting that zero.
      #
      # ⛔ AND A ZERO FROM A SCAN THAT RAN IS STILL NOT AN ABSENCE. Every scan reports its
      # DENOMINATOR — how many reads carried NR4A3 at all. A scan that saw no NR4A3 read is
      # UNINFORMATIVE and says so; only a scan with real NR4A3 depth may use the word "absent",
      # and then only for the seams it looked for (CLAUDE.md §4).
      #
      # $0. Reads are STREAMED and never written to disk, so a multi-GB run needs no runner disk
      # and the job is network-bound, not storage-bound.
      - name: "Fusion reads — probe what each deposit actually serves (no reads downloaded)"
        if: inputs.mode == 'fusion-read-probe'
        timeout-minutes: 25
        env:
          PROBE_TARGETS: ${{ inputs.probe_targets }}
        run: |
          set -euo pipefail
          python research/modalities/emc_fusion_read_scan.py --probe ${PROBE_TARGETS} \
            --budget-s 900

      - name: "Fusion reads — stream the deposited reads and match the junction seams"
        if: inputs.mode == 'fusion-read-scan'
        timeout-minutes: 120
        env:
          SCAN_RUNS: ${{ inputs.scan_runs }}
        run: |
          set -euo pipefail
          python research/modalities/emc_fusion_read_scan.py --scan ${SCAN_RUNS} \
            --budget-s 6000

      - name: "Nuccore sweep — the CHEAP route: deposited chimeric cDNAs, alias-aware"
        if: inputs.mode == 'nuccore-sweep'
        timeout-minutes: 60
        run: |
          set -euo pipefail
          python research/modalities/nr4a3_nuccore_sweep.py --fetch --budget-s 2400

      - name: "Nuccore sweep — upload the sweep and every query it ran"
        if: always() && inputs.mode == 'nuccore-sweep'
        uses: actions/upload-artifact@v4
        with:
          name: nr4a3-nuccore-sweep
          if-no-files-found: warn
          path: |
            research/modalities/nr4a3-nuccore-sweep.json
            research/modalities/nr4a3-nuccore-sweep-inputs.json

      - name: "Fusion reads — upload the verdict and the run tables it was driven from"
        if: always() && (inputs.mode == 'fusion-read-probe' || inputs.mode == 'fusion-read-scan')
        uses: actions/upload-artifact@v4
        with:
          name: emc-fusion-read-scan
          if-no-files-found: warn
          path: |
            research/modalities/emc-fusion-read-scan.json
            research/modalities/emc-fusion-read-scan-inputs.json
            research/modalities/emc-fusion-read-scan-deposits.json
      # gse243553-eno3 — RECON FIRST, because the deposit may not support the analysis
      # ─────────────────────────────────────────────────────────────────────────────────────
      #
      # ⭐ WHY RECON IS ITS OWN STEP AND ITS OWN ARTIFACT. The question is whether EWSR1-NR4A3's
      # differentially accessible peaks in GSE243553 overlap the ENO3 NBRE coordinates §3.10
      # reports. Answering it needs a PEAK CALL, and the cistrome search's one read of GEO's file
      # list recorded only `*_fullfusion_fragments-N.tsv.gz` + `*_SampleN_merged_associations.csv.gz`
      # — fragments and a barcode->variant map. If that holds there is no deposited peak set to
      # intersect, and "the deposit does not support the analysis" is the finding. Re-calling peaks
      # here would be a DIFFERENT experiment wearing this one's name.
      #
      # So this step reads four independent places a peak call could live — the series suppl
      # directory, every SAMPLE's suppl directory and SOFT record, the authors' analysis repo, and
      # the preprint's media list — and records every filename and every HTTP status verbatim.
      - name: "GSE243553 recon — what is deposited, on which build, and is there a peak call?"
        if: inputs.mode == 'gse243553-eno3'
        timeout-minutes: 30
        env:
          GSE243553_BUDGET_S: "1200"
        run: python research/modalities/gse243553_eno3_overlap.py --stage recon --fetch

      # ⭐ STAGE 2 RUNS IN THE SAME DISPATCH BECAUSE IT IS 13 SECONDS BEHIND STAGE 1 AND ANSWERS
      # THE THREE QUESTIONS "THE DEPOSIT HAS NO PEAK CALL" IS NOT ALLOWED TO SKIP: what a
      # re-analysis would actually cost (every file HEAD-sized, so the figure is a reading and not
      # the one "75G" in an FTP listing), whether the NR4A3 arms are really in the deposited
      # barcode->variant maps (the cistrome note says those files "have not been opened"), and
      # whether a differential-peak table exists as a PAPER SUPPLEMENT rather than a GEO file.
      - name: "GSE243553 arms — sizes measured, arms read from the data, supplement searched"
        if: inputs.mode == 'gse243553-eno3'
        timeout-minutes: 30
        env:
          GSE243553_ARMS_BUDGET_S: "1200"
        run: |
          python research/modalities/gse243553_eno3_overlap.py --stage arms --fetch \
            --budget-s "${GSE243553_ARMS_BUDGET_S}"

      # ⭐ STAGE 2b IS THE ONE THAT CHANGED THE ANSWER. GEO deposits 80.1 GB of fragments and no
      # peak call; Europe PMC's supplementaryFiles endpoint answers 200 with "not open access";
      # bioRxiv answers 429. Three shut doors are not an absence — the article is in PMC as an
      # author manuscript, and PMC serves those supplements from /articles/instance/<id>/bin/.
      - name: "GSE243553 supplement — the paper's own files, where a peak table actually lives"
        if: inputs.mode == 'gse243553-eno3'
        timeout-minutes: 30
        env:
          GSE243553_SUPPL_BUDGET_S: "1500"
        run: |
          python research/modalities/gse243553_eno3_overlap.py --stage suppl --fetch \
            --budget-s "${GSE243553_SUPPL_BUDGET_S}"

      # ⭐ AND THIS IS THE ANSWER. The paper's own per-fusion accessibility calls (Springer ESM
      # for doi 10.1038/s41587-024-02347-4 — GEO has none) intersected with the ENO3 NBRE
      # coordinates from §3.10's own committed scan, on a build that was READ from the deposit,
      # against THREE nulls: an arbitrary promoter carrying ENO3's own site geometry, a seeded
      # resampling in the panel's windows, and a seeded resampling inside ENO3's OWN window — the
      # last of which is the one that controls for the promoter merely being open.
      - name: "GSE243553 overlap — the ENO3 NBRE sites against the paper's own peak calls"
        if: inputs.mode == 'gse243553-eno3'
        timeout-minutes: 45
        env:
          GSE243553_OVERLAP_BUDGET_S: "1800"
        run: |
          python research/modalities/gse243553_eno3_overlap.py --stage overlap --fetch \
            --budget-s "${GSE243553_OVERLAP_BUDGET_S}"

      - name: "GSE243553 recon — upload"
        if: always() && inputs.mode == 'gse243553-eno3'
        uses: actions/upload-artifact@v4
        with:
          name: gse243553-eno3-overlap
          if-no-files-found: warn
          path: |
            research/modalities/gse243553-eno3-overlap-recon.json
            research/modalities/gse243553-eno3-overlap-arms.json
            research/modalities/gse243553-eno3-overlap-supplement.json
            research/modalities/gse243553-eno3-overlap.json

      # ─────────────────────────────────────────────────────────────────────────────────────
      # ret-motif — the sibling sequence instrument (emc-ret-lane.md §6, next step 2)
      # ─────────────────────────────────────────────────────────────────────────────────────

      - name: "RET motif — NBRE/NurRE scan against two nulls, plus the RET expression read"
        if: inputs.mode == 'ret-motif'
        timeout-minutes: 60
        env:
          EMC_ACC_BRIDGE_BUDGET_S: ${{ inputs.acc_bridge_budget_s || '1500' }}
        run: python research/modalities/emc_ret_target_scan.py --fetch

      - name: "RET motif — reproduce check"
        if: always() && inputs.mode == 'ret-motif'
        timeout-minutes: 10
        run: |
          python research/modalities/emc_ret_target_scan.py --check \
            || echo "--check reported drift; non-blocking, but READ IT"

      - name: "RET motif — upload"
        if: always() && inputs.mode == 'ret-motif'
        uses: actions/upload-artifact@v4
        with:
          name: emc-ret-target-scan
          if-no-files-found: warn
          path: |
            research/modalities/emc-ret-target-scan.json
            research/modalities/emc-ret-target-scan-inputs.json

      # hypoxia-confounds — the two NETWORKED halves of the confound audit
      # ─────────────────────────────────────────────────────────────────────────────────────
      #
      # ⭐ WHY THIS IS A MODE AND NOT A RE-RUN OF `panels`. The audit is a RE-ANALYSIS of the panels
      # inputs cache and runs offline at $0; it is already derived and committed before this ever
      # fires. Exactly two of its readings need the network, and both are reported as ABSENT
      # READINGS until they are taken rather than being quietly skipped:
      #   (a) the genome-wide null background. The cached want list is ~a third hypoxia-signature
      #       membership, so a "random" draw from it is not random and the null it produces is
      #       biased toward the observed value. Only a draw from the platform's whole mapped-symbol
      #       universe answers "is a set of this size unusual" cleanly.
      #   (b) the clinical record for the three drug classes the reading points at. CLAUDE.md's
      #       golden rule is that nothing clinical may be stated uncited, and the sarcoma history
      #       of hypoxia-directed therapy is the single most important context for the whole
      #       reading — so it is RETRIEVED, never recalled.
      # It re-runs `panels`' fetch of the same two matrices under a different want list. That is
      # deliberate duplication of a $0 CPU fetch, and it buys the merge integrity check: two
      # independent parses of the same matrix that must agree gene-for-gene.
      # ⚠ SKIPPABLE, because the two halves fail for unrelated reasons and only one of them is
      # expensive. Run 31200194935: the background fetch succeeded and every ClinicalTrials.gov
      # query returned HTTP 400 (a v1 `fields=` list sent to the v2 endpoint). Re-running the
      # retrieval should not cost another ~25 minutes of GEO fetching for an artifact that is
      # already correct and already committed — and a re-run that DOES redo it would overwrite a
      # good artifact to fix a different one.
      # ⛔ The skip is opt-IN and the background is the default, so forgetting the flag costs time
      # rather than silently leaving the null unfetched.
      - name: "Hypoxia confounds — genome-wide null background"
        if: inputs.mode == 'hypoxia-confounds' && inputs.skip_null_background != 'true'
        timeout-minutes: 90
        env:
          # Same reason as every other copy of this line in this file: a step that times out
          # returns NOTHING, so the budget must stay comfortably below `timeout-minutes`.
          EMC_ACC_BRIDGE_BUDGET_S: ${{ inputs.acc_bridge_budget_s || '1500' }}
        run: python research/modalities/emc_hypoxia_confounds.py --fetch-background

      # ⚠ SEPARATE STEP, ON PURPOSE. The background fetch is the expensive, failure-prone half (the
      # EST accession bridge); the clinical retrieval is minutes and hits entirely different hosts.
      # `if: always()` so a background failure cannot also destroy the retrieval — the two absent
      # readings are independent and must be closeable independently.
      - name: "Hypoxia confounds — clinical status of the three drug classes"
        if: always() && inputs.mode == 'hypoxia-confounds'
        timeout-minutes: 20
        run: python research/modalities/emc_hypoxia_confounds.py --fetch-therapeutic-status

      - name: "Hypoxia confounds — re-derive the audit with whatever landed"
        if: always() && inputs.mode == 'hypoxia-confounds'
        timeout-minutes: 20
        run: |
          python research/modalities/emc_hypoxia_confounds.py
          python -m pytest research/modalities/tests/test_emc_hypoxia_confounds.py -q

      - name: "Hypoxia confounds — upload"
        if: always() && inputs.mode == 'hypoxia-confounds'
        uses: actions/upload-artifact@v4
        with:
          name: emc-hypoxia-confounds
          if-no-files-found: warn
          path: |
            research/modalities/emc-hypoxia-confounds.json
            research/modalities/emc-hypoxia-null-background.json
            research/modalities/emc-hypoxia-therapeutic-status.json

      - name: Reproduce check — the derive half must be offline-reproducible from its inputs cache
        if: always() && steps.guard.outputs.part_b == 'true'
        timeout-minutes: 10
        run: |
          if [ "${{ inputs.mode }}" = "gse-series" ]; then
            python research/modalities/atr_hrd_sarcoma_series.py --check || echo "--check reported drift; non-blocking, but READ IT"
          else
            python research/modalities/emc_atr_vulnerability.py --check || echo "--check reported drift; non-blocking, but READ IT"
          fi

      # ⛔ `aso-junction` IS EXCLUDED FROM PUBLISHING BY DESIGN, NOT BY OVERSIGHT. See the header:
      # a freshly rebuilt panel must not land beside six files carrying retraction banners with
      # nothing in the directory to tell a reader which is which.
      # ✅ `panels` IS INCLUDED, also by design, and the header says why: it writes a new artifact
      # under a new name nothing has cited, and three lanes are waiting to consume it.
      - name: Publish the artifact and the inputs cache to the branch this run was dispatched from
        if: always() && github.ref_type == 'branch' && inputs.mode != 'aso-junction'
        timeout-minutes: 10
        env:
          BR: ${{ github.ref_name }}
        # ⛔ THIS STEP HAND-ROLLED `git pull --rebase` + push, AND `test_no_hand_rolled_publish` FAILED
        # ON IT — the guard that exists because that exact shape lost artifacts on three separate lanes
        # (GCP 30701290485, selcal 30710853581, step-1 30714482049). One conflict leaves the repo
        # MID-REBASE, every retry then dies on the wreckage of the first rather than on anything new,
        # and the loop ends with the step reporting SUCCESS having published nothing.
        #
        # ⚠ THE `if git diff --cached --quiet; then echo "no change"` BRANCH IS ALSO DROPPED ON PURPOSE.
        # The primitive publishes UNCONDITIONALLY so the commit timestamp keeps working as a heartbeat —
        # "nothing changed" and "the job never ran" are different facts, and a skipped commit makes them
        # render alike.
        run: |
          set -e
          # ⛔ ONE if/elif CHAIN, ONE ARM PER MODE. Rebuilt 2026-08-07 after a union merge of three
          # lanes left TWO unclosed `if` statements and a set of orphaned path lines dangling after a
          # closed quote — broken bash that YAML parses happily and that only fails at RUN time, on a
          # publish step, which is the worst place for it. Every arm below publishes exactly what its
          # own mode WRITES and nothing it merely READS; `test_emc_expression_datasets_workflow.py`
          # asserts that for hypoxia-confounds specifically, because that is the arm the merge broke.
          if [ "${{ inputs.mode }}" = "ret-cistrome" ] \
            || [ "${{ inputs.mode }}" = "ret-cistrome-zenodo" ] \
            || [ "${{ inputs.mode }}" = "ret-cistrome-named-geo" ]; then
            MSG="RET cistrome: NR4A1/2/3 ChIP-seq occupancy at the RET locus (CI)"
            PATHS="research/modalities/emc-ret-cistrome.json
                   research/modalities/emc-ret-cistrome-inputs.json"
          elif [ "${{ inputs.mode }}" = "ret-motif" ]; then
            MSG="RET motif scan + expression read: emc_ret_target_scan parts 1 and 2 (CI)"
            PATHS="research/modalities/emc-ret-target-scan.json
                   research/modalities/emc-ret-target-scan-inputs.json"
          elif [ "${{ inputs.mode }}" = "panels" ]; then
            MSG="EMC expression panels: targeted reads in the two readable series (CI)"
            PATHS="research/modalities/emc-expression-panels.json
                   research/modalities/emc-expression-panels-inputs.json"
          elif [ "${{ inputs.mode }}" = "fusion-targets" ]; then
            MSG="NR4A3/fusion direct-target set scored in the two readable EMC series (CI)"
            PATHS="research/modalities/nr4a3-fusion-targets.json
                   research/modalities/nr4a3-fusion-targets-inputs.json"
          elif [ "${{ inputs.mode }}" = "fusion-figures" ]; then
            # ⛔ THE ONLY ARM HERE THAT RE-VERIFIES BEFORE IT PUBLISHES, and the reason is this
            # step's own `if: always()`. A redraw that failed its check would otherwise still be
            # pushed, and a stamp that does not match the artifacts beside it is the exact false
            # provenance the stamp exists to prevent — worse than the drift, because it reads as
            # a measurement. Re-checking costs a stdlib hash of seven files.
            python research/modalities/nr4a3_fusion_targets_figures.py --check || {
              echo "::error title=FIGURES NOT PUBLISHED::the redraw did not leave the stamp matching its artifacts on disk; refusing to publish a provenance stamp that would assert a drawing that did not happen"
              exit 1
            }
            MSG="NR4A3 fusion-target figures redrawn and re-stamped from the committed artifacts (CI)"
            # Globs, not a typed list: the drawing owns which figures exist (`build()`), and a
            # restated list here would fall behind it silently the first time a figure is added.
            # `fig?-*` cannot reach the other families in this directory — mtap-prmt5-*, aso-*,
            # repurposing-*, portfolio-* — and each of those has its own provenance stamp.
            PATHS="research/manuscripts/figures/fig?-*.png
                   research/manuscripts/figures/fig?-*.pdf
                   research/manuscripts/figures/figure-provenance.json"
          elif [ "${{ inputs.mode }}" = "hypoxia-confounds" ]; then
            MSG="EMC hypoxia confound audit: genome-wide null + retrieved clinical status (CI)"
            PATHS="research/modalities/emc-hypoxia-confounds.json
                   research/modalities/emc-hypoxia-null-background.json
                   research/modalities/emc-hypoxia-therapeutic-status.json"
          elif [ "${{ inputs.mode }}" = "cohort-search" ]; then
            MSG="EMC cohort search: is there a fourth EMC expression cohort? (CI)"
            PATHS="research/modalities/emc-cohort-search.json
                   research/modalities/emc-cohort-search-inputs.json"
          elif [ "${{ inputs.mode }}" = "sra-study" ]; then
            MSG="EMC SRA study characterisation: PRJNA1357027 / SRP640302 (CI)"
            PATHS="research/modalities/emc-sra-study.json
                   research/modalities/emc-sra-study-inputs.json"
          elif [ "${{ inputs.mode }}" = "data-level-sweep" ]; then
            MSG="EMC data-level sweep: what carries EMC outside depositor prose (CI)"
            PATHS="research/modalities/emc-data-level-sweep.json
                   research/modalities/emc-data-level-sweep-inputs.json"
          elif [ "${{ inputs.mode }}" = "nuccore-sweep" ]; then
            MSG="NR4A3 fusion junctions from deposited sequence records (CI)"
            PATHS="research/modalities/nr4a3-nuccore-sweep.json
                   research/modalities/nr4a3-nuccore-sweep-inputs.json"
          elif [ "${{ inputs.mode }}" = "fusion-read-probe" ]; then
            MSG="NR4A3 fusion reads: what each deposit actually serves (CI)"
            PATHS="research/modalities/emc-fusion-read-scan-deposits.json"
          elif [ "${{ inputs.mode }}" = "fusion-read-scan" ]; then
            MSG="NR4A3 fusion breakpoints from deposited raw reads (CI)"
            PATHS="research/modalities/emc-fusion-read-scan.json
                   research/modalities/emc-fusion-read-scan-inputs.json"
          elif [ "${{ inputs.mode }}" = "aso-offtarget-expression" ]; then
            MSG="ASO off-target loci: GTEx exposure organs vs the tumour compartment (CI)"
            PATHS="research/modalities/aso-offtarget-tissue-expression.json
                   research/modalities/aso-offtarget-tissue-expression-inputs.json"
          elif [ "${{ inputs.mode }}" = "gse243553-eno3" ]; then
            MSG="GSE243553 recon: what the oncofusion scATAC deposit actually holds (CI)"
            PATHS="research/modalities/gse243553-eno3-overlap-recon.json
                   research/modalities/gse243553-eno3-overlap-arms.json
                   research/modalities/gse243553-eno3-overlap-supplement.json
                   research/modalities/gse243553-eno3-overlap.json"
          elif [ "${{ inputs.mode }}" = "gse28866" ]; then
            MSG="GSE28866 header read: is the tumour-vs-normal EMC deposit gene-indexed? (CI)"
            PATHS="research/modalities/gse28866-tumour-vs-normal.json"
          elif [ "${{ inputs.mode }}" = "gse-series" ]; then
            MSG="GEO series ${{ inputs.series || 'GSE299349' }}: sample-level characterisation (CI)"
            PATHS="research/modalities/atr-hrd-sarcoma-series.json
                   research/modalities/atr-hrd-sarcoma-series-inputs.json
                   research/modalities/atr-hrd-sarcoma-series-quant-inputs.json"
          else
            MSG="EMC expression dataset search + part B multi-series read (CI)"
            PATHS="research/modalities/emc-atr-vulnerability.json
                   research/modalities/emc-atr-vulnerability-inputs.json"
          fi
          # ⭐ THE ACCESSION CACHE RIDES WITH EVERY MODE, because every mode that reads a series
          # goes through the same probe->symbol bridge and any of them may have learned something.
          # It is the file that makes this job stop being a 33-minute job: the bridge is 30.8 of
          # those minutes, it resolves IMMUTABLE platforms and archival series, and without a home
          # on disk it was rebuilt from scratch every run. `_acc_cache_save` refuses to shrink it,
          # so a run degraded by a remote outage cannot delete what a better run learned.
          # ⚠ `publish_artifacts.sh` tolerates a path that does not exist, so a mode that never
          # touched the bridge simply publishes nothing extra.
          PATHS="$PATHS
                 research/modalities/accession-symbol-cache.json"
          bash research/compute/publish_artifacts.sh "$BR" "$MSG" $PATHS

      - name: "Summary — gse-series"
        if: always() && inputs.mode == 'gse-series'
        run: |
          python3 - <<'PY'
          import json
          d = json.load(open("research/modalities/atr-hrd-sarcoma-series.json"))
          print("SERIES:", d.get("series"), "| verdict:", d.get("verdict"))
          print("title:", (d.get("series_record") or {}).get("title"))
          print("samples parsed:", d.get("n_samples_parsed"),
                "| material:", d.get("material_type_counts"),
                "| assays:", d.get("assay_types"))
          print("processed matrix:", (d.get("processed_matrix") or {}).get("state"))
          for q in ("q1_atr_inhibitor_response_data", "q2_emc_or_nr4a3_sample",
                    "q3_selection_biomarker", "fet_fusion_status_recoverable"):
              if q in d:
                  print(f"{q}: {d[q]['answer']}")
          ic = d.get("emc_model_identity_check") or {}
          print("identity check:", ic.get("verdict") or ic.get("state"),
                "| controls:", (ic.get("instrument_controls") or {}).get("state"))
          PY

      - name: "Summary — aso-junction"
        if: always() && inputs.mode == 'aso-junction'
        run: |
          python3 - <<'PY'
          import json, os
          MOD = "research/modalities"
          a = json.load(open(f"{MOD}/junction-mrna-frame-audit.json"))
          print("TRANSCRIPTS:", json.dumps(a["transcripts"]))
          print("plausible NR4A3 resume range:", a["plausible_nr4a3_resume_range"])
          print("grade counts:", json.dumps(a["grade_counts"]))
          for r in a["rows"]:
              print(f"  {r['junction_label']:<24} {r.get('grade'):<19} "
                    f"resume_res={r.get('nr4a3_first_residue')} "
                    f"acceptor_5utr_nt={r.get('nr4a3_acceptor_exon_5utr_nt_retained')} "
                    f"in_frame={r.get('in_frame')} seam={r.get('junction_context_mRNA')}")
          p = f"{MOD}/junction-aso-regen-manifest.json"
          if os.path.exists(p):
              print("REGEN:", json.dumps(json.load(open(p)), indent=2))
          PY

      # ⭐ THE CONTROL BLOCK IS PRINTED FIRST AND IN FULL, ON PURPOSE. Six lanes will be read off
      # this artifact, and the only thing that makes any of them quotable is that the instrument
      # reproduced ENO3 — a reading already committed in emc-atr-vulnerability.json from these
      # same two matrices. A summary that led with the six results would invite reading them
      # before the thing that licenses them.
      - name: "Summary — panels"
        if: always() && inputs.mode == 'panels'
        run: |
          python3 - <<'PY'
          import json
          d = json.load(open("research/modalities/emc-expression-panels.json"))
          for mf, p in d["platforms"].items():
              if p.get("_status") != "read":
                  print(f"{mf}: NOT READ — {p.get('_status')}")
                  continue
              r = p["probe_mapping_rate"] or {}
              print(f"{mf} [{p['platform']}] n={p['n_samples']} EMC={p['n_EMC']} "
                    f"comp={p['n_comparator']} probe_rate={r.get('probe_level_rate')} "
                    f"acc_rate={r.get('accession_resolution_rate')} "
                    f"(prior acc {r.get('prior_accession_resolution_rate')}) — {r.get('reading')}")
              print(f"    classes: {p['class_counts']}")
              print(f"    genes measured: {p['n_wanted_genes_measured']}"
                    f"/{p['n_wanted_genes_requested']}  | values: {p['value_kind'][:60]}")
          print()
          print("=== INSTRUMENT CONTROLS — READ BEFORE ANYTHING ELSE ===")
          for g, per in d["reads"]["control"]["gene_readability"].items():
              for mf, r in per.items():
                  print(f"  {g:<7} {mf[:30]:<32} {r['verdict']}")
          print()
          print("=== THE SIX READS ===")
          for k, v in d["reads"].items():
              if k == "control":
                  continue
              rv = v["readability_verdict"]
              print(f"{k}: {rv['state']} — {rv['n_scored_units']} scored / "
                    f"{rv['n_unscored_units']} unscored")
          print()
          print("=== SIGNATURE SETS RESOLVED ===")
          for slot, s in d["signature_scores"].items():
              if not s.get("resolved"):
                  print(f"  {slot:<30} ⛔ NOT RETRIEVED")
                  continue
              print(f"  {slot:<30} {str(s.get('matched_term_verbatim'))[:60]} "
                    f"(n={s.get('n_genes')})")
              for mf, p in (s.get("per_platform") or {}).items():
                  print(f"      {mf[:30]:<32} {str(p.get('verdict'))[:150]}")
          print()
          print("=== HEADLINE GENES ===")
          for g in ("ASS1", "NR2F1", "NR2F2", "CSPG4", "CHST11", "CHST12", "CHST14", "CHST3",
                    "PAPSS1", "PAPSS2", "DLL3", "ASCL1", "NEUROD1", "INSM1", "HES1", "PPARG"):
              for mf, r in (d["gene_reads"].get(g) or {}).items():
                  print(f"  {g:<8} {mf[:30]:<32} {r.get('verdict')}")

          # ⛔ THE UNMEASURED BUCKET IS PRINTED FIRST, AND THAT ORDER IS THE POINT. Five routes
          # are blocked on "any measurement in EMC", so the temptation is to read the winners and
          # close the rest. A gene in NOT_READABLE_ON_EITHER_PLATFORM was not measured; nothing
          # here licenses a sentence about it (CLAUDE.md §4).
          board = ((d["reads"].get("read_7_SURFACE_ANTIGEN") or {})
                   .get("cross_platform_board") or {})
          if board:
              print()
              print(f"=== SURFACE-ANTIGEN BOARD ({board.get('n_genes')} genes) ===")
              order = ["NOT_READABLE_ON_EITHER_PLATFORM", "READABLE_ON_ONE_PLATFORM_ONLY",
                       "DISCORDANT_OPPOSITE_SIGNS", "MOVED_ON_ONE_FLAT_ON_THE_OTHER",
                       "FLAT_ON_BOTH", "CONCORDANT_DOWN_ON_BOTH", "CONCORDANT_UP_ON_BOTH"]
              bs = board.get("by_state") or {}
              for state in order + [s for s in bs if s not in order]:
                  if state not in bs:
                      continue
                  print(f"  {state:<34} ({len(bs[state]):>2}) {', '.join(bs[state])}")
              print("  ⛔ NOT_READABLE_* is an INSTRUMENT statement, never a biological negative.")
              print()
              for g in ("CD248", "CSPG4", "CD276", "SSTR2", "FAP", "PRAME", "B2M", "LRRC15"):
                  row = (board.get("per_gene") or {}).get(g) or {}
                  for mf, p in (row.get("per_platform") or {}).items():
                      print(f"  {g:<8} {mf[:30]:<32} {str(p.get('verdict'))[:160]}")

          import os
          nw = "research/modalities/emc-surface-normal-window.json"
          print()
          if not os.path.exists(nw):
              print("=== NORMAL-TISSUE WINDOW: ABSENT (the HPA step did not produce it). "
                    "⛔ An absent reading, NOT a finding of no normal-tissue liability. ===")
          else:
              w = json.load(open(nw))
              print("=== NORMAL-TISSUE WINDOW (HPA) — the axis the EMC contrast cannot supply ===")
              print("  self-validation:", json.dumps(w.get("self_validation", {}).get(
                  "positive_controls_restricted")), json.dumps(w.get(
                      "self_validation", {}).get("negative_control_broad")), json.dumps(w.get(
                          "self_validation", {}).get("hard_immune_control_must_not_be_restricted")))
              print("  drift vs previous:", json.dumps(w.get("_drift_vs_previous_artifact", {}).get(
                  "windows_that_changed")))
              for g, a in sorted((w.get("antigens") or {}).items()):
                  print(f"  {g:<10} {str(a.get('window') or a.get('_status')):<28} "
                        f"spec={str(a.get('rna_tissue_specificity'))[:24]:<24} "
                        f"blood={str(a.get('rna_blood_cell_specificity'))[:24]:<24} "
                        f"pm={a.get('plasma_membrane_confirmed')}")
          PY

      # ⭐ THE CONTROLS PRINT BEFORE THE LOCI, ON PURPOSE. A GCT is a wide tab matrix and a column
      # off-by-one produces an artifact whose numbers are internally consistent and completely
      # wrong, so ALB->Liver / UMOD->kidney / MYH7->muscle is the observation that separates a
      # correct parse from a shifted one. A locus table printed above its controls invites the
      # reader to believe it before knowing whether the instrument worked.
      # ⛔ AND THE UNREADABLE ROWS PRINT IN FULL rather than being filtered out of the table. A
      # locus this instrument cannot measure is the finding for that locus; dropping it would leave
      # a table in which every visible row has an answer, which reads as completeness.
      - name: "Summary — aso-offtarget-expression"
        if: always() && inputs.mode == 'aso-offtarget-expression'
        run: |
          python3 - <<'PY'
          import json
          d = json.load(open("research/modalities/aso-offtarget-tissue-expression.json"))
          # ⚠ `panel`, NOT `reagent`. This step read `d["reagent"]` after the artifact grew from one
          # reagent to a two-seam panel and the field was renamed; run 31749264339 published a
          # perfect 23-locus artifact and then went RED on `KeyError: 'reagent'` in this summary.
          # A reporting step that dies after the publish makes a successful run look like a failed
          # one, which is the mirror of the failure this repository actually fears.
          p = d["panel"]
          print("=== PANEL AND ITS LOAD (from the committed screens, not typed) ===")
          print(f"  seams {p['n_seams']} | loci {p['n_loci_over_the_whole_panel']} | "
                f"gap-paired hybridisable {p['n_gap_paired_hybridisable']}")
          for s in p["panel"]:
              print(f"    {s['seam']:<24} designs={s['n_designs']} "
                    f"gap-paired={s['n_gap_paired_hybridisable']} loci={s['n_loci']}")
              print(f"      role: {s.get('role')}")
          print()
          c = d["method"]["known_answer_controls"]
          print("=== DID THE INSTRUMENT WORK? (a shifted GCT looks entirely normal) ===")
          print(f"  ran={c['ran']} passed={c['passed']}")
          for g, v in sorted((c.get("controls") or {}).items()):
              print(f"    {g:<6} max={str(v.get('max_tissue')):<28} "
                    f"tpm={v.get('max_median_tpm')} passed={v.get('passed')}")
          print()
          print("=== ARMS ===")
          for k, v in d["method"]["arms"].items():
              print(f"  {k}: {json.dumps(v)[:300]}")
          print()
          print("=== PER LOCUS: EXPOSURE (liver/kidney) vs TUMOUR COMPARTMENT ===")
          for p in d["per_locus"]:
              sr = p["screen_records"]
              print(f"  {p['locus']:<14} records={str(sr['n_transcript_records']):<4}"
                    f"designs={str(p.get('n_designs_hitting_it')):<3} "
                    f"(curated {sr['n_curated_records']} / predicted "
                    f"{sr['n_predicted_records']})  ->  {p['tier']}")
              e = p["exposure_compartment_liver_kidney"]
              if e["readable"]:
                  print(f"       EXPOSURE  {json.dumps(e['values'])}")
              else:
                  print(f"       EXPOSURE  UNREADABLE — {e['reason'][:150]}")
              t = p["tumour_compartment_normal_tissue_proxy"]
              if t["readable"]:
                  print(f"       PROXY     {json.dumps(t['values'])}")
              else:
                  print(f"       PROXY     UNREADABLE — {t['reason'][:150]}")
              emc = p["tumour_compartment_emc_tumours"]
              for mf, s in (emc.get("per_series") or {}).items():
                  if s.get("readable"):
                      print(f"       EMC {mf[:26]:<26} pct={s.get('median_array_percentile')} "
                            f"probes={s.get('n_probes_mapping')} n={s.get('n_samples')}")
                  else:
                      print(f"       EMC {mf[:26]:<26} UNREADABLE — {str(s.get('reason'))[:110]}")
              w = p.get("whole_body_context")
              if w:
                  top = ", ".join(f"{x['tissue']}={x['median_tpm']:g}"
                                  for x in w["top_tissues"][:4])
                  print(f"       WHOLE BODY top: {top}")
              print(f"       {p['sentence']}")
              print()
          s = d["summary"]
          print("=== SUMMARY ===")
          print(f"  loci {s['n_loci']} | readable exposure reading "
                f"{s['n_loci_with_a_readable_exposure_reading']}")
          print(f"  expressed in an exposure organ: "
                f"{s['loci_expressed_in_an_exposure_organ']}")
          print(f"  unanswerable from public data: "
                f"{s['loci_whose_exposure_question_is_unanswerable_from_public_data']}")
          PY

      # ⭐ THE QUERIES PRINT BEFORE THE VERDICT, ON PURPOSE, AND SO DOES EVERY EXCLUSION. The
      # expected output of this mode is "no fourth cohort", and a negative is readable only if the
      # reader can see what was asked and why each candidate was thrown out. A headline with the
      # working hidden is indistinguishable from a search that never ran.
      - name: "Summary — cohort-search"
        if: always() && inputs.mode == 'cohort-search'
        run: |
          python3 - <<'PY'
          import json
          d = json.load(open("research/modalities/emc-cohort-search.json"))
          q = d["query_summary"]
          print("=== WHAT WAS ASKED ===")
          for r in d["queries"]:
              print(f"  [{r.get('_status'):>6}] geo_count={r.get('count_reported_by_geo')} "
                    f"returned={r.get('n_ids_returned')}  {r['term'][:90]}")
              print(f"           why: {r['why']}")
          print(f"  queries read {q['n_read']}/{q['n_queries']} | distinct series returned "
                f"{q['n_distinct_series_returned']}")
          print()
          print("=== EVERY CANDIDATE AND WHY IT DID OR DID NOT COUNT ===")
          for acc, c in sorted(d["candidates"].items(), key=lambda kv: kv[1]["grade"]):
              print(f"  {acc:<12} {c['grade']:<30} n={c.get('n_samples')} "
                    f"emc_samples={c.get('n_samples_naming_emc')} "
                    f"overlap={c.get('n_gsm_overlapping_a_known_cohort')}")
              print(f"      {str(c.get('title'))[:110]}")
              for r in (c.get("excluded_because") or []):
                  print(f"      - {r}")
          v = d["verdict"]
          print()
          print("=== VERDICT ===")
          print(" ", v["headline"])
          print("  new fourth cohorts:", v["new_fourth_cohorts"] or "none")
          if v.get("⚠ incomplete"):
              print(" ", v["⚠ incomplete"])
          print(" ", v["⛔ scope"])
          PY

      # ⭐ THE CONTROLS PRINT BEFORE THE VERDICT, ON PURPOSE, AND THE VERDICT IS MEANINGLESS
      # WITHOUT THEM. This mode's headline is "the accession does/does not exist", and NCBI 403s
      # to CONNECT from the dev sandbox — a proxy refusal, a rate-limit and a genuinely absent
      # record all arrive as "no records". A reader who cannot see that the two known-real
      # accessions came back and the known-absent one did not has no way to tell an absence from
      # an outage.
      - name: "Summary — sra-study"
        if: always() && inputs.mode == 'sra-study'
        run: |
          python3 - <<'PY'
          import json
          d = json.load(open("research/modalities/emc-sra-study.json"))
          print("=== TRANSPORT CONTROLS (the verdict is gated on these) ===")
          for k, c in d["transport_controls"].items():
              print(f"  [{'PASS' if c['passed'] else 'FAIL'}] {k:<22} {c['accession']:<14} "
                    f"expect={c['expect']:<8} ncbi_bioproject={c['ncbi_bioproject_count']} "
                    f"ncbi_sra={c['ncbi_sra_count']} ena_runs={c['ena_read_run_rows']}")
              if c.get("⛔ meaning"):
                  print(f"        {c['⛔ meaning']}")
          print("  gate passed:", d["transport_gate_passed"])
          print()
          print("=== WHAT EACH ACCESSION RETURNED ===")
          for acc, t in d["targets"].items():
              n, e = t["ncbi"], t["ena"]
              print(f"  {acc}: resolved={d['resolved'].get(acc)}")
              print(f"      ncbi  bioproject={n['bioproject_esearch_count']}"
                    f"({n['bioproject_status']}) sra={n['sra_esearch_count']}"
                    f"({n['sra_status']}) biosample={n['biosample_esearch_count']}"
                    f"({n['biosample_status']})")
              print(f"      ena   read_run_rows={e['n_read_run_rows']}({e['read_run_status']}) "
                    f"sample_rows={e['n_sample_rows']}({e['sample_status']})")
              for ttl in (n.get("bioproject_records") or [])[:3]:
                  print(f"      title: {str(ttl.get('project_title'))[:120]}")
              for ttl in (e.get("xml_titles") or [])[:3]:
                  print(f"      ena title: {str(ttl)[:120]}")
              r = t.get("runs") or {}
              if r:
                  print(f"      runs={r['n_runs']} experiments={r['n_distinct_experiments']} "
                        f"samples={r['n_distinct_samples']}  ⚠ these are different numbers")
                  print(f"      strategy={r['library_strategy_values']} "
                        f"selection={r['library_selection_values']} "
                        f"platform={r['instrument_platform_values']}")
                  print(f"      first_public={r['first_public_values']}")
                  print(f"      sample titles: {r['sample_titles'][:12]}")
                  for name, p in (r.get("assay_probes") or {}).items():
                      if p.get("matched"):
                          print(f"      assay probe {name}: matched {p['matched_text']!r}")
              x = t.get("ncbi_sra_xml") or {}
              if x.get("_parsed"):
                  print(f"      ncbi xml: packages={x.get('n_experiment_packages')} "
                        f"runs={x.get('n_runs')} samples={x.get('n_distinct_samples')} "
                        f"strategy={x.get('library_strategy_values')}")
                  for blob in (x.get("sample_attribute_blobs") or [])[:25]:
                      print(f"        attr {blob[:110]}")
              a = t.get("data_availability") or {}
              if a:
                  print(f"      DATA: {a['state']} "
                        f"runs_with_fastq={a['n_runs_with_fastq_ftp']} "
                        f"bytes={a['total_fastq_bytes']}")
              em = t.get("emc_evidence") or {}
              print(f"      EMC: study_prose={em.get('study_level_prose_names_emc')} "
                    f"({em.get('study_level_matched_text')!r}) "
                    f"sample_blobs_read={em.get('n_sample_blobs_read')} "
                    f"strict_hits={em.get('n_sample_blobs_naming_emc_strict')}")
          print()
          print("=== PAIRING CLAIM ===", d["pairing_check"])
          v = d["verdict"]
          print()
          print("=== VERDICT ===")
          print(" ", v["grade"])
          print(" ", v["headline"])
          print(" ", v["⛔ scope"])
      # ⭐ THE FILE LIST PRINTS IN FULL. The whole value of this mode is "what is ACTUALLY
      # deposited", and a summary that prints a verdict instead of the filenames would be exactly
      # the shape that made GSE243553 invisible to a year of NR4A3-keyed queries.
      - name: "Summary — gse243553-eno3"
        if: always() && inputs.mode == 'gse243553-eno3'
        run: |
          python3 - <<'PY'
          import json, os
          p = "research/modalities/gse243553-eno3-overlap-recon.json"
          if not os.path.exists(p):
              print("no recon artifact — the fetch step did not complete"); raise SystemExit(0)
          d = json.load(open(p))
          e = d["eno3_nbre_sites"]
          print("=== THE COORDINATES BEING ASKED ABOUT (derived, not typed) ===")
          print(f"  {e['gene']} {e['assembly']} {e['chrom']} TSS {e['tss']} "
                f"strand {e['gene_strand_derived']} | window {e['window']}")
          for s in e["sites"]:
              print(f"    {s['chrom']}:{s['start']}-{s['end']} ({s['strand_of_motif']}) "
                    f"offset {s['offset_from_tss']:+d}")
          print()
          print("=== WHAT GEO ACTUALLY HOLDS ===")
          print(f"  samples parsed: {d['n_samples_parsed']}")
          print(f"  series-level supplementary files: {d['series_supplementary_files']}")
          seen = {}
          for gsm, r in d["per_sample_supplementary_files"].items():
              for f in r.get("files", []):
                  seen.setdefault(f.split("_", 1)[-1], []).append(gsm)
          for shape, gsms in sorted(seen.items()):
              print(f"    {shape}  x{len(gsms)}  e.g. {gsms[0]}")
          print(f"  peak-call-shaped filenames: {d['filenames_matching_a_peak_call_pattern']}")
          print(f"  deposit_supports_a_peak_overlap: {d['deposit_supports_a_peak_overlap']}")
          print()
          print("=== GENOME BUILD, FROM THE DEPOSIT'S OWN WORDS ===")
          print(f"  token counts: {d['genome_build']['token_counts']}")
          for ln in d["genome_build"]["data_processing_lines"]:
              print(f"    {ln[:200]}")
          print()
          print("=== FETCHES ===")
          for k, r in sorted(d["fetches"].items()):
              print(f"  [{r['state']:>16}] http={r['http']} {r['bytes']:>9}B  {k}")
          print()
          a = "research/modalities/gse243553-eno3-overlap-arms.json"
          if os.path.exists(a):
              A = json.load(open(a))
              print("=== EVERY DEPOSITED FILE, SIZE MEASURED ===")
              for fn, s in sorted(A["file_sizes_bytes"].items()):
                  print(f"  {s['content_length'] if s['content_length'] is not None else 'UNREAD':>14}  {fn}")
              print(f"  TOTAL {A['total_deposited_bytes']:,} B "
                    f"(fragments {A['fragment_bytes']:,} B)")
              print()
              print("=== THE NR4A3 ARMS, READ FROM THE DEPOSITED BARCODE->VARIANT MAPS ===")
              print("  ", A["arms"]["_what_is_counted"])
              for arm, n in sorted(A["arms"]["barcode_counts_by_arm"].items()):
                  print(f"    {arm:<42} {n}")
              print("  ⛔", A["arms"]["⛔_not_the_same_quantity_as_the_papers_nuclei_count"])
              print()
              print("=== IS THERE A PEAK TABLE IN THE PAPER'S SUPPLEMENT? ===")
              print("  ", A["supplementary_table_search"]["europepmc_zip_members"])
              print()
          sp = "research/modalities/gse243553-eno3-overlap-supplement.json"
          if os.path.exists(sp):
              S = json.load(open(sp))
              print("=== THE PAPER'S SUPPLEMENTARY FILES ===")
              # ⚠ EVERY VALUE HERE IS A LIST OF ATTEMPTS, not one record. This printer was written
              # against the single-record shape and failed the run when the retry loop was added.
              for fn, attempts in sorted(S["fetches"].items()):
                  for r in (attempts if isinstance(attempts, list) else [attempts]):
                      if r["state"] == "not_retrieved" and fn.startswith("SPRINGER::"):
                          continue
                      print(f"  [{str(r['state']):>20}] http={r['http']} "
                            f"{r['bytes']:>10}B  {fn}")
              for fn, c in sorted(S["contents"].items()):
                  print(f"  -- {fn} [{c.get('kind')}]")
                  for m in (c.get("members") or [])[:60]:
                      print(f"       {m['size']:>12}  {m['name']}")
                  for sheet, s in (c.get("sheets") or {}).items():
                      print(f"       sheet {sheet!r}: {s['n_rows']} rows")
                      for row in s["first_rows"][:2]:
                          print(f"          {row}")
              print()

          op = "research/modalities/gse243553-eno3-overlap.json"
          if os.path.exists(op):
              O = json.load(open(op))
              print("=== THE ANSWER ===")
              print("  build:", O["genome_build"])
              print("  flank:", O["flank_bp"], "| seed:", O["seed"],
                    "| null draws:", O["n_null_draws"])
              rows = [(n, r) for n, r in O["per_peakset"].items()]
              rows.sort(key=lambda kv: (kv[1]["arm"] is None, kv[0]))
              for n, r in rows:
                  if r["arm"] is None and not r["ENO3"]["n_of_4_nbre_sites_covered"]:
                      continue
                  print(f"  {n}")
                  print(f"      arm={r['arm']} intervals={r['n_intervals']} "
                        f"median_width={r['median_interval_width_bp']} "
                        f"informative={r['informative']}")
                  print(f"      ENO3 NBRE sites covered: "
                        f"{r['ENO3']['n_of_4_nbre_sites_covered']}/4 | promoter-window intervals "
                        f"{r['ENO3']['n_intervals_in_promoter_window']}")
                  for h in r["ENO3"]["per_site"]:
                      print(f"        {h['site']} {h['motif']} ({h['offset_from_tss']:+d}) -> "
                            f"{h['n_peaks_overlapping']} {h['overlapping_peaks'][:3]}")
                  for k, nl in r["nulls"].items():
                      if k.startswith("_"):
                          continue
                      print(f"        null {k}: p={nl['empirical_p']} "
                            f"({nl['n_at_or_above_observed']}/{nl['n']})")
              print()
              for c in O["⛔_two_constraints_that_travel_with_every_number_here"]:
                  print("  ⛔", c)
              print()
          for c in d["_constraints_that_travel_with_every_result"]:
              print("  ⛔", c)
          PY

      # ⭐ THE BUILD AND THE POSITIVE CONTROLS PRINT BEFORE THE RESULT, ON PURPOSE. A RET peak
      # count read without knowing (a) which genome build the locus was taken on and (b) whether
      # the peak set recovers a locus a published chromatin experiment already placed NR4A3 at, is
      # a number nobody can grade — and a null from an instrument that recovers no positive
      # control is not a negative at all.
      - name: "Summary — ret-cistrome"
        if: always() && (inputs.mode == 'ret-cistrome' || inputs.mode == 'ret-cistrome-zenodo' || inputs.mode == 'ret-cistrome-named-geo')
        run: |
          python3 - <<'PY'
          import json
          d = json.load(open("research/modalities/emc-ret-cistrome.json"))
          b = d.get("part_0_genome_build") or {}
          print("=== GENOME BUILD — READ THIS FIRST ===")
          for build, r in (b.get("per_build") or {}).items():
              g = r.get("RET_ensembl") or {}
              print(f"  {build}: expected {r.get('ensembl_assembly_expected')} | RET "
                    f"{g.get('chrom')}:{g.get('start')}-{g.get('end')} strand {g.get('strand')} "
                    f"| assembly returned {g.get('assembly_name')} | {r.get('_status')}")
          print("  chr10 hg19-hg38 offset at RET start:",
                b.get("chr10_offset_hg19_minus_hg38_at_RET_start"))
          print("  two sources agree within 50 kb on every build:",
                b.get("RET_two_sources_agree_within_50kb_on_every_build"))
          p1 = d.get("part_1_datasets") or {}
          ca = p1.get("chip_atlas") or {}
          print()
          print("=== DATASETS FOUND (characterised before use) ===")
          print("  ChIP-Atlas:", ca.get("_status"), "| searched",
                ca.get("n_experiments_searched"), "experiments | matching",
                ca.get("n_matching"))
          for k, v in sorted((ca.get("by_antigen_and_genome") or {}).items()):
              print(f"    {k}: {len(v)} experiment(s) — {v[:8]}")
          geo = p1.get("geo") or {}
          print("  GEO:", geo.get("_status"), "| series", geo.get("n_series"))
          for acc, s in sorted((geo.get("series") or {}).items())[:20]:
              print(f"    {acc} [{s.get('taxon')}] n={s.get('n_samples')} {s.get('gdsType')} "
                    f"— {str(s.get('title'))[:90]}")
          for pmcid, r in (p1.get("paper_data_availability") or {}).get("papers", {}).items():
              fa = (r.get("fulltext_accession_scan") or {}).get("accessions_found")
              xr = ((r.get("europepmc") or {}).get("db_cross_references"))
              print(f"    {pmcid}: fulltext accessions {fa} | EuropePMC xrefs {xr}")
          print()
          print("=== POSITIVE CONTROLS, THEN RET ===")
          p2 = d.get("part_2_intersection") or {}
          print("  part 2:", p2.get("_status"))
          for r in ((p2.get("ret_summary") or {}).get("rows") or []):
              print(f"  {str(r['peakset'])[:26]:<28} {str(r['antigen']):<6} "
                    f"{str(r['genome']):<5} peaks={r['n_peaks_total']:<7} "
                    f"RET_prom={r['RET_promoter_window_peaks']} "
                    f"RET_body={r['RET_genebody_window_peaks']} "
                    f"nearest={r['RET_nearest_peak_to_tss_bp']} "
                    f"p_vs_bg={r['empirical_p_vs_background']} | {r['positive_control']} "
                    f"| {str(r['cell_type'])[:40]}")
          rs = p2.get("ret_summary") or {}
          print("  peaksets:", rs.get("n_peaksets"),
                "| with a RET promoter peak:", rs.get("n_with_a_RET_promoter_peak"),
                "| whose null is interpretable:",
                rs.get("n_peaksets_whose_null_is_interpretable"))
          p3 = d.get("part_3_paralogue_overlap") or {}
          print()
          print("=== PARALOGUE OVERLAP ===")
          print("  state:", p3.get("state"))
          for ag, r in (p3.get("at_RET") or {}).items():
              print(f"    {ag}: {r.get('n_peaksets')} peakset(s), any RET promoter peak: "
                    f"{r.get('any_promoter_peak_at_RET')}")
          for k, v in (p3.get("genome_wide_pairwise_sharing") or {}).items():
              print(f"    {k}: {json.dumps(v)[:220]}")
          print()
          print("=== VERDICT ===")
          print(json.dumps(d.get("verdict"), indent=1))
          PY

      - name: "Summary — ret-motif"
        if: always() && inputs.mode == 'ret-motif'
        run: |
          python3 - <<'PY'
          import json
          d = json.load(open("research/modalities/emc-ret-target-scan.json"))
          p1 = d.get("part_1_nbre_scan") or {}
          print("PART 1 (motif):", p1.get("_status"), "| windows read:", p1.get("n_windows_read"),
                "of", p1.get("n_windows_requested"))
          print("  verdict:", json.dumps(p1.get("verdict"))[:900])
          for g, r in sorted((p1.get("per_gene") or {}).items())[:20]:
              print(f"   {g:<8} {json.dumps(r)[:200]}")
          p2 = d.get("part_2_expression") or {}
          print("PART 2 (expression):", p2.get("_status"))
          print("  verdict:", json.dumps(p2.get("verdict"))[:900])
          PY

      # ⭐ THE CONTROLS PRINT FIRST AND THE RAW DELTAS PRINT LAST. A reader who stops after two
      # screens must have seen whether the instrument reproduced its known answers and how big the
      # platform's global offset is, BEFORE seeing any "HIGHER in EMC" number.
      - name: "Summary — fusion-targets"
        if: always() && inputs.mode == 'fusion-targets'
        run: |
          python3 - <<'PY'
          import json
          d = json.load(open("research/modalities/nr4a3-fusion-targets.json"))
          c = d["controls"]
          print("=" * 96)
          print("INSTRUMENT CONTROLS — read these before any number below")
          for name, chk in c["checks"].items():
              p = chk.get("pass")
              tag = "PASS" if p is True else ("FAIL" if p is False else "NOT-GRADED")
              print(f"  {tag:<10} {name}")
              for mf, m in (chk.get("per_platform") or {}).items():
                  print(f"        {mf[:28]:30s} {m.get('state'):<15} delta={m.get('delta')} "
                        f"t={m.get('t')} {(m.get('why') or '')[:80]}")
          print(" ->", c.get("_reading"))
          print("-" * 96)
          for mf, p in d["platforms"].items():
              if p.get("_status") != "read":
                  print(f"{mf}: {p.get('_status')}")
                  continue
              go = p.get("global_offset") or {}
              print(f"{p['gse']}/{p['platform']}  EMC={p['n_EMC']} comp={p['n_comparator']} "
                    f"symbols={p.get('n_distinct_symbols_on_platform')} "
                    f"null_pool={(p.get('null_pool_spec') or {}).get('drawn')}")
              print("   GLOBAL OFFSET:", go.get("reading") or go.get("why"))
              print("   probe mapping:", (p.get("probe_mapping") or {}).get("reading"))
          print("-" * 96)
          print("CIRCULARITY:", d["circularity_reading"].get("verdict"))
          print("-" * 96)
          for name, per in d["set_scores"].items():
              print(name)
              for mf, r in per.items():
                  print(f"   {mf[:28]:30s} {str(r.get('verdict'))[:200]}")
          print("-" * 96)
          print("PER-GENE, evidence-typed:")
          rows = {r["gene"]: r for r in d["evidence_table"]["rows"]}
          for g, per in sorted(d["gene_reads"].items()):
              if g not in rows:
                  continue
              cls = rows[g]["evidence_class"]
              exp = rows[g]["expected_direction_in_EMC"]
              bits = []
              for mf, r in per.items():
                  if not r.get("readable"):
                      bits.append(f"{mf[:12]}=NOT_READABLE")
                      continue
                  w = r.get("welch_EMC_vs_comparator") or {}
                  nc = r.get("null_calibration") or {}
                  bits.append(f"{mf[:12]}: d={w.get('delta_a_minus_b')} t={w.get('t')} "
                              f"p_emp={nc.get('p_empirical_two_sided')}")
              print(f"  {g:<10} [{cls:<26}] expect={exp:<32} " + " | ".join(bits))
          PY

      - name: "Summary — part-b"
        if: always() && steps.guard.outputs.part_b == 'true'
        run: |
          python3 - <<'PY'
          import json
          d = json.load(open("research/modalities/emc-atr-vulnerability.json"))
          b = d["part_b_emc_tumour_signature"]
          print("TIER:", d["grading"]["tier"])
          print("PART B:", b.get("verdict"), "| series used:", b.get("series_carrying_the_verdict"))
          print("readable platforms anywhere:", b.get("readable_platforms_in_ANY_series"))
          for s, r in sorted((b.get("series_readability") or {}).items()):
              print(f"  {s}: EMC={r['n_EMC']} comp={r['n_comparator']} "
                    f"scored_concepts={r['max_scored_concepts_on_one_platform']} "
                    f"readable={len(r['readable_platforms'])}")
          PY

      # ⭐ THE ONLY TUMOUR-vs-NORMAL EMC ARM REACHABLE AT $0. Every other contrast this repo holds is
      # EMC vs OTHER SARCOMAS, which cannot speak to on-target/off-tumour exposure because that is a
      # statement about NORMAL tissue. GSE28866 carries 4 named EMC libraries beside 27 normals.
      # ⚠ A HEADER READ, deliberately scoped: whether the 3SEQ peak tables carry a gene-symbol column
      # decides whether this is a parse or a coordinate-mapping project, and the module refuses to
      # guess between them.
      - name: GSE28866 — is the only tumour-vs-normal EMC deposit gene-indexed?
        if: ${{ inputs.mode == 'gse28866' }}
        run: cd research/modalities && python3 gse28866_tumour_vs_normal.py
      - name: Publish the GSE28866 header read
        if: ${{ inputs.mode == 'gse28866' }}
        env:
          PUBLISH_IF_CHANGED: "1"
        run: |
          bash research/compute/publish_artifacts.sh "${{ github.ref_name }}" \
            "GSE28866 header read: is the tumour-vs-normal EMC deposit gene-indexed? (CI, $0)" \
            research/modalities/gse28866-tumour-vs-normal.json
