name: GCP GPU — Ternary cooperativity FEP on L4 (valB_mini PROTAC 2->cis; WIF keyless)

# The GCP port of the ternary-cooperativity FEP (nr4a3_ternary_fep.py) for the reviewer-approved valB_mini edge
# Wurz compound 1 -> compound 4 (SMARCA2-VHL, staged from 8G1Q; linker pyridine->benzene; ddG_coop_exp=+0.94
# kcal/mol, alpha_SPR). Reuses gpu-rbfe-gcp.yml's proven machinery (WIF auth, zone-fallback Spot L4 create,
# Miniforge+mamba CUDA openmm, env-cache, serial-console reporting, unconditional teardown). The VM SELF-STAGES
# the leg from 8G1Q (ternary_pdb_stage.py; unrestricted internet) INCLUDING the mandated SMARCA4->SMARCA2 model
# substitution+relax, so there is NO S3/GCS input dependency for the smoke.
#
#   mode=smoke : env solve + 8G1Q stage (+SMARCA4->SMARCA2 relax) + ternary assembly + atom-map + hybrid-topology
#                build + the 5-part $0 gate (NO MD). Minutes,
#                ~$1-2. The FIRST-EVER GPU run of the ternary assembly. Runs one leg (default the ternary leg).
#   mode=run   : full 5ns sampling for ONE leg x ONE replica (leg_id + seed), spot-safe re-dispatch, result->GCS.
#                The valB_mini bundle = {binary_vhl, ternary_smarca2} x {solvent} x SEED 0/1/2 (prereg >=3 reps).
#   mode=reduce: CPU — ddG_coop = ternary - binary + replicate-SD + compare to +1.71; cis-endpoint diagnostics.
# NEW workflow -> not API-dispatchable from a feature branch until on the default branch; the smoke auto-runs on
# PUSH (paths = this file + the engine/stager). The paid mode=run needs workflow_dispatch (once on main) or a
# push with run=1 marker.

on:
  workflow_dispatch:
    inputs:
      mode:        { description: "smoke | run | reduce | calibchem (CPU/runner-only: fetch the Ciulli P-series ligand chemistry from RCSB + RDKit MCS mappability/charge check - the $0 blocker on the valB calibrator rescope; $0, no VM) | converge (CPU/runner-only: the reviewer's required-change-#1 convergence analysis of the committed .nc for ALL THREE legs of the cycle — MBAR overlap matrix + bottleneck, dG(t) plateau, fwd/rev, replica mixing, N_eff, structural drift; writes ternary_convergence.json beside the leg results so the reducer's diagnostics_ok stops defaulting to True. $0, no VM) | provenance (CPU/runner-only, $0, NO VM: prints what SYSTEM each landed leg actually ran -- setup version from its own recorded cache_dir, n_particles, protocol_hash -- plus any restraint reports. Use it to SETTLE comparability from the artifact instead of inferring a leg's setup version from the ABSENCE of a cache directory, which is not a measurement and is audit J.2-J.5's exact defect. Warns if the legs that would be combined into one cycle disagree.) | tail | forensic (CPU/runner-only: open the newest committed (.nc,.chk) production generations with openmmtools + print checkpoint_interval / analysis-vs-checkpoint last iteration / torn-pair flag — confirms the interval-mismatch root cause, $0, no VM) | preequil (plain-MD relax the physical complex -> preequilcache, then run RBFE with use_preequil=1) | endpoint_smoke (exact-Hamiltonian physical-endpoint stability test per ligand, reviewer condition 2/3 step 3)", default: "smoke", required: true }
      preequil_smoke: { description: "1 = PREEQUIL_SMOKE (system-build + 200-step relax sanity, no full ns) for mode=preequil", default: "0", required: false }
      preequil_ns: { description: "production ns after restrained relaxation for mode=preequil", default: "0.5", required: false }
      use_preequil: { description: "1 = for mode=run, restore the pre-equilibrated (relaxed) complex.pdb/ligands.sdf from preequilcache instead of the raw stage cache, and use a pre-equil-keyed setup cache. Requires a prior mode=preequil run.", default: "0", required: false }
      leg_id:      { description: "leg to run", default: "calib_hi_to_lo__ternary_vhl", required: false }
      seed:        { description: "replica seed (run: 0/1/2)", default: "0", required: false }
      direction:   { description: "fwd (default) | rev — DIRECTION=rev swaps ligand A/B to run the B->A alchemical leg, giving the preregistered forward/reverse ANTISYMMETRY check |dG_fwd + dG_rev| (frozen decision rule: hysteresis <= 1.0). The engine has supported this since it was written; the workflow hardcoded DIRECTION=fwd, so it was unreachable. NB the commit prefix gains a _dir<rev> suffix so a rev leg can never resume the fwd trajectory; the setup cache is already direction-keyed via tag=<leg>_<dir>_r<seed>.", default: "fwd", required: false }
      n_windows:   { description: "lambda windows", default: "12", required: false }
      template_pdb: { description: "crystal template (Wurz 8G1Q for valB_mini cmpd1->cmpd4)", default: "8G1Q", required: false }
      zone:        { description: "GCE zone", default: "us-central1-a", required: false }
      restrain:    { description: "1 = apply the FLAT-BOTTOM POCKET RESTRAINT (RBFE_RESTRAIN; ternary_restraint.py). Default 0 = every existing lane byte-identical. For the BINARY arm re-run: its ligand left the pocket in 8 of 12 replicas in BOTH cycles (audit L.3a-L.3d), so dG_binary was not a free energy of the bound state. The restraint is zero inside a 0.30 nm well around the STARTING contact-centroid separation and lambda-INDEPENDENT, so it cancels from dG(A->B) and needs NO standard-state correction (this is RBFE, not ABFE - the ligand is never decoupled). *** IT CHANGES THE HAMILTONIAN, so it KEYS THE COMMIT PREFIX (_rst) and the system fingerprint: a restrained leg can never resume an unrestrained trajectory, and vice versa. ***", default: "0", required: false }
      detach:      { description: "1 = launch VM + exit (multi-hour real legs; monitor via gpu-rbfe-gcp-tail vm=gcp-ternary-<runid>). Auto-on for mode=run", default: "0", required: false }
      charge_method: { description: "nagl (openff-nagl ML charges, fast; has a warm CPU-primed setup cache — DEFAULT, matches all existing valB legs) | am1bcc (field standard but SLOW on big PROTACs via AmberTools sqm AND has no primed cache -> ~40 min GPU-idle setup; if you need am1bcc, run ternary-setup-prime-cpu.yml charge_method=am1bcc FIRST so the GPU restores the cache instead of re-parameterizing). MUST match across all valB legs.", default: "nagl", required: false }
      timestep_fs: { description: "MD timestep (fs). CORRECTED 2026-07-19: OpenFE leaves the WHOLE alchemical ligand's C-H unconstrained (not just morphing bonds), so the ceiling is a LANE property, not edge chemistry: large ternary assemblies NaN at 4.0 (calib) and run at 2.0; binary warhead RBFE runs at 4.0. With constrain_ligand_ch=1 a larger dt (try 3.0/4.0) may become stable. See ternary-rbfe-runbook.md 1b.", default: "2.0", required: false }
      warmup_timestep_fs: { description: "MD timestep (fs) for the DISCARDED equilibration/warmup only; production runs at timestep_fs. Set smaller than timestep_fs (e.g. 1.5) to survive a rough ternary warmup while producing at the larger dt — equilibration never enters ΔG, so this does not affect the result. Empty = warmup uses the production dt. Keyed into the commit prefix.", default: "", required: false }
      warmup_iters: { description: "override warmup iteration count (RBFE_WARMUP_ITERS). Empty = derive from equilibration_length. Use a small value (e.g. 100) with a reduced warmup_timestep_fs so the reduced-dt relax is short, or for a fast timestep-feasibility test.", default: "", required: false }
      prod_iters: { description: "override production iteration count (RBFE_PROD_ITERS). Empty = full science length. Use a small value (e.g. 120) for a fast timestep-feasibility test (does production survive at timestep_fs).", default: "", required: false }
      provisioning: { description: "spot (default; ~60-90% cheaper, standing rule: wait out capacity) | standard (on-demand; skips the spot-capacity wait). Use 'standard' ONLY when explicitly authorized for a time-sensitive one-off, e.g. confirming a single valB leg.", default: "spot", required: false }
      commit_salt: { description: "Optional suffix appended to the spot commit-store prefix, forcing a FRESH run that does NOT resume prior checkpoints. Use when a code change alters warmup/production behavior but the (dt,clig,wu) prefix would otherwise collide with poisoned checkpoints (e.g. a broken earlier warmup-override attempt wrote to the same wu-keyed prefix). Empty = normal resume.", default: "", required: false }
      refuse_if_vm_live: { description: "FAILOVER GUARD (default 0). When 1, the launcher REFUSES to provision if any gcp-ternary-* VM is already alive, and exits 0 as a no-op. Used to poll an on-demand RESUME safely: while a spot VM holds the single GPU the resume is a fast no-op; the moment spot is killed (GPU freed) the next dispatch provisions and resumes the same-salt checkpoint. Prevents two VMs ever writing one commit prefix, independent of the GPU quota.", default: "0", required: false }
      allow_gpu_setup_build: { description: "Escape hatch (default 0). By default a GPU run FAILS FAST if the setup cache for its (leg,charge) is missing, forcing you to CPU-prime it first (ternary-setup-prime-cpu.yml) instead of burning ~8-40 min of GPU-idle re-parameterization. Set 1 only for a deliberate GPU-side build (the very first prime of a brand-new leg/charge). Sets RBFE_REQUIRE_PRIMED_SETUP=0.", default: "0", required: false }
      min_steps: { description: "L-BFGS minimization steps per replica before warmup (RBFE_MIN_STEPS). Default 5000 (OpenFE standard). Was 25000 which minimizes 12 replicas of the 146k-atom system for ~20-60 min at ~0% GPU for NO NaN benefit (the code comment confirms the NaN survives 25000 steps; the 1 fs warmup is what fixes NaNs). Only raise if a specific system genuinely needs it.", default: "5000", required: false }
      reset_commits: { description: "1 = wipe this leg/seed's committed checkpoints before running (fresh start — use when changing timestep so a new-dt run does not resume a stale-dt trajectory).", default: "0", required: false }
      force_rerun: { description: "1 = bypass the idempotent-skip even if a completed leg result JSON already exists in GCS (the run overwrites it). Use when the pipeline changed (e.g. new pre-equil version) and the old result is stale. Pair with a fresh commit_salt so it does not resume stale checkpoints.", default: "0", required: false }
      autostop_convergence: { description: "1 = STOP production early once the committed trajectory converges (connected MBAR overlap + dG(t) plateau, reviewer condition 4), capped at the 5 ns production_length. Default 0 (run the full cap). Conservative: only checks after RBFE_AUTOSTOP_MIN_FRAC (0.4) of the cap and never stops without real evidence.", default: "0", required: false }
  # NO push trigger: with GPUS_ALL_REGIONS=1 an auto-smoke on every ternary-file edit STEALS the single GPU from
  # the real serial leg (that is exactly what blocked seed-0 on 2026-07-17 — a push-smoke VM held the quota while
  # the mode=run launcher got 'quota exceeded' for 25 min). The CPU validator (smarca2-model-validate.yml) covers
  # these files for $0; a GPU smoke is dispatched by hand (workflow_dispatch) only when actually wanted.

permissions:
  id-token: write
  contents: write
  actions: write   # so a detached launch can ARM ternary-leg-watchdog.yml immediately instead of waiting on
                   # the cron. CLAUDE.md §6: a schedule is a request, not a cadence — measured gaps on this
                   # repo's */15 watchdog were 125-222 min, which is 125-222 min of a billing VM nobody is
                   # looking at. The dispatch is best-effort and never fails the launch.

concurrency:
  group: gcp-gpu-ternary-${{ github.event.inputs.mode || 'smoke' }}
  cancel-in-progress: false

jobs:
  gcp-ternary:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      ZONE: ${{ github.event.inputs.zone || 'us-central1-a' }}
      MODE: ${{ github.event.inputs.mode || 'smoke' }}
      LEG_ID: ${{ github.event.inputs.leg_id || 'calib_hi_to_lo__ternary_vhl' }}
      SEED: ${{ github.event.inputs.seed || '0' }}
      DIRECTION: ${{ github.event.inputs.direction || 'fwd' }}
      NWIN: ${{ github.event.inputs.n_windows || '12' }}
      TEMPLATE_PDB: ${{ github.event.inputs.template_pdb || '8G1Q' }}
      # `spot_safe` was a workflow input; RETIRED 2026-07-27 to free a slot under GitHub's 25-input dispatch
      # cap for `restrain` (the cap is REAL and measured: adding a 26th returns 422 "you may only define up to
      # 25 inputs" — see the `direction` retirement of constrain_ligand_ch above). It was the weakest input in
      # the file on two counts. (1) Its NAME no longer describes what it does: spot-safe resume is now
      # UNCONDITIONAL for mode=run (the GCS CommitStore via RBFE_SPOT_COMMIT_GCS), so the flag has nothing to
      # do with resumability. (2) Its ONE remaining effect is MAX_ATTEMPTS 1->3 in the ATTACHED polling loop
      # below — and mode=run forces DETACH=1, so it could only ever have affected a smoke/preequil/endpoint
      # dispatch, never a science leg. Pinned to '0', the value every real dispatch has used, so the code path
      # is byte-identical. It is keyed into nothing, so no checkpoint is orphaned. Want the 3 attempts back?
      # Change the pin here — it is one line and no dispatcher passes it (the watchdog never has).
      SPOT_SAFE: '0'
      # 1 = flat-bottom pocket restraint (ternary_restraint.py). A DIFFERENT HAMILTONIAN, hence keyed into the
      # commit prefix below (_rst) — see the assertion there.
      RESTRAIN: ${{ github.event.inputs.restrain || '0' }}
      DETACH: ${{ github.event.inputs.detach || '0' }}
      CHARGE_METHOD: ${{ github.event.inputs.charge_method || 'nagl' }}
      TIMESTEP_FS: ${{ github.event.inputs.timestep_fs || '2.0' }}
      # Was a workflow input; RETIRED 2026-07-25 to free a slot under GitHub's 25-input dispatch cap for
      # `direction`. It was a CONFIRMED NO-OP: a perses force-layout dump (2026-07-19) showed the ligand C-H
      # are already constrained, and nr4a3_rbfe.constrain_nonalchemical_xh() adds 0 restraints. Its only
      # remaining function was keying the commit prefix, so it is PINNED to '0' -- the value every real
      # dispatch has used -- which keeps every existing `clig0` prefix byte-identical and still resumable.
      CONSTRAIN_LIG: '0'
      WARMUP_TS: ${{ github.event.inputs.warmup_timestep_fs || '' }}
      WARMUP_ITERS: ${{ github.event.inputs.warmup_iters || '' }}
      PROD_ITERS: ${{ github.event.inputs.prod_iters || '' }}
      SALT: ${{ github.event.inputs.commit_salt || '' }}
      REFUSE_IF_LIVE: ${{ github.event.inputs.refuse_if_vm_live || '0' }}
      REQUIRE_PRIMED: ${{ github.event.inputs.allow_gpu_setup_build == '1' && '0' || '1' }}
      MIN_STEPS: ${{ github.event.inputs.min_steps || '5000' }}
      PE_SMOKE: ${{ github.event.inputs.preequil_smoke || '0' }}
      PE_NS: ${{ github.event.inputs.preequil_ns || '0.5' }}
      USE_PE: ${{ github.event.inputs.use_preequil || '0' }}
      PROVISIONING: ${{ github.event.inputs.provisioning || 'spot' }}
      AUTOSTOP: ${{ github.event.inputs.autostop_convergence || '0' }}
      AUTOSTOP_MIN_FRAC: '0.4'
      FORCE_RERUN: ${{ github.event.inputs.force_rerun || '0' }}
      GITREF: ${{ github.ref_name }}
    steps:
      - uses: actions/checkout@v4
      - id: auth
        name: Authenticate to GCP (keyless, WIF)
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: projects/878095411563/locations/global/workloadIdentityPools/github-pool/providers/github-provider
          service_account: gpu-runner@project-a7ebde30-e2ed-4b8d-9a9.iam.gserviceaccount.com
      - name: Set up gcloud
        uses: google-github-actions/setup-gcloud@v2
      - name: Resolve project
        run: |
          set -eo pipefail
          PROJECT=project-a7ebde30-e2ed-4b8d-9a9
          echo "PROJECT=$PROJECT" >> "$GITHUB_ENV"
          gcloud config set project "$PROJECT"
      - name: Tail / monitor detached ternary VMs (mode=tail)
        if: ${{ github.event.inputs.mode == 'tail' }}
        run: |
          set +e   # DIAGNOSTIC step: never exit on a grep-no-match. A warmup-only leg (no production commits yet)
                   # made the production-iter grep return 1, which under `set -e` killed the step BEFORE the serial
                   # tail + SSH run-log window — hiding exactly the MD state we tail for. Read-only, so +e is correct.
          PROJECT=project-a7ebde30-e2ed-4b8d-9a9
          BUCKET="${PROJECT}-rbfe-ckpt"; RESULTS="gs://$BUCKET/valB-6hax/results"
          echo "=== live gcp-ternary VMs ==="
          VMLIST=$(gcloud compute instances list --filter="name~'^gcp-ternary-'" \
            --format="value(name,zone.basename(),status,creationTimestamp)" 2>/dev/null)
          printf '%s\n' "${VMLIST:-(none)}"
          echo "=== valB-6hax results in GCS ==="
          gcloud storage ls "$RESULTS/" 2>/dev/null || echo "(no results yet)"
          echo "=== per-interval commit census (liveness of the running leg $LEG_ID seed $SEED) ==="
          # leg-level prefix so we find the commits regardless of the seed_dt<X>fs suffix (commit store is now
          # keyed by timestep, and a tail call doesn't know the running leg's dt).
          CB="gs://$BUCKET/valB-6hax/commits/$LEG_ID"
          CALL=$(gcloud storage ls --recursive "$CB/" 2>/dev/null || true)
          if [ -n "$CALL" ]; then
            for PH in warmup production; do
              MAX=$(printf '%s\n' "$CALL" | grep -aoE "$PH/iter-[0-9]+" | grep -aoE "[0-9]+$" | sort -n | tail -1)
              [ -n "$MAX" ] && echo "  $PH: furthest committed iteration = $MAX"
            done
            printf '%s\n' "$CALL" | grep -aE "COMMITTED.json" | tail -3
          else
            echo "  (no commits yet — VM still in env-solve/stage/setup, or not provisioned)"
          fi
          echo "=== smoke.json (endpoint-verification: built vs requested SMILES) ==="
          gcloud storage cat "$RESULTS/smoke_${LEG_ID}.json" 2>/dev/null || echo "(no smoke.json for $LEG_ID)"
          echo "=== endpoint_stability_${LEG_ID}.json (exact-Hamiltonian per-endpoint stability: ff_switch/rmsd/drift) ==="
          gcloud storage cat "$RESULTS/endpoint_stability_${LEG_ID}.json" 2>/dev/null || echo "(no endpoint_stability json for $LEG_ID)"
          echo "=== post-mortem logs (a self-deleted VM uploads /tmp/tfep_run.log here on NORESULT) ==="
          PM=$(gcloud storage ls "gs://$BUCKET/valB-6hax/postmortem/" 2>/dev/null || true)
          if [ -n "$PM" ]; then
            printf '%s\n' "$PM" | tail -6
            # IDENTITY BEFORE RECENCY. These were selected by newest-wins: first any name matching
            # <leg>_seed<n> (which did NOT include the direction, so fwd and rev were indistinguishable), then
            # -- with no filter at all -- the newest postmortem of ANY leg. On 2026-07-25 that handed me a
            # traceback from a different leg at production iteration 520/540 and I nearly attributed it to a
            # 2-minute-old rev leg that could not have reached iteration 520 for ~4.7 h. Prefer the
            # direction-keyed name, fall back to the legacy direction-less one, and if neither exists say so
            # rather than substituting a stranger's log.
            NEWEST=$(printf '%s\n' "$PM" | grep -aE "${LEG_ID}_${DIRECTION}_seed${SEED}" | sort | tail -1)
            if [ -z "$NEWEST" ]; then
              NEWEST=$(printf '%s\n' "$PM" | grep -aE "${LEG_ID}_seed${SEED}" | sort | tail -1)
              [ -n "$NEWEST" ] && echo "  (WARNING: matched a LEGACY direction-less postmortem name — it may belong to the other direction)"
            fi
            if [ -z "$NEWEST" ]; then
              echo "  (no postmortem for ${LEG_ID} dir=${DIRECTION} seed ${SEED} — NOT falling back to another leg's log)"
            fi
            if [ -n "$NEWEST" ]; then
              echo "--- newest post-mortem: $NEWEST ---"
              PMLOG=$(gcloud storage cat "$NEWEST" 2>/dev/null | sed -e "s/\x1b\[[0-9;]*m//g")
              echo "--- config confirm (charge + warmup-dt override) ---"
              printf '%s\n' "$PMLOG" | grep -aE "partial_charge_method|WARMUP timestep|WARMUP from|warmup_target|reduced-dt|overridden|RBFE_CONSTRAIN|forcefield constraints|hydrogen_mass" | tail -20 || echo "(no config lines)"
              echo "--- clash/nan diagnostic lines ---"
              printf '%s\n' "$PMLOG" | grep -aE "clash-diag|nan-diag|minimize|SOLVATED|particles|atoms=|non-bonded|pair \(|coords>|nonfinite|artifacts" | tail -40 || echo "(no diag lines)"
              echo "--- last 20 lines (traceback tail) ---"
              printf '%s\n' "$PMLOG" | tail -20 || echo "(cat failed)"
            fi
          else
            echo "  (no post-mortem logs — VM either still alive, spot-preempted (abrupt DELETE, no upload), or never provisioned)"
          fi
          echo "=== recent GCE preemption operations (DEFINITIVE preempt-vs-crash: a VM name here = GCE preempted it, not a crash/zombie) ==="
          PREEMPTS=$(gcloud compute operations list \
            --filter="operationType=compute.instances.preempted AND targetLink~gcp-ternary-" \
            --format="value(targetLink.basename(),insertTime)" \
            --sort-by=~insertTime --limit=10 2>/dev/null)
          printf '%s\n' "${PREEMPTS:-  (none found)}"
          # Fold the preempt-vs-crash verdict into the annotation. Without it, "the VM is gone" needs a log dive
          # to classify, and preemption (routine, resume from checkpoint) looks identical to a crash (investigate).
          LASTPRE=$(printf '%s\n' "$PREEMPTS" | head -1 | tr -s ' \t' ' ')
          DEATH="unclassified"
          [ -n "$(printf '%s' "$PREEMPTS" | tr -d '[:space:]')" ] && DEATH="PREEMPTED(latest: $LASTPRE)"
          echo "=== live gcp-ternary VMs + L4 quota usage (ZOMBIE-vs-capacity: usage>0 with no progress = zombie holding a GPU; usage=0 + no VM + provision failing = real GCE capacity stockout, NOT a zombie) ==="
          gcloud compute instances list --filter="name~'^gcp-ternary-'" --format="table(name,zone.basename(),status,creationTimestamp)" 2>/dev/null || echo "  (no ternary VMs)"
          Q=$(gcloud compute regions describe us-central1 --flatten="quotas[]" --format="value(quotas.metric, quotas.limit, quotas.usage)" 2>/dev/null)
          for M in NVIDIA_L4_GPUS PREEMPTIBLE_NVIDIA_L4_GPUS; do echo "$Q" | awk -v m="$M" '$1==m{printf "  %s: limit=%s usage=%s\n", $1,$2,$3}'; done
          VM_IN="${{ github.event.inputs.leg_id }}"   # reuse leg_id slot to pass an explicit VM name for tail
          case "$VM_IN" in gcp-ternary-*) TVM="$VM_IN" ;; *) TVM=$(gcloud compute instances list --filter="name~'^gcp-ternary-'" --format="value(name)" 2>/dev/null | head -1) ;; esac
          if [ -n "$TVM" ]; then
            TZONE=$(gcloud compute instances list --filter="name=$TVM" --format="value(zone.basename())" 2>/dev/null | head -1)
            echo "=== serial tail: $TVM ($TZONE) ==="
            SER=$(gcloud compute instances get-serial-port-output "$TVM" --zone="$TZONE" 2>/dev/null)
            printf '%s\n' "$SER" \
              | grep -aE "boot|nvidia-smi|import:|stage|staged|SMOKE|mapped|assembly|hybrid|equilibr|iteration|Analyzing|LEG DONE|TFEP|error|Error|Traceback|ABORT|missing|self-delet|SETUP|SOLVATED|particles|spot-safe|commit store|barrier|committed|clash-diag|nan-diag|minimize|timing|WARMUP timestep|WARMUP from|PRODUCTION created|PRODUCTION from" | tail -90 || echo "(no serial yet)"
            # LIVE WINDOW INTO THE RUNNING MD (SSH; non-destructive): the openmmtools MD logger writes per-iteration
            # progress to /tmp/tfep_run.log on the VM, NOT the serial console — so a slow/stuck MD is invisible from
            # serial. SSH in, dump nvidia-smi (is the GPU actually busy? rules out a CPU-fallback bug), the tail of
            # the run log (where is it: minimizing? equilibrating? which iteration?), and any iteration/replica lines.
            if [ "${{ github.event.inputs.mode }}" = "tail" ]; then
              echo "=== SSH live window: nvidia-smi + /tmp/tfep_run.log (where is the MD?) ==="
              # capture into SSHLOG so the summary fields below read the LIVE VM's own run log (freshest source),
              # not the stale leg-wide postmortem.
              SSHLOG=$(timeout 120 gcloud compute ssh "$TVM" --zone="$TZONE" --quiet --command 'echo "--- nvidia-smi ---"; nvidia-smi --query-gpu=utilization.gpu,memory.used,power.draw --format=csv,noheader 2>/dev/null || true; echo "--- dmon 6s (util/mem/pwr time-series: bursty=working, all-0=idle/stall) ---"; timeout 9 nvidia-smi dmon -c 6 -s um 2>/dev/null || true; echo "--- top CPU procs (python high-%CPU=CPU-bound setup; none=hung) ---"; ps -eo pid,etimes,pcpu,pmem,stat,comm --sort=-pcpu 2>/dev/null | head -8 || true; echo "--- startup-script log (where setup died/hung if no run log yet) ---"; (sudo journalctl -u google-startup-scripts.service --no-pager 2>/dev/null | tail -60 || true); echo "--- setup log files ---"; ls -la /tmp/*.log /var/log/tfep* 2>/dev/null | tail -12 || true; for f in /var/log/tfep.log /tmp/tfep_setup.log /tmp/startup.log /var/log/tfep_startup.log; do [ -f "$f" ] && { echo "== $f (tail 120) =="; tail -120 "$f"; }; done; echo "--- FULL run log ---"; sed -e "s/\x1b\[[0-9;]*m//g" /tmp/tfep_run.log 2>/dev/null || echo "(no run log)"; echo "=== nan-error-logs dir ==="; SD=$(ls -d /tmp/tout/*_sim_shared 2>/dev/null | head -1); ls -la "$SD/nan-error-logs" 2>/dev/null || echo "(no nan dir)"; echo "=== minimize/energy/nan lines ==="; grep -aiE "minimi|energ|nan|reinitial|restart|Warning|CRITICAL|Potential" /tmp/tfep_run.log 2>/dev/null || true; echo "=== autostop/convergence verdicts (which criterion gates the early-stop) ==="; grep -aE "\[autostop\]|AUTOSTOP|CONVERGED|overlap|plateau" /tmp/tfep_run.log 2>/dev/null | tail -12 || true' 2>&1 | grep -vE "Warning: Permanently added|Updating project ssh|Waiting for SSH key|WARNING:|^$")
              printf '%s\n' "$SSHLOG" | tail -140 || echo "(ssh window failed)"
            fi
            if [ "${{ github.event.inputs.detach }}" = 1 ]; then
              echo "deleting $TVM (requested via detach=1 on a tail call)"
              gcloud compute instances delete "$TVM" --zone="$TZONE" --quiet || true
            fi
          fi
          # COMPACT FINAL SUMMARY — the LAST lines of the step, so it survives log-retrieval truncation. Gives the
          # two verdicts at a glance: furthest committed warmup/production iteration + whether a NaN was seen.
          WMAX=$(printf '%s\n' "$CALL" | grep -aoE "warmup/iter-[0-9]+" | grep -aoE "[0-9]+$" | sort -n | tail -1)
          PMAX=$(printf '%s\n' "$CALL" | grep -aoE "production/iter-[0-9]+" | grep -aoE "[0-9]+$" | sort -n | tail -1)
          # SOURCE for the verdict fields: when a live VM is running its OWN serial+SSH run log are the truth;
          # the leg-wide postmortem (PMLOG) is a DIFFERENT (dead) run's log and must NOT override a live leg's
          # state (that mixed a stale v2 'setStepSize' NaN into fresh v3 tails). Use PMLOG only when nothing is live.
          LIVE=$(printf '%s\n%s\n' "${SER:-}" "${SSHLOG:-}")
          if printf '%s' "$LIVE" | grep -qaE '[^[:space:]]'; then SRC="$LIVE"; SRCKIND=live; else SRC="${PMLOG:-}"; SRCKIND=postmortem; fi
          NAN=no; printf '%s\n' "$SRC" | grep -qaiE "SimulationNaNError|resulted in a NaN|nan-diag" && NAN=YES
          CHG=$(printf '%s\n' "$SRC" | grep -aoE "partial_charge_method = [a-z0-9]+" | tail -1 | awk '{print $NF}')
          WUD=$(printf '%s\n' "$SRC" | grep -aoE "WARMUP timestep overridden to [0-9.]+ fs" | tail -1)
          NANST=$(printf '%s\n' "$SRC" | grep -aoE "replica [0-9]+ at state [0-9]+ resulted in a NaN|iteration[0-9]+-replica[0-9]+-state[0-9]+" | tail -1)
          RDTW=$(printf '%s\n' "$SRC" | grep -aoE "could not build reduced-dt warmup integrator[^\"]{0,90}" | tail -1)
          # NB `grep -c . || echo 0` prints 0 AND runs the fallback (grep exits 1 on no match), yielding "0\n0":
          # the embedded newline broke `[ "$VMCOUNT" = 0 ]` and truncated the annotation. Count without grep.
          VMCOUNT=$(printf '%s' "$VMLIST" | tr -d '[:space:]' | wc -c | tr -d ' ')
          [ "$VMCOUNT" -gt 0 ] 2>/dev/null && VMCOUNT=$(printf '%s\n' "$VMLIST" | sed '/^[[:space:]]*$/d' | wc -l | tr -d ' ') || VMCOUNT=0
          VMS1=$(printf '%s\n' "$VMLIST" | tr '\n' ';' | cut -c1-200)
          echo "[PROGRESS-SUMMARY] leg=$LEG_ID seed=$SEED src=$SRCKIND live_vms=$VMCOUNT vms=\"$VMS1\" warmup_committed_iter=${WMAX:-0} production_committed_iter=${PMAX:-0} NaN_seen=$NAN charge=${CHG:-?} warmup_dt_override=\"${WUD:-NONE}\" reduced_dt_warn=\"${RDTW:-none}\" nan_at=\"${NANST:-}\" (committed-iters are leg-wide across salts; verdict fields are from src)"
          # ALSO EMIT AS AN ANNOTATION. The tail step prints a lot (SSH dumps, nvidia-smi, the whole run log), so
          # this one decisive line sits at an unpredictable depth and finding it means fetching the log and
          # guessing a tail window — which wasted real time today. ::notice::/::error:: are retrievable from the
          # check-runs API, so a progress check becomes one cheap call. An ERROR (not notice) when the VM is gone
          # or a NaN appeared, so trouble is visible from the annotation LEVEL without parsing anything.
          SUMMARY="live_vms=$VMCOUNT prod_iter=${PMAX:-0} warmup_iter=${WMAX:-0} NaN=$NAN charge=${CHG:-?} src=$SRCKIND vms=$VMS1"
          if [ "$VMCOUNT" = "0" ]; then
            echo "::error title=TERNARY-PROGRESS NO-VM::$LEG_ID dir=${DIRECTION:-fwd} seed=$SEED — NO live VM. death=${DEATH:-unclassified}. $SUMMARY"
          elif [ "$NAN" = "YES" ]; then
            echo "::error title=TERNARY-PROGRESS NaN::$LEG_ID dir=${DIRECTION:-fwd} seed=$SEED — NaN seen at ${NANST:-unknown}. $SUMMARY"
          else
            echo "::notice title=TERNARY-PROGRESS ok::$LEG_ID dir=${DIRECTION:-fwd} seed=$SEED — $SUMMARY (NB committed-iters are leg-wide ACROSS SALTS, so they may reflect a DIFFERENT direction's legs, not this one)"
          fi

      # PER-PHASE ITERATION TIMING PROFILE (mode=tail; CPU/runner-only, no GPU/VM created — it SSHes into the
      # already-running VM and reads a file).
      #
      # WHY THIS EXISTS. ternary-watch.json carried 33.91 s/iter as *the* per-iteration cost and extrapolated the
      # whole remaining leg from it. That number was measured during WARMUP. Production is measured (from the GCS
      # commit-marker series) at ~66 s/iter — 1.95x — and the step count does NOT explain the gap: OpenFE sets
      # `n_steps` once from the PRODUCTION timestep, and rbfe_spot_driver builds the warmup move as a COPY with
      # only `.timestep` changed, so both phases run 1250 MD steps per iteration and should cost the same.
      #
      # Two candidate mechanisms were killed by reading the code rather than guessing: the autostop convergence
      # check (a full MBAR per checkpoint boundary) is opt-in and OFF here, and would not engage until 40% of the
      # 2000-iteration cap anyway; and warmup checkpoints MORE often (every 8 vs every 40), so commit overhead
      # would make warmup the slower phase, not the faster one. That leaves a mechanism I cannot establish from
      # the source, so this reads the ONE artifact that settles it: this VM's own run log, which contains both
      # phases' timing lines for the SAME machine, GPU and system.
      #
      # The per-100-iteration blocks are the second question and the more important one: a CONSTANT production
      # cost means 66 s/iter is simply the right number and the ETA follows from it, while a RISING one means the
      # cost grows with accumulated iterations and every ETA computed from a current rate is optimistic.
      #
      # The awk program lives in research/modalities/iter_timing_profile.awk (see the note at its top: as a
      # heredoc, its column-0 terminator dedented out of this block scalar and broke the YAML) and is shipped to
      # the VM base64'd rather than quoted into --command. `gcloud compute ssh --command '...'` is a
      # single-quoted string, so an awk program inside it cannot use single quotes at all, and $0/$1/NF would be
      # eaten by the remote shell if double-quoted. Encoding sidesteps both: one token, no quotes, no escaping.
      - name: Per-phase iteration timing profile (mode=tail — CPU/runner-only, no GPU/VM)
        if: ${{ github.event.inputs.mode == 'tail' }}
        run: |
          set +e   # DIAGNOSTIC step: a missing VM / no-match grep must not fail the job.
          TVM_IN="${{ github.event.inputs.leg_id }}"
          case "$TVM_IN" in
            gcp-ternary-*) TVM="$TVM_IN" ;;
            *) TVM=$(gcloud compute instances list --filter="name~'^gcp-ternary-'" --format="value(name)" 2>/dev/null | head -1) ;;
          esac
          if [ -z "$TVM" ]; then
            echo "no live gcp-ternary VM — nothing to profile (the run log lives on the VM, not in GCS)"
            exit 0
          fi
          TZONE=$(gcloud compute instances list --filter="name=$TVM" --format="value(zone.basename())" 2>/dev/null | head -1)
          B64=$(base64 -w0 < research/modalities/iter_timing_profile.awk)
          echo "=== per-phase iteration timing on $TVM ($TZONE) ==="
          # ALSO print the driver's own phase-transition lines, unfiltered. Without them a phase label is
          # unfalsifiable: the first run of this profile reported warmup and "pre-warmup" phases and NO production
          # phase at all, while GCS showed production/280 committed — so either the driver logged a transition this
          # awk does not key on, or the phases are not what the label says. A profile whose attribution cannot be
          # checked against the driver's own log is exactly the "confident answer about the wrong thing" this lane
          # keeps producing, so the evidence for the labelling ships next to the labels.
          # The [barrier] commit lines are one per checkpoint (every 8 warmup iterations), so by iteration 640
          # there are ~80 of them and a `tail -60` window shows NOTHING BUT barrier lines — which is how the
          # first run of this profile hid the single most important line in the log (the phase target). Collapse
          # them to a count plus the newest one, and show the [spot-driver] phase lines in full.
          timeout 120 gcloud compute ssh "$TVM" --zone="$TZONE" --quiet \
            --command "echo $B64 | base64 -d > /tmp/prof.awk; L=/tmp/tfep_run.log; C=/tmp/clean.log; sed -e 's/\x1b\[[0-9;]*m//g' \$L > \$C 2>/dev/null; echo '--- [spot-driver] phase lines IN FULL (the evidence for the phase labels) ---'; grep -aE 'spot-driver|autostop' \$C | tail -40; echo '--- [barrier] commits: count, first, last (collapsed: one per checkpoint floods any tail window) ---'; grep -ac 'barrier. committed' \$C; grep -aE 'barrier. committed' \$C | head -1; grep -aE 'barrier. committed' \$C | tail -1; echo '--- total timing lines ---'; grep -ac 'took' \$C; echo '--- profile ---'; awk -f /tmp/prof.awk \$C | sort" \
            2>&1 | grep -vE "Warning: Permanently added|Updating project ssh|Waiting for SSH key|WARNING:|^$"
          echo "=== GCS objects under THIS leg's own direction+salt prefix (which phase has committed what) ==="
          # The watchdog census reported production/280 for this entry while the driver's barrier lines said
          # warmup 640/800. Both cannot describe the same trajectory, so list the prefix itself rather than
          # believing either reading: the object paths are the arbiter.
          CPFX="gs://${PROJECT}-rbfe-ckpt/valB-6hax/commits/${{ github.event.inputs.leg_id }}"
          gcloud storage ls --recursive "$CPFX/" 2>/dev/null \
            | sed -E 's#^.*/commits/##; s#/(warmup|production)/iter-#|\1|#' \
            | awk -F'|' 'NF>=3{split($3,a,"/"); key=$1"|"$2; n=a[1]+0; if(n>mx[key])mx[key]=n; cnt[key]++} END{for(k in mx) printf "  %-70s furthest=%-8d objects=%d\n", k, mx[k], cnt[k]}' \
            | sort
          echo "=== [TIMING] read the PHASE lines for warmup-vs-production, the BLOCK lines for drift ==="

      - name: Set up openmmtools for forensic ckpt probe (mode=forensic)
        if: ${{ github.event.inputs.mode == 'forensic' }}
        uses: mamba-org/setup-micromamba@v2
        with:
          environment-name: omm
          create-args: >-
            python=3.11 openmmtools netcdf4 numpy -c conda-forge
          init-shell: bash
      - name: Forensic checkpoint probe (mode=forensic — CPU/runner-only, no GPU/VM)
        if: ${{ github.event.inputs.mode == 'forensic' }}
        shell: bash -el {0}
        run: |
          set -eo pipefail
          # CONFIRM the 2026-07-21 interval-mismatch root cause on the REAL committed artifacts: for the newest
          # few PRODUCTION generations of this leg, open each (.nc,.chk) with the real openmmtools MultiStateReporter
          # and print reporter.checkpoint_interval + read_last_iteration(analysis vs checkpoint) + manifest iter, so
          # we see which generations are on a 20- vs 40-grid and whether any committed pair is itself torn. $0 (free
          # runner), no GPU, no VM. Scans ALL (dt,clig,wu,salt) prefixes under commits/$LEG_ID.
          BUCKET="${PROJECT}-rbfe-ckpt"
          CB="gs://$BUCKET/valB-6hax/commits/$LEG_ID"
          NEWEST="${{ github.event.inputs.n_windows }}"; case "$NEWEST" in ''|*[!0-9]*) NEWEST=8 ;; esac
          echo "=== enumerating PRODUCTION committed generations under $CB ==="
          ALL=$(gcloud storage ls --recursive "$CB/" 2>/dev/null | grep -aE "/production/iter-[0-9]+/[0-9a-f]+/COMMITTED.json$" || true)
          if [ -z "$ALL" ]; then echo "(no production COMMITTED.json found under $CB — leg may be warmup-only)"; exit 0; fi
          # newest N distinct generation dirs by iteration
          # `awk NR<=n`, not `head -n`: `head` closes the pipe and `sort` then dies on the write, which pipefail
          # + `set -e` turn into a dead step. Size-dependent, so it lies dormant until the lane outgrows the 64 KB
          # pipe buffer — which is exactly how it killed mode=converge in GH run 30202753766. Gated by
          # tests/test_workflows_parse.py::test_no_sort_into_head_under_pipefail, which is what found this second
          # instance after the first was fixed.
          SEL=$(printf '%s\n' "$ALL" | sort -t/ -k1 | awk -F'/production/iter-' '{print $2}' \
                | sed -E 's#/COMMITTED.json$##' | sort -t/ -k1 -rn | awk -v n="$NEWEST" 'NR<=n')
          mkdir -p /tmp/forensic
          i=0
          while IFS= read -r rel; do
            [ -z "$rel" ] && continue
            ITER=$(printf '%s' "$rel" | cut -d/ -f1)
            GEN=$(printf '%s' "$rel" | cut -d/ -f2)
            # find the full prefix (which dt/salt subdir this gen lives under)
            SRC=$(printf '%s\n' "$ALL" | grep -aE "/production/iter-$ITER/$GEN/COMMITTED.json$" | head -1 | sed -E 's#/COMMITTED.json$##')
            [ -z "$SRC" ] && continue
            DST="/tmp/forensic/gen_$(printf '%03d' "$i")_iter${ITER}"
            mkdir -p "$DST"
            echo "--- downloading $SRC -> $DST ---"
            gcloud storage cp --recursive "$SRC/*" "$DST/" 2>&1 | tail -3 || echo "(download failed)"
            i=$((i+1))
          done <<< "$SEL"
          echo "=== running forensic inspector ==="
          micromamba run -n omm python research/modalities/rbfe_ckpt_forensic.py /tmp/forensic --newest "$NEWEST"
      - name: Reduce coop cycle (mode=reduce — CPU/runner-only, NO GPU/VM)
        # The reducer (ternary_fep_reduce.py) is pure-Python: it globs the per-leg result JSONs, forms
        # ddG_coop = (ternary−solvent)−(binary−solvent) with replicate-SD errors, and emits the valB calibration
        # gate. It needs NO GPU and NO conda env, so it runs directly on the runner. (Before this, mode=reduce
        # silently fell through to TMODE=smoke in the provision step and spun a pointless GPU VM — fixed 2026-07-23.)
        if: ${{ github.event.inputs.mode == 'reduce' }}
        run: |
          set -eo pipefail
          BUCKET="${PROJECT}-rbfe-ckpt"; RESULTS="gs://$BUCKET/valB-6hax/results"
          mkdir -p /tmp/legs
          echo "=== pulling leg result JSONs from $RESULTS ==="
          gcloud storage cp "$RESULTS/leg_*.json" /tmp/legs/ 2>/tmp/cperr || { echo "no leg JSONs found (honest empty reduce):"; cat /tmp/cperr; }
          # Pull EVERY convergence report mode=converge has produced — ternary_convergence.json (fwd) AND any
          # direction-suffixed sibling such as ternary_convergence_rev.json. The glob is the point: this copied the
          # fwd name literally, which was correct only while converge wrote one file. Once converge became
          # direction-keyed the rev report existed in the bucket and was never downloaded, so the reducer — which
          # now reads it — would see "rev leg ran, no rev report" and route the whole verdict to BORDERLINE
          # (NOT_VERIFIED) for a purely logistical reason. Fourth layer of the same keying bug: commit prefix,
          # then the analysis, then the output name, now the fetch. Anything keyed on direction has to be keyed
          # EVERYWHERE the artifact travels.
          # NB the reducer no longer defaults an absent report to True (fixed 2026-07-25) — absent is NOT_VERIFIED,
          # which routes to BORDERLINE, never PASS. The old message below claimed the opposite.
          gcloud storage cp "$RESULTS/ternary_convergence*.json" /tmp/legs/ 2>/dev/null || true
          CONVGOT=$(ls -1 /tmp/legs/ternary_convergence*.json 2>/dev/null | xargs -r -n1 basename | tr '\n' ' ')
          if [ -n "$CONVGOT" ]; then
            echo "[reduce] convergence report(s) present: $CONVGOT — diagnostics_ok is MEASURED from these"
          else
            echo "[reduce] NO convergence report — diagnostics_ok is NOT_VERIFIED (routes to BORDERLINE, not PASS)"
          fi
          echo "=== leg JSONs present ==="; ls -1 /tmp/legs/ 2>/dev/null || echo "(none)"
          echo "=== running reducer (CPU) ==="
          ( cd research/modalities && CKPT_DIR=/tmp/legs INPUT_DIR=/tmp/legs python3 ternary_fep_reduce.py )
          echo "=== [REDUCE-RESULT] ternary_coop_reduction.json ==="
          python3 -c "import json;d=json.load(open('/tmp/legs/ternary_coop_reduction.json'));print(json.dumps({k:d[k] for k in ('valB_calibration_gate','valB_calibration_decision','n_available_morphs') if k in d}, indent=2))" 2>/dev/null || cat /tmp/legs/ternary_coop_reduction.json
          # PER-LEG FORENSIC TABLE. The 3-key summary above says WHAT the verdict is; it does not say whether the
          # legs that produced it are comparable. ΔΔG_coop is a DIFFERENCE of two legs, so a protocol_hash or
          # n_windows mismatch between the ternary and binary leg silently contaminates the cycle while every
          # step still reports success. Print the raw per-leg record (ΔG, MBAR SE, protocol hash, windows,
          # starting model) plus an explicit cross-leg consistency verdict, so the number can be audited.
          echo "=== [LEG-TABLE] per-leg raw records ==="
          python3 - <<'PYDUMP'
          import glob, json, os
          rows = []
          for f in sorted(glob.glob('/tmp/legs/leg_*.json')):
              d = json.load(open(f))
              ps = d.get('protocol_settings') or {}
              rows.append({'file': os.path.basename(f), 'env': d.get('environment'), 'dir': d.get('direction'),
                           'seed': d.get('seed'), 'dg_morph_kcal': d.get('dg_morph_kcal'),
                           'mbar_se_kcal': d.get('mbar_se_kcal'), 'n_windows': d.get('n_windows'),
                           'n_mapped_atoms': d.get('n_mapped_atoms'),
                           'protocol_hash': (d.get('protocol_hash') or '')[:12],
                           'protocol_settings': ps,
                           'starting_model': d.get('starting_model')})
          print(json.dumps(rows, indent=2, default=str))
          hashes = {r['protocol_hash'] for r in rows if r['protocol_hash']}
          wins = {r['n_windows'] for r in rows if r['n_windows'] is not None}
          print('[LEG-CONSISTENCY] n_legs=%d distinct_protocol_hashes=%d %s distinct_n_windows=%s -> %s'
                % (len(rows), len(hashes), sorted(hashes), sorted(wins),
                   'CONSISTENT' if len(hashes) <= 1 and len(wins) <= 1 else 'MISMATCH — the cycle is contaminated'))
          # the cycle, spelled out, so the sign and the algebra are both visible
          by = {}
          for r in rows:
              if r['dg_morph_kcal'] is not None:
                  by.setdefault((r['env'], r['seed']), r['dg_morph_kcal'])
          for seed in sorted({k[1] for k in by}):
              t, b, s = by.get(('ternary', seed)), by.get(('binary', seed)), by.get(('solvent', seed))
              if t is not None and b is not None:
                  print('[CYCLE] seed=%s  dG_ternary=%.3f  dG_binary=%.3f  dG_solvent=%s  ->  ddG_coop = %.3f - %.3f = %+.3f kcal/mol'
                        % (seed, t, b, ('%.3f' % s) if s is not None else 'n/a', t, b, t - b))
          PYDUMP
          echo "=== [FULL-REDUCTION] every key ==="
          cat /tmp/legs/ternary_coop_reduction.json
          gcloud storage cp /tmp/legs/ternary_coop_reduction.json "$RESULTS/ternary_coop_reduction.json" 2>/dev/null && echo "[reduce] uploaded reduction to $RESULTS/" || true
          # SURFACE THE VERDICT AS AN ANNOTATION. Everything above prints to the log, and the reduction JSON is
          # uploaded — both true, both requiring excavation. The watchdog now dispatches this step automatically
          # when a leg lands, so the number can arrive with NO SESSION AWAKE; if the verdict is only readable by
          # opening a log nobody opens, that autonomy buys nothing (§D of the guard audit). One API call must give
          # the decision, the mean, the SD, the target and the fwd/rev hysteresis.
          python3 - <<'PYVERDICT'
          import json, os
          p = '/tmp/legs/ternary_coop_reduction.json'
          if not os.path.isfile(p):
              print("::error title=REDUCE-VERDICT MISSING::the reducer produced no ternary_coop_reduction.json — nothing was reduced. Do NOT read the absence as a null result.")
              raise SystemExit(0)
          d = json.load(open(p))
          g = d.get('valB_calibration_gate') or {}
          dec = d.get('valB_calibration_decision') or {}
          # ★ A KEY THE PRODUCER NEVER EMITS AND A KEY MEASURED AS None ARE DIFFERENT THINGS, AND `.get()` RENDERS
          # THEM IDENTICALLY (fixed 2026-07-27). This read `dec.get('hysteresis_ok')` — a key
          # `ternary_fep_reduce.calibration_decision` did not emit under ANY code path; it emitted
          # `checks.hysteresis_resolved`. So `hy` was ALWAYS None and this annotation ALWAYS printed
          # "NOT MEASURED", including on 2026-07-27 when the first fwd/rev hysteresis this program has ever
          # measured (0.3246 kcal/mol) was sitting two keys away in the same file. The mirror of report_cofold.py
          # in §L.6a: there an UNMEASURED criterion was named as observed, here an OBSERVED one is named as
          # unmeasured. Both are the verdict string decoupling from the measurement. The sentinel below is the
          # general remedy on the READER side — absence of a key is now its own loud state, never a quiet None.
          # NB every read below is a literal `<obj>.get('<key>', MISSING)` on purpose: that is the shape
          # tests/test_verdict_annotation_reads_real_keys.py EXTRACTS from this YAML by AST and checks against the
          # keys ternary_fep_reduce actually emits. Wrapping these in a helper would hide them from that sweep.
          MISSING = object()
          hy = dec.get('hysteresis_ok', MISSING)
          hy_val = dec.get('hysteresis_kcal', MISSING)
          hy_max = dec.get('hysteresis_max_kcal', MISSING)
          def num(v, nd=3):
              try:
                  return format(float(v), '.%df' % nd)
              except (TypeError, ValueError):
                  return 'KEY ABSENT' if v is MISSING else str(v)
          if hy is MISSING:
              hy_txt = ('KEY ABSENT from valB_calibration_decision — the reducer and this annotation disagree '
                        'about the field name; treat as UNVERIFIED, not as a pass')
          elif hy is True:
              hy_txt = 'MEASURED |dG_fwd+dG_rev| = %s <= %s (PASS)' % (num(hy_val), num(hy_max))
          elif hy is False:
              hy_txt = 'MEASURED |dG_fwd+dG_rev| = %s > %s (FAIL — unresolved fwd/rev disagreement)' % (num(hy_val), num(hy_max))
          else:
              hy_txt = 'NOT MEASURED (no reverse leg reduced)'
          verdict = g.get('decision') or 'NO GATE VERDICT'
          # n<2 has no replicate mean, but the per-replicate cycle value(s) DO exist and printing only "None"
          # invited reading a measured number as absent. Print the point estimate, labelled as one.
          reps = g.get('per_replicate_ddg_coop_kcal')
          pt = ('[' + ', '.join(num(r) for r in reps) + ']') if isinstance(reps, list) and reps else 'none'
          bits = [
              "decision=%s" % verdict,
              "mean_ddG_coop=%s" % num(g.get('mean_ddg_coop_kcal', MISSING)),
              "per_replicate_ddG_coop=%s" % pt,
              "target=%s" % num(g.get('target_kcal', MISSING)),
              "abs_err=%s" % num(g.get('abs_error_kcal', MISSING)),
              "cycle_SD(replicate-SD, NOT MBAR-SE)=%s" % num(g.get('cycle_sd_kcal', MISSING)),
              "n_replicates=%s" % g.get('n_replicates'),
              "diagnostics=%s" % g.get('diagnostics_state', 'KEY ABSENT'),
              "fwd/rev hysteresis: %s" % hy_txt,
          ]
          msg = "valB_mini reduce — " + " | ".join(bits) + ". reason: " + str(g.get('reason'))
          # QUIET REQUIRES **BOTH** A PASSING GATE AND MEASURED, PASSING HYSTERESIS.
          # The gate's `decision` deliberately does NOT incorporate hysteresis -- that lives on
          # calibration_decision -- so keying the annotation level on `decision` alone emits a GREEN NOTICE for a
          # PASS whose preregistered fwd/rev criterion was never measured (hysteresis_ok is None) or was measured
          # and FAILED. That is §B#1 of the guard audit exactly: absent data reading as fine. Caught by exercising
          # this formatter against real reducer output rather than by reading it.
          quiet = (verdict == 'PASS' and hy is True)
          level = 'notice' if quiet else 'error'
          if verdict == 'PASS' and hy is not True:
              msg += (" ** GATE PASSED BUT THE PREREGISTERED FWD/REV CRITERION DID NOT: %s. This is NOT a pass "
                      "of the calibration. **" % hy_txt)
          print("::%s title=REDUCE-VERDICT::%s" % (level, msg))
          PYVERDICT
      - name: Log in to Docker Hub for the pre-baked analysis env (mode=converge)
        # The reviewer's required change #1 (2026-07-17) was BUILT (ternary_fep_convergence.py, engine MODE=converge)
        # but never WIRED: this workflow had no `converge` mode and the reduce step calls the reducer directly
        # rather than the engine's main(), so the mandated seed-0 diagnostics have never actually run. The reducer's
        # _diagnostics_ok() treats an ABSENT report as True, so every valB verdict so far has silently defaulted its
        # convergence requirement to "pass". This step closes that hole. $0 — free runner, no GPU, no VM.
        #
        # NO CONDA SOLVE (CLAUDE.md standing rule, 2026-07-25). This step first shipped with a
        # `mamba-org/setup-micromamba` create of `openfe openmmtools pymbar netcdf4 numpy mdtraj` and burned ~20 min
        # of solve PER RUN, three runs running, while triskit23/ternary-fep already carried that exact stack.
        # Two reasons the image is right, not merely faster:
        #   (1) openfe is REQUIRED, not optional garnish — openmmtools stores each end thermodynamic state as a
        #       serialized class reference and OpenFE's alchemical composable state is one of them, so
        #       read_end_thermodynamic_states() -> deserialize() -> import_module('openfe...') raises
        #       ModuleNotFoundError without it, on the FIRST diagnostic (the MBAR overlap matrix). Evidence: GH run
        #       30155345102, which found the .nc files and died exactly there.
        #   (2) PARITY — Dockerfile.ternaryfep's spec is byte-for-byte the one this workflow's GPU legs build, so
        #       the analysis runs on the SAME openfe/openmmtools/pymbar that PRODUCED the trajectory. A different
        #       pymbar can change the MBAR numbers; an ad-hoc solve here is a silent protocol deviation.
        # Logging in even though the image is public: anonymous Hub pulls from GitHub runners share an IP and get
        # rate-limited.
        if: ${{ github.event.inputs.mode == 'converge' }}
        run: echo "${{ secrets.DOCKERHUB_TOKEN }}" | docker login -u triskit23 --password-stdin
      - name: Convergence analysis of the committed .nc (mode=converge — CPU/runner-only, NO GPU/VM)
        if: ${{ github.event.inputs.mode == 'converge' }}
        run: |
          set -eo pipefail
          BUCKET="${PROJECT}-rbfe-ckpt"; CB="gs://$BUCKET/valB-6hax/commits"; RESULTS="gs://$BUCKET/valB-6hax/results"
          # Analyse EVERY leg of the cycle, not just the ternary one: ddG_coop is a difference, so a broken binary
          # leg falsifies the number exactly as thoroughly as a broken ternary leg. leg_id input is ignored here.
          LEGS="calib_hi_to_lo__ternary_vhl calib_hi_to_lo__binary_vhl calib_hi_to_lo__solvent"
          mkdir -p /tmp/conv
          # LAYOUT-AGNOSTIC DISCOVERY. The commit prefix is keyed by (dt, clig, warmup, salt) and the seed's
          # position in it is not something to guess at: a wrong guessed path returns "no commits" and looks
          # exactly like "the trajectory is gone". So enumerate the whole lane ONCE and let the paths speak.
          echo "=== full recursive listing of the valB lane (path shapes + sizes) ==="
          gcloud storage ls --recursive "gs://$BUCKET/valB-6hax/" 2>/dev/null > /tmp/lane.txt || true
          echo "objects: $(wc -l < /tmp/lane.txt)"
          echo "--- distinct path shapes (digits/hashes collapsed) ---"
          # `| awk 'NR<=40'`, NOT `| head -40`. THIS LINE KILLED THE STEP (GH run 30202753766, exit 2). `head`
          # exits after its 40th line and closes the pipe; `sort` then dies on the write. The exact status varies
          # by coreutils build — measured 2 on the runner and 141 (SIGPIPE) reproducing it locally — and either
          # way `pipefail` propagates it and `set -e` kills the step, right after printing a listing that looks
          # complete. Reproduced: `set -eo pipefail; seq 1 200000 | sort -u | head -40 >/dev/null` exits 141.
          #
          # It is SIZE-DEPENDENT, which is why it ran fine for weeks and then did not. While sort's whole output
          # fits in the 64 KB pipe buffer it finishes writing before `head` exits and nothing errors; once the
          # lane grew past that (the rev leg added ~540 objects and new path shapes) it does not. A truncating
          # `head` in a diagnostic is a latent step-killer that arms itself as the data grows.
          # awk reads its input to EOF and prints only the first 40, so there is no early close to fail on — the
          # failure mode is removed rather than masked with `|| true`, which would have hidden a real sort error.
          sed -E 's#/[0-9a-f]{8,}/#/<hash>/#g; s#iter-[0-9]+#iter-N#g; s#/[0-9]+/#/<n>/#g' /tmp/lane.txt \
            | sed -E "s#^gs://$BUCKET/valB-6hax/##" | sort -u | awk 'NR<=40'
          echo "--- every simulation.nc / .chk in the lane ---"
          grep -aE "\.nc$|\.chk$" /tmp/lane.txt | head -30 || echo "(NONE — no sampler trajectory survives in the lane)"
          echo "--- COMMITTED.json markers ---"
          grep -ac "COMMITTED.json" /tmp/lane.txt || echo 0
          for LEG in $LEGS; do
            echo "=== locating newest committed simulation.nc for $LEG dir=$DIRECTION ==="
            # DIRECTION-KEYED, and it must be. This grepped on $LEG alone and then took the HIGHEST iter-N, so
            # with a fwd leg at production/2000 and a rev leg at production/300 it ALWAYS picked fwd — and named
            # the download dir "${LEG}_sim_shared", dropping the direction, so the report read as the cycle's
            # diagnostics. The reducer consumes exactly that report for diagnostics_ok, so a rev leg's landing
            # would have filed FORWARD convergence as the rev cycle's evidence: section B#2 of
            # research/modalities/ternary-lane-guard-audit-2026-07-25.md, "absent/wrong data reading as measured".
            # Observed live 2026-07-26 8:09 AM: a converge run dispatched for dir=rev analysed the fwd legs at
            # iterations_compared [0, 2000] while the rev leg sat at production/~300.
            #
            # NB binary and solvent are the cycle's SHARED arms and exist only as fwd, so a rev request finds
            # nothing for them. That is reported explicitly and skipped -- never silently substituted, which is
            # the failure this whole block is guarding against.
            ALL=$(grep -a "$LEG" /tmp/lane.txt | grep -aE "/simulation\.nc$" || true)
            if [ "$DIRECTION" = fwd ]; then
              ALL=$(printf '%s\n' "$ALL" | grep -av '_dir' || true)
            else
              ALL=$(printf '%s\n' "$ALL" | grep -a "_dir$DIRECTION" || true)
            fi
            if [ -z "$(printf '%s' "$ALL" | tr -d '[:space:]')" ]; then
              echo "::notice title=CONVERGE no trajectory for this direction::$LEG has no committed simulation.nc under dir=$DIRECTION (binary/solvent are fwd-only shared arms of the cycle). SKIPPING — deliberately NOT falling back to another direction's trajectory."
              continue
            fi
            NEW=$(printf '%s\n' "$ALL" | sed -E 's#/simulation\.nc$##' \
                  | awk -F'iter-' '{printf "%d\t%s\n", (NF>1?$NF+0:0), $0}' | sort -k1,1rn | awk 'NR==1' | cut -f2)
            echo "newest: $NEW"
            # _find_nc_files keys each leg by its parent dir name minus the _sim_shared suffix, so name the
            # download dir after the leg to get a readable tag in the report.
            # the dir name becomes the leg tag in the report, so carry the direction into it (fwd keeps the
            # historical name so existing fwd reports stay comparable)
            DTAG="$LEG"; [ "$DIRECTION" != fwd ] && DTAG="${LEG}_${DIRECTION}"
            DST="/tmp/conv/${DTAG}_sim_shared"; mkdir -p "$DST"
            gcloud storage cp --recursive "$NEW/*" "$DST/" 2>&1 | tail -2 || echo "(download failed for $LEG)"
            ls -la "$DST" | tail -8
            # openmmtools keeps POSITIONS in a SEPARATE checkpoint file, not in simulation.nc. Without it the
            # reporter's checkpoint storage is None and read_sampler_states() dies on None.dimensions (a netCDF4
            # Dataset attribute) — which is exactly how the mandated ligand-escape check failed. So say out loud
            # whether this leg's checkpoint is present, and if it is not in the generation dir, look for it
            # elsewhere UNDER THE SAME COMMIT PREFIX before giving up.
            #
            # SCOPED TO $NEW's OWN PREFIX, not to $LEG. Searching the whole lane for "<leg>.*checkpoint" is the
            # same direction-blind mistake as the simulation.nc discovery above, one level down and worse: the
            # checkpoint carries the POSITIONS that simulation.nc does not, so pairing a rev simulation.nc with
            # a fwd checkpoint feeds the ligand-escape / pose-RMSD diagnostic coordinates from a different
            # trajectory and it reports a confident number about the wrong thing. Deriving the search root from
            # $NEW makes leg, salt, timestep and direction all match by construction.
            CPFX=$(printf '%s' "$NEW" | sed -E 's#/(warmup|production)/iter-[0-9]+$##')
            echo "[files] $(ls -1 "$DST" | tr '\n' ' ')"
            if ! ls "$DST" | grep -qai "checkpoint"; then
              CKP=$(grep -aF "$CPFX/" /tmp/lane.txt | grep -aiE "checkpoint.*\.nc$" | tail -1 || true)
              if [ -n "$CKP" ]; then
                echo "[checkpoint] not in the generation dir; pulling $CKP (same commit prefix as the .nc)"
                gcloud storage cp "$CKP" "$DST/" 2>&1 | tail -1 || true
              else
                echo "[checkpoint] NONE under $CPFX — positions were never retained for THIS trajectory, so the"
                echo "            structural / ligand-escape diagnostic is UNAVAILABLE for this leg by construction."
                echo "            (Deliberately NOT widening the search to the leg's other prefixes: another"
                echo "             direction's or salt's checkpoint is a different trajectory, not a substitute.)"
              fi
            fi
          done
          echo "=== running convergence analysis (CPU, pre-baked ternary-fep image) ==="
          IMG="docker.io/triskit23/ternary-fep:latest"
          docker pull "$IMG"
          echo "--- env the analysis will run in (must match the legs' producing env) ---"
          docker run --rm --entrypoint python "$IMG" -c \
            "import openfe, openmmtools, pymbar; print('openfe', openfe.__version__, '| openmmtools', openmmtools.__version__, '| pymbar', pymbar.__version__)"
          # Mount the CHECKED-OUT research/modalities over the image's baked copy: the image supplies the env, the
          # repo supplies the code. Without this mount the container silently runs whatever code was current at
          # bake time — which would have been the pre-fix analyzer.
          docker run --rm --entrypoint python \
            -v "$PWD/research/modalities:/work/research/modalities" \
            -v /tmp/conv:/tmp/conv \
            -e CKPT_DIR=/tmp/conv -e INPUT_DIR=/tmp/conv \
            -w /work/research/modalities \
            "$IMG" /work/research/modalities/ternary_fep_convergence.py
          sudo chown -R "$(id -u):$(id -g)" /tmp/conv 2>/dev/null || true
          echo "=== [CONVERGE-RESULT] ternary_convergence.json ==="
          cat /tmp/conv/ternary_convergence.json
          # Upload beside the leg results so the NEXT mode=reduce picks it up and its diagnostics_ok stops
          # defaulting to True (the reducer looks for ternary_convergence.json in CKPT_DIR/INPUT_DIR).
          #
          # ⚠ THE FILENAME IS DIRECTION-KEYED, AND IT HAS TO BE. Fixing the *analysis* to be direction-aware left
          # the *output* keyed on nothing: a rev pass analyses only the rev ternary leg (binary and solvent are the
          # cycle's fwd-only shared arms and are skipped), so writing it to the bare name OVERWRITES the fwd
          # cycle's three-leg report — the one the reducer reads for `diagnostics_ok`. The fwd binary and ternary
          # diagnostics would vanish, `diagnostics_complete` would go False, and the gate would route to BORDERLINE
          # on missing data it used to have. Same §B#2 shape as the analysis bug, one level further out, and it
          # would have fired UNATTENDED when the watchdog auto-dispatched converge on the rev leg's landing.
          #
          # fwd keeps the bare name so the reducer and every existing reader are untouched; rev gets a suffix.
          CONVNAME=ternary_convergence.json
          [ "$DIRECTION" != fwd ] && CONVNAME="ternary_convergence_${DIRECTION}.json"; true
          gcloud storage cp /tmp/conv/ternary_convergence.json "$RESULTS/$CONVNAME" 2>/dev/null \
            && echo "[converge] uploaded report to $RESULTS/$CONVNAME (direction=$DIRECTION)" || true
          if [ "$DIRECTION" != fwd ]; then
            echo "::notice title=CONVERGE report is direction-suffixed::direction=$DIRECTION wrote $CONVNAME and did NOT touch ternary_convergence.json, so the fwd cycle's report (which the reducer reads for diagnostics_ok) is intact. This report covers the $DIRECTION ternary leg ONLY — the cycle's binary and solvent arms are fwd-only and were skipped."
          fi
          # LAST, so it is the tail of the job log. The JSON above is ~2500 lines and the handful of numbers
          # that decide anything were being hunted for by eye halfway up it.
          echo "=== [CONVERGE-SUMMARY] ==="
          cat /tmp/conv/ternary_convergence_summary.txt || echo "(no summary written)"
      - name: P-series ligand chemistry + mappability (mode=calibchem - CPU/runner-only, NO GPU/VM)
        # THE $0 BLOCKER ON THE valB CALIBRATOR RESCOPE. Every edge in valb-rescope-design.json is a CANDIDATE
        # until the Ciulli P-series ligand chemistry is in hand: an edge LOMAP/Kartograf cannot map does not
        # converge at any price, and a charge-changing edge needs a different and far more expensive treatment.
        # The prereg records ligand_ccd: null for all five systems, so it has never been fetched.
        # Runs here rather than in the dev sandbox because the sandbox egress proxy 403s RCSB at CONNECT.
        # Uses the PRE-BAKED image (CLAUDE.md: pull, do not solve) - it already carries rdkit + lomap2 +
        # kartograf, i.e. the SAME mapper the production edge would use, at version parity. --network host so
        # the container can reach RCSB.
        if: ${{ github.event.inputs.mode == 'calibchem' }}
        run: |
          set -eo pipefail
          echo "${{ secrets.DOCKERHUB_TOKEN }}" | docker login -u triskit23 --password-stdin
          IMG="docker.io/triskit23/ternary-fep:latest"
          docker pull "$IMG"
          docker run --rm --network host --entrypoint python \
            -v "$PWD/research/modalities:/work/research/modalities" \
            -w /work/research/modalities \
            "$IMG" /work/research/modalities/valb_pseries_chem.py
          sudo chown -R "$(id -u):$(id -g)" research/modalities 2>/dev/null || true
          echo "=== [CALIBCHEM-RESULT] ==="
          cat research/modalities/valb-pseries-chem.json
          # Commit the artifact back. A verdict that exists only in a CI log is a verdict nobody can cite:
          # this file is what turns every edge in the rescope design from a candidate into a decided one.
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add research/modalities/valb-pseries-chem.json
          git commit -m "calibchem: P-series ligand chemistry + mappability from RCSB (run ${GITHUB_RUN_ID})" \
            || { echo "(nothing to commit)"; exit 0; }
          # Rebase before pushing: a concurrent push to the same branch makes this a non-fast-forward, and the
          # first attempt lost exactly that race and swallowed it under a `|| echo`. Fail LOUDLY if it still
          # cannot push -- an artifact that silently did not land is the same defect class as a diagnostic that
          # silently did not measure.
          for i in 1 2 3; do
            git fetch origin "${GITHUB_REF_NAME}" && git rebase "origin/${GITHUB_REF_NAME}" || true
            git push origin "HEAD:${GITHUB_REF_NAME}" && { echo "[calibchem] artifact committed"; exit 0; }
            sleep $((i * 5))
          done
          echo "::error::calibchem artifact could not be pushed after 3 rebase+push attempts"; exit 1
      - name: Leg provenance — what SYSTEM did each landed leg actually run? (mode=provenance — CPU/runner-only, NO GPU/VM)
        # WHY THIS EXISTS. ΔΔG_coop is a DIFFERENCE of legs, so it is meaningless if the legs describe different
        # systems — and the lane has already shipped that exact defect: four rev attempts ran a 146,020-particle
        # v1 build against a fwd leg built at 141,968 and nothing reported it (audit §J.2–J.5).
        #
        # THE HABIT THIS REPLACES is the one that made this step necessary: inferring a leg's setup version from
        # the ABSENCE of a cache directory. An absence is not a measurement — it is the same "absent rendered as
        # a legal good value" shape the lane keeps hitting. The DECISIVE field is the leg's OWN record:
        # `cache_dir` names the setup cache it restored (…__v1 vs …__v2pe) and `n_particles` is its physical
        # fingerprint. Both are already written into every leg_*.json; nothing could read them back without
        # downloading the file by hand, so nobody did.
        #
        # $0, no VM, read-only. Safe to run at any time, including while a leg is billing.
        if: ${{ github.event.inputs.mode == 'provenance' }}
        run: |
          set -uo pipefail
          BUCKET="${PROJECT}-rbfe-ckpt"
          RESULTS="gs://$BUCKET/valB-6hax/results"
          mkdir -p /tmp/prov
          echo "=== leg results in $RESULTS ==="
          gcloud storage ls "$RESULTS/leg_*.json" 2>/dev/null || echo "(none)"
          gcloud storage cp "$RESULTS/leg_*.json" /tmp/prov/ 2>/dev/null || true
          gcloud storage cp "$RESULTS/restraint_*.json" /tmp/prov/ 2>/dev/null || true
          # SECOND SOURCE, and for older legs the ONLY one that can settle it. The leg record only gained
          # `setup_cache_dir`/`n_particles` on 2026-07-25, so every leg that landed before that carries
          # neither. The COMMIT MANIFESTS do: rbfe_spot_checkpoint stamps `system_fingerprint_fields` into
          # every COMMITTED.json, and that dict holds SETUP_CACHE_VERSION verbatim. Fetch the newest manifest
          # per commit prefix.
          for pfx in $(gcloud storage ls "gs://$BUCKET/valB-6hax/commits/" 2>/dev/null); do
            for sub in $(gcloud storage ls "$pfx" 2>/dev/null); do
              M=$(gcloud storage ls "$sub**/COMMITTED.json" 2>/dev/null | tail -1)
              [ -n "$M" ] || continue
              SAFE=$(printf '%s' "$sub" | sed 's#gs://##; s#[/*]#_#g')
              gcloud storage cp "$M" "/tmp/prov/MANIFEST__${SAFE}.json" 2>/dev/null || true
            done
          done
          # ===== THE DECISIVE FINGERPRINT: THE TRAJECTORY'S OWN ATOM COUNT =====
          # Neither the leg records nor the older commit manifests carry SETUP_CACHE_VERSION, so for legs that
          # predate both there is exactly one artifact left that can answer "which system did this actually
          # run?" — the committed .nc itself. Its `atom` dimension IS the particle count, and v1 and v2pe differ
          # (the pre-equilibrated complex is RE-SOLVATED, not merely relaxed: 146,020 vs 141,968 for the
          # ternary). This is a MEASUREMENT, which is the whole point — every other route here is an inference
          # from an absence, and audit J.2-J.5 is the record of what those cost.
          #
          # Reads the netCDF header only, in the PRE-BAKED image (CLAUDE.md: pull, do not solve — and parity
          # matters, an ad-hoc env is a silent protocol deviation). One .nc per commit prefix, oldest generation,
          # because the particle count cannot change within a prefix without OpenFE refusing the restore.
          echo "=== [TRAJECTORY PARTICLE COUNTS] ==="
          echo "${{ secrets.DOCKERHUB_TOKEN }}" | docker login -u triskit23 --password-stdin >/dev/null 2>&1 || true
          docker pull docker.io/triskit23/ternary-fep:latest >/dev/null 2>&1 || echo "(image pull failed — skipping particle counts)"
          mkdir -p /tmp/nc
          for pfx in $(gcloud storage ls "gs://$BUCKET/valB-6hax/commits/" 2>/dev/null); do
            for sub in $(gcloud storage ls "$pfx" 2>/dev/null); do
              # `awk NR<=1`, NOT `head -1`. `head` closes the pipe, `grep` dies on the write, and pipefail +
              # the runner's default `bash -e` turn that into a dead step — which is exactly what killed the
              # first run of this step (GH run 30312344869: "grep: write error: Broken pipe", exit 2). It is
              # SIZE-DEPENDENT, so it lies dormant until the listing outgrows the 64 KB pipe buffer, and a
              # RECURSIVE bucket listing crosses that easily. The identical trap is documented a few hundred
              # lines above for mode=forensic; the existing lint only knew `sort` as a producer, so `grep`
              # walked straight through it. Lint widened in the same commit.
              NC=$(gcloud storage ls --recursive "$sub" 2>/dev/null | grep -aE '\.nc$' | awk 'NR<=1')
              [ -n "$NC" ] || continue
              SAFE=$(printf '%s' "$sub" | sed 's#gs://##; s#[/*]#_#g')
              gcloud storage cp "$NC" "/tmp/nc/${SAFE}.nc" 2>/dev/null || true
            done
          done
          if ls /tmp/nc/*.nc >/dev/null 2>&1; then
            # The probe is a REPO FILE mounted into the image, never inline python and never a heredoc.
            # Inline python at column 0 dedents out of this YAML block scalar and makes the workflow
            # unparseable (GitHub reports a MISSING TRIGGER, so a cron on it silently never fires); a heredoc
            # cannot rescue it because its terminator must also sit at column 0. Both were tried here and both
            # were caught by test_workflows_parse.py. Mounting research/modalities is also what CLAUDE.md
            # requires — without it the container runs the STALE copy baked at image-build time.
            docker run --rm --entrypoint python \
              -v "$PWD/research/modalities:/work/research/modalities" -v /tmp/nc:/tmp/nc \
              docker.io/triskit23/ternary-fep:latest \
              /work/research/modalities/nc_particle_probe.py /tmp/nc || echo "(particle-count probe failed)"
            sudo chown -R "$(id -u):$(id -g)" /tmp/nc 2>/dev/null || true
          else
            echo "  (no committed .nc downloaded)"
          fi
          echo "=== [LEG-PROVENANCE] ==="
          python3 - <<'PY'
          import glob, json, os
          UNREC = 'UNRECORDED'
          rows = []
          for f in sorted(glob.glob('/tmp/prov/leg_*.json')):
              try:
                  d = json.load(open(f))
              except Exception as e:
                  print("  %-52s UNREADABLE (%s)" % (os.path.basename(f), e)); continue
              # THE FIELD IS `setup_cache_dir`. The first cut of this read `cache_dir` -- the name used only in
              # the PRIME marker -- and so reported UNRECORDED for every leg while looking like it had checked.
              # Both are accepted; neither is guessed at.
              cache = d.get('setup_cache_dir') or d.get('cache_dir') or ''
              ver = cache.rstrip('/').split('__')[-1] if cache else UNREC
              rows.append((os.path.basename(f), ver, d.get('n_particles'), d.get('protocol_hash'),
                           d.get('n_windows'), cache))
          if not rows:
              print("  (no leg results downloaded)")
          for name, ver, npart, ph, nw, cache in rows:
              print("  %-52s setup=%-12s particles=%-10s windows=%-4s protocol_hash=%s"
                    % (name, ver, npart, nw, ph))
              print("      setup_cache_dir=%s" % (cache or '(unrecorded)'))

          print("=== [COMMIT-MANIFEST PROVENANCE] (the decisive record for legs older than the leg-record field) ===")
          man_rows = []
          for f in sorted(glob.glob('/tmp/prov/MANIFEST__*.json')):
              try:
                  m = json.load(open(f))
              except Exception as e:
                  print("  %-58s UNREADABLE (%s)" % (os.path.basename(f), e)); continue
              fields = m.get('system_fingerprint_fields') or {}
              pretty = os.path.basename(f)[len('MANIFEST__'):-len('.json')]
              sv = fields.get('SETUP_CACHE_VERSION') or UNREC
              # WHICH LEG this prefix belongs to. The comparison below is only meaningful WITHIN one leg, so
              # the leg id has to come out of the prefix rather than be pooled away.
              _lid = pretty.split('_commits_')[-1]
              for _k in ('__binary_vhl', '__solvent', '__ternary_vhl'):
                  if _k in _lid:
                      _lid = _lid[:_lid.index(_k) + len(_k)]
                      break
              man_rows.append((pretty, sv, fields.get('RBFE_RESTRAIN', ''), m.get('schema'), _lid))
              print("  %-58s SETUP_CACHE_VERSION=%-8s RBFE_RESTRAIN=%-4s schema=%s"
                    % (pretty, sv, fields.get('RBFE_RESTRAIN', '(absent)'), m.get('schema')))
          if not man_rows:
              print("  (no commit manifests found)")

          # ===== THE COMPARABILITY VERDICT IS TRI-STATE, AND ABSENCE IS NOT AGREEMENT =====
          # The first cut computed `set(versions)` and warned only when len > 1. With every leg UNRECORDED that
          # set is the single value {UNRECORDED}, so the check PASSED — silently, on no evidence. That is the
          # exact "absent rendered as a legal good value" defect this whole step was added to stop, reproduced
          # inside the tool meant to stop it. Absence now reports as NOT VERIFIED, loudly, and never as agreement.
          #
          # AND IT IS A PER-LEG COMPARISON, NOT A POOLED ONE. The first cut pooled every version into one set
          # and errored if it held more than one value. That is WRONG and it cried wolf on its own first real
          # run: the binary arm is v1 and the ternary arm is v2pe, and that is not a defect — the arms are
          # DIFFERENT SYSTEMS by construction (the ternary carries a whole extra protein; demanding one
          # particle count across arms is a category error). The mismatch audit J.2-J.5 is about is WITHIN one
          # leg — fwd v2pe against rev v1 of the SAME ternary leg, where the systems are supposed to be
          # identical. A gate that fires on every healthy cycle gets ignored, which is worse than no gate.
          def _legid(name):
              b = name[len('leg_'):] if name.startswith('leg_') else name
              for k in ('__binary_vhl', '__solvent', '__ternary_vhl'):
                  if k in b:
                      return b[:b.index(k) + len(k)]
              return b
          per_leg = {}
          for r in rows:
              if r[1] != UNREC:
                  per_leg.setdefault(_legid(r[0]), set()).add(r[1])
          for r in man_rows:
              if r[1] != UNREC:
                  per_leg.setdefault(r[4], set()).add(r[1])
          conflicts = {k: sorted(v) for k, v in per_leg.items() if len(v) > 1}
          known = {r[1] for r in rows if r[1] != UNREC}
          unknown = [r[0] for r in rows if r[1] == UNREC]
          mknown = {r[1] for r in man_rows if r[1] != UNREC}
          if per_leg:
              print("[provenance] recorded setup version PER LEG: %s"
                    % {k: sorted(v) for k, v in sorted(per_leg.items())})
          if conflicts:
              print("::error title=ONE LEG BUILT FROM TWO DIFFERENT SETUPS::%s — the SAME leg has runs from "
                    "different setup versions. Their systems are supposed to be identical, so these runs must "
                    "NOT be combined or resumed into one another (audit J.2-J.5)." % conflicts)
          elif unknown and not mknown:
              print("::warning title=LEG SETUP VERSION NOT VERIFIED::%d leg(s) record no setup_cache_dir and no "
                    "commit manifest carries SETUP_CACHE_VERSION: %s. This is NOT a pass — it means the question "
                    "cannot be answered from these artifacts. Do NOT infer the version from which setup caches "
                    "happen to exist; an absence is not a measurement. Settle it from the committed trajectory's "
                    "particle count (mode=forensic) before combining these legs."
                    % (len(unknown), ', '.join(unknown)))
          elif unknown:
              # PRINT THE PER-LEG MAP, NOT THE POOLED SET. Saying the manifests "agree on ['v1','v2pe']" reads
              # as if two versions had been agreed on, in the one message whose entire job is precision about
              # what was and was not established. Each leg agrees with ITSELF; that is the claim.
              print("::warning title=LEG SETUP VERSION PARTIALLY VERIFIED::%d leg record(s) are silent (%s). The "
                    "commit manifests DO record a version, and each leg is self-consistent: %s. Treat the "
                    "leg-record silence as unverified, not as agreement — and note a leg absent from that map "
                    "has no recorded version anywhere."
                    % (len(unknown), ', '.join(unknown),
                       {k: sorted(v) for k, v in sorted(per_leg.items())}))
          elif known or mknown:
              print("[provenance] all legs agree on setup version %s — VERIFIED from the artifacts."
                    % sorted(known | mknown))
          print("=== [RESTRAINT REPORTS] ===")
          rp = sorted(glob.glob('/tmp/prov/restraint_*.json'))
          if not rp:
              print("  (none — no restrained leg has landed yet)")
          for f in rp:
              d = json.load(open(f))
              sel = d.get('selection') or {}
              print("  %-52s applied=%s r0_nm=%s r_flat_nm=%s lig=%s prot=%s ss_correction_required=%s"
                    % (os.path.basename(f), d.get('applied'), d.get('r0_nm'), d.get('r_flat_nm'),
                       sel.get('n_contact_ligand_atoms'), sel.get('n_anchor_receptor_atoms'),
                       d.get('standard_state_correction_required')))
          PY
      - name: Reset committed checkpoints (fresh start on timestep change)
        if: ${{ github.event.inputs.mode != 'tail' && github.event.inputs.mode != 'forensic' && github.event.inputs.mode != 'reduce' && github.event.inputs.mode != 'converge' && github.event.inputs.mode != 'calibchem' && github.event.inputs.mode != 'provenance' && github.event.inputs.reset_commits == '1' }}
        run: |
          set -eo pipefail
          BUCKET="${PROJECT}-rbfe-ckpt"
          CB="gs://$BUCKET/valB-6hax/commits/$LEG_ID/$SEED"
          echo "reset_commits=1 -> wiping $CB (a new-timestep run must not resume a stale-dt trajectory)"
          gcloud storage rm --recursive "$CB/" 2>/dev/null && echo "commits wiped" || echo "(no commits to wipe)"
      - name: Provision Spot L4 VM + run ternary-FEP
        if: ${{ github.event.inputs.mode != 'tail' && github.event.inputs.mode != 'forensic' && github.event.inputs.mode != 'reduce' && github.event.inputs.mode != 'converge' && github.event.inputs.mode != 'calibchem' && github.event.inputs.mode != 'provenance' }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}   # only used to ARM the watchdog after a detached provision
        run: |
          set -eo pipefail
          VM="gcp-ternary-${GITHUB_RUN_ID}"
          echo "VM=$VM" >> "$GITHUB_ENV"
          IMG_FAMILY=$(gcloud compute images list --project=deeplearning-platform-release \
            --filter="family~'^common-cu'" --format="value(family)" --sort-by=~creationTimestamp 2>/dev/null | head -1)
          [ -z "$IMG_FAMILY" ] && { echo "::error::no DLVM CUDA image family"; exit 1; }
          BUCKET="${PROJECT}-rbfe-ckpt"
          RESULTS="gs://$BUCKET/valB-6hax/results"
          echo "image=$IMG_FAMILY mode=$MODE leg=$LEG_ID seed=$SEED ref=$GITREF"

          # ===== SPOT COMMIT PREFIX — computed HERE, in the RUNNER, deliberately =====
          # This used to be computed inside the `<<SS` heredoc below, and that was a SILENT WRONG-ANSWER BUG.
          # `<<SS` is UNQUOTED, so unescaped $VAR is expanded by the runner while \$VAR survives to the VM. The
          # old code assigned `DIRSUF` with unescaped $DIRECTION (so the assignment text was written into the
          # script and executed ON THE VM) but consumed `${DIRSUF}` unescaped too (so the RUNNER expanded it,
          # where DIRSUF had never been assigned -> empty). The variable was set in one shell and read in
          # another, and the direction suffix vanished from the prefix with no error anywhere.
          #
          # CONSEQUENCE, observed 2026-07-25 1:41 PM ET: the rev leg restored the FORWARD leg's committed
          # production trajectory at iteration 2000. It only failed because the fwd and rev hybrid Systems have
          # different particle counts, so OpenFE's assert_multistate_system_equality caught it
          # ("Stored checkpoint System particles do not match those of the simulated System"). Had the counts
          # matched, the rev leg would have RESUMED FORWARD SAMPLING AND REPORTED IT AS REVERSE.
          #
          # Every other prefix component (SEED, TIMESTEP_FS, CONSTRAIN_LIG, WARMUP_TS, SALT) is a runner-level
          # env: var, which is exactly why DIRSUF was the only one that silently disappeared. So compute the
          # whole prefix runner-side, keep NOTHING about it deferred to the VM's shell, and pass the finished
          # literal in. The generated startup script then carries the real prefix, auditable by reading it.
          DIRSUF=""; [ "$DIRECTION" != fwd ] && DIRSUF="_dir$DIRECTION"
          # ===== RESTRAINT COMPONENT (2026-07-27) — THE SAME BUG CLASS, WITH NO PARTICLE-COUNT SAFETY NET =====
          # restrain=1 adds a flat-bottom pocket restraint (ternary_restraint.py) to the System before the
          # integrator, so a restrained leg and an unrestrained one are DIFFERENT HAMILTONIANS. Without a prefix
          # component they would share a commit prefix and a re-dispatch would restore the other one's sampling.
          #
          # WHY THIS IS THE MOST DANGEROUS INSTANCE OF THE KEYING BUG THIS LANE HAS HAD (H / L.1 / L.5 / L.6):
          # the fwd/rev collision was caught, by luck, by OpenFE's assert_multistate_system_equality — the two
          # hybrid systems had different PARTICLE COUNTS. Restrained vs unrestrained are IDENTICAL IN COMPOSITION:
          # same atoms, same bonds, same particle count, one extra CustomCentroidBondForce. That check cannot
          # fire. A resumed run would look perfectly healthy at every level the lane inspects and be silently
          # wrong. So the prefix is the guard, and it is asserted in BOTH directions below.
          #
          # ORDER MATTERS: _rst goes BEFORE ${DIRSUF} so the direction stays the TERMINAL component and the
          # end-anchored direction assertion above keeps working unchanged. restrain=0 adds nothing, so every
          # existing prefix stays byte-identical and keeps resuming — the same discipline as fwd getting no
          # _dir suffix.
          RSTSUF=""; [ "$RESTRAIN" = 1 ] && RSTSUF="_rst"
          # ===== AND THE SAME KEY ON THE RESULT FILE — §L.5/§L.6's transferable rule, applied BEFORE it bit =====
          # "Fixing a keying bug is not done until you have asked what ELSE is keyed on the same nothing." The
          # answer here is the leg RESULT, `leg_<leg>_<dir>_r<seed>.json`, which has no restraint component. Two
          # separate failures follow from that, and the second is the destructive one:
          #   1. The idempotent-skip below `ls`es exactly that name. The UNRESTRAINED r0 binary result is
          #      already in the bucket, so a restrained re-run would find it, print
          #      "status=OK (idempotent-skip)", exit after ~37 s having computed nothing, and report success.
          #   2. If it did run, the upload would land under the SAME NAME and OVERWRITE the unrestrained
          #      ΔG_binary — the number the whole r0 cycle is built on — with a different Hamiltonian's result,
          #      leaving no trace that they were ever different calculations.
          # Same discipline as the prefix: restrain=0 keeps the byte-identical name so every existing reader
          # (ternary_fep_reduce, the watchdog's done-check) is untouched; restrain=1 gets its own file.
          RSTTAG="$RSTSUF"
          echo "leg result key: leg_${LEG_ID}_${DIRECTION}_r${SEED}${RSTTAG}.json"
          COMMIT_PREFIX="gs://$BUCKET/valB-6hax/commits/$LEG_ID/${SEED}_dt${TIMESTEP_FS}fs_clig${CONSTRAIN_LIG}_wu${WARMUP_TS}${SALT:+_$SALT}${RSTSUF}${DIRSUF}"
          # ASSERT the direction survived into the prefix, and do it BEFORE provisioning a GPU. This is the check
          # whose absence let the bug above ship: the fix "looked right" and nothing ever verified the result.
          if [ "$DIRECTION" != fwd ]; then
            case "$COMMIT_PREFIX" in
              *_dir"$DIRECTION") : ;;
              *) echo "::error title=COMMIT PREFIX LOST THE DIRECTION::direction=$DIRECTION but the commit prefix is '$COMMIT_PREFIX' — it does not end in _dir$DIRECTION. A leg started now would RESUME THE WRONG DIRECTION'S trajectory. Refusing to provision."; exit 1 ;;
            esac
          fi
          # ASSERT the restraint state, BOTH WAYS. One direction stops a restrained leg resuming an unrestrained
          # trajectory; the other stops an unrestrained leg resuming a restrained one, which is just as wrong and
          # is what a stale `restrain` input on a re-dispatch would do. The pattern is end-anchored through
          # $DIRSUF (empty for fwd, _dirrev for rev), so it cannot be satisfied by an "rst" appearing inside a
          # commit_salt.
          case "$COMMIT_PREFIX" in
            *_rst"$DIRSUF") HAS_RST=1 ;;
            *) HAS_RST=0 ;;
          esac
          if [ "$RESTRAIN" = 1 ] && [ "$HAS_RST" != 1 ]; then
            echo "::error title=COMMIT PREFIX LOST THE RESTRAINT::restrain=1 but the commit prefix is '$COMMIT_PREFIX' — it carries no _rst component. A leg started now would RESUME AN UNRESTRAINED TRAJECTORY under a restrained Hamiltonian. Particle counts are identical so OpenFE cannot catch this. Refusing to provision."; exit 1
          fi
          if [ "$RESTRAIN" != 1 ] && [ "$HAS_RST" = 1 ]; then
            echo "::error title=COMMIT PREFIX CLAIMS A RESTRAINT THAT IS NOT SET::restrain=$RESTRAIN but the commit prefix is '$COMMIT_PREFIX' — it carries an _rst component. An UNRESTRAINED leg would resume the RESTRAINED trajectory. Refusing to provision."; exit 1
          fi
          echo "spot commit prefix (FULL, direction- and restraint-verified): $COMMIT_PREFIX"
          echo "restraint: RBFE_RESTRAIN=$RESTRAIN (prefix component '${RSTSUF:-<none>}')"
          # POINT-OF-USE NOTICE, not a refusal. The standing ruling (audit L.3f) is that only the BINARY arm is
          # re-run restrained: the ternary arm is measured clean (0/12 replicas displaced, both cycles, both
          # directions) and re-running it restrained costs the scarcest resource in the program for an arm with
          # no defect. That is a RULING, not a law of nature — L.3f names the condition that reopens it — so a
          # deliberate restrained ternary leg is allowed and merely says so loudly. Refusing here would make a
          # future decision un-executable without a code change, which is the wrong side to err on.
          case "$RESTRAIN:$LEG_ID" in
            1:*ternary*) echo "::notice title=RESTRAINED TERNARY LEG::restrain=1 on '$LEG_ID'. The standing ruling (ternary-lane-guard-audit-2026-07-25.md L.3f) re-runs ONLY the binary arm restrained — the ternary arm is measured clean in both cycles and both directions. Proceeding because this is a ruling, not a hard rule, but it writes to a NEW _rst prefix and will not be comparable to the existing unrestrained ternary legs." ;;
            1:*solvent*) echo "::notice title=RESTRAINED SOLVENT LEG::restrain=1 on '$LEG_ID', which has no receptor. ternary_restraint refuses to build a restraint with nothing to anchor to, so this leg will run UNRESTRAINED at a _rst prefix — almost certainly not what was meant." ;;
          esac

          cat > /tmp/startup.sh <<SS
          #!/bin/bash
          exec > >(tee /var/log/tfep.log) 2>&1
          set +e
          # BEST-EFFORT SELF-DELETE — ⚠ IT DOES NOT WORK, AND NOTHING MAY BE PLANNED AROUND IT.
          # The trap itself is right: it fires on EVERY exit path (clean finish, NaN, a set-e/pipefail bail, an
          # idempotent-skip exit, an env-build failure), and because the leg runs SYNCHRONOUSLY in the foreground
          # it can never kill a still-running leg. What fails is the API call inside it. Measured 2026-07-27 on
          # gcp-ternary-30215419909: the trap ran and GCE refused it —
          #   ERROR: (gcloud.compute.instances.delete) Could not fetch resource:
          #    - Required 'compute.instances.delete' permission for '.../instances/gcp-ternary-30215419909'
          # It is not a scopes problem (the VM has cloud-platform) and not a crash (ExecMainStatus=0); the SA
          # simply does not hold the permission, contrary to what gcp-gpu-facts.md §6 claimed from 2026-07-22.
          # So a finished leg leaves a RUNNING, idle VM holding GPUS_ALL_REGIONS=1, which blocks every other GCP
          # GPU job on the account. The trap is KEPT because it costs nothing and would start working the moment
          # the IAM binding exists — but THE REAP IS THE CONTROL PLANE'S JOB: ternary-leg-watchdog's DONE branch
          # (research/modalities/watchdog_run.sh) deletes the VM once the leg result lands in GCS. Full evidence
          # and the superseded claim: gcp-gpu-facts.md §6 / §6b.
          _self_delete() {
            local _N _Z
            _N=\$(curl -s -H "Metadata-Flavor: Google" http://metadata.google.internal/computeMetadata/v1/instance/name)
            _Z=\$(curl -s -H "Metadata-Flavor: Google" http://metadata.google.internal/computeMetadata/v1/instance/zone | awk -F/ '{print \$NF}')
            echo "=== SELF-DELETE (trap on EXIT): deleting \$_N in \$_Z ==="
            gcloud compute instances delete "\$_N" --zone="\$_Z" --quiet || echo "self-delete no-op (already gone / no perm)"
          }
          trap _self_delete EXIT
          echo "=== TFEP boot \$(date -u) mode=$MODE leg=$LEG_ID seed=$SEED ==="
          for i in \$(seq 1 40); do nvidia-smi && break || { echo "waiting for GPU driver..."; sleep 10; }; done
          export DEBIAN_FRONTEND=noninteractive
          apt-get update -qq && apt-get install -y -qq git >/dev/null 2>&1
          # env-cache (openfe + gemmi + pdbfixer + biopython for the SMARCA4->SMARCA2 staging); distinct key from
          # the RBFE lane. v2 = adds biopython (smarca2_model alignment) -> forces a one-time rebuild.
          ENV_KEY=\$(echo "$IMG_FAMILY|openfe1.12-am1bcc-gemmi-pdbfixer-biopython-cu126-v2" | sha256sum | cut -c1-16)
          ENV_CACHE="gs://$BUCKET/env-cache/ternary-\$ENV_KEY.tar"
          PY=/tmp/mf/envs/rbfe/bin/python
          USED_CACHE=0
          if gcloud storage cp "\$ENV_CACHE" /tmp/env.tar 2>/dev/null; then
            mkdir -p /tmp/mf/envs && tar -C /tmp/mf/envs -xf /tmp/env.tar 2>&1 | tail -1 && USED_CACHE=1; rm -f /tmp/env.tar
          fi
          if [ "\$USED_CACHE" = 1 ] && \$PY -c "import openfe, openmm, gemmi, rdkit, pdbfixer, Bio" 2>/dev/null; then
            echo "--- env-cache HIT ---"
          else
            echo "--- env-cache MISS -> Miniforge+mamba (~8-13 min) ---"
            curl -fsSL -o /tmp/mf.sh https://github.com/conda-forge/miniforge/releases/latest/download/Miniforge3-Linux-x86_64.sh
            bash /tmp/mf.sh -b -p /tmp/mf 2>&1 | tail -3
            /tmp/mf/bin/mamba create -y -p /tmp/mf/envs/rbfe -c conda-forge \
              python=3.11 "openfe>=1.12" "pydantic>=2" importlib_resources openff-toolkit \
              "ambertools>=23" openmmforcefields openff-nagl openff-nagl-models ocl-icd-system \
              cuda-version=12.6 rdkit lomap2 kartograf gemmi pdbfixer biopython numpy scipy pyyaml netcdf4 google-cloud-storage 2>&1 | tail -20
            if [ -x "\$PY" ] && \$PY -c "import openfe, openmm, gemmi, pdbfixer, Bio" 2>/dev/null; then
              ( cd /tmp/mf/envs && tar -cf - rbfe | gcloud storage cp - "\$ENV_CACHE" 2>&1 | tail -1 ) || echo "(env-cache upload failed; non-fatal)"
            fi
          fi
          [ -x "\$PY" ] || { echo "###TFEPRESULT### TFEP_RESULT status=ENVFAIL ###END###"; sleep 5; exit 0; }
          export PATH=/tmp/mf/envs/rbfe/bin:\$PATH
          echo "import: \$(\$PY -c 'import openfe,openmm,gemmi,rdkit;print(openfe.__version__)' 2>&1)"
          git clone --depth 1 --branch "$GITREF" https://github.com/trimcrae/Rare-cancers /tmp/repo 2>&1 | tail -2
          WORK=/tmp/repo/research/modalities
          IN=/tmp/ternary_in; OUT=/tmp/tout; mkdir -p \$OUT
          # idempotent cross-dispatch skip: a completed real leg already in GCS is not recomputed. The ternary
          # engine is now SPOT-SAFE (execute_hybrid_dag_spot_safe commits MD per-interval to the GCS CommitStore
          # below), so a preempted leg RESUMES from its last committed iteration on re-dispatch — a finished leg
          # is still kept via this skip.
          # DIRECTION-KEYED. This checked for leg_<id>_fwd_r<seed>.json regardless of the direction being run,
          # so a DIRECTION=rev leg found the FORWARD result, declared itself already done, printed
          # status=OK (idempotent-skip) and exited after ~37 s with no MD and no run log. It reported success
          # while computing nothing -- and because the VM cannot self-delete (its SA lacks
          # compute.instances.delete) it then sat as an idle billing zombie holding the single-GPU quota.
          # The result file is leg_<id>_<direction>_r<seed>.json, so the check must name the direction.
          # RESTRAINT-KEYED TOO (see the RSTTAG note in the runner block above): without ${RSTTAG} a restrained
          # re-run finds the UNRESTRAINED result, declares itself done and exits having computed nothing.
          if [ "$MODE" = run ] && [ "$FORCE_RERUN" != 1 ] && gcloud storage ls $RESULTS/leg_${LEG_ID}_${DIRECTION}_r${SEED}${RSTTAG}.json >/dev/null 2>&1; then
            echo "leg ${LEG_ID} dir=${DIRECTION} seed $SEED restrain=$RESTRAIN already in GCS — idempotent skip"
            for k in \$(seq 1 6); do echo "###TFEPRESULT### TFEP_RESULT status=OK run leg=${LEG_ID} dir=${DIRECTION} (idempotent-skip) ###END###"; sleep 3; done
            exit 0
          fi
          [ "$MODE" = run ] && [ "$FORCE_RERUN" = 1 ] && echo "force_rerun=1: bypassing idempotent-skip; a stale leg result (if any) will be overwritten"
          # STAGE CACHE (2026-07-18): staging (RCSB fetch + SMARCA4->SMARCA2 model + assembly) is ~15 min of CPU and
          # runs on every GPU VM before the engine — the last big un-skipped step in the preemption window. It is
          # deterministic per (leg, template, seed) [seed picks the SMARCA2 model: model_idx = seed % n_models], so
          # cache the staged tree to GCS and RESTORE it here. A CPU pre-bake (ternary-setup-prime-cpu.yml) or the
          # first GPU run populates it; every later run downloads it in seconds. Bump v1 if staging code changes.
          mkdir -p \$IN
          # NOTE the backslash escapes: \$STAGE_CACHE must be evaluated ON THE VM. Unescaped ($STAGE_CACHE) the
          # startup heredoc expanded it to EMPTY on the runner, so every restore/upload hit an empty path and the
          # cache silently never worked (every VM re-staged ~9 min with the GPU idle — a pure spot-cost leak).
          STAGE_CACHE="gs://$BUCKET/valB-6hax/stagecache/${LEG_ID}__${TEMPLATE_PDB}__seed${SEED}__v1.tar"
          if gcloud storage cp "\$STAGE_CACHE" /tmp/stage.tar 2>/dev/null && tar -C \$IN -xf /tmp/stage.tar 2>/dev/null; then
            rm -f /tmp/stage.tar
            echo "--- stage-cache HIT: restored \$(find \$IN -type f | wc -l) files (skipped ~15min RCSB+SMARCA2-model staging) ---"
          else
            echo "--- stage $LEG_ID from $TEMPLATE_PDB (stage-cache miss) ---"
            ( cd \$WORK && \$PY ternary_pdb_stage.py --leg-id "$LEG_ID" --template-pdb "$TEMPLATE_PDB" --out \$IN 2>&1 | tail -25 )
            # FILE-based upload + verify (the old 'tar -cf - . | gcloud storage cp -' stdin-stream broke with a
            # partial-write/broken-pipe and never created the object; setup-cache uses file uploads and works). The
            # VM's default compute SA can write the bucket, so this self-populates; later VMs then HIT and skip staging.
            if ( cd \$IN && tar -cf /tmp/stage.tar . ) && gcloud storage cp /tmp/stage.tar "\$STAGE_CACHE" && gcloud storage ls "\$STAGE_CACHE" >/dev/null 2>&1; then
              echo "--- stage-cache WRITTEN + verified: \$STAGE_CACHE ---"
            else
              echo "::warning::stage-cache upload/verify FAILED — next VM will re-stage"
            fi
            rm -f /tmp/stage.tar
          fi
          echo "staged tree:"; find \$IN -type f -printf '  %s B  %p\n' 2>/dev/null
          # v2 (2026-07-19): pre-equil output changed under reviewer conditions 1/2/3 — core-transplant endpoint
          # alignment, exact-FF conditioning, and per-seed independent snapshots. v1 caches (O3A overlay,
          # generator-default charges, shared snapshot) are STALE and must NOT be reused; the version bump
          # forces a clean regenerate per seed.
          PE_CACHE="gs://$BUCKET/valB-6hax/preequilcache/${LEG_ID}__${TEMPLATE_PDB}__seed${SEED}__v2.tar"

          # ===== mode=preequil: plain-MD relax the physical complex -> preequilcache (fixes the softcore warmup NaN) =====
          if [ "$MODE" = preequil ]; then
            echo "--- PRE-EQUIL leg=$LEG_ID charge=$CHARGE_METHOD ns=$PE_NS smoke=$PE_SMOKE seed=$SEED (exact-FF, seeded per replicate) ---"
            ( cd \$WORK && env LEG_ID=$LEG_ID SEED=$SEED CHARGE_METHOD=$CHARGE_METHOD PREEQUIL_NS=$PE_NS PREEQUIL_SMOKE=$PE_SMOKE \
                PREEQUIL_EXACT_FF=1 OPENMM_PLATFORM=CUDA INPUT_DIR=\$IN OUTPUT_DIR=\$OUT \
                \$PY ternary_preequil.py 2>&1 ) | tee /tmp/tfep_run.log
            if [ -f \$OUT/$LEG_ID/preequil_marker.json ]; then
              if [ "$PE_SMOKE" = 1 ]; then
                LINE="TFEP_RESULT status=OK preequil-smoke leg=$LEG_ID (system built + parameterized + relaxed OK; not cached)"
              elif ( cd \$OUT/$LEG_ID && tar -cf /tmp/pe.tar complex.pdb ligands.sdf preequil_marker.json ) \
                   && gcloud storage cp /tmp/pe.tar "\$PE_CACHE" && gcloud storage ls "\$PE_CACHE" >/dev/null 2>&1; then
                LINE="TFEP_RESULT status=OK preequil leg=$LEG_ID cached -> \$PE_CACHE"
              else
                LINE="TFEP_RESULT status=NORESULT preequil leg=$LEG_ID (relaxed but cache upload failed)"
              fi
            else
              LINE="TFEP_RESULT status=NORESULT preequil leg=$LEG_ID tail=\$(grep -iE 'error|abort|Traceback|ABORT' /tmp/tfep_run.log | tail -1 | cut -c1-140)"
            fi
            for k in \$(seq 1 6); do echo "###TFEPRESULT### \$LINE ###END###"; sleep 3; done
            echo "=== PREEQUIL-DONE \$LINE ==="
            exit 0    # EXIT trap self-deletes the VM
          fi

          # ===== use_preequil: overlay the relaxed complex.pdb/ligands.sdf over the raw staged tree (mode=run/endpoint_smoke) =====
          SETUP_VER=v1
          if [ "$USE_PE" = 1 ] && { [ "$MODE" = run ] || [ "$MODE" = endpoint_smoke ]; }; then
            RAW=\$(dirname \$(find \$IN -name complex.pdb | head -1) 2>/dev/null)
            if [ -n "\$RAW" ] && gcloud storage cp "\$PE_CACHE" /tmp/pe.tar 2>/dev/null && tar -C "\$RAW" -xf /tmp/pe.tar 2>/dev/null; then
              SETUP_VER=v2pe   # v2pe: setup built from the v2 (transplant + exact-FF + seeded) pre-equil; v1pe is stale
              echo "--- USE_PREEQUIL: overlaid relaxed complex.pdb/ligands.sdf from \$PE_CACHE into \$RAW; setup cache ver -> \$SETUP_VER ---"
            else
              echo "::error::use_preequil=1 but no preequilcache at \$PE_CACHE (run mode=preequil first)"; exit 1
            fi
          fi

          # ===== mode=endpoint_smoke: EXACT-Hamiltonian physical-endpoint stability test (reviewer condition 2/3, step 3) =====
          if [ "$MODE" = endpoint_smoke ]; then
            echo "--- ENDPOINT-SMOKE leg=$LEG_ID charge=$CHARGE_METHOD (use_preequil=$USE_PE, setup_ver=\$SETUP_VER) ---"
            ( cd \$WORK && env MODE=endpoint_smoke LEG_ID=$LEG_ID SEED=$SEED CHARGE_METHOD=$CHARGE_METHOD \
                OPENMM_PLATFORM=CUDA OPENMM_REQUIRE_CUDA=1 INPUT_DIR=\$IN OUTPUT_DIR=\$OUT CKPT_DIR=\$OUT \
                ENDPOINT_SMOKE_STEPS=\${ENDPOINT_SMOKE_STEPS:-25000} \
                \$PY nr4a3_ternary_fep.py 2>&1 ) | tee /tmp/tfep_run.log
            ESJ=\$OUT/endpoint_stability_${LEG_ID}.json
            if [ -f \$ESJ ]; then
              LINE=\$(\$PY -c "import json;d=json.load(open('\$ESJ'));print('TFEP_RESULT status=OK endpoint_smoke leg=%s all_stable=%s eps=%s'%(d.get('leg_id'),d.get('all_endpoints_stable'),list(d.get('endpoints',{}).keys())))")
              gcloud storage cp \$ESJ $RESULTS/ 2>&1 | tail -1 || true
            else
              LINE="TFEP_RESULT status=NORESULT endpoint_smoke leg=$LEG_ID tail=\$(grep -iE 'error|abort|Traceback|ABORT|NaN' /tmp/tfep_run.log | tail -1 | cut -c1-140)"
              gcloud storage cp /tmp/tfep_run.log "gs://$BUCKET/valB-6hax/postmortem/endpoint_${LEG_ID}_${DIRECTION}_\$(date +%s).log" 2>/dev/null || true
            fi
            for k in \$(seq 1 6); do echo "###TFEPRESULT### \$LINE ###END###"; sleep 3; done
            echo "=== ENDPOINT-SMOKE-DONE \$LINE ==="
            exit 0    # EXIT trap self-deletes the VM
          fi

          # Guard: only these modes legitimately run MD on the VM. Any other mode reaching here is a mis-route
          # (e.g. the old mode=reduce silent-smoke bug) — FAIL LOUDLY rather than burn a GPU on a pointless smoke.
          case "$MODE" in smoke|run|preequil|endpoint_smoke) ;; *) echo "::error::mode=$MODE is not a VM/MD mode — refusing to provision a GPU (did you mean the CPU reduce/tail/forensic path?)"; exit 1;; esac
          TMODE=smoke; [ "$MODE" = run ] && TMODE=run
          # SPOT-SAFE commit store (mode=run only): the MultiState sampling commits per-interval to this versioned
          # GCS prefix so a re-dispatch on a fresh VM RESUMES from the last committed iteration instead of from
          # zero. Keyed by leg+seed+TIMESTEP: MD checkpoints are timestep-specific (OpenFE refuses to resume a
          # checkpoint whose protocol timestep differs — "Sampler in checkpoint does not match Protocol settings"),
          # so a dt change must use a FRESH prefix. This makes changing the timestep automatically start clean
          # (no wipe needed — the runner's gpu-runner@ SA can't delete GCS anyway), the old-dt commits just sit
          # unused. (The setup-cache is NOT dt-keyed: the built System is identical across timesteps.)
          # A rev leg MUST NOT resume the fwd trajectory. The prefix below is keyed by leg+seed+dt+clig+wu+salt
          # and had NO direction component, so DIRECTION=rev with the same leg/seed/dt would have restored the
          # FORWARD committed sampling and reported it as a reverse leg — a silent wrong answer of exactly the
          # kind this lane has produced before. Suffix only when direction != fwd, so every existing fwd
          # prefix stays byte-identical and keeps resuming.
          # The prefix is computed and direction-verified in the RUNNER above (see the long note there) and
          # interpolated here as a finished literal. Do NOT reintroduce a shell assignment for any part of it:
          # a variable assigned on the VM cannot be read by the runner's expansion, which is the bug that made
          # a rev leg restore the fwd trajectory.
          COMMIT_ENV=""
          if [ "\$TMODE" = run ]; then
            COMMIT_ENV="RBFE_SPOT_COMMIT_GCS=$COMMIT_PREFIX RBFE_WARMUP_CKPT_ITERS=8 RBFE_PROD_CKPT_ITERS=40 RBFE_SETUP_CACHE_GCS=gs://$BUCKET/valB-6hax/setupcache"
            # echo the FULL prefix. The old echo stopped at \$SEED and so never showed the suffix -- it was
            # true but useless, and the missing direction was only visible in the Python's own log line.
            echo "spot-safe commit store: $COMMIT_PREFIX"
          fi
          echo "--- ternary-FEP TMODE=\$TMODE leg=$LEG_ID seed=$SEED ---"
          ( cd \$WORK && env MODE=\$TMODE LEG_ID=$LEG_ID SEED=$SEED DIRECTION=$DIRECTION N_WINDOWS=$NWIN \
              CHARGE_METHOD=$CHARGE_METHOD RBFE_TIMESTEP_FS=$TIMESTEP_FS RBFE_CONSTRAIN_LIGAND_CH=$CONSTRAIN_LIG RBFE_WARMUP_TIMESTEP_FS=$WARMUP_TS \
              RBFE_STRICT_PROVENANCE=1 RBFE_RESTRAIN=$RESTRAIN \
              RBFE_WARMUP_ITERS=$WARMUP_ITERS RBFE_PROD_ITERS=$PROD_ITERS RBFE_REQUIRE_PRIMED_SETUP=$REQUIRE_PRIMED RBFE_MIN_STEPS=$MIN_STEPS SETUP_CACHE_VERSION=\$SETUP_VER \
              RBFE_AUTOSTOP_CONVERGENCE=$AUTOSTOP RBFE_AUTOSTOP_MIN_FRAC=$AUTOSTOP_MIN_FRAC \
              OPENMM_REQUIRE_CUDA=1 INPUT_DIR=\$IN OUTPUT_DIR=\$OUT CKPT_DIR=\$OUT \$COMMIT_ENV \
              \$PY nr4a3_ternary_fep.py 2>&1 ) | tee /tmp/tfep_run.log
          # scrape a result + persist
          if [ "\$TMODE" = smoke ] && [ -f \$OUT/smoke.json ]; then
            LINE=\$(\$PY -c "import json;d=json.load(open('\$OUT/smoke.json'));print('TFEP_RESULT status=OK smoke leg=%s env=%s mapped=%s has_protein=%s endpoints=%s->%s match=%s units=%s'%(d.get('leg'),d.get('environment'),d.get('n_mapped_atoms'),d.get('has_protein'),d.get('endpoint_a'),d.get('endpoint_b'),d.get('endpoints_match_requested'),d.get('n_protocol_units')))")
            gcloud storage cp \$OUT/smoke.json $RESULTS/smoke_$LEG_ID.json 2>&1 | tail -1 || true
          elif ls \$OUT/leg_${LEG_ID}_*.json >/dev/null 2>&1; then
            LJ=\$(ls \$OUT/leg_${LEG_ID}_*.json | head -1)
            LINE=\$(\$PY -c "import json;d=json.load(open('\$LJ'));print('TFEP_RESULT status=OK run leg=%s dg_morph=%.3f se=%.3f'%(d.get('leg_id'),d.get('dg_morph_kcal',0),d.get('mbar_se_kcal',0)))")
            # RESTRAINED legs upload under their OWN name so they cannot overwrite the unrestrained ΔG_binary
            # the r0 cycle is built on. Unrestrained keeps the bare `cp … $RESULTS/` it has always used, so the
            # existing path is byte-identical and no reader changes.
            if [ -n "$RSTTAG" ]; then
              gcloud storage cp \$LJ "$RESULTS/leg_${LEG_ID}_${DIRECTION}_r${SEED}${RSTTAG}.json" 2>&1 | tail -1 || true
              echo "::notice title=RESTRAINED LEG RESULT IS A SEPARATE FILE::uploaded as leg_${LEG_ID}_${DIRECTION}_r${SEED}${RSTTAG}.json, NOT over the unrestrained result. ternary_fep_reduce reads the unsuffixed names, so this leg is deliberately NOT folded into the existing cycle automatically — mixing a restrained arm into an unrestrained cycle is a decision, not a default. See ternary-lane-guard-audit-2026-07-25.md L.3f."
            else
              gcloud storage cp \$LJ $RESULTS/ 2>&1 | tail -1 || true
            fi
            # THE RESTRAINT REPORT MUST LEAVE THE VM. rbfe_spot_driver writes restraint.json into the sim
            # unit's SHARED dir, which lives on the instance and dies with it — and the run log is only
            # uploaded on NORESULT, so on a SUCCESSFUL restrained leg the report would be destroyed by the
            # EXIT trap and the ruling in audit L.3f would rest on a file nobody can read. It carries the
            # groups, r0_nm and r_flat_nm, which is exactly what the post-hoc "was the restraint ever
            # engaged?" check needs against the committed trajectory. Direction- and seed-keyed like every
            # other artifact in this lane (L.5/L.6: anything keyed on a dimension must be keyed everywhere
            # the artifact travels).
            RJ=\$(ls \$OUT/*_sim_shared/restraint.json 2>/dev/null | head -1)
            if [ -n "\$RJ" ]; then
              gcloud storage cp "\$RJ" "$RESULTS/restraint_${LEG_ID}_${DIRECTION}_r${SEED}.json" 2>&1 | tail -1 \
                || echo "::warning::restraint report upload FAILED — the only copy dies with this VM"
              echo "--- restraint.json ---"; cat "\$RJ"
            elif [ "$RESTRAIN" = 1 ]; then
              echo "::warning title=RESTRAIN=1 BUT NO RESTRAINT REPORT::no restraint.json under \$OUT/*_sim_shared/. Either the restraint declined to apply (it fails soft and logs why) or the driver hook did not run. This leg ran at an _rst prefix; check the run log before treating it as a restrained result."
            fi
          else
            LINE="TFEP_RESULT status=NORESULT leg=$LEG_ID tail=\$(grep -iE 'error|abort|Traceback|missing' /tmp/tfep_run.log | tail -1 | cut -c1-140)"
          fi
          for k in \$(seq 1 6); do echo "###TFEPRESULT### \$LINE ###END###"; sleep 3; done
          echo "=== TFEP-DONE \$LINE ==="
          # On NORESULT, preserve the post-mortem log off-VM (GCS) BEFORE the EXIT trap deletes the instance — the
          # serial is already streamed to the GH poller, but the full run log is only on the VM. The actual VM
          # deletion is now owned by the _self_delete EXIT trap installed at the top, so it happens on EVERY exit
          # path (including a bail before this point), not just here.
          case "\$LINE" in
            *status=OK*) echo "result in GCS; EXIT trap will delete the VM (avoid idle billing)" ;;
            *) echo "NORESULT: uploading post-mortem log to GCS before the EXIT trap deletes the VM"
               gcloud storage cp /tmp/tfep_run.log "gs://$BUCKET/valB-6hax/postmortem/${LEG_ID}_${DIRECTION}_seed${SEED}_\$(date +%s).log" 2>/dev/null || echo "::warning::POSTMORTEM UPLOAD FAILED — this was the only copy of why the leg died" ;;
          esac
          SS

          # SETUP (openff interchange parameterizing the 146k-atom ternary) is CPU+RAM-bound. g2-standard-4
          # (4 vCPU / 16 GB) ran it ~4x slower (~30 min vs ~8 min) than g2-standard-8 (8 vCPU / 32 GB) — 16 GB
          # is marginal for this system and swaps — and that long setup window is what spot kept preempting.
          # Pin to >=8 vCPU / 32 GB (all still exactly 1x L4, same GPU cost); list a few sizes for spot capacity.
          MACHINES="g2-standard-8 g2-standard-12 g2-standard-16"
          ZONES="us-central1-a us-central1-b us-central1-c us-central1-f"
          # Provisioning model: SPOT by default (standing rule: wait out capacity). 'standard' = on-demand, used
          # ONLY when explicitly authorized for a time-sensitive one-off. GCP REQUIRES --instance-termination-action
          # whenever --max-run-duration is set, so BOTH branches include it (STANDARD supports it too; the old
          # "spot-only" claim was wrong and silently broke on-demand — every on-demand create failed validation and
          # got mislabeled "stocked out"; fixed 2026-07-22). MAXRUN caps VM wall-clock: a 7h cap SILENTLY
          # TERMINATED the ternary calib leg mid-run at iter ~1560 (GCE killed the on-demand VM at exactly
          # --max-run-duration=25200s; NOT a preemption). Spot keeps 7h: it resumes from the per-block checkpoint
          # on any kill, so a short cap only bounds waste on a wedged VM. On-demand L4 can ALSO stock out in
          # us-central1 (our only L4 region), so it waits out capacity like spot (PROV_ROUNDS=22).
          #
          # ON-DEMAND: 72h. Raised 20h -> 40h -> 72h on 2026-07-26 as the arithmetic was actually done.
          #   20h  claimed to "span the WHOLE run uninterrupted". It does not and could not: the figure came from
          #        a 33.91 s/iter rate measured during WARMUP and applied to production.
          #   40h  still short. A full leg is 800 warmup + 2000 production iterations, and at the MEASURED
          #        production cost of ~56.5 s/iter that is ~44 h of MD — so 40h leaves a fresh leg one boundary
          #        SHORT of finishing, which is the worst possible place to put one.
          #   72h  spans a ~44 h leg with ~64 % margin. 604800s (7 d) is also accepted at create (measured,
          #        gcp-quota-check.yml), and is deliberately NOT used: no leg is longer than ~44 h, so the extra
          #        four days buy nothing and only widen the window a totally-unguarded wedge could sit in.
          #
          # WHY THE VALUE MATTERS AT CREATE AND NOWHERE ELSE: GCP refuses to change max-run-duration on a RUNNING
          # instance — "Max run duration cannot be changed while the instance is running" (measured on a decoy,
          # gcp-gpu-facts.md §3b). There is no raising it later, so a cap set too low is a boundary you have
          # already bought.
          #
          # WHY THE BOUNDARY IS EXPENSIVE, and so why this is worth changing: recovery depends on the watchdog
          # cron, and GitHub delivers this repo's crons at ~2-4 h intervals regardless of the requested */15
          # (measured 2026-07-26, and reproduced on an unrelated cron in the same window). So each VM boundary
          # costs 2-4 h of dead wall clock plus a setup cycle, and nothing about a tighter cron expression fixes
          # it. Going 20h -> 40h removes one whole boundary from the running rev leg.
          #
          # AND THE EXPOSURE IS NOT MONEY. On GCP the credits are free and expiring, so the thing a runaway VM
          # actually costs is WALL CLOCK: GPUS_ALL_REGIONS=1 means one wedged VM blocks every other job on the
          # lane. That exposure is bounded by the stall detector, not by MAXRUN — the watchdog reaps a VM whose
          # committed iteration stops advancing after STALL_PASSES, so a wedge is caught in hours regardless of
          # the cap. MAXRUN is the LAST of four guards (EXIT trap + self-delete, gcp-reap-vms.yml, stall
          # detector, then this), which is why it is sized for the science rather than against the failure.
          if [ "$PROVISIONING" = standard ]; then
            PROV_FLAGS="--provisioning-model=STANDARD --instance-termination-action=DELETE"; PROV_ROUNDS=22; MAXRUN=259200s
            echo "PROVISIONING=standard (ON-DEMAND — waits out on-demand-capacity like spot; max-run cap ${MAXRUN}, spans a ~44h leg)"
          else
            PROV_FLAGS="--provisioning-model=SPOT --instance-termination-action=DELETE"; PROV_ROUNDS=22; MAXRUN=25200s
          fi
          # ===== A NON-`run` MODE IS NOT A LEG, AND MUST NOT BE GIVEN A LEG'S CAP =====
          # The 72 h on-demand cap exists for ONE reason: a full leg is 800 warmup + 2000 production iterations
          # at ~56.5 s/iter = ~44 h of MD (ternary-watch.json `_leg_targets`), and GCP refuses to raise
          # max-run-duration on a running instance (gcp-gpu-facts.md 3b), so the cap must be right at create.
          # NOTHING ELSE THIS LANE RUNS IS THAT LONG -- smoke is minutes, preequil is a sub-ns relax,
          # endpoint_smoke is a short stability probe -- and none of them writes the leg result object
          # `leg_<leg>_<dir>_r<seed>[_rst].json`, which is what BOTH reap paths key on (the watchdog's DONE
          # branch and the label-keyed orphan sweep). A detached non-run mode is therefore the one shape that
          # neither the launch guard nor the orphan sweep can retire, and its ONLY bound is this cap.
          # 25200s (7 h) is not a guess: it is the value this lane has run whole SPOT legs under, so it is
          # demonstrably ample for every non-run mode, and it cuts that residual exposure from ~72 h to ~7 h.
          # DELIBERATELY BELOW the `PROV_FLAGS=`/`MAXRUN=` branch lines rather than inside them, so
          # tests/test_gcp_create_flags.py still sees exactly one STANDARD branch spanning a full leg -- the
          # leg cap is unchanged, this only refuses to lend it to something that is not a leg.
          if [ "$MODE" != run ]; then
            MAXRUN=25200s
            echo "mode=$MODE is not a science leg — capping this VM at ${MAXRUN} instead of the leg cap (no leg result object exists for a reaper to key on, so the cap is its only bound)"
          fi
          # PUBLISH THE CAP, DO NOT LET LATER STEPS REMEMBER IT. Every operator-facing message about the
          # detached VM said "7h max-run backstop" — hardcoded, and correct only on the spot branch. The
          # on-demand branch has been 72 h since 2026-07-26, so on 2026-07-26 the launcher told the operator
          # that gcp-ternary-30215419909 would self-destruct within 7 h when its real cap was 259200s. When
          # its self-delete then failed (no compute.instances.delete on the VM's SA — gcp-gpu-facts.md §6),
          # the exposure everyone believed was bounded at 7 h was actually bounded at 72 h, and the VM held
          # the project's only GPU until a human looked. ONE FACT, ONE PLACE: MAXRUN is assigned here and
          # every message downstream reads it. tests/test_gcp_create_flags.py fails if one hardcodes a cap again.
          echo "MAXRUN=$MAXRUN" >> "$GITHUB_ENV"
          # ===== MAKE THE VM SELF-IDENTIFYING — a VM name carries a run id, not a leg =====
          # WHY. The watchdog's orphan path could see a live gcp-ternary-* VM and had NO way to learn which
          # calculation it was running: the name is `gcp-ternary-<GITHUB_RUN_ID>`. So an orphan could only ever
          # be refused (loudly) or reaped blindly (unacceptable — a healthy leg legitimately runs ~44 h, and
          # gcp-reap-vms.yml's own file records a dry_run that would have killed a mid-production leg at age
          # 860 min). Labels close that gap without weakening anything: they let the sweep resolve THIS VM's OWN
          # direction- and restraint-keyed result object and apply the SAME safe rule the DONE branch applies —
          # delete only when that object is already in GCS, i.e. when there is no sampling left to lose.
          # They are metadata only: nothing reads them to decide what to COMPUTE.
          # GCE label values are [a-z0-9_-]{0,63}, so sanitise rather than trust (a bad label fails the CREATE,
          # which would turn a bookkeeping nit into a lost launch).
          _lbl() { printf '%s' "$1" | tr 'A-Z' 'a-z' | tr -c 'a-z0-9_-' '-' | cut -c1-63; }
          LABELS="lane=ternary,tfep-leg=$(_lbl "$LEG_ID"),tfep-dir=$(_lbl "$DIRECTION"),tfep-seed=$(_lbl "$SEED"),tfep-rst=$(_lbl "$RESTRAIN"),tfep-mode=$(_lbl "$MODE"),tfep-run=$(_lbl "$GITHUB_RUN_ID")"
          echo "instance labels: $LABELS"
          provision() {
            local round M Z
            for round in $(seq 1 $PROV_ROUNDS); do   # spot: ~55 min capacity-probe (wait it out); on-demand: fail fast on quota
              for M in $MACHINES; do
                for Z in $ZONES; do
                  # ⛔ NO-GPU BAN (autonomy-state.json -> gpu_spend_prohibited). One gate: research/autonomy/gpu_ban.py.
                  # Inline, immediately above the meter, rather than a job-level step: a step can be reordered away from
                  # the thing it guards, and a relaunch is a NEW PURCHASE (CLAUDE.md §6) that must face it again.
                  python3 "${GITHUB_WORKSPACE:-.}/research/autonomy/gpu_ban.py" --context "gpu-ternary-fep-gcp: GCE GPU VM" || exit 3
                  if gcloud compute instances create "$VM" \
                      --zone="$Z" --machine-type="$M" \
                      $PROV_FLAGS \
                      --max-run-duration=${MAXRUN} --maintenance-policy=TERMINATE --no-restart-on-failure \
                      --labels="$LABELS" \
                      --scopes=cloud-platform --image-family="$IMG_FAMILY" --image-project=deeplearning-platform-release \
                      --boot-disk-size=100GB --metadata-from-file=startup-script=/tmp/startup.sh 2>/tmp/cerr; then
                    ZONE="$Z"; echo "ZONE=$Z" >> "$GITHUB_ENV"; echo "provisioned $M in $Z (round $round)"; return 0
                  fi
                  # Surface the REAL gcloud error (not a blanket 'stocked out'): distinguishes a genuine capacity
                  # stockout (ZONE_RESOURCE_POOL_EXHAUSTED) from quota vs a MALFORMED-request bug (invalid flags).
                  echo "  create failed [$M/$Z]: $(grep -iE 'ERROR|exhausted|quota|exceeded|Invalid|required|termination|not found' /tmp/cerr | head -1 | sed 's/^ *//')"
                  grep -iqE "quota|exceeded" /tmp/cerr && { echo "::error::QUOTA for $M in $Z:"; grep -iE "quota|exceeded" /tmp/cerr | head -1; }
                done
              done
              echo "round $round: L4 ${PROVISIONING:-spot} stocked out; waiting 120s…"; sleep 120
            done
            return 1
          }
          vm_alive() {
            local st; st=$(gcloud compute instances describe "$VM" --zone="$ZONE" --format="value(status)" 2>/dev/null || echo GONE)
            case "$st" in RUNNING|PROVISIONING|STAGING|REPAIRING) return 0 ;; *) echo "  VM status=$st"; return 1 ;; esac
          }

          # DETACHED launcher (default for mode=run — real legs are multi-hour, past the 90-min GH job): provision
          # ONCE and EXIT; the VM runs independently under the $MAXRUN cap set above (spot 25200s, on-demand
          # 259200s — read it from the log, never from memory), streams to serial, writes the leg JSON to GCS
          # results/ on completion. Monitor with gpu-rbfe-gcp-tail (vm=gcp-ternary-<runid>); re-dispatch to
          # resume (idempotent GCS skip above). Teardown is skipped so the VM keeps running.
          # WHAT ACTUALLY REMOVES THE VM WHEN THE LEG FINISHES is the ternary-leg-watchdog's DONE branch
          # (research/modalities/watchdog_run.sh), acting from CI. NOT the in-VM EXIT trap: that trap runs and
          # its delete is REFUSED (measured 2026-07-27, gcp-gpu-facts.md §6).
          DO_DETACH="$DETACH"; [ "$MODE" = run ] && DO_DETACH=1
          if [ "$DO_DETACH" = 1 ]; then
            # ===== THE WATCH ENTRY IS THE TEARDOWN MECHANISM. NO ENTRY -> NO GPU. =====
            #
            # A DETACHED launch buys a VM and exits. Nothing on the VM can switch it off: the in-VM EXIT trap
            # runs and GCE REFUSES the delete (`Required 'compute.instances.delete' permission`, measured
            # 2026-07-27 on gcp-ternary-30215419909 — gcp-gpu-facts.md 6). The ONLY thing that removes a
            # finished leg's VM is the watchdog's DONE branch in research/modalities/watchdog_run.sh, and that
            # branch runs inside a loop over the ENABLED entries of ternary-watch.json. With no enabled entry
            # the watchdog takes its idle exit and DELIBERATELY refuses to delete — correctly, since a watchdog
            # that reaps what it does not recognise is worse than the failure it prevents. gcp-reap-vms.yml is
            # not a backstop either: it has NO `schedule:` and never fires alone.
            #
            # So an unwatched detached leg runs to its create-time --max-run-duration cap ($MAXRUN, 72 h on the
            # on-demand branch), holding GPUS_ALL_REGIONS=1 — every GCP GPU job on the account — and burning
            # expiring trial credit, with a red workflow as the only signal.
            #
            # IT VALIDATES main's COPY, NOT THIS REF'S. ternary-leg-watchdog.yml checks out with NO `ref`, so
            # it always reads the DEFAULT BRANCH's watch list whatever ref the leg was launched from. A watch
            # entry that exists only on a feature branch is not a watcher — that is CLAUDE.md 7's branch-drift
            # bug class, where the artifact lives on the one ref the running workflow does not read.
            if [ "$MODE" = run ]; then
              # ===== THE IDEMPOTENT-SKIP RUNS *FIRST*, AHEAD OF THE WATCH-ENTRY GUARD =====
              #
              # ★★ ORDER IS THE WHOLE FIX (2026-08-01, after this went red on a healthy no-op at 7:31 AM ET
              # on 2026-07-31 and was reported twice before anyone moved the block). The guard asks "WHO WILL
              # REAP THE VM THIS LAUNCH BUYS?" and `exit 1`s with `::error` when the answer is nobody. That
              # question is correct for a launch and MEANINGLESS for a no-op: a dispatch whose result is
              # already in GCS buys no VM, so there is nothing to reap and no watcher is required. Running the
              # guard first therefore turned "this work is already done" into a RED BUILD — and a landed leg
              # is precisely when its watch entry gets set enabled=false, so finishing a leg ARMED the
              # failure. Lanes now tick every 8 minutes; a workflow that goes red on a healthy no-op is how a
              # real failure stops being noticed (CLAUDE.md §4).
              #
              # Reordering cannot weaken the guarantee, and that is the reason it is safe rather than merely
              # convenient: the skip's only outcomes are `exit 0` WITHOUT provisioning, or falling through to
              # the guard unchanged. There is no path on which a VM is created without the guard having
              # passed. The two are also keyed on different things — the skip on the RESULT existing, the
              # guard on a WATCH ENTRY existing — so neither can mask the other.
              #
              # WHY THE SKIP IS HERE AT ALL rather than only inside the VM (unchanged, kept for the record):
              # the VM-side skip provisions an L4, prints "status=OK (idempotent-skip)" after ~37 s, and then
              # — because the VM cannot delete itself — sits RUNNING and idle until its create-time cap. That
              # box is the one shape neither reaper can retire: both the DONE branch and the orphan sweep
              # spare a VM created AFTER its result was written, precisely so a deliberate force_rerun is
              # never destroyed. The honest fix is not another reaper, it is to not make the purchase. Same
              # key expression as the VM-side check (direction- AND restraint-keyed), which stays in place as
              # defence in depth.
              if [ "$FORCE_RERUN" != 1 ] && gcloud storage ls "$RESULTS/leg_${LEG_ID}_${DIRECTION}_r${SEED}${RSTTAG}.json" >/dev/null 2>&1; then
                echo "::notice title=IDEMPOTENT SKIP — NO GPU BOUGHT::leg_${LEG_ID}_${DIRECTION}_r${SEED}${RSTTAG}.json is already in GCS, so this dispatch has nothing to compute. Exiting WITHOUT provisioning — the old behaviour provisioned an L4, skipped on the VM, and left an idle box holding GPUS_ALL_REGIONS=1 until its max-run cap. Pass force_rerun=1 (with a fresh commit_salt) to recompute deliberately."
                exit 0
              fi
              git fetch --depth=1 --quiet origin main 2>/dev/null || true
              MAINWATCH=/tmp/ternary-watch-main.json
              if ! git show FETCH_HEAD:research/modalities/ternary-watch.json > "$MAINWATCH" 2>/dev/null; then
                echo "::error title=CANNOT READ main'S WATCH LIST::could not fetch research/modalities/ternary-watch.json from origin/main, so this launch cannot prove anything would reap its VM. Refusing to provision."
                exit 1
              fi
              python3 research/modalities/gcp_launch_guard.py \
                --watch "$MAINWATCH" --also-watch research/modalities/ternary-watch.json \
                --where "origin/main's ternary-watch.json" \
                --leg-id "$LEG_ID" --seed "$SEED" --direction "$DIRECTION" \
                --commit-salt "$SALT" --timestep-fs "$TIMESTEP_FS" \
                --warmup-timestep-fs "$WARMUP_TS" --use-preequil "$USE_PE" --restrain "$RESTRAIN" \
                || exit 1
            fi
            # FAILOVER GUARD: refuse to provision while another ternary VM is alive, so an on-demand RESUME poll can
            # never double-write the commit prefix a live spot VM owns. Only provisions once the GPU is genuinely
            # free (spot killed). Independent of the GPU quota — a belt to the quota's suspenders.
            if [ "${REFUSE_IF_LIVE:-0}" = 1 ]; then
              LIVE=$(gcloud compute instances list --filter="name~'^gcp-ternary-' AND (status=RUNNING OR status=PROVISIONING OR status=STAGING OR status=REPAIRING)" --format="value(name)" 2>/dev/null | head -3 | tr '\n' ' ')
              if [ -n "$LIVE" ]; then
                echo "refuse_if_vm_live=1 and a ternary VM is already alive ($LIVE) — no-op (the running leg still owns the checkpoint; will resume only once it's gone)"
                exit 0
              fi
              echo "refuse_if_vm_live=1: no live ternary VM -> safe to provision an on-demand resume of the same-salt checkpoint"
            fi
            provision || { echo "::error::no L4 Spot capacity — re-dispatch later (idempotent GCS skip)"; exit 1; }
            echo "DETACHED=1" >> "$GITHUB_ENV"
            echo "DETACHED: $VM launched in $ZONE (max-run cap ${MAXRUN}). Result -> $RESULTS/. Monitor: gpu-rbfe-gcp-tail vm=$VM. This job EXITS now."
            # ARM THE WATCHER NOW, DO NOT WAIT FOR THE CRON. CLAUDE.md 6: a `schedule:` cron does not supervise
            # a billing fleet — GitHub throttles this repo's crons hard (ternary-leg-watchdog.yml asks for */15
            # and delivered gaps of 125/148/177/217/222 min across the 2026-07-27 incident). So the first watch
            # pass over a VM that has just started billing should be minutes away, not hours, and the cheapest
            # way to guarantee that is for the launcher to dispatch it itself. BEST-EFFORT ONLY: this is an
            # improvement in latency, never a safety dependency — the guard above is what makes the VM
            # reapable at all, and a failed dispatch here must not fail a launch that already succeeded.
            gh workflow run ternary-leg-watchdog.yml --ref main 2>&1 \
              && echo "armed: dispatched ternary-leg-watchdog.yml so the first pass runs now rather than at the cron's convenience" \
              || echo "::warning title=WATCHDOG NOT ARMED EARLY::could not dispatch ternary-leg-watchdog.yml; the VM is still watched (its enabled entry was proven above) but the first pass waits for the cron, which this repo delivers at ~2-4 h intervals."
            exit 0
          fi

          MAX_ATTEMPTS=1; [ "$SPOT_SAFE" = 1 ] && MAX_ATTEMPTS=3
          POLL_ITERS=90; [ "$MODE" = run ] && POLL_ITERS=680
          RES=""; OUT=""
          for attempt in $(seq 1 $MAX_ATTEMPTS); do
            if ! vm_alive 2>/dev/null; then
              echo "--- attempt $attempt/$MAX_ATTEMPTS: provisioning $VM ---"
              provision || { echo "::error::no L4 Spot capacity after wait-out budget"; exit 1; }
            fi
            for i in $(seq 1 $POLL_ITERS); do
              OUT=$(gcloud compute instances get-serial-port-output "$VM" --zone="$ZONE" 2>/dev/null || true)
              RES=$(printf '%s' "$OUT" | grep -oE '###TFEPRESULT### .* ###END###' | tail -1 | sed -E 's/^###TFEPRESULT### //; s/ ###END###$//' || true)
              [ -n "$RES" ] && break
              if ! vm_alive; then echo "  VM gone (preempted) attempt $attempt after ~$((i*30))s"; break; fi
              sleep 30
            done
            [ -n "$RES" ] && break
          done
          echo "--- VM serial (filtered tail) ---"
          printf '%s' "$OUT" | grep -aE "import:|nvidia-smi|TFEPRESULT|openfe|OpenMM|mapped|SMOKE|stage|staged|assembly|hybrid|error|Error|Traceback|ABORT|missing" | tail -90 || true
          if [ -z "$RES" ]; then
            echo "::warning::no result marker — serial tail 200:"; printf '%s' "$OUT" | tail -200 || true
            echo "::error::ternary-FEP produced no result"; exit 1
          fi
          echo "RESULT_LINE=$RES" >> "$GITHUB_ENV"
          echo "TFEP RESULT: $RES"

      - name: Teardown (skip for detached — the VM must keep running)
        if: ${{ always() && github.event.inputs.mode != 'tail' && github.event.inputs.mode != 'forensic' && github.event.inputs.mode != 'reduce' && github.event.inputs.mode != 'converge' && github.event.inputs.mode != 'calibchem' && github.event.inputs.mode != 'provenance' }}
        run: |
          # "tail deletes when done" was also untrue: gpu-rbfe-gcp-tail only deletes when a human passes
          # delete=1. Name the thing that actually reaps a finished leg, so nobody plans around a phantom.
          if [ "${DETACHED:-0}" = 1 ]; then echo "detached — leaving $VM up (max-run cap ${MAXRUN:-<unset>}; reaped by ternary-leg-watchdog's DONE branch when the leg result lands, or by hand via gpu-rbfe-gcp-tail delete=1 / gcp-reap-vms mode=reap)"; exit 0; fi
          if [ -n "$VM" ] && [ -n "$PROJECT" ]; then
            gcloud compute instances delete "$VM" --zone="$ZONE" --quiet 2>/dev/null && echo "deleted $VM" || echo "delete no-op"
          fi
      - name: Result summary
        if: ${{ always() && github.event.inputs.mode != 'tail' && github.event.inputs.mode != 'forensic' && github.event.inputs.mode != 'reduce' && github.event.inputs.mode != 'converge' && github.event.inputs.mode != 'calibchem' && github.event.inputs.mode != 'provenance' }}
        run: |
          echo "mode=$MODE leg=$LEG_ID"
          if [ "${DETACHED:-0}" = 1 ]; then echo "🚀 DETACHED: $VM running the leg independently -> GCS; monitor via gpu-rbfe-gcp-tail vm=$VM"; exit 0; fi
          echo "RESULT: ${RESULT_LINE:-<none>}"
          case "${RESULT_LINE:-}" in
            *status=OK*smoke*)          echo "✅ ternary assembly+map+hybrid-topology built on GCP L4 — valB_mini plumbing PROVEN" ;;
            *status=OK*preequil*)       echo "✅ pre-equilibration (exact-FF conditioner + core-transplant endpoints) relaxed + cached" ;;
            *status=OK*endpoint_smoke*) echo "✅ exact-Hamiltonian physical-endpoint stability test ran (see all_stable in the result line)" ;;
            *status=OK*run*)            echo "✅ ternary FEP leg ran end-to-end on GCP L4" ;;
            *ENVFAIL*)                  echo "❌ openfe/gemmi env build failed on the VM" ;;
            *) echo "⚠️ no clean OK result — see serial tail above" ;;
          esac
