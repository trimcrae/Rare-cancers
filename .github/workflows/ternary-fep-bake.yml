name: Ternary FEP image bake (DockerHub)

# Build the portable ternary-RBFE / OpenFE FEP image (research/compute/Dockerfile.ternaryfep) and push it to
# Docker Hub as triskit23/ternary-fep. WHY: (1) reproducibility artifact for the manuscript — one immutable image
# carrying the EXACT frozen conda env the GCP ternary lane builds on the fly; (2) portability — the same image
# runs the ternary cooperativity FEP on Vast / RunPod / Salad / Modal, so the leg is no longer bottlenecked by the
# 1-GPU GCP quota. Public repo -> any provider pulls it unauthenticated.
#
# Run: Actions -> "Ternary FEP image bake (DockerHub)" -> Run workflow (pick a branch via ref). ~15-25 min
# (the micromamba solve of the openfe/ambertools stack dominates). Touches no GPU, no live leg.

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "bake (build+push the image) | parity (measure image vs the GCP lane's solve; no push)"
        default: "bake"
        required: false
      tag:
        description: "image tag to push (in addition to the git-sha tag)"
        default: "latest"
        required: false
      image:
        description: "parity only: which baked image to read"
        default: "triskit23/ternary-fep:latest"
        required: false
      commit:
        description: "parity only: commit the verdict artifact back to the triggering branch"
        default: "true"
        required: false

permissions:
  contents: write

jobs:
  bake:
    if: ${{ (inputs.mode || 'bake') == 'bake' }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      DOCKERHUB_USER: triskit23
      IMAGE: triskit23/ternary-fep
    steps:
      - uses: actions/checkout@v4

      - name: Free up runner disk (the CUDA base + conda solve are large)
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL || true
          df -h / | tail -1

      - name: Log in to Docker Hub
        run: echo "${{ secrets.DOCKERHUB_TOKEN }}" | docker login -u "$DOCKERHUB_USER" --password-stdin

      - name: Build the ternary FEP image
        run: |
          set -euo pipefail
          SHA_TAG="${GITHUB_SHA::12}"
          docker build \
            -f research/compute/Dockerfile.ternaryfep \
            -t "docker.io/${IMAGE}:${{ github.event.inputs.tag }}" \
            -t "docker.io/${IMAGE}:${SHA_TAG}" \
            .

      - name: Push
        run: |
          set -euo pipefail
          SHA_TAG="${GITHUB_SHA::12}"
          docker push "docker.io/${IMAGE}:${{ github.event.inputs.tag }}"
          docker push "docker.io/${IMAGE}:${SHA_TAG}"
          echo "[baked] docker.io/${IMAGE}:${{ github.event.inputs.tag }}  (also :${SHA_TAG})"

  # ═══════════════════════════════════════════════════════════════════════════════════════════════════
  # mode=parity — DOES THE IMAGE ACTUALLY CARRY THE SAME ENV THE GCP LANE SOLVES? Nobody had measured it.
  #
  # ⛔ WHY THIS LIVES HERE AND NOT IN ITS OWN FILE. This workflow already owns "the image and the exact env
  # it carries" — its header calls the image the manuscript's reproducibility artifact on exactly that
  # ground. A separate parity workflow would be a second home for one claim (rule 1), and it also cannot be
  # dispatched from a feature branch: a NEW workflow file 404s until it is on the default branch, while an
  # already-on-main file dispatched with ref=<branch> runs THAT branch's version (CLAUDE.md §6). Measured
  # 2026-08-05 by trying it — the standalone file returned 404 and this one does not.
  #
  # ⛔ WHAT IT TESTS. CLAUDE.md §6 rests the ternary lane's reproducibility argument on PARITY: "analysing an
  # OpenFE trajectory with a different pymbar/openmmtools than PRODUCED it can change the MBAR numbers."
  # Until 2026-08-05 both CLAUDE.md and Dockerfile.ternaryfep asserted this image's mamba spec was
  # BYTE-FOR-BYTE the one gpu-ternary-fep-gcp.yml builds. Token-diffing them showed it is not: identical
  # scientific core, package-for-package and in order, plus four the image adds — netcdf-fortran,
  # openmmtools, boto3, awscli.
  #
  # ⚠ AND THE DIFFERENCE LANDS ON EXACTLY THE PACKAGES THE ARGUMENT IS ABOUT. `openmmtools` and `pymbar` are
  # named in the image and installed by name NOWHERE in the GCP workflow — which still imports both
  # (gpu-ternary-fep-gcp.yml:653) — so there they arrive TRANSITIVELY via `openfe>=1.12`. An explicit
  # unpinned request and a transitive one can resolve to different builds. This job takes the reading. It is
  # $0 (a runner, no GPU, no live leg), so per CLAUDE.md §5 there was never a reason to leave it open.
  #
  # ⚠ IT MUST NOT BE READ AS "the env is correct". It compares two solves TO EACH OTHER. Whether either
  # matches the env that produced any committed .nc is a different question, answered by
  # `gpu-ternary-fep-gcp.yml mode=provenance` against the leg's own recorded setup.
  parity:
    if: ${{ inputs.mode == 'parity' }}
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4

      # ── side A: the baked image, i.e. what a production leg actually runs ──────────────────────────────
      # Log in even for a public image — anonymous pulls share the runner IP and get rate-limited (CLAUDE.md §6).
      - name: Read the image's resolved versions
        env:
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        run: |
          set -euo pipefail
          if [ -n "${DOCKERHUB_TOKEN:-}" ]; then
            echo "$DOCKERHUB_TOKEN" | docker login -u triskit23 --password-stdin
          fi
          docker pull "${{ inputs.image || 'triskit23/ternary-fep:latest' }}"
          # --entrypoint python bypasses the image's autoteardown.py ENTRYPOINT (CLAUDE.md §6).
          docker run --rm --entrypoint python \
            "${{ inputs.image || 'triskit23/ternary-fep:latest' }}" - <<'PY' > /tmp/image.json
          import json, importlib
          out = {}
          for m in ("openfe", "openmmtools", "pymbar", "openmm"):
              try:
                  out[m] = getattr(importlib.import_module(m), "__version__", "present-no-__version__")
              except Exception as e:
                  out[m] = "ABSENT: %s" % type(e).__name__
          print(json.dumps(out))
          PY
          echo "image side:"; cat /tmp/image.json

      # ── side B: the GCP lane's spec — EXTRACTED from that workflow at runtime, never copied ───────────
      # ⭐ THE SPEC IS NOT DUPLICATED HERE, AND THAT IS DELIBERATE (rule 1: one fact, one place). The first
      # draft of this job pasted the create line and added a guard asserting the copy still matched. That is
      # two homes plus a watchdog — and the watchdog was itself buggy (its anchor string matched its own
      # source before it matched the command). A comparison job whose copy of the spec can drift is worse
      # than no job: it reports a confident parity verdict about a spec nothing runs.
      - name: Extract the GCP lane's package list
        run: |
          set -euo pipefail
          python3 - <<'PY' > /tmp/pkgs.txt
          import re, sys
          text = open(".github/workflows/gpu-ternary-fep-gcp.yml").read()
          i = text.index("mamba create -y -p /tmp/mf/envs/rbfe")
          out = []
          for ln in text[i:].split("\n"):
              out.append(ln)
              if not ln.rstrip().endswith("\\"):
                  break
          cmd = " ".join(out)
          cmd = cmd.split("-c conda-forge", 1)[1].split("2>&1")[0].split("&&")[0]
          pkgs = [t.replace('"', "") for t in re.split(r"[\s\\]+", cmd) if t]
          if not pkgs or "openfe" not in " ".join(pkgs):
              sys.exit("⛔ extraction produced no openfe — the GCP create's shape changed; fix this parser, "
                       "do NOT fall back to a hardcoded list")
          # ONE SPEC PER LINE, for `micromamba --file`. NOT a space-joined string expanded by the shell:
          # `openfe>=1.12` unquoted would have `>` parsed as a REDIRECT, and re-quoting it survives word
          # splitting as a literal `"` in the package name. A spec file sidesteps both.
          print("\n".join(pkgs))
          PY
          echo "GCP lane requests $(wc -l < /tmp/pkgs.txt) packages:"; cat /tmp/pkgs.txt

      - name: Solve that spec and read its resolved versions
        run: |
          set -euo pipefail
          curl -fsSL -o /tmp/mm.tar.bz2 https://micro.mamba.pm/api/micromamba/linux-64/latest
          tar -xjf /tmp/mm.tar.bz2 -C /tmp bin/micromamba
          export MAMBA_ROOT_PREFIX=/tmp/mamba
          /tmp/bin/micromamba create -y -p /tmp/gcpspec -c conda-forge --file /tmp/pkgs.txt
          /tmp/gcpspec/bin/python - <<'PY' > /tmp/gcp.json
          import json, importlib
          out = {}
          for m in ("openfe", "openmmtools", "pymbar", "openmm"):
              try:
                  out[m] = getattr(importlib.import_module(m), "__version__", "present-no-__version__")
              except Exception as e:
                  out[m] = "ABSENT: %s" % type(e).__name__
          print(json.dumps(out))
          PY
          echo "gcp-spec side:"; cat /tmp/gcp.json

      - name: Verdict
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, os
          img = json.load(open("/tmp/image.json"))
          gcp = json.load(open("/tmp/gcp.json"))
          # ⛔ THE MBAR-RELEVANT SET. openmm is reported for context but does not decide the verdict: the claim
          # in CLAUDE.md is specifically about pymbar/openmmtools reading a trajectory openfe produced.
          DECIDES = ("openfe", "openmmtools", "pymbar")
          diffs = {k: {"image": img.get(k), "gcp_spec": gcp.get(k)} for k in DECIDES if img.get(k) != gcp.get(k)}
          doc = {
              "_what": "do the baked ternary image and the GCP lane's on-the-fly solve resolve the same "
                       "openfe/openmmtools/pymbar? The parity claim in CLAUDE.md §6 rests on this and it had "
                       "never been measured.",
              "_not_what": "this compares two SOLVES to each other. It says nothing about whether either "
                           "matches the env that produced any committed .nc — that is mode=provenance.",
              "image_ref": os.environ.get("IMAGE_REF", "triskit23/ternary-fep:latest"),
              "image": img, "gcp_spec": gcp,
              "decides_on": list(DECIDES),
              "disagreements": diffs,
              "parity": not diffs,
          }
          doc["sentence"] = (
              "PARITY HOLDS on %s — the image and the GCP spec resolve identical versions, so a leg produced "
              "on one and analysed on the other cannot move an MBAR number through a version difference."
              % ", ".join(DECIDES)
              if not diffs else
              "⛔ PARITY BROKEN: %s. A leg produced on one side and analysed on the other is a silent protocol "
              "deviation. Fix the SPECS (name openmmtools/pymbar explicitly in both, pinned to what the image "
              "resolved) — never soften the claim." % "; ".join(
                  "%s image=%s vs gcp=%s" % (k, v["image"], v["gcp_spec"]) for k, v in sorted(diffs.items())))
          os.makedirs("research/modalities", exist_ok=True)
          with open("research/modalities/ternary-env-parity.json", "w") as fh:
              json.dump(doc, fh, indent=2, sort_keys=True)
              fh.write("\n")
          print(doc["sentence"])
          PY
        env:
          IMAGE_REF: ${{ inputs.image || 'triskit23/ternary-fep:latest' }}

      - name: Publish
        if: ${{ inputs.commit != 'false' }}
        run: |
          set -euo pipefail
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add research/modalities/ternary-env-parity.json
          git diff --cached --quiet && { echo "no change"; exit 0; }
          git commit -m "ternary env parity: image vs the GCP lane's solve (CI)"
          git push origin "HEAD:${GITHUB_REF_NAME}"
