name: EMC tree bridge transport proof
on:
  push:
    branches: ['codex/ci-stage/emc-tree-bridge-20260907']
permissions:
  contents: write
jobs:
  transport-proof:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Verify harmless connector payload
        shell: bash
        run: |
          set -euo pipefail
          test "$(wc -c < .ci-bridge/transport-probe.bin)" = 524288
          echo 'd6714fd9c2a0df60695a3a99feaeb9ab45de852f97c4284ebe856040ede788a1  .ci-bridge/transport-probe.bin' | sha256sum --check
          git rev-parse HEAD
          echo 'CONNECTOR_TRANSPORT_PROBE_PASS=1'
      - name: Prove normal Actions write to isolated task ref
        shell: bash
        run: |
          set -euo pipefail
          git push origin "${GITHUB_SHA}:refs/heads/codex/ci-stage/emc-tree-write-proof-20260907"
          echo 'ACTIONS_CONTENTS_WRITE_PROBE_PASS=1'
