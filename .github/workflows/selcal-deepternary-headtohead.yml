name: DeepTernary — positive ternary control, and the two selcal systems ($0 CPU)

# ═══════════════════════════════════════════════════════════════════════════════════════════════════════
# TWO THINGS, IN THIS ORDER, AND THE ORDER IS THE POINT
# ═══════════════════════════════════════════════════════════════════════════════════════════════════════
# Our Boltz co-folds score DockQ 0.023-0.046 on the target<->VHL interface of 9DTY/9DTX
# (selcal-cofold-dockq.json, two independent instruments). A number that low invites exactly one objection,
# and it is the right one: HAS ANYTHING EVER SCORED HIGH THROUGH THIS HARNESS? Until something has, a
# near-zero reading cannot be told apart from broken plumbing or a scorer that returns ~0 for everything.
#
# 1. POSITIVE CONTROL — DeepTernary on `6HAX_B_A_FWZ`, a VHL/SMARCA2 PROTAC ternary from its OWN shipped
#    benchmark inputs, re-scored by OUR instruments. In-set by construction (2018 deposit, inside the
#    2023-10-14 horizon), so it controls the HARNESS AND THE INSTRUMENTS and NEVER generalisation.
# 2. THE SELCAL ARMS — the same generator on 9DTY/9DTX, with inputs built the way DeepTernary's published
#    unbound protocol actually builds them.
#
# ⛔ THE SELCAL ARMS ARE NOT BLIND, AND THIS FILE SAID THEY WERE UNTIL THE SHIPPED DATA WAS READ. DeepTernary's
# `output.zip` shows the unbound protocol superposes both binaries INTO THE NATIVE TERNARY FRAME and supplies
# the NATIVE degrader pose (its 6HAX ligand.pdb is byte-identical to the native ligand, max deviation 0.000 A
# over 66 heavy atoms). The model still predicts the two proteins' RELATIVE PLACEMENT — protein 2 and the
# ligand are each randomly rotated and translated before the forward pass — but it is GIVEN which pocket on
# each protein the ligand occupies. Measurement and consequences: `selcal_deepternary_frame.py`.
# The leakage check (deepternary-leakage-check.json: 9DTY/9DTX absent from the disclosed exclusion set) still
# holds and still matters; it is necessary for a blind claim, and no longer sufficient for one.
#
# ⚠ Expected result is UNKNOWN. DeepTernary's published 0.62-0.83 figures are on structures INSIDE its
# exclusion set. What justifies the run is that the incumbent sits at 0.023-0.046 and this costs nothing.
#
# ⛔ NO GPU, NO RENTAL. A better score licenses one sentence about generator placement — nothing about NR4A3,
# degradation or selectivity.

on:
  workflow_dispatch:
  push:
    branches: [claude/nr4a1-protac-positive-control-xnszjl]
    paths:
      - .github/workflows/selcal-deepternary-headtohead.yml
      - research/modalities/selcal_deepternary_run.py
      - research/modalities/selcal-deepternary-prep-configs.json
      - research/modalities/selcal_deepternary_score.py
      - research/modalities/selcal_deepternary_frame.py
      - research/modalities/selcal_deepternary_poscontrol.py
      - research/modalities/tests/test_selcal_deepternary_frame.py

permissions:
  contents: write

concurrency:
  group: selcal-deepternary-headtohead
  cancel-in-progress: false

env:
  DT_COMMIT: "827821dccca31a5918bd0355e2d6bf70c072b6dd"

jobs:
  headtohead:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with: { ref: "${{ github.ref_name }}" }
      - uses: actions/setup-python@v5
        with: { python-version: "3.10" }

      # rdkit for the fragment-overlap check; numpy + DockQ for the two scoring instruments.
      - name: Deps
        run: |
          set -eo pipefail
          python -m pip install -q "numpy<2" rdkit pytest DockQ

      - name: Guards hold before anything runs
        run: |
          set -eo pipefail
          python3 -m pytest research/modalities/tests/test_selcal_deepternary_controls.py \
                            research/modalities/tests/test_selcal_deepternary_inputs.py \
                            research/modalities/tests/test_deepternary_leakage_check.py -q

      # Resolve chains from the fetched files and VERIFY the picked fragments really are fragments of the
      # degrader. An arm whose fragment is unrelated is REFUSED here, before a prediction is made, because its
      # score would measure our input error rather than the generator.
      - name: Resolve chains + verify fragments
        run: |
          set -eo pipefail
          mkdir -p "$RUNNER_TEMP/raw"
          python3 research/modalities/selcal_deepternary_run.py \
            --workdir /tmp/selcal_dt \
            --emit-raw "$RUNNER_TEMP/raw" \
            --out research/modalities/selcal-deepternary-prep.json

      # ── PREDICT ────────────────────────────────────────────────────────────────────────────────────────
      # Only arms that PASSED the fragment check are prepped and run. An arm refused above is not run with a
      # worse input "to see" — its score would measure our input error and would be quoted as the generator's.
      - name: Clone DeepTernary at the frozen commit + CPU deps
        run: |
          set -eo pipefail
          cd "$RUNNER_TEMP"
          git clone -q https://github.com/youqingxiaozhua/DeepTernary.git dt
          cd dt && git checkout -q "$DT_COMMIT"
          echo "=== PROVENANCE ==="; git rev-parse HEAD
          grep -viE 'cu121|^torch==|^dgl==|--extra-index-url|--find-links' requirements.txt > requirements-cpu.txt
          pip install -q torch==2.3.1 --index-url https://download.pytorch.org/whl/cpu
          pip install -q dgl==2.3.0 -f https://data.dgl.ai/wheels/torch-2.3/repo.html
          pip install -q -r requirements-cpu.txt
          pip install -q "numpy<2"
          wget -q https://github.com/youqingxiaozhua/DeepTernary/releases/download/v1.0.0/output.zip
          unzip -q output.zip
          # Patches, applied ONCE here so every predict step below runs the same patched file.
          #  (a) device: the script hardcodes 'cuda'; this runner has no GPU.
          #  (b) SEED_NUM 40 -> 16: CPU budget. Reported as best-of-16, never as best-of-40.
          #  (c) ⚠ THE PREDICTIONS ARE OTHERWISE DELETED. `cfg.tmp_dir = tempfile.TemporaryDirectory()` and
          #      the last line of the script is `cfg.tmp_dir.cleanup()` — so `complex_pred_<name>_<seed>.pdb`
          #      exists only while the process runs, and our own two scoring instruments would have found an
          #      empty directory and recorded "no predictions" for a run that predicted fine. Redirect it to
          #      a real directory that survives.
          sed -i "s/^    device = 'cuda'/    device = 'cpu'/" predict_cpu.py
          sed -i 's/SEED_NUM = 40/SEED_NUM = 16/g' predict_cpu.py
          sed -i "s|cfg.tmp_dir = tempfile.TemporaryDirectory()|import types as _t; os.makedirs('predictions', exist_ok=True); cfg.tmp_dir = _t.SimpleNamespace(name='predictions', cleanup=lambda: None)|" predict_cpu.py
          grep -n "device = 'cpu'\|SEED_NUM = 16\|predictions" predict_cpu.py | awk 'NR<=6'

      # ══ THE POSITIVE CONTROL ══════════════════════════════════════════════════════════════════════════
      # ★ RUN THE GENERATOR ON A TERNARY IT IS KNOWN TO RECOVER, THROUGH OUR HARNESS, BEFORE ASKING IT
      # ABOUT OURS. `output.zip` ships DeepTernary's OWN complete unbound inputs for its 22-case PROTAC
      # benchmark, and `6HAX_B_A_FWZ` is a VHL/SMARCA2 PROTAC ternary — the same E3 and the same target
      # family as the two systems this lane cares about. Nothing needs preparing: the inputs are theirs.
      #
      # What a high score here does and does NOT license:
      #   ✅ it proves THIS harness (CPU torch/dgl build, patched script, checkpoint, seeds) produces real
      #      ternary predictions, and that a DockQ near 1 is reachable through it — so a near-zero score
      #      downstream is a statement about the input or the system, not about the plumbing;
      #   ⛔ it is NOT evidence of generalisation. 6HAX was deposited in 2018, long inside DeepTernary's
      #      2023-10-14 data horizon, so it is a memorisation-permitting case by construction. It is a
      #      POSITIVE CONTROL ON THE INSTRUMENT, and must never be quoted as blind performance.
      - name: Positive control — the generator on a ternary it already knows (6HAX, VHL/SMARCA2)
        run: |
          set -eo pipefail
          cd "$RUNNER_TEMP/dt"
          echo "6HAX_B_A_FWZ" > data/PROTAC/protac22.txt
          python3 predict_cpu.py output/checkpoints/PROTAC \
            --config deepternary/configs/protac.py \
            --checkpoint output/checkpoints/PROTAC/checkpoint.pth 2>&1 | tail -30
          mkdir -p "$RUNNER_TEMP/poscontrol"
          cp -r predictions "$RUNNER_TEMP/poscontrol/" 2>/dev/null || true
          rm -rf predictions

      # Scored a SECOND time by OUR instruments, not DeepTernary's, against the same deposited reference —
      # because the number our lane will quote for the selcal arms comes from our instruments, and a positive
      # control that only exercises the author's scorer does not control the scorer we actually use.
      - name: Positive control — re-score it with OUR two instruments
        continue-on-error: true
        run: |
          set -eo pipefail
          python3 research/modalities/selcal_deepternary_poscontrol.py \
            --pred-dir "$RUNNER_TEMP/poscontrol/predictions" \
            --native "$RUNNER_TEMP/dt/output/protac22/6HAX_B_A_FWZ/gt_complex.pdb" \
            --out research/modalities/selcal-deepternary-poscontrol.json
          python3 -c "
          import json
          d = json.load(open('research/modalities/selcal-deepternary-poscontrol.json'))
          print(d['sentence'])
          "

      - name: Prep the six blind input files per ready arm
        run: |
          set -eo pipefail
          python3 -c "
          import json, sys
          d = json.load(open('research/modalities/selcal-deepternary-prep.json'))
          json.dump(d['ready_configs'], open('$RUNNER_TEMP/ready.json','w'), indent=1)
          print('ready arms:', [c['name'] for c in d['ready_configs']])
          sys.exit(0 if d['ready_configs'] else 3)
          "
          cd "$RUNNER_TEMP/dt"
          # Pre-populate the prep module's `_raw` cache with the converted structures so its PDB-only
          # fetch never runs — 9DU0 and 9DTY are mmCIF-only and its .pdb request 404s.
          python3 -c "
          import json, os, shutil
          for c in json.load(open('$RUNNER_TEMP/ready.json')):
              d = os.path.join('output/protac22', c['name'], '_raw'); os.makedirs(d, exist_ok=True)
              for k in ('poi_binary_pdb','e3_binary_pdb','native_pdb'):
                  src = os.path.join('$RUNNER_TEMP/raw', c[k].upper() + '.pdb')
                  if os.path.exists(src): shutil.copyfile(src, os.path.join(d, c[k].upper() + '.pdb'))
              print(c['name'], sorted(os.listdir(d)))
          "
          python3 "$GITHUB_WORKSPACE/research/modalities/deepternary_blind_prep.py" \
            --configs "$RUNNER_TEMP/ready.json" \
            --base output/protac22 \
            --out "$RUNNER_TEMP/blind_prep_status.json"
          cat "$RUNNER_TEMP/blind_prep_status.json"
          # ⚠ `prep_control` reports ok:true on a ligand file that exists with ZERO atoms — measured on run
          # 30752845188, where unbound_lig1 extracted 0 atoms (a truncated residue name) and the contract
          # check passed because it tests existence and size, not content. Assert the atom counts.
          python3 -c "
          import json, sys
          st = json.load(open('$RUNNER_TEMP/blind_prep_status.json'))
          bad = [(r['name'], k, v) for r in st for k, v in r['steps'].items()
                 if k.startswith('unbound_') and isinstance(v, int) and v == 0]
          print('zero-atom inputs:', bad or 'none')
          sys.exit(5 if bad else 0)
          "
          # ⚠ THE LAST LINK. `extract_ligand` copies the ligand's HETATM lines only, stripping the CONECT
          # records the conversion had just added — so RDKit gets a novel HETATM with no bonds and
          # `MolFromPDBFile` returns None. Re-append them here, serials renumbered to these files' own
          # numbering, bonds still sourced from the CCD rather than guessed from distances.
          python3 "$GITHUB_WORKSPACE/research/modalities/selcal_deepternary_run.py" \
            --configs "$RUNNER_TEMP/ready.json" \
            --workdir /tmp/selcal_dt \
            --fix-ligand-conect output/protac22 \
            --out "$RUNNER_TEMP/conect_fix.json"
          python3 -c "
          from rdkit import Chem
          import json, sys
          bad = []
          for c in json.load(open('$RUNNER_TEMP/ready.json')):
              for f in ('unbound_lig1.pdb','unbound_lig2.pdb'):
                  p = 'output/protac22/%s/%s' % (c['name'], f)
                  m = Chem.MolFromPDBFile(p, removeHs=False, sanitize=True)
                  print(f, c['name'], 'READABLE' if m else 'UNREADABLE')
                  if m is None: bad.append(p)
          sys.exit(3 if bad else 0)
          "

      # ★★ THE STEP THE BLIND PREP WAS MISSING, AND WHY IT WAS MISSING — MEASURED, NOT INFERRED.
      # Runs 30753431082 / 30754028742 both died at
      #     replace_to_unbound_coords ->  assert cdist.min(dim=1)[0][update_mask].max() < 1
      #     RuntimeError: max(): Expected reduction dim to be specified for input.numel() == 0
      # `update_mask = cdist.min(dim=1)[0] < 1` selects degrader atoms lying within 1 Å of a supplied
      # fragment atom. Our `ligand.pdb` was the CCD IDEAL conformer in an arbitrary frame, so nothing was
      # within 1 Å of anything, the mask was empty, and the reduction died. The empty tensor was never a
      # model bug: it was the model correctly reporting that nothing had been positioned.
      #
      # ⚠ AND THE FIX IS NOT A CONSTRAINED EMBED — that was the next guess, and DeepTernary's own shipped
      # data refutes it. `output.zip` contains the complete unbound inputs for all 22 benchmark cases, and
      # in `6HAX_B_A_FWZ`: `ligand.pdb` is byte-identical to the FWZ ligand of `gt_complex.pdb` (max
      # deviation 0.000 Å over all 66 heavy atoms), `unbound_protein1.pdb` (a different entry, chain I,
      # 1150 atoms) has centroid (-21.6, 17.3, -20.3) against the native POI's (-21.3, 17.6, -20.7), and
      # `unbound_protein2.pdb` matches the native E3 the same way. So the published UNBOUND protocol
      # superposes each unbound binary INTO THE NATIVE TERNARY FRAME and supplies the NATIVE degrader pose;
      # 33 of 66 ligand atoms then fall within 1 Å of unbound_lig1 and 18 within 1 Å of unbound_lig2.
      #
      # ⛔ SO THIS ARM IS NOT BLIND TO WHERE THE TWO LIGAND ENDS SIT, AND MUST NEVER BE DESCRIBED AS IF IT
      # WERE. What the model is still genuinely asked to predict is the RELATIVE PLACEMENT of the two
      # proteins: `predict_one_unbound` applies an independent random rotation+translation to protein 2 and
      # to the ligand before the forward pass, so the native arrangement is destroyed in the input and the
      # architecture is an output. What it is GIVEN is which pocket on each protein the ligand occupies.
      # That is a weaker question than the one our Boltz co-folds were asked (sequence + ligand, nothing
      # else) — recorded here so the two numbers are never set side by side as if they were the same test.
      - name: Build DeepTernary's own unbound inputs for the selcal arms (native-frame, NOT blind)
        run: |
          set -eo pipefail
          cd "$RUNNER_TEMP/dt"
          # ★ FIRST: does the builder reproduce the AUTHORS' construction, on the AUTHORS' data? Measure the
          # two snap masks as shipped for 6HAX_B_A_FWZ; throw their superposition away (displace each unbound
          # structure by 63° / ~40 Å); re-derive the frame here; measure again. Identical counts mean this is
          # the same construction. No pinned number is compared against, so it cannot pass by being tuned to
          # a remembered figure. Measured offline before commit: p1 33->33, p2 18->18.
          python3 "$GITHUB_WORKSPACE/research/modalities/selcal_deepternary_frame.py" \
            --reproduce-reference output/protac22/6HAX_B_A_FWZ
          python3 "$GITHUB_WORKSPACE/research/modalities/selcal_deepternary_frame.py" \
            --configs "$RUNNER_TEMP/ready.json" \
            --base output/protac22 \
            --native-dir /tmp/selcal_dt \
            --workdir /tmp/selcal_dt \
            --ideal-dir data/TernaryDB/ligand_ideal \
            --out "$GITHUB_WORKSPACE/research/modalities/selcal-deepternary-frame.json"

      - name: Predict the selcal arms (CPU, 16 seeds)
        continue-on-error: true
        run: |
          set -eo pipefail
          cd "$RUNNER_TEMP/dt"
          python3 -c "
          import json
          rows  = json.load(open('$GITHUB_WORKSPACE/research/modalities/selcal-deepternary-frame.json'))
          names = [r['arm'] for r in rows if r['ok']]
          open('data/PROTAC/protac22.txt','w').write('\n'.join(names) + '\n')
          print('test list:', names)
          print('refused  :', [(r['arm'], r['why']) for r in rows if not r['ok']])
          "
          python3 predict_cpu.py output/checkpoints/PROTAC \
            --config deepternary/configs/protac.py \
            --checkpoint output/checkpoints/PROTAC/checkpoint.pth 2>&1 | tail -60

      # ── SCORE ──────────────────────────────────────────────────────────────────────────────────────────
      # Scored by the SAME two instruments, against the SAME deposited reference, as our own co-folds were.
      - name: Score the predictions against the sealed native
        if: ${{ always() }}
        run: |
          set -eo pipefail
          mkdir -p /tmp/dt_pred
          find "$RUNNER_TEMP/dt/predictions" -name 'complex_pred_*.pdb' 2>/dev/null | awk 'NR<=200' > /tmp/dt_pred/list.txt || true
          echo "predicted complexes found: $(wc -l < /tmp/dt_pred/list.txt)"
          python3 research/modalities/selcal_deepternary_score.py \
            --pred-root "$RUNNER_TEMP/dt/predictions" \
            --native-dir /tmp/selcal_dt \
            --arm-root "$RUNNER_TEMP/dt/output/protac22" \
            --out research/modalities/selcal-deepternary-headtohead.json || true
          test -f research/modalities/selcal-deepternary-headtohead.json && \
            python3 -c "import json;print(json.dumps(json.load(open('research/modalities/selcal-deepternary-headtohead.json')).get('verdict'), indent=1))"

      - name: Publish whatever was established
        if: ${{ always() }}
        env:
          PUBLISH_IF_CHANGED: "1"
        run: |
          set -eo pipefail
          sudo chown -R "$(id -u):$(id -g)" research/modalities 2>/dev/null || true
          bash research/compute/publish_artifacts.sh "${{ github.ref_name }}" \
            "selcal DeepTernary: positive control on 6HAX + native-frame inputs for the selcal arms (CI)" \
            research/modalities/selcal-deepternary-poscontrol.json \
            research/modalities/selcal-deepternary-frame.json \
            research/modalities/selcal-deepternary-prep.json \
            research/modalities/selcal-deepternary-prep-configs.json \
            research/modalities/selcal-deepternary-headtohead.json
