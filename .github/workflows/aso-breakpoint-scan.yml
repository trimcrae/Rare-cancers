name: EWSR1::NR4A3 ASO breakpoint-sensitivity scan

# Sweeps the modelled in-frame EWSR1::NR4A3 breakpoint and asks whether some seams are far more
# favorable (lower GC, lower complexity, more parent-specific) for a junction ASO/siRNA than the
# off-target-prone canonical (264/2) breakpoint — informing breakpoint/patient selection. Pure
# stdlib + urllib; needs internet (NCBI E-utilities) so it runs on a GitHub-hosted runner.
# Result JSON is pushed to the `modalities-cache` branch:
#   git fetch origin modalities-cache && git checkout modalities-cache -- research/modalities/

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: aso-breakpoint-scan
  cancel-in-progress: true

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # ⭐ THE SURGICAL QUESTION: did PMID 12378528 (Panagopoulos 2002, the 18-case series behind the
      # whole within-partner breakpoint distribution) and PMID 29937513 deposit sequences? The
      # committed sweep recorded elink only as BATCH totals, so it cannot say whether either paper
      # was ever answered. This asks each PMID alone and checks the id NCBI echoes back, so a zero
      # is a MEASURED zero for a NAMED paper. Runs FIRST so a failure in the older scan cannot cost
      # us the answer.
      - name: Per-PMID elink probe (12378528, 29937513) — nuccore and protein, each asked alone
        working-directory: research/modalities
        run: python panagopoulos_elink_probe.py --fetch

      - name: EWSR1::NR4A3 junction breakpoint-sensitivity scan (stdlib only)
        continue-on-error: true
        working-directory: research/modalities
        run: python junction_breakpoint_scan.py

      # A second, independent home for the answer. The publish step below rewrites the working tree
      # onto another branch, so if anything there goes wrong the result would exist nowhere.
      - name: Upload probe result as a run artifact (redundant home)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: panagopoulos-elink-probe
          path: research/modalities/panagopoulos-elink-probe.json
          if-no-files-found: warn

      - name: Publish results to modalities-cache branch
        if: always()
        run: |
          set -e
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          mkdir -p "$RUNNER_TEMP/res"
          cp research/modalities/junction-breakpoint-scan.json "$RUNNER_TEMP/res/" 2>/dev/null || true
          cp research/modalities/panagopoulos-elink-probe.json "$RUNNER_TEMP/res/" 2>/dev/null || true
          git fetch origin modalities-cache || true
          rm -f research/modalities/*.json research/modalities/*.png
          if git show-ref --verify --quiet refs/remotes/origin/modalities-cache; then
            git checkout -B modalities-cache origin/modalities-cache
          else
            git checkout --orphan modalities-cache
            git rm -rf . >/dev/null 2>&1 || true
          fi
          mkdir -p research/modalities
          cp "$RUNNER_TEMP"/res/*.json research/modalities/ 2>/dev/null || true
          git add research/modalities/junction-breakpoint-scan.json 2>/dev/null || true
          git add research/modalities/panagopoulos-elink-probe.json 2>/dev/null || true
          git commit -m "ASO breakpoint scan + per-PMID elink probe (12378528, 29937513)" || { echo "no changes"; exit 0; }
          git push origin modalities-cache
