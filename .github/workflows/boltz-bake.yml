name: Boltz image bake (DockerHub)

# Build `research/compute/Dockerfile.boltz` and push it as `triskit23/boltz`. $0 — a free GitHub runner, no
# GPU, no Vast rental, nothing is billed. Touches no live leg.
#
# ⛔ WHY: CLAUDE.md §6 — never build an environment on a machine we are paying for. Measured 2026-08-06:
# `grep -l boltz research/compute/Dockerfile.*` returned NOTHING, while the repo's only Vast co-fold lane
# (`nrv04_vast_launch._COFOLD_PIPELINE`) apt-gets and pip-installs boltz + cuequivariance onto the BILLING
# host off stock pytorch/pytorch, and then pays for Boltz's ~3 GB weight download too. Rung `R13-b`'s own
# plan cell says "Vast, baked image" — this is the image that cell asserts and the repo did not have.
#
# The bake ASSERTS its own completeness: Dockerfile.boltz refuses to write `/opt/boltz/BAKED` unless the
# weight cache is a plausible size, because a truncated CCD reached inference once before and failed six
# seeds on a missing cysteine (CLAUDE.md §6).
#
# Run: Actions -> "Boltz image bake (DockerHub)" -> Run workflow.

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "image tag to push (in addition to the git-sha tag)"
        default: "latest"
        required: false
      boltz_spec:
        description: "pip spec — keep it equal to nrv04_vast_launch.BOLTZ_SPEC or the lanes stop sharing a predictor"
        default: "boltz==2.2.1"
        required: false

permissions:
  contents: read

concurrency:
  group: boltz-bake
  cancel-in-progress: false

jobs:
  bake:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      DOCKERHUB_USER: triskit23
      IMAGE: triskit23/boltz
    steps:
      - uses: actions/checkout@v4

      - name: Free up runner disk (the CUDA base + the baked weights are large)
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL || true
          df -h / | tail -1

      # Log in even though the repo is public: anonymous pulls share the runner IP and get rate-limited.
      - name: Log in to Docker Hub
        run: echo "${{ secrets.DOCKERHUB_TOKEN }}" | docker login -u "$DOCKERHUB_USER" --password-stdin

      # ★ A BAKED IMAGE THAT FLOATS AWAY FROM THE LANE'S PIN MAKES "the same predictor on either provider"
      # UNTRUE — the parity argument CLAUDE.md §6 makes for the ternary image. So the spec is READ from the
      # launcher rather than remembered, and a disagreement fails the bake instead of shipping quietly.
      - name: Pin check — the baked spec must equal nrv04_vast_launch.BOLTZ_SPEC
        env:
          GOT: ${{ github.event.inputs.boltz_spec }}
        run: |
          set -euo pipefail
          WANT=$(python3 -c 'import re,sys; s=open("research/modalities/nrv04_vast_launch.py").read(); m=re.search(r"BOLTZ_SPEC\s*=\s*os\.environ\.get\(\"BOLTZ_SPEC\"\)\s*or\s*\"([^\"]+)\"", s); print(m.group(1) if m else "")')
          echo "launcher pins: '$WANT' | this bake: '$GOT'"
          if [ -n "$WANT" ] && [ "$WANT" != "$GOT" ]; then
            echo "::error::bake spec '$GOT' != nrv04_vast_launch.BOLTZ_SPEC '$WANT' — a baked image that floats away from the lane's pin makes 'same predictor across providers' untrue."
            exit 1
          fi

      - name: Build
        run: |
          set -euo pipefail
          SHA_TAG="${GITHUB_SHA::12}"
          docker build \
            --build-arg BOLTZ_SPEC="${{ github.event.inputs.boltz_spec }}" \
            -f research/compute/Dockerfile.boltz \
            -t "docker.io/${IMAGE}:${{ github.event.inputs.tag }}" \
            -t "docker.io/${IMAGE}:${SHA_TAG}" \
            .

      - name: Verify the image says of itself that it is baked
        run: |
          set -euo pipefail
          docker run --rm --entrypoint bash "docker.io/${IMAGE}:${{ github.event.inputs.tag }}" -lc '
            test -f /opt/boltz/BAKED || { echo "no /opt/boltz/BAKED marker"; exit 1; }
            cat /opt/boltz/BAKED
            python -c "import boltz, torch; print(\"boltz\", boltz.__version__ if hasattr(boltz,\"__version__\") else \"?\", \"torch\", torch.__version__)"
            du -sh "$BOLTZ_CACHE"
          '

      - name: Push
        run: |
          set -euo pipefail
          SHA_TAG="${GITHUB_SHA::12}"
          docker push "docker.io/${IMAGE}:${{ github.event.inputs.tag }}"
          docker push "docker.io/${IMAGE}:${SHA_TAG}"
          echo "[baked] docker.io/${IMAGE}:${{ github.event.inputs.tag }}  (also :${SHA_TAG})"
