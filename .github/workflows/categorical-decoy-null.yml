name: C02 decoy null + C04 paralogue pocket contrast (CPU, $0)

# TWO $0 CPU INSTRUMENT CALIBRATIONS. No GPU, no rental, no SageMaker, no AWS credentials.
#
#   C04  research/modalities/paralogue_pocket_contrast.py
#        The harmonized cryptic-pocket detector, pointed for the first time at the NR4A1/NR4A2 conformer
#        ensembles that have been COMMITTED to this repo since 2026-07-26. Every frame is already on disk
#        (`git ls-files results` -> 2,082); the only thing this job adds is fpocket. NR4A3's own 100 frames
#        are re-scored in the SAME job so the contrast is matched under ONE fpocket build — the committed
#        table records fpocket 4.0 and is used here only as a reproduction check.
#
#   C02  research/modalities/categorical_decoy_null.py
#        The cross-system decoy null the categorical covalent axis has never faced. Unrelated human
#        paralogue pairs (universe = the committed 47-receptor nuclear-receptor list) pushed through the
#        IDENTICAL categorical pipeline, so `P(paralogue also labelled | target labelled)` = 0 can be read
#        as an enrichment over a MEASURED background instead of an unmeasured one.
#        Staged: prepare (network: AlphaFold DB) -> shards (CPU, sharded by target) -> reduce.
#        The PRE-REGISTRATION is published by `prepare`, before any statistic exists.
#
# WHY micromamba RATHER THAN A BAKED IMAGE. CLAUDE.md §6 forbids solving an environment on a machine we are
# PAYING for and prefers a pulled image. Nothing here is billed (public-repo Actions), and the only external
# binary needed is fpocket — a single conda-forge package, not the 15-25 minute scientific-stack solve that
# rule is about. The repo's own analysis modules (basin_geom, nr4a_differential_atlas, nr4a3_basin_search,
# pocket_tracking) are pure stdlib, so nothing else is installed. The resolved fpocket version is RECORDED
# into every artifact rather than assumed.

on:
  workflow_dispatch:
    inputs:
      task:
        description: "which calibration to run"
        type: choice
        options: [both, pocket_contrast, decoy_null, decoy_prepare_only, decoy_reduce_only]
        default: both
      branch:
        description: "branch to publish artifacts to"
        default: "main"
      pocket_limit:
        description: "C04 smoke: cap frames per subset (0 = all 100 per species)"
        default: "0"
      shards_from_run:
        description: "decoy_reduce_only: run id whose decoy-shard-* / decoy-inputs artifacts to reduce. Re-running 12 shards to change a documentation block is the wrong trade — this reduces the SAME measured rows again."
        default: ""
      scope:
        description: "WHICH DECOY-NULL SCOPE. plddt = the committed C02 run (C16). lbd = C24, the reference-anchored LBD window — a SECOND, independently pre-registered scope that contains C397. NEVER a widening of the first: separate plan file, separate shard dir, separate result file, rows never pooled."
        type: choice
        options: [plddt, lbd]
        default: plddt
      nshards:
        description: "how many shards to split the targets across. C24 selects more pairs, so it needs more."
        default: "12"

permissions:
  contents: write

concurrency:
  # ⭑ SCOPED BY SCOPE, deliberately. The two scopes write disjoint files, so a plddt run and an lbd run
  # cannot corrupt each other and must not queue behind each other either.
  group: categorical-decoy-null-${{ github.ref }}-${{ inputs.scope }}
  cancel-in-progress: false

env:
  NSHARDS: ${{ inputs.nshards }}
  SCOPE: ${{ inputs.scope }}

jobs:
  # =========================================================================================================
  # C04 — the paralogue-matched cryptic-pocket contrast. Frames are already committed; this only adds fpocket.
  # =========================================================================================================
  pocket_contrast:
    if: ${{ inputs.task == 'both' || inputs.task == 'pocket_contrast' }}
    runs-on: ubuntu-latest
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.branch }}
      - name: Install fpocket (conda-forge, the only reliable source)
        run: |
          set -euo pipefail
          curl -Ls https://micro.mamba.pm/api/micromamba/linux-64/latest \
            | sudo tar -xj -C /usr/local/bin --strip-components=1 bin/micromamba
          export MAMBA_ROOT_PREFIX="$HOME/mamba"
          micromamba create -y -q -n fp -c conda-forge fpocket
          echo "$MAMBA_ROOT_PREFIX/envs/fp/bin" >> "$GITHUB_PATH"
      - name: fpocket version (recorded, never assumed)
        run: fpocket -h 2>&1 | head -5 || true
      - name: Run the harmonized detector over NR4A1 / NR4A2 / NR4A3
        run: |
          set -euo pipefail
          cd research/modalities
          ARGS=""
          if [ "${{ inputs.pocket_limit }}" != "0" ]; then ARGS="--limit ${{ inputs.pocket_limit }}"; fi
          python3 paralogue_pocket_contrast.py $ARGS
      - name: Publish
        env:
          PUBLISH_IF_CHANGED: "1"
          PUBLISH_FAIL_HARD: "1"
        run: |
          bash research/compute/publish_artifacts.sh "${{ inputs.branch }}" \
            "C04: paralogue-matched cryptic-pocket contrast (NR4A1/NR4A2/NR4A3, one fpocket build)" \
            research/modalities/paralogue-pocket-contrast.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: paralogue-pocket-contrast
          path: research/modalities/paralogue-pocket-contrast.json
          if-no-files-found: warn

  # =========================================================================================================
  # C02 stage 1 — PRE-REGISTRATION + structures + pair selection. Publishes the design BEFORE any statistic.
  # =========================================================================================================
  decoy_prepare:
    if: ${{ inputs.task == 'both' || inputs.task == 'decoy_null' || inputs.task == 'decoy_prepare_only' }}
    runs-on: ubuntu-latest
    timeout-minutes: 120
    outputs:
      # The shard matrix is DERIVED from `nshards`, not typed twice. A hand-kept matrix list that disagrees
      # with NSHARDS silently drops targets — the modulus decides which shard owns a target, so a shard id
      # the matrix never launches means those targets are never computed and the reduce still looks green.
      shards: ${{ steps.plan_shards.outputs.shards }}
      slug: ${{ steps.plan_shards.outputs.slug }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.branch }}
      - name: Derive the shard matrix and the scope's file slug
        id: plan_shards
        run: |
          set -euo pipefail
          N="${{ inputs.nshards }}"
          python3 - "$N" <<'PY' >> "$GITHUB_OUTPUT"
          import json, sys
          n = int(sys.argv[1])
          assert 1 <= n <= 60, f"nshards {n} out of range"
          print("shards=" + json.dumps(list(range(n))))
          PY
          if [ "${{ inputs.scope }}" = "plddt" ]; then echo "slug=" >> "$GITHUB_OUTPUT";
          else echo "slug=-${{ inputs.scope }}" >> "$GITHUB_OUTPUT"; fi
      - name: Emit the pre-registration (no network, no statistic)
        run: cd research/modalities && python3 categorical_decoy_null.py plan --scope "$SCOPE"
      - name: Probe AlphaFold DB (records the raw API/file answers before any fetch)
        run: cd research/modalities && python3 categorical_decoy_null.py probe --scope "$SCOPE"
      - name: Fetch AlphaFold DB models for the universe
        run: cd research/modalities && python3 categorical_decoy_null.py fetch --scope "$SCOPE"
      - name: Trim domains, all-vs-all identity, pre-registered pair selection
        run: cd research/modalities && python3 categorical_decoy_null.py pairs --scope "$SCOPE"
      # ⛔ THE SCOPE'S OWN GATE, BEFORE ANY STATISTIC IS BOUGHT. `C24` exists to put C397 in scope. If the
      # trim did not, every shard below would measure the wrong thing and the artifact would still look
      # green — so the claim is asserted here, from the plan the previous step just wrote, and the run
      # stops rather than proceeding. For `plddt` this asserts the OPPOSITE (C397 is known to be out), so
      # the check cannot silently pass by being vacuous.
      - name: Assert the scope contains what it was pre-registered to contain
        run: |
          cd research/modalities
          python3 - <<'PY'
          import json, os
          scope = os.environ["SCOPE"]
          slug = "" if scope == "plddt" else f"-{scope}"
          plan = json.load(open(f"categorical-decoy-null{slug}-plan.json"))
          chk = plan["⛔_nr4a3_scope_check"]
          print(json.dumps(chk, indent=1, ensure_ascii=False))
          want = (scope == "lbd")
          got = chk["headline_residue_C397_in_scope"]
          assert got is want, (
              f"scope {scope}: C397 in scope = {got}, pre-registration says {want}. "
              "Refusing to sample placements against a scope that is not what it was registered as.")
          sp = plan.get("window_size_spread")
          print("window spread:", json.dumps(sp, ensure_ascii=False))
          PY
      - name: Publish the plan (design + pairs, still no result)
        env:
          PUBLISH_IF_CHANGED: "1"
          PUBLISH_FAIL_HARD: "1"
        run: |
          bash research/compute/publish_artifacts.sh "${{ inputs.branch }}" \
            "C02 (scope=${{ inputs.scope }}): PRE-REGISTRATION + pair plan for the cross-system categorical decoy null (no results yet)" \
            research/modalities/categorical-decoy-null${{ steps.plan_shards.outputs.slug }}-plan.json
      # ⚠ Stage into ONE directory before upload. upload-artifact@v4 roots a multi-path artifact at the
      # least common ancestor, so a mixed list of `results/...` and `research/...` paths would arrive with a
      # different layout than a single-path one — a silent restore bug in the shards job.
      - name: Stage the inputs for the shards
        run: |
          set -euo pipefail
          SLUG="${{ steps.plan_shards.outputs.slug }}"
          mkdir -p _stage
          cp -a results/categorical-decoy-null/af _stage/af
          cp -a "results/categorical-decoy-null/trimmed$SLUG" _stage/trimmed
          cp -a "research/modalities/categorical-decoy-null$SLUG-plan.json" _stage/plan.json
          ls _stage/trimmed | wc -l
      - uses: actions/upload-artifact@v4
        with:
          name: decoy-inputs-${{ inputs.scope }}
          path: _stage
          retention-days: 7

  # =========================================================================================================
  # C02 stage 2 — the statistic, sharded BY TARGET so each shard samples its placement sets once.
  # =========================================================================================================
  decoy_shards:
    if: ${{ inputs.task == 'both' || inputs.task == 'decoy_null' }}
    needs: decoy_prepare
    runs-on: ubuntu-latest
    timeout-minutes: 350
    strategy:
      fail-fast: false
      matrix:
        shard: ${{ fromJSON(needs.decoy_prepare.outputs.shards) }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.branch }}
      - uses: actions/download-artifact@v4
        with:
          name: decoy-inputs-${{ inputs.scope }}
          path: _decoy_inputs
      - name: Restore the prepared inputs
        run: |
          set -euo pipefail
          SLUG="${{ needs.decoy_prepare.outputs.slug }}"
          mkdir -p results/categorical-decoy-null
          cp -a _decoy_inputs/af results/categorical-decoy-null/af
          cp -a _decoy_inputs/trimmed "results/categorical-decoy-null/trimmed$SLUG"
          cp -a _decoy_inputs/plan.json "research/modalities/categorical-decoy-null$SLUG-plan.json"
          ls "results/categorical-decoy-null/trimmed$SLUG" | wc -l
      - name: Install fpocket
        run: |
          set -euo pipefail
          curl -Ls https://micro.mamba.pm/api/micromamba/linux-64/latest \
            | sudo tar -xj -C /usr/local/bin --strip-components=1 bin/micromamba
          export MAMBA_ROOT_PREFIX="$HOME/mamba"
          micromamba create -y -q -n fp -c conda-forge fpocket
          echo "$MAMBA_ROOT_PREFIX/envs/fp/bin" >> "$GITHUB_PATH"
      - name: Shard ${{ matrix.shard }} (scope ${{ inputs.scope }})
        run: |
          cd research/modalities
          nproc
          python3 categorical_decoy_null.py run --scope "$SCOPE" \
            --shard ${{ matrix.shard }} --nshards ${{ env.NSHARDS }}
      - uses: actions/upload-artifact@v4
        if: always()          # the shard file is checkpointed after EVERY row, so a timeout still delivers
        with:
          name: decoy-shard-${{ inputs.scope }}-${{ matrix.shard }}
          path: results/categorical-decoy-null/shards${{ needs.decoy_prepare.outputs.slug }}
          if-no-files-found: warn

  # =========================================================================================================
  # C02 stage 3 — background distribution + the NR4A3 percentile.
  # =========================================================================================================
  decoy_reduce:
    # ⛔ NOT `always()`. A reduce that runs after a FAILED prepare downloads nothing and publishes a
    # background built from zero rows — a green artifact produced by measuring nothing. It must run when
    # SOME shards failed (fail-fast is off and a partial background is still a real one) and never when the
    # inputs were never produced.
    if: ${{ !cancelled() && needs.decoy_prepare.result == 'success' && (inputs.task == 'both' || inputs.task == 'decoy_null') }}
    needs: [decoy_prepare, decoy_shards]
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.branch }}
      # ⛔ SCOPED PATTERN. `decoy-shard-*` would match the OTHER scope's artifacts if both scopes ever ran
      # in one repo's retention window, pooling two backgrounds into one — the single worst failure this
      # lane can have, and a silent one.
      - uses: actions/download-artifact@v4
        with:
          pattern: decoy-shard-${{ inputs.scope }}-*
          merge-multiple: true
          path: results/categorical-decoy-null/shards${{ needs.decoy_prepare.outputs.slug }}
      - uses: actions/download-artifact@v4
        with:
          name: decoy-inputs-${{ inputs.scope }}
          path: _decoy_inputs
      - name: Restore the plan
        run: |
          SLUG="${{ needs.decoy_prepare.outputs.slug }}"
          cp -a _decoy_inputs/plan.json "research/modalities/categorical-decoy-null$SLUG-plan.json" || true
      # ★ The driver's OWN known-answer test: re-run it on the committed opened models + committed Pocket-5
      # and compare against the committed static verdict. A background measured by an unvalidated harness
      # would be worse than no background, so this runs in the same job that publishes the background.
      # ⭑ It is SCOPE-INDEPENDENT by construction (committed models, committed Pocket-5, no trim), so it
      # validates the driver for both scopes and is run for both.
      - name: Harness known-answer check vs the committed static verdict
        run: cd research/modalities && python3 categorical_decoy_null.py selfcheck --scope "$SCOPE"
      - name: Reduce
        run: |
          ls -la "results/categorical-decoy-null/shards${{ needs.decoy_prepare.outputs.slug }}" || true
          cd research/modalities && python3 categorical_decoy_null.py reduce --scope "$SCOPE"
      - name: Publish
        env:
          PUBLISH_IF_CHANGED: "1"
          PUBLISH_FAIL_HARD: "1"
        run: |
          SLUG="${{ needs.decoy_prepare.outputs.slug }}"
          bash research/compute/publish_artifacts.sh "${{ inputs.branch }}" \
            "C02 (scope=${{ inputs.scope }}): cross-system decoy null for the categorical axis — measured background + NR4A3 percentile" \
            "research/modalities/categorical-decoy-null$SLUG.json" \
            "research/modalities/categorical-decoy-null$SLUG-plan.json"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: categorical-decoy-null-${{ inputs.scope }}
          path: research/modalities/categorical-decoy-null${{ needs.decoy_prepare.outputs.slug }}.json
          if-no-files-found: warn

  # =========================================================================================================
  # C02 stage 3b — REDUCE ONLY, over a PREVIOUS run's shard artifacts.
  # Why this exists: after the shards have run, a change to how the artifact is WRITTEN (a new scope block, a
  # new caveat) must not cost 12 more shard jobs. `download-artifact@v4` can read another run's artifacts
  # given `run-id` + a token, so the same measured rows are reduced again by the current code. The rows are
  # not recomputed and cannot drift.
  # =========================================================================================================
  decoy_reduce_only:
    if: ${{ inputs.task == 'decoy_reduce_only' && inputs.shards_from_run != '' }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      # ⛔ The slug is recomputed here rather than taken from `decoy_prepare`, because this job does not
      # depend on it — it reduces ANOTHER run's rows. Keeping the two derivations in one shape is what stops
      # them drifting: empty for plddt, `-<scope>` otherwise.
      SLUG: ${{ inputs.scope == 'plddt' && '' || format('-{0}', inputs.scope) }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.branch }}
      - uses: actions/download-artifact@v4
        with:
          pattern: decoy-shard-${{ inputs.scope }}-*
          merge-multiple: true
          path: results/categorical-decoy-null/shards${{ inputs.scope == 'plddt' && '' || format('-{0}', inputs.scope) }}
          run-id: ${{ inputs.shards_from_run }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/download-artifact@v4
        with:
          name: decoy-inputs-${{ inputs.scope }}
          path: _decoy_inputs
          run-id: ${{ inputs.shards_from_run }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Restore the plan
        run: cp -a _decoy_inputs/plan.json "research/modalities/categorical-decoy-null$SLUG-plan.json"
      - name: Show what was recovered (an empty reduce must not look like a clean one)
        run: |
          set -euo pipefail
          ls -la "results/categorical-decoy-null/shards$SLUG"
          test -n "$(ls -A "results/categorical-decoy-null/shards$SLUG")" || { echo "::error::no shard artifacts recovered from run ${{ inputs.shards_from_run }} at scope ${{ inputs.scope }}"; exit 1; }
      - name: Harness known-answer check vs the committed static verdict
        run: cd research/modalities && python3 categorical_decoy_null.py selfcheck --scope "$SCOPE"
      - name: Reduce
        run: cd research/modalities && python3 categorical_decoy_null.py reduce --scope "$SCOPE"
      - name: Publish
        env:
          PUBLISH_IF_CHANGED: "1"
          PUBLISH_FAIL_HARD: "1"
        run: |
          bash research/compute/publish_artifacts.sh "${{ inputs.branch }}" \
            "C02 (scope=${{ inputs.scope }}): decoy null — re-reduced over run ${{ inputs.shards_from_run }}'s measured rows" \
            "research/modalities/categorical-decoy-null$SLUG.json"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: categorical-decoy-null-${{ inputs.scope }}-rereduced
          path: research/modalities/categorical-decoy-null${{ inputs.scope == 'plddt' && '' || format('-{0}', inputs.scope) }}.json
          if-no-files-found: warn
