name: Vast calibration sweep — turn unbenched cards into $/ns-gradeable supply

# WHY THIS WORKFLOW EXISTS. `$/ns` ranking decides every GPU purchase, and it needs a BENCHED ns/h.
# `vast_cost_model.MEASURED_NS_PER_DAY_84K` held three cards, so on the 2026-07-27 8:00 AM ET board only 10 of
# 48 qualifying offers could be priced at all against 19 units needed. The bottleneck is not supply, it is our
# ability to GRADE supply — and the only thing that widens the table is a measurement.
#
# ⛔ AND THE HARVEST-INSTEAD IDEA WAS TESTED FIRST AND DOES NOT WORK. `throughput_harvest.py` shows the
# selection loop is closed: an unbenched card has no $/ns, so `rank_offers_by_usd_per_ns` sorts it last, so we
# never rent it, so it never produces a log. 114 instance-observations across 55 committed fan-out ticks
# contain exactly three card models, all of them already in the table. A dedicated rental is the only break.
#
# COST SHAPE, and why this is safe to run: a bench is MINUTES. `vast_bench_sweep` caps each rental's runtime,
# prices its own WORST CASE before renting, and refuses any card over the per-card or sweep-wide dollar
# ceiling. `collect` prints realised spend and then DESTROYS every `cal-*` instance — the destroy is
# control-plane-only (an unprivileged container cannot end itself), so it must happen here or the meter runs.
#
# ⚠ THE $/ns GATE DOES NOT APPLY HERE AND SAYING SO IS THE HONEST MOVE. CLAUDE.md §6 gates every rental on
# `$/ns` against the ladder basis; that quantity needs the card's ns/h, which is exactly what this rental
# exists to measure. Gating on it would be circular. The substitute is a hard, knowable dollar ceiling.

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "plan (read-only) | launch (SPENDS, minutes each) | collect (validate + reap) | reap | forensic (read-only) | impact (read-only)"
        type: choice
        options: [plan, launch, collect, reap, forensic, impact, ladder]
        default: plan
      fleet_branch:
        description: "branch whose code the rented instances run (NOT the workflow's own ref)"
        default: "main"
      cards:
        description: "comma-separated card names to bench (blank = every unbenched model on the board)"
        default: ""
      max_usd_total:
        description: "sweep-wide worst-case ceiling in USD; the planner HOLDS rather than drops past it"
        default: "5.00"
      max_usd_per_card:
        description: "per-rental worst-case ceiling in USD"
        default: "0.60"
      max_runtime_s:
        description: "hard per-rental runtime cap (seconds). A bench needs minutes; this bounds the bill."
        default: "1800"
      replicates:
        description: "independent HOSTS per card. >1 is how you separate 'this card is this fast' from 'this rental was this fast' — every rental confounder is one-sided downward and a tight CV cannot see it."
        default: "1"
      include_measured:
        description: "1 = also bench cards already in the table. Re-measuring an ANCHOR is exactly what you want when its value is in question."
        default: "0"
      wave:
        description: "label scoping this launch's S3 result keys. WITHOUT IT a later sweep OVERWRITES the hosts an earlier one paid for — which has destroyed evidence three times. A median-of-N estimator is only as good as the hosts that survive in the store."
        default: ""
      exclude_machines:
        description: "comma-separated Vast machine_ids to never rent. A host that will not deliver has infinite realised $/ns, which the ranking cannot see, so it keeps winning selection and keeps failing."
        default: ""

permissions:
  contents: write

concurrency:
  # One sweep at a time. Two concurrent launches would both read the same board and could rent the same host
  # twice for the same card — paying twice for one number.
  group: vast-bench-sweep
  cancel-in-progress: false

jobs:
  sweep:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      VAST_API_KEY: ${{ secrets.VAST_API_KEY }}
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      VAST_S3_ACCESS_KEY_ID: ${{ secrets.VAST_S3_ACCESS_KEY_ID }}
      VAST_S3_SECRET_ACCESS_KEY: ${{ secrets.VAST_S3_SECRET_ACCESS_KEY }}
      AWS_DEFAULT_REGION: us-east-2
      VAST_CKPT_BUCKET: sagemaker-us-east-2-646605541856
      GIT_BRANCH: ${{ github.event.inputs.fleet_branch || 'main' }}
      BENCH_CARDS: ${{ github.event.inputs.cards }}
      BENCH_MAX_USD_TOTAL: ${{ github.event.inputs.max_usd_total || '5.00' }}
      BENCH_MAX_USD_PER_CARD: ${{ github.event.inputs.max_usd_per_card || '0.60' }}
      BENCH_MAX_RUNTIME_S: ${{ github.event.inputs.max_runtime_s || '1800' }}
      BENCH_REPLICATES: ${{ github.event.inputs.replicates || '1' }}
      BENCH_INCLUDE_MEASURED: ${{ github.event.inputs.include_measured || '0' }}
      BENCH_EXCLUDE_MACHINES: ${{ github.event.inputs.exclude_machines }}
      BENCH_WAVE: ${{ github.event.inputs.wave }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.fleet_branch || 'main' }}
          # FULL HISTORY, NOT THE DEFAULT DEPTH 1. throughput_harvest reads the COMMITTED progress trail
          # through `git log`; on a shallow clone that returns nothing and every census number comes back
          # zero — which reads exactly like 'no leg has ever run on an unbenched card', i.e. it silently
          # fabricates agreement with the conclusion. Observed on this workflow's first run.
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }
      - run: pip install -q boto3 pytest

      # ★ THE GATE RUNS BEFORE ANY MONEY DOES. These tests are what stands between a rented GPU and the
      # constant that anchors every $/ns in the repo — including the pin that the three existing anchors and
      # REFERENCE_NS_PER_H are bit-identical. A broken admission gate must never reach a launch.
      - name: Gate on the admission + provenance tests
        run: |
          python -m pytest -q \
            research/modalities/tests/test_throughput_provenance.py \
            research/modalities/tests/test_vast_bench_sweep.py \
            research/modalities/tests/test_throughput_harvest.py

      - name: Harvest census — the standing evidence that a dedicated rental is still necessary
        if: ${{ always() }}
        working-directory: research/modalities
        run: python throughput_harvest.py --json throughput-harvest.json

      # ★ READ-ONLY, AND IT RUNS BEFORE ANY SPEND. The anchor's own evidence: every bench artifact ever
      # written, with the fields that could explain two tight runs of the same protocol disagreeing.
      - name: Forensic — every bench artifact, with the conditions that could differ
        if: ${{ github.event.inputs.mode == 'forensic' }}
        working-directory: research/modalities
        env:
          FORENSIC: "1"
        run: python vast_bench_sweep.py

      # ★ REGENERATE, NEVER HAND-EDIT (CLAUDE.md rule 1.1: a total is DERIVED). Two steps, in order: take a
      # fresh market snapshot, then reprice the whole ladder from it through the cost model. Changing the
      # RTX 4090 entry moves REFERENCE_NS_PER_H, which every $/reference-GPU-hour in that artifact is
      # expressed in, so the ladder MUST be regenerated in the same change or the repo disagrees with itself.
      - name: Ladder — fresh market snapshot, then reprice the whole ladder from it
        if: ${{ github.event.inputs.mode == 'ladder' }}
        working-directory: research/modalities
        run: |
          # The snapshot's default GPU list predates this lane's widening. Repricing the ladder from a
          # snapshot that cannot see the newly-benched cheap cards would silently reprice it against the OLD
          # supply — the widening would be invisible in exactly the artifact the gates read.
          python vast_market_intel.py --out-dir . --skip-docs --gpus \
            "rtx4090,rtx3090,rtx4080,rtx4080s,rtx5090,rtx5080,rtx3090ti,rtx5060ti,a4000,a100,rtx pro 4000" \
            || true
          python vast_cost_model.py --offers vast-market-offers-raw.json \
            --json-out vast-ladder-repricing.json

      - name: Board impact — before/after on the live board
        if: ${{ github.event.inputs.mode == 'impact' }}
        working-directory: research/modalities
        env:
          IMPACT: "1"
        run: python vast_bench_sweep.py

      - name: Plan
        if: ${{ github.event.inputs.mode != 'forensic' && github.event.inputs.mode != 'impact' && github.event.inputs.mode != 'ladder' }}
        working-directory: research/modalities
        run: python vast_bench_sweep.py

      - name: Launch
        if: ${{ github.event.inputs.mode == 'launch' }}
        working-directory: research/modalities
        env:
          LAUNCH: "1"
        run: python vast_bench_sweep.py

      - name: Collect — validate every record, propose entries, report realised spend, then REAP
        if: ${{ github.event.inputs.mode == 'collect' }}
        working-directory: research/modalities
        env:
          COLLECT: "1"
        run: python vast_bench_sweep.py

      - name: Reap — destroy every cal-* instance
        # `always()` on purpose, in launch and reap modes: an instance left up after a failed step is the one
        # failure that keeps costing money. In `launch` mode the reap is AGE-GATED so it cannot kill the
        # benches this same run just started.
        if: ${{ always() && (github.event.inputs.mode == 'reap' || github.event.inputs.mode == 'launch') }}
        working-directory: research/modalities
        env:
          REAP: "1"
          BENCH_REAP_AGE_MIN: ${{ github.event.inputs.mode == 'reap' && '0' || '45' }}
        run: python vast_bench_sweep.py

      - name: Commit the sweep artifacts
        if: ${{ always() }}
        run: |
          set -e
          git config user.name "Claude"
          git config user.email "noreply@anthropic.com"
          # ⛔ ONE HOME FOR THE PUBLISH. `git pull --rebase` wedges on a conflict — the repo is left
          # mid-rebase, every retry dies on the first one's wreckage, and the step stays GREEN having
          # published nothing. Two of these artifacts have OTHER WRITERS (vast-market-intel.json and
          # vast-market-offers-raw.json are also written by vast-price-sample.yml), so this step could
          # additionally stamp a newer copy with one it never produced — the failure measured on the
          # selcal lane 2026-08-01, `landed: 5` back to `landed: 0` seven seconds after it was measured.
          # The primitive publishes only what this run actually changed.
          # PUBLISH_IF_CHANGED=1 keeps the existing EVENT semantics: a sweep that produced nothing new
          # must not commit as though it had. The `[ -f ]` loop is gone because the primitive drops
          # absent paths itself.
          PUBLISH_IF_CHANGED=1 bash research/compute/publish_artifacts.sh "$GIT_BRANCH" \
            "vast calibration sweep ${{ github.event.inputs.mode }} ($(date -u +%FT%TZ))" \
            research/modalities/vast-bench-sweep-plan.json \
            research/modalities/vast-bench-sweep-launched.json \
            research/modalities/vast-bench-sweep-results.json \
            research/modalities/throughput-harvest.json \
            research/modalities/vast-bench-forensic.json \
            research/modalities/vast-bench-board-impact.json \
            research/modalities/vast-bench-spend-ledger.json \
            research/modalities/throughput-bench-provenance.json \
            research/modalities/vast-ladder-repricing.json \
            research/modalities/vast-market-offers-raw.json \
            research/modalities/vast-market-intel.json
