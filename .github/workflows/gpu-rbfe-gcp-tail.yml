name: GCP RBFE — tail live serial (monitor a running L4 VM)

# The GCP analog of tail-cloudwatch: reads the LIVE serial console of a running gpu-rbfe-gcp VM so we can watch
# MD progress (λ-window / openmmtools iteration / spot-driver checkpoint commits) WITHOUT waiting for the main
# job's in-progress logs (GitHub 404s those). Auto-finds the running gcp-rbfe-* instance (or pass vm+zone).
# Read-only: dumps a filtered + raw serial tail, then exits. No teardown (never touches the running job's VM).

on:
  workflow_dispatch:
    inputs:
      vm:     { description: "instance name (blank = auto-find the running gcp-rbfe-*)", default: "", required: false }
      zone:   { description: "zone (blank = auto)", default: "", required: false }
      grep:   { description: "extra serial grep filter", default: "", required: false }
      delete: { description: "1 = DELETE the found VM after showing status (cleanup a finished detached leg)", default: "0", required: false }
      inspect_nc: { description: "1 = download the latest complex .nc and dump its netCDF dims/vars (diagnose .nc size)", default: "0", required: false }
      sweep_stale: { description: "1 = DELETE every non-rbfe leftover VM (gcp-bill-*, gcp-smoke-*, gpu-bench-*) across all zones (idle-billing sweep)", default: "0", required: false }

permissions:
  id-token: write
  contents: read

jobs:
  tail:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: projects/878095411563/locations/global/workloadIdentityPools/github-pool/providers/github-provider
          service_account: gpu-runner@project-a7ebde30-e2ed-4b8d-9a9.iam.gserviceaccount.com
      - uses: google-github-actions/setup-gcloud@v2
      - name: Tail serial
        env:
          VM_IN: ${{ github.event.inputs.vm }}
          ZONE_IN: ${{ github.event.inputs.zone }}
          GREP_IN: ${{ github.event.inputs.grep }}
          DELETE_IN: ${{ github.event.inputs.delete }}
          INSPECT_NC: ${{ github.event.inputs.inspect_nc }}
          SWEEP_STALE: ${{ github.event.inputs.sweep_stale }}
        run: |
          set -eo pipefail
          export CLOUDSDK_CORE_PROJECT=project-a7ebde30-e2ed-4b8d-9a9
          # ===== FULL-PROJECT VM CENSUS (runs FIRST, before the rbfe-specific early-exit) — the "is anything I =====
          # forgot still billing?" check. Raw GCE VMs do NOT self-delete on workload-exit (only the
          # --max-run-duration=DELETE backstop reaps them), so this is the belt-and-braces idle-billing audit.
          echo "=================== ALL COMPUTE INSTANCES IN PROJECT (every zone) ==================="
          ALLVMS=$(gcloud compute instances list \
            --format="table(name,zone.basename(),machineType.basename(),status,scheduling.provisioningModel,creationTimestamp)" 2>&1 || true)
          printf '%s\n' "$ALLVMS"
          RUNNING_CT=$(gcloud compute instances list --filter="status=RUNNING" --format="value(name)" 2>/dev/null | grep -ac . || echo 0)
          echo "running instance count: $RUNNING_CT"
          if [ "$SWEEP_STALE" = 1 ]; then
            echo "--- SWEEP_STALE=1: deleting non-rbfe leftover VMs (gcp-bill-*, gcp-smoke-*, gpu-bench-*) ---"
            gcloud compute instances list --filter="name~'^(gcp-bill|gcp-smoke|gpu-bench)-'" \
              --format="value(name,zone.basename())" 2>/dev/null | while read -r N Z; do
              [ -z "$N" ] && continue
              echo "deleting $N in $Z ..."
              gcloud compute instances delete "$N" --zone="$Z" --quiet 2>&1 | tail -1 || echo "  (delete failed / already gone)"
            done
            echo "--- sweep done ---"
          fi
          VM="$VM_IN"; ZONE="$ZONE_IN"
          if [ -z "$VM" ]; then
            echo "--- auto-finding running gpu-rbfe VM ---"
            LINE=$(gcloud compute instances list --filter="name~'^gcp-rbfe-' AND status=RUNNING" \
              --format="csv[no-heading](name,zone.basename(),status)" 2>/dev/null | head -1)
            echo "found: ${LINE:-<none>}"
            VM=$(echo "$LINE" | cut -d, -f1); ZONE=$(echo "$LINE" | cut -d, -f2)
          fi
          # NB: do NOT early-exit when no VM is found — a preemption/finish leaves no VM but the GCS checkpoint
          # census below (furthest committed iteration = how far the leg got) is VM-INDEPENDENT and is exactly
          # what we need to see on a preemption. Only the VM-serial dump is skipped when there's no VM.
          if [ -z "$VM" ]; then
            echo "::warning::no running gpu-rbfe VM (preempted or finished) — skipping serial dump; GCS census below shows progress"
          else
            echo "VM=$VM ZONE=$ZONE"
            gcloud compute instances describe "$VM" --zone="$ZONE" \
              --format="value(status,machineType.basename(),lastStartTimestamp)" 2>/dev/null || true
            OUT=$(gcloud compute instances get-serial-port-output "$VM" --zone="$ZONE" 2>/dev/null || true)
            echo "=================== RBFE PROGRESS (filtered) ==================="
            # openmmtools MultiState logs the iteration ('Iteration N/M'); the spot-driver logs warmup/barrier
            # commits; analyze/setup mark phase boundaries. This tells us exactly how far the MD has gotten.
            FILT="Iteration [0-9]|iteration [0-9]|spot-driver|barrier|committed checkpoint|WARMUP|PRODUCTION|\[rbfe\]|\[gpu-util\]|analyze|OpenMM platform|mapped|Solving|Replica|mixing|ns/day|estimated|equilibrat|ETA|Traceback|Error|error|nan|NaN"
            [ -n "$GREP_IN" ] && FILT="$FILT|$GREP_IN"
            printf '%s' "$OUT" | grep -aE "$FILT" | tail -40 || echo "(no progress markers yet — still in env build?)"
            echo "=================== RAW SERIAL TAIL (last 20) ==================="
            printf '%s' "$OUT" | tail -20 || true
            # ===== TEARDOWN FORENSIC: did the in-VM EXIT trap run, and if so why did its delete fail? =====
            # Added 2026-07-27 after gcp-ternary-30215419909 held the project's ONLY GPU for ~22 h with its leg
            # already finished. The trap DID run and printed the fallback "self-delete no-op (already gone /
            # no perm)"; the gcloud error that caused it was invisible because EVERY progress filter in this
            # repo greps case-sensitively for "error|Error", and gcloud prints "ERROR:" in caps. A guard whose
            # failure message is unreadable is a guard nobody can act on, so the forensic is now part of the
            # tail rather than something to be reconstructed after the fact.
            echo "=================== TEARDOWN FORENSIC (did self-delete run? why did it fail?) ==================="
            echo "--- create-time guards actually on the instance (scheduling + SA + scopes) ---"
            gcloud compute instances describe "$VM" --zone="$ZONE" \
              --format="yaml(status,creationTimestamp,scheduling,serviceAccounts)" 2>&1 | head -30 || true
            echo "--- trap markers, CASE-INSENSITIVE (this is the line the old filters dropped) ---"
            printf '%s' "$OUT" | grep -aiE "SELF-DELETE|self-delete no-op|TFEP-DONE|ERROR:|denied|forbidden|not authorized|Required .+ permission|insufficient" | tail -25 \
              || echo "(no trap/teardown markers in the serial buffer)"
            echo "--- raw serial window around the self-delete attempt (the gcloud error verbatim) ---"
            SDL=$(printf '%s' "$OUT" | grep -an "self-delete no-op" | tail -1 | cut -d: -f1)
            if [ -n "$SDL" ]; then
              S0=$SDL; [ "$S0" -gt 14 ] && S0=$((SDL-14)) || S0=1
              printf '%s' "$OUT" | sed -n "${S0},$((SDL+4))p"
            else
              echo "(no 'self-delete no-op' line — either the trap has not fired yet or the delete succeeded)"
            fi
            # DEFINITIVE, NON-DESTRUCTIVE PERMISSION TEST. compute.instances.testIamPermissions answers
            # "does the caller hold compute.instances.delete on THIS instance" without deleting anything, so
            # it settles a self-delete failure by measurement rather than by reading an IAM doc that may be
            # stale. Run it as the VM'S OWN service account (over SSH), because that -- not the CI runner's
            # gpu-runner@ -- is the identity the EXIT trap uses.
            echo "--- testIamPermissions as the VM's OWN service account (the identity the trap uses) ---"
            timeout 150 gcloud compute ssh "$VM" --zone="$ZONE" --quiet --command '
              MD=http://metadata.google.internal/computeMetadata/v1/instance
              N=$(curl -s -H "Metadata-Flavor: Google" $MD/name)
              Z=$(curl -s -H "Metadata-Flavor: Google" $MD/zone | awk -F/ "{print \$NF}")
              P=$(curl -s -H "Metadata-Flavor: Google" http://metadata.google.internal/computeMetadata/v1/project/project-id)
              echo "  instance=$N zone=$Z project=$P"
              echo "  SA:     $(curl -s -H "Metadata-Flavor: Google" $MD/service-accounts/default/email)"
              echo "  scopes: $(curl -s -H "Metadata-Flavor: Google" $MD/service-accounts/default/scopes | tr "\n" " ")"
              echo "  gcloud on PATH: $(command -v gcloud || echo NO)"
              TOK=$(curl -s -H "Metadata-Flavor: Google" $MD/service-accounts/default/token | sed -nE "s/.*\"access_token\":\"([^\"]+)\".*/\\1/p")
              echo "  --- testIamPermissions(compute.instances.delete, .get, .stop) ---"
              curl -s -X POST -H "Authorization: Bearer $TOK" -H "Content-Type: application/json" \
                -d "{\"permissions\":[\"compute.instances.delete\",\"compute.instances.get\",\"compute.instances.stop\"]}" \
                "https://compute.googleapis.com/compute/v1/projects/$P/zones/$Z/instances/$N/testIamPermissions"
              echo
              echo "  --- startup-script service state (did the script exit at all?) ---"
              systemctl is-active google-startup-scripts.service 2>/dev/null || true
              systemctl show -p ExecMainStatus -p Result -p ActiveState google-startup-scripts.service 2>/dev/null || true
              echo "  --- processes alive longest (is the leg python still running?) ---"
              ps -eo pid,etimes,pcpu,stat,comm --sort=-etimes 2>/dev/null | head -6 || true
            ' 2>&1 | grep -vE "Warning: Permanently added|Updating project ssh|Waiting for SSH key|^WARNING:|^$" | tail -30 \
              || echo "(ssh probe failed — see above)"
          fi
          # The REAL liveness signal (the leg run captures MD output into a shell var, so serial goes quiet mid-run):
          # the spot-safe driver commits a checkpoint to GCS every ~20 iterations. Latest COMMITTED.json + its
          # timestamp = MD alive + how far it's gotten (the GCP analog of the AWS ckpt census / mode=forensic).
          echo "=================== GCS CHECKPOINT CENSUS (liveness) ==================="
          B=gs://project-a7ebde30-e2ed-4b8d-9a9-rbfe-ckpt/valA-tyk2
          echo "--- FULL recursive listing of $B/ (robust; no glob) ---"
          ALL=$(gcloud storage ls --recursive "$B/" 2>&1 || true)
          printf '%s\n' "$ALL" | tail -40
          echo "--- object count under $B/ ---"
          printf '%s\n' "$ALL" | grep -ac "gs://" || echo 0
          echo "--- FURTHEST checkpoint per leg/phase (the live progress) ---"
          for LG in complex solvent; do
            for PH in warmup production; do
              MAX=$(printf '%s\n' "$ALL" | grep -aoE "valA-tyk2/$LG/$PH/iter-[0-9]+" | grep -aoE "[0-9]+\$" | sort -n | tail -1)
              [ -n "$MAX" ] && echo "  $LG/$PH: furthest committed iteration = $MAX"
            done
          done
          printf '%s\n' "$ALL" | grep -aoE "valA-tyk2/(complex|solvent)/(warmup|production)/iter-[0-9]+" | sort -u | wc -l | xargs echo "total committed boundaries:"
          echo "--- completed leg results ---"
          printf '%s\n' "$ALL" | grep -aE "results/.*\.json" || echo "(no completed leg JSONs persisted)"
          echo "--- env-cache objects (env-cache/rbfe-<key>.tar = the cached conda env; size ~5-8 GB when primed) ---"
          gcloud storage ls -l "gs://project-a7ebde30-e2ed-4b8d-9a9-rbfe-ckpt/env-cache/" 2>/dev/null || echo "(no env-cache primed yet)"
          if [ "$INSPECT_NC" = 1 ]; then
            echo "=================== .nc STRUCTURE INSPECTION (what is being stored per iteration) ==================="
            LATEST_NC=$(printf '%s\n' "$ALL" | grep -aE "complex/production/iter-[0-9]+/.*/simulation\.nc" | tail -1 | grep -aoE "gs://[^ ]+")
            echo "latest complex .nc: $LATEST_NC"
            if [ -n "$LATEST_NC" ]; then
              gcloud storage cp "$LATEST_NC" /tmp/s.nc 2>&1 | tail -1
              pip install -q netCDF4 2>/dev/null || pip3 install -q netCDF4 2>/dev/null
              python3 -c "import netCDF4,os; ds=netCDF4.Dataset('/tmp/s.nc'); print('dims', {k:len(ds.dimensions[k]) for k in ds.dimensions}); print('vars', list(ds.variables)); p=(ds.variables['positions'].shape if 'positions' in ds.variables else None); print('positions_shape', p); print('==> ANALYSIS ATOMS PER FRAME =', (p[-2] if p else 'NONE (energies-only .nc)')); print('sizeMB', round(os.path.getsize('/tmp/s.nc')/1e6,1))" || echo "(netcdf read failed)"
            fi
          fi
          if [ "$DELETE_IN" = 1 ] && [ -n "$VM" ]; then
            echo "--- DELETE requested: tearing down $VM in $ZONE ---"
            # NEVER 2>/dev/null a teardown. That is exactly how the in-VM trap's failure stayed invisible for
            # ~22 h: "delete failed / already gone" conflates two opposite outcomes and prints no reason.
            if gcloud compute instances delete "$VM" --zone="$ZONE" --quiet 2>/tmp/delerr; then
              echo "deleted $VM"
            else
              echo "::error title=DELETE FAILED::$VM in $ZONE — $(tail -2 /tmp/delerr | tr '\n' ' ')"
            fi
            # QUOTA IS THE ZOMBIE TEST (gcp-gpu-facts.md #2): a VM absent from `instances list` while
            # NVIDIA_L4_GPUS usage stays >=1 means something still holds the GPU. Confirm from the quota
            # endpoint, not from the delete call's own exit status.
            echo "--- post-delete quota (usage must return to 0, else something still holds the GPU) ---"
            Q=$(gcloud compute regions describe us-central1 --flatten="quotas[]" \
                  --format="value(quotas.metric, quotas.limit, quotas.usage)" 2>/dev/null)
            for M in NVIDIA_L4_GPUS PREEMPTIBLE_NVIDIA_L4_GPUS; do
              printf '%s\n' "$Q" | awk -v m="$M" '$1==m{printf "  %s: limit=%s usage=%s\n", $1,$2,$3}'
            done
            gcloud compute instances list --format="table(name,zone.basename(),status)" 2>&1 | head -10 || true
          fi
          # ===== CHECKPOINT TIMING PROBE: interval between commits = MD + commit overhead per 20 iters =====
          echo "=================== CHECKPOINT TIMING PROBE (complex/production) ==================="
          echo "commit timestamps (gap between consecutive = wall time per 20-iter chunk incl. validate+sha256+upload):"
          gcloud storage ls -l "$B/complex/production/**/COMMITTED.json" 2>/dev/null \
            | grep -aE "gs://.*COMMITTED.json" | tail -12 || echo "(no production commits yet)"
          echo "--- latest complex checkpoint FILE SIZES (growing = growing per-commit overhead) ---"
          LATEST=$(printf '%s\n' "$ALL" | grep -aoE "valA-tyk2/complex/production/iter-[0-9]+" | sort -u | tail -1)
          [ -n "$LATEST" ] && gcloud storage ls -l "gs://project-a7ebde30-e2ed-4b8d-9a9-rbfe-ckpt/$LATEST/**" 2>/dev/null | grep -aE "\.chk|\.nc" | tail -4
