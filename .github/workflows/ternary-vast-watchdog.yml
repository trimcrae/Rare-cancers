name: Ternary VAST leg watchdog (session-independent)

# WHY THIS EXISTS, SEPARATELY FROM ternary-leg-watchdog.yml.
# That workflow watches ternary legs on GCP and ONLY on GCP: it authenticates by WIF, reads its state from
# GCS, asks "is a `gcp-ternary-*` VM up?", and its only recovery is to re-dispatch gpu-ternary-fep-gcp.yml.
# Pointing a Vast leg at it would give monitoring that silently watches nothing — the failure class this
# program keeps getting bitten by (a check that reports success while measuring nothing). Since trimcrae's
# 2026-07-25 directive puts ALL production GPU runs on Vast, that gap would otherwise apply to every GPU
# run the program makes from here.
#
# Three questions per enabled entry in research/modalities/ternary-vast-watch.json:
#   leg.json in S3                      -> DONE     (disable the entry)
#   an instance up AND the committed iteration count went UP -> RUNNING (emit progress)
#   neither                             -> DIED     (relaunch; resumes from the last committed checkpoint)
#
# "Alive" is deliberately not enough. A rented Vast box can sit up with a dead container or an idle GPU, so
# RUNNING requires ADVANCE in the commit store, not the existence of an instance.
#
# A capacity refusal (`resources_unavailable`) is handled by the launcher's own policy — destroy, add the
# machine to the exclusion set, pick another host; never wait, never raise the bid. That policy lives in
# ternary_vast_launch.collect + ResourceSpec.exclude_machine_ids and is DELEGATED to here rather than
# duplicated, so there is only one of it.
#
# SAFETY: a per-UTC-day relaunch counter in S3 caps runaway re-dispatch; the pass is a no-op on an empty or
# all-disabled list; only a DIED entry relaunches (a stall gets an alert, because a relaunch would hang the
# same way); and if the Vast instance list cannot be read the pass REFUSES to act rather than risk
# relaunching on top of a live leg. All state is in the repo + S3, so it survives container restarts with
# no agent awake.
#
# NB a `schedule:` trigger only fires from the DEFAULT BRANCH, so this must be on main to run at all.

on:
  schedule:
    - cron: "14 * * * *"    # matched to the recovery granularity: production commits every 40 iterations
                              # (~10 min of MD at 4 fs), so 15 min sees at most one missed interval.
  workflow_dispatch:
    inputs:
      dry_run:
        description: "1 = report what it WOULD do without relaunching or incrementing the counter"
        default: "0"
        required: false
      generic_shakeout:
        description: "0 = off | dry = ALSO run vast_watchdog.py read-only | live = ALSO run it for real"
        default: "0"
        required: false

# ─────────────────────────────────────────────────────────────────────────────────────────────────────────
# ✅ THE OVERNIGHT DEADLINE WAIVER IS REMOVED (2026-07-30, when the closure residual R landed).
# It set RELAUNCH_MAX_RATIO_VS_BASIS=4.0, letting a relaunch buy at up to 4x basis — roughly twice the
# $0.006539/ns buy line — because the triangle was on a deadline and a paused leg cost more than a dear
# host. Its own banner said 'this overnight run only. Remove it once the closure residual R and the
# replicate cycle SD have landed.' Both have: valB_mini closed at n=3, and R = 0.2128 kcal/mol is in
# valb-triangle-reduction.json. So the waiver goes, and the lane is back on the derived DRIFT_MULTIPLE.
# Removing it is the whole reason it was written as a banner rather than a quiet env line: a temporary
# loosening that nobody ever takes out is just a permanent one with an apology attached.
# ─────────────────────────────────────────────────────────────────────────────────────────────────────────

permissions:
  # WRITE, and ONLY so a landed leg can retire its own watch entry (2026-07-27). This was `read`, which was
  # the right default while the watchdog only ever observed. Its DONE branch now reaps — and a reap that
  # prints "REAPED" into a log while being unable to persist anything is a lie in the record, which is worse
  # than not reaping at all. The single mutation this buys is provably one-way (enabled true -> false, only
  # on a leg.json that says status=done; `test_the_reaper_only_ever_disables_and_can_never_arm`), so the
  # watchdog still cannot arm, rent, or resurrect anything with it.
  contents: write

concurrency:
  # Read-modify-write of the relaunch counter is racy in principle; one watchdog at a time makes it safe in
  # practice, and it also guarantees two passes can never both relaunch the same dead unit.
  group: ternary-vast-watchdog
  cancel-in-progress: false

jobs:
  watch:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      VAST_API_KEY: ${{ secrets.VAST_API_KEY }}
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      # The credential a RENTED community host is given, forwarded in cleartext by _vast_onstart.
      # Scoped to the lane prefixes + six S3 actions a leg needs (s3_scoped_policy.py). Unset until
      # trimcrae creates the vast-leg-s3 user -> gpu_backend falls back to the broad key above, which
      # is why lanes in flight kept running. Runbook: research/compute/scoped-s3-credential-runbook.md
      VAST_S3_ACCESS_KEY_ID: ${{ secrets.VAST_S3_ACCESS_KEY_ID }}
      VAST_S3_SECRET_ACCESS_KEY: ${{ secrets.VAST_S3_SECRET_ACCESS_KEY }}
      VAST_S3_SCOPED_STS: ${{ vars.VAST_S3_SCOPED_STS }}
      AWS_DEFAULT_REGION: us-east-2
      GIT_BRANCH: ${{ github.ref_name }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }
      - name: The watchdog itself is alive and parsing
        # MAKE "IT RAN AT ALL" OBSERVABLE. On 2026-07-25 the GCP watchdog was given an inline `python3 -c`
        # guard whose lines sat at column 0; that dedents them out of the `run: |` block and makes the whole
        # workflow INVALID YAML. GitHub's symptom is a 422 about a MISSING TRIGGER, and a `schedule:` cron on
        # an unparseable file simply never fires — so the guard meant to stop the watchdog acting on bad
        # config stopped the watchdog running at all, silently, and nothing reported that it never ran. This
        # step re-parses every workflow (Lane 3's test, reused not rewritten) and validates the watch list
        # BEFORE the pass, and emits a heartbeat annotation so a green tick means "it ran", not "it existed".
        run: |
          set -eo pipefail
          python -m pip install -q pyyaml
          python research/modalities/tests/test_workflows_parse.py | tail -3
          python research/modalities/watchdog_validate.py research/modalities/ternary-vast-watch.json
          echo "::notice title=TVAST WATCHDOG HEARTBEAT::pass starting at $(date -u +%FT%TZ) on ${{ github.ref_name }} — workflows parse, watch list valid."
      - name: One watchdog pass
        run: |
          set -eo pipefail
          # boto3 is load-bearing: the progress signal, the leg records and the relaunch counter are all in
          # S3. Without it the watchdog cannot tell advancing from stalled and must not act.
          python -m pip install -q boto3
          ARGS=""
          [ "${{ github.event.inputs.dry_run }}" = "1" ] && ARGS="--dry-run"
          # A non-zero exit is the point on an alert: it makes GitHub send its own workflow-failure
          # notification, which is the alert path that does not depend on an agent or a session. An
          # ::error:: annotation nobody opens is no better than the silent stall this exists to remove.
          python research/modalities/ternary_vast_watchdog.py --tick $ARGS
      - name: Persist any watch entry the pass retired
        # `always()`: the tick exits non-zero on an alert BY DESIGN, and a pass that both alerts on one unit
        # and retires another must still persist the retirement — otherwise the entry that is genuinely
        # finished keeps inflating the alert count on every later pass.
        if: ${{ always() && github.event.inputs.dry_run != '1' }}
        run: |
          # ⛔ ONE HOME FOR THE PUBLISH (2026-08-01). This hand-rolled `git pull --rebase` + retry, the shape
          # that silently failed to publish on three separate lanes: one conflict leaves the repo mid-rebase,
          # every retry dies on it, and the step reports SUCCESS. See research/compute/publish_artifacts.sh.
          # ⚠ The `git diff --cached --quiet && exit 0` guard went with it: a supervisor that publishes
          # nothing when it changed nothing is byte-identical to one that never ran, and CLAUDE.md §6 is
          # explicit that a cron does not supervise a billing fleet — so knowing it RAN is the point.
          BR="${{ github.ref_name }}"
          bash research/compute/publish_artifacts.sh "$BR" \
            "ternary watch: retire the entries of legs that have landed (watchdog)" \
            research/modalities/ternary-vast-watch.json
      - name: Shakeout hook — exercise the GENERIC multi-kind engine, read-only
        # WHY THIS HOOK LIVES IN THIS FILE. vast-watchdog.yml is the generic engine's own workflow, but a NEW
        # workflow on a feature branch cannot be dispatched at all (dispatch requires the file on the default
        # branch, and a `schedule:` only fires from there too), so it is inert until merged. The repo's
        # standing escape hatch is to dispatch an ALREADY-ON-MAIN workflow with ref=<branch>, which runs that
        # branch's version of the file and its code. This is that hatch, and this is the only on-main workflow
        # that already holds both VAST_API_KEY and the AWS credentials the generic tick needs.
        #
        # IT CANNOT AFFECT THE LIVE TERNARY LEGS. The step is gated on a workflow_dispatch input the CRON
        # never supplies (`github.event.inputs.*` is empty on a schedule event), it touches only the GENERIC
        # watch list — which is disjoint from ternary-vast-watch.json by construction and by test — and it is
        # `continue-on-error`, so a generic-engine problem can never fail the ternary watchdog's own job or
        # mask its verdict.
        #
        # `dry` is read-only. `live` is the pass that also WRITES the progress state, and that write has to be
        # exercised at least once before anyone trusts a RUNNING verdict: prev_scalar is the watchdog's only
        # memory, so a silently failing write makes every tick read as "advanced" and disables the stall
        # detector permanently. `live` can also relaunch a genuinely dead leg, which is the intended
        # behaviour and is capped, interlocked and checkpoint-resuming.
        #
        # Keeping the hook permanently is deliberate: "unproven until you have watched it reach its real
        # success terminus at least once" applies to every new KIND added later, not just the first.
        if: ${{ github.event.inputs.generic_shakeout == 'dry' || github.event.inputs.generic_shakeout == 'live' }}
        continue-on-error: true
        run: |
          set -eo pipefail
          python research/modalities/vast_watchdog.py --kinds
          ARGS="--dry-run"
          [ "${{ github.event.inputs.generic_shakeout }}" = "live" ] && ARGS=""
          python research/modalities/vast_watchdog.py --tick $ARGS
