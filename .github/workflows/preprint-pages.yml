name: Public preprint landing page

on:
  push:
    branches: [main]
    paths:
      - 'site/**'
      - '.github/workflows/preprint-pages.yml'
  pull_request:
    paths:
      - 'site/**'
      - '.github/workflows/preprint-pages.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: preprint-pages-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: read
    steps:
      - name: Check out public site inputs only
        uses: actions/checkout@v6
        with:
          sparse-checkout: site
      - name: Validate and build the public catalogue
        run: |
          python3 -m unittest discover -s site -p 'test_*.py'
          node --check site/literature.js
          node site/test_literature_ui.cjs
          python3 site/build.py
      - name: Configure Pages
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        uses: actions/configure-pages@v5
      - name: Upload public files only
        uses: actions/upload-pages-artifact@v4
        with:
          path: site/_site
  deploy:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
