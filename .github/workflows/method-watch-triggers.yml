name: Reopening-trigger scan

# Searches the literature for the SPECIFIC capabilities this repo has already named as the
# condition for reopening a parked route -- the third column of nr4a3-program-map.md §6b, plus
# the rows in research/method-watch.md. Config: research/method-watch-triggers.json (one home
# for the queries). Fetcher: scripts/trigger_scan.py (pure stdlib).
#
# WHY IT IS SEPARATE FROM method-watch.yml. That workflow runs a broad, generic topic digest
# and emails it. This one is narrow and consequence-carrying: each hit is reported alongside
# the routes/requirements/blockers that trigger would reopen, so a reviewing session sees the
# consequence rather than just the paper. Neither replaces the other.
#
# ⚠ THE CRON BELOW IS A REQUEST, NOT A GUARANTEE. CLAUDE.md §6 records, with measurement, that
# GitHub throttles this repo's schedules to a fraction of what the cron asks for, and that an
# agent has in practice been dispatching runs by hand. Do NOT read a quiet week as "nothing
# landed" -- read research/method-watch-trigger-scan.md, whose "Last run" date and run-history
# table make a scan that did not fire visible. If that date is stale, dispatch this workflow.
#
# ⚠ OUTPUT IS UNVALIDATED LEADS. Hits are substring matches on paper titles. Nothing this
# workflow writes may be cited, and a hit never changes a status by itself.
#
# The sandbox cannot reach EBI/arXiv (CLAUDE.md §6), which is the whole reason this is CI.

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "scan (default — append new hits) | seed (fill the ledger, append nothing; use once after adding triggers)"
        default: "scan"
        required: false
      report_days:
        description: "Only hits published within this many days are appended to IDEAS.md"
        default: "21"
        required: false
      max_per_trigger:
        description: "Cap on IDEAS.md bullets per trigger per run"
        default: "3"
        required: false
      only:
        description: "Comma-separated trigger ids to scan (blank = all enabled)"
        default: ""
        required: false
      commit:
        description: "true (default) commits results back to the triggering branch | false leaves them as a job artifact only"
        default: "true"
        required: false
  schedule:
    # 13:00 UTC Fridays = 9:00 AM ET, i.e. after method-watch.yml's 11:00 UTC digest so the two
    # do not race the same APIs. See the throttling warning above: delivered, not requested.
    - cron: "0 13 * * 5"

permissions:
  contents: write

concurrency:
  group: method-watch-triggers
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # The board must advertise only what each trigger's CURRENT criterion admits.
      # The ledger is cumulative, so a revised query leaves stale hits behind that
      # would otherwise render as current matches forever (the KEAP1 case, 2026-08-05).
      # ⛔ PATH CORRECTED 2026-08-07, AND THE SCAN HAD NOT RUN SINCE 2026-08-03 BECAUSE OF IT.
      # This step named `tests/test_trigger_board_filter.py`; there is NO top-level `tests/` directory in
      # this repository and the file lives at `research/modalities/tests/`. pytest exited
      # "file or directory not found", this step went red, and every step below it — including the scan
      # itself — was SKIPPED. Measured: the last three green runs of this workflow are all 2026-08-03.
      # ⚠ THE FAILURE MODE IS THE DANGEROUS ONE. A trigger register nobody is scanning looks exactly like
      # a trigger register with nothing to report: the file still lists 33 triggers, the queries are still
      # valid, and `--dry-run` still builds them correctly. Only the Actions history says the scan stopped.
      # That is the same shape as `parser_guard`'s "a parser that finds nothing and exits 0", one layer up.
      - name: Board-filter regression test
        run: |
          python3 -m pip install --quiet pytest
          python3 -m pytest research/modalities/tests/test_trigger_board_filter.py -q

      - name: Run the reopening-trigger scan
        env:
          MODE: ${{ inputs.mode }}
          REPORT_DAYS: ${{ inputs.report_days }}
          MAX_PER: ${{ inputs.max_per_trigger }}
          ONLY: ${{ inputs.only }}
        run: |
          set -e
          args=""
          [ "$MODE" = "seed" ] && args="$args --seed"
          [ -n "$REPORT_DAYS" ] && args="$args --report-days $REPORT_DAYS"
          [ -n "$MAX_PER" ] && args="$args --max-per-trigger $MAX_PER"
          [ -n "$ONLY" ] && args="$args --only $ONLY"
          python3 scripts/trigger_scan.py $args

      - name: Upload the board + ledger as an artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: trigger-scan-${{ github.run_id }}
          path: |
            research/method-watch-trigger-scan.md
            research/method-watch-preprint-pipeline.md
            research/method-watch-trigger-hits.json
          retention-days: 30
          if-no-files-found: warn

      # ⛔ THIS STEP USED TO HAND-ROLL `git pull --rebase` + push, AND THAT SHAPE HAS A MEASURED FAILURE
      # MODE: one conflict leaves the repo MID-REBASE, every retry then dies on the wreckage of the
      # first, and the step reports SUCCESS having published nothing. Three lanes lost artifacts that
      # way (GCP 30701290485, selcal 30710853581, step-1 30714482049) — the record is in
      # publish_artifacts.sh, which is the ONE HOME for this operation and which resets onto upstream so
      # a conflict is unrepresentable rather than handled.
      #
      # ⚠ AND THE PATH LIST WAS MISSING THE FILE THE SCAN NOW WRITES. Since the scan was wired into the
      # graph it appends to `pending_signals[]` on each matched `TECH-*` in systems/graph/technologies.json
      # — and that file was never staged, so every signal it wrote would have been discarded on exit. A
      # scan credited with feeding the watch list while silently dropping its output is precisely the
      # credited-but-silent scanner MAINTENANCE.md §4 exists to name.
      #
      # ⚠ THE GENERATED VIEWS GO THROUGH PUBLISH_REGEN, NOT THE PATH LIST. They are derived from the
      # graph, so re-rendering them AFTER the reset picks up upstream's freshest graph plus this run's
      # signals; stamping a copy built before the reset would carry another writer's work backwards.
      # Without this, a signal landing turns `check_views` red on the very next CI run.
      #
      # PUBLISH_IF_CHANGED=1 because this is an EVENT publish, not a heartbeat: a week with no hits
      # should commit nothing rather than stamp an empty tick.
      - name: Commit results to the triggering branch
        if: ${{ inputs.commit != 'false' }}
        env:
          PUBLISH_IF_CHANGED: "1"
          PUBLISH_REGEN: python3 systems/systems_check.py --write-views
          PUBLISH_REGEN_ADD: systems/views
        run: |
          set -e
          # ⛔⛔ pyyaml IS A DEPENDENCY OF `PUBLISH_REGEN`, NOT OF THE SCAN, AND ITS ABSENCE REDDENED
          # THE TRUNK WHILE THIS JOB REPORTED SUCCESS. Measured 2026-08-28 in this workflow's own log
          # (run 33218424772, step "Commit results to the triggering branch"):
          #     [publish-regen] systems_check needs `pyyaml` ... (No module named 'yaml')
          #     ##[warning] `python3 systems/systems_check.py --write-views` did not run
          # `publish_artifacts.sh` soft-fails a failed regen ON PURPOSE, so the primary artifacts
          # still publish — which is right for the artifacts and wrong for the DERIVED view. The
          # commit that resulted (f6bbd439b) carried systems/graph/technologies.json WITHOUT
          # systems/views/registers/technologies.md, and `systems_check --check` then failed G2 on
          # every session's preflight: "technologies.md differs from what the graph renders".
          # ⭐ AND THIS WAS THE SECOND TIME — 8591224fd is an earlier hand repair of the identical
          # drift ("Regenerate technologies register — stale generated view, inherited red build").
          # The step above this one installs only `pytest`, so `--write-views` could never have run
          # here; the comment beside PUBLISH_REGEN promising it does was true of the intent and
          # false of the job.
          python3 -m pip install --quiet pyyaml
          bash research/compute/publish_artifacts.sh "${GITHUB_REF_NAME}" \
            "Reopening-trigger scan $(date -u +%Y-%m-%d) (CI)" \
            research/method-watch-trigger-scan.md \
            research/method-watch-preprint-pipeline.md \
            research/method-watch-trigger-hits.json \
            research/IDEAS.md \
            systems/graph/technologies.json
