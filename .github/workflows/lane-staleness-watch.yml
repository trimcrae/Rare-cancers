name: Cross-lane staleness watch — has any lane gone stale, and is that expected?

# WHAT THIS IS, in one sentence: the thing that notices when ANY billing lane stops producing evidence —
# including the lanes with no host at all, which every liveness check reads as "nothing to watch".
#
# WHY IT EXISTS. `fleet-supervision-alarm.yml` already asks "has supervision stopped" — but only for the
# step-1 fan-out, and only about ONE artifact. On 2026-07-27 five lanes failed in four different shapes and
# only one of them was in that workflow's field of view:
#
#   ~ 85 min  a valB cohort DEAD while its cron watchdog printed "advancing at warmup/512 … Leaving it alone"
#   ~ 2 h     the step-1 fan-out decayed 18 -> 5 hosts across SEVEN GREEN TICKS (a guard inverted on a null)
#   ~ 53 min  two 5a-KS legs crash-looping at 0 % GPU on a dead credential — the host cannot stop its own bill
#   ~ 3 h     ⚠ the closure triangle IDLE after `triangle-prime` succeeded, because the lane that would
#             dispatch the next step ended its turn. NO LIVE INSTANCE AT ALL. Nothing detects this today.
#
# ⚠ AND WHAT IT MUST NOT BE. It never rents, destroys, reaps, nudges or prices anything — every destructive
# act stays in the lanes' own `collect` paths, which read the start response that separates "outbid,
# restartable" from "GPU gone, destroy it". A watcher that could also act would be a second unreviewed
# control path. It also carries NO Vast key, NO S3 credential and NO pip install for the verdict itself: a
# supervision alarm that can fail for reasons unrelated to the fleet is noise, and a dead credential is one
# of the failures it exists to report.
#
# ★★ DELIVERY DOES NOT DEPEND ON GITHUB'S SCHEDULER, AND THAT IS THE WHOLE POINT (CLAUDE.md §6: a `schedule:`
# cron does not supervise a billing fleet). Measured 2026-07-27: scheduled delivery on this repo ran at
# 141-238 min against a requested */15-*/20, and 25 of the last 30 step-1 autoscale runs were an AGENT
# hand-dispatching. So the REAL cadence here comes from two dispatchers that are not the cron:
#
#   1. `step1-fanout-supervisor.yml` — a long-lived job whose in-process loop owns its own interval and
#      dispatches this workflow every `watch_every_ticks` ticks. That loop is the cadence.
#   2. `step1-fanout-autoscale.yml`, at the tail, under `if: always()` — SO IT ALSO FIRES WHEN THE TICK
#      FAILS. That is exactly when supervision is most likely to be down: on 2026-07-27 the 11:37 AM tick
#      died on its FIRST step and measured nothing, while its `always()` steps kept the commit trail moving.
#
# The `schedule:` below is a COLD-START path only — when no supervisor is alive, a throttled check is still
# better than none, and it is what gets a human's attention if both dispatchers have stopped. It is NOT the
# cadence and must never be described as one.
#
# ★★★ NOTHING HERE NOTIFIES ANYBODY ANY MORE — IT PUBLISHES (trimcrae, 2026-07-31, verbatim: *"You're
# emailing me way too much. You should not be emailing me."*). Three push channels lived in this file and all
# three are gone:
#
#   1. A MAIL STEP THAT HAD NEVER DELIVERED ANYWAY. Across 159 failing runs its `send_email` took the SES
#      branch (the env block passed the AWS keys but not `MAIL_PASSWORD`, which has never appeared in this
#      file in ANY commit on ANY branch) and SES answered `AccessDenied ... nr4a3-ci-submitter is not
#      authorized to perform ses:SendEmail` (run 30602768073, job 91068780404). The old comment blamed the
#      SES sandbox — wrong diagnosis; a sandboxed account says `MessageRejected: Email address is not
#      verified`. DELETED, not defaulted off, and `mailer._send_ses` now refuses outright.
#   2. A GITHUB ISSUE ESCALATION, built earlier the same day and working. Every issue open, comment and close
#      emails the repo owner, so being reliable was the same thing as mailing him. `issues: write` is revoked
#      — the capability, not just the config.
#   3. THE DELIBERATE `exit 1`. A red SCHEDULED run emails the owner; that was its stated purpose. Now an
#      `::error` annotation, which is just as visible on the run page and sends nothing.
#
# ⚠ WHAT REPLACED THEM, AND WHY IT IS ENOUGH. The requirement was never "tell trimcrae" — it is that
# supervision survives with no LLM in the loop. So this job now WRITES AND COMMITS the board:
# `research/modalities/alarm-state.json` (`alarm_state.py`), carrying `_generated_utc` / `_stale_after_utc` /
# `_stale_after_means` exactly like `work-ledger.json`, so A READER WHO OPENS THE FILE CAN TELL IT IS DEAD
# WITHOUT RUNNING ANYTHING. The staleness window is READ from the ledger's `_expected_tick_min`, never typed.
# The full inventory of what can and cannot reach a human: `research/compute/notification-channels.md`.
#
# COST: $0. GitHub-hosted minutes are free on a public repo and this job is a few seconds of stdlib Python.

on:
  workflow_dispatch:
    inputs:
      fleet_branch:
        description: "branch carrying the STEP 1 lane's artifacts (same meaning as in step1-fanout-autoscale.yml)"
        default: "main"
      ternary_branch:
        description: "branch carrying the TERNARY family's artifacts. NOT the same branch as the fan-out: gpu-ternary-fep-vast.yml is dispatched with ref=main and commits there, so reading these lanes off the fleet branch shows state hours old."
        default: "main"
      write_history:
        description: "1 = persist the census history so the next run can age a flat census; 0 = read only"
        default: "1"
  schedule:
    # COLD START ONLY — see the header. Deliberately hourly, not */15: asking for a high frequency on a
    # throttled repo does not get you one, it only adds queue pressure to the same pool the ticks compete in.
    - cron: "23 * * * *"

permissions:
  contents: write     # the census history and the work ledger are committed back to the fleet branch
  # `write`, up from `read`, so the WORK LEDGER can dispatch the next action itself (trimcrae's 2026-07-27
  # ruling: auto-assign everything, never escalate). Two things make that safe and neither is a promise:
  # the ledger may only name a workflow in its own allowlist, and it is structurally incapable of passing a
  # price, a bid, a ceiling or a ratio (`work_ledger.DISPATCHABLE` + `_FORBIDDEN_INPUT_TOKENS`, asserted by
  # `tests/test_work_ledger.py`). Every dispatch therefore lands in a lane's OWN launcher, behind that
  # lane's §6 market gate. This job still carries NO Vast key and NO object-store credential.
  actions: write
  # ⛔ NO `issues:` PERMISSION, AND THAT IS LOAD-BEARING (2026-07-31). Opening, commenting on or closing an
  # issue emails the repo owner, and trimcrae asked not to be emailed. Revoking the CAPABILITY is deliberately
  # blunter than a config flag: nothing can open an issue without it, whatever any later edit says. The
  # module that used to do it is deleted, and `tests/test_no_push_notifications.py` fails CI if either
  # the permission or a mail call comes back.

concurrency:
  group: lane-staleness-watch
  cancel-in-progress: false

jobs:
  watch:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          # The lanes' artifacts live on the FLEET branch, never on the ref this runs from. Reading main and
          # concluding a lane is dead is the exact mistake made at 9:37 AM ET on 2026-07-27.
          ref: ${{ github.event.inputs.fleet_branch || 'main' }}
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }

      # NO `pip install` here. Not an optimisation — a dependency is a way for this to fail for a reason
      # unrelated to the lanes, and the module imports nothing outside the stdlib (asserted by
      # tests/test_lane_staleness_watch.py, which also asserts it imports nothing from the lanes it watches).
      # ★★ MATERIALISE THE TERNARY FAMILY'S ARTIFACTS FROM ITS OWN BRANCH (2026-07-27, 8:10 PM ET).
      #
      # The checkout above is the FLEET branch, which is correct for step 1 and WRONG for every ternary lane:
      # `gpu-ternary-fep-vast.yml` runs with `GIT_BRANCH: main` and commits its watch list, launch ledger and
      # market holds to main. Measured at 8:06 PM, the two branches disagreed like this:
      #
      #   main                      enabled modes: edge_reps 4, triangle 4        ledger 8:03 PM ET
      #   claude/max-effort-2dq11l  enabled modes: edge_reps 4, triangle_smoke 1  ledger 6:25 PM ET
      #
      # So the watcher could not see the closure triangle at all and called it IDLE-UNEXPECTED — "someone has
      # to dispatch its next step" — while all 4 of its legs were hosted and billing. It also called the valB
      # replicates BILLING-NOT-ADVANCING 20 minutes after they were re-placed. Two red lanes, both healthy.
      #
      # A false red is not a cheap error: it is indistinguishable from a true one, so it teaches the reader to
      # ignore the alarm. `git show` into a plain directory (the checkout is already `fetch-depth: 0`) costs
      # nothing and needs no second checkout action.
      - name: Materialise the ternary family's artifacts from ITS branch
        run: |
          set -eo pipefail
          BR="${{ github.event.inputs.ternary_branch || 'main' }}"
          mkdir -p /tmp/roots/ternary
          git fetch --no-tags origin "$BR"
          n=0
          for f in $(git ls-tree --name-only "origin/$BR" research/modalities/ | grep '\.json$'); do
            git show "origin/$BR:$f" > "/tmp/roots/ternary/$(basename "$f")" && n=$((n+1))
          done
          echo "materialised $n json artifact(s) from origin/$BR"
          # A root that came out EMPTY would make every ternary lane read as having no evidence — a
          # fleet-wide false alarm from a silent failure. Fail loudly here instead.
          [ "$n" -gt 0 ] || { echo "::error title=TERNARY ROOT EMPTY::no artifacts materialised from origin/$BR"; exit 1; }
      - name: Is any lane stale, and is that expected?
        id: watch
        working-directory: research/modalities
        env:
          # A token is a HEADER, not a dependency: the zero-install property above is untouched, and the
          # module still falls back to an anonymous read plus a retry ladder if this is ever absent.
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set +e
          python3 lane_staleness_watch.py \
            --json /tmp/lane-staleness-verdict.json \
            --source-root ternary=/tmp/roots/ternary \
            $([ "${{ github.event.inputs.write_history || '1' }}" = "1" ] && echo --write-history) \
            | tee /tmp/lane-staleness.log
          echo "rc=${PIPESTATUS[0]}" >> "$GITHUB_OUTPUT"

      # The step-1 FLEET supervision question, asked here rather than only in the hourly
      # `fleet-supervision-alarm.yml`, for one reason: THIS job runs on the supervisor's ~16 min cadence and
      # already commits, so it is the only place the answer can be made DURABLE. Failure is tolerated — an
      # unavailable verdict must never cost us the lane rows, and `alarm_state.py` records the gap explicitly
      # rather than rendering "not measured" as "fine".
      - name: Fleet supervision verdict (for the durable board)
        if: ${{ always() }}
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set +e
          python3 research/modalities/fleet_supervision_alarm.py \
            --progress research/modalities/step1-fanout-progress.json \
            --json /tmp/fleet-supervision-verdict.json
          exit 0

      # ★★ THE PULL CHANNEL — publish, do not notify (trimcrae, 2026-07-31). This writes the board that a
      # human reads WHEN THEY CHOOSE TO, and it is committed below so it survives the run.
      #
      # ⚠ IT DECIDES NOTHING and CANNOT FAIL THE RUN. It re-derives no verdict — it records each lane's
      # `ok` / `verdict` as given (a second opinion on the same evidence is a second thing to keep in sync,
      # CLAUDE.md §1) — and it always exits 0, because a non-zero exit here would fail a scheduled run, which
      # emails the repo owner and would quietly reinstate the push channel this replaced.
      - name: Write the alarm board (PULL — nothing is sent)
        if: ${{ always() }}
        run: |
          set -eo pipefail
          python3 research/modalities/alarm_state.py \
            --lane-report /tmp/lane-staleness-verdict.json \
            --fleet-verdict /tmp/fleet-supervision-verdict.json \
            --state research/modalities/alarm-state.json \
            --ledger research/modalities/work-ledger.json \
            --write | tee /tmp/alarm-board.log
          {
            echo '### Alarm board (committed to `research/modalities/alarm-state.json`)'
            echo ''
            echo '```'
            cat /tmp/alarm-board.log
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      # ★ ALWAYS, and AFTER the check: the verdict must be readable whether or not anything fired, otherwise
      # this alarm has the same "silence is ambiguous" defect it was built to remove.
      - name: Verdict (readable on a red run too)
        if: ${{ always() }}
        run: |
          {
            echo '### Cross-lane staleness verdict'
            echo ''
            echo '```'
            cat /tmp/lane-staleness.log 2>/dev/null || echo 'THE WATCH ITSELF FAILED — no verdict was produced.'
            echo '```'
            echo ''
            echo '<details><summary>full JSON</summary>'
            echo ''
            echo '```json'
            cat /tmp/lane-staleness-verdict.json 2>/dev/null || echo '{"verdict": "WATCH ITSELF FAILED"}'
            echo '```'
            echo ''
            echo '</details>'
          } >> "$GITHUB_STEP_SUMMARY"

      # ═══════════════════════════════════════════════════════════════════════════════════════════════════
      # THE WORK LEDGER — the strictly larger question: is there anything, anywhere, that NOBODY is carrying?
      # ═══════════════════════════════════════════════════════════════════════════════════════════════════
      # ★ IT RUNS HERE RATHER THAN IN A NEW WORKFLOW, and that is the design, not convenience. This job is
      # already reached by TWO INDEPENDENT DISPATCHERS that are not the cron (the supervisor's in-job loop,
      # and `step1-fanout-autoscale.yml`'s `if: always()` tail, which fires even when the tick itself
      # fails), plus the cold-start cron above. A new workflow would have had to earn that, and CLAUDE.md §6
      # is explicit that a `schedule:` cannot be the cadence for anything that supervises spend.
      #
      # ⚠ `always()`, because the step above EXITS NON-ZERO when a lane is red — which is precisely the run
      # on which knowing what is unowned matters most. Without it the ledger would go silent exactly when
      # something has gone wrong, which is the defect it exists to remove.
      - name: Work ledger — every open item, its owner, and what advances it
        if: ${{ always() }}
        id: ledger
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set +e
          python3 research/modalities/work_ledger.py \
            --root research/modalities \
            --source-root ternary=/tmp/roots/ternary \
            --ledger research/modalities/work-ledger.json \
            --board --write \
            --json /tmp/work-ledger.json \
            --emit-dispatch /tmp/work-ledger-dispatch.json \
            | tee /tmp/work-ledger.log
          echo "rc=${PIPESTATUS[0]}" >> "$GITHUB_OUTPUT"

      # ★★ THE DISPATCH. Auto-assign, never escalate — so this fires the next action itself instead of
      # telling trimcrae about it. Everything that bounds the risk he named ("a genuinely broken item could
      # loop indefinitely and burn rentals while looking busy") has already happened by the time this step
      # runs, in the module: the plan is DEDUPLICATED (nineteen stalled units produce ONE tick, not
      # nineteen), CAPPED per run, and empty for any item whose bounded retry budget is spent or which is
      # resting on a §6 price hold. This step only executes what survived all of that.
      #
      # ⚠ IT PASSES NO INPUTS OF ITS OWN. Whatever the module wrote is what is sent, and the module cannot
      # write a price. A failed dispatch is a WARNING, not a failure: the entry keeps its recorded attempt
      # and comes back next tick, which is the same path a lost run already takes.
      - name: Dispatch what the ledger says nobody is carrying
        if: ${{ always() }}
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -uo pipefail
          [ -s /tmp/work-ledger-dispatch.json ] || { echo "no dispatch plan file"; exit 0; }
          python3 - <<'PY' > /tmp/dispatch.sh
          import json, shlex
          rows = json.load(open("/tmp/work-ledger-dispatch.json"))
          for r in rows:
              if r.get("capped"):
                  print(f"echo '::notice title=LEDGER DISPATCH CAPPED::{r['workflow']} held back this run'")
                  continue
              args = " ".join(f"-f {shlex.quote(k)}={shlex.quote(str(v))}"
                              for k, v in (r.get("inputs") or {}).items())
              print(f"gh workflow run {shlex.quote(r['workflow'])} --ref main {args} "
                    f"&& echo '::notice title=LEDGER DISPATCHED::{r['workflow']} for "
                    f"{len(r['serves'])} entr(ies)' "
                    f"|| echo '::warning title=LEDGER DISPATCH FAILED::{r['workflow']} — the entries keep "
                    f"their recorded attempt and return next tick'")
          PY
          if [ ! -s /tmp/dispatch.sh ]; then
            echo "::notice title=LEDGER HAS NOTHING TO DISPATCH::every open item is advancing, resting on a gate, done, or blocked with its budget spent"
            exit 0
          fi
          bash /tmp/dispatch.sh

      - name: IN FLIGHT board (generated from the ledger — no entry, no row)
        if: ${{ always() }}
        run: |
          {
            echo '### Work ledger + IN FLIGHT board'
            echo ''
            echo '```'
            cat /tmp/work-ledger.log 2>/dev/null || echo 'THE LEDGER ITSELF FAILED — no board was produced. Every open item is unwatched until this is fixed.'
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      # ⛔ A WEDGED `pending` RUN IS A SUPERVISION OUTAGE THAT LOOKS LIKE HEALTH — which is exactly this
      # workflow's subject. MEASURED 2026-08-01: a selcal `mode=launch` sat `pending` for 19 minutes with
      # `total_count: 0` jobs, holding the `selcal-launch` concurrency group, while its group was free, the
      # repo had 5 runs in flight and 0 queued. `launch` is what RE-PLACES A HOST THAT DIED, so the lane
      # ticked, reaped and rendered perfectly healthy while every re-placement it asked for was swallowed.
      # Cancelling it released the group instantly — the next launch went straight to `in_progress`.
      # ⚠ It cancels ONLY runs with ZERO jobs, which is why it cannot destroy work: no job means no step ran,
      # nothing was rented and no checkpoint exists. See `stuck_run_guard`'s docstring for the ruled-out
      # alternatives and `tests/test_stuck_run_guard.py` for the boundary that must not widen.
      - name: Clear any run wedged `pending` with zero jobs (it blocks re-placement)
        if: ${{ always() }}
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python3 research/modalities/stuck_run_guard.py || true

      # The census history is the ONLY state this workflow keeps, and it is used for one thing: knowing how
      # long a committed-iteration census has been bit-identical. A failed push is SAFE BY CONSTRUCTION and
      # deliberately does not fail the job — see `update_history`'s docstring and
      # `test_a_stale_history_under_reports_flatness_rather_than_inventing_it`: a stale history can only
      # UNDER-report flatness, never invent it. Warn, do not die.
      - name: Persist the census history
        if: ${{ always() && (github.event.inputs.write_history || '1') == '1' }}
        run: |
          # ⛔ ONE HOME FOR THE PUBLISH (2026-08-01). This hand-rolled `git pull --rebase` + retry, the shape
          # that silently failed to publish on three separate lanes: one conflict leaves the repo mid-rebase,
          # every retry dies on it, and the step reports SUCCESS. See research/compute/publish_artifacts.sh.
          # ⚠ The `git diff --cached --quiet && exit 0` guard went with it: a supervisor that publishes
          # nothing when it changed nothing is byte-identical to one that never ran, and CLAUDE.md §6 is
          # explicit that a cron does not supervise a billing fleet — so knowing it RAN is the point.
          BR="${{ github.event.inputs.fleet_branch || 'main' }}"
          bash research/compute/publish_artifacts.sh "$BR" \
            "lane staleness watch: census history + work ledger + alarm board (CI)" \
            research/modalities/lane-staleness-history.json \
            research/modalities/work-ledger.json \
            research/modalities/alarm-state.json \
            research/modalities/stuck-run-guard.json
      # ⛔ THE RUN IS NOT FAILED, DELIBERATELY (2026-07-31). This step used to `exit 1` **because** GitHub
      # emails the repository owner when a scheduled workflow fails — that was its stated purpose, and it is
      # exactly what trimcrae asked to stop. It fired on 159 runs. An `::error` annotation is just as visible
      # on the run page and in the Actions list and sends nothing; the durable answer is the committed board.
      # Restoring `exit 1` is a NOTIFICATION decision, not a CI decision, and needs trimcrae's word first.
      - name: Say so loudly — WITHOUT notifying anyone
        if: ${{ always() && steps.watch.outputs.rc != '0' }}
        run: |
          echo "::error title=A LANE NEEDS ATTENTION::see the job summary, and research/modalities/alarm-state.json for the durable board. This run is deliberately NOT failed: a red scheduled run emails the repo owner."
