name: Vast job watchdog — any kind (session-independent)

# WHY THIS EXISTS ALONGSIDE ternary-vast-watchdog.yml, RATHER THAN REPLACING IT.
# That workflow watches the four RUNG 2b ternary legs and it works. Its watch-list schema, though, is
# ternary-specific to the bone — watch_entry(leg_id, seed, direction, mode, timestep_fs, warmup_timestep_fs),
# a unit_id built from exactly those, and a relaunch that dispatches the ternary launcher. Forcing a
# metadynamics MD leg into it would either invent relaunch parameters the leg was never launched with (the
# schema has nowhere to put metad_ns) or track a progress scalar that measures nothing (a metad leg writes no
# OpenFE commit store, so the ternary census reads 0 forever and the leg looks permanently stalled).
# Monitoring that watches nothing is this repo's most expensive defect class, so the generalisation lives here
# as a KIND REGISTRY over the one shared decision policy, and a kind the engine does not implement is REFUSED
# at validation time rather than silently "covered".
#
# THE TWO WATCH LISTS ARE DISJOINT ON PURPOSE. ternary-vast-watch.json keeps its own watchdog; this one reads
# vast-watch.json. Two relaunchers for one unit is the hazard, not the fix — tests/test_vast_watchdog.py
# asserts no unit_id appears in both.
#
# Per enabled entry, per its kind:
#   result artifact in the object store          -> DONE     (disable the entry)
#   an instance up AND the scalar went UP        -> RUNNING  (emit progress)
#   a RECORDED crash and no instance             -> FAILED   (alert; a relaunch reproduces the reason)
#   alive but frozen                             -> STALL    (alert; a relaunch hangs the same way)
#   neither                                      -> DIED     (relaunch from the last checkpoint, capped)
#
# "Alive" is deliberately not enough. A rented Vast box can sit up with a dead container or an idle GPU, so
# RUNNING requires ADVANCE in a durable, phase-monotone scalar — not the existence of an instance.
#
# A capacity refusal (`resources_unavailable`) is handled by each lane's own launcher policy — destroy, add
# the machine to the exclusion set, pick another host; never wait, never raise the bid. It is DELEGATED to,
# not duplicated, so there is only one of it.
#
# SAFETY: a per-UTC-day relaunch counter in S3 caps runaway re-dispatch; the pass is a no-op on an empty or
# all-disabled list; only a DIED entry relaunches; a DIED entry whose lane has its OWN relaunching workflow in
# flight withholds the relaunch (two hosts writing one restart set is an interleaved trajectory nothing
# reports); and if the Vast instance list cannot be read the pass REFUSES to act. All state is in the repo +
# S3, so it survives container restarts with no agent awake.
#
# NB a `schedule:` trigger only fires from the DEFAULT BRANCH, so this file must be on main to run at all.
# Until then, exercise it with workflow_dispatch (an on-main workflow dispatched with ref=<branch> runs THAT
# branch's version of the file and its code).

on:
  schedule:
    - cron: "8 * * * *"    # ⚠ THE "~55-65 min" THAT USED TO BE WRITTEN HERE IS RETIRED — IT WAS A
                              # ONE-DAY OBSERVATION QUOTED AS A CONSTANT. It held on 2026-07-26; MEASURED
                              # delivery of THIS workflow on 2026-07-27 was 1:59 AM, 5:56 AM, 8:53 AM and
                              # 11:37 AM ET -> gaps of 235, 238, 177 and 164 MINUTES. Planning against the
                              # retired figure means assuming a leg is checked hourly when it is really
                              # checked every 3-4 h, which is how 16 rentals went unwatched that morning.
                              # Per CLAUDE.md §1 the number is not re-typed here: it is MEASURED and printed
                              # on every run of fleet-supervision-alarm.yml, which is its one home.
                              # Still true, and independent of cadence: the legs this covers advance
                              # ~5-6 ns/h, so a pass at ANY of these intervals sees an unambiguous advance
                              # and a genuinely frozen leg is caught within two passes.
  workflow_dispatch:
    inputs:
      dry_run:
        description: "1 = report what it WOULD do without relaunching or incrementing the counter"
        default: "0"
        required: false
      verify_armed:
        description: "comma-separated unit_ids that MUST be present, enabled and valid (read-back check)"
        default: ""
        required: false

permissions:
  # READ at the file level, and it stays read: `step1-fanout-tick` below only needs `actions: write` to POST
  # a dispatch, and the narrowest grant is the one that is not shared. The `watch` job overrides this with
  # `contents: write` for one reason only — a landed or permanently-blocked unit must be able to retire its
  # OWN watch entry — and that mutation is provably one-way (`enabled: true -> false`, on evidence from the
  # durable store; `vast_watchdog.reap` never sets `enabled: true` and never writes `_parked_why`).
  contents: read

concurrency:
  # Read-modify-write of the relaunch counter is racy in principle; one watchdog at a time makes it safe in
  # practice, and it also guarantees two passes can never both relaunch the same dead unit.
  group: vast-watchdog
  cancel-in-progress: false

jobs:
  watch:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      # WRITE, and ONLY so a finished or permanently-blocked unit can retire its own watch entry — the same
      # grant, for the same reason, that ternary-vast-watchdog.yml already carries. It was `read`, which was
      # right while this watchdog only ever observed. Its DONE branch now reaps, and a reap that prints
      # "REAPED" into a log while being unable to persist anything is a lie in the record: it would re-decide
      # the same retirement on every pass forever, which is exactly the state that produced 47 consecutive
      # red scheduled runs. The single mutation this buys is one-way — `enabled: true -> false`, only on
      # evidence read from the durable store — so the watchdog still cannot arm, rent or resurrect anything
      # with it (tests/test_vast_watchdog.py::test_the_reaper_only_ever_disables_and_can_never_arm).
      contents: write
    env:
      VAST_API_KEY: ${{ secrets.VAST_API_KEY }}
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      # The credential a RENTED community host is given, forwarded in cleartext by _vast_onstart.
      # Scoped to the lane prefixes + six S3 actions a leg needs (s3_scoped_policy.py). Unset until
      # trimcrae creates the vast-leg-s3 user -> gpu_backend falls back to the broad key above, which
      # is why lanes in flight kept running. Runbook: research/compute/scoped-s3-credential-runbook.md
      VAST_S3_ACCESS_KEY_ID: ${{ secrets.VAST_S3_ACCESS_KEY_ID }}
      VAST_S3_SECRET_ACCESS_KEY: ${{ secrets.VAST_S3_SECRET_ACCESS_KEY }}
      VAST_S3_SCOPED_STS: ${{ vars.VAST_S3_SCOPED_STS }}
      AWS_DEFAULT_REGION: us-east-2
      # Read-only, and only used to ask whether a lane's own workflow has a run in flight before relaunching.
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      GIT_BRANCH: ${{ github.ref_name }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }
      # ★★ THE ENGINE IS MAIN'S; THE WATCH LIST IS THE LAUNCHER'S. A `schedule:` only fires from the default
      # branch and the checkout above is bare, so this job runs MAIN's vast-watch.json — while
      # congeneric_fanout_vast._arm_watchdog writes that file inside a CI job that commits to the FLEET
      # BRANCH. Arming therefore lands somewhere this tick never looks: the single shakeout entry is on main
      # only because a lane happened to merge, and the eighteen units the terminus gate releases would not be.
      # Fold the fleet branch's list in first. Every failure path leaves the checked-out file byte-untouched,
      # so the fallback is exactly the previous behaviour — and the validate step below still runs on the
      # merged file, so a malformed branch list ABORTS the pass rather than steering it. The logic lives in
      # the tested module, never inline: an inline `python3 -c` at column 0 is what made this repo's other
      # watchdog file invalid YAML, and a cron on an unparseable file simply never fires.
      - name: Fold in the fleet branch's watch list (arming happens there, not on main)
        run: |
          set -eo pipefail
          FLEET=$(python - <<'PY'
          import re
          s = open(".github/workflows/step1-fanout-autoscale.yml").read()
          m = re.search(r"fleet_branch \|\| '([^']+)'", s)
          print(m.group(1) if m else "")
          PY
          )
          echo "fleet branch resolved from step1-fanout-autoscale.yml: '$FLEET'"
          python research/modalities/vast_watchdog.py --merge-branch-list "$FLEET"
      - name: The watchdog itself is alive and parsing
        # MAKE "IT RAN AT ALL" OBSERVABLE. On 2026-07-25 the GCP watchdog was given an inline `python3 -c`
        # guard whose lines sat at column 0; that dedents them out of the `run: |` block and makes the whole
        # workflow INVALID YAML. GitHub's symptom is a 422 about a MISSING TRIGGER, and a `schedule:` cron on
        # an unparseable file simply never fires — so the guard meant to stop the watchdog acting on bad
        # config stopped the watchdog running at all, silently, for days. This step re-parses every workflow
        # (the shared test, reused not rewritten), validates BOTH watch lists against the KIND REGISTRY the
        # running code actually implements, and emits a heartbeat annotation so a green tick means "it ran",
        # not "it existed".
        run: |
          set -eo pipefail
          python -m pip install -q pyyaml
          python research/modalities/tests/test_workflows_parse.py | tail -3
          python research/modalities/watchdog_validate.py research/modalities/vast-watch.json
          python research/modalities/watchdog_validate.py research/modalities/ternary-vast-watch.json
          python research/modalities/vast_watchdog.py --kinds
          echo "::notice title=VAST WATCHDOG ALIVE::pass starting at $(date -u +%FT%TZ) on ${{ github.ref_name }} — workflows parse, both watch lists valid against the implemented kinds."
      - name: Read-back — the units that must be covered really are
        # Only meaningful on demand, right after arming. The config guard cannot catch a vanished entry,
        # because an EMPTY list is a legitimate state (nothing running) and must stay a no-op; only something
        # that knows which units are supposed to be covered can tell "nothing to watch" from "what I was
        # watching went missing". That happened on 2026-07-25 and a billed leg ran unwatched.
        if: ${{ github.event.inputs.verify_armed != '' }}
        run: |
          set -eo pipefail
          python research/modalities/vast_watchdog.py --verify-armed "${{ github.event.inputs.verify_armed }}"
      - name: One watchdog pass
        run: |
          set -eo pipefail
          # boto3 is load-bearing: every kind's progress signal and the relaunch counters are in S3. Without
          # it the watchdog cannot tell advancing from stalled and must not act.
          python -m pip install -q boto3
          ARGS=""
          [ "${{ github.event.inputs.dry_run }}" = "1" ] && ARGS="--dry-run"
          # A non-zero exit is the point on an alert: it makes GitHub send its own workflow-failure
          # notification, which is the alert path that does not depend on an agent or a session. An
          # ::error:: annotation nobody opens is no better than the silent stall this exists to remove.
          #
          # ⚠ AND IT IS THE POINT ONLY IF GREEN STILL MEANS SOMETHING. Between 2026-07-27 11:37 AM ET and
          # 2026-07-30 7:58 PM ET this job failed 47 consecutive scheduled runs on a lane that was entirely
          # finished — 18 units DONE and one permanently blocked — because the DONE branch merely PRINTED
          # "set enabled=false" and nothing did it. An alarm that fires every 1-2 h regardless of fleet state
          # carries no information, and CLAUDE.md §6 makes this the only alarm that reaches a human with no
          # agent in the loop. The reap below is what keeps a green tick meaningful.
          python research/modalities/vast_watchdog.py --tick $ARGS
      - name: Persist any watch entry the pass retired
        # `always()`: the tick exits non-zero on an alert BY DESIGN, and a pass that both alerts on one unit
        # and retires another must still persist the retirement — otherwise the entry that is genuinely
        # finished keeps inflating the alert count on every later pass. Same idiom, same push-race handling,
        # as ternary-vast-watchdog.yml's own reap step; copied rather than re-invented so the two watchdogs
        # cannot drift in how they persist.
        #
        # ⚠ WHAT ELSE THIS COMMIT CAN CARRY, STATED PLAINLY. The first step of this job folds the FLEET
        # BRANCH's watch list over the checked-out one, so the staged file may also contain entries that
        # branch armed. That is intended, not a leak: CLAUDE.md §7 — a branch a workflow runs from must never
        # be the only home of an artifact, and that drift already cost a day on this very lane. The retire
        # text is stamped from the ARTIFACT's own mtime rather than the clock, so a pass with nothing new to
        # say produces a byte-identical file and therefore no commit at all.
        if: ${{ always() && github.event.inputs.dry_run != '1' }}
        run: |
          # ⛔ ONE HOME FOR THE PUBLISH (2026-08-01). This hand-rolled `git pull --rebase` + retry, the shape
          # that silently failed to publish on three separate lanes: one conflict leaves the repo mid-rebase,
          # every retry dies on it, and the step reports SUCCESS. See research/compute/publish_artifacts.sh.
          # ⚠ The `git diff --cached --quiet && exit 0` guard went with it: a supervisor that publishes
          # nothing when it changed nothing is byte-identical to one that never ran, and CLAUDE.md §6 is
          # explicit that a cron does not supervise a billing fleet — so knowing it RAN is the point.
          BR="${{ github.ref_name }}"
          bash research/compute/publish_artifacts.sh "$BR" \
            "vast watch: retire the entries of units that landed or are permanently blocked (watchdog)" \
            research/modalities/vast-watch.json
  # ===========================================================================================================
  # SECOND, INDEPENDENT TRIGGER FOR THE STEP 1 FAN-OUT TICK — redundancy on a thin margin, NOT a repair.
  #
  # ⚠ READ THIS FIRST, BECAUSE THE ORIGINAL VERSION OF THIS COMMENT WAS WRONG WITHIN THE HOUR.
  # step1-fanout-autoscale.yml's own `schedule` DOES fire. It fired for the first time at 5:30 PM ET on
  # 2026-07-26 (run 30221227033, completed success 5:32 PM) — 70 min after the file landed on main. This job
  # was built while that was still unproven and the header then said "its OWN cron has never fired"; that
  # sentence is retired. Nothing here is compensating for a broken workflow.
  #
  # WHAT THE DELAY ACTUALLY WAS (2026-07-26, LANE 18). First-fire latency, measured rather than guessed:
  # on this repo's own recently-added scheduled workflows the first `schedule` event came 56 min
  # (ternary-vast-watchdog), 208 min (vast-watchdog) and 210 min (vast-price-sample) after the file landed.
  # step1 at 70 min sits inside that distribution. It was never mis-registered either — its file parses,
  # `state: active`, and `schedule:`/`workflow_dispatch:` are SIBLINGS under one `on:` mapping, so its
  # successful dispatches already proved GitHub had read the cron.
  #
  # SO WHY KEEP A SECOND TRIGGER. Because `*/20` IS NOT WHAT IT GETS, and that is the real finding. Measured
  # schedule-to-schedule gaps on this repo: vast-watchdog (asks */15) 56-97 min; ternary-leg-watchdog (asks
  # */15) 57-97 min; vast-price-sample (asks hourly) 85-148 min. GitHub throttles this repo's crons to roughly
  # ONE RUN PER WORKFLOW PER HOUR regardless of what is requested — i.e. the release path's real margin is ~3x
  # thinner than the cron literal reads. A thinner margin is an argument FOR redundancy, not against it.
  #
  # WHY IT MATTERS TONIGHT. The fan-out gate (FANOUT_REQUIRE_PROVEN_TERMINUS) holds 18 of the 19 edges back
  # until the shakeout unit commits a ddg.json, expected ~2:00-3:30 AM ET. The release happens on the next tick
  # after that. A single missed trigger on that path means the lane does ONE NINETEENTH of the work overnight
  # — and it LOOKS fine, because every dispatched run reports green. Silent, expensive, and the exact failure
  # shape this repo keeps getting bitten by; two independent triggers for that one event is proportionate.
  #
  # WHY A DISPATCH AND NOT A COPY OF THE TICK. CLAUDE.md rule 1: one fact, one place. The gate, the launcher,
  # the idempotence and the progress commit all live in step1-fanout-autoscale.yml + congeneric_fanout_vast.py
  # and are NOT reimplemented here. This job only pulls the trigger. So the two cron paths cannot drift, and
  # when step1's own cron does start firing the only cost of the overlap is a no-op tick.
  #
  # SAFE TO OVER-FIRE, BY CONSTRUCTION. step1-fanout-autoscale.yml has `concurrency: step1-fanout-autoscale`,
  # and its launcher never re-submits a unit that has a result or a live instance. A tick with nothing to do
  # costs a CI minute and $0. Under-dispatching costs the entire night, so this errs toward dispatching.
  #
  # A SEPARATE JOB, DEPENDING ON NOTHING. The `watch` job deliberately EXITS NON-ZERO on an alert. If this
  # lived as a step there, the first stalled leg anywhere in the watch list would also stop the fan-out from
  # ever being released — coupling two unrelated failure domains. It also means `permissions: actions: write`
  # is scoped to this job alone and the watch job keeps its read-only token.
  #
  # REMOVE THIS JOB when the Step 1 congeneric map is complete (all 19 ddg.json landed) — it is a scaffold for
  # one lane, not a general mechanism.
  # ===========================================================================================================
  step1-fanout-tick:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      actions: write        # required to POST a workflow_dispatch; the watch job stays contents:read
    steps:
      # ⭐⭐ IS THERE ANYTHING TO SUPERVISE? ADDED 2026-08-25 (research/compute/ci-burden-plan.md).
      #
      # ⛔ WHY THIS JOB IS A BURDEN AND NOT A WATCHDOG. Its own header calls this dispatch "a SECOND,
      # INDEPENDENT trigger alongside that workflow's own schedule … Redundancy on the release of the 18
      # edges, not a repair." At `*/15` that is FOUR extra `step1-fanout-autoscale` runs an hour, each of
      # which used to fan out to five more workflows — and the account has held ZERO instances on every one
      # of the 886 census readings committed since 2026-08-05. Redundancy over an empty fleet is not
      # redundancy; it is the run rate.
      #
      # ⚠ SELF-CONTAINED, NOT `needs: watch` — THE HEADER ABOVE FORBIDS THE COUPLING. The `watch` job exits
      # non-zero on an alert, and this job depends on nothing precisely so a stalled leg cannot also stop the
      # fan-out being released. So the arming read is done HERE, on its own sparse checkout, and the two
      # failure domains stay separate.
      #
      # ⚠ FAIL-ARMED: `|| rc=$?` under `bash -e`, `armed=true` on any exit that is not exactly 10, and the
      # dispatch below tests `!= 'false'`. A checkout that fails, a missing module or an unreadable census
      # all dispatch exactly as they do today.
      - uses: actions/checkout@v4
        with:
          sparse-checkout: research/modalities
          sparse-checkout-cone-mode: true
      - name: Is there anything to supervise?
        id: armed
        run: |
          rc=0
          python3 research/modalities/fleet_armed.py vast-watchdog || rc=$?
          if [ "$rc" -eq 10 ]; then armed=false; else armed=true; fi
          echo "armed=$armed" >> "$GITHUB_OUTPUT"
          echo "::notice::armed=$armed (fleet_armed exit $rc; 10=idle, anything else=armed)"

      - name: Dispatch the Step 1 fan-out tick unless one is already in flight
        if: ${{ steps.armed.outputs.armed != 'false' }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # GH_REPO, not a --repo flag on each call. This job has NO actions/checkout on purpose (it needs no
          # code), and without a git remote every `gh` subcommand dies with "failed to determine base repo:
          # not a git repository" — which is how the first version of this job failed at 5:27 PM ET. Setting
          # it in env covers every gh invocation instead of one flag per call site.
          GH_REPO: ${{ github.repository }}
        run: |
          set -eo pipefail
          WF=step1-fanout-autoscale.yml
          # HONOUR dry_run. It means "report what you WOULD do without acting", and the tick this dispatches
          # runs the launcher with LAUNCH=1 — i.e. a dry-run watchdog pass would otherwise be the one thing in
          # this workflow that can rent a GPU. Checked here rather than passed through, because the tick's own
          # `release_fanout=0` still runs monitor+collect and mutates the committed readout.
          if [ "${{ github.event.inputs.dry_run }}" = "1" ]; then
            echo "::notice title=STEP1 TICK SKIPPED (dry_run)::dry_run=1 — would have dispatched $WF."
            exit 0
          fi
          # Skip when a tick is already queued or running. The concurrency group would serialise them anyway,
          # but `cancel-in-progress: false` means extras QUEUE rather than collapse, and a queue of identical
          # no-op ticks is noise that makes the real one hard to find in the run list.
          LIVE=$(gh run list --workflow "$WF" --limit 20 \
                   --json status --jq '[.[]|select(.status=="queued" or .status=="in_progress")]|length')
          echo "in-flight ticks: $LIVE"
          if [ "$LIVE" != "0" ]; then
            echo "::notice title=STEP1 TICK ALREADY IN FLIGHT::$LIVE run(s) of $WF queued/in-progress — not dispatching a duplicate."
            exit 0
          fi
          # No inputs are passed ON PURPOSE — the fleet branch, the shakeout unit and the release flag stay
          # single-homed in the workflow that owns them.
          # ⚠ THE OLD JUSTIFICATION HERE WAS WRONG, AND IT COST 1 H 47 M OF FLEET DECAY (2026-07-27). It read
          # "every input of that workflow is written `${{ github.event.inputs.X || '<default>' }}`, so
          # omitting them uses ITS defaults". `release_fanout` was NOT written that way — it was
          # `github.event.inputs.release_fanout != '0'`, which on a null inputs context is `0 != 0` = FALSE,
          # so the tick this job dispatches ran monitor+collect and silently skipped every placement. That
          # asymmetry is now gone: the flag is resolved in a bash step with an explicit "absent means 1", and
          # the launcher records a NAMED decision on every tick, so a dispatch with no inputs can never again
          # look like a healthy fleet while placing nothing.
          # --ref main because a workflow_dispatch resolves against the default branch, where that file lives;
          # the job then checks out the fleet branch itself.
          gh workflow run "$WF" --ref main
          echo "::notice title=STEP1 FAN-OUT TICK DISPATCHED::$WF dispatched by the vast-watchdog cron — a SECOND, INDEPENDENT trigger alongside that workflow's own schedule (which does fire; GitHub just throttles this repo's crons to ~hourly). Redundancy on the release of the 18 edges, not a repair. See the header comment."
