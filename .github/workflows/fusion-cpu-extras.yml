      - name: Unit tests — the verdict logic and the escalation this diagnostic justifies
        run: |
          python -m pip install -q pytest rdkit boto3
          python -m pytest research/modalities/tests/test_step1_map_diag.py -q
      # The image supplies the ENV; the checked-out repo supplies the CODE. Mount research/modalities or the
      # container silently runs the copy baked at build time — i.e. the mapper WITHOUT the floor escalation,
      # which is precisely the thing under test. `--entrypoint python` bypasses the image's autoteardown
      # ENTRYPOINT (that is for billed GPU legs, not a $0 analysis).
      - name: MAP MATRIX — production components, element_change x budget (parity image)
        run: |
          set -eo pipefail
          IMG="${MAP_DIAG_IMAGE:-triskit23/nr4a3fep}"
          docker run --rm --entrypoint python \
            -v "$PWD/research/modalities:/work/research/modalities" \
            -e AWS_ACCESS_KEY_ID -e AWS_SECRET_ACCESS_KEY -e AWS_DEFAULT_REGION \
            -e VAST_CKPT_BUCKET -e MAP_DIAG_UNITS \
