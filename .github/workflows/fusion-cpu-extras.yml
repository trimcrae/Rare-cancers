      - name: Commit the matrix back to the triggering branch
        if: ${{ always() }}
        run: |
          # ⛔ ONE HOME FOR THE PUBLISH (2026-08-01). This hand-rolled `git pull --rebase` + retry, the shape
          # that silently failed to publish on three lanes: a conflict leaves the repo mid-rebase, every retry
          # dies on it, and the step ended on a `::warning::` while reporting SUCCESS. The `[ -f … ] || exit 0`
          # guard is not lost — the primitive skips paths that do not exist and says so.
          BR="${{ github.ref_name }}"
          bash research/compute/publish_artifacts.sh "$BR" \
            "step1 atom-map matrix on the production staged components (auto)" \
            research/modalities/step1-map-diag.json
  energy_probe:
    # IS A PRE-MD `setup()` NaN A PROPERTY OF THE EDGE, OR OF THE HOST? ($0, CPU, rents nothing.)
    #
    # Step 1 fan-out unit `e_zaienne_cmpd19__cw_bio_primary_amide__neutral__neutral` lost its complex leg at
    # 1:41 PM ET on 2026-07-27 to `openmm.OpenMMException: Particle coordinate is NaN` raised by
    # LocalEnergyMinimizer inside `sampler.setup()` — before any MD. That edge is measurably NOT a mapping
    # limit (step1-map-diag.json: 17 mapped against a provable floor of 12), so `block` cannot be justified
    # the way `cw_bio_nmethyl_amide`'s was, and the two available answers are expensive in opposite
    # directions: blocking retires a viable edge, retrying rents a fresh host every tick forever.
    #
    # THE POINT OF DOING IT HERE RATHER THAN ON A RENTED BOX. `nr4a3_rbfe` builds the solvated hybrid
    # `system` + `positions` on CPU, and under RBFE_HMRDIAG_ONLY=1 exits before touching a GPU. That pair is
    # the pair handed to the `setup()` that NaN'd, so a per-force single-point energy at those coordinates
    # answers the question with NO host in the loop — which matters because the relaunch that was supposed to
    # answer it sat `loading` on machine 19499 for over half an hour and measured nothing about the edge.
    # A non-finite force term before the first minimisation step = deterministic = BLOCK; all-finite = the
    # blow-up was inside the minimisation trajectory = RETRY.
    #
    # `vast_selector` picks the unit(s) by substring; blank = all 19 (slow — each is a full solvate+parameterise).
    if: ${{ github.event.inputs.task == 'energy_probe' }}
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      contents: write
    env:
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      AWS_DEFAULT_REGION: us-east-2
      VAST_CKPT_BUCKET: ${{ github.event.inputs.vast_ckpt_bucket }}
      PROBE_UNITS: ${{ github.event.inputs.vast_selector }}
      # complex is the leg that failed; probing the solvent leg would build a different system and answer a
      # different question. Reuses an existing input because workflow_dispatch caps at 25 and this file is at it.
      PROBE_LEG: ${{ github.event.inputs.ternary_script == 'solvent' && 'solvent' || 'complex' }}
      # Stage 2 (the real `sampler.setup()` minimiser, ~25 min of CPU) answers "does the minimiser survive
      # this system at all". Stage 1 (per-force energy + GRADIENT + the coordinate-degeneracy census, and
      # since 2026-07-28 the before/after of the de-degeneration) answers "what is wrong with the starting
      # point", and takes ~2 min. They are different questions, and being unable to ask the cheap one
      # without paying 25 minutes for the expensive one is why this knob exists.
      # Reuses `seeds` because workflow_dispatch caps at 25 inputs and this file is at the cap; the default
      # ("1,2,3") leaves the long path ON, so no existing dispatch changes behaviour.
      PROBE_MINIMIZE: ${{ github.event.inputs.seeds == '0' && '0' || '1' }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Docker Hub login (anonymous pulls share the runner IP and get rate-limited)
        run: echo "${{ secrets.DOCKERHUB_TOKEN }}" | docker login -u triskit23 --password-stdin
      - name: Unit tests — the BLOCK/RETRY rule this diagnostic decides with
        run: |
          python -m pip install -q pytest
          python -m pytest research/modalities/tests/test_setup_nan_diag.py \
                           research/modalities/tests/test_setup_energy_probe.py -q
      # The image supplies the ENV; the checked-out repo supplies the CODE — mount research/modalities or the
      # container silently runs the copy baked at build time, i.e. WITHOUT the probe under test. Parity is the
      # scientific argument here and not just speed: the verdict is about a system this exact openmm built.
      - name: SETUP-NaN ENERGY PROBE — production staged tree, CPU build (parity image)
        run: |
          set -eo pipefail
          IMG="${PROBE_IMAGE:-triskit23/nr4a3fep}"
          docker run --rm --entrypoint python \
            -v "$PWD/research/modalities:/work/research/modalities" \
            -e AWS_ACCESS_KEY_ID -e AWS_SECRET_ACCESS_KEY -e AWS_DEFAULT_REGION \
            -e VAST_CKPT_BUCKET -e PROBE_UNITS -e PROBE_LEG -e PROBE_MINIMIZE \
            "docker.io/$IMG:latest" /work/research/modalities/step1_setup_energy_probe.py
      - name: Commit the probe result back to the triggering branch
        if: ${{ always() }}
        run: |
          # ⛔ ONE HOME FOR THE PUBLISH (2026-08-01). This hand-rolled `git pull --rebase` + retry, the shape
          # that silently failed to publish on three lanes: a conflict leaves the repo mid-rebase, every retry
          # dies on it, and the step ended on a `::warning::` while reporting SUCCESS. The `[ -f … ] || exit 0`
          # guard is not lost — the primitive skips paths that do not exist and says so.
          BR="${{ github.ref_name }}"
          bash research/compute/publish_artifacts.sh "$BR" \
            "step1 setup-NaN energy probe on the production staged system (auto)" \
            research/modalities/step1-setup-energy-probe.json
  map_audit:
    # ATOM-MAP BLAST-RADIUS AUDIT ($0 — no GPU, no instance, read-only against archives).
    #
    # `nr4a3_rbfe._mapping` ran `LomapAtomMapper(time=20)` for the whole life of this repo, and `time` is
    # LOMAP's MCS TIMEOUT: a timed-out search returns its best PARTIAL map silently, so the alchemical
    # transformation a leg actually ran depended on how fast its rented host happened to be. Nothing
    # downstream catches that — not the reducer, not `protocol_hash` (OpenFE settings, not the map), not the
    # system-identity check (particle counts are unchanged by a remap). So every archived leg's recorded map
    # size has to be compared against the size PROVABLY achievable for its transformation.
    #
    # Three steps, deliberately separable so a failure in one still yields the others:
    #   bounds  — rdkit only; the provable floor + complete-map size per edge (the "expected" column)
    #   archive — boto3; every S3 artifact that records a map size (the "actual" column)
    #   maps    — the PRODUCTION mapper re-derived at BOTH budgets (20 s and 300 s) inside the parity image,
    #             because analysing a mapper with a different lomap/rdkit than PRODUCED the trajectories is
    #             exactly the silent protocol deviation CLAUDE.md forbids.
    if: ${{ github.event.inputs.task == 'map_audit' }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: write
    env:
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      # The credential a RENTED community host is given, forwarded in cleartext by _vast_onstart.
      # Scoped to the lane prefixes + six S3 actions a leg needs (s3_scoped_policy.py). Unset until
      # trimcrae creates the vast-leg-s3 user -> gpu_backend falls back to the broad key above, which
      # is why lanes in flight kept running. Runbook: research/compute/scoped-s3-credential-runbook.md
      VAST_S3_ACCESS_KEY_ID: ${{ secrets.VAST_S3_ACCESS_KEY_ID }}
      VAST_S3_SECRET_ACCESS_KEY: ${{ secrets.VAST_S3_SECRET_ACCESS_KEY }}
      VAST_S3_SCOPED_STS: ${{ vars.VAST_S3_SCOPED_STS }}
      AWS_DEFAULT_REGION: us-east-2
      VAST_CKPT_BUCKET: ${{ github.event.inputs.vast_ckpt_bucket }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Docker Hub login (anonymous pulls share the runner IP and get rate-limited)
        run: echo "${{ secrets.DOCKERHUB_TOKEN }}" | docker login -u triskit23 --password-stdin
      - name: Unit tests — the floor arithmetic the whole audit rests on
        run: |
          python -m pip install -q pytest rdkit boto3
          python -m pytest research/modalities/tests/test_atom_map_audit.py -q
      - name: ARCHIVE SWEEP — every archived leg's recorded map size
        run: python research/modalities/atom_map_audit.py archive
      - name: BOUNDS — provable floors per edge (rdkit only, no container)
        run: python research/modalities/atom_map_audit.py bounds
      - name: Verdict table (archive actuals vs provable floors)
        run: python research/modalities/atom_map_audit.py verdict
      # OPT-IN, because it is the slow half and it must never cost the audit its result. Re-deriving the
      # production map at BOTH budgets over 21 edges in two containers overran the 60-min job on 2026-07-26
      # and took the commit-back step down with it — so the cheap, decisive half (archive actuals vs provable
      # floors) now lands first and this runs only when asked, in ONE image.
      - name: MAPS — re-derive the production map at 20 s and 300 s (parity image; vast_launch=true)
        if: ${{ github.event.inputs.vast_launch == 'true' }}
        timeout-minutes: 25
        run: |
          set -eo pipefail
          # The image supplies the ENV; the checked-out repo supplies the CODE. Mount research/modalities or
          # the container silently runs the copy baked at build time — i.e. the OLD time=20 mapper.
          IMG="${MAP_AUDIT_IMAGE:-triskit23/ternary-fep}"
          docker run --rm --entrypoint python \
            -v "$PWD/research/modalities:/work/research/modalities" \
            -e MAP_AUDIT_OUT_SUFFIX=maps \
            "docker.io/$IMG:latest" /work/research/modalities/atom_map_audit.py maps
      - name: Commit the audit back to the triggering branch
        run: |
          set -e
          # PUBLISH_FAIL_HARD=1 preserves this step's `exit 1` on an unpublished result.
          # ⛔ ONE HOME FOR THE PUBLISH. `git pull --rebase` wedges on a conflict — the repo is left
          # mid-rebase, every retry dies on the first one's wreckage, and the step ends GREEN having
          # published nothing (measured on three lanes; see research/compute/publish_artifacts.sh).
          # PUBLISH_IF_CHANGED=1 keeps this step's EVENT semantics: it records a result, not a
          # heartbeat, so a run that produced nothing new must not commit as though it had.
          PUBLISH_IF_CHANGED=1 PUBLISH_FAIL_HARD=1 bash research/compute/publish_artifacts.sh "${{ github.ref_name }}" \
            "Atom-map blast-radius audit: what map every archived leg actually ran (auto)" \
            research/modalities/atom-map-audit*.json

  # ★★ WHAT A `type: boolean` INPUT ACTUALLY HOLDS IN `github.event.inputs` — MEASURED, NOT ASSUMED.
  #
  # WHY THIS JOB EXISTS. `vast_launch` is declared `type: boolean` and is read at two sites as
  # `github.event.inputs.vast_launch == 'true'` (the `VAST_SMOKE_LAUNCH` env above, and the guard on the
  # step that actually rents a GPU). `gpu-protfep-vast.yml` reads `forensic` the same way. If that context
  # delivers a real JSON boolean rather than the string "true", the comparison is `true == 'true'` —
  # operands of different types, so GitHub casts both to Number, `'true'` casts to NaN, and the result is
  # FALSE **however the box is ticked**. The guard could then never turn on, silently.
  #
  # That is the same coercion family as the `null != '0'` defect that stopped the step-1 fan-out placing
  # units for 1 h 47 m across seven green ticks on 2026-07-27, and the repo-wide AST sweep that followed
  # flagged these two as the only cases it could not settle from the source alone. CLAUDE.md §4: a
  # plausible story is a HYPOTHESIS. The docs are unreachable from the sandbox (the egress proxy 403s
  # github.com/docs) and no run in the last 100 discriminates, because every `vast_smoke` job was skipped
  # for an unrelated reason. So the answer is MEASURED here, once, and recorded where it cannot be lost.
  #
  # It rents nothing, reads nothing and costs ~10 s of free runner. It runs on every dispatch on purpose:
  # gating it on an input would make its own evidence depend on the mechanism under test.
  input_coercion_probe:
    if: ${{ github.event_name == 'workflow_dispatch' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: "What does a type-boolean input actually hold?"
        env:
          RAW_INPUTS: ${{ toJSON(github.event.inputs) }}
          RAW_VAST_LAUNCH: ${{ github.event.inputs.vast_launch }}
          # The two expressions under test, EVALUATED by Actions and printed rather than reasoned about.
          CMP_EVENT_INPUTS: ${{ github.event.inputs.vast_launch == 'true' }}
          CMP_INPUTS_CTX: ${{ inputs.vast_launch }}
          # The control: a comparison whose operands are unambiguously both strings.
          CMP_CONTROL: ${{ github.event.inputs.task == 'vast_smoke' }}
        run: |
          set -eu
          echo "github.event.inputs (raw JSON)              = ${RAW_INPUTS}"
          echo "github.event.inputs.vast_launch             = '${RAW_VAST_LAUNCH}'"
          echo "  -> (…vast_launch == 'true')               = ${CMP_EVENT_INPUTS}"
          echo "inputs.vast_launch (the OTHER context)      = '${CMP_INPUTS_CTX}'"
          echo "control (…task == 'vast_smoke')             = ${CMP_CONTROL}"
          echo
          echo "READ IT LIKE THIS: if the raw JSON shows \"vast_launch\": \"true\" (QUOTED) then the"
          echo "== 'true' comparison is string-to-string and the two guards are sound. If it shows an"
          echo "UNQUOTED true, the comparison is number-vs-NaN, prints false above even when ticked, and"
          echo "both guards must move to the bash-resolution pattern used by step1-fanout-autoscale.yml."

  # S-CALIBRATOR SURVEY — STRATEGY Open decision 9. Which paralogue pairs have a deposited TERNARY structure on
  # BOTH arms, so a homology-model error cannot sit on one arm only. Networked (RCSB), which the dev sandbox's
  # egress proxy refuses, so it runs here. $0. It screens STRUCTURE only and deliberately supplies no
  # selectivity magnitude — that needs a primary source and is gated by Open decision 7.
  s_calibrator_survey:
    if: ${{ github.event.inputs.task == 's_calibrator_survey' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Screen candidate paralogue pairs against RCSB (both arms must be real)
        working-directory: research/modalities
        run: python s_calibrator_survey.py --write
      - name: Commit results back to the triggering branch
        run: |
          set -e
          # ⛔ ONE HOME FOR THE PUBLISH. `git pull --rebase` wedges on a conflict — the repo is left
          # mid-rebase, every retry dies on the first one's wreckage, and the step ends GREEN having
          # published nothing (measured on three lanes; see research/compute/publish_artifacts.sh).
          # PUBLISH_IF_CHANGED=1 keeps this step's EVENT semantics: it records a result, not a
          # heartbeat, so a run that produced nothing new must not commit as though it had.
          PUBLISH_IF_CHANGED=1 bash research/compute/publish_artifacts.sh "${{ github.ref_name }}" \
            "S-calibrator survey: which paralogue pairs are structurally symmetric (CI)" \
            research/modalities/s-calibrator-survey.json
