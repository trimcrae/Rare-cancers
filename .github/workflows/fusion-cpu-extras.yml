name: Fusion CPU extras (IDR/LLPS features + junction siRNA)

# Two internet-needing, CPU-only analyses the dev sandbox can't run (it blocks UniProt/NCBI):
#   1. fusion_idr_features.py  — sequence-based LLPS/low-complexity descriptors of the EWS/TAF15
#      LC domains vs folded + non-prion controls (condensate paper's deferred first-party step)
#   2. junction_sirna.py       — junction-spanning siRNA designs (GC-tolerant alternative to the
#      GC-rich gapmers; ASO paper)
# Pure stdlib (urllib only); no pip, no AWS/GPU. Results pushed to the `modalities-cache` branch:
#   git fetch origin modalities-cache && git checkout modalities-cache -- research/modalities/

on:
  workflow_dispatch:
    inputs:
      task:
        description: "which task to run"
        type: choice
        options: [fusion, vast_smoke, nrv04_cys, nr4a_unique_residues, nr4a_e3_widened, nr4a_basin_search, nr4a_linker_chem, nr4a_e3_stage, e3_recruiter_stage, e3_vhl_recheck, vast_bid_advise, vast_price_history, nrv04_md_smoke, nrv04_build_smoke, nrv04_build_env, nrv04_charge_cache, nrv04_ffcache_status, nrv04_input_audit, nrv04_retro_prespend, nrv04_retro_price_forensics, nrv04_retro_secondaries, nrv04_adduct_build, nrv04_s3_tail, nrv04_bake, fep_bake, nrv04_vast_launch, step1_fanout, bioemu_bake, bioemu_run, bioemu_collect, bioemu_status, bioemu_stop, map_audit, map_diag, energy_probe, s1f_liveness, s_calibrator_survey]
        default: fusion
      fanout_mode:
        description: "step1_fanout: plan | stage | precheck | launch (dry) | launch_confirm (SPENDS) | collect | monitor | diag | reap (destroy + BLACKLIST a bad HOST) | block (stop launching a UNIT no host can fix) | stop"
        type: choice
        options: [plan, stage, precheck, launch, launch_confirm, collect, monitor, diag, reap, block, stop]
        default: plan
      vast_launch:
        description: "vast_smoke only: actually rent+destroy a GPU (spends a few cents)"
        type: boolean
        default: false
      vast_launch_mode:
        description: "nrv04_vast_launch: discover | stage_test | collect | monitor | diag | stop_all | dry | pilot | full | probe_offers | bench | bench_collect | retro_* (NR-V04 retrospective holdout)"
        type: choice
        options: [discover, stage_test, collect, monitor, diag, stop_all, dry, pilot, full, probe_offers, bench, bench_collect, firm, firm_collect, firm_stop, retro_stage_test, retro_dry, retro_pilot, retro_full, retro_collect, retro_baseline, cofold_audit, cofold_clash_scan, cofold_dry, cofold]
        default: discover
      vast_ckpt_bucket:
        description: "nrv04_vast_launch: reused S3 bucket holding the co-fold outputs + checkpoints"
        default: "sagemaker-us-east-2-646605541856"
      cofold_prefix:
        description: "nrv04_vast_launch: S3 prefix of the co-fold to stage the COVALENT panel from. NOT nrv04-descriptive-v3 or nrv04-shakeout — those carry 14-3-3 epsilon where Elongin B belongs (2026-07-24 audit); staging rejects them anyway."
        default: "nrv04-covalent-cofold"
      nrv04_result_prefix:
        description: "nrv04_vast_launch: S3 results prefix. Set a FRESH one to re-run legs that already have results (the launcher skips a unit whose result exists). Never overwrite the original - a corrected re-run belongs beside the evidence it corrects, not on top of it."
        default: ""
      cofold_output_prefix:
        description: "cofold mode: FRESH S3 prefix for the co-fold outputs (never reuse - co-folds are a preregistered panel's inputs)"
        default: ""
      ternary_script:
        description: "cofold mode: science entry point (nrv04_ternary.py = NR-V04/VHL; nr4a3_ternary.py = CRBN)"
        default: "nrv04_ternary.py"
      ternary_extra_args:
        description: "cofold mode: extra args, e.g. '--skip-control --targets NR4A1,NR4A2,NR4A3'. ALSO the
          raw-CLI-args passthrough for nr4a_e3_stage (e.g. '--arms vhl,crbn') and nr4a_basin_search (e.g.
          '--samples 250000 --n-poses 12') — reused rather than adding new inputs because workflow_dispatch
          caps at 25 and this file is at the cap."
        default: ""
      seeds:
        description: "cofold mode: comma-sep diffusion seeds = the ternary ensemble per system"
        default: "1,2,3"
      vast_selector:
        description: "instance id or label substring. diag mode: which instance to dump (blank = every instance on the account, which buries the one you want). stop_all mode: which to DESTROY — BLANK DESTROYS EVERY INSTANCE ON THE ACCOUNT, including other sessions' live work. step1_fanout launch/launch_confirm: comma-separated unit_id or ligand substrings to launch (blank = every pending unit up to the width) — this is the shakeout lever that runs ONE unit to the unproven ddG terminus before the rest fan out. retro_pilot: WHICH UNIT to pilot, e.g. 'nr4a3 m2 r1' / 'retro_noncov_nr4a2:m1:r0' / a whole nrv04retro- label (blank = the first UNRUN authorized unit, preferring the prereg §7 paralogue arm); prefix '!' to re-run one that already has a result. nrv04_s3_tail: blank = the retro result prefix."
        default: ""
      md_mode:
        description: "nrv04_vast_launch pilot/full: smoke (minimize+500 steps, cents) | run (5ns, priced)"
        type: choice
        options: [smoke, run]
        default: smoke
      vast_image:
        description: "nrv04_vast_launch: override the Vast boot image (blank = launcher default = baked image)"
        default: ""
      vast_gpu:
        description: "nrv04_vast_launch pilot: GPU model override (blank=rtx3090; e.g. rtx8000/rtx4090 for a $/ns bench)"
        default: ""
      pilot_seed:
        description: "nrv04_vast_launch pilot: which seed of cov_nr4a1 to run (distinguishes parallel bench runs)"
        default: "0"
      bench_edge_nm:
        description: "bench mode: TIP3P box edge (nm). 7.1≈36k atoms (RBFE leg); 9.5≈86k (ternary); 16.5≈460k (covalent)"
        default: "7.1"
      bench_steps:
        description: "bench mode: timed production steps (4000≈16ps @4fs; enough for a stable ns/day)"
        default: "4000"
      bench_grid:
        description: "bench mode: comma-sep gpu:edge_nm pairs to launch in ONE dispatch (e.g. rtx4090:9.5,rtx3090:9.5). Blank = single leg from vast_gpu+bench_edge_nm"
        default: ""
      bench_min_vram_gb:
        description: "bench mode: VRAM floor for offer selection. Lower to 16 to bench a 16 GB card (RTX 4080); default 24"
        default: "24"
      firm_kind:
        description: "firm mode: which real alchemical edge(s) to run on the nr4a3fep 4090 image — rbfe | ternary | rbfe,ternary"
        default: "rbfe,ternary"
      firm_n_iter:
        description: "firm mode: MBAR iterations per window (short = fast throughput read; blank = per-kind default 150/120)"
        default: ""
      bioemu_num_samples:
        description: "bioemu_run: number of BioEmu samples (blank = 200 real / 5 smoke). Uses md_mode: run=real NR4A3, smoke=chignolin plumbing"
        default: ""
      bioemu_batch:
        description: "bioemu_run: BioEmu batch_size_100 (lower if the 24GB 4090 OOMs; blank = default)"
        default: ""
      bioemu_kill:
        description: "bioemu_stop: 'all' nr4a3-bioemu*, a label substring (e.g. smoke), or an explicit instance id"
        default: "all"

permissions:
  contents: write

# Per-TASK concurrency so independent tasks (e.g. nrv04_build_env + nrv04_charge_cache) run in PARALLEL instead
# of cancelling each other — a plain `fusion-cpu-extras` group would serialize every dispatch of this workflow.
concurrency:
  # Include vast_launch_mode so a bench / bench_collect dispatch is NOT cancelled by a (possibly cross-session)
  # covalent collect/monitor/full dispatch of the same task — they share task=nrv04_vast_launch and, with a
  # task-only group + cancel-in-progress, kept killing each other. Mode-scoped groups keep same-mode dedupe.
  # ★ AND THE REF, because the group was NOT branch-scoped and lanes on different branches were killing each
  # other's work. Observed 2026-07-25 5:06 PM ET: a `task=nr4a_basin_search` dispatch on
  # `claude/max-effort-2dq11l-anchor` (run 30174945933, started 5:05 PM) landed in the same group as run
  # 30173638494 on `claude/max-effort-2dq11l-linker` and, with `cancel-in-progress: true`, cancelled it
  # **38 minutes into a 55-minute job**. Nothing in the cancelled run's own log says why; the discriminating
  # observation is the newer run of the same task on a different branch, seconds before the cancellation.
  # Two lanes on two branches are two pieces of work, so the ref belongs in the key — this is the same defect
  # class the vast_launch_mode note below records, one level up.
  # ★ AND `seeds`, FOR THE SAME REASON, ONE LEVEL FURTHER (2026-07-29). `energy_probe` acquired a mode of its
  # own — `seeds=0` asks only the ~2-minute stage-1 reading, anything else also runs the ~25-minute
  # `sampler.setup()` repro — and those are different pieces of work. They were not in the key, so
  # dispatching the fast one killed the slow one **65 minutes in**, and the cancellation was invisible from
  # the slow run's own log: the jobs API had simply gone on reporting `in_progress`, which reads exactly like
  # the stall CLAUDE.md §4 says to investigate. The discriminating observation was the run's own
  # `conclusion: cancelled`, and the cause was the newer same-task dispatch seconds earlier. Third instance
  # of this defect class in this one key; if a fourth appears, the key should be every input, not another
  # named one.
  group: fusion-cpu-extras-${{ github.ref_name }}-${{ github.event.inputs.task }}-${{ github.event.inputs.vast_launch_mode }}-${{ github.event.inputs.fanout_mode }}-${{ github.event.inputs.seeds }}
  cancel-in-progress: true

jobs:
  vast_smoke:
    if: ${{ github.event.inputs.task == 'vast_smoke' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      VAST_API_KEY: ${{ secrets.VAST_API_KEY }}
      VAST_SMOKE_LAUNCH: ${{ github.event.inputs.vast_launch == 'true' && '1' || '0' }}
      VAST_SMOKE_DUMP: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Vast.ai adapter smoke (auth + offer search; opt-in rent+destroy)
        run: python research/compute/vast_smoke.py

  # NR4A3 paralogue-UNIQUE reactive residues (cysteines -> covalent-capture axis; lysines -> ubiquitination-site
  # axis). Needs UniProt, which the dev sandbox's egress proxy 403s -> runs here. Results are pushed back to the
  # TRIGGERING branch (not modalities-cache) because they are a design input the strategy docs cite directly.
  nr4a_unique_residues:
    if: ${{ github.event.inputs.task == 'nr4a_unique_residues' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Unit tests (pure logic, offline)
        working-directory: research/modalities
        run: python -m unittest tests.test_nr4a_paralogue_unique_residues -v
      - name: Map NR4A3 paralogue-unique cysteines + lysines (UniProt full-length + matched model geometry)
        working-directory: research/modalities
        run: python nr4a_paralogue_unique_residues.py
      - name: Commit results back to the triggering branch
        run: |
          set -e
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f research/modalities/nr4a-paralogue-unique-residues.json \
                     research/modalities/nr4a-paralogue-unique-residues.md \
                     research/modalities/nr4a-sequences-cache.json
          git commit -m "NR4A3 paralogue-unique reactive-residue map (UniProt full-length, CI)" || {
            echo "no changes"; exit 0; }
          git pull --rebase origin "${{ github.ref_name }}" || true
          git push origin HEAD:"${{ github.ref_name }}"

  # RUNG-5a part 1 — E3 ARM STAGING. Discovers, verifies and composes each recruiter arm (ligand-bound
  # substrate receptor + derived ligand exit vector + cullin-scaffold RING position bridged into the receptor
  # frame). Needs RCSB, which the dev sandbox 403s at CONNECT, so it runs here. Pure stdlib.
  # LANE 7 — the transfer-anchor diagnostic. Reuses the on-main `nr4a_e3_stage` task value (a NEW choice
  # option cannot be dispatched until it is on the default branch) and is selected by fanout_mode=diag, which
  # also switches the staging job OFF so the two do not both run. $0 CPU, network-only because RCSB is 403'd
  # at CONNECT by the dev sandbox's egress proxy.
  lane7_anchor_diag:
    if: ${{ github.event.inputs.task == 'nr4a_e3_stage' && github.event.inputs.fanout_mode == 'diag' }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Unit tests — the geometry kernels the diagnostic depends on (offline, no network)
        run: |
          pip install pytest
          python -m pytest research/modalities/tests/test_basin_geom.py -q
      - name: Transfer-anchor diagnostic (zero-composition ground truth + common-frame decomposition)
        run: python research/modalities/transfer_anchor_diag.py ${{ github.event.inputs.ternary_extra_args }}
      - name: Commit the diagnostic back to the triggering branch
        run: |
          set -e
          # ⛔ ONE HOME FOR THE PUBLISH. `git pull --rebase` wedges on a conflict — the repo is left
          # mid-rebase, every retry dies on the first one's wreckage, and the step ends GREEN having
          # published nothing (measured on three lanes; see research/compute/publish_artifacts.sh).
          # PUBLISH_IF_CHANGED=1 keeps this step's EVENT semantics: it records a result, not a
          # heartbeat, so a run that produced nothing new must not commit as though it had.
          PUBLISH_IF_CHANGED=1 bash research/compute/publish_artifacts.sh "${{ github.ref_name }}" \
            "LANE 7: transfer-anchor diagnostic (CI)" \
            research/modalities/transfer-anchor-diagnostic.json

  # LANE 7 part 2 — the ASSEMBLY-NATIVE arm control. Both arms restaged so the receptor, its ligand, the RING
  # and the E2 all come from ONE intact ubiquitylation assembly (8R5H for VHL, 9UUM for CRBN): no bridge is
  # composed, so the 48.6 A composed-RING uncertainty does not apply, and the anchor-to-transfer distance is
  # the directly measured one. Then the basin search is run TWICE at identical settings — once per registry —
  # so the effect on the null and on the two categorical terms is a matched comparison, not a re-quote of the
  # 12-pose run at different parameters. Selected by fanout_mode=stage.
  lane7_native_arm:
    if: ${{ github.event.inputs.task == 'nr4a_e3_stage' && github.event.inputs.fanout_mode == 'stage' }}
    runs-on: ubuntu-latest
    timeout-minutes: 200
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Unit tests — geometry kernels + staging/search logic
        run: |
          pip install pytest
          python -m pytest research/modalities/tests/test_basin_geom.py research/modalities/tests/test_basin_search.py -q
      - name: Stage ASSEMBLY-NATIVE arms (8R5H / 9UUM promoted; still fully verified)
        run: |
          python research/modalities/nr4a3_e3_stage.py --arms vhl,crbn \
            --prefer-entry vhl=8R5H,crbn=9UUM \
            --out-dir results/nr4a3-e3-arms-native \
            --registry research/modalities/nr4a3-e3-arm-registry-native.json
      - name: Matched basin comparison — same seed, same samples, same poses, two registries
        env:
          SAMPLES: ${{ github.event.inputs.seeds }}
        run: |
          set -e
          # ★ `seeds` is a SHARED input whose default is the seed LIST "1,2,3", not a sample count, so
          # `${SAMPLES:-250000}` never fires — the variable is set, just not to a number. A dispatch that
          # omitted `seeds` therefore ran `--samples 1,2,3` and died in argparse one minute in (2026-07-25,
          # run 30179151643). Guard on the VALUE, not on emptiness.
          N=${SAMPLES:-250000}
          case "$N" in ''|*[!0-9]*) echo "seeds='$N' is not a sample count; using 250000"; N=250000;; esac
          echo "matched comparison at $N samples/arm/pose, 8 poses"
          python research/modalities/nr4a3_basin_search.py \
            --registry research/modalities/nr4a3-e3-arm-registry.json \
            --samples "$N" --n-poses 8 \
            --out research/modalities/nr4a3-orientation-basins-matched-composed.json
          python research/modalities/nr4a3_basin_search.py \
            --registry research/modalities/nr4a3-e3-arm-registry-native.json \
            --samples "$N" --n-poses 8 \
            --out research/modalities/nr4a3-orientation-basins-matched-native.json
      - name: Commit the native registry and both matched results
        run: |
          set -e
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f research/modalities/nr4a3-e3-arm-registry-native.json \
                     research/modalities/nr4a3-orientation-basins-matched-*.json \
                     results/nr4a3-e3-arms-native || true
          git commit -m "LANE 7: assembly-native E3 arms + matched basin comparison (CI)" || {
            echo "no changes"; exit 0; }
          git pull --rebase origin "${{ github.ref_name }}" || true
          git push origin HEAD:"${{ github.ref_name }}"

  nr4a_e3_stage:
    if: ${{ github.event.inputs.task == 'nr4a_e3_stage' && github.event.inputs.fanout_mode != 'diag' && github.event.inputs.fanout_mode != 'stage' }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install pytest (test runner only; the science code is pure stdlib)
        run: pip install pytest
      - name: Unit tests — the geometry kernels staging depends on (offline, no network)
        run: python -m pytest research/modalities/tests/test_basin_geom.py -q
      - name: Fetch the E3 lane's recruiter registry (read-only; consumed, never duplicated)
        run: |
          set -e
          mkdir -p /tmp/lane1
          # Prefer main (where that lane merges); fall back to its branch while a merge is in flight. Its
          # CONSUMER MODULE is fetched alongside the JSON, because load_advanced() is the stable contract and
          # the raw JSON shape explicitly is not.
          SRC=""
          git fetch origin main || true
          git cat-file -e FETCH_HEAD:research/modalities/e3-recruiter-staging.json 2>/dev/null && SRC=FETCH_HEAD
          if [ -z "$SRC" ]; then
            git fetch origin claude/max-effort-2dq11l-e3 || true
            git cat-file -e FETCH_HEAD:research/modalities/e3-recruiter-staging.json 2>/dev/null && SRC=FETCH_HEAD
          fi
          if [ -n "$SRC" ]; then
            git show $SRC:research/modalities/e3-recruiter-staging.json > /tmp/lane1/e3-recruiter-staging.json
            git show $SRC:research/modalities/e3_recruiter_staging.py > /tmp/lane1/e3_recruiter_staging.py || true
            echo "lane-1 registry fetched: $(wc -c < /tmp/lane1/e3-recruiter-staging.json) bytes"
            python3 -c "import sys,json; d=json.load(open('/tmp/lane1/e3-recruiter-staging.json')); print('advanced =', d['downselect']['advanced'], '| backfilled =', d['downselect'].get('backfilled_for_e3_choice_sensitivity'))"
          else
            echo "lane-1 registry not published yet — VHL/CRBN arms only"
          fi
      - name: Offline plan (what will be queried — auditable before any network call)
        run: python research/modalities/nr4a3_e3_stage.py --plan ${{ github.event.inputs.ternary_extra_args }}
      - name: Stage the E3 arms from RCSB (accession-set discovery + verification + composition)
        run: python research/modalities/nr4a3_e3_stage.py ${{ github.event.inputs.ternary_extra_args }}
      - name: Commit the staged arms back to the triggering branch
        run: |
          set -e
          # ⛔ ONE HOME FOR THE PUBLISH. `git pull --rebase` wedges on a conflict — the repo is left
          # mid-rebase, every retry dies on the first one's wreckage, and the step ends GREEN having
          # published nothing (measured on three lanes; see research/compute/publish_artifacts.sh).
          # PUBLISH_IF_CHANGED=1 keeps this step's EVENT semantics: it records a result, not a
          # heartbeat, so a run that produced nothing new must not commit as though it had.
          PUBLISH_IF_CHANGED=1 bash research/compute/publish_artifacts.sh "${{ github.ref_name }}" \
            "RUNG-5a: stage E3 recruiter arms from RCSB (accession-verified, CI)" \
            research/modalities/nr4a3-e3-arm-registry*.json

  # RUNG-5a part 2 — THE MECHANISM-FIRST ORIENTATION-BASIN SEARCH itself. Pure stdlib and $0, but the
  # production sample counts are too slow for the dev sandbox, so it runs on a free runner.
  nr4a_basin_search:
    if: ${{ github.event.inputs.task == 'nr4a_basin_search' }}
    runs-on: ubuntu-latest
    timeout-minutes: 350
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install pytest (test runner only; the science code is pure stdlib)
        run: pip install pytest
      - name: Unit tests — geometry kernels + search logic
        run: python -m pytest research/modalities/tests/test_basin_geom.py research/modalities/tests/test_basin_search.py -q
      - name: Mechanism-first orientation-basin search (RUNG 5a, $0 CPU)
        run: python research/modalities/nr4a3_basin_search.py ${{ github.event.inputs.ternary_extra_args }}
      - name: Commit the basin result back to the triggering branch
        run: |
          set -e
          # ⚠ The glob is an ARGUMENT: the caller's shell expands it, so an --out to a variant filename
          # (e.g. LANE 7's assembly-native comparison) is still committed rather than silently dropped,
          # and an unmatched glob arrives as a literal the primitive's own `[ -e ]` filter drops.
          # ⛔ ONE HOME FOR THE PUBLISH. `git pull --rebase` wedges on a conflict — the repo is left
          # mid-rebase, every retry dies on the first one's wreckage, and the step ends GREEN having
          # published nothing (measured on three lanes; see research/compute/publish_artifacts.sh).
          # PUBLISH_IF_CHANGED=1 keeps this step's EVENT semantics: it records a result, not a
          # heartbeat, so a run that produced nothing new must not commit as though it had.
          PUBLISH_IF_CHANGED=1 bash research/compute/publish_artifacts.sh "${{ github.ref_name }}" \
            "RUNG-5a: mechanism-first orientation-basin search result (CI)" \
            research/modalities/nr4a3-orientation-basins*.json

  # RUNG 5b — RDKit verification of the inverse-linker-design library. The enumerator derives a backbone
  # length and a branch position from GEOMETRY and then emits a SMILES by concatenation; those are two
  # independent descriptions of the same molecule and nothing forces them to agree. This re-derives both from
  # the parsed molecule and FAILS THE BUILD on a mismatch. It uses the pre-baked ternary-fep image rather
  # than solving an env (CLAUDE.md §6) — `--entrypoint python` bypasses the image's autoteardown wrapper,
  # which is for billed GPU legs, not $0 CPU analysis, and the repo checkout is mounted so the container runs
  # the branch's code rather than the copy baked at image-build time.
  nr4a_linker_chem:
    if: ${{ github.event.inputs.task == 'nr4a_linker_chem' }}
    runs-on: ubuntu-latest
    timeout-minutes: 40
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install pytest (the design code itself is pure stdlib)
        run: pip install pytest
      - name: Unit tests — linker-design kernels + the enumerator's self-test
        run: |
          python -m pytest research/modalities/tests/test_linker_design.py -q
          python research/modalities/nr4a3_linker_design.py --self-test
      - name: Re-derive the design library from the committed basin artifact
        run: python research/modalities/nr4a3_linker_design.py
      - name: Docker Hub login (raises the anonymous pull-rate ceiling shared across runners)
        run: echo "${{ secrets.DOCKERHUB_TOKEN }}" | docker login -u triskit23 --password-stdin
      - name: Anchor diagnostic (prints which query construction matches; never fails the build)
        run: |
          docker run --rm --entrypoint python \
            -v "$PWD/research/modalities:/work/research/modalities" \
            docker.io/triskit23/ternary-fep:latest \
            /work/research/modalities/linker_chem_check.py --diagnose-anchors || true
      - name: Verifier self-test (anchor patterns must match their own references)
        run: |
          docker run --rm --entrypoint python \
            -v "$PWD/research/modalities:/work/research/modalities" \
            docker.io/triskit23/ternary-fep:latest \
            /work/research/modalities/linker_chem_check.py --self-test
      - name: RDKit verification of every emitted structure
        run: |
          docker run --rm --entrypoint python \
            -v "$PWD/research/modalities:/work/research/modalities" \
            docker.io/triskit23/ternary-fep:latest \
            /work/research/modalities/linker_chem_check.py \
            --design /work/research/modalities/nr4a3-linker-design.json \
            --out /work/research/modalities/nr4a3-linker-library-chem.json
      - name: Commit the design + verification back to the triggering branch
        if: always()
        run: |
          set -e
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f research/modalities/nr4a3-linker-design.json \
                     research/modalities/nr4a3-linker-library-chem.json || true
          git commit -m "RUNG-5b: linker design library + RDKit verification (CI)" || {
            echo "no changes"; exit 0; }
          git pull --rebase origin "${{ github.ref_name }}" || true
          git push origin HEAD:"${{ github.ref_name }}"

  # Widened ligandable-recruiter availability panel (cost lever 6): which E3 arms beyond VHL/CRBN are even
  # available, feeding the mandatory downselect to <=2 recruiters before any GPU leg. HPA is egress-blocked
  # from the dev sandbox, so it runs here.
  nr4a_e3_widened:
    if: ${{ github.event.inputs.task == 'nr4a_e3_widened' }}
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: E3-machinery availability — VHL/CRBN arms + widened ligandable recruiter panel (HPA)
        run: python research/modalities/nr4a3_e3_expression.py
      - name: Commit results back to the triggering branch
        run: |
          set -e
          # ⛔ ONE HOME FOR THE PUBLISH. `git pull --rebase` wedges on a conflict — the repo is left
          # mid-rebase, every retry dies on the first one's wreckage, and the step ends GREEN having
          # published nothing (measured on three lanes; see research/compute/publish_artifacts.sh).
          # PUBLISH_IF_CHANGED=1 keeps this step's EVENT semantics: it records a result, not a
          # heartbeat, so a run that produced nothing new must not commit as though it had.
          PUBLISH_IF_CHANGED=1 bash research/compute/publish_artifacts.sh "${{ github.ref_name }}" \
            "E3-machinery availability: widened ligandable recruiter panel (HPA, CI)" \
            research/modalities/nr4a-e3-expression.json

  # RUNG 5a(c): stage every widened ligandable E3 recruiter from the RCSB PDB, compute ligandability +
  # exit-vector geometry, and apply the preregistered downselect to <=2 with the dropped set logged. Needs
  # UniProt + RCSB, both of which the dev sandbox's egress proxy 403s, so it runs here. $0 CPU.
  e3_recruiter_stage:
    if: ${{ github.event.inputs.task == 'e3_recruiter_stage' }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Unit tests (pure geometry + the preregistered downselect rule, offline)
        working-directory: research/modalities
        run: |
          python -m pip install --quiet pytest
          python -m pytest tests/test_e3_recruiter_staging.py -q
      - name: Install fpocket (conda-forge via micromamba)
        continue-on-error: true
        run: |
          set -e
          cd "$RUNNER_TEMP"
          curl -Ls https://micro.mamba.pm/api/micromamba/linux-64/latest | tar -xvj bin/micromamba
          ./bin/micromamba create -y -p "$RUNNER_TEMP/menv" -c conda-forge fpocket
          echo "$RUNNER_TEMP/menv/bin" >> "$GITHUB_PATH"
      - name: Stage E3 recruiters + ligandability + downselect (RCSB + UniProt)
        working-directory: research/modalities
        # NOTE: no phase input — workflow_dispatch is capped at 25 inputs and this file is at the cap
        # (a 26th returns "you may only define up to 25 inputs" and makes the WHOLE file undispatchable).
        # Refetching RCSB/UniProt costs ~11 min of free runner time, so always run the full phase.
        run: python e3_recruiter_staging.py --phase all
      - name: Commit results back to the triggering branch
        run: |
          set -e
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f research/modalities/e3-recruiter-staging.json \
                     research/modalities/e3-recruiter-staging.md \
                     research/modalities/e3-recruiter-rcsb-cache.json
          git commit -m "E3 recruiter staging + ligandability downselect (RCSB/UniProt, CI)" || {
            echo "no changes"; exit 0; }
          git pull --rebase origin "${{ github.ref_name }}" || true
          git push origin HEAD:"${{ github.ref_name }}"

  # Bid optimisation: rank LIVE Vast offers by expected $ per COMPLETED unit and compare against the incumbent
  # min_bid x1.9 policy. Read-only offer search — no rent, no instance, no spend.
  vast_bid_advise:
    if: ${{ github.event.inputs.task == 'vast_bid_advise' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    env:
      VAST_API_KEY: ${{ secrets.VAST_API_KEY }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Unit tests (pure logic, offline)
        working-directory: research/modalities
        run: python -m unittest tests.test_vast_bid_optimizer -v
      - name: GPU-CLASS SWEEP — rank card classes by $/ns, not $/hr
        working-directory: research/modalities
        run: |
          python vast_bid_optimizer.py --live --gpu-sweep "rtx4090,rtx3090,l4,a10,rtx4080,rtx3080,a4000,rtx a5000,rtx a6000" \
            --work-gpu-h 10.7 --atoms 146000 --ckpt-iters 40 --sec-per-iter 16 \
            > vast-gpu-class-sweep.json && cat vast-gpu-class-sweep.json
      - name: CROSS-CHECK the on-demand premise (same query as on-demand, matched by machine_id)
        working-directory: research/modalities
        run: |
          # Measures the INTERRUPTIBLE DISCOUNT — the only number that decides bid-vs-buy. Must sweep every card
          # class and request a deep page: scoped to rtx4090 at the API's default limit this matched exactly ONE
          # machine. And it must issue a real on-demand query, because `dph_base` inside a `type: "bid"` search is
          # the rate at the floor by definition (that identity produced a retracted "no discount" claim).
          python vast_bid_optimizer.py --live --crosscheck-ondemand --crosscheck-limit 512 \
            --gpu "rtx4090,rtx3090,rtx4080,l4,a10,a4000,rtx a5000,rtx a6000" \
            --work-gpu-h 1 > vast-bid-ondemand-crosscheck.json && cat vast-bid-ondemand-crosscheck.json
      - name: Advise — ternary edge profile (10.7 GPU-h/leg, 146k particles, ckpt 40 @ ~16 s/iter)
        working-directory: research/modalities
        run: |
          python vast_bid_optimizer.py --live --gpu rtx4090             --work-gpu-h 10.7 --atoms 146000 --ckpt-iters 40 --sec-per-iter 16             --out vast-bid-advice-ternary.json
      - name: Advise — RBFE edge profile (13.7 GPU-h/unit, 35k particles, measured NR4A3 rate ~13.6 s/iter)
        working-directory: research/modalities
        run: |
          python vast_bid_optimizer.py --live --gpu rtx4090             --work-gpu-h 13.7 --atoms 35000 --ckpt-iters 40 --sec-per-iter 13.6             --out vast-bid-advice-rbfe.json
      - name: Commit the advice back to the triggering branch
        if: always()
        run: |
          set -e
          # ⛔ ONE HOME FOR THE PUBLISH. `git pull --rebase` wedges on a conflict — the repo is left
          # mid-rebase, every retry dies on the first one's wreckage, and the step ends GREEN having
          # published nothing (measured on three lanes; see research/compute/publish_artifacts.sh).
          # PUBLISH_IF_CHANGED=1 keeps this step's EVENT semantics: it records a result, not a
          # heartbeat, so a run that produced nothing new must not commit as though it had.
          PUBLISH_IF_CHANGED=1 bash research/compute/publish_artifacts.sh "${{ github.ref_name }}" \
            "vast bid advice on the live market (read-only offer search)" \
            research/modalities/vast-bid-advice-*.json \
            research/modalities/vast-bid-ondemand-crosscheck.json \
            research/modalities/vast-gpu-class-sweep.json

  # Pull Vast's OFFICIAL historical market metrics (hourly, P10/median/P90). The sandbox proxy 403s
  # console.vast.ai, so this runs here. Read-only; no rent, no spend.
  vast_price_history:
    if: ${{ github.event.inputs.task == 'vast_price_history' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    env:
      VAST_API_KEY: ${{ secrets.VAST_API_KEY }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Fetch historical GPU market metrics (RTX 4090)
        working-directory: research/modalities
        run: python vast_price_history_fetch.py --gpu "RTX 4090" --days 60
      - name: Commit the history back to the triggering branch
        if: always()
        run: |
          set -e
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f research/modalities/vast-price-history.jsonl \
                     research/modalities/vast-price-history-raw.json || true
          git commit -m "vast official market-metrics price history" || { echo "no changes"; exit 0; }
          git pull --rebase origin "${{ github.ref_name }}" || true
          git push origin HEAD:"${{ github.ref_name }}"

  nrv04_cys:
    if: ${{ github.event.inputs.task == 'nrv04_cys' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: NR-V04 covalent Leg 0 — celastrol-Cys551 conservation across NR4A1/2/3 (UniProt)
        working-directory: research/modalities
        run: python nrv04_cys_conservation.py
      - name: Publish result to modalities-cache branch
        if: always()
        run: |
          set -e
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          cp research/modalities/nrv04-cys-conservation.json "$RUNNER_TEMP/" 2>/dev/null || true
          git fetch origin modalities-cache || true
          rm -f research/modalities/*.json research/modalities/*.png
          if git show-ref --verify --quiet refs/remotes/origin/modalities-cache; then
            git checkout -B modalities-cache origin/modalities-cache
          else
            git checkout --orphan modalities-cache; git rm -rf . >/dev/null 2>&1 || true
          fi
          mkdir -p research/modalities
          cp "$RUNNER_TEMP/nrv04-cys-conservation.json" research/modalities/ 2>/dev/null || true
          git add research/modalities/nrv04-cys-conservation.json 2>/dev/null || true
          git commit -m "NR-V04 Leg 0: celastrol-Cys551 conservation across NR4A1/2/3" || { echo "no changes"; exit 0; }
          git push origin modalities-cache

  nrv04_md_smoke:
    if: ${{ github.event.inputs.task == 'nrv04_md_smoke' }}
    runs-on: ubuntu-latest
    timeout-minutes: 40
    defaults:
      run:
        shell: bash -el {0}
    steps:
      - uses: actions/checkout@v4
      - name: Set up MD env (openmm + openff + openmmforcefields + rdkit + gemmi)
        uses: mamba-org/setup-micromamba@v1
        with:
          environment-name: nrv04md
          create-args: >-
            python=3.11 openmm openff-toolkit openmmforcefields ambertools rdkit gemmi numpy
          condarc: |
            channels:
              - conda-forge
      - name: NR-V04 MD-env + celastrol-param + restraint mechanics smoke (vacuum, CPU)
        working-directory: research/modalities
        run: python nrv04_md_env_smoke.py

  nrv04_build_env:
    # Build the MD conda env ONCE, conda-pack it, cache in S3 (mdenv/nrv04md.tar.gz). Vast instances then
    # extract this in ~1-2 min instead of each solving the ~25-min conda create (the diagnosed boot bottleneck).
    if: ${{ github.event.inputs.task == 'nrv04_build_env' }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    defaults:
      run:
        shell: bash -el {0}
    env:
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      # The credential a RENTED community host is given, forwarded in cleartext by _vast_onstart.
      # Scoped to the lane prefixes + six S3 actions a leg needs (s3_scoped_policy.py). Unset until
      # trimcrae creates the vast-leg-s3 user -> gpu_backend falls back to the broad key above, which
      # is why lanes in flight kept running. Runbook: research/compute/scoped-s3-credential-runbook.md
      VAST_S3_ACCESS_KEY_ID: ${{ secrets.VAST_S3_ACCESS_KEY_ID }}
      VAST_S3_SECRET_ACCESS_KEY: ${{ secrets.VAST_S3_SECRET_ACCESS_KEY }}
      VAST_S3_SCOPED_STS: ${{ vars.VAST_S3_SCOPED_STS }}
      AWS_DEFAULT_REGION: us-east-2
      VAST_CKPT_BUCKET: ${{ github.event.inputs.vast_ckpt_bucket }}
      # Target CUDA 12.6 so the solver picks CUDA-12 openmm/pytorch builds (PTX runs on all >=12.6 host drivers).
      # The unpinned/CUDA-13 openmm PTX-crashed on every Vast host. This virtual-package override is the reliable
      # mechanism (a `cuda-version=…` spec did not resolve in micromamba).
      CONDA_OVERRIDE_CUDA: "12.6"
    steps:
      - uses: actions/checkout@v4
      - name: Build the MD env (same stack as the Vast job + the CPU smoke)
        uses: mamba-org/setup-micromamba@v1
        with:
          environment-name: nrv04md
          create-args: >-
            python=3.11 openmm openff-toolkit openmmforcefields ambertools rdkit gemmi numpy boto3 awscli pdbfixer openff-nagl openff-nagl-models
          condarc: |
            channels:
              - conda-forge
      - name: Ensure pdbfixer + openff-nagl are really in the env (setup-micromamba can restore a stale cache)
        run: |
          set -eo pipefail
          # The env step has restored stale caches (77s) that predated new packages -> the packed tarball lacked
          # them and the baked image crashed every leg. Verify the imports the driver uses; install if stale.
          # NB: pdbfixer exposes no __version__ — probe the real import (from pdbfixer import PDBFixer).
          micromamba run -n nrv04md python -c "from pdbfixer import PDBFixer" \
            || micromamba install -n nrv04md -y -c conda-forge pdbfixer
          # NAGL (ligand charges) — the driver imports the toolkit wrapper; the model package must be present too.
          micromamba run -n nrv04md python -c "from openff.toolkit.utils.nagl_wrapper import NAGLToolkitWrapper; import openff.nagl_models" \
            || micromamba install -n nrv04md -y -c conda-forge openff-nagl openff-nagl-models
          micromamba run -n nrv04md python -c "from pdbfixer import PDBFixer; from openff.toolkit.utils.nagl_wrapper import NAGLToolkitWrapper; import openff.nagl_models; print('pdbfixer + nagl import OK')"
      - name: conda-pack the env and upload to S3
        run: |
          set -eo pipefail
          python -m pip install -q conda-pack awscli
          ENV_PREFIX="$MAMBA_ROOT_PREFIX/envs/nrv04md"
          [ -d "$ENV_PREFIX" ] || ENV_PREFIX=$(micromamba env list | awk '/nrv04md/{print $NF; exit}')
          echo "packing $ENV_PREFIX"
          conda-pack -p "$ENV_PREFIX" -o nrv04md.tar.gz --format tar.gz --n-threads -1 --ignore-missing-files
          ls -lh nrv04md.tar.gz
          aws s3 cp nrv04md.tar.gz "s3://${VAST_CKPT_BUCKET}/mdenv/nrv04md.tar.gz"
          echo "uploaded s3://${VAST_CKPT_BUCKET}/mdenv/nrv04md.tar.gz"

  nrv04_charge_cache:
    # Pre-compute AM1-BCC charges for the 3 distinct panel ligands ONCE (free CPU) and upload the shared
    # openmmforcefields cache to s3://.../nrv04-ffcache/ffcache.json, so no GPU leg pays the ~40-min single-core
    # sqm charge of the 166-atom recruiter (root-caused from build_smoke #2). Generous timeout: ~40 min each for
    # nrv04 + nrv04_epimer, plus a few for celastrol; the cache checkpoints to S3 after each ligand (resumable).
    if: ${{ github.event.inputs.task == 'nrv04_charge_cache' }}
    runs-on: ubuntu-latest
    timeout-minutes: 210
    defaults:
      run:
        shell: bash -el {0}
    env:
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      # The credential a RENTED community host is given, forwarded in cleartext by _vast_onstart.
      # Scoped to the lane prefixes + six S3 actions a leg needs (s3_scoped_policy.py). Unset until
      # trimcrae creates the vast-leg-s3 user -> gpu_backend falls back to the broad key above, which
      # is why lanes in flight kept running. Runbook: research/compute/scoped-s3-credential-runbook.md
      VAST_S3_ACCESS_KEY_ID: ${{ secrets.VAST_S3_ACCESS_KEY_ID }}
      VAST_S3_SECRET_ACCESS_KEY: ${{ secrets.VAST_S3_SECRET_ACCESS_KEY }}
      VAST_S3_SCOPED_STS: ${{ vars.VAST_S3_SCOPED_STS }}
      AWS_DEFAULT_REGION: us-east-2
      VAST_CKPT_BUCKET: ${{ github.event.inputs.vast_ckpt_bucket }}
    steps:
      - uses: actions/checkout@v4
      - name: Set up MD env (openmm + openff + openmmforcefields + ambertools + rdkit + boto3)
        uses: mamba-org/setup-micromamba@v1
        with:
          environment-name: nrv04md
          create-args: >-
            python=3.11 openmm openff-toolkit openmmforcefields ambertools rdkit gemmi numpy boto3 pdbfixer
          condarc: |
            channels:
              - conda-forge
      - name: Charge the distinct panel ligands once and cache to S3 (CPU, no GPU)
        working-directory: research/modalities
        run: python nrv04_charge_cache.py

  nrv04_build_smoke:
    # FREE CPU validation: build the full solvated OpenMM system from the REAL co-fold (PDBFixer prep ->
    # addSolvent -> createSystem -> covalent restraint). Catches the missing-hydrogens/capping class of bug that
    # crashed every leg, before any GPU spend. Loads the pre-computed FF charge cache from S3 so it also VALIDATES
    # that the cache eliminates the ~40-min sqm charge (build now finishes in ~1-2 min). No Vast.
    if: ${{ github.event.inputs.task == 'nrv04_build_smoke' }}
    runs-on: ubuntu-latest
    timeout-minutes: 40
    defaults:
      run:
        shell: bash -el {0}
    env:
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      # The credential a RENTED community host is given, forwarded in cleartext by _vast_onstart.
      # Scoped to the lane prefixes + six S3 actions a leg needs (s3_scoped_policy.py). Unset until
      # trimcrae creates the vast-leg-s3 user -> gpu_backend falls back to the broad key above, which
      # is why lanes in flight kept running. Runbook: research/compute/scoped-s3-credential-runbook.md
      VAST_S3_ACCESS_KEY_ID: ${{ secrets.VAST_S3_ACCESS_KEY_ID }}
      VAST_S3_SECRET_ACCESS_KEY: ${{ secrets.VAST_S3_SECRET_ACCESS_KEY }}
      VAST_S3_SCOPED_STS: ${{ vars.VAST_S3_SCOPED_STS }}
      AWS_DEFAULT_REGION: us-east-2
      VAST_CKPT_BUCKET: ${{ github.event.inputs.vast_ckpt_bucket }}
      NRV04_COFOLD_PREFIX: ${{ github.event.inputs.cofold_prefix }}
      CONDA_OVERRIDE_CUDA: "12.6"   # match build_env: CUDA-12 builds so this CPU validation mirrors the Vast env
    steps:
      - uses: actions/checkout@v4
      # ⛔ DO NOT "FIX" THIS INTO A PRE-BAKED IMAGE PULL WITHOUT MEASURING IT FIRST (2026-07-31 — I started
      # that change and the measurement killed it). CLAUDE.md §6 says never solve a conda env in CI because a
      # solve costs ~15-25 min against a ~2-4 min pull, and `triskit23/nrv04vast` does carry this exact stack
      # (it bakes the conda-pack `nrv04_build_env` produces, same package list). But the rule's PREMISE does
      # not hold for THIS job: `setup-micromamba` caches the environment, and the completed record of run
      # 30662210714 puts this step at 1.8 MINUTES, while the nrv04vast image is 8.19 GB to pull. Swapping
      # would have been a regression sold as a rule compliance, justified by a remembered figure instead of
      # this job's own timing — CLAUDE.md §4's "probably X" in workflow form.
      # The parity concern §6 also raises (a diagnostic energy computed by a different openmm build than
      # produced the failure) is already answered empirically: the PE stage probe reproduced the production
      # leg's recorded `pe_pre_min` to ten significant figures from this env. If that ever stops holding, the
      # image is there and the swap becomes right — on evidence, not on the general rule.
      - name: Set up MD env (openmm + openff + openmmforcefields + rdkit + gemmi + boto3 + nagl)
        uses: mamba-org/setup-micromamba@v1
        with:
          environment-name: nrv04md
          create-args: >-
            python=3.11 openmm openff-toolkit openmmforcefields ambertools rdkit gemmi numpy boto3 pdbfixer openff-nagl openff-nagl-models
          condarc: |
            channels:
              - conda-forge
      - name: Build the full solvated system from the real co-fold (CPU, no MD; NAGL charges — no sqm)
        if: ${{ github.event.inputs.vast_selector == '' }}
        working-directory: research/modalities
        run: python nrv04_build_smoke.py
      # ★ STAGE-BY-STAGE SINGLE-POINT PE — the diagnostic that replaced the retired inter-chain-distance gate.
      # Shares this job because it needs exactly the same thing: the MD env, AWS creds and a CPU. Selected by
      # `vast_selector` (comma-sep system:seed pairs) rather than a new input — this workflow is at the 25-input
      # cap, and the selector is already the multi-purpose one. Blank selector keeps the original smoke.
      # $0: no GPU, no MD, no minimisation, one energy evaluation per construction stage.
      - name: Where does the energy go non-physical? (CPU single-point PE per build stage)
        if: ${{ github.event.inputs.vast_selector != '' }}
        working-directory: research/modalities
        run: python nrv04_pe_stage_probe.py --units "${{ github.event.inputs.vast_selector }}"
      - name: Upload the PE stage probe
        if: ${{ always() && github.event.inputs.vast_selector != '' }}
        uses: actions/upload-artifact@v4
        with:
          name: nrv04-pe-stage-probe
          path: research/modalities/nrv04-pe-stage-probe.json
          if-no-files-found: ignore

  nrv04_input_audit:
    # LANE 8 / prereg AMENDMENT 1 criterion A1. The amendment records A1 as failing and concludes Boltz seats
    # celastrol against no NR4A1 cysteine "in any co-fold currently in the bucket". That rests on
    # nrv04_prespend_check._pull_model, which samples ONE model per system (sorted(_model_0.cif)[0]) out of a
    # seed ENSEMBLE. This job measures A1 on EVERY model of EVERY system of EVERY co-fold prefix, and separates
    # "passes at the NEAREST target cysteine" from "passes at the FROZEN site (NR4A1 C551)" -- which the
    # prespend check does not distinguish. $0: read-only S3 + CPU.
    if: ${{ github.event.inputs.task == 'nrv04_input_audit' }}
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      # The credential a RENTED community host is given, forwarded in cleartext by _vast_onstart.
      # Scoped to the lane prefixes + six S3 actions a leg needs (s3_scoped_policy.py). Unset until
      # trimcrae creates the vast-leg-s3 user -> gpu_backend falls back to the broad key above, which
      # is why lanes in flight kept running. Runbook: research/compute/scoped-s3-credential-runbook.md
      VAST_S3_ACCESS_KEY_ID: ${{ secrets.VAST_S3_ACCESS_KEY_ID }}
      VAST_S3_SECRET_ACCESS_KEY: ${{ secrets.VAST_S3_SECRET_ACCESS_KEY }}
      VAST_S3_SCOPED_STS: ${{ vars.VAST_S3_SCOPED_STS }}
      AWS_DEFAULT_REGION: us-east-2
      VAST_CKPT_BUCKET: ${{ github.event.inputs.vast_ckpt_bucket }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -q boto3 gemmi numpy rdkit
      - name: Exhaustive A1 admissibility audit over every co-fold model
        env:
          PREFIXES: ${{ github.event.inputs.ternary_extra_args }}
        run: |
          # A restricted run must NOT overwrite the full 34-model enumeration -- that file is the evidence for
          # the "no admissible input in the bucket" claim, and a 7-model replacement would silently weaken it.
          OUT=research/modalities/nrv04-covalent-input-audit.json
          if [ -n "$PREFIXES" ]; then
            SLUG=$(printf '%s' "$PREFIXES" | tr ',' '-' | tr -cd 'a-zA-Z0-9-' | cut -c1-60)
            OUT="research/modalities/nrv04-covalent-input-audit-${SLUG}.json"
          fi
          echo "writing $OUT"
          python research/modalities/nrv04_covalent_input_audit.py \
            --bucket "${VAST_CKPT_BUCKET}" --prefixes "$PREFIXES" --out "$OUT"
          echo "AUDIT_OUT=$OUT" >> "$GITHUB_ENV"
      # $0 validation of the steered-refold probe BEFORE any GPU spend: writes the three Boltz YAMLs (no
      # inference) and, in doing so, resolves C551 to its construct index against the LIVE UniProt sequence and
      # asserts it is a cysteine. A YAML or index error caught here costs nothing; caught on the GPU box it
      # costs a rented hour.
      - name: Prep-validate the C551 site probe YAMLs (no GPU, no inference)
        env:
          OUTPUT_DIR: ${{ runner.temp }}/site_probe
        run: |
          python research/modalities/nrv04_celastrol_site_probe.py
          echo "=== binary_pocket.yaml (tail) ==="
          tail -8 "$OUTPUT_DIR/binary_pocket.yaml"
      - name: Commit the audit JSON back to the branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add research/modalities/nrv04-covalent-input-audit*.json || true
          if git diff --cached --quiet; then
            echo "no change"
          else
            git commit -m "NR-V04 A1 audit: every co-fold model measured (auto)"
            for attempt in 1 2 3 4; do
              git pull --rebase origin ${{ github.ref_name }} && \
                git push origin HEAD:${{ github.ref_name }} && break
              echo "push attempt $attempt lost a race; retrying"; sleep $((attempt * 5))
            done
          fi

