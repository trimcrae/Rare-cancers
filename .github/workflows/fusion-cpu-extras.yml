  nrv04_s3_tail:
    # ~30 s progress check on ANY Vast job that follows the repo's phase-marker + run.log convention: prints
    # `phase.txt` and the tail of `run.log` under an S3 prefix, plus the object listing with mtimes. This exists
    # because an in-progress job's log is not readable through the GitHub API and `diag` only reports the
    # INSTANCE's state -- neither distinguishes "advancing" from "stalled", which the tight-monitoring rule
    # requires every check to do. Prefix comes from cofold_output_prefix. $0.
    if: ${{ github.event.inputs.task == 'nrv04_s3_tail' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      # The credential a RENTED community host is given, forwarded in cleartext by _vast_onstart.
      # Scoped to the lane prefixes + six S3 actions a leg needs (s3_scoped_policy.py). Unset until
      # trimcrae creates the vast-leg-s3 user -> gpu_backend falls back to the broad key above, which
      # is why lanes in flight kept running. Runbook: research/compute/scoped-s3-credential-runbook.md
      VAST_S3_ACCESS_KEY_ID: ${{ secrets.VAST_S3_ACCESS_KEY_ID }}
      VAST_S3_SECRET_ACCESS_KEY: ${{ secrets.VAST_S3_SECRET_ACCESS_KEY }}
      VAST_S3_SCOPED_STS: ${{ vars.VAST_S3_SCOPED_STS }}
      AWS_DEFAULT_REGION: us-east-2
      VAST_CKPT_BUCKET: ${{ github.event.inputs.vast_ckpt_bucket }}
      # `cofold_output_prefix` names the prefix; `vast_selector` may name a UNIT under it (no new input — the
      # workflow is at the 25-input cap, tests/test_workflow_input_cap.py).
      PREFIX: ${{ github.event.inputs.cofold_output_prefix }}
      UNIT: ${{ github.event.inputs.vast_selector }}
      VAST_API_KEY: ${{ secrets.VAST_API_KEY }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: phase + run.log tail + object listing
        run: |
          python3 -m pip install -q awscli >/dev/null 2>&1 || pip install -q awscli >/dev/null 2>&1 || true
          # `&&` alone would be the step's last command on the blank-UNIT path and return 1 under bash -e.
          P="${PREFIX}"
          if [ -n "$UNIT" ]; then P="${PREFIX%/}/${UNIT}"; fi
          echo "=== prefix: s3://${VAST_CKPT_BUCKET}/${P}/ ==="
          echo "=== phase.txt ==="
          aws s3 cp "s3://${VAST_CKPT_BUCKET}/${P}/phase.txt" - 2>/dev/null || echo "(no phase.txt yet)"
          echo "=== objects (mtime, size) ==="
          aws s3 ls "s3://${VAST_CKPT_BUCKET}/${P}/" --recursive --human-readable 2>/dev/null | tail -60 \
            || echo "(prefix empty)"
          echo "=== run.log (tail 60) ==="
          aws s3 cp "s3://${VAST_CKPT_BUCKET}/${P}/run.log" /tmp/run.log 2>/dev/null \
            && tail -60 /tmp/run.log || echo "(no run.log yet)"
          # ★ THE LEG RECORD ITSELF. `retro_collect` reads leg_*.json but prints only the coverage summary
          # (`legs` is stripped from its stdout dump), so "a result landed" was visible while WHAT landed was
          # not. A smoke leg and a 6 ns production leg are both "a result"; only these fields tell them apart:
          #   mode=run · prod_ns=5.0 · equil_ns=1.0 · n_frames=500 · timed_ns≈5.0   (md_settings.py: 4 fs, HMR,
          #   10 ps frame stride -> 1,250,000 prod steps / 2,500 = 500 frames)
          # versus a smoke, which is equil_steps=0 / prod_steps=500 / stride=100 -> n_frames=5, timed_ns=0.002
          # (nrv04_covalent_md.run_leg). `panel` and `leg_id` say which panel wrote it, so a leg that drifted in
          # from the withdrawn covalent panel is identifiable rather than merely assumed absent.
          echo "=== leg_*.json (the frozen leg record) ==="
          aws s3 cp "s3://${VAST_CKPT_BUCKET}/${P}/" /tmp/legs/ --recursive \
            --exclude '*' --include 'leg_*.json' --only-show-errors 2>/dev/null || true
          if ls /tmp/legs/*.json >/dev/null 2>&1; then
            for f in /tmp/legs/*.json; do
              echo "--- $f ---"
              python3 - "$f" <<'PYEOF'
          import json, sys
          d = json.load(open(sys.argv[1]))
          keys = ("panel", "leg_id", "seed", "mode", "prod_ns", "equil_ns", "n_frames", "timed_ns",
                  "ns_per_day", "prod_wall_s", "blew_up", "blow_phase", "covalent", "mutation",
                  "chain_split", "analysis_traj", "pe_pre_min_kj", "pe_post_min_kj")
          for k in keys:
              print(f"  {k} = {json.dumps(d.get(k))}")
          print("  meta.n_atoms =", json.dumps((d.get("meta") or {}).get("n_atoms")))
          print("  md_settings =", json.dumps(d.get("md_settings")))
          for r in ("R1_interface", "R2_recruitment", "R3_lys"):
              print(f"  {r} = {json.dumps(d.get(r))}")
          print("  ALL TOP-LEVEL KEYS =", sorted(d))
          PYEOF
            done
          else
            echo "(no leg_*.json under this prefix)"
          fi
      - name: Retro smoke forensics (read-only; rents nothing, destroys nothing)
        run: |
          pip install -q boto3
          python research/modalities/nrv04_retro_smoke_forensics.py
      # ★ PER-ATTEMPT forensics: WHAT killed each rental, from `legs/<unit>/attempt-logs/`. The smoke
      # forensics above answers "is this record a smoke or a production leg"; this answers "why did the last
      # three rentals bank nothing", which is the question a breaker verdict cannot reach. Read-only.
      # Units come from `vast_selector` (full `nrv04retro-...` names, comma/space separated); blank = the
      # AMENDMENT 4 §4.5 dependency pair. Non-retro dispatches of this task simply report the default pair.
      - name: Retro per-attempt forensics (read-only)
        env:
          RETRO_FORENSIC_UNITS: ${{ github.event.inputs.vast_selector }}
        run: |
          pip install -q boto3
          python research/modalities/nrv04_retro_unit_forensics.py
      # ★ THE RENTAL DEATH CERTIFICATES. S3 cannot tell "the host died" from "we destroyed the host" — both
      # leave a truncated run.log and no leg record — and the remedies are opposite. The supervision tick
      # prints the reason it acted, so the tick log is where that distinction lives.
      # ★ THE EMITTED VERDICT, copied into the repo. It was S3-only, and a reader looking for it found the
      # PREREGISTERED criteria audit instead and read that reference set as the outcome. Read-only.
      - name: Retro emitted verdict readout (read-only)
        run: |
          pip install -q boto3
          python research/modalities/nrv04_retro_verdict_readout.py || true
      - name: Retro host history from the supervision ticks (read-only)
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RETRO_HISTORY_UNIT: ${{ github.event.inputs.vast_selector }}
          RETRO_HISTORY_HOSTS: ${{ github.event.inputs.ternary_extra_args }}
        run: python research/modalities/nrv04_retro_host_history.py
      - name: Commit the forensic artifact
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add research/modalities/nrv04-retro-unit-forensics.json \
                  research/modalities/nrv04-retro-host-history.json \
                  research/modalities/nrv04-retro-verdict.json || true
          git diff --cached --quiet && { echo "no change"; exit 0; }
          git commit -m "NR-V04 retro: per-attempt forensics for the AMENDMENT 4 §4.5 dependency unit (CI)"
          git pull --rebase origin "${{ github.ref_name }}" || true
          git push origin HEAD:"${{ github.ref_name }}"

  nrv04_ffcache_status:
    # Fast diagnostic (~30s): print the ffcache object's LastModified + size so we can tell whether charge_cache
    # is progressing (recent mtime = a ligand just finished) or hung on one ligand's sqm (stale mtime).
    if: ${{ github.event.inputs.task == 'nrv04_ffcache_status' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      # The credential a RENTED community host is given, forwarded in cleartext by _vast_onstart.
      # Scoped to the lane prefixes + six S3 actions a leg needs (s3_scoped_policy.py). Unset until
      # trimcrae creates the vast-leg-s3 user -> gpu_backend falls back to the broad key above, which
      # is why lanes in flight kept running. Runbook: research/compute/scoped-s3-credential-runbook.md
      VAST_S3_ACCESS_KEY_ID: ${{ secrets.VAST_S3_ACCESS_KEY_ID }}
      VAST_S3_SECRET_ACCESS_KEY: ${{ secrets.VAST_S3_SECRET_ACCESS_KEY }}
      VAST_S3_SCOPED_STS: ${{ vars.VAST_S3_SCOPED_STS }}
      AWS_DEFAULT_REGION: us-east-2
      VAST_CKPT_BUCKET: ${{ github.event.inputs.vast_ckpt_bucket }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
      - name: Head the ffcache object + list the prefix
        run: |
          python3 -m pip install -q awscli >/dev/null 2>&1 || pip install -q awscli >/dev/null 2>&1 || true
          echo "=== s3://${VAST_CKPT_BUCKET}/nrv04-ffcache/ ==="
          aws s3 ls "s3://${VAST_CKPT_BUCKET}/nrv04-ffcache/" --recursive --human-readable || echo "(empty/none)"
          echo "=== head-object ffcache.json ==="
          aws s3api head-object --bucket "${VAST_CKPT_BUCKET}" --key nrv04-ffcache/ffcache.json \
            --query '{LastModified:LastModified,SizeBytes:ContentLength}' --output json || echo "(no ffcache.json yet)"
      # READ-ONLY forensics of the covalent panel's result prefixes. Answers the one question that decides whether
      # the withdrawn GO can be recovered without spending: does the bucket hold per-frame COORDINATES, or only
      # scalars already reduced against the wrong chain split? Settled from real keys/sizes/mtimes, not from
      # reading the driver (CLAUDE.md §4 — the listing is the diagnosis, the code is the hypothesis).
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -q boto3 gemmi scipy numpy rdkit
      - name: NR-V04 covalent-panel result forensics (read-only)
        run: python research/modalities/nrv04_result_forensics.py --bucket "${VAST_CKPT_BUCKET}"
      # The trajectories are gone, but every leg's SOLVATED STARTING SYSTEM was persisted. That one frame gives
      # the t=0 value of everything R1/R2/R3 reduce, under BOTH chain splits — enough to decide what a paid
      # re-run can possibly show, before paying for it. It also fingerprints WHICH co-fold each system was built
      # from, which is how the contaminated-input finding is pinned positively rather than only by elimination.
      - name: Corrected-split t=0 analysis of the persisted systems
        run: python research/modalities/nrv04_corrected_t0.py --bucket "${VAST_CKPT_BUCKET}"
      - name: Same analysis on the chainfix prefix (the corrected-split smoke leg)
        run: |
          python research/modalities/nrv04_corrected_t0.py --bucket "${VAST_CKPT_BUCKET}" \
            --prefix nrv04-covalent-results-chainfix \
            --out research/modalities/nrv04-corrected-t0-chainfix.json
      # Free staging check on the inputs a paid re-run would actually use: does every leg stage, is the warhead
      # seated in the target pocket, and how big is the interface R2 would see.
      - name: Pre-spend staging check on the clean co-fold
        run: python research/modalities/nrv04_prespend_check.py --bucket "${VAST_CKPT_BUCKET}"
      - name: Commit the forensics JSON back to the branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add research/modalities/nrv04-result-forensics.json \
                  research/modalities/nrv04-corrected-t0.json \
                  research/modalities/nrv04-corrected-t0-chainfix.json \
                  research/modalities/nrv04-prespend-check.json || true
          if git diff --cached --quiet; then
            echo "no change to nrv04-result-forensics.json"
          else
            git commit -m "NR-V04 panel S3 forensics: what was actually persisted (auto)"
            for attempt in 1 2 3 4; do
              git pull --rebase origin ${{ github.ref_name }} && \
                git push origin HEAD:${{ github.ref_name }} && break
              echo "push attempt $attempt lost a race; retrying"; sleep $((attempt * 5))
            done
          fi

  fep_bake:
    # Prebake the OpenFE ("rbfe") env into a Vast boot image -> Docker Hub (triskit23/nr4a3fep:latest). This is
    # the enabler for running nr4a3_rbfe.py (step1 RBFE) + nr4a3_ternary_fep.py (valB/retrospective/matrix) on
    # Vast: the nrv04vast image has the covalent MD env only (OpenMM, no OpenFE). Build env -> conda-pack ->
    # docker build (Dockerfile.nr4a3fep) -> push, in one job (no S3 round-trip). Make the Docker Hub repo PUBLIC.
    if: ${{ github.event.inputs.task == 'fep_bake' }}
    runs-on: ubuntu-latest
    timeout-minutes: 75
    defaults:
      run:
        shell: bash -el {0}
    env:
      DOCKERHUB_USER: triskit23
      # Force CUDA-12 openmm builds (PTX runs on all >=12.6 host drivers) — mirrors nrv04_build_env; a CUDA-13
      # openmm PTX-crashed on every Vast host.
      CONDA_OVERRIDE_CUDA: "12.6"
    steps:
      - uses: actions/checkout@v4
      - name: Reclaim runner disk (image + env are multi-GB)
        shell: bash
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/lib/android "$AGENT_TOOLSDIRECTORY" || true
          df -h /
      - name: Build the OpenFE (rbfe) conda env
        uses: mamba-org/setup-micromamba@v1
        with:
          environment-file: research/modalities/sagemaker_src/environment-rbfe.yml
          environment-name: rbfe
      - name: Verify openfe + openmm + ambertools import (the point of the image)
        run: |
          set -eo pipefail
          micromamba run -n rbfe python -c "import openfe; from openfe.protocols import openmm_rfe; print('openfe', openfe.__version__)"
          micromamba run -n rbfe python -c "import openmm; print('openmm', openmm.version.version)"
          micromamba run -n rbfe python -c "import openff.toolkit, rdkit, lomap, kartograf; print('mapping stack OK')"
          micromamba run -n rbfe bash -lc "command -v antechamber >/dev/null && command -v sqm >/dev/null && echo 'ambertools (am1bcc) OK'"
      - name: conda-pack the env into the Docker build context
        run: |
          set -eo pipefail
          python -m pip install -q conda-pack
          ENV_PREFIX="$MAMBA_ROOT_PREFIX/envs/rbfe"
          [ -d "$ENV_PREFIX" ] || ENV_PREFIX=$(micromamba env list | awk '/rbfe/{print $NF; exit}')
          echo "packing $ENV_PREFIX"
          conda-pack -p "$ENV_PREFIX" -o research/compute/rbfe.tar.gz --format tar.gz --n-threads -1 --ignore-missing-files
          ls -lh research/compute/rbfe.tar.gz
      - name: Log in to Docker Hub
        shell: bash
        run: echo "${{ secrets.DOCKERHUB_TOKEN }}" | docker login -u "$DOCKERHUB_USER" --password-stdin
      - name: Build + push the OpenFE Vast image
        shell: bash
        run: |
          set -eo pipefail
          IMG="docker.io/${DOCKERHUB_USER}/nr4a3fep:latest"
          docker build -f research/compute/Dockerfile.nr4a3fep -t "$IMG" research/compute/
          docker push "$IMG"
          echo "PUSHED $IMG — ensure the Docker Hub repo is PUBLIC so Vast pulls it unauthenticated."

  nrv04_bake:
    # Build the pre-provisioned Vast boot image (ssh/python/git/systemd + the MD conda env all baked, so Vast's
    # slow boot-time apt is a no-op) and push it to Docker Hub (public repo -> Vast pulls unauthenticated).
    if: ${{ github.event.inputs.task == 'nrv04_bake' }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      # The credential a RENTED community host is given, forwarded in cleartext by _vast_onstart.
      # Scoped to the lane prefixes + six S3 actions a leg needs (s3_scoped_policy.py). Unset until
      # trimcrae creates the vast-leg-s3 user -> gpu_backend falls back to the broad key above, which
      # is why lanes in flight kept running. Runbook: research/compute/scoped-s3-credential-runbook.md
      VAST_S3_ACCESS_KEY_ID: ${{ secrets.VAST_S3_ACCESS_KEY_ID }}
      VAST_S3_SECRET_ACCESS_KEY: ${{ secrets.VAST_S3_SECRET_ACCESS_KEY }}
      VAST_S3_SCOPED_STS: ${{ vars.VAST_S3_SCOPED_STS }}
      AWS_DEFAULT_REGION: us-east-2
      VAST_CKPT_BUCKET: ${{ github.event.inputs.vast_ckpt_bucket }}
      DOCKERHUB_USER: triskit23
    steps:
      - uses: actions/checkout@v4
      - name: Fetch the pre-packed MD env from S3 into the build context
        run: |
          python3 -m pip install -q awscli >/dev/null 2>&1 || true
          aws s3 cp "s3://${VAST_CKPT_BUCKET}/mdenv/nrv04md.tar.gz" research/compute/nrv04md.tar.gz
          ls -lh research/compute/nrv04md.tar.gz
      - name: Verify the env tarball contains pdbfixer AND openff-nagl (the point of the rebuild)
        run: |
          set -eo pipefail
          LIST=$(tar tzf research/compute/nrv04md.tar.gz)
          # grep -c reads all input -> no early-exit SIGPIPE that would false-fail under `pipefail` (the `grep -q`
          # form did exactly that and reported MISSING even though the package was present). Match a package dir
          # OR its dist-info/conda-meta record (path layout varies).
          check() {
            local name="$1" pat="$2"
            echo "--- $name paths (diagnostic) ---"; printf '%s\n' "$LIST" | grep -im 8 -E "$pat" || echo "(none)"
            local cnt; cnt=$(printf '%s\n' "$LIST" | grep -icE "$pat" || true)
            if [ "${cnt:-0}" -gt 0 ]; then echo "$name PRESENT ($cnt paths)"; else
              echo "::error::$name MISSING from nrv04md.tar.gz — re-run nrv04_build_env before baking."; exit 1; fi
          }
          check pdbfixer '/pdbfixer/|pdbfixer-[0-9].*(dist-info|\.json)'
          check openff-nagl '/openff/nagl/|openff.?nagl-[0-9].*(dist-info|\.json)|nagl_models'
          echo "tarball verified — baking."
      - name: Log in to Docker Hub
        run: echo "${{ secrets.DOCKERHUB_TOKEN }}" | docker login -u "$DOCKERHUB_USER" --password-stdin
      - name: Build + push the Vast boot image
        run: |
          set -eo pipefail
          IMG="docker.io/${DOCKERHUB_USER}/nrv04vast:latest"
          docker build -f research/compute/Dockerfile.nrv04vast -t "$IMG" research/compute/
          docker push "$IMG"
          echo "PUSHED $IMG (ensure the Docker Hub repo is PUBLIC so Vast can pull it unauthenticated)"

  nrv04_vast_launch:
    if: ${{ github.event.inputs.task == 'nrv04_vast_launch' }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      VAST_API_KEY: ${{ secrets.VAST_API_KEY }}
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      # The credential a RENTED community host is given, forwarded in cleartext by _vast_onstart.
      # Scoped to the lane prefixes + six S3 actions a leg needs (s3_scoped_policy.py). Unset until
      # trimcrae creates the vast-leg-s3 user -> gpu_backend falls back to the broad key above, which
      # is why lanes in flight kept running. Runbook: research/compute/scoped-s3-credential-runbook.md
      VAST_S3_ACCESS_KEY_ID: ${{ secrets.VAST_S3_ACCESS_KEY_ID }}
      VAST_S3_SECRET_ACCESS_KEY: ${{ secrets.VAST_S3_SECRET_ACCESS_KEY }}
      VAST_S3_SCOPED_STS: ${{ vars.VAST_S3_SCOPED_STS }}
      AWS_DEFAULT_REGION: us-east-2
      VAST_CKPT_BUCKET: ${{ github.event.inputs.vast_ckpt_bucket }}
      NRV04_COFOLD_PREFIX: ${{ github.event.inputs.cofold_prefix }}
      NRV04_RESULT_PREFIX: ${{ github.event.inputs.nrv04_result_prefix }}
      GIT_BRANCH: ${{ github.ref_name }}
      MODE: ${{ github.event.inputs.md_mode }}
      VAST_IMAGE: ${{ github.event.inputs.vast_image }}
      PILOT_ONLY: ${{ github.event.inputs.vast_launch_mode == 'full' && '0' || '1' }}
      DRY_RUN: ${{ (github.event.inputs.vast_launch_mode == 'dry' || github.event.inputs.vast_launch_mode == 'retro_dry' || github.event.inputs.vast_launch_mode == 'cofold_dry') && '1' || '0' }}
      DISCOVER: ${{ github.event.inputs.vast_launch_mode == 'discover' && '1' || '0' }}
      STAGE_TEST: ${{ github.event.inputs.vast_launch_mode == 'stage_test' && '1' || '0' }}
      COLLECT: ${{ github.event.inputs.vast_launch_mode == 'collect' && '1' || '0' }}
      MONITOR: ${{ github.event.inputs.vast_launch_mode == 'monitor' && '1' || '0' }}
      STOP_ALL: ${{ github.event.inputs.vast_launch_mode == 'stop_all' && '1' || '0' }}
      DIAG: ${{ github.event.inputs.vast_launch_mode == 'diag' && '1' || '0' }}
      PROBE_OFFERS: ${{ github.event.inputs.vast_launch_mode == 'probe_offers' && '1' || '0' }}
      BENCH: ${{ github.event.inputs.vast_launch_mode == 'bench' && '1' || '0' }}
      BENCH_COLLECT: ${{ github.event.inputs.vast_launch_mode == 'bench_collect' && '1' || '0' }}
      BENCH_EDGE_NM: ${{ github.event.inputs.bench_edge_nm }}
      BENCH_STEPS: ${{ github.event.inputs.bench_steps }}
      BENCH_GRID: ${{ github.event.inputs.bench_grid }}
      # 16 GB cards (RTX 4080) must be benchable; default stays 24.
      BENCH_MIN_VRAM_GB: ${{ github.event.inputs.bench_min_vram_gb || '24' }}
      FIRM: ${{ github.event.inputs.vast_launch_mode == 'firm' && '1' || '0' }}
      FIRM_COLLECT: ${{ (github.event.inputs.vast_launch_mode == 'firm_collect' || github.event.inputs.vast_launch_mode == 'firm_stop') && '1' || '0' }}
      FIRM_STOP: ${{ github.event.inputs.vast_launch_mode == 'firm_stop' && '1' || '0' }}
      FIRM_STOP_KIND: ${{ github.event.inputs.firm_kind }}
      FIRM_KIND: ${{ github.event.inputs.firm_kind }}
      N_ITER: ${{ github.event.inputs.firm_n_iter }}
      VAST_GPU_MODEL: ${{ github.event.inputs.vast_gpu }}
      PILOT_SEED: ${{ github.event.inputs.pilot_seed }}
      # --- NR-V04 RETROSPECTIVE holdout (prereg: nr4a3-nrv04-retrospective-prereg.md) ---
      # retro_stage_test: free CI proof the assembler handles NR4A2/NR4A3 co-folds; retro_dry: print the fan-out;
      # retro_pilot: ONE paralogue leg (the only untested staging path); retro_full: the AUTHORIZED panel —
      # R1 only, 18 legs, since AMENDMENT 3 defect 1 retired the covalent R2 arm (nrv04_retro_panel owns the
      # count; do not re-type it here);
      # retro_collect: gather leg JSONs, REAP this lane's finished/stale hosts (the control plane is the only
      # thing that can stop the meter — CLAUDE.md §6), apply the frozen gate when the panel is complete, and
      # persist the readout to S3 + this workflow's artifacts.
      # Boltz co-folding ON VAST — the lane that removes the SageMaker-by-default path (see
      # research/compute/provider-deviation-2026-07-24.md). COFOLD_OUTPUT_PREFIX must be FRESH.
      COFOLD: ${{ (github.event.inputs.vast_launch_mode == 'cofold' || github.event.inputs.vast_launch_mode == 'cofold_dry') && '1' || '0' }}
      COFOLD_OUTPUT_PREFIX: ${{ github.event.inputs.cofold_output_prefix }}
      TERNARY_SCRIPT: ${{ github.event.inputs.ternary_script }}
      TERNARY_EXTRA_ARGS: ${{ github.event.inputs.ternary_extra_args }}
      SEEDS: ${{ github.event.inputs.seeds }}
      # One input feeds both: diag reads DIAG_FILTER, stop_all reads VAST_KILL, and the modes are mutually
      # exclusive. Merged 2026-07-24 because the workflow hit GitHub's hard 25-input cap and became
      # undispatchable — see tests/test_workflow_input_cap.py.
      DIAG_FILTER: ${{ github.event.inputs.vast_selector }}
      VAST_KILL: ${{ github.event.inputs.vast_selector }}
      # ...and a THIRD consumer, for the same reason and by the same rule: `retro_pilot` needs to say WHICH
      # unit to pilot, the workflow is AT the 25-input cap, and diag/stop_all/retro_pilot are mutually
      # exclusive modes. Blank = `retro_pilot_unit` picks the first UNRUN authorized unit (prereg §7 arm
      # first). Before 2026-07-31 the pilot was HARDCODED to `retro_noncov_nr4a2` m1 r0 — the one unit of 18
      # that had already landed — so every retro_pilot dispatch skipped it, rented nothing and went green.
      RETRO_PILOT_UNIT: ${{ github.event.inputs.vast_selector }}
      RETRO_STAGE_TEST: ${{ github.event.inputs.vast_launch_mode == 'retro_stage_test' && '1' || '0' }}
      RETRO: ${{ (github.event.inputs.vast_launch_mode == 'retro_dry' || github.event.inputs.vast_launch_mode == 'retro_pilot' || github.event.inputs.vast_launch_mode == 'retro_full') && '1' || '0' }}
      RETRO_COLLECT: ${{ github.event.inputs.vast_launch_mode == 'retro_collect' && '1' || '0' }}
      # ★ RE-ARM ONE UNIT'S FAILURE BREAKER, BY BASELINE (never by deleting its attempt archive — that
      # archive is what tells three rentals from one crash-looping container, and attempt-logs/ beside it
      # holds how each attempt died). Deliberately an explicit operator dispatch: a breaker that resets
      # itself is not a breaker. Reuses `vast_selector` for the unit — the workflow is at the 25-input cap.
      RETRO_BASELINE_UNIT: ${{ github.event.inputs.vast_launch_mode == 'retro_baseline' && github.event.inputs.vast_selector || '' }}
      RETRO_BASELINE_WHY: ${{ github.event.inputs.cofold_prefix }}
      RETRO_PILOT_ONLY: ${{ github.event.inputs.vast_launch_mode == 'retro_full' && '0' || '1' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Launch NR-V04 covalent panel on Vast (discover/stage_test/dry/pilot/full)
        working-directory: research/modalities
        run: |
          set -o pipefail
          pip install -q boto3 >/dev/null 2>&1 || echo "boto3 install failed"
          case "${{ github.event.inputs.vast_launch_mode }}" in
            stage_test|retro_stage_test|cofold_audit|cofold_clash_scan)
              pip install -q gemmi rdkit >/dev/null 2>&1 || echo "gemmi/rdkit install failed" ;;
          esac
          if [ "${{ github.event.inputs.vast_launch_mode }}" = "cofold_clash_scan" ]; then
            # $0 GEOMETRY CENSUS over every co-fold the panel consumes. ⛔ NOT A GATE: its threshold was
            # refuted the first time it ran (nrv04_cofold_audit.CLASH_MIN_INTERCHAIN_A) — the smallest
            # inter-chain contact in the set belongs to the co-fold that produced the two landed production
            # legs. Kept as context beside the real discriminator, the built system's potential energy.
            python nrv04_cofold_audit.py --bucket "$VAST_CKPT_BUCKET" --clash-scan
          elif [ "${{ github.event.inputs.vast_launch_mode }}" = "cofold_audit" ]; then
            python nrv04_cofold_audit.py --bucket "$VAST_CKPT_BUCKET" --completed-panel
          else
            python nrv04_vast_launch.py
          fi
      # `retro_collect` is included deliberately. Its `nrv04-retro-collect.json` IS the deliverable of a
      # paid-for 18-leg panel, and before 2026-07-31 this step did not run in that mode and did not list the
      # file, so every collect wrote its verdict to an ephemeral runner and threw it away. The launcher also
      # persists it to S3 (the durable home); this is the second copy, so neither is the only one.
      # `nrv04-retro-market-hold.json` travels with it because CLAUDE.md §6 requires a price hold to be
      # VISIBLE — a fleet that never launched must not look like one that finished.
      - name: Upload Vast handles
        if: ${{ always() && (github.event.inputs.vast_launch_mode == 'pilot' || github.event.inputs.vast_launch_mode == 'full' || github.event.inputs.vast_launch_mode == 'retro_pilot' || github.event.inputs.vast_launch_mode == 'retro_full' || github.event.inputs.vast_launch_mode == 'retro_collect') }}
        uses: actions/upload-artifact@v4
        with:
          name: nrv04-vast-handles
          path: |
            research/modalities/nrv04-vast-handles.json
            research/modalities/nrv04-retro-handles.json
            research/modalities/nrv04-retro-collect.json
            research/modalities/nrv04-retro-market-hold.json
            research/modalities/nrv04-retro-gate.json
            research/modalities/nrv04-retro-price-ledger.json
          if-no-files-found: ignore

      # ★★ THE IN-FLIGHT BOARD, COMMITTED — because an artifact on a run that expires is not a board anyone
      # can glance at. Two files, and the split is the whole write-race resolution:
      #   * `inflight-board.d/nrv04-retro.json` is THIS LANE'S FRAGMENT and the ONLY board file this job may
      #     write. It cannot erase the ternary or fan-out rows, because it does not contain them.
      #   * `inflight-board-all.md` is the merged all-lane board. It is DERIVED in full from every lane's
      #     fragment, so it is a cache and never a home: whichever lane regenerates it last rebuilds every
      #     section from whatever fragments exist, and a concurrent overwrite loses nothing.
      # `inflight-board.md` is deliberately NOT touched here — it has a single writer (the ternary lane's
      # collect) which rewrites it wholesale, and a merged file at that path would be truncated to one lane
      # every few minutes. See `inflight_board.__doc__`.
      # `git add` each path INDEPENDENTLY: `git add A B` fails atomically if either matches nothing, which
      # would stage neither and report "nothing to commit" while swallowing it.
      - name: Commit the in-flight board fragment and the merged all-lane board
        if: ${{ always() && github.event.inputs.vast_launch_mode == 'retro_collect' }}
        env:
          # DERIVED, never stamped: every lane rewrites it in full, so our pre-reset copy would revert
          # whatever the other lanes published meanwhile. Regenerated after the reset instead.
          PUBLISH_REGEN: python3 research/modalities/inflight_board.py --write
          PUBLISH_REGEN_ADD: research/modalities/inflight-board-all.md
        run: |
          set -e
          # ⛔ ONE HOME FOR THE PUBLISH. What this replaces was ~60 lines of REBASE CONFLICT RESOLUTION —
          # `git rebase FETCH_HEAD`, then on conflict re-apply our copies of the generated files,
          # `git checkout --theirs` the merged board, `git rebase --continue`, and abort-and-retry if that
          # failed. It was written because `inflight-board-all.md` is rewritten by EVERY lane, so two ticks
          # in the same minute always conflict in it (measured: the 1:37 and 1:54 PM ET ticks each computed
          # a correct board and pushed neither, while the job stayed green).
          #
          # ⚠ THAT MACHINERY IS UNTESTABLE BY CONSTRUCTION — its branches only execute when a real conflict
          # lands mid-rebase, which no test can stage and no reviewer can exercise. Rewriting onto upstream
          # makes the conflict UNREPRESENTABLE instead of handled, so the code that handled it can go.
          #
          # The split is the same as every other lane's: the three single-writer artifacts are STAMPED, and
          # the merged board is REGENERATED after the reset — derived in full from every lane's fragment, so
          # it reads upstream's freshest ternary / step1 / gcp fragments plus the one we just laid down.
          # The pre-reset `inflight_board.py --write` that used to run first is gone with it: the reset
          # discarded that copy anyway, and PUBLISH_REGEN does the same job where it actually survives.
          #
          # ⚠ NO PUBLISH_IF_CHANGED. This fragment is the lane's HEARTBEAT, and on THIS lane a no-diff guard
          # would have destroyed the evidence for its own biggest finding: the commit series of
          # inflight-board.d/nrv04-retro.json is the entire basis of `STARTING 11:59 AM -> NO HOST x10 ticks
          # -> STARTING 2:02 PM ET`, the measurement behind "the pilot sat hostless for 1 h 55 min across ten
          # ticks of an 8-minute supervisor" (`retro_gate_reasons.__doc__`). Those ten NO HOST rows differ
          # only in their stamp; had a guard ever fired they would have collapsed to one and the outage
          # would have been invisible. The redundant-looking commit IS the mechanism.
          bash research/compute/publish_artifacts.sh "${{ github.ref_name }}" \
            "NR-V04 retro: in-flight board fragment + gate record (CI)" \
            research/modalities/inflight-board.d/nrv04-retro.json \
            research/modalities/nrv04-retro-gate.json \
            research/modalities/nrv04-retro-market-hold.json

  # STEP 1 FAN-OUT (RUNG 4) — the cmpd19 congeneric RBFE map, 8-wide on Vast 4090.
  # `plan` and `precheck` are free and spend nothing; `stage` is free CPU on this runner; `launch` is a DRY
  # print of exactly what it would rent; only `launch_confirm` rents instances. `collect` also reaps finished /
  # terminal / over-age hosts, so the GPU meter never runs on idle boxes.
  step1_fanout:
    if: ${{ github.event.inputs.task == 'step1_fanout' }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      VAST_API_KEY: ${{ secrets.VAST_API_KEY }}
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      # The credential a RENTED community host is given, forwarded in cleartext by _vast_onstart.
      # Scoped to the lane prefixes + six S3 actions a leg needs (s3_scoped_policy.py). Unset until
      # trimcrae creates the vast-leg-s3 user -> gpu_backend falls back to the broad key above, which
      # is why lanes in flight kept running. Runbook: research/compute/scoped-s3-credential-runbook.md
      VAST_S3_ACCESS_KEY_ID: ${{ secrets.VAST_S3_ACCESS_KEY_ID }}
      VAST_S3_SECRET_ACCESS_KEY: ${{ secrets.VAST_S3_SECRET_ACCESS_KEY }}
      VAST_S3_SCOPED_STS: ${{ vars.VAST_S3_SCOPED_STS }}
      AWS_DEFAULT_REGION: us-east-2
      VAST_CKPT_BUCKET: ${{ github.event.inputs.vast_ckpt_bucket }}
      GIT_BRANCH: ${{ github.ref_name }}
      VAST_GPU_MODEL: ${{ github.event.inputs.vast_gpu }}
      # WIDTH IS THE TRANCHE, because on Vast it is a self-imposed concurrency cap and not a provider quota,
      # and CLAUDE.md's litmus test — "is there a result this shard could return that would make me NOT run
      # the rest?" — answers NO for a congeneric map. Parallel costs the same GPU-dollars as serial, so a
      # width below the tranche buys nothing but wall-clock. Blast radius is controlled by FANOUT_ONLY (which
      # names the units to launch) and by FANOUT_CONFIRM, not by throttling the width.
      # ⚠ SO THE NUMBER IS NOT TYPED HERE ANY MORE (2026-07-27). It was `"19"` here, `"19"` in
      # step1-fanout-autoscale.yml and `8` as the code default, against a viable set of 18 — three homes,
      # none correct (CLAUDE.md rule 1). `congeneric_fanout_vast.fanout_width()` derives it from the map
      # and is its one home; the reasoning above is exactly why the derived default is the full map.
      # Which units to launch, by unit_id or ligand substring. THE SHAKEOUT LEVER: 0 of 19 units of this lane
      # has ever produced a ddG, so the reduce/commit/upload TERMINUS is unproven even though sampling is
      # proven. One named unit runs first; the remaining 18 go out together the moment it lands a ddG.
      # Blank = every pending unit, up to FANOUT_WIDTH.
      FANOUT_ONLY: ${{ github.event.inputs.vast_selector }}
      # Same input, its long-standing diag meaning — diag selects a unit, launch selects units to launch.
      DIAG_UNIT: ${{ github.event.inputs.vast_selector }}
      # Machines this lane refuses to re-rent live in S3 (`.../results/_excluded_machines.json`), written by
      # the monitor's starved-host guard and read at launch — deliberately NOT a workflow input, because an
      # exclusion learned by one CI run must bind the next one with no agent awake in between.
      PLAN: ${{ github.event.inputs.fanout_mode == 'plan' && '1' || '0' }}
      STAGE: ${{ github.event.inputs.fanout_mode == 'stage' && '1' || '0' }}
      PRECHECK: ${{ github.event.inputs.fanout_mode == 'precheck' && '1' || '0' }}
      LAUNCH: ${{ (github.event.inputs.fanout_mode == 'launch' || github.event.inputs.fanout_mode == 'launch_confirm') && '1' || '0' }}
      FANOUT_CONFIRM: ${{ github.event.inputs.fanout_mode == 'launch_confirm' && '1' || '0' }}
      COLLECT: ${{ github.event.inputs.fanout_mode == 'collect' && '1' || '0' }}
      MONITOR: ${{ github.event.inputs.fanout_mode == 'monitor' && '1' || '0' }}
      DIAG: ${{ github.event.inputs.fanout_mode == 'diag' && '1' || '0' }}
      # REAP = destroy a named host AND blacklist its machine for this lane, so `launch` cannot rent it back.
      # Distinct from `stop`, which destroys and says nothing about the machine. Requires both a selector and
      # a reason; the script refuses a blank either way.
      REAP: ${{ github.event.inputs.fanout_mode == 'reap' && '1' || '0' }}
      # BLOCK = stop launching a UNIT (no host can fix it), as opposed to REAP which condemns a HOST.
      # Applying the wrong one costs money in opposite directions: reaping for a unit-level defect rents a
      # fresh box to fail identically; blocking for a host-level defect abandons a good edge. Reuses the
      # existing selector/args inputs because workflow_dispatch caps at 25 and this file is at the cap.
      BLOCK: ${{ github.event.inputs.fanout_mode == 'block' && '1' || '0' }}
      BLOCK_UNIT: ${{ github.event.inputs.vast_selector }}
      BLOCK_REASON: ${{ github.event.inputs.ternary_extra_args }}
      # ★ THE UNBLOCK HALF, WHICH WAS DOCUMENTED AND NEVER WIRED (2026-07-29). `mode_block`'s docstring says
      # "UNBLOCKING IS DELIBERATE AND MANUAL (FANOUT_UNBLOCK=1)", and nothing in this workflow ever set that
      # variable — so a block could be applied from CI and never lifted from CI. Worse than merely missing:
      # dispatching `block` with the reason "unblock" (the obvious guess) would have re-BLOCKED the unit and
      # overwritten its carefully-evidenced reason with the word "unblock". `mode_block` now also refuses
      # that string outright, so the two guards cover each other.
      FANOUT_UNBLOCK: ${{ github.event.inputs.ternary_extra_args == 'unblock' && '1' || '0' }}
      BLOCK_EVIDENCE: ${{ github.event.inputs.cofold_output_prefix }}
      REAP_REASON: ${{ github.event.inputs.ternary_extra_args }}
      STOP: ${{ github.event.inputs.fanout_mode == 'stop' && '1' || '0' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install deps (rdkit only for the pose-staging mode)
        run: |
          pip install -q boto3
          if [ "${{ github.event.inputs.fanout_mode }}" = "stage" ]; then pip install -q rdkit; fi
      - name: Gate on the fan-out unit tests (a broken unit list must never reach a GPU)
        run: |
          # pyyaml because the suite parses workflow YAML to prove `reap` is wired into the launcher's
          # mode table. Without it the GATE fails on its own dependency instead of on what it guards.
          # numpy for the two `_apply_seed` tests added 2026-07-31, for exactly the same reason — the
          # sibling gate in step1-fanout-autoscale.yml had been recording `cost_model_red` on every tick
          # since, and this copy was one dispatch away from the same. Derived, not remembered:
          # `tests/test_gate_deps_cover_the_gated_tests.py` reads what the gated file imports.
          pip install -q pytest pyyaml numpy
          python -m pytest research/modalities/tests/test_congeneric_fanout.py -q
      - name: Step 1 fan-out — ${{ github.event.inputs.fanout_mode }}
        working-directory: research/modalities
        run: python congeneric_fanout_vast.py
      # A job log is only readable from its tail, and the tail is always runner boilerplate — so the readout
      # that matters is committed back to the branch instead. Also leaves a timestamped trail of the fleet.
      - name: Commit the progress / map readout back to the branch
        # `launch` and `launch_confirm` are here because the $/ns market guard writes
        # step1-fanout-market-hold.json on EVERY pass, and CLAUDE.md §6's first named failure mode is a
        # SILENT hold — 'a fleet that never launches looks identical to one that finished'. A hold that
        # exists only inside a runner is exactly that. The autoscale already commits it; a hand-dispatched
        # launch must too, or the one path a human drives is the one path with no record.
        if: ${{ always() && (github.event.inputs.fanout_mode == 'monitor' || github.event.inputs.fanout_mode == 'collect' || github.event.inputs.fanout_mode == 'diag' || github.event.inputs.fanout_mode == 'launch' || github.event.inputs.fanout_mode == 'launch_confirm') }}
        run: |
          set -e
          cd "$GITHUB_WORKSPACE"
          git config user.name "Claude"
          git config user.email "noreply@anthropic.com"
          # Add each file INDEPENDENTLY: `git add A B` fails atomically if either pathspec matches nothing, so
          # a monitor run (which writes progress.json but not map.json) staged nothing at all and reported
          # "no readout change" while silently swallowing the error.
          staged=0
          for f in step1-fanout-progress.json step1-fanout-map.json step1-fanout-diag.txt step1-fanout-market-hold.json relaunch-market-hold.json step1-fanout-launch-readout.txt step1-nan-forensics.json; do
            if [ -f "research/modalities/$f" ]; then
              git add -f "research/modalities/$f"; staged=1; echo "staged $f"
            else
              echo "absent (expected for this mode): $f"
            fi
          done
          [ "$staged" = 1 ] || { echo "nothing to commit"; exit 0; }
          git diff --cached --quiet && { echo "no readout change"; exit 0; }
          git commit -m "step1 fan-out ${{ github.event.inputs.fanout_mode }} readout ($(date -u +%FT%TZ))"
          for i in 1 2 3 4; do
            git pull --rebase origin "${{ github.ref_name }}" && \
            git push origin HEAD:"${{ github.ref_name }}" && exit 0
            sleep $((2**i))
          done
          echo "::warning::could not push the readout"
      - name: Upload fan-out artifacts
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: step1-fanout-${{ github.event.inputs.fanout_mode }}
          path: |
            research/modalities/step1-fanout-handles.json
            research/modalities/step1-fanout-map.json
            research/modalities/step1-fanout-progress.json
          if-no-files-found: ignore

  run:
    if: ${{ github.event.inputs.task == 'fusion' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: IDR / LLPS sequence-feature analysis (UniProt)
        working-directory: research/modalities
        run: python fusion_idr_features.py || echo "idr-features failed (continuing)"

      - name: Junction-spanning siRNA design (NCBI)
        working-directory: research/modalities
        run: python junction_sirna.py || echo "sirna design failed (continuing)"

      - name: EMC cell-line data probe (Europe PMC IHC markers + GEO/SRA deposited data)
        working-directory: research/modalities
        run: python emc_line_data_probe.py || echo "emc-line-data-probe failed (continuing)"

      - name: GSE4303 cross-check (surrogate surfaceome shortlist vs real EMC tumour expression)
        working-directory: research/modalities
        run: python emc_gse4303_crosscheck.py || echo "gse4303 cross-check failed (continuing)"

      - name: Surface-antigen normal-tissue therapeutic-window (HPA)
        working-directory: research/modalities
        run: python emc_surface_normal_window.py || echo "normal-window failed (continuing)"

      - name: Layer-1 VHL panel dossier (RCSB + Europe PMC; ternary-coop calibration)
        working-directory: research/modalities
        run: python layer1_vhl_fetch.py || echo "layer1-vhl-fetch failed (continuing)"

      - name: SMARCA2 SI-PDF IC50/cooperativity table extraction (pdfplumber)
        working-directory: research/modalities
        run: |
          pip install pdfplumber >/dev/null 2>&1 || echo "pdfplumber install failed"
          python extract_smarca2_ic50.py || echo "ic50-extract failed (continuing)"

      - name: Safe-2025 NR4A3-selective series primary-source verification (Europe PMC)
        working-directory: research/modalities
        run: python safe2025_verify.py || echo "safe2025-verify failed (continuing)"

      - name: Zaienne-2022 anchor paralogue-counter-screen check (Europe PMC)
        working-directory: research/modalities
        run: python zaienne_selectivity_verify.py || echo "zaienne-selectivity-verify failed (continuing)"

      - name: Publish results to modalities-cache branch
        if: always()
        run: |
          set -e
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          mkdir -p "$RUNNER_TEMP/res"
          cp research/modalities/fusion-idr-features.json "$RUNNER_TEMP/res/" 2>/dev/null || true
          cp research/modalities/junction-sirna-designs.json "$RUNNER_TEMP/res/" 2>/dev/null || true
          cp research/modalities/emc-line-data-probe.json "$RUNNER_TEMP/res/" 2>/dev/null || true
          cp research/modalities/emc-gse4303-crosscheck.json "$RUNNER_TEMP/res/" 2>/dev/null || true
          cp research/modalities/emc-surface-normal-window.json "$RUNNER_TEMP/res/" 2>/dev/null || true
          cp research/modalities/layer1-vhl-dossier.json "$RUNNER_TEMP/res/" 2>/dev/null || true
          cp research/modalities/smarca2-ic50-extract.json "$RUNNER_TEMP/res/" 2>/dev/null || true
          cp research/modalities/safe2025-verify.json "$RUNNER_TEMP/res/" 2>/dev/null || true
          cp research/modalities/zaienne-selectivity-verify.json "$RUNNER_TEMP/res/" 2>/dev/null || true
          git fetch origin modalities-cache || true
          rm -f research/modalities/*.json research/modalities/*.png
          if git show-ref --verify --quiet refs/remotes/origin/modalities-cache; then
            git checkout -B modalities-cache origin/modalities-cache
          else
            git checkout --orphan modalities-cache
            git rm -rf . >/dev/null 2>&1 || true
          fi
          mkdir -p research/modalities
          cp "$RUNNER_TEMP"/res/*.json research/modalities/ 2>/dev/null || true
          git add research/modalities/fusion-idr-features.json 2>/dev/null || true
          git add research/modalities/junction-sirna-designs.json 2>/dev/null || true
          git add research/modalities/emc-line-data-probe.json 2>/dev/null || true
          git add research/modalities/emc-gse4303-crosscheck.json 2>/dev/null || true
          git add research/modalities/emc-surface-normal-window.json 2>/dev/null || true
          git add research/modalities/layer1-vhl-dossier.json 2>/dev/null || true
          git add research/modalities/smarca2-ic50-extract.json 2>/dev/null || true
          git add research/modalities/safe2025-verify.json 2>/dev/null || true
          git add research/modalities/zaienne-selectivity-verify.json 2>/dev/null || true
          git commit -m "Fusion CPU extras: IDR/LLPS features + junction siRNA + EMC-line data probe + Layer-1 VHL dossier + Safe-2025 verify" || { echo "no changes"; exit 0; }
          git push origin modalities-cache

  # ---- NR4A3 BioEmu cryptic-pocket cross-check (method-watch trigger, BioEmu v1.4.0) --------------------------
  # Folded here so it dispatches off a feature branch (ref=<branch>) without a new on-main workflow file. Bakes
  # the bioemu Vast image, runs the sample->sidechain->renumber->fpocket chain on one Vast host, collects the
  # result. See research/modalities/nr4a3_bioemu_vast_launch.py + Dockerfile.bioemu.
  bioemu_bake:
    if: ${{ github.event.inputs.task == 'bioemu_bake' }}
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      DOCKERHUB_USER: triskit23
    steps:
      - uses: actions/checkout@v4
      - name: Reclaim runner disk (the CUDA + torch image is multi-GB)
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/lib/android "$AGENT_TOOLSDIRECTORY" || true
          df -h /
      - name: Log in to Docker Hub
        run: echo "${{ secrets.DOCKERHUB_TOKEN }}" | docker login -u "$DOCKERHUB_USER" --password-stdin
      - name: Build + push the BioEmu Vast image
        run: |
          set -eo pipefail
          IMG="docker.io/${DOCKERHUB_USER}/bioemu:latest"
          docker build -f research/compute/Dockerfile.bioemu -t "$IMG" research/compute/
          docker push "$IMG"
          echo "PUSHED $IMG — ensure the Docker Hub repo is PUBLIC so Vast pulls it unauthenticated."

  bioemu_run:
    if: ${{ github.event.inputs.task == 'bioemu_run' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      VAST_API_KEY: ${{ secrets.VAST_API_KEY }}
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      # The credential a RENTED community host is given, forwarded in cleartext by _vast_onstart.
      # Scoped to the lane prefixes + six S3 actions a leg needs (s3_scoped_policy.py). Unset until
      # trimcrae creates the vast-leg-s3 user -> gpu_backend falls back to the broad key above, which
      # is why lanes in flight kept running. Runbook: research/compute/scoped-s3-credential-runbook.md
      VAST_S3_ACCESS_KEY_ID: ${{ secrets.VAST_S3_ACCESS_KEY_ID }}
      VAST_S3_SECRET_ACCESS_KEY: ${{ secrets.VAST_S3_SECRET_ACCESS_KEY }}
      VAST_S3_SCOPED_STS: ${{ vars.VAST_S3_SCOPED_STS }}
      AWS_DEFAULT_REGION: us-east-2
      GIT_BRANCH: ${{ github.ref_name }}
      VAST_IMAGE: ${{ github.event.inputs.vast_image }}
      VAST_CKPT_BUCKET: ${{ github.event.inputs.vast_ckpt_bucket }}
      # md_mode: run => real 254-residue NR4A3 LBD; smoke => chignolin plumbing test
      BIOEMU_MODE: ${{ github.event.inputs.md_mode == 'run' && 'real' || 'smoke' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Submit the Vast instance
        run: |
          set -eo pipefail
          python -m pip install -q awscli || true
          ARGS="--mode $BIOEMU_MODE"
          [ -n "${{ github.event.inputs.bioemu_num_samples }}" ] && ARGS="$ARGS --num-samples ${{ github.event.inputs.bioemu_num_samples }}"
          [ -n "${{ github.event.inputs.bioemu_batch }}" ] && ARGS="$ARGS --batch-size-100 ${{ github.event.inputs.bioemu_batch }}"
          echo "launching: nr4a3_bioemu_vast_launch.py $ARGS"
          python research/modalities/nr4a3_bioemu_vast_launch.py $ARGS
          echo "Instance submitted. Poll via task=bioemu_collect (reads S3 phase.txt + result JSON)."

  bioemu_collect:
    if: ${{ github.event.inputs.task == 'bioemu_collect' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      # The credential a RENTED community host is given, forwarded in cleartext by _vast_onstart.
      # Scoped to the lane prefixes + six S3 actions a leg needs (s3_scoped_policy.py). Unset until
      # trimcrae creates the vast-leg-s3 user -> gpu_backend falls back to the broad key above, which
      # is why lanes in flight kept running. Runbook: research/compute/scoped-s3-credential-runbook.md
      VAST_S3_ACCESS_KEY_ID: ${{ secrets.VAST_S3_ACCESS_KEY_ID }}
      VAST_S3_SECRET_ACCESS_KEY: ${{ secrets.VAST_S3_SECRET_ACCESS_KEY }}
      VAST_S3_SCOPED_STS: ${{ vars.VAST_S3_SCOPED_STS }}
      AWS_DEFAULT_REGION: us-east-2
      BUCKET: ${{ github.event.inputs.vast_ckpt_bucket }}
      VAST_API_KEY: ${{ secrets.VAST_API_KEY }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
      - name: Pull the result JSON (+ phase log) from S3 and commit it to the branch
        run: |
          set -eo pipefail
          python3 -m pip install -q awscli >/dev/null 2>&1 || true
          B="${BUCKET:-sagemaker-us-east-2-646605541856}"
          # Smoke lands under .../nr4a3-bioemu-smoke, the real run under .../nr4a3-bioemu-crosscheck. Print both.
          for NAME in nr4a3-bioemu-smoke nr4a3-bioemu-crosscheck; do
            SP="s3://${B}/nr4a3-bioemu-crosscheck/${NAME}"
            echo "=== ${NAME} phase.txt ==="; aws s3 cp "$SP/phase.txt" - 2>/dev/null || echo "(none yet)"
            aws s3 cp "$SP/bioemu-crosscheck.json" - 2>/dev/null | python3 -c "import sys,json;d=json.load(sys.stdin);print('  detection:',d.get('harmonized_detection'))" 2>/dev/null || true
          done
          PREFIX="s3://${B}/nr4a3-bioemu-crosscheck/nr4a3-bioemu-crosscheck"
          if aws s3 cp "$PREFIX/bioemu-crosscheck.json" research/modalities/nr4a3-bioemu-crosscheck.json 2>/dev/null; then
            echo "=== result ==="; cat research/modalities/nr4a3-bioemu-crosscheck.json
            echo "1" > /tmp/have_result
            git config user.name "Claude"; git config user.email "noreply@anthropic.com"
            # git add FIRST, then check the STAGED diff — `git diff --quiet <path>` ignores untracked (new) files,
            # so a brand-new result would read as "no change" and never commit (the bug that dropped the first run).
            git add research/modalities/nr4a3-bioemu-crosscheck.json
            if ! git diff --cached --quiet -- research/modalities/nr4a3-bioemu-crosscheck.json; then
              git commit -m "bioemu: capture NR4A3 cryptic-pocket cross-check result from Vast run"
              git push origin HEAD:${{ github.ref_name }}
            else
              echo "no change to commit"
            fi
          else
            echo "::warning::no result JSON yet — the run may still be sampling. Re-run bioemu_collect later."
          fi
      - name: Reap the crosscheck Vast instance once its result is captured (control-plane teardown)
        if: ${{ always() }}
        run: |
          set -eo pipefail
          [ -f /tmp/have_result ] || { echo "no result captured yet -> leave the instance running"; exit 0; }
          python - <<'PY'
          import os, sys
          sys.path.insert(0, "research/modalities")
          from gpu_backend import _vast_request
          key = os.environ.get("VAST_API_KEY")
          if not key:
              print("no VAST_API_KEY -> cannot reap; run task=bioemu_stop bioemu_kill=crosscheck"); sys.exit(0)
          insts = _vast_request("GET", "/instances/", key).get("instances", [])
          for it in insts:
              if (it.get("label") or "") == "nr4a3-bioemu-crosscheck":
                  iid = it.get("id")
                  print(f"reaping crosscheck instance {iid} (result captured; the host-self-stop only kills PID1, "
                        f"so Vast would restart it into a re-sample loop without this control-plane DELETE)")
                  try:
                      _vast_request("DELETE", f"/instances/{iid}/", key); print(f"  DESTROYED {iid}")
                  except Exception as e:  # noqa: BLE001
                      print(f"  destroy failed: {e}")
          print("reap done")
          PY

  # bioemu_status: LIST nr4a3-bioemu* Vast instances (id/label/status/uptime/cost) — diagnosis only, NO destroy.
  # bioemu_stop  : DESTROY nr4a3-bioemu* instances (anti-idle backstop; only run once the real result is in S3).
  bioemu_status:
    if: ${{ github.event.inputs.task == 'bioemu_status' || github.event.inputs.task == 'bioemu_stop' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      VAST_API_KEY: ${{ secrets.VAST_API_KEY }}
      DESTROY: ${{ github.event.inputs.task == 'bioemu_stop' && '1' || '0' }}
      KILL: ${{ github.event.inputs.bioemu_kill }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: List (and optionally destroy) nr4a3-bioemu Vast instances
        run: |
          set -eo pipefail
          python - <<'PY'
          import os, sys
          sys.path.insert(0, "research/modalities")
          from gpu_backend import _vast_request
          key = os.environ["VAST_API_KEY"]
          destroy = os.environ.get("DESTROY") == "1"
          kill = (os.environ.get("KILL") or "all").strip()
          insts = _vast_request("GET", "/instances/", key).get("instances", [])
          mine = [it for it in insts if (it.get("label") or "").startswith("nr4a3-bioemu")]
          print(f"{len(mine)} nr4a3-bioemu instance(s) (destroy={destroy}, kill_selector={kill!r}):")
          for it in mine:
              label, iid = (it.get("label") or ""), str(it.get("id"))
              print(f"  id={iid} label={label} actual={it.get('actual_status')} "
                    f"intended={it.get('intended_status')} dph={it.get('dph_total')} "
                    f"gpu={it.get('gpu_name')} status_msg={(it.get('status_msg') or '')[:60]!r}")
              # target = all, OR label contains the selector substring, OR exact instance id
              targeted = kill == "all" or kill in label or kill == iid
              if destroy and targeted:
                  try:
                      _vast_request("DELETE", f"/instances/{iid}/", key)
                      print(f"    -> DESTROYED {iid}")
                  except Exception as e:  # noqa: BLE001
                      print(f"    -> destroy failed: {e}")
              elif destroy:
                  print(f"    -> skipped (selector {kill!r} does not match)")
          print("done")
          PY

  e3_vhl_recheck:
    # $0 re-check of the VHL arm's staging structure. The E3 downselect scored VHL on 9GIO; the structural
    # record describes 9GIO as carrying a covalent compound bound to Cys77 of VHL rather than a
    # hydroxyproline-pocket handle. Those readings cannot both be right, and the difference decides whether the
    # ligandability/exit-vector numbers describe the pocket a VHL degrader linker would actually leave from.
    # 5T35 (MZ1) is the positive control and is the structure the reported basin result actually consumed.
    if: ${{ github.event.inputs.task == 'e3_vhl_recheck' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Re-check 9GIO's ligand site (RCSB, pure stdlib)
        working-directory: research/modalities
        run: python e3_vhl_ligand_recheck.py
      - name: Commit the result back to the triggering branch
        run: |
          set -e
          # PUBLISH_FAIL_HARD=1 preserves this step's `exit 1` on an unpublished result.
          # ⛔ ONE HOME FOR THE PUBLISH. `git pull --rebase` wedges on a conflict — the repo is left
          # mid-rebase, every retry dies on the first one's wreckage, and the step ends GREEN having
          # published nothing (measured on three lanes; see research/compute/publish_artifacts.sh).
          # PUBLISH_IF_CHANGED=1 keeps this step's EVENT semantics: it records a result, not a
          # heartbeat, so a run that produced nothing new must not commit as though it had.
          PUBLISH_IF_CHANGED=1 PUBLISH_FAIL_HARD=1 bash research/compute/publish_artifacts.sh "${{ github.ref_name }}" \
            "E3 VHL arm re-check: what 9GIO's ligand actually contacts (auto)" \
            research/modalities/e3-vhl-ligand-recheck.json

  s1f_liveness:
    # STEP 1 LIVENESS SHAKEOUT ($0 — no GPU, no Vast rental, a SCRATCH S3 prefix).
    #
    # CLAUDE.md §6's sequence, run in order in one job because each stage is the input to the next:
    #   smoke   — the real `_PREAMBLE` with only its network lines stubbed. Polls run.log's LastModified from
    #             OUTSIDE the container while the pipeline sits in a phase that emits nothing, which is the
    #             false-positive question: if the heartbeat stopped there the guard would destroy a healthy
    #             leg, a self-inflicted copy of the incident it exists to prevent.
    #   leg     — the real ONSTART composition (brake -> ct_selfstop EXIT trap -> command), three times, so
    #             the `attempts/` archive is measured as a real container-start counter and the crash-loop
    #             brake is measured tripping on the third start rather than on a resume.
    #   verdict — the real evidence through the lane's own helpers into `vast_idle_guard.classify_idle`,
    #             BOTH directions. A guard that only ever spares is a guard that measures nothing.
    #
    # ⚠ IT MUST NEVER TOUCH A LIVE UNIT. The pipeline's first act is `mark boot`, a PUT to
    # $RESULT_S3/phase.txt; aimed at the production prefix that overwrites a running unit's phase marker.
    # `step1_liveness_smoke._guard_the_prefix` refuses to run if SMOKE_PREFIX sits inside the production
    # namespace, before anything is written.
    if: ${{ github.event.inputs.task == 's1f_liveness' }}
    runs-on: ubuntu-latest
    timeout-minutes: 40
    permissions:
      contents: write
    env:
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      AWS_DEFAULT_REGION: us-east-2
      VAST_CKPT_BUCKET: ${{ github.event.inputs.vast_ckpt_bucket }}
      SMOKE_SYNC_S: "5"
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Docker Hub login (anonymous pulls share the runner IP and get rate-limited)
        run: echo "${{ secrets.DOCKERHUB_TOKEN }}" | docker login -u triskit23 --password-stdin
      - name: Unit tests — the heartbeat's timing, its three termination nets, the EXIT-trap topology
        run: |
          python -m pip install -q pytest boto3 rdkit
          python -m pytest research/modalities/tests/test_step1_liveness.py -q
      # ⚠ INSIDE THE PARITY IMAGE, AND THIS IS NOT A STYLE CHOICE. The first version of this job ran the
      # stages on the bare runner, reasoning that "a bash loop plus `aws s3 cp`" needs no image. It came back
      # rc=127 with nothing in S3: `_PREAMBLE` hard-codes `/opt/mamba/envs/rbfe/bin/{python,aws}` and runs
      # under `set -eo pipefail`, so on a host without them the script dies on its first command and the
      # shakeout measures nothing while reporting a completed run. The shakeout caught it, which is the
      # entire argument for having one.
      - name: Shakeout — smoke, then one real onstart, then the guard's verdict (parity image)
        run: |
          set -eo pipefail
          IMG="${S1F_LIVENESS_IMAGE:-triskit23/nr4a3fep}"
          for stage in smoke leg verdict; do
            echo "::group::STAGE $stage"
            docker run --rm --entrypoint python \
              -v "$PWD/research/modalities:/work/research/modalities" \
              -w /work/research/modalities \
              -e AWS_ACCESS_KEY_ID -e AWS_SECRET_ACCESS_KEY -e AWS_DEFAULT_REGION \
              -e VAST_CKPT_BUCKET -e SMOKE_SYNC_S -e SMOKE_STAGE="$stage" \
              "docker.io/$IMG:latest" step1_liveness_smoke.py
            echo "::endgroup::"
          done
      - name: Commit the shakeout record back to the triggering branch
        if: ${{ always() }}
        run: |
          # ⛔ ONE HOME FOR THE PUBLISH (2026-08-01). This hand-rolled `git pull --rebase` + retry, the shape
          # that silently failed to publish on three lanes: a conflict leaves the repo mid-rebase, every retry
          # dies on it, and the step ended on a `::warning::` while reporting SUCCESS. The `[ -f … ] || exit 0`
          # guard is not lost — the primitive skips paths that do not exist and says so.
          BR="${{ github.ref_name }}"
          bash research/compute/publish_artifacts.sh "$BR" \
            "step1 liveness shakeout record (auto)" \
            research/modalities/step1-liveness-shakeout.json
  map_diag:
    # WHY DID A STEP 1 LEG ABORT rc=1? — the atom-map matrix on the PRODUCTION staged components ($0, CPU).
    #
    # Distinct from `map_audit`, and the difference is the whole point. `map_audit maps` builds a FRESH ETKDG
    # conformer per endpoint and its own docstring disclaims the result ("treat every step 1 row as A PROPERTY
    # OF THIS HARNESS until it is re-run through `_build_components` on the staged SDFs"). This job runs
    # `nr4a3_rbfe._build_components` against the SAME staged, docked, common-frame tree the rented host
    # downloads, so a row is a statement about the leg that actually failed rather than about a harness.
    #
    # It measures {element_change} x {LOMAP budget} with wall times, which is the ONE observation that
    # separates a timed-out MCS (both settings move together, budget burned) from an element-change asymmetry
    # (settings separate, both instant). Those two need OPPOSITE fixes, so guessing is not an option.
    #
