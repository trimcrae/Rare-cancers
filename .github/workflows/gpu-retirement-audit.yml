name: GPU credential retirement audit
on:
  push:
    branches: [security/gpu-retirement-20260911]
permissions:
  contents: read
  id-token: write
jobs:
  retire:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Revoke Vast keys
        continue-on-error: true
        env:
          VAST_API_KEY: ${{ secrets.VAST_API_KEY }}
        run: |
          python - <<'PY'
          import os,json,urllib.request,urllib.error
          key=os.environ['VAST_API_KEY']
          def request(method,path):
              r=urllib.request.Request('https://console.vast.ai'+path,method=method,headers={'Authorization':'Bearer '+key,'Accept':'application/json'})
              return json.load(urllib.request.urlopen(r,timeout=25))
          try: rows=request('GET','/api/v0/auth/apikeys/')['apikeys']
          except urllib.error.HTTPError as e:
              print('VERIFY previous_credential_http_status',e.code)
              raise SystemExit(0)
          rows.sort(key=lambda r:r.get('key')==key)
          for r in rows:
              try:
                  result=request('DELETE','/api/v0/auth/apikeys/'+str(r['id'])+'/')
                  print('RETIRE',json.dumps({'key_id':r['id'],'http_success':True,'response_type':type(result).__name__}),flush=True)
              except urllib.error.HTTPError as e: print('RETIRE',json.dumps({'key_id':r['id'],'http_status':e.code}),flush=True)
          try:
              left=request('GET','/api/v0/auth/apikeys/')['apikeys']
              print('VERIFY remaining_key_ids',json.dumps([r['id'] for r in left]))
          except urllib.error.HTTPError as e: print('VERIFY previous_credential_http_status',e.code)
          PY
      - name: Auth existing Google Cloud workload identity
        id: gcp
        continue-on-error: true
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: projects/878095411563/locations/global/workloadIdentityPools/github-pool/providers/github-provider
          service_account: gpu-runner@project-a7ebde30-e2ed-4b8d-9a9.iam.gserviceaccount.com
      - if: steps.gcp.outcome == 'success'
        uses: google-github-actions/setup-gcloud@v2
      - name: Check storage and disable retired GPU service account
        if: steps.gcp.outcome == 'success'
        run: |
          gcloud storage buckets list --project=project-a7ebde30-e2ed-4b8d-9a9 --format='json(name)' --quiet || true
          gcloud storage du --summarize gs://project-a7ebde30-e2ed-4b8d-9a9-rbfe-ckpt --quiet || true
          gcloud iam service-accounts disable gpu-runner@project-a7ebde30-e2ed-4b8d-9a9.iam.gserviceaccount.com --project=project-a7ebde30-e2ed-4b8d-9a9 --quiet || true
