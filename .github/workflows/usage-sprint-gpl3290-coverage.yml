name: GPL3290 annotation and reference audit
on:
  push:
    branches:
      - codex/usage-sprint-2026-10-01-gpl3290-coverage
    paths:
      - .github/workflows/usage-sprint-gpl3290-coverage.yml
      - research/autonomy/usage-sprint-2026-10-01/gpl3290-coverage/acquire.py
      - research/autonomy/usage-sprint-2026-10-01/gpl3290-coverage/test_acquire.py
      - research/autonomy/usage-sprint-2026-10-01/gpl3290-coverage/evidence.json
permissions:
  contents: read
concurrency:
  group: usage-sprint-gpl3290-coverage-${{ github.ref }}
  cancel-in-progress: false
jobs:
  source-evidence:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Record exact revision
        run: |
          git rev-parse HEAD
          python3 --version
      - name: Synthetic source-cohort and channel tests
        run: python3 research/autonomy/usage-sprint-2026-10-01/gpl3290-coverage/test_acquire.py -v
      - name: One bounded official-source cycle
        if: ${{ hashFiles('research/autonomy/usage-sprint-2026-10-01/gpl3290-coverage/evidence.json') == '' }}
        timeout-minutes: 4
        run: python3 research/autonomy/usage-sprint-2026-10-01/gpl3290-coverage/acquire.py --acquire --output .cache/gpl3290-coverage/evidence.json
      - name: Validate committed or newly acquired evidence offline
        run: |
          EVIDENCE_PATH=research/autonomy/usage-sprint-2026-10-01/gpl3290-coverage/evidence.json
          if [ ! -f "$EVIDENCE_PATH" ]; then
            EVIDENCE_PATH=.cache/gpl3290-coverage/evidence.json
          fi
          python3 research/autonomy/usage-sprint-2026-10-01/gpl3290-coverage/acquire.py --check "$EVIDENCE_PATH"
      - name: Retain finite source artifact
        if: ${{ always() && hashFiles('research/autonomy/usage-sprint-2026-10-01/gpl3290-coverage/evidence.json') == '' }}
        uses: actions/upload-artifact@v4
        with:
          name: gpl3290-coverage-${{ github.sha }}
          path: .cache/gpl3290-coverage/
          retention-days: 30
          if-no-files-found: ignore
      - name: Install normal preflight dependencies
        timeout-minutes: 5
        run: >-
          python3 -m pip install
          uv pytest pytest-xdist numpy scipy pymbar rdkit pyyaml boto3 jsonschema biopython
          pdfminer.six pypdf pdfplumber matplotlib netCDF4 cffi
      - name: Normal preflight (default fast scope)
        timeout-minutes: 10
        run: ./scripts/preflight.sh
      - name: Tracked source files unchanged by checks
        if: ${{ !cancelled() }}
        run: |
          git status --short
          git diff --exit-code
