name: Ternary leg watchdog (session-independent)

# WHY THIS EXISTS. Monitoring a multi-hour ternary GPU leg used to be a background poller inside an agent
# session. That construction dies with the session, and on 2026-07-25 it did so twice — once silently, hanging
# ~31 minutes on an unbounded curl while reporting nothing. A leg that is preempted while unwatched is not
# noticed and nothing resumes it, so the wall clock is simply lost.
#
# This moves the watch OUT of any session. It runs on GitHub's cron, reads its watch list from
# research/modalities/ternary-watch.json, and asks GCS three questions per entry:
#
#   result JSON present  -> DONE      (nothing to do; disable the entry)
#   a gcp-ternary VM up  -> RUNNING   (emit progress)
#   neither              -> DIED      (re-dispatch; the leg RESUMES from its last committed checkpoint)
#
# All state is in the repo and in GCS, so this survives container restarts and needs no agent awake. Every
# outcome is an annotation, readable from the check-runs API without opening a log.
#
# SAFETY. A per-day relaunch counter in GCS caps runaway re-dispatch (max_relaunches_per_day per entry), and the
# workflow is a no-op on an empty or all-disabled list. It only ever dispatches gpu-ternary-fep-gcp.yml mode=run
# with the exact parameters recorded in the watch file — it invents nothing.
#
# NB a `schedule:` trigger only fires from the DEFAULT BRANCH, so this must be on main to run at all.

on:
  schedule:
    - cron: "26 * * * *"      # */15 is the REQUEST. IT IS NOT WHAT YOU GET, and the difference matters:
                                # measured 2026-07-26, GitHub ran this repo's crons at ~2-4 h intervals, not 15
                                # min (this workflow: 9:17 PM then nothing for 3h40m). NOT a fault in this file
                                # -- state=active, it parses, manual dispatch works, and the repo was nearly
                                # idle (2 runs/h) so load does not explain it. The proof it is repo-wide is
                                # vast-price-sample.yml, an unrelated cron, showing the same pattern in the same
                                # window: 7:15 PM -> 9:01 PM (106 min) -> 12:46 AM (225 min).
                                #
                                # CONSEQUENCE: the UNATTENDED detect-and-relaunch latency is hours, not minutes,
                                # and no cron expression changes that. Tolerable while the leg is ON-DEMAND
                                # (20 h max-run, nothing to be preempted from). It would NOT be tolerable for a
                                # spot leg, where a preemption sitting unnoticed for 3 h is 3 h of lost wall
                                # clock -- so if a spot leg is ever put back under this watchdog, it needs a
                                # non-cron trigger, not a tighter cron.
  workflow_dispatch:
    inputs:
      dry_run:
        description: "1 = report what it WOULD do without dispatching or incrementing the counter"
        default: "0"
        required: false

permissions:
  id-token: write        # GCP WIF
  contents: write        # to commit the reap: a landed unit's watch entry is disabled ON main, because this
                         # workflow takes no `ref` and always runs main's copy of ternary-watch.json, so a
                         # disable that is not committed does not survive to the next pass. Scope in practice
                         # is one file — gcp_watch_reap.py can only move `enabled: true -> false`.
  actions: write         # to re-dispatch gpu-ternary-fep-gcp.yml

concurrency:
  group: ternary-leg-watchdog
  cancel-in-progress: false

jobs:
  watch:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Auth to GCP (WIF)
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: projects/878095411563/locations/global/workloadIdentityPools/github-pool/providers/github-provider
          service_account: gpu-runner@project-a7ebde30-e2ed-4b8d-9a9.iam.gserviceaccount.com
      - uses: google-github-actions/setup-gcloud@v2

      - name: Watch each enabled leg
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DRY: ${{ github.event.inputs.dry_run || '0' }}
        # DECLARE THE SHELL EXPLICITLY. GitHub's default is `bash -e {0}`, and `set -uo pipefail` in the body
        # does NOT clear an -e that arrived on the invocation — so the "NOT -e" comment that used to sit below
        # asserted a property this step did not have. It cost a run: on a leg with no commits yet, the progress
        # census's `MAXW=$(... | grep ... | tail -1)` assignment takes the failing pipeline's status (grep found
        # nothing, pipefail propagated it), and -e killed the watch entry between printing its header and
        # printing any verdict — 24 s, no output, exit 1. Exactly the silent-skip this workflow exists to
        # remove, reintroduced by a comment that was wrong. Setting the options here makes the invocation match
        # the intent. Reproduced and locked in by tests/test_watchdog_census.sh.
        shell: bash --noprofile --norc -uo pipefail {0}
        run: |
          # The body lives in research/modalities/watchdog_run.sh — see the long note at its top. Inline, it
          # outgrew GitHub's 21,000-character `run:` template cap (23,453) and the workflow stopped parsing,
          # which silently disables the cron.
          export WATCH_REF="${{ github.ref_name }}"
          bash research/modalities/watchdog_run.sh
