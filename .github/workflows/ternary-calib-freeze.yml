name: Ternary calib pair freeze (RCSB + RDKit, CPU, free)

# valB_mini prerequisite: fetch the bound-PROTAC chemistry for the SMARCA2–VHL hi/lo calibration anchors
# (P1/9HYN, P5/9HYP) from RCSB, RDKit-validate, and MCS-map them to decide whether P1→P5 is a mappable
# congeneric RBFE edge (or fall back per ternary-calib-pair-draft.md). Free CPU; the dev sandbox can't reach
# RCSB (egress proxy), so it runs on a GitHub runner. Prints the full freeze JSON to the log AND publishes it
# to the modalities-cache branch for durable provenance. No structure is fabricated.
#
# NEW workflow → not API-dispatchable from a feature branch (404), so it runs on PUSH to the branch. The paths
# filter is the workflow + the freeze script only, so the committed output never re-triggers it.

on:
  workflow_dispatch:
    inputs:
      run_search:
        description: "also run the (slow) RCSB congeneric search + alpha fetch"
        default: "false"
        required: false
      mode:
        description: "freeze (default) | triangle (the $0 valB closure-triangle chemistry pre-gate)"
        default: "freeze"
        required: false
  push:
    branches: [claude/rung-2-parallel-7asnpk]
    paths:
      - .github/workflows/ternary-calib-freeze.yml
      - research/modalities/ternary_calib_freeze.py
      - research/modalities/ternary_calib_search.py
      - research/modalities/ternary_calib_alpha_fetch.py
      - research/modalities/ternary_calib_epimer_freeze.py
      - research/modalities/wurz_calib_freeze.py

permissions:
  contents: write

concurrency:
  group: ternary-calib-freeze-${{ github.event.inputs.mode || 'freeze' }}-${{ github.ref_name }}
  cancel-in-progress: true

jobs:
  # -----------------------------------------------------------------------------------------------------
  # LANE 9 ($0): the closure-triangle chemistry PRE-GATE. Runs the PRODUCTION mapper (LOMAP via
  # nr4a3_rbfe._mapping) inside the pre-baked triskit23/ternary-fep image -- per CLAUDE.md never solve a conda
  # env in CI, and here version parity with the producing env is the scientific argument, not just speed.
  # -----------------------------------------------------------------------------------------------------
  triangle:
    if: ${{ github.event.inputs.mode == 'triangle' }}
    runs-on: ubuntu-latest
    # ⛔ 90 MINUTES IS NOT ENOUGH, AND THE ARITHMETIC THAT SAID IT WAS IS OFF BY AN ORDER OF MAGNITUDE.
    # ⚠ Superseded, retained: *"90 min, not 45: the gate evaluates 17 distinct edges and each can spend up
    # to 2 x LOMAP(time=20) + rdFMCS(timeout=60). Those budgets are deliberate (LOMAP settings must match
    # production), so the wall clock is bounded by them, not by a stall."* That reasoning predicted ~28 min
    # for ALL 17 edges. MEASURED on run 31017061570 (2026-08-05), which was CANCELLED at the timeout with
    # no report written — per-edge wall clock, from the step's own log lines:
    #
    #     cmpd1->cmpd4        28.6 min  (element_change=True)  +  6.7 min (element_change=False)
    #     cmpd4->cmpd4prime   22.4 min                         +  4.9 min
    #     cmpd1->cmpd4prime    1.4 min                         +  2.4 min
    #     ------------------------------------------------------------------
    #     THREE edges: 66 min. Then 22 min more on the fourth before the job was killed.
    #
    # The `time=20` in that comment is not the budget actually in force — the production mapper runs at
    # RBFE_LOMAP_TIME_S=300 (5 min) PER CALL, two calls per edge, and real calls overshoot even that
    # because LOMAP's timeout bounds its MCS search, not the whole mapping. So the bound is ~10 min/edge
    # at minimum and observed up to ~35, which is 3-10 HOURS for 17 edges, not 28 minutes.
    #
    # ⛔ AND THAT RUN SHOULD NOT HAVE BEEN LAUNCHED AT ALL. `mode=triangle` is the PRE-gate for the valB
    # closure triangle — a "should we buy these edges?" check. LANE 9/20 CLOSED on 2026-07-30 with all
    # four legs landed and `R` computed (valb-triangle-reduction.json); the roadmap carries that row
    # struck through, and the triangle was separately REFUTED as a diagnostic (V5). The edges this gate
    # would grade were bought and run. It was dispatched on 2026-08-05 to fill a baselined broken link
    # WITHOUT first checking whether the decision it informs was still open. It was not.
    #
    # ⚠ SUPERSEDED, RETAINED — the analysis written here on the strength of that run: *"the real question
    # is not what timeout, it is where this runs … a lane whose correctness fix makes it less completable
    # on its current runner has outgrown that runner."* True arithmetic, wrong subject. There is no lane
    # here to re-home; planning a venue for retired work is worse than leaving the number unexplained,
    # because it reads as a live work item to whoever finds it next.
    #
    # ✅ WHAT THE MODE IS STILL FOR: a FUTURE triangle design, if one is ever proposed. It would need its
    # own edges and its own pre-gate; nothing about the 2026-07-25 design carries over. Whoever does that
    # should budget from the measurement above (~5-29 min/edge) rather than from the 90 below, which is
    # left as-is precisely because no run is pending against it.
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - name: Docker Hub login (raises the anonymous pull ceiling on shared runner IPs)
        run: echo "${{ secrets.DOCKERHUB_TOKEN }}" | docker login -u triskit23 --password-stdin
      - name: Pull the pre-baked ternary-fep image (rdkit + openfe + lomap2 + kartograf)
        run: docker pull docker.io/triskit23/ternary-fep:latest
      - name: Chemistry pre-gate on the valB closure triangle
        run: |
          set -o pipefail
          docker run --rm --entrypoint python \
            -v "$PWD/research/modalities:/work/research/modalities" \
            -w /work/research/modalities \
            docker.io/triskit23/ternary-fep:latest valb_triangle_chem.py 2>&1 | tee /tmp/triangle.log
      # The artifact is the RELIABLE path. The branch push races the lane's own commits (the checkout is pinned
      # to the dispatch SHA, so any commit made while the mapper runs makes the push non-fast-forward), and a
      # $0 report must not be lost to a race it has no reason to care about.
      - name: Upload the report as an artifact (always retrievable)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: valb-triangle-chem
          path: |
            research/modalities/valb-triangle-chem.json
            /tmp/triangle.log
          if-no-files-found: warn
      - name: Commit the report back to the triggering branch (best effort)
        if: always()
        continue-on-error: true
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          sudo chown -R "$(id -u):$(id -g)" research/modalities || true
          git add research/modalities/valb-triangle-chem.json 2>/dev/null || true
          git commit -m "valB closure triangle: \$0 chemistry pre-gate (production LOMAP mapper) [skip ci]" \
            || { echo "no changes"; exit 0; }
          # rebase onto whatever the branch has moved to, then push; never force
          git pull --rebase origin ${{ github.ref_name }} || true
          git push origin HEAD:${{ github.ref_name }} || echo "push raced the branch; the artifact has the report"

  freeze:
    if: ${{ github.event.inputs.mode != 'triangle' }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install RDKit
        run: |
          python -m pip install --upgrade pip
          pip install rdkit
      - name: Fetch + validate + MCS-map the calib hi/lo pair
        working-directory: research/modalities
        run: python ternary_calib_freeze.py
      - name: Freeze the reviewer-approved epimer edge (PROTAC 2 -> cis-PROTAC 2, 6HAX)
        if: always()
        working-directory: research/modalities
        run: python ternary_calib_epimer_freeze.py
      - name: Freeze the reviewer-approved Wurz cmpd1->cmpd4 edge (8G1Q; diagnostic + freeze)
        if: always()
        working-directory: research/modalities
        env:
          WURZ_LINKER_N_IDX: ${{ vars.WURZ_LINKER_N_IDX }}   # unset on first pass => diagnostic-only enumeration
        run: python wurz_calib_freeze.py || true             # exit 2 (INCOMPLETE, linker not yet chosen) is expected first pass
      - name: Search RCSB for a congeneric VHL-PROTAC cooperativity pair (slow; opt-in)
        if: ${{ github.event.inputs.run_search == 'true' }}
        working-directory: research/modalities
        run: python ternary_calib_search.py
      - name: Fetch cooperativity evidence (slow; opt-in)
        if: ${{ github.event.inputs.run_search == 'true' }}
        working-directory: research/modalities
        run: python ternary_calib_alpha_fetch.py
      - name: Publish frozen pair to modalities-cache branch
        if: always()
        run: |
          set -e
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          mkdir -p "$RUNNER_TEMP/res"
          cp research/modalities/ternary-calib-pair-frozen.json "$RUNNER_TEMP/res/" 2>/dev/null || true
          cp research/modalities/ternary-calib-congeneric-search.json "$RUNNER_TEMP/res/" 2>/dev/null || true
          cp research/modalities/ternary-calib-alpha-evidence.json "$RUNNER_TEMP/res/" 2>/dev/null || true
          cp research/modalities/ternary-calib-epimer-frozen.json "$RUNNER_TEMP/res/" 2>/dev/null || true
          cp research/modalities/wurz-calib-frozen.json "$RUNNER_TEMP/res/" 2>/dev/null || true
          cp research/modalities/wurz-calib-diagnostic.json "$RUNNER_TEMP/res/" 2>/dev/null || true
          ls "$RUNNER_TEMP/res/" | grep -q json || { echo "no json produced"; exit 0; }
          git fetch origin modalities-cache || true
          git reset --hard
          git clean -fd research/modalities/   # drop untracked outputs so the cache-branch checkout doesn't abort
          if git show-ref --verify --quiet refs/remotes/origin/modalities-cache; then
            git checkout -B modalities-cache origin/modalities-cache
          else
            git checkout --orphan modalities-cache
            git rm -rf . >/dev/null 2>&1 || true
          fi
          mkdir -p research/modalities
          cp "$RUNNER_TEMP"/res/*.json research/modalities/ 2>/dev/null || true
          git add research/modalities/ternary-calib-pair-frozen.json research/modalities/ternary-calib-congeneric-search.json research/modalities/ternary-calib-alpha-evidence.json research/modalities/ternary-calib-epimer-frozen.json research/modalities/wurz-calib-frozen.json research/modalities/wurz-calib-diagnostic.json 2>/dev/null || true
          git commit -m "Ternary calib: freeze panel_sweep + congeneric VHL-PROTAC search (RCSB+RDKit) [skip ci]" || { echo "no changes"; exit 0; }
          git push origin modalities-cache
