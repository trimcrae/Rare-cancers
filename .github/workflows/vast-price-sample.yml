name: Vast price sampler (build the price time series)

# A reservation price cannot be set from one market snapshot — it needs the distribution of the cheapest
# interruptible floor OVER TIME. We have never collected that: every observation so far was taken at the
# instant we wanted to launch, which is exactly the biased sample you must not set a target price from.
#
# Read-only offer search. No rent, no instance, no spend. Appends one JSON line per run to
# research/modalities/vast-price-history.jsonl on the `modalities-cache` branch.
#
# `mode: intel` instead runs the one-shot market-intelligence pull (vast_market_intel.py): Vast's own
# documentation (the auction's rules), a matched bid/on-demand cross-section including the STORAGE line, and
# external price history. It commits its outputs back to the TRIGGERING branch, because that pull is evidence
# for a policy revision rather than a time series.
#
# NOTE: `schedule:` only fires from the DEFAULT branch, so sampling begins once this file reaches main.

on:
  schedule:
    - cron: "17 * * * *"      # hourly, off the hour so it does not pile onto :00 with everything else
  workflow_dispatch:
    inputs:
      gpu:
        description: "gpu_name substring to sample"
        default: "rtx4090"
      mode:
        description: "sample (hourly series) | intel (one-shot docs + matched market + storage) | census (why a qualifying board cannot be priced) | exclusions (what OUR OWN filter is removing, and what re-admitting it would buy) | filters (offers-surviving count PER HARD FILTER, bid vs on-demand, + the CUDA-floor sweep and the retired blacklist counterfactual) | imagecuda ($0: what CUDA the BAKED ternary-fep image actually requires — the evidence min_cuda is set from) | bidsem (pay-your-bid probe, <$0.01) | forensics (read-only: does a LIVE rental's rate move after rental?)"
        default: "sample"

permissions:
  contents: write

concurrency:
  group: vast-price-sample
  cancel-in-progress: false

jobs:
  sample:
    if: ${{ (github.event.inputs.mode || 'sample') == 'sample' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      VAST_API_KEY: ${{ secrets.VAST_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Sample the live market (read-only)
        working-directory: research/modalities
        run: |
          git fetch origin modalities-cache || true
          # Seed from the cache branch WITHOUT truncating on failure. `cmd > file` empties the
          # target before cmd runs, so the old one-liner
          #     git show origin/modalities-cache:...jsonl > vast-price-history.jsonl 2>/dev/null || true
          # silently ZEROED the accumulated series whenever git show failed — and `|| true` hid it.
          # Observed 2026-07-25 on the first successful run after the persist-step fix: the cache
          # branch had no such file yet, so the series was emptied and restarted from one sample.
          # Write to a temp and only adopt it if it is non-empty; otherwise keep the checked-out copy.
          if git show origin/modalities-cache:research/modalities/vast-price-history.jsonl \
               > "$RUNNER_TEMP/seed.jsonl" 2>/dev/null && [ -s "$RUNNER_TEMP/seed.jsonl" ]; then
            cp "$RUNNER_TEMP/seed.jsonl" vast-price-history.jsonl
            echo "seeded from modalities-cache: $(wc -l < vast-price-history.jsonl) samples"
          else
            echo "no series on modalities-cache yet — keeping the checked-out copy" \
                 "($(wc -l < vast-price-history.jsonl) rows; see the provenance note in bid-strategy.md §5)"
          fi
          python vast_bid_optimizer.py --live --gpu "${{ github.event.inputs.gpu || 'rtx4090' }}" \
            --work-gpu-h 10.7 --atoms 146000 --ckpt-iters 40 --sec-per-iter 16 \
            --sample-out vast-price-history.jsonl --history vast-price-history.jsonl
          echo "--- samples so far: $(wc -l < vast-price-history.jsonl) ---"
      - name: Persist the series to modalities-cache
        run: |
          set -e
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          cp research/modalities/vast-price-history.jsonl "$RUNNER_TEMP/"
          # The payload is now safe in RUNNER_TEMP, so DISCARD the working-tree copy before switching
          # branches. This is load-bearing, and it is why every hourly run failed here from commit da46304
          # (which added vast-price-history.jsonl to main) onward:
          #   error: Your local changes to the following files would be overwritten by checkout:
          #           research/modalities/vast-price-history.jsonl
          # git refuses to carry a modified TRACKED file across a switch when the two branches' copies
          # DIFFER — and they always differ here, because main holds a point-in-time snapshot while
          # modalities-cache holds the accumulated series. While the file was untracked on main the switch
          # carried it across silently, which is why this was invisible until da46304.
          # Reproduced and the fix verified on a scratch repo (fails exit 1 without this line, exit 0 with
          # it, payload intact on the cache branch).
          git restore --staged --worktree -- research/modalities/vast-price-history.jsonl 2>/dev/null || true
          git fetch origin modalities-cache || true
          if git show-ref --verify --quiet refs/remotes/origin/modalities-cache; then
            git checkout -B modalities-cache origin/modalities-cache
          else
            git checkout --orphan modalities-cache; git rm -rf . >/dev/null 2>&1 || true
          fi
          mkdir -p research/modalities
          cp "$RUNNER_TEMP/vast-price-history.jsonl" research/modalities/
          git add research/modalities/vast-price-history.jsonl
          git commit -m "vast price sample $(date -u +%FT%TZ)" || { echo "no change"; exit 0; }
          git push origin modalities-cache

  intel:
    if: ${{ github.event.inputs.mode == 'intel' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      VAST_API_KEY: ${{ secrets.VAST_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Pull market intelligence (docs + matched offers + storage + history)
        working-directory: research/modalities
        run: python vast_market_intel.py --days 120
      - name: Commit the evidence back to this branch
        run: |
          set -e
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add research/modalities/vast-market-intel.json \
                  research/modalities/vast-market-offers-raw.json \
                  research/modalities/vast-docs-raw.json 2>/dev/null || true
          git commit -m "vast market intel pull $(date -u +%FT%TZ)" || { echo "no change"; exit 0; }
          git push origin HEAD:${{ github.ref_name }}

  census:
    # ★ READ-ONLY ($0). WHY A QUALIFYING BOARD CANNOT BE PRICED.
    #
    # The 2026-07-27 8:00 AM ET step-1 fan-out snapshot read `48 qualifying -> 10 priceable, 19 needed`:
    # every offer cleared the launcher's hard filters and 79% were still dropped, because `$/ns` needs a
    # BENCHED ns/h and the throughput table holds three cards. `vast_board_census.py` breaks the loss down by
    # GPU model and prints, for each unbenched model, the BREAK-EVEN ns/day at which its cheapest offer would
    # match what the fleet can already achieve — a screen that decides whether a few cents of bench is worth
    # spending, without inventing a throughput for anybody.
    #
    # Also runs `--proxy-audit`: the leave-one-out error of every derived-throughput route (fp32 TFLOPS,
    # memory bandwidth, Vast's own `dlperf`) against the benched cards, so the "just scale it off the specs"
    # proposal is refuted with a number rather than an opinion.
    if: ${{ github.event.inputs.mode == 'census' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      VAST_API_KEY: ${{ secrets.VAST_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Census the live board (read-only, rents nothing)
        working-directory: research/modalities
        # Fleet size the break-even screen is judged against. 19 = the step-1 fan-out's remaining tranche,
        # which is the board that raised the question. `units` is read from the `gpu` input ONLY when it is a
        # bare integer, so this job needs no new workflow input (dispatch validates inputs against the
        # workflow definition, and a new input is one more thing that can differ between a branch and main).
        run: |
          U="${{ github.event.inputs.gpu }}"
          case "$U" in (''|*[!0-9]*) U=19 ;; esac
          python vast_board_census.py --units "$U" --proxy-audit
      - name: Commit the census back to this branch
        if: always()
        run: |
          set -e
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add research/modalities/vast-board-census.json 2>/dev/null || true
          git commit -m "vast board census $(date -u +%FT%TZ)" || { echo "no change"; exit 0; }
          git push origin HEAD:${{ github.ref_name }}

  exclusions:
    # ★ READ-ONLY ($0). WHAT THE EXCLUSION SET IS MADE OF, AND WHAT RE-ADMITTING PART OF IT WOULD BUY.
    #
    # The sibling of `census` above, asking the other half of "why did a healthy board place nothing".
    # `census` answers "the board could not be PRICED"; this answers "the board was priced fine and OUR OWN
    # FILTER ate it". Measured 9:05 PM ET 2026-07-27: 48 machines excluded, 189 offers on the board, the
    # market gate authorised 2 placements under the buy line, and BOTH submits failed with
    # `no rentable verified offer`.
    #
    # `vast_machine_blacklist.__doc__` parks a re-test policy for want of exactly this measurement and names
    # the trigger for taking it up. Nothing here writes to an exclusion set or rents anything: it reads the
    # sets from S3, reads the board once, and prints the counterfactual placement gain at several age
    # cut-offs. Needs AWS creds as well as the Vast key, which is why it is its own job rather than a flag on
    # the one above.
    if: ${{ github.event.inputs.mode == 'exclusions' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      VAST_API_KEY: ${{ secrets.VAST_API_KEY }}
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      AWS_DEFAULT_REGION: us-east-2
      VAST_CKPT_BUCKET: sagemaker-us-east-2-646605541856
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install --quiet boto3
      - name: Census the exclusion sets against the live board (read-only, rents nothing)
        working-directory: research/modalities
        # Same input-reuse trick as the job above: `units` comes from `gpu` when it is a bare integer, so no
        # new workflow input is needed (dispatch validates inputs against the DEFAULT branch's definition,
        # and a new input is one more thing that can differ between a branch and main).
        run: |
          U="${{ github.event.inputs.gpu }}"
          case "$U" in (''|*[!0-9]*) U=19 ;; esac
          python vast_exclusion_census.py --units "$U"
      - name: Commit the census back to this branch
        if: always()
        run: |
          set -e
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add research/modalities/vast-exclusion-census.json 2>/dev/null || true
          git commit -m "vast exclusion census $(date -u +%FT%TZ)" || { echo "no change"; exit 0; }
          git push origin HEAD:${{ github.ref_name }}

  filters:
    # ★ READ-ONLY ($0). WHICH OF OUR OWN HARD FILTERS IS EATING THE BOARD.
    #
    # The third sibling of `census` and `exclusions`, and the one that was missing when it mattered
    # (trimcrae, 2026-07-31: *"the floor being 2x over baseline would be quite unusual. Make sure we aren't
    # filtering too many options out."*). `census` says the board could not be PRICED; `exclusions` says the
    # blacklist ate it; NEITHER says which of `min_cuda` / VRAM / host RAM / cores / disk / reliability /
    # `min_ns_per_h` is doing the pruning. Without that, a narrow board reads as a thin market — and those
    # two call for OPPOSITE actions (§6 waits a thin market out; an over-tight filter is fixed).
    #
    # Every count comes off ONE permissive read per tier, because `/search/asks/` is a rotating sample
    # (`gpu_backend._vast_request`: two reads 20 s apart share ~174 machines). It also prices the bid and
    # on-demand tiers SEPARATELY and labels them — conflating the two is what made a hold priced against the
    # small, dear uninterruptible tier read as a statement about the market the ladder is costed on.
    #
    # Rents nothing, changes no filter, and never touches the buy line.
    if: ${{ github.event.inputs.mode == 'filters' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      VAST_API_KEY: ${{ secrets.VAST_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Ablate every hard filter against one live board (read-only, rents nothing)
        working-directory: research/modalities
        # Same input-reuse idiom as `census`/`exclusions`: `gpu` carries the card floor to include in the
        # FULL spec when it is a bare number, so no new workflow input is needed (dispatch validates inputs
        # against the DEFAULT branch, and a new input is one more thing that can differ between refs).
        run: |
          F="${{ github.event.inputs.gpu }}"
          case "$F" in (''|*[!0-9.]*) F=0 ;; esac
          python vast_filter_ablation.py --lane ternary --units 1 --min-ns-per-h "$F"
      - name: Commit the ablation back to this branch
        if: always()
        run: |
          set -e
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add research/modalities/vast-filter-ablation.json 2>/dev/null || true
          git commit -m "vast filter ablation $(date -u +%FT%TZ)" || { echo "no change"; exit 0; }
          for i in 1 2 3 4; do
            git pull --rebase origin "${{ github.ref_name }}" && \
              git push origin HEAD:${{ github.ref_name }} && exit 0
            sleep $((2**i))
          done
          echo "::warning::could not push the filter ablation"

  imagecuda:
    # ★ READ-ONLY ($0), AND IT IS THE EVIDENCE `min_cuda` SHOULD BE SET FROM.
    #
    # `ResourceSpec.min_cuda = 13.0` is enforced twice per board read and is, by the ablation above, the
    # single most expensive filter this repo applies. Its justification is a COMMENT claiming the baked env's
    # PTX is CUDA-13-class, while `Dockerfile.ternaryfep` is `FROM nvidia/cuda:12.6.3-...` and pins
    # `cuda-version=12.6`. One of those is wrong and the expensive one is the one being enforced.
    #
    # `probe_image_cuda.py` asks the ENV rather than the Dockerfile: OpenMM JIT-compiles its CUDA kernels with
    # NVRTC, so the PTX ISA it emits — and therefore the minimum host driver — is fixed by the env's own
    # libnvrtc, which `ctypes` can read on a runner with no GPU.
    #
    # Pulls the image rather than solving an env (CLAUDE.md §6) and mounts the repo's `research/modalities`
    # so the probe is the CHECKED-OUT copy, not the stale one baked at build time. `--entrypoint python`
    # bypasses the image's autoteardown ENTRYPOINT, which is for billed GPU legs and not a $0 probe.
    if: ${{ github.event.inputs.mode == 'imagecuda' }}
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Ask the BAKED image what CUDA it needs (no GPU, no rental)
        run: |
          set -eo pipefail
          echo "${{ secrets.DOCKERHUB_TOKEN }}" | docker login -u triskit23 --password-stdin
          IMG=docker.io/triskit23/ternary-fep:latest
          docker pull -q "$IMG"
          mkdir -p /tmp/probe
          docker run --rm --entrypoint python \
            -v "$PWD/research/modalities:/work/research/modalities" \
            -v /tmp/probe:/tmp/probe \
            "$IMG" /work/research/modalities/probe_image_cuda.py \
              --json-out /tmp/probe/ternary-fep-cuda-probe.json
          cp /tmp/probe/ternary-fep-cuda-probe.json research/modalities/ 2>/dev/null || true
      - name: Commit the probe back to this branch
        if: always()
        run: |
          set -e
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add research/modalities/ternary-fep-cuda-probe.json 2>/dev/null || true
          git commit -m "ternary-fep image CUDA probe $(date -u +%FT%TZ)" || { echo "no change"; exit 0; }
          for i in 1 2 3 4; do
            git pull --rebase origin "${{ github.ref_name }}" && \
              git push origin HEAD:${{ github.ref_name }} && exit 0
            sleep $((2**i))
          done
          echo "::warning::could not push the image CUDA probe"

  bidsem:
    # The one experiment that DOES rent: settle whether an interruptible rental is billed at your bid or at a
    # clearing price. Rents the cheapest box on the market for ~2 minutes (<$0.01) and destroys it twice over.
    if: ${{ github.event.inputs.mode == 'bidsem' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      VAST_API_KEY: ${{ secrets.VAST_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Probe bid semantics (rents ~2 min per rung, self-destroys)
        if: ${{ !startsWith(github.event.inputs.gpu, 'cap:') && github.event.inputs.gpu != 'list' }}
        working-directory: research/modalities
        run: python vast_bid_semantics_probe.py --ladder "${{ github.event.inputs.gpu || '1.0,2.5,8.0' }}"
      - name: Verify the billing cap is the machine on-demand price (read-only, $0)
        if: ${{ startsWith(github.event.inputs.gpu, 'cap:') }}
        working-directory: research/modalities
        run: python vast_bid_semantics_probe.py --verify-cap "${{ github.event.inputs.gpu }}"
      - name: Anti-idle close-out — nothing left running (read-only, $0)
        if: ${{ github.event.inputs.gpu == 'list' }}
        working-directory: research/modalities
        run: python vast_bid_semantics_probe.py --list-only
      - name: Commit the verdict
        if: always()
        run: |
          set -e
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add research/modalities/vast-bid-semantics-probe.json \
                  research/modalities/vast-bid-semantics-probe-ladder.json \
                  research/modalities/vast-bid-semantics-probe-cap.json 2>/dev/null || true
          git commit -m "vast bid-semantics probe $(date -u +%FT%TZ)" || { echo "no change"; exit 0; }
          git push origin HEAD:${{ github.ref_name }}

  forensics:
    # ★ READ-ONLY ($0). The premise behind CLAUDE.md §6's "work already executing is never touched" is that the
    # rate you rent at is the rate you pay. The board appeared to contradict it (a shakeout at 1.41x basis
    # reported at 1.82x 43 min later), and that premise is load-bearing enough to measure rather than argue
    # about. `vast_rate_forensics.py` splits every LIVE instance's `dph_total` into its GPU / storage / inet
    # lines and compares the GPU line with the bid the lane's rental ledger recorded at rental time.
    #
    # It rents nothing, destroys nothing and never touches a running host: GET /instances/ plus one S3 read.
    # Also on the HOURLY schedule, not only on demand. The premise it guards is a fact about VAST'S
    # BILLING, not about our code, so it can stop being true with nobody touching this repo — and the
    # rule it licenses (§6: never re-check a live host) is the one that would then be silently wrong.
    if: ${{ github.event.inputs.mode == 'forensics' || github.event_name == 'schedule' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      VAST_API_KEY: ${{ secrets.VAST_API_KEY }}
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      AWS_DEFAULT_REGION: us-east-2
      VAST_CKPT_BUCKET: sagemaker-us-east-2-646605541856
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -q boto3
      - name: Does a live rental's charged rate move? (read-only, $0)
        working-directory: research/modalities
        run: python vast_rate_forensics.py --probe
      - name: Is the offer-quote under-read in front of the PURCHASE DECISION? (read-only, $0)
        # The more serious half. A wrong number in a readout is a reporting defect; the same wrong number
        # inside the $/ns market gate would mean every rental was approved against a rate ~11-36 % below its
        # true one. Prices the whole live board both ways and puts them side by side.
        if: always()
        working-directory: research/modalities
        run: python vast_rate_forensics.py --reprice
      - name: Commit the evidence back to this branch
        if: always()
        run: |
          set -e
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f research/modalities/vast-rate-forensics.json \
                    research/modalities/vast-board-reprice.json 2>/dev/null || true
          git commit -m "vast rate forensics $(date -u +%FT%TZ)" || { echo "no change"; exit 0; }
          for i in 1 2 3 4; do
            git pull --rebase origin "${{ github.ref_name }}" && \
              git push origin HEAD:${{ github.ref_name }} && exit 0
            sleep $((2**i))
          done
          echo "::warning::could not push the forensics readout"
