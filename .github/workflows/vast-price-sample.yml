name: Vast price sampler (build the price time series)

# A reservation price cannot be set from one market snapshot — it needs the distribution of the cheapest
# interruptible floor OVER TIME. We have never collected that: every observation so far was taken at the
# instant we wanted to launch, which is exactly the biased sample you must not set a target price from.
#
# Read-only offer search. No rent, no instance, no spend. Appends one JSON line per run to
# research/modalities/vast-price-history.jsonl on the `modalities-cache` branch.
#
# `mode: intel` instead runs the one-shot market-intelligence pull (vast_market_intel.py): Vast's own
# documentation (the auction's rules), a matched bid/on-demand cross-section including the STORAGE line, and
# external price history. It commits its outputs back to the TRIGGERING branch, because that pull is evidence
# for a policy revision rather than a time series.
#
# NOTE: `schedule:` only fires from the DEFAULT branch, so sampling begins once this file reaches main.

on:
  schedule:
    - cron: "17 * * * *"      # hourly, off the hour so it does not pile onto :00 with everything else
  workflow_dispatch:
    inputs:
      gpu:
        description: "gpu_name substring to sample"
        default: "rtx4090"
      mode:
        description: "sample (hourly series) | intel (one-shot docs + matched market + storage) | bidsem (pay-your-bid probe, <$0.01) | forensics (read-only: does a LIVE rental's rate move after rental?)"
        default: "sample"

permissions:
  contents: write

concurrency:
  group: vast-price-sample
  cancel-in-progress: false

jobs:
  sample:
    if: ${{ (github.event.inputs.mode || 'sample') == 'sample' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      VAST_API_KEY: ${{ secrets.VAST_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Sample the live market (read-only)
        working-directory: research/modalities
        run: |
          git fetch origin modalities-cache || true
          # Seed from the cache branch WITHOUT truncating on failure. `cmd > file` empties the
          # target before cmd runs, so the old one-liner
          #     git show origin/modalities-cache:...jsonl > vast-price-history.jsonl 2>/dev/null || true
          # silently ZEROED the accumulated series whenever git show failed — and `|| true` hid it.
          # Observed 2026-07-25 on the first successful run after the persist-step fix: the cache
          # branch had no such file yet, so the series was emptied and restarted from one sample.
          # Write to a temp and only adopt it if it is non-empty; otherwise keep the checked-out copy.
          if git show origin/modalities-cache:research/modalities/vast-price-history.jsonl \
               > "$RUNNER_TEMP/seed.jsonl" 2>/dev/null && [ -s "$RUNNER_TEMP/seed.jsonl" ]; then
            cp "$RUNNER_TEMP/seed.jsonl" vast-price-history.jsonl
            echo "seeded from modalities-cache: $(wc -l < vast-price-history.jsonl) samples"
          else
            echo "no series on modalities-cache yet — keeping the checked-out copy" \
                 "($(wc -l < vast-price-history.jsonl) rows; see the provenance note in bid-strategy.md §5)"
          fi
          python vast_bid_optimizer.py --live --gpu "${{ github.event.inputs.gpu || 'rtx4090' }}" \
            --work-gpu-h 10.7 --atoms 146000 --ckpt-iters 40 --sec-per-iter 16 \
            --sample-out vast-price-history.jsonl --history vast-price-history.jsonl
          echo "--- samples so far: $(wc -l < vast-price-history.jsonl) ---"
      - name: Persist the series to modalities-cache
        run: |
          set -e
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          cp research/modalities/vast-price-history.jsonl "$RUNNER_TEMP/"
          # The payload is now safe in RUNNER_TEMP, so DISCARD the working-tree copy before switching
          # branches. This is load-bearing, and it is why every hourly run failed here from commit da46304
          # (which added vast-price-history.jsonl to main) onward:
          #   error: Your local changes to the following files would be overwritten by checkout:
          #           research/modalities/vast-price-history.jsonl
          # git refuses to carry a modified TRACKED file across a switch when the two branches' copies
          # DIFFER — and they always differ here, because main holds a point-in-time snapshot while
          # modalities-cache holds the accumulated series. While the file was untracked on main the switch
          # carried it across silently, which is why this was invisible until da46304.
          # Reproduced and the fix verified on a scratch repo (fails exit 1 without this line, exit 0 with
          # it, payload intact on the cache branch).
          git restore --staged --worktree -- research/modalities/vast-price-history.jsonl 2>/dev/null || true
          git fetch origin modalities-cache || true
          if git show-ref --verify --quiet refs/remotes/origin/modalities-cache; then
            git checkout -B modalities-cache origin/modalities-cache
          else
            git checkout --orphan modalities-cache; git rm -rf . >/dev/null 2>&1 || true
          fi
          mkdir -p research/modalities
          cp "$RUNNER_TEMP/vast-price-history.jsonl" research/modalities/
          git add research/modalities/vast-price-history.jsonl
          git commit -m "vast price sample $(date -u +%FT%TZ)" || { echo "no change"; exit 0; }
          git push origin modalities-cache

  intel:
    if: ${{ github.event.inputs.mode == 'intel' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      VAST_API_KEY: ${{ secrets.VAST_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Pull market intelligence (docs + matched offers + storage + history)
        working-directory: research/modalities
        run: python vast_market_intel.py --days 120
      - name: Commit the evidence back to this branch
        run: |
          set -e
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add research/modalities/vast-market-intel.json \
                  research/modalities/vast-market-offers-raw.json \
                  research/modalities/vast-docs-raw.json 2>/dev/null || true
          git commit -m "vast market intel pull $(date -u +%FT%TZ)" || { echo "no change"; exit 0; }
          git push origin HEAD:${{ github.ref_name }}

  bidsem:
    # The one experiment that DOES rent: settle whether an interruptible rental is billed at your bid or at a
    # clearing price. Rents the cheapest box on the market for ~2 minutes (<$0.01) and destroys it twice over.
    if: ${{ github.event.inputs.mode == 'bidsem' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      VAST_API_KEY: ${{ secrets.VAST_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Probe bid semantics (rents ~2 min per rung, self-destroys)
        if: ${{ !startsWith(github.event.inputs.gpu, 'cap:') && github.event.inputs.gpu != 'list' }}
        working-directory: research/modalities
        run: python vast_bid_semantics_probe.py --ladder "${{ github.event.inputs.gpu || '1.0,2.5,8.0' }}"
      - name: Verify the billing cap is the machine on-demand price (read-only, $0)
        if: ${{ startsWith(github.event.inputs.gpu, 'cap:') }}
        working-directory: research/modalities
        run: python vast_bid_semantics_probe.py --verify-cap "${{ github.event.inputs.gpu }}"
      - name: Anti-idle close-out — nothing left running (read-only, $0)
        if: ${{ github.event.inputs.gpu == 'list' }}
        working-directory: research/modalities
        run: python vast_bid_semantics_probe.py --list-only
      - name: Commit the verdict
        if: always()
        run: |
          set -e
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add research/modalities/vast-bid-semantics-probe.json \
                  research/modalities/vast-bid-semantics-probe-ladder.json \
                  research/modalities/vast-bid-semantics-probe-cap.json 2>/dev/null || true
          git commit -m "vast bid-semantics probe $(date -u +%FT%TZ)" || { echo "no change"; exit 0; }
          git push origin HEAD:${{ github.ref_name }}

  forensics:
    # ★ READ-ONLY ($0). The premise behind CLAUDE.md §6's "work already executing is never touched" is that the
    # rate you rent at is the rate you pay. The board appeared to contradict it (a shakeout at 1.41x basis
    # reported at 1.82x 43 min later), and that premise is load-bearing enough to measure rather than argue
    # about. `vast_rate_forensics.py` splits every LIVE instance's `dph_total` into its GPU / storage / inet
    # lines and compares the GPU line with the bid the lane's rental ledger recorded at rental time.
    #
    # It rents nothing, destroys nothing and never touches a running host: GET /instances/ plus one S3 read.
    if: ${{ github.event.inputs.mode == 'forensics' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      VAST_API_KEY: ${{ secrets.VAST_API_KEY }}
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      AWS_DEFAULT_REGION: us-east-2
      VAST_CKPT_BUCKET: sagemaker-us-east-2-646605541856
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -q boto3
      - name: Does a live rental's charged rate move? (read-only, $0)
        working-directory: research/modalities
        run: python vast_rate_forensics.py --probe
