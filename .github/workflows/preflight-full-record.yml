name: Record PREFLIGHT_FULL evidence (publish_bar clause 2)

# ⛔ WHY THIS EXISTS: publish_bar.py's `preflight_full_green` clause requires a committed receipt at
# research/autonomy/preflight-receipts/<sha>.json, produced by a REAL `PREFLIGHT_FULL=1` run against
# the exact pinned commit (record_bar_evidence.py preflight --sha <sha> --log <path>). That run
# regularly takes ~25 minutes (fast gates + the manuscripts suite + the modalities suite, unscoped).
#
# Measured 2026-08-27: three consecutive dev-sandbox container restarts each interrupted the same
# local run before it finished, with no partial result recoverable (CLAUDE.md section 1's own warning
# about a long-running foreground-adjacent job in this container). The run itself is correct; the
# container's lifetime is not long enough to host it reliably. A GitHub Actions runner's lifecycle is
# independent of this dev container, so the run belongs here instead (ci-escape-hatches rung 1: the
# answer must be a committed artifact someone will later quote, and this clause will need this same
# evidence again for every future publish_bar evaluation of every paper -- rung 2's "will be re-run").

on:
  workflow_dispatch:
    inputs:
      sha:
        description: "Full 40-char commit sha to run PREFLIGHT_FULL=1 against"
        required: true

permissions:
  contents: write

concurrency:
  group: preflight-full-record-${{ github.event.inputs.sha }}
  cancel-in-progress: false

jobs:
  record:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.sha }}
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install the gates' dependencies
        # ⛔⛔ RUN 33104631542 WENT RED ON THE ENVIRONMENT, NOT THE REPOSITORY (measured 2026-08-27):
        # 53 modalities failures, every one ModuleNotFoundError-shaped, and preflight.sh's own log said
        # so verbatim ("that is a MISSING PACKAGE, not a defect in the repository"). dev-setup.sh
        # (scripts/dev-setup.sh) already installs everything the gates need EXCEPT `uv` itself -- the
        # pytest tool venv it provisions (TEST_DEPS: numpy, scipy, rdkit, boto3, pymbar, biopython...)
        # requires `uv` to exist first, and a vanilla ubuntu-latest runner does not carry it.
        # `pip install pypdf pdfminer.six jsonschema pytest` (copied from aso-submission-parts.yml,
        # which never runs the modalities suite) was never going to cover that gap; it silenced the
        # dev-setup.sh failure instead of fixing it. Install uv first and let dev-setup.sh do its own
        # job -- no separate package list to keep in sync with SYSTEM_DEPS/TEST_DEPS there.
        run: |
          set -euo pipefail
          command -v uv >/dev/null 2>&1 || pip install -q uv
          ./scripts/dev-setup.sh --if-needed

      - name: Run PREFLIGHT_FULL=1 against the pinned commit
        # ⛔⛔ GitHub Actions runs every `run:` step under `bash -e` BY DEFAULT, and `set -uo pipefail`
        # below only ADDS flags -- it does not clear the pre-existing `-e`. A first version of this
        # step let that abort the script the instant preflight.sh returned nonzero, discarding the
        # EXIT= marker, the log tail AND the real diagnostic (measured 2026-08-27, run 33101598851:
        # the step failed but "Record the evidence" showed `skipped`, so nothing about WHY survived).
        # `set +e` / `set -e` around the one command that is allowed to fail is what fixes it.
        env:
          SHA: ${{ github.event.inputs.sha }}
        run: |
          set -uo pipefail
          echo "PINNED_SHA=$SHA" > /tmp/preflight-full.log
          set +e
          PREFLIGHT_FULL=1 ./scripts/preflight.sh >> /tmp/preflight-full.log 2>&1
          rc=$?
          set -e
          echo "EXIT=$rc" >> /tmp/preflight-full.log
          echo "::group::preflight-full.log (full)"
          cat /tmp/preflight-full.log
          echo "::endgroup::"
          echo "PREFLIGHT_RC=$rc" >> "$GITHUB_ENV"

      - name: Record the evidence
        # ⚠ ALWAYS RUNS, pass or fail: a red run's log is diagnostic evidence, not something to lose
        # by letting the job stop here. record_bar_evidence.py itself refuses to write a passing
        # receipt when the log's EXIT= marker is not 0 -- that refusal is correct and expected on a
        # red run; this step's own exit code is intentionally not checked (`|| true`) so the publish
        # step below still runs and the log itself still lands on main either way.
        if: always()
        env:
          SHA: ${{ github.event.inputs.sha }}
        run: python3 research/autonomy/record_bar_evidence.py preflight --sha "$SHA" --log /tmp/preflight-full.log || true

      - name: Publish the log (and the receipt, if the run was green) to main
        # ⛔ GOES THROUGH THE ONE PRIMITIVE, never a hand-rolled git commit+push -- see
        # research/modalities/tests/test_no_hand_rolled_publish.py. This is an EVENT publish (one
        # receipt/log for one sha), not a heartbeat, hence PUBLISH_IF_CHANGED=1. `publish_artifacts.sh`
        # already skips a path that does not exist (e.g. the receipt, absent on a red run), so listing
        # both paths unconditionally is safe on either outcome.
        if: always()
        env:
          SHA: ${{ github.event.inputs.sha }}
          PUBLISH_IF_CHANGED: "1"
          PUBLISH_FAIL_HARD: "1"
        run: |
          set -euo pipefail
          bash research/compute/publish_artifacts.sh main \
            "record PREFLIGHT_FULL evidence for ${SHA} (exit ${PREFLIGHT_RC:-unknown}) (CI)" \
            "research/autonomy/preflight-receipts/${SHA}.json" \
            "research/autonomy/preflight-logs/${SHA}.log"

      - name: Fail the job if PREFLIGHT_FULL itself was red
        # ⚠ Separate from the steps above on purpose: the log and (absent) receipt must land on main
        # EVEN THOUGH the job is red, so this check runs last rather than gating anything upstream.
        if: always()
        run: |
          if [ "${PREFLIGHT_RC:-1}" != "0" ]; then
            echo "::error::PREFLIGHT_FULL=1 exited ${PREFLIGHT_RC:-unknown} -- see the log published to research/autonomy/preflight-logs/${{ github.event.inputs.sha }}.log on main, or the group above."
            exit 1
          fi
