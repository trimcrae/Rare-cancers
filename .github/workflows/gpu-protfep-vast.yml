name: 5a-KS protein-mutation FEP — known-answer benchmark (pmx + GROMACS on Vast)

# Qualifies the 5a-KS wedge engine against measured protein-protein interface ddG values.
# nr4a3-program-map.md carries 5a-KS as the program's causal kill-switch AND the paper's primary causal
# result, and as UNPRICED/UNVALIDATED — no leg has ever completed. This workflow is the gate that
# changes that: it produces both the qualification verdict and the engine's first measured per-leg
# rate (protfep_reduce.price_from_legs).
#
# ENGINE: pmx + GROMACS. The original perses implementation is retained but UNUSABLE here — perses
# builds the old->new residue atom map through the commercial, licence-gated OpenEye toolkit
# (established 2026-07-24 by running it; see research/modalities/protfep-pmx-plan.md). trimcrae's
# call was to switch engines rather than buy a licence or descope the wedge.
#
# THE LADDER IS CHEAPEST-DECISIVE-FIRST, and most of it costs nothing:
#   stage-test  -> $0. RCSB fetch, chain surgery, and the mutation-site check that REFUSES to stage
#                  the wrong residue. Also runs the unit tests. Fires automatically on push.
#   refcheck    -> $0. Re-verifies the benchmark's reference ddG against SKEMPI 2.0.
#   bake        -> $0 (free CI). Build + push the pmx/GROMACS Vast image.
#   build-test  -> $0. The WHOLE hybrid construction on a CPU runner: pmx mutate, pdb2gmx, gentop,
#                  solvate, minimise, NVT, NPT. Only the alchemical sampling needs a GPU, so a host
#                  is rented only once a hybrid system demonstrably builds. The perses lane rented a
#                  4090 to discover an import error; this step is why that does not repeat.
#   smoke       -> ~$0.10. One tiny leg (few windows, short) to prove image + plumbing + BAR + S3.
#   pilot       -> ~$1-3. Both legs of barstar Y29A. THE ABORT GATE: if the engine cannot recover the
#                  canonical ~3.4 kcal/mol hot spot, the wedge is not deliverable and the rest of the
#                  set is not worth paying for.
#   launch      -> ~$5-10. The full set, fanned out N-wide.
#   collect     -> $0. Status board, traceback dump, anti-idle reap, reduction to verdict + price.
#   stop        -> $0. Destroy every protfep-bench instance.
#
# No GPU task is ever push-triggered — the spend-gated ladder's first rule is that nothing auto-fires.

on:
  push:
    branches: [main, claude/parallel-test-vast-cs5ugw]
    paths:
      - research/modalities/protfep_*.py
      - research/modalities/nr4a3_protein_fep.py
      - .github/workflows/gpu-protfep-vast.yml
  workflow_dispatch:
    inputs:
      task:
        description: stage-test | refcheck | bake | build-test | smoke | pilot | launch | collect | rebid | stop
        type: choice
        options: [stage-test, refcheck, bake, build-test, smoke, pilot, launch, collect, rebid, stop]
        default: stage-test
      n_replicas:
        description: "replicates per environment (launch only; default 3)"
        type: string
        default: "3"
      vast_image:
        description: "override the Vast image (blank = docker.io/triskit23/pmxfep:latest)"
        type: string
        default: ""
      vast_ckpt_bucket:
        description: "S3 bucket for results (blank = sagemaker-us-east-2-646605541856)"
        type: string
        default: ""
      hourly_usd:
        description: "assumed $/hr for the price reduction (blank = 0.20, the observed 4090 spot band)"
        type: string
        default: ""
      forensic:
        description: "collect only: dump every Vast field for non-running instances (bid vs min_bid, etc.)"
        type: boolean
        default: false
      rebid_mult:
        description: "rebid only: target multiple of the floor (blank = 1.9); the value ceiling still caps it"
        type: string
        default: ""

permissions:
  contents: write

jobs:
  # ------------------------------------------------------------------ free: staging + references
  stage-test:
    if: ${{ github.event_name == 'push' || github.event.inputs.task == 'stage-test' || github.event.inputs.task == 'refcheck' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Unit tests for the engine + benchmark layer
        run: |
          set -eo pipefail
          python -m pip install -q pytest
          python -m pytest research/modalities/tests/test_protein_fep.py \
                           research/modalities/tests/test_protfep_bench.py \
                           research/modalities/tests/test_dockerfile_hygiene.py -q
      - name: Stage every benchmark leg from RCSB (chain surgery + mutation-site verification)
        # CI runners have unrestricted internet (the dev sandbox's egress proxy 403s RCSB). PDBFixer
        # is absent here so preparation is skipped and reported — but the chain cut and the site
        # check, the parts that could silently mutate the WRONG residue, still run. That check is
        # what caught a benchmark entry pointing at barnase instead of barstar.
        run: |
          set -eo pipefail
          cd research/modalities
          python - <<'PY'
          import json, protfep_bench as b
          ok = True
          for name in b.BENCHMARKS:
              for env in ("complex", "apo"):
                  spec = b.leg_spec(name, env, 0)
                  try:
                      r = b.stage_leg(spec, "/tmp/protfep_in")["report"]
                      print(f"OK  {spec['leg_id']}: chains={r['chains']} atoms={r['atoms_per_chain']} "
                            f"residues={r['residues_per_chain']} site={r['mutation_site_observed']} "
                            f"(expected {r['mutation_site_expected']})")
                  except Exception as e:
                      ok = False
                      print(f"FAIL {spec['leg_id']}: {type(e).__name__}: {e}")
          print(json.dumps(b.verify_status(), indent=2))
          raise SystemExit(0 if ok else 1)
          PY
      - name: Verify the benchmark reference ddG values against SKEMPI 2.0
        # The engine's PASS/FAIL is computed against these numbers, so an unchecked reference is an
        # unchecked verdict. This recomputes ddG from the deposited Kd values rather than trusting a
        # remembered table cell — which is how a wrong-SIGNED reference was caught.
        run: |
          set -eo pipefail
          python research/modalities/protfep_refcheck.py \
            --out research/modalities/protfep-reference-check.json
      - name: Scan SKEMPI for a WEDGE-SIZED benchmark candidate
        # nr4a3-program-map.md RUNG 5a-KS: the qualified set BRACKETS the wedge (+3.4 hot spot, ~0 near-null)
        # and covers nothing at the size the wedge measures, so the confirmatory causal line may not
        # yet claim to resolve a paralogue-scale difference. This is the free half of closing that
        # gap — it finds candidates from the deposited Kd values and NEVER edits BENCHMARKS, so
        # promoting one stays a deliberate edit. 1BRS because its staging is already proven.
        run: |
          set -eo pipefail
          python research/modalities/protfep_refcheck.py --wedge-scan \
            --wedge-pdb 1BRS --wedge-chains A,D \
            --out research/modalities/protfep-wedge-band-candidates.json
      - name: Commit the reference check + the wedge-band scan
        if: ${{ github.event.inputs.task == 'refcheck' }}
        # ⚠ `git diff --quiet -- <path>` is a NO-OP for an UNTRACKED path, so this step exited 0 and
        # committed NOTHING for every run since 2026-07-25 — which is exactly why neither
        # protfep-reference-check.json nor protfep-wedge-band-candidates.json has ever appeared in the
        # repo. `git add` first, then ask the INDEX. (Measured 2026-08-02, same bug, same file.)
        run: |
          set -eo pipefail
          PUBLISH_IF_CHANGED=1 bash research/compute/publish_artifacts.sh "${{ github.ref_name }}" \
            "5a-KS: verify references against SKEMPI 2.0 + scan for a wedge-sized benchmark" \
            research/modalities/protfep-reference-check.json \
            research/modalities/protfep-wedge-band-candidates.json

  # ------------------------------------------------------------------ free: the $0 spend precheck
  # nr4a3-program-map.md's tally of built-but-never-run known-answer tests makes the SMARCA2/4 pmx spend
  # "conditional on a measured mutational value existing in a primary source, which is a $0 check that
  # must precede any spend (Open decision 7)". This job IS that check, and it is a SEPARATE job from
  # stage-test on purpose: a staging failure must not be able to skip the gate that authorises money.
  #
  # It runs here rather than in the dev sandbox because the sandbox's egress proxy 403s Europe PMC and
  # cannot reach life.bsc.es (SKEMPI). CLAUDE.md §6: that is a routing problem, never a reason to defer.
  mutation-reference-precheck:
    if: ${{ github.event.inputs.task == 'refcheck' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Unit-test the gate before trusting its verdict
        run: |
          set -eo pipefail
          python -m pip install -q pytest
          python -m pytest research/modalities/tests/test_pmx_mutation_reference.py -q
      - name: Does a MEASURED mutational ddG exist for the SMARCA2/4 selectivity contact?
        run: |
          set -eo pipefail
          python research/modalities/pmx_mutation_reference.py \
            --out research/modalities/pmx-mutation-reference-precheck.json
      - name: Print the decision where a human will see it
        run: |
          set -eo pipefail
          python - <<'PY'
          import json
          d = json.load(open("research/modalities/pmx-mutation-reference-precheck.json"))
          v, s = d["verdict"], d["skempi"]
          print("::notice title=pmx mutation-reference precheck::%s" % v["decision"])
          print(v["sentence"])
          print()
          print("SKEMPI: %d rows scanned | on-interface: %d by PDB + %d by paired name | "
                "off-interface leads: %d"
                % (s.get("n_rows_scanned", 0), s.get("n_pdb_hits", 0),
                   s.get("n_name_hits_paired", 0), s.get("n_name_leads", 0)))
          for r in (s.get("pdb_hits") or []) + (s.get("name_hits_paired") or []):
              print("  ON-INTERFACE %s %s %s/%s ddG=%s" % (r.get("pdb_entry"), r.get("mutation_cell"),
                                                           r.get("protein_1"), r.get("protein_2"),
                                                           r.get("ddg_kcal")))
          for c in (s.get("name_lead_complexes") or [])[:25]:
              print("  lead (NOT counted): %s" % c)
          for row in d["europe_pmc"]:
              n = sum(len(rec.get("fulltext_mutational_spans") or []) +
                      len(rec.get("abstract_mutational_spans") or []) for rec in row["records"])
              print("  EPMC %-28s hits=%s spans=%d err=%s"
                    % (row["tag"], row["n_hits"], n, row["error"]))
          print()
          print("CAVEAT: %s" % d["caveat_that_must_travel_with_any_result"])
          PY
      - name: Commit the precheck artifact
        # ⚠ `git diff --quiet -- <path>` is a NO-OP for an UNTRACKED path: it compares the index to the
        # worktree for files the index knows about, so a brand-new artifact reads as "no change" and the
        # commit is skipped while the step still exits 0. Measured 2026-08-02 on this very workflow —
        # the first precheck run reported PROCEED and committed nothing, and the same bug is why
        # `protfep-wedge-band-candidates.json` has never landed despite its step passing since 2026-07-25.
        # `git add` FIRST, then ask the INDEX. A silent no-commit is the worst failure shape available:
        # a verdict that exists only in a log is not a committed artifact and cannot be cited.
        run: |
          set -eo pipefail
          P=research/modalities/pmx-mutation-reference-precheck.json
          PUBLISH_IF_CHANGED=1 bash research/compute/publish_artifacts.sh "${{ github.ref_name }}" \
            "pmx precheck: does a measured mutational ddG exist for the SMARCA2/4 contact? (\$0)" \
            "$P"
          test -s "$P"

  # ------------------------------------------------------------------ free: image
  bake:
    if: ${{ github.event.inputs.task == 'bake' }}
    runs-on: ubuntu-latest
    timeout-minutes: 150
    env:
      DOCKERHUB_USER: triskit23
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
      - name: Reclaim runner disk (CUDA + GROMACS + the conda env is multi-GB)
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/lib/android "$AGENT_TOOLSDIRECTORY" || true
          df -h /
      - name: Log in to Docker Hub
        run: echo "${{ secrets.DOCKERHUB_TOKEN }}" | docker login -u "$DOCKERHUB_USER" --password-stdin
      - name: Build + push the pmx/GROMACS Vast image
        run: |
          set -eo pipefail
          IMG="docker.io/${DOCKERHUB_USER}/pmxfep:latest"
          docker build -f research/compute/Dockerfile.pmxfep -t "$IMG" research/compute/
          docker push "$IMG"
          echo "PUSHED $IMG — the Docker Hub repo must be PUBLIC so Vast pulls it unauthenticated."

  # ------------------------------------------------------------------ free: the whole CPU half
  build-test:
    if: ${{ github.event.inputs.task == 'build-test' }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      GIT_BRANCH: ${{ github.ref_name }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
      - name: Construct + equilibrate the hybrid system on CPU (no GPU rented)
        run: |
          set -eo pipefail
          IMG="${{ github.event.inputs.vast_image || 'docker.io/triskit23/pmxfep:latest' }}"
          docker pull "$IMG"
          docker run --rm -e GIT_BRANCH="$GIT_BRANCH" -e PMX_ALLOW_CPU=1 \
                     -e PMX_MIN_STEPS=200 -e PMX_NVT_PS=2 -e PMX_NPT_PS=2 "$IMG" bash -lc '
            set -eo pipefail
            export PATH=/opt/mamba/envs/pmxfep/bin:$PATH
            cd /root
            curl -Ls "https://github.com/trimcrae/Rare-cancers/archive/refs/heads/$GIT_BRANCH.tar.gz" | tar xz
            cd Rare-cancers-*/research/modalities
            # BOTH environments. The apo leg is single-chain and has always built; every chain
            # resolution failure has been in the COMPLEX leg, where two chains exist and pdb2gmx /
            # pmx disagree about labels. Testing only apo proved the easy half and let the hard half
            # fail three times on rented hosts instead.
            python protfep_pmx.py --benchmark barnase_barstar_Y29A --environment apo \
                   --out-dir /tmp/out --in-dir /tmp/in --build-only
            echo "=== apo built; now the two-chain COMPLEX leg ==="
            python protfep_pmx.py --benchmark barnase_barstar_Y29A --environment complex \
                   --out-dir /tmp/out --in-dir /tmp/in --build-only'

  # ------------------------------------------------------------------ paid: the GPU ladder
  run:
    if: ${{ github.event.inputs.task == 'smoke' || github.event.inputs.task == 'pilot' || github.event.inputs.task == 'launch' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      VAST_API_KEY: ${{ secrets.VAST_API_KEY }}
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      # The credential a RENTED community host is given, forwarded in cleartext by _vast_onstart.
      # Scoped to the lane prefixes + six S3 actions a leg needs (s3_scoped_policy.py). Unset until
      # trimcrae creates the vast-leg-s3 user -> gpu_backend falls back to the broad key above, which
      # is why lanes in flight kept running. Runbook: research/compute/scoped-s3-credential-runbook.md
      VAST_S3_ACCESS_KEY_ID: ${{ secrets.VAST_S3_ACCESS_KEY_ID }}
      VAST_S3_SECRET_ACCESS_KEY: ${{ secrets.VAST_S3_SECRET_ACCESS_KEY }}
      VAST_S3_SCOPED_STS: ${{ vars.VAST_S3_SCOPED_STS }}
      AWS_DEFAULT_REGION: us-east-2
      GIT_BRANCH: ${{ github.ref_name }}
      VAST_IMAGE: ${{ github.event.inputs.vast_image }}
      VAST_CKPT_BUCKET: ${{ github.event.inputs.vast_ckpt_bucket }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Submit the Vast instance(s)
        run: |
          set -eo pipefail
          # boto3 is REQUIRED here, not optional: the launcher lists S3 to skip legs that are already
          # done BEFORE renting anything. Without it completed_leg_ids() takes its ImportError branch,
          # returns an empty skip list, and every leg is rented — which is exactly what happened on
          # 2026-07-25, paying for a fresh 4090 to rediscover that the apo leg had finished hours
          # earlier. The fallback is right (never block a launch on a listing failure); the missing
          # dependency was not.
          python -m pip install -q boto3
          MODE="${{ github.event.inputs.task }}"
          [ "$MODE" = "launch" ] && MODE="full"
          python research/modalities/protfep_vast_launch.py \
            --mode "$MODE" --n-replicas "${{ github.event.inputs.n_replicas || '3' }}"
          echo "Submitted. Poll with task=collect (leg JSONs + phase + log tail, reduce, reap)."

  collect:
    if: ${{ github.event.inputs.task == 'collect' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      VAST_API_KEY: ${{ secrets.VAST_API_KEY }}
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      # The credential a RENTED community host is given, forwarded in cleartext by _vast_onstart.
      # Scoped to the lane prefixes + six S3 actions a leg needs (s3_scoped_policy.py). Unset until
      # trimcrae creates the vast-leg-s3 user -> gpu_backend falls back to the broad key above, which
      # is why lanes in flight kept running. Runbook: research/compute/scoped-s3-credential-runbook.md
      VAST_S3_ACCESS_KEY_ID: ${{ secrets.VAST_S3_ACCESS_KEY_ID }}
      VAST_S3_SECRET_ACCESS_KEY: ${{ secrets.VAST_S3_SECRET_ACCESS_KEY }}
      VAST_S3_SCOPED_STS: ${{ vars.VAST_S3_SCOPED_STS }}
      AWS_DEFAULT_REGION: us-east-2
      BUCKET: ${{ github.event.inputs.vast_ckpt_bucket }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Status board + anti-idle reap
        env:
          # Reachable from CI on purpose: the full record is what identified the create/start race
          # (min_bid vs our price is the field that separates "outbid" from "broken"), and needing a
          # commit to switch it on cost a round trip in the middle of a live diagnosis.
          PROTFEP_FORENSIC: ${{ github.event.inputs.forensic == 'true' && '1' || '0' }}
        run: |
          set -eo pipefail
          python -m pip install -q boto3
          python research/modalities/protfep_vast_launch.py --collect 2>&1 | tee /tmp/board.txt
      - name: Reduce to verdict + measured price
        run: |
          set -eo pipefail
          B="${BUCKET:-sagemaker-us-east-2-646605541856}"
          ARGS=""
          [ -n "${{ github.event.inputs.hourly_usd }}" ] && ARGS="--hourly-usd ${{ github.event.inputs.hourly_usd }}"
          # The full JSON goes to the FILE, which is committed below. Echoing ~45 lines of it into the
          # log every poll pushed the status board — the part a monitor actually reads — out of the
          # log tail, so each check cost a bigger and bigger log fetch to see less and less.
          python research/modalities/protfep_reduce.py \
            --source "s3://${B}/protfep-benchmark" \
            --out research/modalities/protfep-benchmark-result.json $ARGS > /dev/null
      - name: Commit the reduction into the branch
        run: |
          set -eo pipefail
          git config user.name "Claude"; git config user.email "noreply@anthropic.com"
          # STAGE FIRST, then test the INDEX. `git diff --quiet -- <path>` compares the working tree
          # against HEAD for TRACKED files only, and silently reports "no change" for a file git has
          # never seen. This file had never been committed, so every collect since the lane was built
          # printed "no change to commit" and threw the reduction away — including the run that
          # produced the pilot's ddG, which survived only in a CI log. An artifact-publishing step
          # must test the index, which knows about new files.
          git add research/modalities/protfep-benchmark-result.json
          if ! git diff --cached --quiet -- research/modalities/protfep-benchmark-result.json; then
            git commit -m "5a-KS: capture protein-mutation FEP benchmark reduction from Vast legs"
            git push origin HEAD:${{ github.ref_name }}
          else
            echo "no change to commit"
          fi

      - name: Summary LAST
        run: |
          set -eo pipefail
          # A CI log is read from its TAIL. Whatever a monitor needs must therefore be the last thing
          # printed, not the first — the per-instance detail above scrolls out of view exactly when a
          # run gets interesting. Same lesson the congeneric s1f lane wrote down.
          echo "================ BOARD ================"
          cat /tmp/board.txt
          echo "================ VERDICT + PRICE ================"
          python - <<'PY'
          import json
          d = json.load(open("research/modalities/protfep-benchmark-result.json"))
          v, p = d["verdict"], d.get("price", {})
          print("qualified:", v.get("qualified"), "|", v.get("reason", ""))
          for name, r in (d.get("per_benchmark") or {}).items():
              if not r:
                  print(f"  {name}: no complete ddG yet")
                  continue
              sd = r.get("ddg_sd_kcal")
              print(f"  {name}: ddG = {r['ddg_bind_kcal']:.2f}"
                    + (f" +/- {sd:.2f}" if sd else " (single replicate, no error bar)")
                    + f"  [complex {r['n_complex']}, apo {r['n_apo']}]")
          if p.get("priced"):
              print(f"price: {p['n_legs_measured']} leg(s), {p['gpu_hours_per_leg']['mean']} GPU-h/leg, "
                    f"${p['usd_per_benchmark_leg']}/leg @ ${p['assumed_hourly_usd']}/h "
                    f"-> PROJECTED wedge ${p.get('projected_wedge_usd_3rep')} (3 rep)")
              if p.get("legs_excluded_as_pre_fix"):
                  print(f"  (excluded from the rate: {p['legs_excluded_as_pre_fix']})")
          else:
              # A withheld price must SAY it is withheld and why. Printing nothing reads as "not
              # computed yet" when the real state may be "computed and deliberately refused".
              print(f"price: WITHHELD — {p.get('reason', 'no reason recorded')}")
          PY

  rebid:
    # Raise the bid on a lane instance that cannot get a GPU, bounded by MEASURED $/ns rather than by
    # a fixed multiple of the floor. A queued interruptible instance is sometimes waiting on an
    # auction rather than on the machine, and the useful question is not "how much more" but "how
    # much more is still cheaper than renting the alternative" — which the merged $/ns work answers.
    if: ${{ github.event.inputs.task == 'rebid' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      VAST_API_KEY: ${{ secrets.VAST_API_KEY }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Rebid non-running instances up to their value ceiling
        run: |
          set -eo pipefail
          ARGS=""
          [ -n "${{ github.event.inputs.rebid_mult }}" ] && ARGS="--rebid-mult ${{ github.event.inputs.rebid_mult }}"
          python research/modalities/protfep_vast_launch.py --rebid $ARGS

  stop:
    if: ${{ github.event.inputs.task == 'stop' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      VAST_API_KEY: ${{ secrets.VAST_API_KEY }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Destroy every protfep-bench Vast instance (anti-idle backstop)
        run: python research/modalities/protfep_vast_launch.py --stop
