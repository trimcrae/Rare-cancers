name: GCP GPU — card throughput probe (L4 / T4 / P100 / V100, WIF keyless)

# ★ WHAT THIS MEASURES AND WHY THE OLD VERSION COULD NOT ANSWER IT.
#
# STRATEGY.md Open decision 5 and gcp-gpu-facts.md §1b both carry a SPEC-DERIVED table saying a P100 is faster
# than an L4 *and* +18 % better on science-per-dollar, and a T4 is 2.2× better on science-per-dollar — every row
# marked "do not plan on these rows yet". The bandwidth heuristic behind them is validated on ONE pair (L4 vs
# RTX 4090) where bandwidth and FP32 move together, so it cannot tell bandwidth-bound from compute-bound, and
# T4-vs-L4 is exactly the discriminating case. This workflow settles it by measurement.
#
# Two things had to be built, both recorded here because each was a silent wrong-answer generator:
#
#  1. ACCELERATOR PARAMETERISATION. This file HARDCODED `nvidia-tesla-t4` for any `n1-*` machine and offered
#     two machine choices, and gpu-ternary-fep-gcp.yml pins L4-only `g2-*` with no `--accelerator` at all. P100
#     and V100 were unreachable from either. ⚠ An `n1-*` created with NO accelerator boots a CPU-only VM that
#     runs the bench happily on the CPU platform and prints a real-looking ns/day — so the card and the machine
#     are derived TOGETHER from one `card` input (`gcp_card_bench.CARDS`), and `OPENMM_REQUIRE_CUDA=1` makes a
#     CPU fallback raise instead of measure.
#
#  2. SYSTEM SIZE. `gpu_md_bench.py` defaults to BENCH_EDGE_NM=7.1 ≈ 36k atoms and this workflow never passed
#     the variable, so every GCP bench ever run here measured a 36k box. The lane's real ternary system is
#     141,968 particles. A 36k probe answers a different question with the same confident-looking number.
#     `gcp_card_bench.edge_nm_for_particles` derives the edge from the repo's one exact anchor
#     (vast_bench_sweep: 9.5 nm ↔ 84,534 particles) — 11.29 nm ≈ 141,887 particles, within 0.06 % of the real
#     system. BOTH sizes run in one boot: the ternary size FIRST (so a VM that dies early still yields the
#     decision-relevant number) and 9.5 nm second, which is the protocol of
#     `vast_cost_model.MEASURED_NS_PER_DAY_84K` and makes a GCP card commensurable with every Vast card.
#
# ★ TEARDOWN. GPUS_ALL_REGIONS=1 means an orphan here blocks EVERY GCP GPU job on the account, and a GCP VM
# CANNOT DELETE ITSELF — the in-VM EXIT trap runs and GCE refuses it (gcp-gpu-facts.md §6). `gcp_launch_guard`
# closes that for DETACHED ternary legs by requiring a watch entry. This probe is not detached and needs no
# watch entry, because it carries two INDEPENDENT reapers neither of which is the VM itself:
#   (a) the `if: always()` teardown step below — the control plane, same place the key lives; and
#   (b) `--max-run-duration` + `--instance-termination-action=DELETE` at CREATE, which is GCE itself and
#       survives the runner being cancelled, timing out or crashing. Per gcp-gpu-facts.md §6c(3) a non-leg's
#       cap IS its only guaranteed bound, so it is set SHORT (well under the CI timeout's successor) rather
#       than inheriting a leg's 72 h.
# The in-VM trap is kept as best-effort only and its failure is expected, not a bug.
#
# ★ PRE-FLIGHT REFUSAL. It also refuses to create anything unless the project is genuinely GPU-free
# (GPUS_ALL_REGIONS usage 0 AND no instances listed — the zombie discriminator of gcp-gpu-facts.md §2). Two
# GPU jobs cannot coexist under the 1-GPU cap, and a probe that queues behind a live leg would report a
# capacity failure as a card result.

on:
  workflow_dispatch:
    inputs:
      card:         { description: "l4 (control) | t4 | p100 | v100", default: "l4", required: true,
                      type: choice, options: [l4, t4, p100, v100] }
      provisioning: { description: "standard (on-demand; the probe default — a preemption mid-probe wastes the whole boot) | spot", default: "standard", required: false,
                      type: choice, options: [standard, spot] }
      zone:         { description: "preferred us-central1 zone; the others are still tried in the card's own order. NEVER another region — there is no quota there (gcp-gpu-facts.md §5)", default: "us-central1-a", required: false }
      edges:        { description: "comma-separated BENCH_EDGE_NM list. Default = ternary-sized (141,887 particles) then the 84,534-particle Vast anchor.", default: "", required: false }
      commit:       { description: "1 = commit the measurement into research/modalities/gcp-card-bench.json on the dispatched ref", default: "1", required: false }

permissions:
  id-token: write
  contents: write

# ONE GPU, PROJECT-WIDE (gcp-gpu-facts.md §1). Every card shares one group so two probes can never overlap;
# the pre-flight refusal covers overlap with the ternary lane, which has its own group and cannot share ours.
concurrency:
  group: gcp-gpu-bench
  cancel-in-progress: false

jobs:
  gcp-bench:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    env:
      CARD: ${{ github.event.inputs.card || 'l4' }}
      PROVISIONING: ${{ github.event.inputs.provisioning || 'standard' }}
      ZONE_PREF: ${{ github.event.inputs.zone || 'us-central1-a' }}
      EDGES_IN: ${{ github.event.inputs.edges || '' }}
      DO_COMMIT: ${{ github.event.inputs.commit || '1' }}
      # The create-time cap: GCE's own reaper, the only one that survives this runner dying. Sized to be
      # comfortably longer than a probe (~15-20 min) and comfortably shorter than anything worth worrying
      # about. ONE HOME — every message below interpolates it rather than restating a number.
      MAXRUN_S: '3600'
    steps:
      - uses: actions/checkout@v4

      - name: Resolve the card -> machine + accelerator (derived, never typed)
        run: |
          set -eo pipefail
          EDGES="${EDGES_IN}"
          if [ -z "$EDGES" ]; then
            EDGES=$(python3 -c "import sys; sys.path.insert(0,'research/modalities'); import gcp_card_bench as g; print(g.DEFAULT_EDGES)")
          fi
          python3 research/modalities/gcp_card_bench.py --emit-env \
            --card "$CARD" --zone "$ZONE_PREF" --edges "$EDGES" | tee /tmp/env.txt
          cat /tmp/env.txt >> "$GITHUB_ENV"

      - name: ECHOED DISPATCH ENV — what this run actually received
        # ⚠ tests/test_workflow_dispatch_input_cap.py records that a workflow over GitHub's dispatch-input cap
        # delivers EMPTY values silently, and every `-f` flag is discarded. That failure is invisible at
        # runtime unless something prints what arrived, so this prints it. Read this block against what you
        # dispatched BEFORE trusting any number this run produces.
        run: |
          echo "=== ECHOED DISPATCH ENV ==="
          echo "  raw inputs : card='${{ github.event.inputs.card }}' provisioning='${{ github.event.inputs.provisioning }}' zone='${{ github.event.inputs.zone }}' edges='${{ github.event.inputs.edges }}' commit='${{ github.event.inputs.commit }}'"
          echo "  CARD        = $CARD ($BENCH_GCE_NAME, ${BENCH_VRAM_GB} GB)"
          echo "  MACHINE     = $MACHINE"
          echo "  ACCELERATOR = ${ACCEL:-<built into the machine type>}"
          echo "  BENCH_EDGES = $BENCH_EDGES   (dt ${BENCH_DT_FS} fs, ${BENCH_BLOCKS} blocks, ${BENCH_TARGET_S}s target, ${BENCH_WARMUP} warmup)"
          echo "  PROVISION   = $PROVISIONING ; ZONES = $ZONES ; max-run-duration = ${MAXRUN_S}s"
          if [ -z "${{ github.event.inputs.card }}" ] && [ -n "$GITHUB_EVENT_NAME" ]; then
            echo "::warning title=NO CARD INPUT ARRIVED::the dispatch delivered an empty card; this run is on the DEFAULT ($CARD). If you passed -f card=..., the input was discarded."
          fi

      - id: auth
        name: Authenticate to GCP (keyless, WIF)
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: projects/878095411563/locations/global/workloadIdentityPools/github-pool/providers/github-provider
          service_account: gpu-runner@project-a7ebde30-e2ed-4b8d-9a9.iam.gserviceaccount.com

      - name: Set up gcloud
        uses: google-github-actions/setup-gcloud@v2

      - name: Resolve project
        run: |
          set -eo pipefail
          PROJECT=project-a7ebde30-e2ed-4b8d-9a9
          echo "PROJECT=$PROJECT" >> "$GITHUB_ENV"
          gcloud config set project "$PROJECT"
          echo "authenticated as: $(gcloud config get-value account 2>/dev/null)"

      - name: PRE-FLIGHT — refuse unless the single GPU is genuinely free
        # The zombie discriminator of gcp-gpu-facts.md §2, applied as a GATE rather than a readout: something
        # holding the one GPU means this probe cannot run beside it, and creating anyway would fail on quota
        # in a way indistinguishable from a capacity stockout afterwards.
        #
        # ★★ A GATE THAT ERRORS MUST NEVER RENDER LIKE A GATE THAT REFUSED (measured here, 2026-07-31, run
        # 30631788507). The first version of this step ran under `set -eo pipefail` and read the global cap
        # with `gcloud compute project-info describe`. The step exited non-zero with NO refusal annotation and
        # the probe never provisioned — and the GPU was demonstrably free at that moment (the same run's
        # teardown step listed ZERO instances, and gcp-reap-vms run 30631014002 eleven minutes earlier said
        # `no instances in project`). So the failure was the READER, not the condition. Two consequences,
        # both applied below:
        #   * `set +e` and an explicit rc for every probe, so a permission/API failure is REPORTED as one
        #     instead of aborting the step and looking like a refusal. Only the explicit gate exits 1.
        #   * the gate rests on the checks that are PROVEN to work in this project — `instances list` (the
        #     definitive zombie test of facts §2: quota can only be held by an instance) and the per-type
        #     `regions describe` row, both of which returned real values in run 30631014002. The global
        #     `project-info` row is printed as a readout with its rc, so the next run says plainly whether
        #     gpu-runner@ may read it, rather than leaving it a belief.
        run: |
          set +e
          echo "=== GPUS_ALL_REGIONS (the binding cap) — readout, with its exit code ==="
          GLOB=$(gcloud compute project-info describe --flatten="quotas[]" \
                   --filter="quotas.metric=GPUS_ALL_REGIONS" \
                   --format="value(quotas.metric,quotas.limit,quotas.usage)" 2>/tmp/pierr)
          PIRC=$?
          if [ "$PIRC" = 0 ] && [ -n "$GLOB" ]; then
            echo "  $GLOB"
            USAGE=$(printf '%s' "$GLOB" | awk '{print $3}')
          else
            USAGE=""
            echo "  <unreadable: rc=$PIRC> $(head -2 /tmp/pierr 2>/dev/null | tr '\n' ' ')"
            echo "::warning title=GLOBAL QUOTA UNREADABLE::gcloud compute project-info describe returned rc=$PIRC / empty for GPUS_ALL_REGIONS, so the global cap could not be read directly. This does NOT block the probe: quota can only be held by an INSTANCE (gcp-gpu-facts.md §2), and the instance list plus the per-type regional row below are the checks this gate actually rests on."
          fi
          echo "=== per-type quota for the requested card (us-central1) ==="
          REG=$(gcloud compute regions describe us-central1 --flatten="quotas[]" \
                  --format="value(quotas.metric, quotas.limit, quotas.usage)" 2>/tmp/rgerr)
          RGRC=$?
          TYPE_ROW=$(printf '%s\n' "$REG" | awk -v m="$QUOTA_METRIC" '$1==m {print $0}')
          echo "  rc=$RGRC  ${TYPE_ROW:-<no row for $QUOTA_METRIC>}"
          TYPE_USAGE=$(printf '%s' "$TYPE_ROW" | awk '{print $3}')
          echo "=== instances in project (any name, any zone) — the definitive zombie test ==="
          INST=$(gcloud compute instances list --format="value(name,zone,status)" 2>/tmp/ilerr)
          ILRC=$?
          echo "  rc=$ILRC"
          printf '%s\n' "${INST:-  (none)}"
          BAD=""
          if [ "$ILRC" != 0 ]; then
            BAD="the instance list itself failed (rc=$ILRC: $(head -1 /tmp/ilerr 2>/dev/null))"
          elif [ -n "$INST" ]; then
            BAD="an instance exists: $(printf '%s' "$INST" | tr '\n' ';')"
          else
            case "$USAGE" in ""|0|0.0|0.00) : ;; *) BAD="GPUS_ALL_REGIONS usage=$USAGE" ;; esac
            case "$TYPE_USAGE" in ""|0|0.0|0.00) : ;; *) BAD="${QUOTA_METRIC} usage=$TYPE_USAGE" ;; esac
          fi
          if [ -n "$BAD" ]; then
            echo "::error title=REFUSING TO PROVISION — THE SINGLE GPU IS NOT FREE::$BAD. gcp-gpu-facts.md §1: at most ONE GPU concurrently across ALL regions and types, so this probe cannot run beside whatever holds it, and creating anyway would fail on quota in a way indistinguishable from a capacity stockout. Wait for the holder to finish, or reap it deliberately with gcp-reap-vms.yml, then re-dispatch."
            exit 1
          fi
          echo "::notice title=GPU IS FREE::no instances in the project, ${QUOTA_METRIC} usage=${TYPE_USAGE:-0}, GPUS_ALL_REGIONS usage=${USAGE:-<unreadable>} — safe to provision a ${CARD} probe."

      - name: Price probe ($0, best-effort) — Cloud Billing Catalog instead of typed list rates
        # Best-effort ON PURPOSE. The catalog needs cloudbilling.googleapis.com enabled and its SKU
        # descriptions are free text; an unavailable or AMBIGUOUS match must degrade to the labelled list
        # rates in gcp_card_bench.LIST_PRICE_USD_PER_H rather than fail a probe that is otherwise fine, and
        # must never silently substitute a guess (parse_skus treats ambiguity as "no price").
        continue-on-error: true
        run: |
          set +e
          TOKEN=$(gcloud auth print-access-token 2>/tmp/toker)
          TRC=$?
          echo "access token: rc=$TRC len=${#TOKEN} $( [ "$TRC" != 0 ] && head -1 /tmp/toker )"
          GCP_ACCESS_TOKEN="$TOKEN" python3 research/modalities/gcp_card_bench.py --fetch-prices
          exit 0

      - name: Provision the GPU VM and run the probe
        run: |
          set -eo pipefail
          VM="gcp-bench-${CARD}-${GITHUB_RUN_ID}"
          echo "VM=$VM" >> "$GITHUB_ENV"
          IMG_FAMILY=$(gcloud compute images list --project=deeplearning-platform-release \
            --filter="family~'^common-cu'" --format="value(family)" --sort-by=~creationTimestamp 2>/dev/null | head -1 || true)
          [ -z "$IMG_FAMILY" ] && { echo "::error::no DLVM CUDA image family"; exit 1; }
          echo "image=$IMG_FAMILY machine=$MACHINE accel=${ACCEL:-<built-in>} card=$CARD edges=$BENCH_EDGES"

          # ---- startup script -------------------------------------------------------------------------
          # OpenMM via Miniforge+mamba (conda-forge's CUDA build auto-matches the driver via the __cuda
          # virtual package). Unchanged from the version this lane has already booted successfully — a
          # first-ever P100/V100 boot is not the place to also debut a new environment path.
          B64=$(base64 -w0 research/modalities/gpu_md_bench.py)
          cat > /tmp/startup.sh <<SS
          #!/bin/bash
          exec > >(tee /var/log/bench.log) 2>&1
          set +e
          # BEST-EFFORT ONLY. GCE refuses this call for the default compute SA (gcp-gpu-facts.md §6), so the
          # real reapers are the runner-side teardown and --max-run-duration. Kept because when it does work
          # it frees the GPU minutes earlier, and its failure is expected rather than a fault.
          _self_delete() {
            local _N _Z
            _N=\$(curl -s -H "Metadata-Flavor: Google" http://metadata.google.internal/computeMetadata/v1/instance/name)
            _Z=\$(curl -s -H "Metadata-Flavor: Google" http://metadata.google.internal/computeMetadata/v1/instance/zone | awk -F/ '{print \$NF}')
            echo "=== SELF-DELETE (trap on EXIT, best-effort): \$_N in \$_Z ==="
            gcloud compute instances delete "\$_N" --zone="\$_Z" --quiet || echo "self-delete refused/absent (expected — facts §6)"
          }
          trap _self_delete EXIT
          echo "=== BENCHPHASE boot \$(date -u) card=$CARD machine=$MACHINE edges=$BENCH_EDGES ==="
          echo "=== IN-VM ENV: CARD=$CARD MACHINE=$MACHINE ACCEL='${ACCEL:-builtin}' EDGES=$BENCH_EDGES DT=$BENCH_DT_FS BLOCKS=$BENCH_BLOCKS TARGET_S=$BENCH_TARGET_S ==="
          echo "=== BENCHPHASE driver ==="
          for i in \$(seq 1 40); do nvidia-smi && break || { echo "waiting for GPU driver..."; sleep 10; }; done
          GPUNAME=\$(nvidia-smi --query-gpu=name --format=csv,noheader 2>/dev/null | head -1)
          nvidia-smi --query-gpu=name,memory.total,driver_version,compute_cap --format=csv || true
          echo "###BENCHCARD### \$GPUNAME ###END###"
          echo "=== BENCHPHASE conda ==="
          curl -fsSL -o /tmp/mf.sh https://github.com/conda-forge/miniforge/releases/latest/download/Miniforge3-Linux-x86_64.sh || echo "miniforge download FAILED"
          bash /tmp/mf.sh -b -p /tmp/mf 2>&1 | tail -5
          /tmp/mf/bin/mamba install -y -p /tmp/mf openmm 2>&1 | tail -15
          PY=/tmp/mf/bin/python
          [ -x "\$PY" ] || PY=\$(command -v python3)
          echo "bench python: \$PY (\$(\$PY --version 2>&1))"
          IMPORT=\$(\$PY -c "import openmm; print('openmm', openmm.version.version, 'platforms', [openmm.Platform.getPlatform(i).getName() for i in range(openmm.Platform.getNumPlatforms())])" 2>&1)
          echo "import: \$IMPORT"
          if ! echo "\$IMPORT" | grep -q "^openmm "; then
            for k in \$(seq 1 6); do echo "###BENCHRESULT### BENCH_RESULT tag=${CARD}_noopenmm status=NOOPENMM edge_nm=0 ###END###"; sleep 3; done
            echo "###BENCHDONE### NOOPENMM ###END###"; exit 1
          fi
          echo "$B64" | base64 -d > /tmp/gpu_md_bench.py
          # SIZES RUN LARGEST-FIRST: the ternary-sized arm is the decision-relevant one, so it must be the
          # measurement that survives a VM that dies mid-probe.
          for E in \$(echo "$BENCH_EDGES" | tr ',' ' '); do
            echo "=== BENCHPHASE measure edge=\$E ==="
            OUT=\$(BENCH_EDGE_NM=\$E BENCH_TAG=${CARD}_e\$E BENCH_DT_FS=$BENCH_DT_FS \
                   BENCH_BLOCKS=$BENCH_BLOCKS BENCH_TARGET_S=$BENCH_TARGET_S BENCH_WARMUP=$BENCH_WARMUP \
                   OPENMM_REQUIRE_CUDA=1 \$PY /tmp/gpu_md_bench.py 2>&1)
            echo "\$OUT" | grep -aE "\[bench\]|BENCH_RESULT|Error|error" | tail -20
            LINE=\$(echo "\$OUT" | grep "BENCH_RESULT" | tail -1)
            [ -z "\$LINE" ] && LINE="BENCH_RESULT tag=${CARD}_e\$E status=NORESULT"
            for k in \$(seq 1 4); do echo "###BENCHRESULT### \$LINE edge_nm=\$E ###END###"; sleep 2; done
          done
          for k in \$(seq 1 6); do echo "###BENCHDONE### card=$CARD gpu=\$GPUNAME ###END###"; sleep 3; done
          echo "=== BENCHPHASE done ==="
          SS

          # PROVISIONING. --instance-termination-action is REQUIRED whenever --max-run-duration is set, for
          # STANDARD as well as SPOT (gcp-gpu-facts.md §3) — omitting it on the standard branch is what once
          # made every on-demand create fail request-validation and get mislabelled "stocked out" for months.
          case "$PROVISIONING" in
            spot)     PROV_FLAGS="--provisioning-model=SPOT --instance-termination-action=DELETE --max-run-duration=${MAXRUN_S}s" ;;
            *)        PROV_FLAGS="--provisioning-model=STANDARD --instance-termination-action=DELETE --max-run-duration=${MAXRUN_S}s" ;;
          esac

          CREATED=""
          for Z in $ZONES; do
            echo "--- trying zone $Z ($MACHINE ${ACCEL:-builtin}) ---"
            if gcloud compute instances create "$VM" \
                --zone="$Z" --machine-type="$MACHINE" $ACCEL \
                $PROV_FLAGS \
                --maintenance-policy=TERMINATE --no-restart-on-failure \
                --scopes=cloud-platform \
                --labels=bench-card="$CARD",bench-run="$GITHUB_RUN_ID",bench-kind=cardprobe \
                --image-family="$IMG_FAMILY" --image-project=deeplearning-platform-release \
                --boot-disk-size=75GB \
                --metadata-from-file=startup-script=/tmp/startup.sh 2>/tmp/cerr; then
              ZONE="$Z"; CREATED=1; echo "ZONE=$Z" >> "$GITHUB_ENV"; break
            fi
            # ECHO THE REAL ERROR (gcp-gpu-facts.md §4): labelling every non-quota failure "stocked out" is
            # what masked a malformed request as a capacity problem. Case-insensitive — gcloud prints ERROR:.
            #
            # ★ AND AS AN ANNOTATION, NOT ONLY AS AN ECHO (2026-07-31). On the first T4 attempt these lines
            # existed and were still unusable: three later steps each re-print a ~35-line env block, so the
            # one line naming the cause sat ~150 lines above the end of the log. §4's rule "read the real
            # error before concluding capacity" is only followed if the error is somewhere anyone reads.
            ERRTXT=$(grep -iaE "error|exhausted|not available|unsupported|invalid|quota|required|termination|does not have enough" /tmp/cerr | head -4 | tr '\n' ' ')
            [ -z "$ERRTXT" ] && ERRTXT=$(tail -3 /tmp/cerr | tr '\n' ' ')
            echo "  zone $Z FAILED: $ERRTXT"
            echo "::warning title=ZONE $Z CREATE FAILED ($CARD)::$ERRTXT"
            # A create that returns non-zero can still have LEFT A VM (half-provisioned, or created then
            # failed to start) — observed on the first T4 attempt, where gcp-bench-t4-30633051736 existed in
            # us-central1-b in STOPPING state while every zone was reporting failure.
            # $ZONE is only exported on success, so the teardown step would not know where to look.
            gcloud compute instances delete "$VM" --zone="$Z" --quiet 2>/dev/null && echo "  (removed a partially-created $VM in $Z)" || true
          done
          if [ -z "$CREATED" ]; then
            echo "::error title=NO CAPACITY FOR $CARD IN ANY us-central1 ZONE::tried $ZONES with machine=$MACHINE accel='${ACCEL:-builtin}'. Read the per-zone errors above BEFORE concluding capacity — a malformed request looks identical to a stockout in a summary line (gcp-gpu-facts.md §4). us-central1 is the only region with quota (§5), so there is no other region to try."
            exit 1
          fi
          echo "VM $VM ($CARD on $MACHINE) created in $ZONE, cap ${MAXRUN_S}s; polling serial console…"

          # PROGRESS POLLING, not a liveness ping (CLAUDE.md §4): each pass prints the phase the VM has
          # actually reached and how long it has been there, so a stall is visible in the log rather than
          # inferred from silence at the end.
          RESULTS=""; DONE=""; LASTPHASE=""; PHASE_T=$(date +%s); T0=$(date +%s)
          for i in $(seq 1 80); do
            OUT=$(gcloud compute instances get-serial-port-output "$VM" --zone="$ZONE" 2>/dev/null || true)
            PHASE=$(printf '%s' "$OUT" | grep -aoE 'BENCHPHASE [a-z]+( edge=[0-9.]+)?' | tail -1 || true)
            NOW=$(date +%s)
            if [ "$PHASE" != "$LASTPHASE" ]; then LASTPHASE="$PHASE"; PHASE_T=$NOW; fi
            NRES=$(printf '%s' "$OUT" | grep -acE '###BENCHRESULT###' || true)
            echo "  [t+$(( (NOW-T0)/60 ))m] phase='${PHASE:-<no serial yet>}' (held $(( (NOW-PHASE_T)/60 ))m) result-markers=$NRES"
            DONE=$(printf '%s' "$OUT" | grep -aoE '###BENCHDONE### .* ###END###' | tail -1 || true)
            [ -n "$DONE" ] && break
            # ★ BAIL WHEN THE VM IS GONE, rather than polling a corpse for the rest of the window. A deleted
            # or TERMINATED instance can never emit another marker, so continuing is pure dead wall clock —
            # and worse, it looks identical in the log to a probe that is still working.
            ST=$(gcloud compute instances describe "$VM" --zone="$ZONE" --format="value(status)" 2>/dev/null || echo GONE)
            case "${ST:-GONE}" in
              RUNNING|PROVISIONING|STAGING|REPAIRING) : ;;
              *) echo "::warning title=VM VANISHED MID-PROBE::$VM in $ZONE is now '${ST:-GONE}' with no result marker. Not polling further."; break ;;
            esac
            sleep 25
          done
          printf '%s' "$OUT" > /tmp/serial.txt
          printf '%s' "$OUT" | grep -aoE '###BENCHRESULT### .* ###END###' \
            | sed -E 's/^###BENCHRESULT### //; s/ ###END###$//' | sort -u > /tmp/results.txt || true
          echo "=== serial highlights ==="
          printf '%s' "$OUT" | grep -aE "BENCHPHASE|BENCHCARD|import:|\[bench\]|BENCH_RESULT|nvidia-smi|Tesla|NVIDIA" | tail -60 || true
          echo "=== result lines ==="
          cat /tmp/results.txt || true
          if [ ! -s /tmp/results.txt ]; then
            echo "::warning::no result marker — serial tail 120:"; printf '%s' "$OUT" | tail -120 || true
            echo "::error title=PROBE PRODUCED NO MEASUREMENT::$CARD on $MACHINE in $ZONE"; exit 1
          fi

      - name: Teardown (always — the control plane is the only thing that can stop the meter)
        if: always()
        run: |
          if [ -n "$VM" ] && [ -n "$ZONE" ]; then
            gcloud compute instances delete "$VM" --zone="$ZONE" --quiet 2>&1 | tail -2 && echo "deleted $VM" || echo "delete no-op"
          fi
          # LABEL SWEEP. The delete above needs $ZONE, which is only exported when a create SUCCEEDS — so a
          # VM left behind by a create that failed after allocating has no zone to delete it by. The create
          # stamps bench-run=<run id>, so this finds THIS run's stray wherever it is, and can never touch a
          # ternary leg or another probe. Age is never consulted (gcp-gpu-facts.md §6b): identity is.
          STRAY=$(gcloud compute instances list --filter="labels.bench-run=${GITHUB_RUN_ID}" \
                    --format="value(name,zone)" 2>/dev/null || true)
          if [ -n "$STRAY" ]; then
            echo "::warning title=STRAY VM FROM THIS RUN::$STRAY — deleting by label"
            printf '%s\n' "$STRAY" | while read -r N Z; do
              [ -n "$N" ] && gcloud compute instances delete "$N" --zone="$Z" --quiet 2>&1 | tail -1
            done
          fi
          echo "=== instances remaining in project ==="
          gcloud compute instances list --format="value(name,zone,status)" 2>/dev/null || echo "  (none / list failed)"
          echo "=== GPUS_ALL_REGIONS after teardown ==="
          gcloud compute project-info describe --flatten="quotas[]" \
            --filter="quotas.metric=GPUS_ALL_REGIONS" \
            --format="value(quotas.metric,quotas.limit,quotas.usage)" 2>/dev/null || true

      - name: Record the measurement (derived, never typed)
        if: always()
        run: |
          set +e
          [ -s /tmp/results.txt ] || { echo "no results to record"; exit 0; }
          # Re-echo the RAW lines here, at the end of the log. They are the only primary record of a
          # measurement, and on 2026-07-31 the commit step silently failed to land the artifact — at which
          # point the numbers survived only in a section of the log 150 lines above the failure.
          echo "=== RAW BENCH_RESULT LINES (primary record) ==="
          cat /tmp/results.txt
          while IFS= read -r LINE; do
            [ -z "$LINE" ] && continue
            E=$(printf '%s' "$LINE" | grep -oE 'edge_nm=[0-9.]+' | tail -1 | cut -d= -f2)
            python3 research/modalities/gcp_card_bench.py \
              --record "$LINE" --card "$CARD" --edge-nm "${E:-0}" \
              --run-id "$GITHUB_RUN_ID" --zone "${ZONE:-}" --machine "$MACHINE" --provisioning "$PROVISIONING"
            touch /tmp/recorded
          done < /tmp/results.txt
          python3 research/modalities/gcp_card_bench.py --report

      - name: Commit the artifact
        if: always()
        run: |
          set +e
          [ "$DO_COMMIT" = "1" ] || { echo "commit disabled"; exit 0; }
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          # ⚠ ONE PATHSPEC PER `git add`, AND NEVER 2>/dev/null (measured, run 30632062766, 8:56 AM ET
          # 2026-07-31). `git add a.json b.json` is ATOMIC: with b.json absent it fails with "pathspec did
          # not match any files" and stages NEITHER — so the L4 measurement was recorded, reported, and then
          # silently not committed, and the step reported "nothing to commit" as if there had been nothing.
          # gcp-price-probe.json is written only when the billing catalog succeeds, so the absent-file case
          # is the NORMAL one, not an edge case.
          # ⚠ THIS STEP'S OWN GUARD IS KEPT VERBATIM IN INTENT, and it is the reason this conversion is not a
          # one-liner. "Nothing to publish" is only a PROBLEM when a measurement was actually recorded: a run
          # whose create never succeeded records nothing and legitimately has nothing to commit, and CLAUDE.md
          # §1 is explicit that a guard doing its job and a guard being ignored must not render alike.
          # /tmp/recorded is written by the record step for each admitted line. Handing this to
          # PUBLISH_IF_CHANGED alone would have SILENTLY dropped the distinction — the primitive skips quietly
          # by design, which is right for it and wrong here.
          HAVE=""
          for f in research/modalities/gcp-card-bench.json research/modalities/gcp-price-probe.json; do
            if [ -f "$f" ]; then HAVE="$HAVE $f"; echo "present $f"; else echo "skip $f (not written by this run)"; fi
          done
          if [ -z "$HAVE" ]; then
            [ -f /tmp/recorded ] \
              && echo "::warning title=MEASUREMENT DID NOT LAND::the probe recorded a measurement but neither artifact exists on disk, so nothing was committed. Check the lines above." \
              || echo "nothing to commit (this run recorded no measurement)"
            exit 0
          fi
          # ⛔ ONE HOME FOR THE PUBLISH. Replaces `git pull --rebase --autostash` + push, which on a conflict
          # leaves the repo MID-REBASE so both remaining attempts die on the first's wreckage.
          # ⚠ `gcp-price-probe.json` is written only when the billing catalog succeeds, so ONE-OF-TWO is the
          # NORMAL case — the primitive skips an absent path individually, which is the property the original
          # per-file `git add` loop existed to get (`git add a b` is ATOMIC and stages NEITHER when b is
          # missing; measured, run 30632062766, and it silently dropped an L4 measurement).
          # shellcheck disable=SC2086
          PUBLISH_IF_CHANGED=1 bash research/compute/publish_artifacts.sh "${GITHUB_REF_NAME}" \
            "GCP card probe: ${CARD} @ $BENCH_EDGES nm (run ${GITHUB_RUN_ID})" $HAVE
